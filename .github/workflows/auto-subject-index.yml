name: Auto-update subject indexes

on:
  push:
    branches: ["main"]
    # run when anything in materials changes (including file uploads)
    paths:
      - "materials/**"
      - "scripts/auto_update_subject_indexes.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    # prevent infinite loop: skip commits created by the bot
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update indexes
        run: python3 scripts/auto_update_subject_indexes.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add materials/*/index.md
          git commit -m "chore: auto-update subject indexes"
          git push
