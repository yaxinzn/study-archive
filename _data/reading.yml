- title: "Vreugdenhil (JPE, 2026) - Booms, Busts, and Mismatch in Capital Markets: Evidence from the Offshore Oil and Gas Industry"
  file: "Vreugdenhil_JPE_2026.pdf"
  desc: "This note summarizes the paper, which uses contract data from IHS and Rigzone, well data from the Bureau of Safety and Environmental Enforcement, rig characteristics, day rates, contract durations, utilization, well complexity, lease-bid-based project values, and natural gas prices to study how decentralized offshore drilling capital markets reallocate rigs to wells during booms and busts, identifying sorting and mismatch through a structural search-and-matching model with heterogeneous projects and rigs, partially directed search, endogenous entry, Nash bargaining, contract extensions, and rig-owner outside options, showing that booms raise the option value of waiting, strengthen positive assortative matching between high-efficiency rigs and complex wells, and that better search intermediation could generate large welfare gains mainly through improved match quality."

- title: "Hai & Heckman (JPE, 2026) - The Causal Effects of Youth Cigarette Addiction and Education"
  file: "Hai_Heckman_JPE_2026.pdf"
  desc: "This note summarizes the paper, which uses NLSY97 male respondents born in 1982 or later, linked with cigarette prices, excise taxes, survival data, transfers, earnings, and latent cognitive/noncognitive ability measures, to estimate a dynamic life-cycle model where youth choose smoking, schooling, work, consumption, saving, and borrowing, identifying the reciprocal causal effects of cigarette addiction and education through addiction-stock dynamics, state-year cigarette price variation, ability measurement equations, schooling and smoking moments, net-worth and earnings moments, and policy counterfactuals showing that education reduces later smoking while youth smoking lowers college attendance and human-capital investment."

- title: "Fuhrer (AER, 2000) - Habit Formation in Consumption and Its Implications for Monetary-Policy Models"
  file: "Fuhrer_AER_2000.pdf"
  desc: "This note summarizes the paper, which uses quarterly U.S. macroeconomic data from 1966:1 to 1995:4, including consumption, disposable income, nonconsumption GDP, inflation, the federal funds rate, and commodity prices, to estimate a habit-formation consumption model with key variables such as current consumption, the habit/reference stock, real interest rates, expected income growth, rule-of-thumb income share, habit strength, and habit persistence, identifying the model through VAR-based rational-expectations restrictions, maximum-likelihood estimation, likelihood-ratio tests, impulse responses, and disinflation simulations to show that habit formation helps explain the gradual, hump-shaped response of consumption and inflation to monetary-policy shocks."

- title: "Ellingsen & Mohlin (JPE, 2026) - A Model of Social Duties"
  file: "Ellingsen_Mohlin_JPE_2026.pdf"
  desc: "This note summarizes the paper, which develops and tests a formal model of social duties using theoretical variables such as actions, material payoffs, strict and liberal entitlements, dutifulness, liberal-duty weight, and behindness aversion, and empirically measures duties through Prolific spectator appropriateness ratings and structural estimation on Bruhin, Fehr, and Schunk binary dictator-choice data, identifying moral duties from action classifications, entitlement thresholds, context changes such as lost-wallet and taking-option experiments, and choice patterns that reveal how much individuals sacrifice to satisfy strict or liberal duties."

- title: "Engelberg, Guzman, Lu, and Mullins (JF, 2026) - Partisan Entrepreneurship"
  file: "Engelberg_Guzman_Lu_Mullins_JF_2026.pdf"
  desc: "This note summarizes the paper, which uses Startup Cartography business-registration data linked to L2 voter files, county-level startup and Census Business Dynamics Statistics data, and survey/performance data from Bloomberg, Gallup, Reference USA, and Experian to study how political identity affects entrepreneurship, measuring variables such as firm-starting, party affiliation, presidential and gubernatorial political mismatch, voter activeness, donor status, firm legal form, startup quality, county partisanship, firm entry, exits, deaths, job creation, expectations, sales, and employment, and identifying effects through individual-level election event studies, county-by-year fixed effects, presidential and governor mismatch regressions, political-activeness interactions, county-level event studies, and fine geography-time controls to show that partisan optimism reallocates firm creation and business activity across Democrats, Republicans, and counties."

- title: "Costinot & Werning (RES, 2023) - Robots, Trade, and Luddism: A Sufficient Statistic Approach to Optimal Technology Regulation"
  file: "Costinot_Werning_RES_2023.pdf"
  desc: "This note summarizes the paper, which develops a sufficient-statistic theory of optimal regulation for robots, AI, and trade in a second-best tax system, using model variables such as heterogeneous worker skills, wages across quantiles, labour supply, earnings, nonlinear income taxes, technology taxes, prices, new-technology output, and wage-growth effects, and showing that identification for policy does not require a full structural production model but instead relies on reduced-form estimates of how robots or Chinese import exposure shift the wage distribution, combined with income-tax rates, earnings shares, labour-supply elasticities, and the size of the taxed sector to compute efficient technology taxes."

- title: "Abowd, Kramarz, and Margolis (Econometrica, 1999) - High Wage Workers and High Wage Firms"
  file: "Abowd_Kramarz_Margolis_Econometrica_1999.pdf"
  desc: "This note summarizes the paper, which uses large French matched employer–employee administrative data from 1976–1987 to study real annual compensation, worker characteristics, firm characteristics, and job mobility, estimating an AKM-style two-way fixed-effect wage model that decomposes log compensation into observable worker controls, person effects, firm wage premia, seniority-related firm policies, and residuals, with identification coming mainly from workers moving across connected firms, and showing that persistent person effects explain most wage variation, inter-industry wage differentials, and firm-size wage premia, while firm effects remain economically important for understanding productivity, profitability, and wage-setting policies."

- title: "Chiovelli, Michalopoulos, Papaioannou & Sequeira (QJE, 2026) - Civil War-Induced Displacement and Human Capital"
  file: "Chiovelli_Michalopoulos_Papaioannou_Sequeira_QJE_2026.pdf"
  desc: "This note summarizes the paper, which studies how civil-war-induced displacement in Mozambique affected long-run human capital and occupational outcomes, using the 1997 census to classify displacement trajectories such as refugees, rural-to-urban IDPs, rural-to-rural IDPs, urban-to-rural movers, and nonmovers, measuring variables including primary completion, years of schooling, agricultural employment, service employment, destination-origin human-capital differences, age at move, and survey-based trust and mental-health outcomes, and identifying effects through cross-sectional trajectory comparisons, within-household comparisons among separated relatives, age-at-move exposure designs, conflict-timing restrictions, and prewar migration-network instruments to show that displacement can raise schooling when children move to better or more portable-human-capital environments, while still imposing serious social and psychological costs."

- title: "Chetty, Dobbie, Goldman, Porter & Yang (QJE, 2026) - Changing Opportunity: Sociological Mechanisms Underlying Growing Class Gaps and Shrinking Race Gaps in Economic Mobility"
  file: "Chetty_Dobbie_Goldman_Porter_Yang_QJE_2026.pdf"
  desc: "This note summarizes the paper, which uses linked U.S. administrative data on roughly 57 million children born between 1978 and 1992 to study changes in intergenerational mobility by race, parental-income class, cohort, and county, measuring key outcomes such as adult household income rank, employment, education, mortality, and SAT/ACT outcomes, and identifying the role of changing childhood environments through race–class–county parental employment rates, mover exposure designs, sibling comparisons, and social-interaction regressions that show widening white class gaps and shrinking low-income white–Black race gaps are largely driven by changes in community-level parental employment and socially proximate peer environments."

- title: "Bernard, Dercon, Orkin, Schinaia & Taffesse (QJE, 2026) - The Future in Mind: Aspirations and Long-Term Outcomes in Rural Ethiopia"
  file: "Bernard_Dercon_Orkin_Schinaia_Taffesse_QJE_2026.pdf"
  desc: "This note summarizes the paper, which uses a randomized documentary role-model intervention in rural Ethiopia, placebo screenings, five-year follow-up surveys, investment and welfare indices, aspirations and expectations measures, and mechanism tests to show that light-touch exposure to attainable success stories raises labor effort, agricultural investment, children’s education, durable assets, welfare, and future-oriented beliefs, implying that aspirations can be a durable state variable in poverty dynamics rather than merely a survey attitude."

- title: "Siddique, Vlassopoulos & Zenou (QJE, 2026) - Leveraging Virtual Contact and Social Networks to Foster Interethnic Harmony"
  file: "Siddique_Vlassopoulos_Zenou_QJE_2026.pdf"
  desc: "This note summarizes the paper, which uses a cluster-randomized field experiment in multiethnic Bangladeshi villages, Santal-focused documentary treatment, random versus network-central targeting, prosocial games, belief measures, emotion data, spillover analysis, administrative complaints, and a casual-work experiment to show that virtual intergroup contact improves behavior toward ethnic minorities mainly through affective empathy rather than stereotype correction, implying that low-cost media interventions can foster interethnic harmony when amplified through social networks."

- title: "Acemoglu & Restrepo (QJE, 2026) - Automation and Rent Dissipation: Implications for Wages, Inequality, and Productivity"
  file: "Acemoglu_Restrepo_QJE_2026.pdf"
  desc: "This note summarizes the paper, which develops a task-based automation model with labor-market rents and uses U.S. demographic-group wage data, task-displacement exposure, within-group wage-percentile patterns, rent proxies, and general-equilibrium quantification to show that automation disproportionately targets high-rent jobs, dissipates worker rents, amplifies wage losses for exposed groups, increases between-group inequality, and offsets much of automation’s direct productivity gain, implying that the welfare effect of automation depends on labor-market distortions as well as technological capability."

- title: "Weidmann, Vecci, Said, Bhalotra, Adhvaryu, Nyshadham, Tamayo & Deming (QJE, 2026) - How Do You Identify a Good Manager?"
  file: "Weidmann_Vecci_Said_Bhalotra_Adhvaryu_Nyshadham_Tamayo_Deming_QJE_2026.pdf"
  desc: "This note summarizes the paper, which uses a preregistered lab experiment with repeated random assignment of managers to teams, lottery versus self-promotion selection, individual skill assessments, LinkedIn validation, and retail-firm manager fixed effects to show that good managers causally improve team performance through allocation, monitoring, and motivation, while self-promotion selects worse managers than lottery assignment, implying that firms should identify managers through structured decision-making and team-based skill assessments rather than desire to lead or individual productivity alone."

- title: "Besley, Dann, and Dray (QJE, 2026) - Growth Experiences and Trust in Government"
  file: "Besley_Dann_Dray_QJE_2026.pdf"
  desc: "This note summarizes the paper, which uses harmonized global survey data, U.S. ANES evidence, Swiss panel data, recency-weighted lifetime GDP-growth experiences, cohort-based fixed-effect regressions, placebo tests, salient-growth episodes, post-2008 crisis event studies, and regime heterogeneity to show that stronger lived economic growth raises trust in government but not interpersonal or religious trust, implying that growth is a social-contract variable that can build political legitimacy while stagnation can erode it."

- title: "Nguyen (QJE, 2026) - Trust and Innovation Within the Firm: Evidence from Matched CEO-Firm Data"
  file: "Nguyen_QJE_2026.pdf"
  desc: "This note summarizes the paper, which uses matched CEO–firm–patent data, inherited trust measures from CEO surnames and ethnic-origin trust, CEO-transition designs, patent-quality outcomes, employee-review trust culture, director-selection tests, researcher-quality heterogeneity, and within-CEO bilateral-trust evidence to show that more trusting CEOs increase high-quality exploratory innovation by fostering failure tolerance and trust-based organizational culture, implying that managerial trust is a micro-level driver of firm innovation and growth."

- title: "Arellano, Bai, and Mihalache (QJE, 2026) - Monetary Policy and Sovereign Risk in Emerging Economies (NK-Default)"
  file: "Arellano_Bai_Mihalache_QJE_2026.pdf"
  desc: "This note summarizes the paper, which builds a New Keynesian sovereign-default model for emerging-market inflation targeters and uses empirical inflation-event facts, calibrated policy functions, impulse responses, model-counterfactual moments, robustness exercises, and welfare comparisons to show that sovereign default risk raises inflation through expectations while monetary tightening can discipline government borrowing and reduce spreads, implying that emerging-market monetary policy should account for sovereign risk rather than target inflation alone."

- title: "Goldin & Katz (JPE, 2002) - The Power of the Pill: Oral Contraceptives and Women’s Career and Marriage Decisions"
  file: "Goldin_Katz_JPE_2002.pdf"
  desc: "This note summarizes the paper, which uses state-by-cohort variation in young unmarried women’s legal access to the oral contraceptive pill, pill-use evidence, marriage timing, professional-school enrollment, premarital sex, and long-run career outcomes to show that early pill access delayed marriage and enabled women to invest in long-duration professional careers, implying that reproductive autonomy reshaped sex, marriage, fertility, and human-capital decisions."

- title: "Ahern & Dittmar (QJE, 2012) - The Changing of the Boards: The Impact on Firm Valuation of Mandated Female Board Representation"
  file: "Ahern_Dittmar_QJE_2012.pdf"
  desc: "This note summarizes the paper, which uses Norway’s mandatory 40% female board quota, pre-quota female board representation as treatment intensity, announcement returns, IV Tobin’s Q regressions, director human-capital comparisons, corporate-policy outcomes, and delisting tests to show that firms forced to change boards most rapidly experienced negative valuation effects because the mandate constrained board composition and drew on a limited pool of experienced women directors, implying that rapid binding diversity quotas can achieve representation goals while imposing adjustment costs and changing firm policy."

- title: "Bursztyn, Fujiwara & Pallais (AER, 2017) - “Acting Wife”: Marriage Market Incentives and Labor Market Investments"
  file: "Bursztyn_Fujiwara_Pallais_AER_2017.pdf"
  desc: "This note summarizes the paper, which uses elite MBA grade data, anonymous surveys, a randomized public-versus-private career-preference experiment, male-versus-female peer-audience variation, and placebo outcomes to show that single women strategically downplay ambition, leadership, compensation demands, travel willingness, and long-hours preferences when these career signals are visible to potential male partners, implying that marriage-market incentives and public visibility can distort labor-market investment even among highly career-oriented women."

- title: "Niederle & Vesterlund (QJE, 2007) - Do Women Shy Away from Competition? Do Men Compete Too Much?"
  file: "Niederle_Vesterlund_QJE_2007.pdf"
  desc: "This note summarizes the paper, which uses a controlled tournament-entry experiment with equal observed male and female performance, piece-rate and tournament tasks, belief elicitation, expected-payoff benchmarks, and a past-performance tournament control to show that men enter competitions much more than women because of greater overconfidence and a residual preference for active competitive performance, implying that competitive institutions can generate gendered selection and misallocation even before ability is evaluated."

- title: "Costa-Ramón, Slotwinski, Schaede & Brenøe (QJE, 2026) - (Not) Thinking About the Future: Financial Information and Maternal Labor Supply"
  file: "CostaRamon_Slotwinski_Schaede_Brenoe_QJE_2026.pdf"
  desc: "This note summarizes the paper, which uses a two-stage randomized information intervention among Swiss part-time teacher mothers, personalized Future Calculator projections, belief-heterogeneity tests, survey plans, spillover analysis, mechanism outcomes, and administrative employment records to show that mothers who underestimate the long-run financial costs of part-time work increase actual labor supply after receiving objective information, implying that inattention and misperceptions about lifetime income and pension consequences are meaningful frictions in maternal labor supply decisions."

- title: "Chuprinin & Sosyura (RFS, 2018) - Family Descent as a Signal of Managerial Quality: Evidence from Mutual Funds"
  file: "Chuprinin_Sosyura_RFS_2018.pdf"
  desc: "This note summarizes the paper, which matches Morningstar mutual fund managers to 1940 Census family-background records and uses performance regressions, entry-barrier interactions, promotion/exit tests, portfolio-activity analysis, and falsification checks to show that managers from poorer families outperform wealthier-background managers because low-wealth candidates face stricter selection into and within asset management, implying that family descent can signal managerial quality and create agency costs when privilege weakens performance-based selection."

- title: "Lundborg, Plug & Rasmussen (AER, 2017) - Can Women Have Children and a Career? IV Evidence from IVF Treatments"
  file: "Lundborg_Plug_Rasmussen_AER_2017.pdf"
  desc: "This note summarizes the paper, which uses Danish IVF treatment success as an instrument for first childbirth, linked administrative registers, event-study reduced forms, IV estimates, job-characteristic outcomes, heterogeneity tests, and intensive-versus-extensive fertility comparisons to show that having a first child causes large and persistent earnings losses for women—initially through reduced labor supply and later through lower wages and job sorting toward closer-to-home work—implying that motherhood changes career trajectories beyond temporary maternity leave even in a family-friendly welfare state."

- title: "Adams & Ferreira (JFE, 2009) - Women in the Boardroom and Their Impact on Governance and Performance"
  file: "Adams_Ferreira_JFE_2009.pdf"
  desc: "This note summarizes the paper, which uses IRRC director data, ExecuComp compensation data, director attendance, committee assignments, CEO turnover, director and CEO pay, performance regressions, IV/dynamic-panel methods, and governance interactions to show that female directors increase board monitoring through better attendance, monitoring-committee service, and stronger CEO turnover-performance sensitivity, but that the performance effect depends on existing governance quality, implying that board gender diversity changes governance meaningfully but is not mechanically value-enhancing for every firm."

- title: "Huang & Kisgen (JFE, 2013) - Gender and Corporate Finance: Are Male Executives Overconfident Relative to Female Executives?"
  file: "Huang_Kisgen_JFE_2013.pdf"
  desc: "This note summarizes the paper, which uses CEO/CFO gender-transition data, difference-in-differences around male-to-female versus male-to-male executive changes, announcement returns, earnings-forecast precision, option-exercise behavior, career outcomes, and value-destroying acquisition tests to show that firms with female executives make fewer acquisitions and debt issues but receive better market reactions when they act, implying that male executives are relatively more overconfident and that managerial gender helps explain corporate finance decisions beyond firm characteristics."

- title: "Lu, Naik & Teo (RFS, 2024) - Diverse Hedge Funds"
  file: "Lu_Naik_Teo_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses hedge fund team background data, diversity measures based on education, major, work experience, gender, and race, baseline regressions, portfolio sorts, diversity-enhancing hire event studies, founder-hometown IVs, and within-manager solo-versus-team comparisons to show that diverse hedge fund teams outperform homogeneous teams by exploiting broader investment opportunities, avoiding behavioral biases, managing risk better, and overcoming capacity constraints, implying that diversity can create direct investment value in sophisticated asset management."

- title: "Liu, Makridis, Ouimet & Simintzi (RFS, 2023) - The Distribution of Nonwage Benefits: Maternity Benefits and Gender Diversity"
  file: "Liu_Makridis_Ouimet_Simintzi_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses Glassdoor benefit ratings, paid maternity-leave data, female high-skill labor-supply measures, state-level and IV evidence, female-employment tests, and paid-family-leave event studies to show that firms offer more generous maternity and female-friendly benefits when skilled women are scarce, implying that nonwage benefits are strategic sorting tools for attracting targeted workers and increasing gender diversity rather than merely general perks."

- title: "Butler, Mayer & Weston (RFS, 2023) - Racial Disparities in the Auto Loan Market"
  file: "Butler_Mayer_Weston_RFS_2023.pdf"
  desc: "This note summarizes the paper, which links credit bureau records to HMDA mortgage data to observe race in auto lending and uses approval, interest-rate, default, credit-card falsification, racial-bias, competition, and CFPB-intervention evidence to show that minority borrowers face lower auto credit access and higher rates despite not defaulting more, implying that discretionary and opaque auto lending sustains racial disparities that competition and regulatory scrutiny can reduce."

- title: "Gurun, Wu, S. Xiao & W. Xiao (RFS, 2023) - Do Wall Street Landlords Undermine Renters’ Welfare?"
  file: "Gurun_Wu_Xiao_Xiao_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses institutional landlord mergers, overlapped-neighborhood treatment variation, Zillow rent data, property-level listings, census-tract crime, amenities, turnover, vacancy, competition, and broad-sample robustness tests to show that landlord consolidation raises rents through market power while reducing crime through scale economies and neighborhood-quality investment, implying that Wall Street landlords can simultaneously extract more tenant surplus and improve local public goods."

- title: "Keys, Mahoney & Yang (RFS, 2023) - What Determines Consumer Financial Distress? Place- and Person-Based Factors"
  file: "Keys_Mahoney_Yang_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses a large TransUnion credit-report panel, commuting-zone variation, mover event studies, variance decompositions, and robustness checks based on same-origin and same-destination comparisons to show that collections and credit card delinquency are driven mostly by portable person-based factors, while bankruptcy—especially Chapter 13—is substantially shaped by local place-based legal institutions and filing norms, implying that consumer financial distress requires outcome-specific policy responses rather than a single place-based explanation."

- title: "Benmelech, Guren & Melzer (RFS, 2023) - Making the House a Home: The Stimulative Effect of Home Purchases on Consumption and Investment"
  file: "Benmelech_Guren_Melzer_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses Consumer Expenditure Survey household event studies, PSID homeowner-versus-renter mover comparisons, BuildFax/DataQuick permit records, Economic Census retail data, and Great Recession aggregate calculations to show that buying a home triggers sizable home-specific spending on durables, repairs, improvements, and maintenance, implying that housing transaction volume is an independent macroeconomic transmission channel distinct from house-price or wealth effects."

- title: "Bartscher (RFS, 2023) - It Takes Two to Borrow: The Effects of the Equal Credit Opportunity Act on Housing, Credit, and Labor Market Decisions of Married Couples"
  file: "Bartscher_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses the Equal Credit Opportunity Act, PSID married-household data, wife-income-share treatment intensity, federal difference-in-differences, state-level event studies, and a life-cycle borrowing model to show that prohibiting lenders from discounting wives’ incomes relaxed mortgage DTI constraints, increased mortgage borrowing, homeownership, and house size, and raised the return to wives’ labor supply, implying that gender-based credit discrimination had constrained household borrowing, housing wealth accumulation, and labor-market decisions."

- title: "Efing, Hau, Kampkötter & Rochet (RFS, 2023) - Bank Bonus Pay as a Risk Sharing Contract"
  file: "Efing_Hau_Kampkotter_Rochet_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses granular payroll records from Austrian, German, and Swiss banks, employee division and hierarchy classifications, bank accounting shocks, crisis compensation cuts, variance decompositions, and cross-divisional bonus regressions to show that bank bonuses function not only as individual incentive pay but also as risk-sharing contracts that make labor costs state-contingent when banks face financial constraints, implying that bonus regulation should distinguish risk-taking incentives from the stabilizing role of variable pay in absorbing bankwide shocks."

- title: "Hvide & Meling (RFS, 2023) - Do Temporary Demand Shocks Have Long-Term Effects for Startups?"
  file: "Hvide_Meling_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses Norwegian public procurement auctions, winner-versus-runner-up startup comparisons, difference-in-differences event studies, placebo tests, contract-delay checks, treatment-intensity and age heterogeneity, and post-win bidding/product-market evidence to show that temporary demand shocks from winning contracts generate persistent increases in startup sales, employment, profitability, and market scope, implying that early demand can create durable firm growth through learning-by-doing and capability accumulation."

- title: "Pancost & Robatto (RFS, 2023) - The Effects of Capital Requirements on Good and Bad Risk-Taking"
  file: "Pancost_Robatto_RFS_2023.pdf"
  desc: "This note summarizes the paper, which develops a quantitative general-equilibrium model where deposits are held by both households and firms, showing that capital requirements reduce banks’ bad risk-taking but also reduce deposits that support firms’ productive risk-taking, and that because the welfare cost of lower firm deposits is partly absorbed through wages and profits, the optimal capital requirement is higher than in household-only models, implying that ignoring firm deposit demand can understate optimal bank capital regulation and overstate the cost of overshooting."

- title: "Adelino, Ferreira, Giannetti, and Pires (RFS, 2023) - Trade Credit and the Transmission of Unconventional Monetary Policy"
  file: "Adelino_Ferreira_Giannetti_Pires_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses the ECB’s Corporate Sector Purchase Programme, Orbis firm data, FactSet customer-supplier links, investment-grade eligibility variation, difference-in-differences tests, cutoff/matching robustness, and real-outcome regressions to show that eligible bond issuers expand trade credit to customers, especially financially constrained and periphery-country firms, leading customers to increase investment, inventories, receivables, and employment, implying that unconventional monetary policy transmits beyond public bond markets through production-network trade credit while also strengthening eligible suppliers’ market positions."

- title: "Grigoris, Hu, and Segal (RFS, 2023) - Counterparty Risk: Implications for Network Linkages and Asset Prices"
  file: "Grigoris_Hu_Segal_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses receivables-to-sales as a trade-credit measure, CRSP/Compustat returns, FactSet supplier-customer links, aggregate search-cost proxies, macro pricing tests, and a calibrated production-network model to show that low-trade-credit firms earn higher returns because they face shorter customer relationships and greater exposure to systematic customer-replacement costs, implying that trade credit is not merely working-capital finance but a signal of counterparty relationship quality and priced production-network risk."

- title: "Charles (RFS, 2025) - Memory Moves Markets"
  file: "Charles_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses rigid earnings-announcement schedules, calendar rotations, characteristic-adjusted returns, retail order-imbalance measures, memory-strength tests, and cue-based trading strategies to show that salient events at one firm can cue investors to recall associated firms, generating retail buying pressure, temporary abnormal returns, and later reversals, implying that internally generated investor memory can move markets and create short-lived return predictability beyond external news or fundamental information spillovers."

- title: "Godker, Jiao & Smeets (RFS, 2025) - Investor Memory"
  file: "Godker_Jiao_Smeets_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses three investment experiments with delayed versus immediate recall, Bayesian belief benchmarks, memory-bias measures, reinvestment and confidence outcomes, and high-incentive/no-choice mechanism tests to show that investors selectively remember more gains and fewer losses, leading to optimistic beliefs, suboptimal reinvestment, and overconfidence, implying that investor memory is a biased filter rather than neutral storage of past outcomes."

- title: "Dicks & Fulghieri (RFS, 2025) - Uncertainty, Contracting, and Beliefs in Organizations"
  file: "Dicks_Fulghieri_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops a multidivisional principal-agent model with uncertainty-averse managers and headquarters to show that incentive contracts shape beliefs as well as risk and effort, so cross-division exposure, aggregate bonuses, or equity-based pay can be optimal even when other-division performance is not informative about effort, implying that broad pay and limited relative-performance evaluation may serve as uncertainty-hedging and belief-alignment tools rather than governance failures."

- title: "Guo (RFS, 2025) - Earnings Extrapolation and Predictable Stock Market Returns"
  file: "Guo_RFS_2025.pdf"
  desc: "This note summarizes the paper, which links aggregate return predictability to the earnings-calendar cycle by showing that past newsy-month returns predict reversals in future newsy months but continuations in non-newsy months, using CRSP returns, IBES expectation data, industry returns, real-time forecasting tests, and a parameter-compression model to argue that investors extrapolate earnings news while misjudging its month-specific relevance, implying that market-wide predictability can be hidden in unconditional autocorrelations but revealed by earnings-announcement timing."

- title: "Andries, Bianchi, Huynh & Pouget (RFS, 2025) - Return Predictability, Expectations, and Investment: Experimental Evidence"
  file: "Andries_Bianchi_Huynh_Pouget_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses a controlled investment experiment with return histories, a potentially predictive signal, elicited signal-use beliefs, forecasts, confidence/tail probabilities, and risky allocations to show that investors switch between signal-based forecasting and extrapolation depending on perceived signal usefulness, and that signal-based forecasts have stronger portfolio pass-through than extrapolative forecasts, implying that information changes not only expectations but also how strongly investors act on those expectations."

- title: "Goyal & Saretto (RFS, 2025) - Can Equity Option Returns Be Explained by a Factor Model? IPCA Says Yes"
  file: "Goyal_Saretto_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses expiration-to-expiration daily delta-hedged equity option returns, 46 option and stock characteristics, transaction-cost adjustments, and a three-factor IPCA model with characteristic-based dynamic betas to show that most large long-short option-strategy returns are explained by systematic option-factor exposure rather than abnormal profits, implying that many option predictors proxy for latent risk exposures—especially through RV–IV—rather than pure option-market inefficiency."

- title: "Martin (RFS, 2025) - Real Effects of Centralized Markets: Evidence from Steel Futures"
  file: "Martin_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses the introductions of U.S. steel futures for hot-rolled coil and busheling scrap, product-level price data, firm hedging disclosures, market-share and cost-sensitivity tests, profit regressions, stock-market event studies, and non-U.S. placebo tests to show that centralized futures markets reduce physical-market price dispersion, increase producer hedging, shift market share toward low-cost firms, lower product prices, and reduce producer profits and valuations, implying that derivative-market centralization can reshape real product-market competition through reference-price and risk-management channels."

- title: "Loewenstein & Qin (RFS, 2025) - An Equilibrium Model of Imperfect Hedging: Transaction Costs, Heterogeneity in Risk Aversion, and Return Volatility"
  file: "Loewenstein_Qin_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops an equilibrium model of derivative trading with proportional transaction costs, imperfect hedging, nontraded endowment risk, and heterogeneous risk aversion to show that transaction costs create no-transaction regions, require market clearing at both buy and sell boundaries, can raise equilibrium return volatility when trade survives, and can eliminate trade when heterogeneity is insufficient, implying that financial transaction taxes need not stabilize derivative markets and may instead increase volatility or reduce risk sharing."

- title: "Giambona, Kumar, and Phillips (RFS, 2025) - Hedging, Contract Enforceability, and Competition"
  file: "Giambona_Kumar_Phillips_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses staggered state adoption of Section 711, U.S. life-insurer derivatives and product-market data, high-leverage exposure measures, event studies, matched samples, and financial-stability and sales outcomes to show that stronger derivatives contract enforceability increases hedging by constrained insurers, reduces risk, improves ratings, raises policy sales, lowers prices, and expands market share, implying that hedging access can reshape product-market competition by making financially fragile firms safer and more competitive."

- title: "Abrardi, Colombo, and Tedeschi (RFS, 2025) - Pretending Ignorance Is Bliss: Competing Insurers with Heterogeneous Informational Advantages"
  file: "Abrardi_Colombo_Tedeschi_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops a theory of competitive insurance markets where insurers hold private, imperfect, and heterogeneous information about policyholder risk, showing that noninformative pooling equilibria can be profitable and efficient under optimistic off-path beliefs while informative equilibria reveal signal profiles but create signaling-screening distortions and underinsurance, implying that data-rich insurer competition need not force full information revelation, zero profits, or socially efficient transparency."

- title: "John, Rivera, and Saleh (RFS, 2025) - Proof-of-Work versus Proof-of-Stake: A Comparative Economic Analysis"
  file: "John_Rivera_Saleh_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops a unified equilibrium model comparing Proof-of-Work and Proof-of-Stake security through user adoption, validator incentives, DeFi opportunity costs, congestion fees, asset values, and attacker benefits, showing that PoS is generally more secure under realistic parameters because staking avoids the high depreciation and energy costs of mining while requiring implausibly large attacker leverage to overturn its advantage, implying that blockchain security is an economic equilibrium outcome rather than a purely technical protocol feature."

- title: "Li & Mann (RFS, 2025) - Digital Tokens and Platform Building"
  file: "Li_Mann_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops a theory of digital tokens as coordination devices for launching peer-to-peer platforms, showing that costly and observable purchases of intrinsically platform-specific tokens allow users to signal intended participation under forward induction, eliminate no-trade equilibria, support investor resale to late adopters, and aggregate information about platform value, implying that utility tokens can create economic value by solving platform-adoption coordination failures rather than by paying dividends or functioning as conventional securities."

- title: "Lee, Moretti, and Butler (QJE, 2004) - Do Voters Affect or Elect Policies? Evidence from the U.S. House"
  file: "Lee_Moretti_Butler_QJE_2004.pdf"
  desc: "This note summarizes the paper, which uses close U.S. House elections in a regression-discontinuity design, ADA and alternative roll-call voting scores, incumbency-induced future win probabilities, balance and placebo tests, and a decomposition of total effects into “elect” versus “affect” components to show that voters mainly change policy by electing different parties rather than by forcing candidates to moderate, implying that general-election competition selects between policy positions more than it reshapes them."

- title: "Sacerdote (QJE, 2001) - Peer Effects with Random Assignment: Results for Dartmouth Roommates"
  file: "Sacerdote_QJE_2001.pdf"
  desc: "This note summarizes the paper, which uses Dartmouth’s randomized freshman roommate assignment, balance tests, pretreatment roommate characteristics, academic and social outcome regressions, dorm and room peer-group comparisons, and nonlinear match specifications to show that roommates modestly affect freshman GPA and fraternity/sorority/coed-house participation but not major choice or varsity athletics, implying that peer effects are real yet outcome-specific and depend on the relevant social reference group."

- title: "Sapienza (JFE, 2004) - The Effects of Government Ownership on Bank Lending"
  file: "Sapienza_JFE_2004.pdf"
  desc: "This note summarizes the paper, which uses Italian credit-line contracts, firm risk scores, matched borrower samples, firm and time fixed effects, bank controls, dual-borrower comparisons, regional and firm-size heterogeneity, and political-party affiliation measures to show that state-owned banks charge lower interest rates than private banks—especially to large firms and in provinces where the affiliated political party is stronger—implying that government bank ownership can distort credit allocation through political patronage rather than purely social lending."

- title: "Petersen (RFS, 2009) - Estimating Standard Errors in Finance Panel Data Sets: Comparing Approaches"
  file: "Petersen_RFS_2009.pdf"
  desc: "This note summarizes the paper, which compares standard-error estimators for finance panel regressions using simulations, a survey of empirical practice, and asset-pricing and corporate-finance applications, showing that White, Fama–MacBeth, firm-clustered, time-clustered, and two-way-clustered errors are appropriate under different dependence structures, implying that researchers must diagnose whether residuals and regressors are correlated within firms, within time periods, or both before choosing inference."

- title: "Nickell (Econometrica, 1981) - Biases in Dynamic Models with Fixed Effects"
  file: "Nickell_Econometrica_1981.pdf"
  desc: "This note summarizes the paper, which derives the classic Nickell bias in dynamic fixed-effects panel models by showing that within transformation mechanically correlates the demeaned lagged dependent variable with the demeaned error when T is fixed, producing a negative asymptotic bias in the autoregressive coefficient that does not vanish as N grows and can also contaminate exogenous-regressor coefficients, implying that ordinary fixed-effects OLS is inconsistent in short dynamic panels and must be replaced by estimators designed for dynamic panel bias."

- title: "Massa, Zhang, and Zhang (RFS, 2015) - The Invisible Hand of Short Selling: Does Short Selling Discipline Earnings Management?"
  file: "Massa_Zhang_Zhang_RFS_2015.pdf"
  desc: "This note summarizes the paper, which uses a large international panel, securities-lending data, modified Jones accruals, lendable-share measures of short-selling potential, ETF-based instruments, U.S. Regulation SHO, Hong Kong short-sale eligibility changes, and robustness tests to show that the threat of short selling reduces future earnings management and improves price informativeness, implying that short sellers act not only as price-discovery traders but also as external monitors disciplining managerial reporting behavior."

- title: "Malmendier & Tate (JF, 2005) - CEO Overconfidence and Corporate Investment"
  file: "Malmendier_Tate_JF_2005.pdf"
  desc: "This note summarizes the paper, which uses CEO option-exercise and stock-purchase behavior to measure managerial overconfidence, links these behavioral traits to firm investment, cash flow, Q, financing constraints, and CEO characteristics, and shows that overconfident CEOs display stronger investment-cash flow sensitivity—especially in equity-dependent firms—implying that managerial beliefs can distort corporate investment even when managers sincerely aim to maximize shareholder value."

- title: "Hirano, Imbens & Ridder (Econometrica, 2003) - Efficient Estimation of Average Treatment Effects Using the Estimated Propensity Score"
  file: "Hirano_Imbens_Ridder_Econometrica_2003.pdf"
  desc: "This note summarizes the paper, which shows that under unconfoundedness, inverse-propensity-weighted estimators using a flexible nonparametrically estimated propensity score can achieve semiparametric efficiency for ATE, WATE, and ATT because estimated weights impose covariate-balance information that true weights ignore, implying that propensity-score estimation is not merely a nuisance step but a central efficiency device in treatment-effect estimation."

- title: "Krueger (QJE, 1999) - Experimental Estimates of Education Production Functions"
  file: "Krueger_QJE_1999.pdf"
  desc: "This note summarizes the paper, which reanalyzes Tennessee Project STAR’s randomized class-size experiment using within-school assignment, balance checks, reduced-form and IV models, attrition and noncompliance adjustments, pooled longitudinal exposure specifications, and subgroup/school heterogeneity tests to show that small early-grade classes raise student achievement by several percentile points—especially in the first year—while teacher aides in regular classes have modest effects, implying that randomized evidence supports class-size reduction as a meaningful education input at the STAR margin."

- title: "Jacobson, LaLonde & Sullivan (AER, 1993) - Earnings Losses of Displaced Workers"
  file: "Jacobson_LaLonde_Sullivan_AER_1993.pdf"
  desc: "This note summarizes the paper, which uses Pennsylvania administrative wage records linked to firm employment data, high-tenure worker samples, mass-layoff displacement events, event-study models with worker and time fixed effects, trend controls, same-firm comparison groups, and heterogeneity by worker, industry, firm, local labor market, and reemployment sector to show that displaced workers suffer large and persistent earnings losses beginning before separation and averaging about 25% of predisplacement earnings, implying that job loss destroys durable firm-specific rents, match value, and internal-labor-market advantages that are not quickly rebuilt."

- title: "White (Econometrica, 1980) - A Heteroskedasticity-Consistent Covariance Matrix Estimator and a Direct Test for Heteroskedasticity"
  file: "White_Econometrica_1980.pdf"
  desc: "This note summarizes the paper, which introduces the heteroskedasticity-consistent “White” sandwich covariance estimator and auxiliary-regression nR^2 heteroskedasticity test, showing that OLS coefficients can remain consistent under exogeneity while conventional homoskedastic standard errors fail, implying that valid regression inference can be achieved by estimating the covariance of squared residuals and regressors directly rather than specifying a parametric variance model."

- title: "Bertrand, Duflo & Mullainathan (QJE, 2004) - How Much Should We Trust Differences-in-Differences Estimates?"
  file: "Bertrand_Duflo_Mullainathan_QJE_2004.pdf"
  desc: "This note summarizes the paper, which uses a survey of published differences-in-differences studies, CPS placebo-law simulations, AR(1) experiments, and comparisons of parametric corrections, block bootstrap, aggregation, empirical covariance matrices, and cluster-robust inference to show that persistent outcomes and persistent treatment indicators make conventional DD standard errors severely overreject, implying that inference must be clustered or otherwise adjusted at the level of treatment variation rather than based on the raw number of observations."

- title: "Imbens & Angrist (Econometrica, 1994) - Identification and Estimation of Local Average Treatment Effects"
  file: "Imbens_Angrist_Econometrica_1994.pdf"
  desc: "This note summarizes the paper, which formalizes the local average treatment effect framework by using potential outcomes, potential treatment states, instrument relevance/exogeneity, and monotonicity to show that IV identifies the average causal effect for compliers whose treatment status is changed by the instrument, not necessarily the ATE or ATT, implying that empirical IV estimates must be interpreted through the institutional mechanism, monotonicity argument, and complier population they actually move."

- title: "Tobin (Econometrica, 1958) - Estimation of Relationships for Limited Dependent Variables"
  file: "Tobin_Econometrica_1958.pdf"
  desc: "This note summarizes the paper, which develops the Tobit model for limited dependent variables by combining the probability mass at a censoring boundary with the continuous density of uncensored outcomes, derives the nonlinear observed conditional expectation and maximum-likelihood estimator under normal homoskedastic errors, and illustrates the method with durable-goods expenditures, implying that OLS and probit are incomplete for censored outcomes because valid estimation must jointly model both participation at the limit and the positive outcome amount."

- title: "Thompson (JFE, 2011) - Simple formulas for standard errors that cluster by both firm and time"
  file: "Thompson_JFE_2011.pdf"
  desc: "This note summarizes the paper, which develops simple two-way clustered standard-error formulas for panel regressions by combining firm-clustered and time-clustered covariance matrices and subtracting the White matrix to avoid double-counting, extends the approach to persistent common shocks, and uses Monte Carlo simulations plus an industry-profitability application to show that inference in finance panels depends critically on matching standard errors to both within-firm and within-time dependence, implying that single-cluster or White standard errors can severely misstate statistical significance."

- title: "Solon (AER, 1992) - Intergenerational Income Mobility in the United States"
  file: "Solon_AER_1992.pdf"
  desc: "This note summarizes the paper, which uses PSID father-son data, multi-year averages of fathers’ earnings, age-profile controls, balanced-sample checks, and IV estimates using father education to show that earlier U.S. mobility studies understated intergenerational income persistence because single-year income measures and homogeneous samples created attenuation bias, implying that long-run father-son economic-status correlations are closer to 0.4–0.5 and U.S. income mobility is substantially lower than previously believed."

- title: "Staiger & Stock (Econometrica, 1997) - Instrumental Variables Regression with Weak Instruments"
  file: "Staiger_Stock_Econometrica_1997.pdf"
  desc: "This note summarizes the paper, which develops weak-instrument asymptotics for IV regression by modeling first-stage coefficients as local to zero, analyzes the nonstandard behavior of TSLS, LIML, Wald statistics, overidentification tests, exogeneity tests, and confidence intervals, uses concentration parameters, Monte Carlo evidence, and the Angrist–Krueger quarter-of-birth application to show that TSLS can be biased toward OLS and conventional intervals can severely undercover, implying that large samples cannot rescue weak identification and that researchers should report first-stage strength and use LIML, Anderson–Rubin, or Bonferroni-style weak-IV robust inference when instruments are weak."

- title: "Heckman & Vytlacil (Econometrica, 2005) - Structural Equations, Treatment Effects, and Econometric Policy Evaluation"
  file: "Heckman_Vytlacil_Econometrica_2005.pdf"
  desc: "This note summarizes the paper, which develops the marginal treatment effect framework to unify structural econometrics and treatment-effect methods, showing that ATE, TT, TUT, LATE, IV, OLS, matching, and policy-relevant treatment effects are different weighted averages of treatment gains along the latent participation margin, implying that credible policy evaluation requires identifying which margin a policy or instrument moves rather than treating any valid IV estimate as a universal causal effect."

- title: "Heckman, Ichimura, Smith & Todd (Econometrica, 1998) - Characterizing Selection Bias Using Experimental Data"
  file: "Heckman_Ichimura_Smith_Todd_Econometrica_1998.pdf"
  desc: "This note summarizes the paper, which uses randomized JTPA experimental controls as a benchmark against eligible nonparticipants and SIPP comparison groups, semiparametric bias functions, propensity-score matching, bias decompositions, conditional mean-independence tests, index-sufficiency tests, and conditional difference-in-differences diagnostics to show that nonexperimental estimators can reduce but not eliminate selection bias unless comparison data share common support, geography, survey design, weighting, and rich recent labor-market histories, implying that credible program evaluation requires direct testing of identifying assumptions rather than relying mechanically on matching."

- title: "Heckman (Econometrica, 1979) - Sample Selection Bias as a Specification Error"
  file: "Heckman_Econometrica_1979.pdf"
  desc: "This note summarizes the paper, which reframes sample selection bias as an omitted-variable specification error, develops a two-equation selection-and-outcome model, derives the inverse Mills ratio correction under joint normality, proposes the two-step Heckman estimator using first-stage probit and second-stage outcome regression, and shows that valid inference must account for the generated selection term, implying that nonrandomly observed outcomes require modeling the selection process rather than applying naive OLS to the selected sample."

- title: "Hansen (Econometrica, 1982) - Large Sample Properties of Generalized Method of Moments Estimators"
  file: "Hansen_Econometrica_1982.pdf"
  desc: "This note summarizes the paper, which establishes the generalized method of moments framework for estimators based on population orthogonality conditions, proves consistency, asymptotic normality, optimal inverse long-run covariance weighting, and Hansen’s overidentification J test under stationary and ergodic sampling, and shows how GMM unifies nonlinear IV, least squares, quasi-MLE first-order conditions, and rational-expectations estimation, implying that valid moment restrictions and correct long-run covariance estimation are the foundation of modern moment-based econometrics."

- title: "Hall & Horowitz (Econometrica, 1996) - Bootstrap Critical Values for Tests Based on Generalized-Method-of-Moments Estimators"
  file: "Hall_Horowitz_Econometrica_1996.pdf"
  desc: "This note summarizes the paper, which develops higher-order bootstrap critical values for GMM-based t and overidentifying-restrictions J tests, uses Edgeworth expansions, recentered bootstrap moments, block resampling for dependent data, corrected bootstrap statistics, regularity conditions, and Monte Carlo evidence to show that properly constructed bootstrap inference reduces finite-sample size distortions relative to first-order normal and chi-square critical values, implying that GMM bootstrap procedures must be carefully aligned with the statistic and dependence structure being approximated."

- title: "Gruber (AER, 1994) - The Incidence of Mandated Maternity Benefits"
  file: "Gruber_AER_1994.pdf"
  desc: "This note summarizes the paper, which uses state and federal maternity-benefit mandates, CPS labor-market data, demographic treatment and control groups, triple-difference designs, predicted mandate-cost specifications, and the federal Pregnancy Discrimination Act as a reverse experiment to show that mandated maternity insurance costs were largely shifted onto affected workers through lower wages with little evidence of large employment or hours losses, implying that the statutory burden of employer mandates can differ sharply from their economic incidence."

- title: "Evans & Schwab (QJE, 1995) - Finishing High School and Starting College: Do Catholic Schools Make a Difference?"
  file: "Evans_Schwab_QJE_1995.pdf"
  desc: "This note summarizes the paper, which uses High School and Beyond sophomore-cohort data, high school graduation and four-year college entry outcomes, rich family/background/test-score controls, probit and bivariate probit selection models, Catholic religion and local Catholic-share instruments, school-selectivity checks, and heterogeneity analyses to show that Catholic high schools substantially increase educational attainment, especially high school completion, implying that school effectiveness should be evaluated through economically meaningful attainment outcomes rather than test scores alone."

- title: "Chetty, Hendren & Katz (AER, 2016) - The Effects of Exposure to Better Neighborhoods on Children: New Evidence from the Moving to Opportunity Experiment"
  file: "Chetty_Hendren_Katz_AER_2016.pdf"
  desc: "This note summarizes the paper, which uses the randomized Moving to Opportunity experiment, linked federal tax records, ITT and TOT voucher estimates, childhood age-at-random-assignment variation, adult earnings, college, marriage, fertility, neighborhood, and tax-payment outcomes to show that moving to lower-poverty neighborhoods substantially improves long-run outcomes for children who move before adolescence but not for older children or adults, implying that neighborhood quality operates as a developmental input whose benefits depend strongly on early exposure."

- title: "Chava & Roberts (JF, 2008) - How Does Financing Impact Investment? The Role of Debt Covenants"
  file: "Chava_Roberts_JF_2008.pdf"
  desc: "This note summarizes the paper, which uses Dealscan loan-covenant data, CRSP-Compustat firm outcomes, covenant-threshold distance measures, firm-quarter investment regressions, regression-discontinuity logic, event-time evidence, robustness controls, and agency/information-problem heterogeneity tests to show that financial covenant violations transfer control rights to creditors and reduce capital investment by about 1% of capital per quarter, implying that financing affects real corporate policy not only through funding constraints but through state-contingent creditor control."

- title: "Card & Krueger (AER, 2000) - Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania: Reply"
  file: "Card_Krueger_AER_2000.pdf"
  desc: "This note summarizes the paper, which reexamines the 1992 New Jersey minimum-wage increase using representative BLS ES-202 administrative payroll records, the original Card–Krueger survey, the disputed BNW payroll sample, difference-in-differences specifications, robustness checks, longer BLS time-series evidence, a 1996 reverse comparison, and within-New-Jersey wage-gap tests to show that representative payroll data do not support a systematic negative fast-food employment effect, implying that the replication dispute turns on sample representativeness, reporting intervals, and measurement rather than payroll records per se."

- title: "Buchinsky & Hahn (Econometrica, 1998) - An Alternative Estimator for the Censored Quantile Regression Model"
  file: "Buchinsky_Hahn_Econometrica_1998.pdf"
  desc: "This note summarizes the paper, which develops the CQR-LP estimator for censored quantile regression by transforming the latent censored quantile problem into a convex weighted quantile regression using covariate-dependent uncensoring probabilities, proves root-n consistency and asymptotic normality, and shows through Monte Carlo simulations that it corrects censoring bias better than Powell’s nonconvex estimator, implying that censoring can be handled by reweighting uncensored observations at the appropriate transformed quantile."

- title: "Baker & Wurgler (JF, 2006) - Investor Sentiment and the Cross-Section of Stock Returns"
  file: "Baker_Wurgler_JF_2006.pdf"
  desc: "This note summarizes the paper, which constructs a composite investor-sentiment index from closed-end fund discounts, turnover, IPO activity and returns, equity issuance shares, and dividend premia, then uses characteristic-sorted portfolios, sentiment-conditioned return regressions, factor controls, conditional beta tests, and earnings-announcement evidence to show that high sentiment predicts low subsequent returns for speculative, hard-to-arbitrage stocks and relative outperformance for safer stocks, implying that firm characteristics have state-dependent expected-return implications shaped by market sentiment."

- title: "Arellano & Bond (RES, 1991) - Some Tests of Specification for Panel Data: Monte Carlo Evidence and an Application to Employment Equations"
  file: "Arellano_Bond_RES_1991.pdf"
  desc: "This note summarizes the paper, which develops the Arellano–Bond difference-GMM estimator for dynamic panel models with fixed effects and lagged dependent variables, uses lagged levels as internal instruments after first-differencing, provides AR(2), Sargan, difference-Sargan, and Hausman specification tests, evaluates finite-sample performance through Monte Carlo simulations, and applies the method to U.K. manufacturing employment equations, implying that credible dynamic panel estimation requires both internal-instrument GMM and careful serial-correlation and overidentification diagnostics."

- title: "Angrist & Lavy (QJE, 1999) - Using Maimonides’ Rule to Estimate the Effect of Class Size on Scholastic Achievement"
  file: "Angrist_Lavy_QJE_1999.pdf"
  desc: "This note summarizes the paper, which uses Maimonides’ maximum class-size rule, Israeli elementary-school test data, enrollment-threshold discontinuities, predicted class-size instruments, reduced-form score regressions, 2SLS estimates, discontinuity samples, pooled specifications, and third-grade robustness checks to show that rule-induced smaller classes raise achievement for fourth and fifth graders while OLS comparisons are biased by nonrandom class formation, implying that institutional class-size rules can provide credible regression-discontinuity evidence on education production."

- title: "Angrist & Krueger (QJE, 1991) - Does Compulsory School Attendance Affect Schooling and Earnings?"
  file: "Angrist_Krueger_QJE_1991.pdf"
  desc: "This note summarizes the paper, which uses quarter of birth as an instrument generated by school-entry cutoffs and compulsory attendance laws, Census data, first-stage schooling patterns, state dropout-age evidence, reduced-form earnings differences, Wald and TSLS estimates, state-specific instruments, and falsification checks for postsecondary outcomes and college graduates to show that compulsory schooling increases educational attainment and raises earnings for marginal dropouts, implying that IV returns to legally induced schooling are close to OLS estimates around the compulsory-schooling margin."

- title: "Abadie, Angrist, and Imbens (Econometrica, 2002) - Instrumental Variables Estimates of the Effect of Subsidized Training on the Quantiles of Trainee Earnings"
  file: "Abadie_Angrist_Imbens_Econometrica_2002.pdf"
  desc: "This note summarizes the paper, which develops an instrumental-variables quantile treatment effects estimator for binary endogenous treatment with a binary instrument, uses complier-probability weights to turn a nonconvex IV quantile problem into weighted quantile regression, and applies the method to JTPA training to show that subsidized training raises women’s earnings across the distribution but affects men mainly in the upper half, implying that mean IV estimates can miss important distributional and targeting effects."

- title: "Koijen, Van Nieuwerburgh & Yogo (JF, 2016) - Health and Mortality Delta: Assessing the Welfare Cost of Household Insurance Choice"
  file: "Koijen_VanNieuwerburgh_Yogo_JF_2016.pdf"
  desc: "This note summarizes the paper, which develops health delta and mortality delta as portfolio risk measures for life insurance, annuities, pensions, and long-term care insurance, estimates a life-cycle model using HRS health, mortality, income, wealth, and insurance data, and shows that households’ insurance portfolios are often too persistent over time and insufficiently rebalanced from life insurance toward annuities, implying that insurance advice should jointly target state-contingent wealth across poor health, good health, and death rather than evaluating products separately."

- title: "Yogo, Whitten, and Cox (JFE, 2025) - Financial Inclusion Across the United States"
  file: "Yogo_Whitten_Cox_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses universe-scale IRS administrative tax data for U.S. households aged 50–59, retirement and bank account participation measures, ZCTA-level geographic variables, employer-plan access indicators, SCF validation, a panel IV based on counterfactual 2010-employer plan adoption, and universal-access policy simulations to show that financial inclusion gaps are large, geographically uneven, and strongly driven by employer retirement plan access and automatic enrollment, implying that low participation among low-income households reflects institutional access, defaults, geography, and social environment rather than income alone."

- title: "Campello, Kankanhalli & Kim (JFE, 2024) - Delayed creative destruction: How uncertainty shapes corporate assets"
  file: "Campello_Kankanhalli_Kim_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses near-universal global shipping ownership and transaction data, subsector-level option-implied uncertainty, forward freight demand controls, secondary-market liquidity measures, investment and disinvestment decompositions, productivity/vintage measures, firm-level fleet composition tests, and Somali piracy as a quasi-natural experiment to show that uncertainty delays both new capital adoption and obsolete-capital disposal, implying that uncertainty slows creative destruction by making firms hold older, smaller, and less efficient asset portfolios unless liquid secondary markets reduce reversibility costs."

- title: "Elenev, Law, Song & Yaron (JFE, 2024) - Fearing the Fed: How Wall Street Reads Main Street"
  file: "Elenev_Law_Song_Yaron_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses high-frequency S&P 500 E-mini, Eurodollar, and Treasury futures reactions to scheduled macroeconomic news surprises, Bloomberg survey forecasts, time-varying stock sensitivity regressions, output-gap and inflation state variables, bond-market evidence, and survey-implied policy-rule estimates to show that stock prices react to macro news through both cash-flow news and perceived Federal Reserve reaction functions, implying that the same “good” macro surprise can be bullish when slack is high but muted or bearish when the economy is tight or inflation makes expected tightening dominant."

- title: "Faria-e-Castro, Paul, and Sánchez (JFE, 2024) - Evergreening"
  file: "FariaeCastro_Paul_Sanchez_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses static and dynamic models of concentrated legacy lending, U.S. Y-14 loan-level data, within-firm-time bank comparisons, lender debt-share and distress interactions, firm-level lender-concentration tests, and quantitative heterogeneous-firm calibration to show that incumbent lenders with large old exposures lend more and charge lower rates to distressed borrowers to protect legacy claims, implying that evergreening can support debt and investment in normal credit markets while keeping weak firms alive and lowering measured productivity."

- title: "Jiang, Peng, and Yan (JFE, 2024) - Personality Differences and Investment Decision-Making"
  file: "Jiang_Peng_Yan_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses an AAII survey of affluent investors, Big Five personality measures, belief, risk-aversion, social-influence, and equity-allocation outcomes, plus out-of-sample evidence from HILDA and GSOEP, to show that Neuroticism and Openness systematically shape investor beliefs, risk tolerance, social behavior, and portfolio choices, implying that stable personality traits help explain why investors with similar resources and information hold different equity allocations."

- title: "Murray, Xia, and Xiao (JFE, 2024) - Charting by Machines"
  file: "Murray_Xia_Xiao_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses U.S. stock return charts, twelve monthly cumulative-return inputs, an optimization-period-selected CNNLSTM model, expanding-window ML forecasts, decile portfolio sorts, risk-adjusted return tests, large-stock and subperiod robustness, nonlinear/interaction diagnostics, and controls for momentum, reversal, image-based ML, technical signals, and trading frictions to show that machine learning extracts economically large predictive information from past price patterns alone, implying that flexible “machine charting” challenges weak-form market efficiency beyond standard technical rules."

- title: "Xiouros & Zapatero (JFE, 2024) - Disagreement, information quality and asset prices"
  file: "Xiouros_Zapatero_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops and calibrates a stationary heterogeneous-beliefs asset-pricing model with professional-forecast disagreement, time-varying information quality, external habit, stock and bond pricing moments, nested-model ablations, and real-yield tests to show that disagreement matters quantitatively only when public information quality varies with aggregate shocks, implying that state-dependent forecast dispersion helps explain stock-price volatility, equity premia, risk-free-rate dynamics, and the real yield curve."

- title: "Darmouni & Sutherland (JFE, 2024) - Investment when new capital is hard to find"
  file: "Darmouni_Sutherland_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses UCC asset-level equipment filings, pandemic-era production disruptions, John Deere strike exposure, used-equipment trading speed, distance, matching, and price evidence, plus firm-age investment regressions, to show that shortages of new capital push firms into secondary markets where used assets trade faster, farther, and at higher prices, implying that secondary markets both absorb investment shocks and transmit them by reallocating scarce capital toward older or stronger firms while crowding out young firms."

- title: "Barrot, Bonelli, Grassi & Sauvagnat (JFE, 2024) - Causal Effects of Closing Businesses in a Pandemic"
  file: "Barrot_Bonelli_Grassi_Sauvagnat_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses manually coded U.S. state-sector business-closure orders, restricted-labor exposure adjusted for work-from-home feasibility, firm-level outcomes, CZ-level labor and health outcomes, fixed-effect and event-study designs, SIRD-motivated health specifications, and aggregate cost-benefit calculations to show that pandemic business closures reduced firm sales/profits and worker wages/employment/hours while also lowering infections, deaths, hospitalizations, and life-years lost, implying that closures were both economically costly and health-effective, with better policy design requiring targeted restrictions in high-contact areas."

- title: "Geelen, Hajda, Morellec & Winegar (JFE, 2024) - Asset life, leverage, and debt maturity matching"
  file: "Geelen_Hajda_Morellec_Winegar_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops and tests a dynamic theory of leverage and debt maturity based on finite asset life, capital age, replacement investment, debt cycles, and maturity matching, using U.S. public firm data, within-firm capital-age regressions, mechanism tests on investment lumpiness and ROI, robustness checks, and cross-sectional useful-life tests to show that firms delever and shorten debt maturity as capital ages while firms with longer-lived assets have longer debt cycles and maturities, implying that debt maturity matching is a dynamic liquidity-management response to predictable future replacement financing needs."

- title: "Hanson, Malkhozov & Venter (JFE, 2024) - Demand-and-Supply Imbalance Risk and Long-Term Swap Spreadsn"
  file: "Hanson_Malkhozov_Venter_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses long-term U.S. swap spreads, primary dealers’ net Treasury positions, swap-spread trade returns, intermediary-balance-sheet constraints, end-user hedging-demand proxies, forecasting regressions, and a sign-restricted SVAR to show that negative long-term swap spreads reflect both end-user demand shocks and constrained intermediary supply shocks, implying that swap spreads embed demand-and-supply imbalance risk premia rather than simple arbitrage violations."

- title: "Liebersohn (JFE, 2024) - How does competition affect retail banking? Quasi-experimental evidence from bank mergers"
  file: "Liebersohn_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses the 1800 HHI bank-merger antitrust cutoff, regulator-defined banking markets, FDIC deposit concentration data, RateWatch deposit rates, HMDA and Consumer Credit Panel mortgage data, CRA small-business lending data, and dynamic difference-in-differences/event-study designs to show that antitrust divestiture lowers local banking concentration, raises CD rates, expands mortgage lending and lowers mortgage rates, but has little effect on checking/savings rates or small-business lending, implying that local bank competition matters in product-specific ways depending on whether the product is transactional or relationship-based."

- title: "Ardia, Barras, Gagliardini & Scaillet (JFE, 2024) - Is it alpha or beta? Decomposing hedge fund returns when models are misspecified"
  file: "Ardia_Barras_Gagliardini_Scaillet_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops a nonparametric framework for decomposing hedge fund returns into alpha and beta under factor-model misspecification, applies it to 5,231 hedge funds across CAPM, standard, machine-learning, and hedge-fund-specific factor models, and shows that CP-style factors such as time-series momentum, variance, carry, BAB, illiquidity, size, and market exposure reclassify much apparent hedge fund alpha as alternative beta, implying that true hedge fund skill depends on the benchmark sophistication of investors and the set of replicable strategies they can implement."

- title: "Do, Galbiati, Marx & Ortiz Serrano (JFE, 2024) - J’Accuse! Antisemitism and financial markets in the time of the Dreyfus Affair"
  file: "Do_Galbiati_Marx_OrtizSerrano_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses historical Paris Stock Exchange data, Jewish board and CEO exposure, event studies around antisemitic and rehabilitation shocks, difference-in-differences, synthetic DID, coarsened exact matching, volatility and risk-adjusted return tests, dividend checks, foreign-firm evidence, and a model of biased investors to show that antisemitic sentiment during the Dreyfus Affair directly affected Jewish-connected firms’ valuations, implying that financial markets can price discriminatory beliefs but correct such mispricing only gradually when arbitrage is risky."

- title: "Cronqvist, Ladika, Pazaj, and Sautner (JFE, 2024) - Limited Attention to Detail in Financial Markets: Evidence from Reduced-Form and Structural Estimation"
  file: "Cronqvist_Ladika_Pazaj_Sautner_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses FAS 123-R’s staggered shift of option compensation costs from footnotes to income-statement expensing, high-versus-low option-firm exposure, analyst forecast misses and recommendation changes, market-to-book valuation responses, confounding-channel tests, analyst and investor learning evidence, and structural estimation to show that analysts and investors underweighted less salient option-cost information before expensing and gradually learned after disclosure visibility increased, implying that financial-statement presentation affects even sophisticated market participants’ forecasts, recommendations, and valuations."

- title: "Baba-Yara, Boons, and Tamoni (JFE, 2024) - Persistent and Transitory Components of Firm Characteristics: Implications for Asset Pricing"
  file: "BabaYara_Boons_Tamoni_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses 56 firm characteristics, newest and old characteristic-sorted portfolios, old-versus-new alpha regressions, old-minus-new stock strategies, principal components, benchmark factor-model tests, and long-term discount-rate calculations to show that persistent and transitory components of characteristics are compensated differently across characteristics, implying that asset-pricing models must explain not only current characteristic returns but also their horizon dynamics and valuation implications."

- title: "Ha, Ma, and Žaldokas (JFE, 2024) - Motivating Collusion"
  file: "Ha_Ma_Zaldokas_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses the 2013 closure of four DoJ Antitrust Division regional offices, changes in firms’ distance to antitrust enforcement, local Hoberg-Phillips product-market peers, CEO pay-performance regressions, cash-versus-equity compensation tests, product-market outcome analyses, contract-feature evidence, and convicted-cartel validation to show that weakened antitrust enforcement leads firms to make CEO pay more positively tied to local peer performance and less tied to own performance, implying that shareholder-aligned compensation can motivate softer competition and potential collusion at the expense of consumer welfare."

- title: "Baldauf, Mollner & Zhou (JFE, 2024) - Siphoned Apart: A Portfolio Perspective on Order Flow Segmentation"
  file: "Baldaufa_Mollner_Zhou_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops an inventory-based portfolio model of order-flow segmentation, liquidity supply, PFOF, retail versus institutional order-flow correlation, market-maker inventory risk, segmentation bans, retail-trading growth, market-maker profits, welfare, and dynamic routing to show that retail order flow can be valuable because it hedges institutional imbalances rather than merely being uninformed, implying that banning PFOF or off-exchange segmentation can raise spreads and reduce welfare when segmentation improves market makers’ liquidity-supply portfolios."

- title: "Shu (JFE, 2024) - The Proxy Advisory Industry: Influencing and Being Influenced"
  file: "Shu_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses N-PX filing formats, statutory prospectuses, ISS and Glass Lewis recommendations, 140 million mutual fund votes, platform-switching tests, robo-voting measures, and investor-disagreement regressions to show that proxy advisors strongly influence mutual fund voting through both recommendations and voting platforms while also adapting future advice to investor disagreement, implying that the proxy advisory industry is a concentrated feedback system linking information production, voting technology, and institutional investor preferences."

- title: "Broadbent, Di Pace, Drechsel, Harrison & Tenreyro (RES, 2024) - The Brexit Vote, Productivity Growth, and Macroeconomic Adjustments in the U.K."
  file: "Broadbent_DiPace_Drechsel_Harrison_Tenreyro_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses post-Brexit U.K. sectoral data, EU-accession productivity evidence, pre-referendum structural estimation, a two-sector small open economy model, tradable versus non-tradable productivity and relative-price dynamics, and a calibrated Brexit news shock to show that the referendum operated as bad news about future tradable productivity growth, implying that expectations can immediately lower non-tradable relative prices, weaken spending, temporarily support tradables, and reduce long-run U.K. GDP by about 3.6%."

- title: "Garin & Silverio (RES, 2024) - How Responsive Are Wages to Firm-Specific Changes in Labour Demand? Evidence from Idiosyncratic Export Demand Shocks"
  file: "Garin_Silverio_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses Portuguese exporter data, linked employer–employee records, foreign import-demand shocks during the Great Recession, a common-versus-idiosyncratic shock decomposition, close-competitor validation tests, worker fixed effects, attached-incumbent wage regressions, pass-through IV estimates, and durability heterogeneity to show that firm-specific export demand shocks causally pass through to incumbent wages, implying that wages reflect both internal rent sharing inside durable employment relationships and broader labour-market competition."

- title: "Hassan, Schreger, Schwedeler & Tahoun (RES, 2024) - Sources and Transmission of Country Risk"
  file: "Hassan_Schreger_Schwedeler_Tahoun_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses more than 300,000 global earnings-call transcripts, country-specific text libraries, firm-country-quarter measures of exposure, sentiment, country risk, transmission risk, and global risk, validation against real firm links and asset prices, crisis-transmission decompositions, financial versus non-financial firm splits, and capital-flow/sudden-stop regressions to show that country risk is a measurable network of perceived risks that transmits through gravity links, financial channels, supply chains, and global perception shocks, implying that international risk spillovers depend on who is worried, about which country, and through which channel."

- title: "Eggertsson, Juelsrud, Summers & Wold (RES, 2024) - Negative Nominal Interest Rates and the Bank Lending Channel"
  file: "Eggertsson_Juelsrud_Summers_Wold_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses Sweden’s negative-rate episode, daily bank-level mortgage rates, deposit-rate pass-through, bank balance-sheet variables, lending growth, bank equity event studies, deposit-share heterogeneity, and a calibrated banking model with liquid assets, deposits, external finance, net worth, and a deposit lower bound to show that negative policy rates can stop lowering lending rates and instead compress bank profitability and reduce lending when deposits cannot fall below zero, implying that monetary easing below zero depends on banks’ balance-sheet exposure and deposit-market pass-through rather than the policy rate alone."

- title: "Benguria, Saffie, and Urzua (RES, 2024) - The Transmission of Commodity Price Super-Cycles"
  file: "Benguria_Saffie_Urzua_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses Brazilian regional commodity-price exposure, matched employer–employee firm data, skill-intensity measures, exporter and tradability classifications, cost- and wealth-channel regressions, and a dynamic small-open-economy model to show that commodity super-cycles raise local demand but also distort labour markets by increasing unskilled labour demand and reallocating firms across sectors, implying that commodity booms generate welfare gains that are substantially reduced by wage-cost and reallocation effects."

- title: "de Bresser (RES, 2024) - Evaluating the Accuracy of Counterfactuals: Heterogeneous Survival Expectations in a Life Cycle Model"
  file: "deBresser_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses Dutch household panel data, subjective survival-probability reports, a measurement model for noisy rounded expectations, a structural life-cycle model of retirement, benefit claiming, and saving, and an out-of-sample validation around Dutch pension reform to show that heterogeneous subjective survival expectations substantially improve counterfactual retirement predictions, implying that structural policy evaluation can fit pre-reform behavior yet fail externally when expectations are misspecified."

- title: "Jiang, Krishnamurthy, and Lustig (RES, 2024) - Dollar Safety and the Global Financial Cycle"
  file: "Jiang_Krishnamurthy_Lustig_RES_2024.pdf"
  desc: "This note summarizes the paper, which develops a theory of the dollar-centered global financial cycle using safe-dollar demand, convenience yields, U.S. bank dollar carry trades, dollar liquidity supply, U.S. monetary-policy spillovers, foreign dollar borrowing, currency mismatch, crisis wealth effects, and contagion mechanisms to show that dollar safe-asset scarcity appreciates the dollar and transmits shocks globally, implying that the global financial cycle is fundamentally a dollar-liquidity cycle rather than only an interest-rate or risk-sharing phenomenon."

- title: "Eeckhout & Sepahsalari (RES, 2024) - The Effect of Wealth on Worker Productivity"
  file: "Eeckhout_Sepahsalari_RES_2024.pdf"
  desc: "This note summarizes the paper, which develops a calibrated infinite-horizon directed-search model with risk-averse workers, endogenous savings, heterogeneous firm productivity, unemployment insurance, and asset-dependent search choices to show that low-wealth workers use job search as self-insurance by targeting safer lower-productivity jobs while high-wealth workers can search for riskier higher-productivity jobs, implying that wealth inequality creates productivity inequality and that UI improves search quality and welfare at moderate levels but reduces vacancy creation, total output, and welfare when too generous."

- title: "Mueller, Osterwalder, Zweimuller, and Kettemann (RES, 2024) - Vacancy Durations and Entry Wages: Evidence from Linked Vacancy–Employer–Employee Data"
  file: "Mueller_Osterwalder_Zweimuller_Kettemann_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses linked Austrian vacancy–employer–employee data, entry wages, wage-floor adjustments, worker fixed effects, AKM worker and establishment wage components, vacancy-duration regressions, and filling-rate simulations to show that higher-wage establishments fill vacancies faster but the elasticity is small, implying that wages matter for recruiting but explain only a limited share of vacancy-filling variation relative to worker selection, screening, recruiting intensity, amenities, and other non-wage hiring margins."

- title: "Gao, Kim & Sevilir (JFE, 2025) - Private equity in the hospital industry"
  file: "Gao_Kim_Sevilir_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses U.S. hospital M&A data, matched difference-in-differences, CPOM legal variation, HCRIS operating measures, HCCI prices, HCAHPS satisfaction, and Hospital Compare mortality/readmission outcomes to show that private equity acquisitions improve short-run hospital profitability mainly by cutting administrative labor and wage costs rather than closing hospitals, changing patient mix, or broadly raising inpatient prices, implying that PE creates financial gains through administrative restructuring with mixed patient-facing consequences: lower satisfaction but no detected deterioration in measured mortality or readmissions."

- title: "Schneider, Strahan, and Yang (JFE, 2025) - Bank stress testing, human capital investment and risk management"
  file: "Schneider_Strahan_Yang_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses Lightcast bank job postings, NLP-based risk-management job and skill measures, stress-test exposure, dynamic difference-in-differences around test initiation, CCAR failure scores, and skill-category decompositions to show that post-crisis stress testing increases banks’ demand for specialized stress-test human capital—especially technology and capital-regulation skills—but does not broadly raise non-test risk-management hiring, implying that regulation reshapes bank human capital while producing narrow compliance-oriented capacity rather than clearly transforming overall risk-management culture."

- title: "Jung, Engle, & Berner (JFE, 2025) - CRISK: Measuring the Climate Risk Exposure of the Financial System"
  file: "Jung_Engle_Berner_JFE_2025.pdf"
  desc: "This note summarizes the paper, which develops CRISK as a market-based expected capital-shortfall measure for climate transition stress using climate transition risk factors, dynamic bank climate betas, Y-14 loan portfolio validation, borrower default-risk tests, bank-level and aggregate CRISK/mCRISK/S&CRISK calculations, out-of-sample COVID drawdown predictability, and scenario analysis to show that transition risk can create large systemic capital shortfalls, especially for banks exposed to brown industries, implying that climate risk is both a market-risk and credit-risk channel for financial stability."

- title: "Jiang, Tang, Xiao & Yao (JFE, 2025) - Surviving the Fintech Disruption"
  file: "Jiang_Tang_Xiao_Yao_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses a novel occupation-level fintech exposure measure based on O*NET task text and fintech patent text, Burning Glass job postings, employment and wage validation, complementarity/substitution tests, new-suboccupation and upskilling analyses, firm-level worker-flow data, fintech innovation measures, and firm performance regressions to show that fintech reduces demand for substitutable finance-related jobs but creates hybrid finance-plus-tech roles and benefits firms with complementary workforces or innovation capacity, implying that survival under fintech disruption depends on task complementarity, reallocation, and technological adaptation."

- title: "Feng, Huo, Liu, Mao, and Xiang (JFE, 2025) - Economic Links from Bonds and Cross-Stock Return Predictability"
  file: "Feng_Huo_Liu_Mao_Xiang_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses corporate bond rating-comovement links, peer-return signals, stock and bond return tests, Fama–MacBeth regressions, fundamental comovement evidence, spanning regressions, dual-holder tests, and analyst forecast revisions to show that repeated same-direction rating updates reveal economically connected firms whose peer stock returns predict focal stock returns, implying that bond-market information identifies cross-firm links that equity markets and analysts incorporate only gradually because of bond-equity market segmentation."

- title: "Diamond, Landvoigt & Sánchez Sánchez (JFE, 2025) - Printing Away the Mortgages: Fiscal Inflation and the Post-Covid Boom"
  file: "Diamond_Landvoigt_Sanchez_JFE_2025.pdf"
  desc: "This note summarizes the paper, which develops a borrower–saver New Keynesian model with nominal mortgages, fiscal transfers, temporarily passive monetary policy, refinancing frictions, housing, intermediaries, and calibrated household balance sheets to show that transfers to high-MPC borrowers and monetary passivity jointly generate inflation that erodes real mortgage debt and redistributes from savers to borrowers, implying that the post-Covid boom can be understood as a fiscal-monetary-household-finance interaction driven by private nominal debt as well as government policy."

- title: "Chaudhry (JFE, 2025) - The Impact of Prices on Analyst Cash Flow Expectations: Reconciling Subjective Beliefs Data with Rational Discount Rate Variation"
  file: "Chaudhry_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses I/B/E/S analyst cash-flow forecasts, staggered analyst revision windows, Russell benchmarking-intensity shocks, mutual-fund flow-induced trading instruments, term-structure and persistence tests, covariance decompositions, and a rational-investor model with analysts learning from prices to show that exogenous price increases causally raise analyst earnings expectations, implying that biased analyst forecasts can arise from analysts misreading discount-rate-driven price movements as cash-flow news rather than from biased investor beliefs."

- title: "Brugler & Comerton-Forde (JFE, 2025) - Differential Access to Dark Markets and Execution Outcomes"
  file: "Brugler_ComertonForde_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses Australian dark-trade data, broker versus exchange dark pool comparisons, access-rule classifications, trade- and stock-day execution outcomes, broker pool closure matching, HFT/ELP restriction tests, and execution-risk robustness to show that broker dark pools with access restrictions generate lower information leakage, adverse-selection risk, and post-trade order imbalance than unrestricted exchange dark pools, implying that dark market design and counterparty segmentation materially affect execution quality."

- title: "Berg, Burg, Keil & Puri (JFE, 2025) - The economics of “Buy Now, Pay Later”: A merchant’s perspective"
  file: "Berga_Burg_Keil_Puri_JFE_2025.pdf"
  desc: "This note summarizes the paper, which uses a randomized checkout experiment at a German online furniture merchant, BNPL availability, credit-score heterogeneity, conversion and revenue outcomes, BNPL approval/default data, payment-cost calculations, and recession robustness tests to show that zero-interest BNPL raises sales by implicitly discounting purchases for customers who value credit while preserving posted prices, implying that BNPL is a merchant pricing, payments, and lending technology whose profitability depends on margins, screening, and credit losses."

- title: "Flanagan (JF, 2025) - The Value of Bank Lending"
  file: "Flanagan_JF_2025.pdf"
  desc: "This note summarizes the paper, which reconstructs realized syndicated loan cash flows, risk-adjusts them using public-market replicating portfolios, validates the method with corporate-bond placebo tests, and examines financial constraints, screening, monitoring, renegotiation, bank-level alpha persistence, and commercial lending expenses to show that bank lending creates positive gross risk-adjusted value especially for constrained borrowers, but that this value is largely absorbed by costly lending services rather than becoming shareholder rents."

- title: "Antolín-Díaz, Petrella, and Rubio-Ramírez (RFS, 2026) - Dividend Momentum and Stock Return Predictability: A Bayesian Approach"
  file: "AntolinDiaz_Petrella_RubioRamirez_RFS_2026.pdf"
  desc: "This note summarizes the paper, which develops a Campbell–Shiller-restricted Bayesian VAR for returns, dividend growth, and the price-dividend ratio using informative priors, stationarity restrictions, out-of-sample forecasting, long-horizon variance and asset-allocation tests, and quarterly state-space robustness to show that persistent dividend growth creates dividend momentum and moderate long-horizon return predictability, implying that useful stock-return forecasting requires combining Bayesian shrinkage, accounting restrictions, and dividend dynamics rather than relying on flat-prior predictability regressions."

- title: "Lewellen (JF, 2025) - Women in Charge: Evidence from Hospitals"
  file: "Lewellen_JF_2025.pdf"
  desc: "This note summarizes the paper, which uses U.S. nonprofit hospital CEO data, hospital policy and financial variables, matched financial-crisis difference-in-differences tests, CEO pay regressions, pay-for-performance and turnover-performance analyses, board representation tests, and CEO background data to show that female CEOs do not manage hospitals differently in financing, investment, labor, or patient policies but receive lower pay, weaker upside incentives, and harsher turnover penalties after poor performance, implying that the main gender asymmetry at the top lies in executive evaluation rather than observable managerial decision-making."

- title: "Costain, Nuno & Thomas (JF, 2025) - The Term Structure of Interest Rates in a Heterogeneous Monetary Union"
  file: "Costain_Nuno_Thomas_JF_2025.pdf"
  desc: "This note summarizes the paper, which extends a preferred-habitat term-structure model to a heterogeneous monetary union with default-free Core and defaultable Periphery sovereigns, using German and Italian yield curves, bond-supply distributions, fiscal-pressure/default-risk dynamics, PEPP purchase scenarios, yield decompositions, robustness tests, and pandemic/PEPP event analysis to show that peripheral spreads and PEPP transmission are driven mainly by credit risk premia and default-risk extraction rather than standard duration effects alone, implying that asset purchases in a monetary union operate as sovereign-risk stabilization policy."

- title: "Fuster, Lo, and Willen (JF, 2024) - The Time-Varying Price of Financial Intermediation in the Mortgage Market"
  file: "Fuster_Lo_Willen_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses proprietary Optimal Blue mortgage rate sheets, TBA/MBS prices, QE event studies, daily pass-through regressions, application-volume and processing-time measures, MSA-level tests, MBA cost data, and aggregate spending calculations to show that the mortgage intermediation wedge is large, demand-sensitive, capacity-constrained, and upward-trending after the crisis, implying that monetary-policy and capital-market changes reach borrowers only through a time-varying intermediary supply curve rather than full frictionless pass-through."

- title: "Bisetti & Karolyi (Journal of Finance, 2024) - Meeting Targets in Competitive Product Markets"
  file: "Bisetti_Karolyi_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses U.S. bank EPS-surprise data, RateWatch deposit APYs, bunching around analyst EPS targets, In-Spike targeting indicators, deposit-rate and deposit-quantity regressions, event studies, balance-sheet expense validation, EPS counterfactuals, and local competitive-spillover tests to show that public banks cut deposit rates to meet short-term earnings targets, reducing interest expense but causing deposit outflows and competitor rate increases, implying that capital-market pressure affects real consumer pricing and is partly disciplined by product-market competition."

- title: "Bhattacharya, Kumar, Visaria & Zhao (JF, 2024) - Do Women Receive Worse Financial Advice?"
  file: "Bhattacharya_Kumar_Visaria_Zhao_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses a randomized audit study of 463 visits to all 65 local Hong Kong retail advisory firms, scripted male and female auditor avatars with varied risk tolerance, confidence, and geographic outlook, product-recommendation outcomes, firm-type comparisons, and a model of statistical discrimination with advisor incentives to show that women receive more undiversified and home-biased advice at financial planning firms but not securities firms, implying that gender gaps in financial advice can arise from perceived sophistication and retention incentives rather than only explicit taste-based discrimination."

- title: "Acharya & Rajan (JF, 2024) - Liquidity, Liquidity Everywhere, Not a Drop to Use: Why Flooding Banks with Central Bank Reserves May Not Expand Liquidity"
  file: "Acharya_Rajan_JF_2024.pdf"
  desc: "This note summarizes the paper, which develops a theoretical model of central-bank reserve expansion through bank balance sheets, demandable deposits, credit-line claims, reserve shrinkage/encumbrance, endogenous interbank participation, safe-bank reserve hoarding, convenience yields, and QT dynamics to show that gross reserve abundance may fail to create usable system liquidity and can even raise stressed interbank premia when liquidity claims and hoarding incentives grow, implying that QE should be evaluated by net transferable liquidity rather than the raw quantity of reserves."

- title: "Reher & Valkanov (JF, 2024) - The Mortgage-Cash Premium Puzzle"
  file: "Reher_Valkanov_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses Zillow ZTRAX repeat-sales transactions, Redfin offer-level data, seller/buyer/property controls, robustness designs, representative-seller and heterogeneous-seller models, and homeowner survey experiments to show that mortgage-financed buyers pay an 11%–12% premium over comparable all-cash buyers because mortgage offers impose failure, delay, and relisting risks on sellers, implying that housing prices contain a large mortgage-cash wedge driven by transaction frictions, seller conditions, and ambiguity about financing risk."

- title: "Che, Choe, and Rhee (JF, 2024) - Bailout Stigma"
  file: "Che_Choe_Rhee_JF_2024.pdf"
  desc: "This note summarizes the paper, which develops a two-period adverse-selection model of transparent government bailouts, legacy-asset sales, bailout participation as a public signal, short-lived versus delayed stimulation equilibria, secret-bailout benchmarks, cutoff structures, and optimal bailout design to show that public aid can stigmatize recipients and worsen future market freezes, implying that bailout policy is also information design and that secrecy or a single generous transparent offer may dominate complex bailout menus."

- title: "Kontoghiorghes (JFE, 2024) - Do personal taxes affect investment decisions and stock returns?"
  file: "Kontoghiorghes_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses the 2013 UK reform allowing AIM stocks into tax-exempt ISAs, matched FTSE controls, effective personal tax-rate measures, factor-model and difference-in-differences return tests, dynamic event studies, firm financial and real-outcome regressions, heterogeneity tests, and investor-demand evidence to show that eliminating personal investment taxes reduced AIM expected returns by roughly the pre-reform tax premium while increasing payouts, financing, capital investment, pay, and employment, implying that personal taxes affect both asset prices and real corporate decisions."

- title: "Cuciniello, Michelacci, and Paciello (JPE, 2025) - Subsidizing Business Entry in Competitive Credit Markets"
  file: "Cuciniello_Michelacci_Paciello_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops a structural model of business-entry subsidies in competitive credit markets with financially constrained entrants, long-term debt, leverage-ratchet effects, ex ante versus ex post subsidy timing, North–South Italian calibration, reimbursement regressions, welfare decompositions, and evidence from Italy’s I Stay in the South program to show that subsidies paid before entry reduce start-up leverage and bankruptcy risk while reimbursements after borrowing can crowd out equity and lower welfare, implying that subsidy timing is central for effective entrepreneurship policy."

- title: "Fonseca & Liu (JF, 2024) - Mortgage Lock-In, Mobility, and Labor Reallocation"
  file: "Fonseca_Liu_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses individual credit-record mortgage data, mortgage-rate deltas between locked-in and current rates, moving and out-of-county mobility outcomes, origination-timing instruments, asymmetry tests, wage-growth opportunity interactions, and business entry/exit regressions to show that fixed-rate mortgage lock-in significantly reduces household mobility and labor reallocation when rates rise, implying that long-term mortgage-rate insurance can create real adjustment frictions in geographic mobility, job transitions, and entrepreneurship."

- title: "Davydiuk, Marchuk & Rosen (JFE, 2024) - Direct lenders in the U.S. middle market"
  file: "Davydiuk_Marchuk_Rosen_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses hand-collected BDC investment-level data, county-level traditional-credit shocks from SCAP, CIT, and FAS 166/167, difference-in-differences and event-study designs, private-debt comparisons, innovation-county allocation tests, firm-level employment and patenting outcomes, and managerial-attention interactions to show that direct lenders substitute for constrained banks and finance companies after credit-supply contractions, implying that private credit can fill middle-market financing gaps and support real growth, especially for innovative firms."

- title: "Kogan, Makarov, Niessner, & Schoar (JFE, 2024) - Are cryptos different? Evidence from retail trading"
  file: "Kogan_Makarov_Niessner_Schoar_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses eToro retail-account data, within-platform and within-investor comparisons of crypto, stock, and gold trading, total versus active share changes, return-response regressions, investor-type and demographic splits, active/existing-user checks, individual-account regressions, crash-experience tests, lottery-stock comparisons, and earnings-announcement controls to show that retail investors trade stocks and gold contrarian but allow cryptocurrency exposure to rise after price increases, implying that crypto is treated as an adoption-sensitive asset whose past returns shape beliefs about future demand rather than as a standard rebalancing asset."

- title: "Jiang, Matvos, Piskorski & Seru (JFE, 2024) - Monetary tightening and U.S. bank fragility in 2023: Mark-to-market losses and uninsured depositor runs?"
  file: "Jiang_Matvos_Piskorski_Seru_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses U.S. bank call-report balance sheets, market-value markdowns of long-duration assets, uninsured-deposit leverage measures, no-run and run solvency conditions, insured-deposit coverage and capital-ratio stress tests, and SVB-style withdrawal scenarios to show that 2022–2023 monetary tightening created large hidden mark-to-market losses that became dangerous when combined with runnable uninsured deposits, implying that bank fragility must be evaluated jointly through duration losses, capital, deposit franchise value, and uninsured leverage rather than book capital alone."

- title: "Boutros, Clara & Gomes (JFE, 2024) - Borrow now, pay even later: A quantitative analysis of student debt payment plans"
  file: "Boutros_Clara_Gomes_JFE_2024.pdf"
  desc: "This note summarizes the paper, which builds a lifecycle model of student-loan repayment with SRP, IDRP, delinquency, risky income, consumption-savings choices, Principal Payment Deferral, Full Payment Deferral, equilibrium loan repricing, welfare decomposition, robustness tests, and policy comparisons to show that deferring early-life student-loan payments sharply reduces delinquency and raises welfare without lender-NPV losses, implying that repayment timing can deliver benefits comparable to debt forgiveness by improving liquidity and consumption smoothing when borrowers are young and constrained."

- title: "He, Su & Yu (JFE, 2024) - Macroeconomic Perceptions, Financial Constraints, and Anomalies"
  file: "He_Su_Yu_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses SPF industrial-production-growth forecast revisions, anomaly portfolios classified by financially constrained long versus short legs, financial-constraint indices, two-regime and predictive return regressions, horse-race controls, analyst forecast-error tests, corporate financing/investment responses, rotation strategies, and aggregate credit-market predictability to show that macroeconomic optimism overprices financially constrained firms and predictably strengthens or weakens anomalies depending on where constrained firms sit, implying that subjective macro perceptions interact with financing frictions to generate time-varying anomaly returns."

- title: "Haslag, Srinivasan & Thakor (JFE, 2024) - Competition, Product Differentiation and Crises: Evidence from 18 Million Securitized Loans"
  file: "Haslag_Srinivasan_Thakor_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses over 18 million private-label securitized mortgage loans, hand-collected RMBS sponsor-parent data, county-year sponsor HHI, non-standard loan-feature measures, within-originator comparisons, the 2000 HUD rule as a competition shock, marginal-borrower threshold tests, and delinquency outcomes to show that greater RMBS sponsor competition induced mortgage product differentiation first among prime/access borrowers and later among marginal borrowers, implying that securitization-market competition reshaped underlying loan contracts and contributed to pre-crisis credit risk."

- title: "Nimalendran, Rzayev & Sagade (JFE, 2024) - High-frequency trading in the stock market and the costs of options market making"
  file: "Nimalendran_Rzayev_Sagade_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses NASDAQ HFT data, OPRA options transactions, stock-day options bid–ask spreads, liquidity-supplying versus liquidity-demanding HFT measures, put–call parity violation tests, informed-trading proxies around the Rajaratnam arrest, and NASDAQ flash-order IV regressions to show that aggressive stock-market HFT widens options-market spreads through latency arbitrage and informed-trading channels, implying that speed and adverse selection in one market can raise market-making costs in a closely linked derivatives market."

- title: "Diamond, Jiang & Ma (JFE, 2024) - The reserve supply channel of unconventional monetary policy"
  file: "Diamond_Jiang_Ma_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops and estimates a structural banking model of QE’s reserve-supply channel using deposit, mortgage, corporate loan, and securities/reserve data, demand-system instruments, balance-sheet cost Hessian estimates, TGA reserve-spread shocks, and counterfactual reserve injections to show that QE-created reserves raise banks’ marginal cost of lending and crowd out corporate loans, implying that unconventional monetary policy can stimulate through asset purchases while simultaneously reducing bank lending through the reserves banks must absorb."

- title: "Altermatt, van Buggenum & Voellmy (JFE, 2024) - Systemic bank runs without aggregate risk: How a misallocation of liquidity may trigger a solvency crisis"
  file: "Altermatt_vanBuggenum_Voellmy_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops a general-equilibrium theory of systemic bank runs without aggregate fundamental risk, linking deposits’ payment role, liquidity misallocation, goods demand, entrepreneurial loan repayment, deposit freezes, redemption penalties, and emergency liquidity policies to show that a run can endogenously turn a payment/liquidity disruption into bank insolvency, implying that effective run prevention must preserve impatient consumers’ spending capacity and borrowers’ repayment ability rather than merely restricting withdrawals."

- title: "Doshi, Ericsson, Fournier, and Seo (JFE, 2024) - The Risk and Return of Equity and Credit Index Options"
  file: "Doshi_Ericsson_Fournier_Seo_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops and estimates a structural credit-risk model linking SPX equity derivatives and CDX credit derivatives through common constituent-firm asset dynamics, stochastic variance, systematic jumps, filtered default barriers, CDX spread term structures, physical SPX volatility, out-of-sample SPX/CDX option pricing tests, and option-return risk-premium decompositions to show that equity and credit index option markets are broadly consistent once asset, variance, jump, and default risks are priced jointly, implying that apparent CDX underpricing depends on restrictive default-threshold parameterization rather than systematic relative mispricing."

- title: "Filippou, Maurer, Pezzo & Taylor (JFE, 2024) - Importance of Transaction Costs for Asset Allocation in Foreign Exchange Markets"
  file: "Filippou_Maurer_Pezzo_Taylor_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses 26-currency FX data, bid–ask spreads, realized-Amihud price-impact measures, volume extrapolation, before- and after-cost return calculations, fund-size experiments, and mean–variance-transaction-cost optimization to show that proportional transaction costs are modest but price-impact costs from large trades can make popular FX strategies unprofitable at institutional scale, implying that currency asset allocation must treat transaction costs and strategy capacity as central parts of portfolio design rather than after-the-fact deductions."

- title: "Doshi, Jacobs, and Liu (JFE, 2024) - Modeling Volatility in Dynamic Term Structure Models"
  file: "Doshi_Jacobs_Liu_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops no-arbitrage dynamic term-structure models with GARCH volatility factors, estimates them on monthly Treasury yields, compares conditional yield volatility against realized and EGARCH benchmarks, tests Campbell–Shiller risk-premium implications, and evaluates out-of-sample Treasury futures option pricing—showing that modeling volatility through lagged squared yield-factor innovations greatly improves volatility fit and derivative pricing without sacrificing yield-curve fit, implying that volatility dynamics are central to term-structure modeling."

- title: "Leong, Li, Pavanini & Walsh (JFE, 2024) - The Effects of Policy Interventions to Limit Illegal Money Lending"
  file: "Leong_Li_Pavanini_Walsh_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses a unique panel of Singapore illegal money-lending borrowers, loan contracts, harassment and repayment histories, the enforcement crackdown, and a structural model of borrower demand, lender choice, loan-size setting, harassment costs, present bias, effort, and repayment behavior to show that supply-side enforcement sharply reduces lender profits and loan volume but can lower borrower welfare through smaller loans and higher rates, implying that effective policy against loan-shark credit requires both lender enforcement and borrower-side interventions targeting gambling, drug use, present bias, and repayment incentives."

- title: "Jeffers, Lyu, and Posenau (JFE, 2024) - The Risk and Return of Impact Investing Funds"
  file: "Jeffers_Lyu_Posenau_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses a new cash-flow dataset of private impact investing funds, matched private-market and VC benchmarks, PME/GPME performance measures, PME-wedge risk inference, artificial leverage tests, long-short portfolios, and market, sustainability, and emerging-market SDF models to show that impact funds have lower market-risk exposure and distinct sustainability/emerging-market risk profiles, implying that their financial attractiveness depends on the investor’s benchmark portfolio, risk model, and taste for impact rather than raw returns alone."

- title: "Dow, Han, and Sangiorgi (JFE, 2024) - The Short-Termism Trap: Catering to Informed Investors with Limited Horizons"
  file: "Dow_Han_Sangiorgi_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops a theoretical model of listed firms, project maturity choice, managerial incentive contracts, scarce informed trading capital, short-horizon investors, price informativeness, listing decisions, strategic complementarity, coordinated benchmarks, and long-term investor extensions to show that firms individually shorten projects to attract informed investors and improve stock-price monitoring, but collectively destroy shareholder value because informed capital is fixed, implying that stock-market governance can create an inefficient short-termism trap through competition for informed attention."

- title: "Kuong, O’Donovan, and Zhang (JFE, 2024) - Monetary Policy and Fragility in Corporate Bond Mutual Funds"
  file: "Kuong_ODonovan_Zhang_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses corporate bond mutual fund flows, Federal Funds Target rate changes, Eurodollar futures around FOMC meetings, NAV staleness measures, event-window outflow regressions, NAV predictability tests, liquidity interactions, and a model of strategic redemption from stale NAVs to show that monetary tightening can induce fund fragility when policy news makes stale fund shares temporarily overpriced, implying that corporate bond mutual fund outflows depend jointly on monetary-policy news, NAV staleness, market liquidity, and redemption externalities."

- title: "Andrews, Colacito, Croce, and Gavazzoni (JFE, 2024) - Concealed Carry"
  file: "Andrews_Colacito_Croce_Gavazzoni_JFE_2024.pdf"
  desc: "This note summarizes the paper, which studies G10 traditional currency carry and yield-curve slope carry using short-rate and slope-sorted portfolios, exchange-rate decompositions, OECD global growth and inflation expectations, country-level exposure regressions, recursive-preference international asset-pricing calibration, entropy/predictability tests, the post-2008 regime shift, and the 1975–1985 inflation episode to show that traditional carry is mainly tied to global growth risk while slope carry reflects a concealed, regime-dependent global inflation-risk premium that becomes strongly positive when expected global inflation is low."

- title: "Ardia, Guidotti, and Kroencke (JFE, 2024) - Efficient Estimation of Bid–Ask Spreads from Open, High, Low, and Close Prices"
  file: "Ardia_Guidotti_Kroencke_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops the EDGE estimator for effective bid–ask spreads from low-frequency OHLC prices by correcting for discrete trading and price-coincidence bias, combining discrete generalized estimators through efficient GMM-style weighting, and validating the method with simulations, CRSP–TAQ benchmarks, historical U.S. stock data, intraday prices, and cryptocurrency applications—showing that EDGE is less biased, more precise, and less sampling-frequency sensitive than existing low-frequency spread estimators, implying that transaction-cost measurement must account for infrequent trading when quote data are unavailable."

- title: "Neuhann & Sockin (JFE, 2024) - Financial Market Concentration and Misallocation"
  file: "Neuhann_Sockin_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops a complete-markets model with strategic financial-market agents, a competitive fringe, Cournot–Walras price impact, private state-price wedges, investment and storage distortions, productivity-dispersion calibration, and concentration counterfactuals to show that large agents’ market power in risk-sharing markets makes high-productivity firms underinvest and low-productivity firms overinvest, implying that financial market concentration can generate real capital misallocation, weak investment, high hurdle rates, low market costs of capital, and rising cash-like storage even when securities markets are complete."

- title: "Geng & Pan (JF, 2024) - The SOE Premium and Government Support in China’s Credit Market"
  file: "Geng_Pan_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses Chinese corporate bond data, SOE versus non-SOE spread regressions, the 2018 asset-management New Regulations as a liquidity shock, a rollover-risk structural model with bailout probability, unified default measures combining fundamentals, liquidity, and government support, price-discovery tests, and real-performance regressions to show that the SOE premium rises sharply when liquidity deteriorates because government support becomes more valuable in preventing liquidity-driven default, implying that implicit guarantees widen credit misallocation and affect real outcomes in China’s credit market."

- title: "Coimbra & Rey (RES, 2024) - Financial Cycles with Heterogeneous Intermediaries"
  file: "Coimbra_Rey_RES_2024.pdf"
  desc: "This note summarizes the paper, which uses intermediary balance-sheet data, leverage quantiles, interest-rate sensitivity evidence, systemic-risk measures, and a dynamic macro-finance model with heterogeneous VaR-constrained intermediaries, limited liability, endogenous leverage, entry, default options, and monetary/productivity shocks to show that low interest rates can stimulate output while shifting assets toward the most risk-taking intermediaries and raising systemic fragility, implying that monetary policy affects not only aggregate credit but also the cross-sectional allocation of risk across financial intermediaries."

- title: "Bhattacharya, Dupas, and Kanaya (RES, 2024) - Demand and Welfare Analysis in Discrete Choice Models with Social Interactions"
  file: "Bhattacharya_Dupas_Kanaya_RES_2024.pdf"
  desc: "This note summarizes the paper, which develops a discrete-choice framework with social interactions, equilibrium adoption, compensating-variation welfare bounds, semiparametric identification with unobserved group effects, and an ITN subsidy application in rural Kenya to show that social spillovers can be enough to predict counterfactual demand but not enough to point-identify welfare, implying that applied researchers must either justify the mechanism behind peer effects or report welfare bounds rather than directly converting demand estimates into welfare conclusions."

- title: "Eisenschmidt, Ma, and Zhang (JFE, 2024) - Monetary Policy Transmission in Segmented Markets"
  file: "Eisenschmidt_Ma_Zhang_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses ECB MMSR transaction-level euro-area repo data, residualized OTC and inter-dealer repo rates, customer-dealer link measures, September 2019 ECB deposit facility rate cut passthrough tests, dealer net interest margin evidence, and a bargaining model with costly link formation and counterfactual platform/RRP access to show that segmented OTC repo customers receive worse rates and incomplete monetary-policy passthrough when they have few dealer relationships, implying that dealer market power and market access frictions can make monetary transmission inefficient and unequal even in collateralized money markets."

- title: "Sundaresan & Xiao (JFE, 2024) - Liquidity Regulation and Banks: Theory and Evidence"
  file: "Sundaresan_Xiao_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses U.S. LCR implementation, liquidity-ratio-gap exposure, bank balance-sheet data, CRA small-business lending, HMDA mortgage data, non-LCR spillover exposure, difference-in-differences regressions, and a model of liquidity transformation, fire-sale externalities, endogenous liquidity premia, and committed liquidity facilities to show that the LCR raises HQLA and reduces liquidity risk at regulated banks but crowds out illiquid lending and shifts liquidity transformation to non-LCR banks, implying that liquidity regulation improves on laissez-faire but needs price-based tools such as a CLF to reduce lending distortions and risk migration."

- title: "Baker, Johnson, and Kueng (JFE, 2024) - Financial Returns to Household Inventory Management"
  file: "Baker_Johnson_Kueng_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses NielsenIQ household scanner data, inferred consumer-goods inventory measures, SCF portfolio mapping, shelf-life and mover validation tests, calibrated stockpiling and bulk-purchase models, working-capital constraints, and reduced-form evidence on in-store savings and deal transactions to show that households hold economically large inventories and earn high declining returns from buying on deals and in bulk, implying that consumer-goods inventory is an illiquid nonfinancial portfolio asset that can rationally absorb scarce liquidity, especially for low-income and low-wealth households."

- title: "Charoenwong, Kimura, Kwan, and Tan (JFE, 2024) - Capital Budgeting, Uncertainty, and Misallocation"
  file: "Charoenwong_Kimura_Kwan_Tan_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses Japanese firm-level survey data on forecasts, investment plans, realized investment, productivity forecast errors, and plan deviations, together with empirical uncertainty facts, a three-stage model of information acquisition, plan formation, and costly ex-post investment adjustment, calibrated learning and flexibility parameters, and counterfactual productivity-loss exercises to show that capital budgeting reduces uncertainty-driven investment misallocation through both information allocation and investment flexibility, implying that internal planning systems are an intangible technology that materially improves firm value and aggregate productivity."

- title: "Friberg, Goldstein, and Hankins (JFE, 2024) - Corporate Responses to Stock Price Fragility"
  file: "Friberg_Goldstein_Hankins_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses Greenwood–Thesmar stock price fragility, Compustat corporate policy data, future misvaluation tests, firm and quarter-industry fixed-effect panel regressions, uncertainty and financing-constraint heterogeneity, current misvaluation controls, and BlackRock–BGI plus other asset-management merger shocks to show that firms exposed to nonfundamental ownership-flow price pressure hold more cash and reduce investment, R&D, repurchases, and short-term debt, implying that stock price fragility is an ex ante financing risk that shapes precautionary corporate policies before misvaluation occurs."

- title: "dAstous & Shore (JFE, 2024) - Human Capital Risk and Portfolio Choices: Evidence from University Admission Discontinuities"
  file: "dAstous_Shore_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses Danish university admission cutoffs, reach-versus-safety program discontinuities, program-level earnings-risk measures, IV/RD-style first stages, portfolio-choice regressions, robustness to bandwidth and controls, and a calibrated risky-labor-income portfolio model to show that exogenously higher permanent earnings volatility reduces stock-market participation and risky-asset shares, implying that human-capital risk causally lowers household financial risk-taking and that raw correlations are biased by selection into risky careers and risky portfolios."

- title: "Herkenhoff, Lise, Menzio, and Phillips (Econometrica, 2024) - Production and Learning in Teams"
  file: "Herkenhoff_Lise_Menzio_Phillips_Econometrica_2024.pdf"
  desc: "This note summarizes the paper, which uses LEHD matched employer-employee data, employment-unemployment-employment transitions, coworker wage regressions, sorting regressions, education/occupation/age heterogeneity, stayer-versus-mover comparisons, and a calibrated search model with team production and human-capital accumulation to show that workers learn substantially from higher-quality coworkers while lower-quality coworkers do not symmetrically reduce learning, implying that workplace sorting shapes both current production and future human-capital growth."

- title: "Charoenwong, Kowaleski, Kwan & Sutherland (JFE, 2024) - RegTech: Technology-driven compliance and its effects on profitability, operations, and market structure"
  file: "Charoenwong_Kowaleski_Kwan_Sutherland_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses Rule 17a-5 amendments for carrying broker-dealers, difference-in-differences designs, ERP/server/job-posting technology measures, IT-budget and profitability outcomes, complementary CRM and communications technologies, complaint and misconduct data, Tech Index IV tests, employee-switching regressions, and market-concentration analyses to show that compliance-driven RegTech investment raises costs and lowers profitability but also improves monitoring, customer outcomes, labor reallocation, acquisitions, and concentration, implying that financial regulation can reshape operations and market structure through technology adoption rather than only through direct compliance burdens."

- title: "Ersahin, Giannetti & Huang (JFE, 2024) - Trade Credit and the Stability of Supply Chains"
  file: "Ersahin_Giannetti_Huang_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses Compustat–FactSet production-network data, SEC bilateral customer-supplier disclosures, natural-disaster operating shocks, trade-credit measures, difference-in-differences regressions, customer switching-cost tests, disruption and reputation proxies, supply-chain dependence measures, financial-constraint interactions, and supply-chain risk extensions to show that shocked firms receive more trade credit from suppliers and extend more trade credit to customers to preserve relationships, implying that trade credit functions as a network contract that stabilizes supply chains after operating disruptions."

- title: "Jarosch, Oberfield & Rossi-Hansberg (Econometrica, 2021) - Learning From Coworkers"
  file: "Jarosch_Oberfield_RossiHansberg_Econometrica_2021.pdf"
  desc: "This note summarizes the paper, which uses German matched employer-employee data, establishment and occupation team definitions, coworker wage-distribution measures, reduced-form wage-growth regressions, switcher and mass-layoff robustness tests, and a structural competitive labor-market model with latent knowledge and learning functions to show that workers learn substantially more from higher-paid and same-occupation coworkers, implying that coworker learning is a significant component of compensation, shapes wage growth and inequality, and is constrained by how firms form teams."

- title: "Kim, Lee, Scharlemann & Vickery (JFE, 2024) - Intermediation Frictions in Debt Relief: Evidence from CARES Act Forbearance"
  file: "Kim_Lee_Scharlemann_Vickery_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses Ginnie Mae FHA/VA mortgage data, servicer fixed effects, borrower-credit bureau matches, CFPB complaints, high-forbearance servicer classifications, dynamic difference-in-differences, payment-behavior outcomes, credit-card balance tests, credit-score evidence, and lending crowd-out checks to study CARES Act mortgage forbearance—showing that servicer liquidity, size, and organizational form strongly shaped access to debt relief and that easier forbearance increased payment deferral without major credit-score harm, implying that broad public debt-relief programs can be materially filtered by private intermediary frictions."

- title: "Jones (AER: Insights, 2024) - The AI Dilemma: Growth versus Existential Risk"
  file: "Jones_AERInsight_2024.pdf"
  desc: "This note summarizes the paper, which develops calibrated static and dynamic welfare models of AI-enabled growth versus existential risk, using CRRA utility, value-of-life calibration, social discounting, mortality improvements, singularity cases, and existential-risk cutoffs to show that pure consumption gains can justify large AI risks under log utility but much less under bounded utility, while AI-driven longevity gains can substantially raise acceptable risk thresholds, implying that AI policy depends critically on how society values consumption, life, future generations, and mortality reduction."

- title: "Hayek (AER, 1945) - The Use of Knowledge in Society"
  file: "Hayek_AER_1945.pdf"
  desc: "This note summarizes the paper, which develops a conceptual theory of the economic problem as the use of dispersed, local, tacit, and changing knowledge, contrasts centralized and decentralized planning, explains prices as compressed signals of relative scarcity through examples such as tin, and critiques equilibrium analysis for assuming away the knowledge problem—showing that markets coordinate individual plans not by making everyone fully informed but by economizing on information, implying that prices are a communication mechanism for using knowledge no single mind possesses."

- title: "Fama & French (JF, 1992) - The Cross-Section of Expected Stock Returns"
  file: "Fama_French_JF_1992.pdf"
  desc: "This note summarizes the paper, which uses CRSP–Compustat nonfinancial stocks, size and beta portfolio sorts, book-to-market, leverage and earnings-price measures, NYSE breakpoints, and monthly Fama–MacBeth regressions to test the CAPM cross-section—showing that market beta has little power to explain average returns once size and book-to-market are considered, while small firms and high book-to-market firms earn higher returns, implying that expected stock returns are better captured by size and value characteristics than by single-factor market beta."

- title: "Ben-David, Li, Rossi, and Song (RFS, 2022) - What Do Mutual Fund Investors Really Care About?"
  file: "BenDavid_Li_Rossi_Song_RFS.pdf"
  desc: "This note summarizes the paper, which uses active U.S. equity fund flows, passive index-fund falsification tests, Morningstar ratings, unadjusted and model-adjusted performance measures, aggregate and cross-sectional flow regressions, horse races among alpha and simple return signals, the 2002 Morningstar rating reform, and replications of prior learning tests to show that mutual fund investors mainly chase salient unadjusted returns and star ratings rather than sophisticated asset-pricing alphas, implying that the flow-performance relation reflects simple performance chasing more than Bayesian learning about manager skill."

- title: "McLean & Pontiff (JF, 2016) - Does Academic Research Destroy Stock Return Predictability?"
  file: "Mclean_Pontiff_JF_2015.pdf"
  desc: "This note summarizes the paper, which uses 97 published cross-sectional stock-return predictors, replicated long-short portfolio returns, in-sample/post-sample/post-publication period splits, decay regressions, in-sample strength interactions, time-trend and persistence controls, arbitrage-cost measures, trading-activity tests, and comovement regressions to study whether academic research changes predictability—showing that anomaly returns fall after the original sample ends and fall further after publication while trading activity rises and published predictors comove more, implying that both statistical bias and publication-informed arbitrage reduce but do not fully eliminate stock-return predictability."

- title: "Hou, Xue, and Zhang (RFS, 2015) - Digesting Anomalies: An Investment Approach"
  file: "Hou_Xue_Zhang_RFS_2015.pdf"
  desc: "This note summarizes the paper, which develops and tests a four-factor q-factor model based on market, size, investment, and profitability factors across nearly 80 anomalies, NYSE-breakpoint anomaly portfolios, factor regressions, GRS tests, factor-loading diagnostics, size-B/M portfolios, and Sharpe-ratio comparisons—showing that many anomaly returns are absorbed by investment and profitability exposures, though short-horizon momentum and some accrual effects remain difficult, implying that the anomaly zoo can be partly organized by a compact investment-based asset-pricing framework."

- title: "Stambaugh, Yu, and Yuan (JF, 2015) - Arbitrage Asymmetry and the Idiosyncratic Volatility Puzzle"
  file: "Stambaugh_Yu_Yuan_JF_2015.pdf"
  desc: "This note summarizes the paper, which uses U.S. stock returns, Ang et al.-style idiosyncratic volatility, a composite mispricing measure from 11 anomalies, double sorts by mispricing and IVOL, institutional ownership as a shorting-ease proxy, Baker–Wurgler sentiment, predictive sentiment regressions, macro controls, and market-cap exclusion tests to explain the IVOL puzzle—showing that high-IVOL overpriced stocks underperform strongly while high-IVOL underpriced stocks outperform more weakly, implying that the negative IVOL-return relation reflects mispricing protected by asymmetric limits to arbitrage, especially short-sale constraints."

- title: "Welch & Goyal (RFS, 2008) - A Comprehensive Look at the Empirical Performance of Equity Premium Prediction"
  file: "Welch_Goyal_RFS_2008.pdf"
  desc: "This note summarizes the paper, which evaluates a broad set of published equity-premium predictors using common data definitions, recursive out-of-sample forecasting, forecast-error statistics, bootstrap inference, Campbell–Thompson restrictions, long-horizon tests, persistence corrections, and encompassing regressions—showing that most predictors perform poorly or unstably out of sample relative to the historical average benchmark, implying that aggregate return predictability is fragile and should be judged by real-time forecasting performance rather than in-sample fit."

- title: "Adrian, Etula, and Muir (JF, 2014) - Financial Intermediaries and the Cross-Section of Asset Returns"
  file: "Adrian_Etula_Muir_JF_2014.pdf"
  desc: "This note summarizes the paper, which constructs broker-dealer leverage shocks from Flow of Funds balance-sheet data and tests an intermediary-based stochastic discount factor using cross-sectional asset-pricing regressions, equity and Treasury test portfolios, benchmark factor comparisons, random-factor simulations, a tradable leverage-mimicking portfolio, leverage-beta sorts, and betting-against-beta portfolios—showing that intermediary leverage is a priced funding-condition factor that explains a broad cross-section of equity and bond returns, implying that modern asset prices are shaped by financial intermediaries’ balance-sheet constraints rather than only representative-household risk."

- title: "Fama & French (JF, 2010) - Luck versus Skill in the Cross-Section of Mutual Fund Returns"
  file: "Fama_French_JF_2010.pdf"
  desc: "This note summarizes the paper, which uses CRSP active U.S. equity mutual fund data, CAPM/Fama–French/Carhart alpha estimates, net-versus-gross return comparisons, AUM subsamples, joint bootstrap simulations under zero true alpha, injected-alpha skill-dispersion tests, and comparisons with alternative bootstrap/survival rules to distinguish luck from skill—showing that active funds have near-zero gross alpha but negative net alpha after costs, while only modest skill appears in the gross-return tails, implying that most investors cannot reliably identify managers who generate abnormal returns sufficient to cover active-management expenses."

- title: "Banerjee, Breza, Chandrasekhar, Duflo, Jackson and Kinnan (RES, 2024) - Changes in Social Network Structure in Response to Exposure to Formal Credit Markets"
  file: "Banerjee_Breza_Chandrasekhar_Duflo_Jackson_Kinnan_RES_2024.pdf"
  desc: "This note summarizes the paper, which combines Karnataka difference-in-differences panel network data, Hyderabad randomized microfinance entry, random-forest borrower-type classification, graph-level density tests, link- and triangle-level evolution regressions, borrowing-pattern evidence, risk-sharing regressions, and a model of undirected socializing effort to show that formal credit exposure weakens social networks, especially LL links and LLL triangles among households unlikely to borrow, implying that market expansion can crowd out informal social capital and reduce insurance for non-participants."

- title: "Gieczewski & Kosterina (RES, 2024) - Experimentation in Endogenous Organizations"
  file: "Gieczewski_Kosterina_RES_2024.pdf"
  desc: "This note summarizes the paper, which develops a theory of collective experimentation with endogenous organizational membership, Bayesian learning from failures, exit-based member selection, median-member voting, perpetual versus finite experimentation equilibria, public-news and heterogeneous-payoff extensions, and shareholder-control comparisons to show that bad news can make organizations more committed to failing risky policies by causing sceptics to exit and leaving optimists in control, implying that exit can undermine voice and generate excessive organizational persistence or radicalization."

- title: "Loughran & McDonald (JF, 2011) - When Is a Liability Not a Liability? Textual Analysis, Dictionaries, and 10-Ks"
  file: "Loughran_McDonald_JF_2011.pdf"
  desc: "This note summarizes the paper, which uses 50,115 10-K filings, Harvard-IV versus finance-specific word lists, proportional and TF-IDF word counts, filing-window return regressions, MD&A-only tests, additional uncertainty/litigious/modal dictionaries, fraud and internal-control logit models, and standardized unexpected earnings tests to show that generic sentiment dictionaries misclassify common financial terms while finance-specific dictionaries better capture economically meaningful tone, implying that credible financial textual analysis requires domain-specific word lists and careful term weighting."

- title: "Bybee, Kelly, Manela, and Xiu (JF, 2024) - Business News and Business Cycles"
  file: "Bybee_Kelly_Manela_Xiu_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses roughly 800,000 Wall Street Journal articles, LDA topic modeling, monthly topic-attention indices, active-set lasso reconstruction, text-augmented VARs, group-lasso topic selection, online-LDA robustness, narrative retrieval, and market-timing regressions to show that business news topics—especially recession attention—track and forecast macroeconomic, financial, and industry outcomes, implying that high-dimensional news text can serve as interpretable economic data for measuring business-cycle narratives and predicting macro-finance dynamics."

- title: "Cetorelli & Goldberg (JF, 2012) - Banking Globalization and Monetary Transmission"
  file: "Cetorelli_Goldberg_JF_2012.pdf"
  desc: "This note summarizes the paper, which uses U.S. Call Report bank data, global-versus-domestic bank classifications, liquidity-based lending-channel regressions, small-affiliate comparisons, Net Due internal funding measures, foreign-office lending tests, and crisis-period evidence to study how banking globalization changes monetary transmission—showing that global banks use cross-border internal capital markets to insulate U.S. domestic lending from monetary tightening while reducing foreign-office lending, implying that monetary policy shocks are not eliminated by global banking but transmitted internationally through banks’ internal balance-sheet networks."

- title: "Houston, Lin, and Ma (JF, 2012) - Regulatory Arbitrage and International Bank Flows"
  file: "Houston_Lin_Ma_JF_2012.pdf"
  desc: "This note summarizes the paper, which uses BIS bilateral foreign-claims data, Barth–Caprio–Levine bank-regulation measures, aggregate inflow and outflow regressions, bilateral gravity models, nonparametric regulation-change plots, IV specifications, institutional-quality splits, and bank-level foreign-affiliate probits to study regulatory arbitrage in international banking—showing that bank capital flows out of stricter regulatory regimes and into less regulated but institutionally strong destinations, implying that domestic bank regulation can be undermined by cross-border reallocations unless supported by international coordination."

- title: "Cornaggia & Cornaggia (RFS, 2013) - Estimating the Costs of Issuer-Paid Credit Ratings"
  file: "Cornaggia_Cornaggia_RFS_2013.pdf"
  desc: "This note summarizes the paper, which compares Moody’s issuer-paid credit ratings with Rapid Ratings’ subscriber-paid Financial Health Ratings using overlapping issuer/bond samples, rating-scale mappings, reversal rates, timeliness gaps, loss-avoidance price tests, calibrated FHR thresholds, and accuracy ratios to estimate the cost of ratings stability—showing that Moody’s ratings are less volatile but much slower to identify default risk, while Rapid Ratings gives earlier downgrade signals that preserve bond value and better rank future defaults, implying that issuer-paid ratings’ stability bias can create economically meaningful delayed-warning costs for investors and rating-dependent contracts."

- title: "Kisgen (JF, 2006) - Credit Ratings and Capital Structure"
  file: "Kisgen_JF_2006.pdf"
  desc: "This note summarizes the paper, which uses rated Compustat firms, net debt-minus-equity issuance, plus/minus rating proximity, credit-score proximity within rating categories, broad-rating and investment-grade threshold tests, and nested pecking-order/tradeoff regressions to study whether credit ratings directly shape capital structure—showing that firms near upgrades or downgrades issue less debt relative to equity than otherwise similar firms, implying that credit ratings are not only outcomes of financing choices but discrete managerial constraints that affect corporate debt issuance."

- title: "Duflo & Saez (QJE, 2003) - The Role of Information and Social Interactions in Retirement Plan Decisions: Evidence from a Randomized Experiment"
  file: "Duflo_Saez_QJE_2003.pdf"
  desc: "This note summarizes the paper, which uses a randomized two-stage encouragement experiment at a university benefits fair, with department-level treatment, individual $20 attendance letters, reduced-form treatment comparisons, IV interpretations, complier-type decompositions, and heterogeneous-effect tests to study information and social interactions in retirement saving—showing that letters strongly increase fair attendance but department-level exposure raises TDA enrollment almost as much as direct treatment, implying that retirement-plan decisions respond to socially mediated information and attention channels, even though the exact mechanism is hard to separate."

- title: "Di Maggio, Kermani, and Palmer (RES, 2020) - How Quantitative Easing Works: Evidence on the Refinancing Channel"
  file: "DiMaggio_Kermani_Palmer_RES_2020.pdf"
  desc: "This note summarizes the paper, which uses CRISM mortgage-borrower data, conforming-versus-jumbo segmentation around the GSE loan limit, QE event windows, interest-rate and refinancing-volume difference-in-differences, loan-level prepayment tests, bank-distress heterogeneity, LTV bunching, and borrower consumption event studies to show that QE1 agency MBS purchases lowered conforming mortgage rates, increased refinancing, reduced household interest payments, and raised durable consumption, implying that unconventional monetary policy works most strongly when asset purchases target segmented markets directly linked to household borrowing costs and refinancing access."

- title: "Griffin & Tang (JF, 2012) - Did Subjectivity Play a Role in CDO Credit Ratings?"
  file: "Griffin_Tang_JF_2012.pdf"
  desc: "This note summarizes the paper, which uses direct data from a major credit rating agency’s CDO model outputs, final AAA tranche sizes, AAA adjustment measures, default-rate criterion deviations, downgrade regressions, hazard models, Monte Carlo comparisons, and valuation calculations to test whether subjectivity inflated structured-finance ratings—showing that actual AAA fractions systematically exceeded model-implied AAA fractions, especially when the model supported little AAA, and that larger adjustments predicted worse subsequent downgrades, implying that CDO rating inflation reflected discretionary rating-process choices rather than purely mechanical model outputs or superior qualitative information."

- title: "Barber & Odean (QJE, 2001) - Boys Will Be Boys: Gender, Overconfidence, and Common Stock Investment"
  file: "Barber_Odean_QJE_2001.pdf"
  desc: "This note summarizes the paper, which uses large discount-brokerage household trading records, gender as a proxy for overconfidence, turnover measures, own-benchmark abnormal returns, married-versus-single comparisons, demographic controls, risk-adjusted return regressions, and buy-versus-sell security-selection tests to show that men trade substantially more than women and lose more net performance from trading, implying that overconfidence can generate excessive costly trading rather than superior investment skill."

- title: "Seru, Shumway, and Stoffman (RFS, 2010) - Learning by Trading"
  file: "Seru_Shumway_Stoffman_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses Finnish individual-investor transaction and holdings data, purchase-level return measures, investor-year disposition-effect estimates, experience measures, fixed effects, survival/attrition corrections, heterogeneity tests, trading-intensity regressions, and risk-taking analysis to study whether investors learn by trading—showing that simple experience regressions overstate learning because low-performing traders exit, while surviving investors trade more intensively, reduce costly disposition behavior, and take less factor risk, implying that improved performance among experienced traders reflects both learning by doing and selection through learning about ability."

- title: "Jiang, Lustig, Van Nieuwerburgh & Xiaolan (JFE, 2026) - Manufacturing Risk-Free Government Debt"
  file: "Jiang_Lustig_Nieuwerburgh_Xiaolan_JFE_2026.pdf"
  desc: "This note summarizes the paper, which combines government debt valuation, return-beta restrictions, U.S. debt/GDP dynamics, a calibrated stochastic discount factor, model-implied primary-surplus paths, realized and CBO projected surplus comparisons, convenience-yield extensions, and simulation-based robustness tests to study what fiscal policy must do to manufacture risk-free government debt—showing that making Treasury debt risk-free requires taxpayers to absorb aggregate risk through future surpluses far above observed U.S. fiscal paths after the GFC and COVID, implying that treating government debt as risk-free can overstate fiscal capacity because aggregate risk must be borne either by taxpayers or by bondholders."

- title: "Berger, Milbradt, Tourre, and Vavra (AER: Insights, 2025) - Optimal Mortgage Refinancing with Inattention"
  file: "Berger_Milbradt_Tourre_Vavra_AERInsight_2025.pdf"
  desc: "This note summarizes the paper, which develops an optimal fixed-rate mortgage refinancing model with fixed costs, Poisson attention, Brownian mortgage-rate dynamics, closed-form rate-gap thresholds, ergodic rate-gap distributions, and a sufficient-statistic mapping to Fannie Mae SFLP data—showing that inattentive borrowers should refinance at lower rate gaps when they finally pay attention and that this benchmark explains many apparent refinancing “mistakes,” implying that household refinancing behavior should be evaluated against an inattention-adjusted optimal rule rather than the perfect-attention ADL threshold."

- title: "Opp, Opp, and Harris (JFE, 2013) - Rating agencies in the face of regulation"
  file: "Opp_Opp_Harris_JFE_2013.pdf"
  desc: "This note summarizes the paper, which develops a theory of credit rating agencies under rating-contingent regulation where agencies choose costly information production, disclosure inflation, and fees—showing that when regulatory benefits attached to A-ratings are large enough, agencies switch from truthful certification to broad rating inflation with zero information acquisition, implying that rating failures can arise from the interaction of public regulation and private certification incentives rather than only from naive investors or issuer-pays conflicts."

- title: "Blickle, Brunnermeier & Luck (RFS, 2024) - Who Can Tell Which Banks Will Fail?"
  file: "Blickle_Brunnermeier_Luck_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses newly digitized monthly balance sheets from the 1931 German banking crisis, deposit-flow decompositions by regular versus interbank depositors, failure-prediction regressions, AUC tests, interbank-market functioning regressions, foreign-deposit exposure, and stock-price evidence to study who could identify failing banks—showing that regular depositors ran broadly while interbank depositors selectively withdrew from banks that later failed and continued lending to surviving banks, implying that interbank markets can reveal superior information and allocate liquidity rather than simply freeze during systemic runs."

- title: "Acharya, Engle, Jager & Steffen (RFS, 2024) - Why Did Bank Stocks Crash during COVID-19?"
  file: "Acharya_Engle_Jager_Steffen_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses U.S. public-bank stock returns, pre-COVID unused credit-line commitments, balance-sheet liquidity risk, gross and net credit-line drawdowns, borrower COVID-exposure controls, lending regressions, repayment-based recovery tests, credit-line fee pricing, and stress-test simulations to explain the COVID bank-stock crash—showing that banks with larger contingent credit-line exposure lost more value because drawdowns converted off-balance-sheet commitments into capital-absorbing loans, implying that credit lines are systemic put-option-like liabilities that should be stress-tested for aggregate drawdown risk."

- title: "Francis, Hasan, and Hunter (JFE, 2008) - Can hedging tell the full story? Reconciling differences in United States aggregate- and industry-level exchange rate risk premium"
  file: "Francis_Hasan_Hunter_JFE_2008.pdf"
  desc: "This note summarizes the paper, which uses 36 U.S. industry portfolios, Fama–French equity factors, MAJOR and OITP currency factors, lagged instruments, multivariate GARCH time-varying betas, conditional expected factor returns, cross-sectional industry characteristics, and macro time-series determinants to reconcile weak industry-level exchange-rate exposure evidence with aggregate currency-risk premia—showing that currency risk is significantly priced for all industries and accounts for about 11.7% of total absolute risk premium, implying that prior null results reflect overly restrictive unconditional methods more than complete corporate hedging."

- title: "Baqaee & Farhi (Econometrica, 2024) - Networks, Barriers, and Trade"
  file: "Baqaee_Farhi_Econometrica_2024.pdf"
  desc: "This note summarizes the paper, which develops a general sufficient-statistics framework for open-economy production networks with trade barriers, tariffs, markups, iceberg costs, nominal rigidities, and other wedges—showing how real GDP, welfare, prices, sales shares, and second-order trade losses can be decomposed using input–output shares, Domar weights, elasticities, factor-income shares, and wedge distortions, implying that the cost of trade barriers depends not only on trade shares but also on supply-chain propagation, substitution patterns, factor-market redistribution, and nominal frictions."

- title: "Acemoglu, Ozdaglar, and Tahbaz-Salehi (AER, 2015) - Systemic Risk and Stability in Financial Networks"
  file: "Acemoglu_Ozdaglar_TahbazSalehi_AER_2015.pdf"
  desc: "This note summarizes the paper, which develops a financial-network model with interbank debt, senior outside creditors, costly liquidation, payment-equilibrium clearing, ring-versus-complete benchmark networks, convex diversification, shock-size regimes, harmonic distance, and bottleneck measures to study systemic risk—showing that dense interbank networks diversify small shocks and improve stability, but transmit large shocks broadly and become fragile, implying that financial connectivity is “robust-yet-fragile” and that regulation must account for shock size, liability seniority, and network position rather than simply promoting more or fewer links."

- title: "Ginzinger, Li, Niessen-Ruenzi & Wang (SSRN, 2026) - The Motherhood Penalty in the Mutual Fund Industry"
  file: "Ginzinger_Li_NiessenRuenzi_Wang_SSRN_2026.pdf"
  desc: "This note summarizes the paper, which uses Chinese mutual fund maternity-leave disclosure rules as a dated childbirth event, compares new mothers with their pre-birth co-managers on the same funds, estimates event studies and pooled difference-in-differences models for participation, leadership, AUM, and portfolio responsibility, tests fund performance around pregnancy and post-leave periods with fund-manager-month regressions, exploits team-versus-single management interactions, examines investor flows, institutional ownership, site visits, online/offline information acquisition, trading behavior, pregnancy-timing selection, returner versus non-returner differences, parallel trends, and top-performer heterogeneity—showing that motherhood causes large and persistent career losses despite only temporary performance declines and no clear investor punishment, implying that the penalty operates mainly through post-leave retention and allocation of career capital rather than sustained observable productivity loss."

- title: "Ostrovsky (AER, 2008) - Stability in Supply Chain Networks"
  file: "Ostrovsky_AER_2008.pdf"
  desc: "This note summarizes the paper, which extends stable matching theory to vertical supply-chain networks with bilateral contracts, upstream–downstream chains, same-side substitutability, and cross-side complementarity—showing that chain-stable networks exist, can be constructed through a fixed-point T-algorithm, and have supplier- and consumer-optimal extremes with standard comparative statics, implying that the core logic of two-sided matching survives in richer production networks when blocking deviations follow the supply-chain direction."

- title: "Freund & Özden (AER, 2008) - Trade Policy and Loss Aversion"
  file: "Freund_Ozden_AER_2008.pdf"
  desc: "This note summarizes the paper, which embeds reference dependence and loss aversion into a Grossman–Helpman lobbying model and uses U.S. hot-rolled steel price evidence to explain declining-industry protection—showing that when world price declines push an industry below its reference point, governments may use compensating protection to stabilize domestic prices, but protection eventually weakens as the industry shrinks, implying that behavioral loss aversion can explain contingent trade barriers better than standard lobbying models alone."

- title: "Farrokhi & Lashkaripour (Econometrica, 2025) - Can Trade Policy Mitigate Climate Change?"
  file: "Farrokhi_Lashkaripour_Econometrica_2025.pdf"
  desc: "This note summarizes the paper, which uses a calibrated multi-country, multi-industry general equilibrium trade model with fossil-energy supply chains, carbon accounting, unilateral optimal tax formulas, global cooperative pricing, and climate-club counterfactuals to evaluate whether trade policy can mitigate climate change—showing that optimally designed carbon border taxes add only small emissions reductions beyond noncooperative carbon taxes, while climate clubs using trade penalties as off-equilibrium enforcement can sustain much higher carbon prices and larger emissions cuts, implying that trade policy is weak as a substitute for direct carbon pricing but valuable as an enforcement device for climate cooperation."

- title: "Chevalier & Ellison (QJE, 1999) - Career Concerns of Mutual Fund Managers"
  file: "Chevalier_Ellison_QJE_1999.pdf"
  desc: "This note summarizes the paper, which uses Morningstar mutual fund manager data, Jensen alpha, manager age, termination and promotion outcomes, portfolio-risk and sector-deviation measures, investor-flow tests, and career-outcome regressions to study how career concerns shape delegated portfolio management—showing that younger managers face stronger downside termination risk for poor performance and failed unconventional choices, take less unsystematic risk, and herd more toward conventional portfolios, implying that internal labor-market incentives can make fund managers conservative even when bold active bets might generate upside."

- title: "Arieli, Babichenko, Peretz, and Young (Econometrica, 2020) - The Speed of Innovation Diffusion in Social Networks"
  file: "Arieli_Babichenko_Peretz_Young_Econometrica_2020.pdf"
  desc: "This note summarizes the paper, which develops a topology-free theory of innovation diffusion in arbitrary, directed, irregular, and time-varying social networks under perturbed best-response coordination dynamics—showing that if the response function has a supporting line with positive intercept, random experimentation plus imitation guarantees bounded expected time to reach any target adoption share below the line’s fixed point, implying that diffusion speed can be bounded from behavioral primitives even when the social network itself is unknown."

- title: "Bertrand, Goldin & Katz (AEJ Applied Economics, 2010) - Dynamics of the Gender Gap for Young Professionals in the Financial and Corporate Sectors"
  file: "Bertrand_Goldin_Katz_AEJAE_2010.pdf"
  desc: "This note summarizes the paper, which uses University of Chicago Booth MBA survey and administrative records, person-year earnings histories, MBA coursework and GPA controls, labor-supply measures, spousal-income variation, and first-birth event studies to explain the rapid emergence of gender earnings gaps among elite professionals—showing that men and women start with similar earnings but diverge sharply because motherhood is associated with career interruptions, shorter hours, and family-compatible job choices in high-powered finance and corporate labor markets, implying that equal entry credentials do not prevent large dynamic gender gaps when career continuity and long hours are highly rewarded."

- title: "Dimopoulos & Sacchetto (JFE, 2017) - Merger activity in industry equilibrium"
  file: "Dimopoulos_Sacchetto_JFE_2017.pdf"
  desc: "This note summarizes the paper, which builds a calibrated dynamic industry-equilibrium model with heterogeneous firms, endogenous merger search, entry, exit, investment, aggregate demand shocks, and merger synergies to study how M&A affects productive efficiency—showing that mergers raise average productivity mainly through realized synergies but also by changing entry and exit incentives, implying that merger policy and entry policy cannot be evaluated separately because takeover options reshape industry composition, business-cycle dynamics, and productivity outcomes."

- title: "Kinnan & Townsend (AER P&P, 2012) - Kinship and Financial Networks, Formal Financial Access, and Risk Reduction"
  file: "Kinnan_Townsend_AERPP_2012.pdf"
  desc: "This note summarizes the paper, which uses Townsend Thai Monthly Survey household data, village financial networks, direct and indirect bank-access measures, kinship ties, consumption-smoothing regressions, and investment-cash-flow sensitivity tests to show that formal financial networks, including indirect paths to banks, smooth consumption shocks, while kinship networks reduce investment constraints for large opportunities, implying that different networks insure different household risks and that direct bank use understates the reach of formal finance."

- title: "Farronato and Fradkin (AER, 2022) - The Welfare Effects of Peer Entry: The Case of Airbnb and the Accommodation Industry"
  file: "Farronato_Fradkin_AER_2022.pdf"
  desc: "This note summarizes the paper, which uses Airbnb platform data, STR hotel data, travel-demand shifters, reduced-form entry and hotel-outcome regressions, and a structural model of differentiated accommodation demand, Cournot hotel supply, and elastic peer-host supply to estimate the welfare effects of Airbnb entry—showing that peer hosts provide flexible capacity when hotel capacity is scarce, generating large consumer and host surplus while reducing hotel profits, implying that platform-enabled peer production is most valuable when it mobilizes idle supply during peak-demand periods."

- title: "Brunetti, Harris, Mankad, and Michailidis (JFE, 2019) - Interconnectedness in the Interbank Market"
  file: "Brunetti_Harris_Mankad_Michailidis_JFE_2019.pdf"
  desc: "This note summarizes the paper, which compares European bank interconnectedness measured by stock-return Granger-causality correlation networks and observed e-MID interbank lending networks—showing that during the financial crisis banks became more connected in equity-return space but less connected in actual lending relationships, while physical networks responded more quickly to ECB liquidity interventions and forecasted macro-financial stress, implying that systemic comovement and funding-liquidity breakdown are distinct forms of financial interconnectedness that regulators must monitor jointly."

- title: "Hong & Xu (JFE, 2019) - Inferring Latent Social Networks from Stock Holdings"
  file: "Hong_Xu_JFE_2019.pdf"
  desc: "This note summarizes the paper, which develops a portfolio-choice and overdispersed network-count model to infer fund managers’ latent city-level social connections from mutual fund stock holdings—showing that managers’ holdings reveal non-random city-specific networks, that inferred relative propensity to connect predicts observed alumni links with corporate officials, and that high-connection city positions outperform low-connection positions, implying that portfolio holdings can reveal hidden information networks that are both socially meaningful and return-relevant."

- title: "Fleiner, Jagadeesan, Janko & Teytelboym (Econometrica, 2019) - Trading Networks with Frictions"
  file: "Fleiner_Jagadeesan_Janko_Teytelboym_Econometrica_2019.pdf"
  desc: "This note summarizes the paper, which develops a theory of trading networks with discrete bilateral trades, continuous prices, and distortionary frictions such as taxes or commissions—showing that competitive equilibria exist under full substitutability and bounded compensating variations, may be Pareto-inefficient under frictions, and coincide with trail-stable outcomes under bounded willingness to pay, implying that trail stability is the appropriate cooperative benchmark for price-supported network trade when standard core or stability concepts are too strong."

- title: "Mossel, Sly, and Tamuz (Econometrica, 2015) - Strategic Learning and the Topology of Social Networks"
  file: "Mossel_Sly_Tamuz_Econometrica_2015.pdf"
  desc: "This note summarizes the paper, which studies strategic social learning by forward-looking agents on directed networks and identifies (d,L)-egalitarian topology—bounded outdegree plus bounded return paths—as the condition under which every equilibrium aggregates private information—showing that agents eventually agree and, in connected egalitarian networks, almost surely learn the true state, while nonegalitarian networks with elites, bottlenecks, or unbounded influence can block learning, implying that information aggregation depends on network topology rather than connectedness alone."

- title: "Grullon, Underwood, and Weston (JFE, 2014) - Comovement and Investment Banking Networks"
  file: "Grullon_Underwood_Weston_JFE_2014.pdf"
  desc: "This note summarizes the paper, which uses IPO and SEO underwriting relationships, same-bank and adjacent-bank portfolios, SEO switcher designs, institutional ownership, Nasdaq market-making, turnover comovement, and forced-switch robustness tests to study whether investment banks create investor networks that affect secondary-market prices—showing that firms comove more with stocks linked to the same lead underwriter and that comovement, ownership, and trading migrate toward a new bank when firms switch underwriters, implying that underwriters act not only as issuance certifiers but also as investor-network hubs shaping stock returns and trading behavior."

- title: "Fernandez-Villaverde, Hurtado & Nuno (Econometrica, 2023) - Financial Frictions and the Wealth Distribution"
  file: "FernandezVillaverde_Hurtado_Nuno_Econometrica_2023.pdf"
  desc: "This note summarizes the paper, which builds and solves a continuous-time heterogeneous-agent macro-finance model with financial experts, borrowing-constrained households, noncontingent bonds, idiosyncratic labor risk, and neural-network nonlinear perceived laws of motion—showing that household precautionary saving and expert leverage interact to create endogenous aggregate risk, multiple stochastic steady states, debt supercycles, state-dependent amplification, and wealth-distribution effects, implying that financial frictions and household heterogeneity jointly make the wealth distribution a central state variable for macro-financial instability."

- title: "Bourlès, Bramoullé, and Perez-Richet (Econometrica, 2017) - Altruism in Networks"
  file: "Bourles_Bramoulle_PerezRichet_Econometrica_2017.pdf"
  desc: "This note summarizes the paper, which develops a network model of altruistic private transfers where agents care about neighbors’ utility and choose bilateral gifts—showing that Nash equilibria solve a concave potential problem, transfers flow through least-cost altruistic paths, equilibrium transfer graphs are acyclic and generically forests, and redistribution or stronger altruistic links can sometimes increase inequality, implying that private redistribution depends on the geometry of the altruism network rather than only on income gaps or direct caring ties."

- title: "Hou, Sarno & Ye (JFE, 2025) - The Trade Imbalance Network and Currency Returns"
  file: "Hou_Sarno_Ye_JFE_2025.pdf"
  desc: "This note summarizes the paper, which extends a limited-commitment intermediary model to a directed global trade-imbalance network and builds a Leontief-inverse Centrality-Based Characteristic for currency pricing—showing that currencies more central in the network of global deficits and surpluses earn higher excess returns not because of their own imbalance alone but because of neighborhood and indirect imbalance exposures, implying that currency risk premia reflect network-based balance-sheet complexity faced by global financiers."

- title: "Ahern (JFE, 2017) - Information Networks: Evidence from Illegal Insider Trading Tips"
  file: "Ahern_JFE_2017.pdf"
  desc: "This note summarizes the paper, which uses hand-collected SEC and DOJ illegal insider-trading cases, direct tipper-tippee communication links, social-relationship and geographic data, event returns, network centrality, price-impact regressions, and individual trading-gain tests to study how private financial information diffuses through social networks—showing that valuable tips flow through trusted family, friendship, business, and local ties before reaching professional traders, gradually move prices toward fundamentals, and generate larger gains for more central traders, implying that information transmission in financial markets is fundamentally shaped by social network structure."

- title: "Hendricks, Piccione, and Tan (Econometrica, 1999) - Equilibria in Networks"
  file: "Hendricks_Piccione_Tan_Econometrica_1999.pdf"
  desc: "This note summarizes the paper, which models competing carriers’ two-stage choice of transport networks and downstream competition over city-pair travel markets to explain when hub-spoke structures emerge—showing that economies of density make point-to-point service unprofitable, aggressive competition can support monopoly hub-spoke equilibria, softer competition can support competing hub-spoke or even nonhub equilibria, and stronger aversion to long paths restores hub-spoke structure, implying that network architecture is shaped jointly by cost economies, path-length preferences, and competitive intensity."

- title: "Board & Meyer-ter-Vehn (Econometrica, 2021) - Learning Dynamics in Social Networks"
  file: "Board_MeyerterVehn_Econometrica_2021.pdf"
  desc: "This note summarizes the paper, which develops a Bayesian model of innovation diffusion in large social networks and reduces complex updating over neighbors’ adoption decisions to tractable social-learning ODEs—showing that directed tree-like links improve learning and welfare by providing independent information, while undirected links, clustering, and correlation neglect can reduce learning through self-reflection, redundant signals, and excessive pessimism after no adoption, implying that network density helps only when links add independent information rather than correlated feedback."

- title: "Garmaise & Moskowitz (RFS, 2003) - Informal Financial Networks: Theory and Evidence"
  file: "Garmaise_Moskowitz_RFS_2003.pdf"
  desc: "This note summarizes the paper, which develops and tests a theory of informal financial networks in U.S. commercial real estate where brokers repeatedly refer clients to banks and banks reciprocate with faster or easier loan evaluation—using transaction-level broker, property, financing, broker-bank concentration, relationship longevity, herding, loyalty, alternative financing, and price evidence—to show that brokered deals are more likely to obtain new bank mortgage financing, especially when brokers have strong, loyal, and long-standing bank relationships, implying that credit access depends not only on borrower fundamentals and bank balance sheets but also on relationship capital embedded in nonfinancial intermediary networks."

- title: "Fisher, Gavazza, Liu, Ramadorai & Tripathy (JFE, 2024) - Refinancing Cross-Subsidies in the Mortgage Market"
  file: "Fisher_Gavazza_Liu_Ramadorai_Tripathy_JFE_2024.pdf"
  desc: "This note summarizes the paper, which uses UK FCA administrative mortgage data and a structural model of dual-rate mortgage demand and refinancing to measure hidden cross-subsidies from refinancing frictions—showing that inactive borrowers who remain on high reset rates subsidize active refinancers who obtain low discounted rates, with poorer households and less wealthy regions paying more while richer borrowers benefit more, implying that household-finance product design can create regressive redistribution even without explicit fees or taxes."

- title: "Mian & Sufi (QJE, 2009) - The Consequences of Mortgage Credit Expansion: Evidence from the U.S. Mortgage Default Crisis"
  file: "Mian_Sufi_QJE_2009.pdf"
  desc: "This note summarizes the paper, which uses ZIP-code-level mortgage, credit-score, income, default, house-price, and securitization data to study the pre-crisis U.S. mortgage credit boom—showing that high-subprime-share neighborhoods received disproportionate mortgage credit growth from 2002 to 2005 despite weak income and employment growth, then experienced sharp default increases after 2005, implying that the mortgage crisis was driven by a securitization-linked credit supply expansion to high-risk borrowers rather than by improving borrower fundamentals. "

- title: "Gao & Huang (RFS, 2020) - Informing the Market: The Effect of Modern Information Technologies on Information Production"
  file: "Gao_Huang_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses the staggered rollout of SEC EDGAR, household brokerage trades around earnings announcements, internet-user and public-information-reliance splits, analyst forecast data, market reactions to forecast revisions, and pricing-efficiency tests to study whether electronic disclosure access changes information production—showing that EDGAR makes individual-investor trades more informative, increases analyst coverage and forecast accuracy, strengthens market responses to analyst revisions, and improves price efficiency, implying that modern information technology can crowd in outsider research rather than merely disseminate existing public information. "

- title: "Favara & Imbs (AER, 2015) - Credit Supply and the Price of Housing"
  file: "Favara_Imbs_AER_2015.pdf"
  desc: "This note summarizes the paper, which uses post-1994 interstate bank-branching deregulation, HMDA mortgage-credit data, placebo lender comparisons, bank-location tests, housing-supply elasticity heterogeneity, IV house-price regressions, and bank balance-sheet evidence to identify a mortgage credit-supply channel—showing that deregulation expands commercial-bank mortgage lending, lowers funding and mortgage costs, and raises house prices especially in supply-inelastic counties, implying that housing booms can be driven by changes in bank credit supply rather than only by borrower demand or expectations. "

- title: "Cao, Jiang, Wang & Yang (JFE, 2024) - From Man vs. Machine to Man + Machine: The art and AI of stock analyses"
  file: "Cao_Jiang_Wang_Yang_JFE_2024.pdf"
  desc: "This note summarizes the paper, which builds an AI analyst for 12-month stock-return prediction and compares it with I/B/E/S human target-price forecasts using public firm, industry, macro, textual, return, and earnings information—showing that AI beats human analysts on average, but humans retain comparative advantage for illiquid, intangible, small, distressed, and recession-exposed firms, while a Man + Machine hybrid outperforms both and sharply reduces extreme forecast errors, implying that AI is best understood as an augmentation technology where machine data-processing and human institutional judgment are complementary."

- title: "Couts, Gonçalves, and Rossi (RFS, 2024) - Unsmoothing Returns of Illiquid Funds"
  file: "Couts_Goncalves_Rossi_RFS_2024.pdf"
  desc: "This note summarizes the paper, which develops and tests a three-step unsmoothing method for illiquid fund returns using hedge fund and private commercial real estate data—showing that standard one-step unsmoothing removes fund-level autocorrelation but leaves systematic aggregate risk smoothed, while the three-step approach raises measured volatility and factor R^2, lowers alphas and Sharpe ratios, and reveals that much apparent illiquid-fund performance reflects hidden systematic risk rather than true alpha. "

- title: "Giannetti & Jotikasthira (RFS, 2024) - Bond Price Fragility and the Structure of the Mutual Fund Industry"
  file: "Giannetti_Jotikasthira_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses corporate bond mutual fund holdings, TRACE bond prices, flow-induced fire-sale measures, fund merger IVs, and the Fed’s SMCCF intervention to study how ownership concentration affects bond-market fragility—showing that funds sell less of bonds in which they own large shares, especially during turmoil and when price-impact concerns are stronger, implying that concentrated ownership can stabilize bond prices by making large funds internalize fire-sale externalities and reduce spillovers to peer funds."

- title: "Fuster, Plosser, Schnabl, and Vickery (RFS, 2019) - The Role of Technology in Mortgage Lending"
  file: "Fuster_Plosser_Schnabl_Vickery_RFS_2019.pdf"
  desc: "This note summarizes the paper, which uses HMDA mortgage applications, FHA loan-performance data, CRISM refinancing records, FinTech lender classifications, processing-time regressions, default tests, demand-shock scalability tests, ADL refinancing-incentive bins, and borrower-selection analyses to study how online mortgage technology changes lending—showing that FinTech lenders process loans faster, scale better during application-volume surges, do not have higher default rates, and increase economically sensible refinancing, implying that mortgage FinTech mainly improves market efficiency by reducing operational and transaction frictions rather than broadly expanding credit access. "

- title: "Ben-Rephael, Da & Israelsen (RFS, 2017) - It Depends on Where You Search: Institutional Investor Attention and Underreaction to News"
  file: "BenRephael_Da_Israelsen_RFS_2017.pdf"
  desc: "This note summarizes the paper, which uses Bloomberg terminal search-and-reading activity, Google retail search, news, EDGAR requests, institutional trading data, earnings announcements, analyst recommendation changes, event-return regressions, VAR lead-lag tests, and calendar-time strategies to study how investor attention affects price discovery—showing that institutional attention reacts faster to news, leads retail attention, strengthens immediate price responses, and reduces post-news drift, implying that underreaction persists mainly when the investors capable of processing and trading on public information are inattentive. "

- title: "Jasova, Laeven, Mendicino, Peydr´o & Supera (RFS, 2024) - Systemic Risk and Monetary Policy: The Haircut Gap Channel of the Lender of Last Resort"
  file: "Jasova_Laeven_Mendicino_Peydro_Supera_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses euro-area security-level ECB collateral pledging, holdings, haircut gaps, bond issuance, balance-sheet data, and market comovement tests to study how lender-of-last-resort collateral policy affects systemic risk—showing that banks buy, issue, and pledge more high-haircut-gap bank bonds when ECB haircuts are more favorable than private repo haircuts, especially for domestic, periphery, and systemically important banks, implying that LOLR policy can provide liquidity insurance while also increasing bank interconnectedness and correlated systemic exposure."

- title: "Kleven, Landais, and Søgaard (AEJ Applied, 2019) - Children and Gender Inequality: Evidence from Denmark"
  file: "Kleven_Landais_S_gaard_AEJAE_2019.pdf"
  desc: "This note summarizes the paper, which uses full-population Danish administrative data and event studies around first childbirth to estimate how children shape gender inequality—using key objects such as earnings, hours, participation, wages, occupation, management, family-friendly jobs, child penalties, dynamic decomposition of the gender earnings gap, and maternal-versus-paternal grandparent labor-supply patterns—to show that women’s labor-market outcomes fall sharply and persistently after children while men’s barely change, implying that parenthood explains most remaining Danish gender earnings inequality and that child penalties are partly transmitted through maternal family norms."

- title: "Huck (RFS, 2024) - The Psychological Externalities of Investing: Evidence from Stock Returns and Crime"
  file: "Huck_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses daily NIBRS crime data, standardized stock-market returns, location-based investor-status proxies, rich agency-level fixed effects, timing tests, local earnings-surprise shocks, and mechanism checks on alcohol, at-home violence, and known offenders to study the psychological externalities of investing—showing that positive market returns reduce violent crime in high-income investor locations but increase it in low-income noninvestor locations, implying that stock-market news affects real behavior through both direct wealth effects and relative-status/social-comparison channels."

- title: "Bianchi, G´omez-Cram & Kung (RFS, 2024) - Using Social Media to Identify the Effects of Congressional Viewpoints on Asset Prices"
  file: "Bianchi_GomezCram_Kung_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses timestamped U.S. congressional Twitter posts, firm-level tweet matching, tone measures, high-frequency stock prices, committee-meeting data, bill links, and industry-spillover tests to show that supportive versus critical congressional viewpoints move firm stock prices within minutes, persist over daily horizons, and are strongest when tied to legislative activity, implying that politicians’ public social-media communication is a real-time channel through which policy information enters asset prices."

- title: "Jackson and Pernoud (RFS, 2024) - Credit Freezes, Equilibrium Multiplicity, and Optimal Bailouts in Financial Networks"
  file: "Jacksona_Pernoud_RFS_2024.pdf"
  desc: "This note summarizes the paper, which develops a financial-network model in which debt cycles, default costs, and repayment expectations create multiple equilibria and self-fulfilling credit freezes—using key objects such as weak balance, iterative strong solvency, best versus worst equilibria, directed payment cycles, minimum bailout sequences, indirect bailout value, star networks, and core-periphery simulations—to show that preventing bad-equilibrium insolvency is computationally hard but often cheaper when regulators rescue peripheral debtors whose repayments unlock solvency elsewhere, implying that optimal bailouts should exploit network repayment cascades rather than simply target the largest or most central banks first."

- title: "Birru, Gokkaya, Liu, and Stulz (RFS, 2024) - Are Analyst “Top Picks” Informative?"
  file: "Birru_Gokkaya_Liu_Stulz_RFS_2024.pdf"
  desc: "This note summarizes the paper, which studies the informativeness of analyst \"top picks\" after the 2002 Global Analyst Research Settlement, showing that top picks, which are hand-collected from 1999–2016, provide valuable information and outperform matched buy recommendations, with institutional investors distinguishing top picks with greater future value, while retail investors mostly respond to the designation itself, highlighting that financial regulation can change how analysts communicate information."

- title: "Dahlquist & Ibert (RFS, 2024) - Equity Return Expectations and Portfolios: Evidence from Large Asset Managers"
  file: "Dahlquist_Ibert_RFS_2024.pdf"
  desc: "This note summarizes the paper, which analyzes the countercyclical equity premium expectations of large asset managers using their capital market assumptions and portfolio allocations, showing that these expectations are negatively related to the CAPE and strongly predict U.S. equity portfolio weights, while fund mandates and strategic allocation rules attenuate this pass-through; the paper further finds that tactical funds are more responsive to expectations, and that term premium expectations are more closely related to bond duration and maturity than overall bond shares."

- title: "de Silva & Thesmar (RFS, 2024) - Noise in Expectations: Evidence from Analyst Forecasts"
  file: "deSilva_Thesmar_RFS_2024.pdf"
  desc: "This note summarizes the paper, which examines the horizon-dependent mix of soft information, bias, and noise in analyst earnings forecasts, showing that analysts are better than econometric models at short horizons but become increasingly biased and noisy at longer horizons, with forecast noise amplifying bias in long-horizon regression coefficients, and arguing that combining machine and analyst forecasts improves long-horizon predictions modestly, highlighting the importance of noise in belief formation and its implications for interpreting forecast errors."

- title: "Bradley, Hanousek, Jame & Xiao (RFS, 2024) - Place Your Bets? The Value of Investment Research on Reddit’s Wallstreetbets"
  file: "Bradley_Hanousek_Jame_Xiao_RFS_2024.pdf"
  desc: "This note summarizes the paper, which studies the value of Wallstreetbets (WSB) due diligence (DD) reports before and after the GameStop short squeeze, showing that pre-GME reports predict future returns and cash-flow news, while post-GME reports emphasize price pressure and attention-grabbing stocks, leading to a sharp decline in report informativeness, especially for smaller retail investors, implying that online communities can produce valuable research, but its quality is fragile and dependent on platform culture and participation shifts."

- title: "Martinsson, Sajtos, Strömberg, & Thomann (RFS, 2024) - The Effect of Carbon Pricing on Firm Emissions: Evidence from the Swedish CO2 Tax"
  file: "Martinsson_Sajtos_Stromberg_Thomann_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses Swedish carbon tax data to estimate firm-level carbon-pricing elasticities and examines how firms across different emission-intensity sectors, PACE categories, and financial constraints respond to carbon pricing—showing that high-emitting firms and those with high abatement costs or financial constraints respond less, while firms with low costs and better financial access show stronger responses, and concluding that while carbon pricing is effective, complementary policies are needed for firms facing higher abatement costs or leakage risks."

- title: "Li, Shan, Tang, & Yao (RFS, 2024) - Corporate Climate Risk: Measurements and Responses"
  file: "Li_Shan_Tang_Yao_RFS_2024.pdf"
  desc: "This note summarizes the paper, which develops firm-level climate risk measures from U.S. earnings call transcripts, distinguishing between acute physical, chronic physical, and transition risk—using key objects such as proactive and nonproactive transition risk, CO2 intensity, MSCI CCI, Tobin’s q, CapEx, R&D, green patents, and employment data—to show that climate transition risk is priced in equity markets, with the nonproactive component of transition risk associated with lower valuation, reduced R&D, and employment, while proactive firms increase capital expenditures in response, highlighting the importance of firms' adaptation actions to transition risk."

- title: "Pankratz & Schiller (RFS, 2024) - Climate Change and Adaptation in Global Supply-Chain Networks"
  file: "Pankratz_Schiller_RFS_2024.pdf"
  desc: "This note summarizes the paper, which studies climate-change adaptation in global supply chains by examining how supplier heat exposure reduces supplier performance and propagates to customers, leading to adaptation behaviors such as relationship termination, diversification, and supplier replacement with lower-exposure firms—showing that the termination response is stronger when exposure exceeds expectations, that customers increase inventories, and that long-term climate projections are less influential than experienced heat, suggesting that adaptation is driven by performance shocks and supply-chain reallocation."

- title: "Chan, Menkveld, & Yang (JF, 2008) - Information Asymmetry and Asset Prices"
  file: "Chan_Menkveld_Yang_JF_2008.pdf"
  desc: "This note summarizes the paper, which uses China’s segmented A- and B-share markets, transaction-level microstructure measures, and the 2001 opening of B-shares to domestic investors to test whether information asymmetry affects asset prices—using key objects such as foreign-share discounts, A-minus-B price impact differences, adverse selection spread components, PIN, turnover, trading frequency, market capitalization, momentum, and pre/post-opening comparisons—to show that stocks with larger domestic-versus-foreign information asymmetry have larger B-share discounts, implying that informed-trading frictions can be priced into otherwise identical claims held by different investor clienteles."

- title: "Vijh (RFS, 1994) - S&P 500 Trading Strategies and Stock Betas"
  file: "Vijh_RFS_1994.pdf"
  desc: "This note summarizes the paper, which uses S&P 500 additions, matched seasoned S&P/non-S&P stocks, beta estimates, trading-volume and turnover changes, autocorrelation tests, and Scholes-Williams/Cohen-style microstructure corrections to examine whether index futures, options, portfolio insurance, program trading, and basket trades distort measured stock betas—showing that S&P 500 inclusion and high-index-trading periods raise measured betas even where nonsynchronous-trading theory predicts declines, implying that common basket-trading price pressure can create excess volatility and contaminate standard estimates of systematic risk."

- title: "Serra-Garcia (AER, 2026) - The Attention-Information Trade-Off"
  file: "SerraGarcia_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses randomized sender and receiver experiments with freelance professional summaries of scientific articles to study how attention incentives change information transmission—using key objects such as info, clickbait, and viral incentives, accuracy, focus and style indices, accurate-in-text versus not-in-text content, click rates, summary-based and overall knowledge, receiver errors, beliefs, intentions, and LLM-generated summaries—to show that attention incentives raise clicks but reduce scientific detail and create misperceptions mainly through omission and relevance-focused framing rather than explicit falsehood, implying that online content can mislead by making information thinner even when it is not factually inaccurate."

- title: "Adger, Ross, and Sloan (AER, 2026) - The Effect of Field Training Officers on Police Use of Force"
  file: "Adger_Ross_Sloan_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses Dallas Police Department field-training assignments, call-level use-of-force data, empirical-Bayes measures of FTO prior force propensity, cohort-by-division assignment variation, balance tests, dynamic effects, randomization inference, and mechanism checks to estimate whether supervisors transmit discretionary policing behavior—showing that recruits assigned to higher-force FTOs use force more often after training for roughly two years, implying that on-the-job training can transmit norms and thresholds for high-stakes discretionary behavior and that FTO selection is a meaningful police-reform lever."

- title: "Jiang, Stanford, & Xie (JFE, 2012) - Does it matter who pays for bond ratings? Historical evidence"
  file: "Jiang_Stanford_Xie_JFE_2012.pdf"
  desc: "This note summarizes the paper, which uses the staggered 1970s transition from investor-pay to issuer-pay corporate bond ratings at Moody’s and S&P to test whether rating-agency compensation affects ratings—using key objects such as S&P–Moody’s rating differences for the same bond, broad rating transformations, post-1974 issuer-pay treatment, high-fee and low-credit conflict proxies, bond and firm controls, investment-grade boundary evidence, and senior-bond robustness—to show that S&P became more favorable relative to Moody’s after adopting issuer-pay, especially for bonds with stronger conflict incentives, implying that who pays for ratings can systematically influence rating outcomes."

- title: "Huremovic, Jimenez, Moral-Benito, Peydro, & Vega-Redondo (AER, 2026) - Production and Financial Networks in Interplay"
  file: "Huremovic_Jimenez_MoralBenito_Peydro_VegaRedondo_AER_2026.pdf"
  desc: "This note summarizes the paper, which combines Spanish VAT-based supplier-customer network data, bank-firm credit-register data, Amiti-Weinstein bank credit-supply shocks, reduced-form link and node regressions, and a structural production-network model with bank-financing wedges to study how financial shocks propagate through real supply chains—showing that customer bank shocks strongly reduce supplier sales, supplier shocks propagate more weakly downstream because customers can substitute, and higher-order network effects substantially amplify GDP losses, implying that bank distress affects not only direct borrowers but also distant firms connected through production networks."

- title: "Liao, Peng, & Zhu (RFS, 2022) - Extrapolative Bubbles and Trading Volume"
  file: "Liao_Peng_Zhu_RFS_2022.pdf"
  desc: "This note summarizes the paper, which uses account-level Chinese brokerage data from the 2014–2015 stock-market bubble to explain excessive bubble trading through the interaction of extrapolative beliefs and the disposition effect—using key objects such as prebubble extrapolation measures, realized-gain and realized-loss disposition measures, disposition extrapolator groups, investor-level volume regressions, stock-level turnover exposure, structural counterfactuals, and return-predictability tests—to show that extrapolation drives investors into rising stocks while realization utility makes them sell after gains, implying that bubbles generate both price pressure and high trading volume through the joint force of nonstandard beliefs and nonstandard preferences."

- title: "Bardgett, Gourier, & Leippold (JFE, 2019) - Inferring Volatility Dynamics and Risk Premia from the S&P 500 and VIX Markets"
  file: "Bardgett_Gourier_Leippold_JFE_2019.pdf"
  desc: "This note summarizes the paper, which jointly estimates S&P 500 and VIX derivative markets with an affine jump-diffusion model and particle filtering to infer volatility dynamics and variance risk premia—using key objects such as S&P 500 options, VIX options, latent short-run variance, central-tendency variance, jump-intensity factors, variance jumps, VIX-squared affine representations, option-pricing errors, synthetic VIX maturities, VRP levels and term-structure slopes, and return-predictability regressions—to show that VIX options contain volatility-risk information not spanned by S&P 500 options, implying that the variance risk premium is a term-structure object whose level, slope, and jump/variance-factor decomposition matter for derivative pricing, volatility trading, and expected stock returns."

- title: "Ambuehl & Bernheim (AER, 2026) - Social Preferences over Ordinal Outcomes"
  file: "Ambuehl_Bernheim_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses consequential experiments in work, political, and charity-allocation domains to study how planners aggregate other people’s ordinal rankings when cardinal utility is missing or unreliable—using key objects such as social choice rules, scoring-rule fingerprints, concavity, Borda and antiplurality rules, Condorcet and runoff alternatives, Bayesian rule classification, out-of-sample prediction, cardinal-belief elicitations, payoff-information treatments, and general-population samples—to show that most people use stable concave scoring rules that emphasize avoiding worst-ranked outcomes rather than simple majority or first-place logic, implying that ordinal social preferences have a strong compromise and last-place-aversion structure."

- title: "Golez & Jackwerth (JFE, 2012) - Pinning in the S&P 500 futures"
  file: "Golez_Jackwerth_JFE_2012.pdf"
  desc: "This note summarizes the paper, which uses serial S&P 500 futures options, SPX options, futures settlement prices, option open interest, expiration-day volume, early exercise, futures volatility, and logistic pinning regressions to study whether S&P 500 futures are pulled toward option strikes on expiration days—showing that serial SP option expirations generate economically meaningful futures pinning, especially from below, because resale and early exercise of in-the-money physically settled options dominate time-decay anti-pinning forces, implying that derivative-market hedging can temporarily move even highly liquid index futures and that the sign of pinning depends on settlement rules, option positions, and hedging channels."

- title: "Li, Subrahmanyam & Yang (RFS, 2021) - Winners, Losers, and Regulators in a Derivatives Market Bubble"
  file: "Li_Subrahmanyam_Yang_RFS_2021.pdf"
  desc: "This note summarizes the paper, which uses proprietary investor-level brokerage data from the Chinese warrants bubble to study who wins and loses inside a derivatives-market bubble—using key objects such as warrant Black–Scholes values, investor daily returns, turnover, Sharpe-ratio performance groups, bootstrap skill tests, top-trader event studies, out-of-the-money and zero-payoff warrant trading, holdings near expiration, and regulatory price limits—to show that a small group of skilled high-turnover traders earns persistent profits by acting like market makers while naive retail investors lose money through trend-chasing and option-payoff misunderstanding, implying that bubble dynamics depend on trader heterogeneity and regulatory rules as much as aggregate overpricing."

- title: "Albert, Glitz & Llull (AER, 2026) - Labor Market Competition and the Assimilation of Immigrants"
  file: "Albert_Glitz_Llull_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses U.S. Census and ACS data from 1970–2019 and a CES production model with general versus host-country-specific skills to reinterpret immigrant wage assimilation as both an individual skill-accumulation process and an equilibrium labor-market competition effect—using key objects such as immigrant arrival cohorts, state-year skill supplies, cohort inflow rates, immigrant-native wage gaps, specific-skill accumulation, English proficiency, substitution elasticities, relative skill demand, and counterfactual wage profiles—to show that larger immigrant cohorts depress the relative price of general skills and explain a meaningful share of widening wage gaps, implying that assimilation curves reflect changing market prices as well as immigrant quality and human-capital investment."

- title: "Harvey & Whaley (JF, 1991) - S&P 100 Index Option Volatility"
  file: "Harvey_Whaley_JF_1991.pdf"
  desc: "This note summarizes the paper, which studies how S&P 100 index option implied volatility should be measured and why common estimators create spurious volatility dynamics—using key objects such as American-style option valuation, discrete dividends, at-the-money OEX calls and puts, closing prices, 3:00 P.M. transactions, 2:55–3:05 P.M. nonlinear least-squares estimators, bid/ask bounce, nonsynchronous index-option closing times, and call-put volatility consistency tests—to show that closing-price and single-transaction implied volatilities mechanically induce negative serial correlation and implausible call-put behavior, implying that empirical option research must carefully align timing, microstructure, dividend, and valuation inputs before interpreting implied-volatility movements."

- title: "Aronoff & Rafey (AER, 2026) - Conservation Priorities and Environmental Offsets: Markets for Florida Wetlandss"
  file: "Aronoff_Rafey_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses Florida wetland mitigation markets, offset transaction and bank data, structural demand and supply estimates, flood-insurance claims, and counterfactual market-design simulations to evaluate the welfare trade-off in environmental offsets—using key objects such as wetland development, mitigation-bank credits, offset prices, developer demand, bank entry costs, flood damages, local externalities, private gains from trade, uniform taxes, and local Pigouvian taxes—to show that offset markets create large private gains but also substantial unpriced flood damages when conservation is reallocated away from high-protection locations, implying that environmental offset systems should price spatially heterogeneous ecosystem services rather than treat all offsets as perfect substitutes."

- title: " Pruitt & Wei (JF, 1989) - Institutional Ownership and Changes in the S&P 500"
  file: "Pruitt_Wei_JF_1989.pdf"
  desc: "This note summarizes the paper, which uses Value Line institutional ownership data around S&P 500 additions and clean deletions from 1973–1986 to test whether index membership changes generate actual institutional demand shocks—using key variables such as gross and control-adjusted net institutional ownership changes, addition and deletion events, quarterly pre/post holdings, sign tests, and abnormal return regressions—to show that institutional ownership rises after additions, falls after deletions, and is positively related to post-listing abnormal returns, implying that S&P 500 price-pressure effects are supported by direct institutional rebalancing evidence."

- title: "Morchio & Moser (AER, 2026) - The Gender Pay Gap: Micro Sources and Macro Consequences"
  file: "Morchio_Moser_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses Brazilian linked employer–employee data and an equilibrium search model with endogenous firm pay, amenities, hiring, and gender-specific job ladders to decompose the gender pay gap—using key objects such as gender-specific AKM employer effects, between- and within-employer sorting, worker mobility, utility ranks, amenity valuations, firm productivity, gender wedges, total compensation, and equal-pay/equal-hiring counterfactuals—to show that much of the pay gap reflects women sorting into lower-pay but higher-amenity employers, implying that wage-only analyses overstate utility inequality while equal-treatment policies can reduce measured pay gaps without necessarily improving output or welfare."

- title: "Jensen & Zhang (AER, 2026) - Effects of Parental Death on Labor Market Outcomes"
  file: "Jensen_Zhang_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses Danish population registers, sudden first parental deaths, nearest-neighbor matched controls, event studies, and DiD regressions to estimate how parental bereavement affects adult children’s labor-market outcomes—using key variables such as employment, earnings, hours proxies, parent gender, child gender, psychologist visits, mental-health prescriptions, young-child status, surviving-parent health, and robustness checks for bequests, fertility, cohabitation, job changes, and relocation—to show that parental death persistently reduces adult children’s earnings and employment, especially for daughters and after mothers’ deaths, implying that bereavement operates as a meaningful economic shock through mental health, informal childcare, and eldercare channels."

- title: "Kumar, Lee, Lowe & Ogunnote (AER, 2026) - Internal versus Institutional Barriers to Gender Equality: Evidence from British Politics"
  file: "Kumar_Lee_Lowe_Ogunnote_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses UK Parliament PMQs lottery data, electoral outcomes, gender-cohort-party controls, COVID-era hybrid proceedings, question and response coding, rowdiness measures, and voice-volume data to distinguish experience-based from institution-based explanations for gender gaps in political participation—showing that PMQs questions are electorally valuable and women enter less often before hybrid proceedings, but lottery-induced experience does not increase future entry while the hybrid format nearly eliminates the gap, implying that institutional redesign can reduce gender inequality more effectively than asking women to adapt to adversarial male-dominated settings."

- title: "Becko and Sztutman (AER, 2026) - Efficiency Criteria, Income Taxation, and Heterogeneous Elasticities"
  file: "Becko_Sztutman_AER_2026.pdf"
  desc: "This note summarizes the paper, which develops a bounded-curvature welfare criterion for evaluating nonlinear income tax schedules and tests it using US tax-return data—using key objects such as local targeted tax reforms, first- and second-order revenue derivatives, Pareto efficiency, utilitarian rationalizability, bounded curvature, mean ETIs, within-income ETI variance, Pareto income-density parameters, and top-tax diagnostics—to show that the US tax schedule may pass first-order Pareto-efficiency tests yet plausibly fail second-order bounded-curvature rationalizability because heterogeneous elasticities create local revenue convexity, implying that inverse-optimum tax arguments must discipline not only mean behavioral responses but also elasticity heterogeneity within income levels."

- title: "D’Acunto, Ghosh, and Rossi (JFE, 2026) - How Costly Are Cultural Biases? Evidence from FinTech"
  file: "DAcunto_Ghosh_Rossi_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses Faircent’s Indian peer-to-peer lending platform, within-lender comparisons before and after Auto Invest adoption, religion and caste inference, loan-risk controls, default and return regressions, quantile tests, salience-of-conflict heterogeneity, diversification checks, and lender-level return changes to study the private cost of cultural bias in financial allocation—showing that manual lenders favor co-ethnic and socially favored borrowers, while robo-advice reduces this bias, lowers bad-loan selection, and raises returns mainly by removing poor left-tail loans, implying that demographically blind FinTech tools can improve both allocation fairness and investor performance."

- title: "Correa, Paligorova, Sapriza & Zlate (RFS, 2022) - Cross-Border Bank Flows and Monetary Policy"
  file: "Correa_Paligorova_Sapriza_Zlate_RFS_2022.pdf"
  desc: "This note summarizes the paper, which uses BIS locational banking statistics, newly constructed domestic bank-credit data, source-country policy rates, dyadic source–destination fixed effects, bank-capital interactions, destination-risk measures, funding-cost controls, and global-factor robustness tests to study the international risk-taking channel of monetary policy—showing that tighter source-country monetary policy is associated with faster cross-border credit growth relative to domestic credit growth, especially from weaker banking sectors toward safer foreign destinations, implying that monetary policy reshapes the global allocation of bank credit rather than only changing domestic lending quantities."

- title: "Hirshleifer, Peng & Wang (RFS, 2025) - News Diffusion in Social Networks and Stock Market Reactions"
  file: "Hirshleifer_Peng_Wang_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses earnings-announcement events, firm-headquarters county centrality from the Facebook Social Connectedness Index, StockTwits discussions, Google Search attention, and household trading data to study how social networks transmit public firm news—using key variables such as earnings surprises, announcement returns, post-announcement drift, volatility persistence, trading volume, message replies, disagreement, influencer posts, search intensity, household social ties, trading costs, and trading profits—to show that social centrality speeds price discovery and reduces drift while increasing persistent discussion, disagreement, attention, trading, and losses, implying that social networks can improve market-level informational efficiency but worsen investor-level trading efficiency."

- title: "Davis (RFS, 2025) - The Elasticity of Quantitative Investment"
  file: "Davis_RFS_2025.pdf"
  desc: "This note summarizes the paper, which studies the price elasticity of quantitative/statistical-arbitrage investment strategies by differentiating model-implied portfolio weights with respect to prices through price-sensitive stock predictors—using key objects such as 13F holdings, CRSP returns, 62 stock predictors, price-based characteristics, predictor-weighted portfolios, classical mean-variance demand, factor and machine-learning models, long-short and pure-alpha portfolios, systematic elasticity, and demand-system counterfactuals—to show that modern high-Sharpe quantitative strategies are far less elastic than classical arbitrage theory implies, meaning that sophisticated alpha-seeking investors may coexist with persistent mispricing because they do not trade aggressively enough against individual price changes."

- title: "Mehran and Stulz (JFE, 2007) - The Economics of Conflicts of Interest in Financial Institutions"
  file: "Mehran_Stulz_JEF_2007.pdf"
  desc: "This note summarizes the paper, which reviews the economics of conflicts of interest inside financial institutions by distinguishing potential incentive distortions from realized customer harm—using key concepts such as integrated financial institutions, analyst conflicts, underwriting and lending synergies, mutual-fund governance, rational customer discounting, reputation, competition, institutional sophistication, law and regulation, and evidence on biased advice versus adverse returns—to show that conflicts are pervasive but often disciplined by market forces and sometimes offset by scope economies, implying that regulation should target settings where conflicts survive market discipline rather than assume all conflicts mechanically reduce welfare."

- title: "Campbell and Cochrane (JPE, 1999) - By Force of Habit: A Consumption-Based Explanation of Aggregate Stock Market Behavior"
  file: "Campbell_Cochrane_1999_JPE.pdf"
  desc: "This note summarizes the paper, which builds a consumption-based asset-pricing model with slow-moving external habit and the surplus consumption ratio as the key state variable—using objects such as habit-adjusted marginal utility, state-dependent risk aversion, the stochastic discount factor, sensitivity function, consumption and dividend claims, price-dividend ratios, risk-free rates, Sharpe ratios, return predictability, and volatility decompositions—to show that recession-sensitive marginal utility can jointly explain the equity premium, low risk-free rate, volatile valuations, long-horizon predictability, countercyclical volatility, and weak consumption-return correlations, implying that aggregate stock-market behavior can be understood as compensation for bearing risk when consumption is close to habit."

- title: "Pinter, Wang & Zou (RFS, 2024) - Size Discount and Size Penalty: Trading Costs in Bond Markets"
  file: "Pinter_Wang_Zou_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses U.K. ZEN transaction-level bond data with client and dealer identities to distinguish the pooled size discount from the within-client size penalty in OTC bond trading costs—using key variables such as trade size, trader size, signed trading costs, client fixed effects, dealer-day and bond-day controls, client sophistication, macro-news periods, future returns, future order flow, relationship strength, and government-versus-corporate bond markets—to show that large clients receive lower average costs but the same client pays more when trading unusually large amounts, implying that bond-market trading costs reflect both cross-client bargaining power and within-client information or urgency effects."

- title: "Dahlquist & Ibert (JFE, 2026) - Institutions’ Return Expectations across Assets and Time"
  file: "Dahlquist_Ibert_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses institutional return forecasts from asset managers, investment consultants, wealth advisors, public pension funds, and professional forecasters to study how subjective risk premia vary across assets and time—using key variables such as subjective equity, cash, and credit premia, CAPE-based objective equity premia, term-premium and excess-bond-premium benchmarks, AUM weights, forecaster fixed effects, building-block return components, valuation repricing, CAPE disagreement, and cross-asset optimism—to show that institutions’ expected risk premia move nearly one-for-one with objective countercyclical benchmarks while displaying persistent cross-sectional disagreement driven mainly by long-run valuation beliefs, implying that institutional expectations are cyclically disciplined but heterogeneous across belief holders."

- title: "Blonz, Roth Tran, and Troland (JFE, 2026) - The canary in the coal decline: Appalachian household finance and the transition from fossil fuels"
  file: "Blonz_Tran_Troland_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses Appalachian coal counties, NY Fed/Equifax Consumer Credit Panel data, local coal-demand shocks from nearby power-plant coal consumption, individual fixed effects, distributed lags, local projections, credit-score heterogeneity, poverty and age splits, and migration robustness tests to estimate the household-finance costs of the coal decline—using key variables such as coal demand within 200 miles, coal production, mining hours, coal employment, credit scores, subprime status, credit utilization, delinquent accounts, third-party collections, bankruptcy, baseline credit-score quantiles, and mover status—to show that falling coal demand quickly worsens household credit health beyond direct coal-worker households, implying that fossil-fuel transitions impose broad, fast, and uneven balance-sheet costs on already fragile local communities."

- title: "Kashyap, Kovrijnykh, Li, & Pavlova (AER, 2023) - Is There Too Much Benchmarking in Asset Management?"
  file: "Kashyap_Kovrijnykh_Li_Pavlova_AER_2023.pdf"
  desc: "This note summarizes the paper, which develops a general-equilibrium optimal-contracting model of delegated asset management to explain why benchmarking is privately optimal but socially excessive—using key objects such as manager alpha production, private management costs, unobservable portfolios, linear compensation, skin in the game, relative-performance benchmarking, manager risky-asset demand, market-clearing prices, fund-investor incentives, and a constrained planner benchmark—to show that benchmarked contracts crowd managers into the risky asset, raise its price, weaken incentive provision for other managers, and increase asset-management costs, implying that the asset-management industry may use too much benchmarking and costly active management from a social perspective."

- title: "Bryzgalova, Pelger, & Zhu (JF, 2025) - Forest through the Trees: Building Cross-Sections of Stock Returns"
  file: "Bryzgalova_Pelger_Zhu_JF_2025.pdf"
  desc: "This note summarizes the paper, which develops Asset Pricing Trees as an interpretable, tree-based method for constructing characteristic-managed stock portfolios that better span the conditional SDF than traditional sorts—using CRSP/Compustat stock returns, 10 firm characteristics, conditional tree splits, managed portfolios, robust mean-variance shrinkage, LASSO pruning, out-of-sample Sharpe ratios, FF-factor alphas, XS-R^2, interaction nodes, and small-cap robustness tests—to show that AP Trees recover more pricing information with fewer and more diversified portfolios, implying that test-asset construction is itself an asset-pricing problem and that conventional sorted portfolios can omit important nonlinear and interaction-based SDF information."

- title: "Mehra & Prescott (JME, 1985) - The Equity Premium: A Puzzle"
  file: "Mehra_Prescott_JME_1985.pdf"
  desc: "This note summarizes the paper, which documents the U.S. equity premium puzzle by comparing 1889–1978 equity returns, safe real returns, and consumption growth with a frictionless Lucas-style representative-agent model with CRRA preferences and Markov consumption growth—using key variables such as real S&P 500 returns, real risk-free returns, the equity premium, consumption-growth mean and volatility, risk aversion, discount factors, asset-pricing Euler equations, equity price-dividend ratios, and the model-implied admissible region—to show that plausible preferences can generate at most a tiny equity premium while keeping the risk-free rate low, implying that successful asset-pricing theories must explain both high risky returns and low safe real rates beyond the standard Arrow–Debreu representative-agent framework."

- title: "Wu & Zhang (RFS, 2025) - Common Pricing of Decentralized Risk: A Linear Option Pricing Model"
  file: "Wu_Zhang_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops a top-down linear option-pricing model for OTC currency options that decomposes each contract into BMS Greek-based risk exposures and imposes common pricing per unit of decentralized risk—using key objects such as implied volatility, delta-hedged returns, vega, gamma, volga, vanna, historical variance estimators, cross-sectional time-decay regressions, market prices of risk, risk-targeting option portfolios, pricing residuals, and option-return factor models—to show that common pricing of heterogeneous option risks explains option surfaces and realized option returns with high accuracy, implying that option valuation can be unified through risk-price consistency rather than a fully specified bottom-up dynamics of the underlying asset."

- title: "Heyerdahl-Larsen & Illeditsch (JFE, 2026) - Demand Disagreement"
  file: "HeyerdahlLarsen_Illeditsch_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops and tests a demand-disagreement asset-pricing model in which investors disagree about the future composition of patient versus impatient investors rather than only about macro fundamentals—using SPF yield forecasts, macro-forecast disagreement, residual demand-disagreement measures, overlapping-generations model states, patient consumption shares, stochastic discount factors, yield volatility regressions, bond risk-premium regressions, and Kalman-filtered real-yield fits—to show that demand disagreement explains residual interest-rate disagreement, predicts yield volatility and bond excess returns, and helps resolve the weak link between asset prices and fundamentals, implying that beliefs about future marginal investors are a distinct priced state variable."

- title: "Voss (RFS, 2025) - Short-Term Debt and Corporate Governance"
  file: "Voss_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops a theoretical model of how short-term debt affects corporate governance through blockholder exit and voice—using key objects such as the short-term debt share, blockholder exit probability, order flow, market-maker pricing, creditor rollover terms, managerial effort cutoffs, hidden monitoring, public campaigns, and refinancing feedback—to show that moderate short-term debt can improve price sensitivity and governance, but high short-term debt makes informed exit and voice noncredible by triggering adverse rollover responses, implying that information-sensitive debt can undermine the very shareholder governance it is often expected to strengthen."

- title: "Liu & Palmer (JFE, 2026) - Implicit Extrapolation and the Beliefs Channel of Investment Demand"
  file: "Liu_Palmer_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses the New York Fed Survey of Consumer Expectations housing module to test whether stated expectations fully capture the beliefs behind investment demand—using key variables such as perceived past home-price appreciation, forecasted future appreciation, actual past HPA, hypothetical housing-fund allocation, risk tolerance, subjective return distributions, confidence in past versus future beliefs, forward- versus backward-looking respondent types, and self-reported rationales—to show that investors extrapolate from past returns both explicitly into stated forecasts and implicitly into investment choices even after controlling for forecasts, implying that survey expectations are useful but incomplete sufficient statistics for the belief channel of investment demand."

- title: "Malamud, Schrimpf & Zhang (RFS, 2025) - An Intermediation-Based Model of Exchange Rates"
  file: "Malamud_Schrimpf_Zhang_RFS_2025.pdf"
  desc: "This note summarizes the paper, which develops a two-country continuous-time exchange-rate model with segmented financial markets, dealer-to-customer bargaining, and intermediary market power to explain FX puzzles—using key objects such as household and intermediary stochastic discount factors, D2C and D2D markets, state-contingent markups, risk-sharing demand, adjusted exchange rates, consumption shares, short rates, UIP/Fama regressions, carry returns, CIP deviations, and simulated calibration moments—to show that intermediary markups can distort household state prices, break monetary neutrality, and generate UIP and CIP deviations even when intermediaries are risk-neutral with zero net positions, implying that exchange-rate dynamics depend not only on macro fundamentals but also on the market structure through which households access foreign financial claims."

- title: "Freed & Hackney (JFE, 2026) - Financial Literacy and Financial Crime: A Regression Discontinuity Approach"
  file: "Freed_Hackney_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses Virginia’s high-school financial literacy mandate as a sharp regression discontinuity around the September 30, 1996 birth-date cutoff, linked administrative court records, address-demographic data, FINRA literacy evidence, SIPP financial-behavior outcomes, and placebo/robustness tests to estimate whether financial education reduces financial crime—using key variables such as treatment-cohort status, financial-crime charges, embezzlement, fraud, forgery, counterfeiting, misdemeanor and felony severity, low-income block-group status, indigent defense, credit-card debt-to-income, investments, and savings-account ownership—to show that financial literacy lowers financial-crime charges by roughly one-third, especially embezzlement and among financially constrained individuals, implying that financial education can improve household resilience and generate social benefits by reducing financially motivated misconduct."

- title: "Crosignani, Han, Macchiavelli, and Silva (JFE, 2026) - Securing Technological Leadership? The Cost of Export Controls on Firms"
  file: "Crosignani_Han_Macchiavelli_Silva_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses hand-collected BIS export-control events, global firm-to-firm supply-chain links, stacked difference-in-differences designs, stock-market event studies, real-outcome regressions, bank-lending data, and Chinese-target supplier reconfiguration tests to estimate the costs of U.S. export controls—using key variables such as affected U.S. suppliers, targeted Chinese customers, Chinese-customer terminations, new customer formation, customer shares by region, abnormal returns, revenue, EBIT, employment, bank credit, loan spreads, and Chinese domestic supplier substitution—to show that export controls achieve direct U.S.–China decoupling but impose large collateral costs on U.S. technology suppliers and encourage Chinese firms to reconfigure supply chains toward domestic and non-U.S. suppliers, implying that export-control policy needs complementary demand and industrial-support measures for affected domestic firms."

- title: "Li, Petrasek, & Tian (JFE, 2026) - Risk-averse dealers in a risk-free market - The role of trading desk risk limits"
  file: "Li_Petrasek_Tian_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses confidential Volcker-rule trading-desk data, VaR limits, Treasury dealer positions, SLR and credit-line drawdown measures, March 2020 SOMA purchase operations, dealer profitability, and aggregate Treasury liquidity regressions to study how internal risk limits constrain Treasury intermediation—using key variables such as VaR, VaR limits, limit usage, net and gross Treasury positions, firm-by-day fixed effects, non-Treasury desk limit-change instruments, SLR distance, SOMA sales, offer aggressiveness, client purchases, PnL per VaR, and a dealer VaR-constraint index—to show that dealers close to VaR limits reduce risk-taking, sell more aggressively to the Fed, provide less client liquidity, and require higher compensation, implying that volatility can tighten internal dealer constraints and transmit directly into Treasury market illiquidity."

- title: "Andersen, Dimmock, Nielsen, & Peijnenburg (JFE, 2026) - Extrapolators and Contrarians: Forecast Bias and Individual Investor Stock Trading"
  file: "Andersen_Dimmock_Nielsen_Peijnenburg_JFE_2026.pdf"
  desc: "This note summarizes the paper, which links laboratory-measured forecast bias to Danish administrative trading records to test whether extrapolators and contrarians make different real stock-trading decisions—using key variables such as forecast errors from a known AR(1) process, standardized forecast bias, lagged stock returns, investor-level capital gains, purchase and sale indicators, investor-day fixed effects, monthly net stock flows, lagged market returns, and post-experiment robustness tests—to show that extrapolators buy higher-past-return stocks, sell lower-capital-gain positions, and increase stock flows after strong market returns, implying that individual belief-formation bias is a measurable driver of real security selection and portfolio adjustment."

- title: "Chen, Roll, and Ross (JB, 1986) - Economic Forces and the Stock Market"
  file: "Chen_Roll_Ross_JB_1986.pdf"
  desc: "This note summarizes the paper, which uses theory-guided macroeconomic state variables and Fama–MacBeth tests on size-sorted stock portfolios to identify priced economic forces in the stock market—using key variables such as industrial production growth, unexpected inflation, changes in expected inflation, default-spread risk-premium shocks, term-structure shocks, market-index returns, consumption growth, oil-price changes, and rolling factor betas—to show that production, inflation, risk-premium, and term-structure exposures explain cross-sectional expected returns better than market-index, consumption, or oil betas, implying that economically interpretable macro news is central to systematic stock-market risk."

- title: "Kedia, Rajgopal & Zhou (JFE, 2014) - Did going public impair Moody’s credit ratings?"
  file: "Kedia_Rajgopal_Zhou_JFE_2014.pdf"
  desc: "This note summarizes the paper, which uses Moody’s 2000 IPO as a shock to rating-agency incentives and compares Moody’s ratings with S&P ratings on the same corporate bonds, outstanding bonds, and CDOs before and after the IPO—using key variables such as RatingDiff, post-IPO indicators, issuer and issue controls, structured-product issuer status, financial-firm status, large/frequent issuer status, marginal-issuer measures, Fitch competition, EDFs, default outcomes, recovery rates, and CDO AAA treatment—to show that Moody’s became significantly more favorable relative to S&P after going public without becoming more informative about default risk, implying that public ownership can strengthen revenue and market-share incentives that weaken financial gatekeepers’ rating standards."

- title: "Giglio, Maggiori, Stroebel, & Utkus (AER, 2021) - Five Facts about Beliefs and Portfolios"
  file: "Giglio_Maggiori_Stroebel_Utkus_AER_2021.pdf"
  desc: "This note summarizes the paper, which uses the GMSU-Vanguard repeated survey of investor expectations matched to administrative portfolio, trading, login, wealth, and account data to document how beliefs relate to real financial behavior—using key variables such as expected 1-year and 10-year stock returns, expected GDP growth, subjective disaster probabilities, confidence, difficulty, equity shares, belief changes, trade direction, trade magnitude, investor fixed effects, and attention measures—to show that beliefs are reflected in portfolios and trades but with weak average pass-through, strong persistent heterogeneity, and limited demographic explanatory power, implying that macro-finance models should incorporate heterogeneous beliefs, infrequent trading, and investor frictions rather than relying on representative-agent average expectations."

- title: "Li, Liu, and Wei (MS, 2026) - Credit Rating Purchases and S&P 500 Index Membership Decisions"
  file: "Li_Liu_Wei_MS_2026.pdf"
  desc: "This note summarizes the paper, which uses S&P 500 addition data, coded public index-methodology rules, S&P and Moody’s rating-purchase records, firm-quarter addition regressions, random-forest prediction, index-vacancy tests, high-inclusion-payoff interactions, the 2002 foreign-firm eligibility rule change, and post-inclusion performance comparisons to study benchmark governance—using key variables such as recent S&P rating purchases, Moody’s purchases, rule eligibility, size-rank groups, S&P merger vacancies, HighCAR inclusion rewards, foreign-firm eligibility, discretionary entrants, rules-based entrants, and discretionary outs—to show that S&P 500 addition decisions contain meaningful discretion systematically related to firms’ S&P rating purchases rather than generic rating demand, implying that benchmark construction can create cross-business conflicts of interest and should be treated as a governance problem rather than a purely mechanical classification process."

- title: "Gil-Bazo, Hoffmann, and Mayordomo (RFS, 2020) - Mutual Funding"
  file: "GilBazo_Hoffmann_Mayordomo_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses Spanish mutual fund holdings, bank bond issuance data, affiliated-fund indicators, post-Lehman stress variation, bank-level stress measures, primary-versus-secondary market tests, abnormal bond returns, fund-characteristic allocation tests, and bank-firm credit growth regressions to study whether bank-controlled mutual funds support parent-bank funding—using key variables such as affiliated primary-market purchases, parent-bank bond issuance, Eurosystem borrowing, NPL ratios, rating downgrades, retail fund status, performance fees, post-issuance abnormal returns, and credit supply—to show that affiliated funds buy disproportionately more parent-bank debt during stress and earn lower subsequent returns, implying that mutual funds can act as hidden funding channels for banks while transferring value from fund investors to parent institutions."

- title: "Ferreira, Matos, and Pires (JF, 2018) - Asset Management within Commercial Banking Groups: International Evidence"
  file: "Ferreira_Matos_Pires_JF_2018.pdf"
  desc: "This note summarizes the paper, which uses international domestic equity mutual fund data, commercial-bank affiliation classifications, client-stock holdings, fund performance regressions, divestiture difference-in-differences, client-stock portfolio tests, future lending regressions, voting dissent, manager turnover, and fund-flow evidence to study conflicts inside financial conglomerates—using key variables such as four-factor alpha, commercial bank affiliation, client-stock bias, top lending-client holdings, loans/TNA, corporate loans/TNA, divestiture events, lead-arranger probability, lender-affiliated ownership, and flow-performance sensitivity—to show that commercial bank-affiliated funds underperform because they support parent-bank lending relationships, implying that combining asset management with commercial banking can harm fund investors through cross-division conflicts of interest."

- title: "Hansen & Jagannathan (JF, 1997) - Assessing Specification Errors in Stochastic Discount Factor Models"
  file: "Hansen_Jagannathan_JF_1997.pdf"
  desc: "This note summarizes the paper, which develops the Hansen–Jagannathan distance as a specification-error measure for comparing misspecified stochastic discount factor models—using key objects such as payoff spaces, prices, admissible and nonnegative SDF sets, least-squares distance δ+, maximum normalized pricing errors, closest valid discount factors, managed-portfolio returns, power-utility SDFs, consumption externality models, reciprocal market-return proxies, and linear factor models—to show that distance-based pricing errors provide a more economically meaningful model-comparison criterion than classical χ2 rejection statistics, implying that empirical asset-pricing models should be ranked by how far their SDFs are from correctly pricing the chosen assets rather than only by whether exact pricing is rejected."

- title: "Chen, Singal, and Whitelaw (JFE, 2016) - Comovement Revisited"
  file: "Chen_Singal_Whitelaw_JFE_2016.pdf"
  desc: "This note summarizes the paper, which revisits prior evidence of excess comovement around S&P 500 additions and stock splits using return-decomposition logic, univariate and bivariate beta regressions, size-and-momentum matched samples, momentum-portfolio beta dynamics, and Dimson lead-lag adjustments—using key variables such as old- and new-group loadings, S&P and non-S&P returns, high- and low-price portfolio returns, past winner status, matched-stock beta changes, and sample-minus-match differences—to show that most apparent excess comovement disappears once time-varying betas, momentum selection, and nonsynchronous trading are controlled for, implying that regression coefficient changes are not sufficient evidence of nonfundamental asset-class demand."

- title: "Hansen & Richard (Econometrica, 1987) - The Role of Conditioning Information in Deducing Testable Restrictions Implied by Dynamic Asset Pricing Models"
  file: "Hansen_Richard_Econometrica_1987.pdf"
  desc: "This note summarizes the paper, which develops a conditional Hilbert-space framework for dynamic asset-pricing models to show how conditioning information changes pricing restrictions, mean-variance frontiers, beta representations, and empirical moment tests—using key objects such as current and future information sets, payoff and price random variables, conditional pricing functions, the benchmark payoff p∗, conditional stochastic discount factors, conditional versus unconditional frontiers, pseudo-pricing functions, and instrumented unconditional moments—to show that unconditional beta or mean-variance tests do not automatically test conditional asset-pricing implications, implying that empirical work must either model conditioning information directly or encode it through instruments."

- title: "Efing & Hau (JFE, 2015) - Structured Debt Ratings: Evidence on Conflicts of Interest"
  file: "Efing_Hau_JFE_2015.pdf"
  desc: "This note summarizes the paper, which uses structured-debt tranche ratings from 1999–2011, rating-implied spread conversions, deal-level rating measures, issuer–CRA shared-business variables, credit-risk controls, issuer fixed effects, complexity interactions, credit-cycle tests, and AAA-subordination robustness to examine issuer-pay rating conflicts—showing that issuers receiving more securitization business from a given CRA obtain systematically more favorable ratings, especially for complex boom-period deals, implying that bilateral business relationships distorted structured-debt information production and generated measurable rating favors."

- title: "Ben-David, Franzoni & Moussawi (JF, 2018) - Do ETFs Increase Volatility?"
  file: "BenDavid_Franzoni_Moussaoui_JF_2018.pdf"
  desc: "This note summarizes the paper, which uses U.S. stock and ETF ownership data, Russell 1000/2000 reconstitution instruments, ETF-flow shocks, institutional churn measures, variance-ratio tests, arbitrage-cost interactions, and ETF-ownership portfolio returns to examine whether ETFs raise underlying-stock volatility—using key variables such as ETF ownership, stock volatility, ETF flows, Russell index switches, trader churn, ETF mispricing, bid-ask spreads, lending fees, return reversals, variance ratios, and high-minus-low ETF ownership alphas—to show that ETF ownership causally increases stock volatility by transmitting short-horizon liquidity shocks through arbitrage, implying that ETFs can add nonfundamental volatility, mean reversion, and priced risk to the securities they hold."

- title: "Merton (Econometrica, 1973) - An Intertemporal Capital Asset Pricing Model"
  file: "Merton_Econometrica_1973.pdf"
  desc: "This note summarizes the paper, which develops a continuous-time intertemporal capital asset pricing model from dynamic consumption–portfolio choice under stochastic investment opportunities—using key objects such as diffusion return dynamics, state variables, the opportunity set, the Hamilton–Jacobi–Bellman equation, myopic demand, intertemporal hedging demand, three-fund separation, market clearing, market covariance, and state-variable covariance—to show that the classical CAPM is only a special case and that expected returns generally compensate investors for both market risk and hedging risk against changes in future investment opportunities."

- title: "Fecht, Hackethal, and Karabulut (JF, 2018) - Is Proprietary Trading Detrimental to Retail Investors?"
  file: "Fecht_Hackethal_Karabulut_JF_2018.pdf"
  desc: "This note summarizes the paper, which uses German Bundesbank security-level holdings data for banks and their retail customers, SoFFin forced-sales shocks, bank-customer stock-flow regressions, portfolio-management interactions, illiquidity tests, and performance comparisons to examine whether proprietary trading harms retail investors—using key variables such as bank stock flows, customer stock flows, bank sell indicators, forced-sales exposure, active portfolio management, Amihud illiquidity, large sell trades, customer trading profits, case-group stock returns, and customer portfolio alphas—to show that banks’ retail customers tend to buy stocks their banks are selling, especially when sales are large or illiquid, and subsequently underperform, implying that combining proprietary trading with retail distribution creates conflicts of interest that can transfer trading costs from banks to households."

- title: "Barberis, Shleifer & Wurgler (JFE, 2005) - Comovement"
  file: "Barberis_Shleifer_Wurgler_JFE_2005.pdf"
  desc: "This note summarizes the paper, which uses S&P 500 index additions and clean deletions as reclassification events to test whether return comovement is driven only by fundamentals or also by investor categories, habitats, and information diffusion—using key variables such as S&P and non-S&P returns, univariate and bivariate betas, R^2, event-time and calendar-time regressions, matched firms, turnover, and Dimson lead-lag betas—to show that stocks added to the S&P 500 load more on S&P returns and less on non-S&P returns after inclusion, implying that index membership can reshape covariance structure and that betas are partly determined by market institutions and investor demand rather than fundamentals alone."

- title: "Hansen & Singleton (JPE, 1983) - Stochastic Consumption, Risk Aversion, and the Temporal Behavior of Asse Returns"
  file: "Hansen_Singleton_JPE_1987.pdf"
  desc: "This note summarizes the paper, which estimates and tests a representative-agent CRRA consumption-based asset-pricing model under joint lognormal consumption-growth and return dynamics using postwar U.S. monthly consumption, stock-return, Treasury-bill, and nominal-return-spread data—using key variables such as real per-capita nondurable and services consumption growth, log asset returns, Euler-equation restrictions, risk-aversion parameter α, discount factor β, restricted VAR forecasts, likelihood-ratio tests, and return predictability R^2 -to show that the model is not strongly rejected for the aggregate value-weighted stock return but fails sharply for individual stocks, Treasury bills, and nominal return spreads, implying that the standard CRRA–lognormal consumption model is too narrow to explain the full time-series behavior of asset returns."

- title: "Daniel, Grinblatt, Titman, & Wermers (JF, 1997) - Measuring Mutual Fund Performance with Characteristic-Based Benchmarks"
  file: "Daniel_Grinblatt_Titman_Wermers_JF_1997.pdf"
  desc: "This note summarizes the paper, which uses quarterly mutual fund holdings from CDA over 1975–1994 and characteristic-matched benchmark portfolios sorted on size, book-to-market, and prior-year return to measure active fund performance—using key variables such as hypothetical holdings-based returns, Characteristic Selectivity, Characteristic Timing, Average Style, GT performance, Carhart factors, investment objectives, and performance persistence—to show that mutual funds have modest pre-cost stock-selection ability but little characteristic-timing skill or true benchmark-adjusted persistence, implying that active managers can select slightly better stocks within styles but much apparent performance reflects passive style and momentum exposures."

- title: "Denis, McConnell, Ovtchinnikov, & Yu (JF, 2003) - S&P 500 Index Additions and Earnings Expectations"
  file: "Denis_McConnell_Ovtchinnikov_Yu_JF_2003.pdf"
  desc: "This note summarizes the paper, which uses 1987–1999 S&P 500 index additions, CRSP announcement returns, I/B/E/S analyst EPS forecasts, realized earnings, and all-firm plus industry-size-liquidity matched benchmarks to test whether index inclusion is information-free—using key variables such as two-day excess returns, current-year and one-year-ahead EPS forecast revisions, price- and EPS-standardized forecast changes, benchmark-adjusted revisions, and forecast errors—to show that added firms receive more favorable analyst revisions and realize better earnings relative to expectations than benchmark firms, implying that S&P 500 additions contain value-relevant information and are not clean demand-only shocks for testing downward-sloping stock demand curves."

- title: "Becker & Milbourn (JFE, 2011) - How did increased competition affect credit ratings?"
  file: "Becker_Milbourn_JFE_2011.pdf"
  desc: "This note summarizes the paper, which uses the rise of Fitch as a third competitor in U.S. corporate credit ratings to test how rating-agency competition affects rating quality—using key variables such as Fitch industry-year market share, Moody’s and S&P rating levels, bond ratings, issuer leverage, bond yield spreads, default outcomes, industry demand controls, and IV-predicted Fitch share—to show that greater competition is associated with ratings inflation, weaker rating–yield informativeness, and poorer default prediction, implying that competition in issuer-paid information markets can reduce rather than improve information quality."

- title: "Adelino, Cunha, & Ferreira (RFS, 2017) - The Economic Effects of Public Financing: Evidence from Municipal Bond Ratings Recalibration"
  file: "Adelino_Cunha_Ferreira_RFS_2017.pdf"
  desc: "This note summarizes the paper, which uses Moody’s 2010 municipal bond ratings recalibration as a quasi-exogenous shock to local government financing constraints in a difference-in-differences and IV framework—using key variables such as county recalibration exposure, Moody’s and S&P rating changes, municipal bond issuance, offer yields, local government expenditures, public employment, private employment, sectoral employment, income, unemployment slack, and local-government leverage—to show that exogenous ratings upgrades increase public borrowing, spending, employment, and local income, implying that municipal bond market financing constraints have real effects, especially in slack local economies and financially constrained governments."

- title: "Barro (QJE, 2006) - Rare Disasters and Asset Markets in the Twentieth Century"
  file: "Barro_QJE_2006.pdf"
  desc: "This note summarizes the paper, which calibrates a representative-agent rare-disaster asset-pricing model using twentieth-century international GDP contractions, crisis asset returns, bill default evidence, and expected real interest rates—using key variables such as disaster probability p, disaster size b, risk aversion θ, partial bill default probability q, leverage, output-growth shocks, equity returns, bill returns, price-earnings ratios, and wartime real rates—to show that historically plausible rare disasters can generate a high equity premium, low risk-free rate, and low real rates during crisis-risk periods, implying that tail risk is a central force in asset pricing rather than a minor correction to normal consumption risk."

- title: "Malmendier & Nagel (QJE, 2016) - Learning from Inflation Experiences"
  file: "Malmendier_Nagel_QJE_2016.pdf"
  desc: "This note summarizes the paper, which uses Michigan Survey inflation expectations, long-run CPI histories, and SCF household balance-sheet data to estimate a learning-from-experience model in which individuals form inflation beliefs from lifetime inflation histories with age-dependent updating—using key variables such as cohort-specific experienced inflation, perceived AR(1) inflation parameters, gain parameter θ, experience-based forecasts, time fixed effects, fixed-rate mortgage debt, long-term nominal bond holdings, and aggregate expectations—to show that personal inflation experiences strongly shape both expectations and financial decisions, implying that macroeconomic beliefs are cohort-specific, path-dependent, and transmitted into household borrowing and portfolio choices."

- title: "Derrien & Kecskes (JF, 2013) - The Real Effects of Financial Shocks: Evidence from Exogenous Changes in Analyst Coverage"
  file: "Derrien_Kecskes_JF_2013.pdf"
  desc: "This note summarizes the paper, which uses broker closures and mergers as quasi-exogenous shocks to analyst coverage in a matched difference-in-differences design—using key variables such as analyst loss, treatment and control firms, investment, capital expenditures, R&D, acquisitions, long-term debt issuance, equity issuance, cash holdings, information asymmetry, financial constraints, analyst quality, and underwriting relationships—to show that losing analyst coverage reduces firms’ investment and external financing by roughly 2% of assets, implying that financial information intermediaries affect real corporate policies by lowering information asymmetry and improving access to capital."

- title: "Peress & Schmidt (JFE, 2024) - Uncertainty about what is in the price"
  file: "Peress_Schmidt_JFE_2024.pdf"
  desc: "This note summarizes the paper, which develops and tests a market-microstructure theory of uncertainty about what is already in prices using NYSE stocks, CRSP returns, TAQ intraday trades, realized skewness, trade imbalances, price-impact measures, and information-environment proxies—to show that investors trade less aggressively when their signals may be stale, causing skewness to fall after past returns and price impact to decrease for buys but increase for sells after price increases, implying that uncertainty about price content shapes order-flow informativeness, return asymmetry, and market liquidity."

- title: "Colliard, Foucault, and Hoffmann (JF, 2021) - Inventory Management, Dealers’ Connections, and Prices in Over-the-Counter Markets"
  file: "Colliard_Foucault_Hoffmann_JF_2021.pdf"
  desc: "This note summarizes the paper, which develops a theoretical OTC market model with core dealers, connected peripheral dealers, unconnected peripheral dealers, inventory costs, bilateral bargaining, and simulated D2D/D2C price regressions—to show that dealer connectedness affects prices only when aggregate peripheral inventory is imbalanced and outside options become valuable, implying that OTC price dispersion, client trading costs, and welfare losses depend jointly on who is connected and who is crowded in the inventory network."

- title: "Backus, Chernov, Zin, and Zviadadze (RFS, 2022) - Monetary Policy Risk: Rules versus Discretion"
  file: "Backus_Chernov_Zin_Zviadadze_RFS_2022.pdf"
  desc: "This note summarizes the paper, which estimates an arbitrage-free macro term-structure model to decompose the observed policy rate into a Taylor-rule target rate and a discretionary component, using long-run neutrality restrictions on real output and real asset values together with macro variables, nominal yields, the real pricing kernel, forward premiums, and yield-curve factors—to show that monetary policy discretion is distinct from rule-based policy, contributes materially to long-maturity term-premium risk, and is more closely linked to yield-curve slope and risk-premium movements, implying that monetary policy risk cannot be summarized by the short rate alone."

- title: "Kacperczyk, Pérignon, & Vuillemey (JF, 2021) - The Private Production of Safe Assets"
  file: "Kacperczyk_Perignon_Vuillemey_JF_2021.pdf"
  desc: "This note summarizes the paper, which uses broker closures and mergers as quasi-exogenous shocks to analyst coverage in a matched difference-in-differences design—using key variables such as analyst loss, treatment and control firms, investment, capital expenditures, R&D, acquisitions, long-term debt issuance, equity issuance, cash holdings, information asymmetry, financial constraints, analyst quality, and underwriting relationships—to show that losing analyst coverage reduces firms’ investment and external financing by roughly 2% of assets, implying that financial information intermediaries affect real corporate policies by lowering information asymmetry and improving access to capital."

- title: "Benamar, Foucault & Vega (RFS, 2021) - Demand for Information, Uncertainty, and the Response of U.S. Treasury Securities to News"
  file: "Benamar_Foucault_Vega_RFS_2021.pdf"
  desc: "This note summarizes the paper, which uses Bitly clickstream data on pre-announcement demand for macro-financial news as a high-frequency proxy for investor uncertainty and tests how it affects U.S. Treasury reactions to public news—using key variables such as NFP-related clicks, standardized payroll surprises, Treasury futures yield changes, surprise-by-information-demand interactions, Google Trends, news supply, VIX, swap-based uncertainty, realized volatility, order flow, and FOMC path surprises—to show that the same macro surprise moves Treasury yields more when investors searched more beforehand, implying that information demand reveals uncertainty not fully captured by standard market-, news-, or search-based proxies."

- title: "Dessaint, Foucault, Fresard, and Matray (RFS, 2019) - Noisy Stock Prices and Corporate Investment"
  file: "Dessaint_Foucault_Fresard_Matray_RFS_2019.pdf"
  desc: "This note summarizes the paper, which uses U.S. firm-level investment data, Hoberg–Phillips product-market peers, and mutual-fund hypothetical sales as nonfundamental peer-price shocks to test whether noisy stock prices distort corporate investment through managerial learning—using key variables such as peer MFHS fire-sale pressure, own and peer residual Tobin’s q, Capex/PPE, peer cash flow and size controls, insider purchases, division-level conglomerate investment, financing constraints, CEO pressure, peer investment, and correlated own-price noise—to show that negative nonfundamental shocks to peers’ stock prices reduce firms’ investment temporarily, implying that stock-market noise can affect real decisions even without financing constraints, equity issuance, short-termism, or agency problems because managers learn from prices that sometimes misinform them."

- title: "Guryan, Hurst, & Kearney (JEP, 2008) - Parental Education and Parental Time with Children"
  file: "Guryan_Hurst_Kearney_JEP_2008.pdf"
  desc: "This note summarizes the paper, which uses U.S. American Time Use Survey diaries and international time-use data to document parental child-care time by education, income, gender, work status, and country—using key variables such as primary child care, basic/educational/recreational/travel child care, time around children, parental education, working status, market work, home production, leisure, GDP per capita, and within-country education gradients—to show that higher-educated and higher-income parents spend more active time with children despite higher opportunity costs, implying that child care is distinct from ordinary home production or leisure and may reinforce intergenerational inequality through active parental investment."

- title: "Dugast & Foucault (JFE, 2018) - Data Abundance and Asset Price Informativeness"
  file: "Dugast_Foucault_JFE_2018.pdf"
  desc: "This note summarizes the paper, which develops a theoretical model of information production and Kyle-style trading in which cheap fast raw signals and costly slow processed signals coexist—using key variables such as raw-signal reliability θ, raw-signal cost C_r, processed-signal cost C_p, speculator demand for raw and processed signals, order flow, market-maker prices, expected information profits, and short- versus long-run price informativeness—to show that lower raw-data costs can raise short-run informativeness while crowding out deeper processed research and reducing long-run informativeness, implying that data abundance can make markets faster without necessarily making prices more fundamentally informative"

- title: "Kazemi (RFS, 1992) - An Intemporal Model of Asset Prices in a Markov Economy with a Limiting Stationary Distribution"
  file: "Kazemi_RFS_1992.pdf"
  desc: "This note summarizes the paper, which develops an intertemporal asset-pricing model in a Markov economy with a limiting stationary distribution, using the very-long-term default-free discount bond as an observable proxy for marginal-utility risk—through key objects such as Markov state variables, stationary transition densities, composite-investor marginal utility, finite- and very-long-maturity discount bond returns, VLD bond covariance betas, excess-return variance restrictions, and finite-maturity bias terms—to show that asset risk premia can be priced by covariance with the VLD bond return, implying that long-bond returns can replace unobservable consumption or market-portfolio risk when stationarity and the long-maturity approximation are valid."

- title: "Darmouni & Siani (JME, 2025) - Bond market stimulus: Firm-level evidence"
  file: "Darmouni_Siani_JME_2025.pdf"
  desc: "This note summarizes the paper, which uses the Federal Reserve’s 2020 corporate bond market intervention as a laboratory and combines bond issuance, balance-sheet, bank-credit, payout, TRACE spread, index-weight IV, and high-frequency announcement designs—using key variables such as Fed eligibility, index weights, announcement-induced spread compression, abnormal bond issuance, cash holdings, PPE investment, revolving credit, bank-debt repayment, bond rollover, credit-line drawdowns, and equity repurchases—to show that bond-market stimulus strongly revived issuance but firms mainly used proceeds for cash accumulation, bank-loan repayment, and refinancing rather than real investment, implying that unconventional monetary policy can stabilize funding markets while transmitting primarily through liquidity management and capital-structure adjustment rather than immediate capital spending."

- title: "Martin & Nagel (JFE, 2022) - Market Efficiency in the Age of Big Data"
  file: "Martin_Nagel_JPE_2022.pdf"
  desc: "This note summarizes the paper, which develops a high-dimensional Bayesian-learning model of market efficiency and illustrates it with CRSP stock returns and 238 lagged return-based predictors—using key variables such as asset characteristics, unknown cash-flow coefficients, Bayesian priors, ridge/Lasso shrinkage, in-sample and out-of-sample predictive regressions, anomaly-portfolio returns, cross-validation, predictor-to-asset ratio J/N, and excess shrinkage or sparsity—to show that rational investors can generate strong in-sample return predictability purely from real-time learning and shrinkage, implying that in the age of big data, out-of-sample predictability is the economically meaningful test of market efficiency rather than in-sample anomaly discovery"

- title: "Molavi, Tahbaz-Salehi & Vedolin (RES, 2024) - Model Complexity, Expectations, and Asset Prices"
  file: "Molavi_TahbazSalehi_Vedolin_RES_2024.pdf"
  desc: >-
    This note summarizes the paper, which develops a theory of asset pricing under Bayesian learning with limited model complexity and applies it to uncovered interest parity—using key variables such as the true n-factor fundamental process, agents’ constrained k-factor subjective model, KL-minimizing approximations, true and perceived autocorrelations, excess returns, forecast errors, interest-rate differentials, currency excess returns, and survey forecast errors—to show that when agents can only represent a low-dimensional approximation of a richer process, predictable belief errors and return predictability arise endogenously, implying that a one-factor subjective model can jointly explain the short-run forward-discount puzzle and the long-run UIP predictability reversal

- title: "Koijen, Richmond, & Yogo (RES, 2024) - Which Investors Matter for Equity Valuations and Expected Returns?"
  file: "Koijen_Richmond_Yogo_RES_2024.pdf"
  desc: >-
    This note summarizes the paper, which estimates investor-level equity demand systems using U.S. institutional holdings from FactSet Ownership over 2000–2019 and solves market-clearing counterfactuals to identify which investors move valuations, expected returns, informativeness, and wealth—using key variables such as investor type, portfolio weights, market-to-book equity, firm characteristics, environmental and governance scores, active share, price elasticity, investor wealth shares, latent demand, counterfactual capital flows, and climate-related demand shifts—to show that investor identity matters because prices are shaped by heterogeneous demand curves, with active-to-passive flows causing large repricing but little loss of informativeness, climate demand shifts redistributing wealth across investor groups, and hedge funds having outsized price impact per dollar due to distinctive and relatively elastic demand.

- title: "Ross (JF, 2015) - The Recovery Theorem"
  file: "Ross_JF_2015.pdf"
  desc: >-
    This note summarizes the paper, which proves that under no arbitrage, an irreducible state-price transition matrix, and a transition-independent pricing kernel, market state prices can recover the natural probability distribution, subjective discount factor, and pricing kernel through a Perron–Frobenius eigenvalue problem—using key objects such as Arrow-Debreu state prices, risk-neutral transition probabilities, the transition state-price matrix P, pricing-kernel matrix D, natural transition matrix F, eigenvalue δ, positive eigenvector z, S&P 500 option-implied state prices, recovered crash probabilities, and historical bootstrapped distributions—to show that derivative prices may contain recoverable information about market beliefs and risk aversion, with the empirical illustration implying substantially fatter left-tail crash probabilities than historical returns alone.

- title: "Maggiori, Neiman, & Schreger (JPE, 2020) - International Currencies and Capital Allocation"
  file: "Maggiori_Neiman_Schreger_JPE_2020.pdf"
  desc: "This note summarizes the paper, which uses global security-level Morningstar mutual fund and ETF holdings matched to ultimate parent firms to study how currency denomination shapes cross-border bond portfolios and firm access to foreign capital—using key variables such as investor domicile, issuer parent country, bond currency, home-currency and home-country indicators, within-firm bond comparisons, local-currency-only status, multi-currency issuance, firm size, foreign ownership shares, and USD/EUR portfolio shares—to show that investors display strong home-currency bias even within the same issuer, that non-US local-currency-only firms are largely held by domestic bond investors while foreign-currency issuers access global bond capital, and that the dollar’s international role gives U.S. firms a special advantage in borrowing abroad without issuing foreign-currency debt."

- title: "De Loecker, Eeckhout, & Unger (QJE, 2020) - The Rise of Market Power and the Macroeconomic Implications"
  file: "DeLoecker_Eeckhout_Unger_QJE_2020.pdf"
  desc: "This note summarizes the paper, which uses Compustat firm-level data and Census robustness checks to estimate U.S. firm markups through the production approach—using key variables such as COGS-based variable input shares, output elasticities, revenue-weighted and input-weighted markups, SG&A overhead, capital costs, profit rates, market value, dividends, R&D, advertising, labor and capital shares, and reallocation across firms—to show that aggregate U.S. markups rose sharply after 1980 mainly because sales shifted toward high-markup firms in the upper tail, implying that rising market power helps explain higher profits, higher valuations, lower factor shares, and weaker macroeconomic dynamism."

- title: "Greenwood and Hanson (RFS, 2013) - Issuer Quality and Corporate Bond Returns"
  file: "Greenwood_Hanson_RFS_2013.pdf"
  desc: "This note summarizes the paper, which uses Compustat-based issuer-quality measures and historical bond-issuance ratings to show that the credit quality of firms issuing debt forecasts future corporate bond returns—using key variables such as net debt issuance, expected default frequency, ISS^{EDF}, high-yield issuance share, high-yield/BBB/AAA excess returns, credit spreads, default rates, aggregate credit growth, intermediary balance-sheet measures, short rates, term spreads, and past default/return conditions—to show that periods when low-quality firms issue disproportionately more debt are followed by poor high-yield bond returns, spread widening, and higher defaults, implying that the composition of credit issuance is a stronger signal of credit-market overheating than aggregate credit quantity alone."

- title: "Andrade and Kaplan (JF, 1998) - How Costly Is Financial (Not Economic) Distress? Evidence from Highly Leveraged Transactions That Became Distressed"
  file: "Andrade_Kaplan_JF_1998.pdf"
  desc: "This note summarizes the paper, which uses 31 distressed 1980s highly leveraged transactions tracked from pre-transaction through distress resolution and combines leverage decomposition, counterfactual interest-coverage calculations, benchmark-adjusted capital returns, operating-margin losses, predistress-value versus realized-value estimates, shock versus no-shock splits, qualitative channel evidence, and cross-sectional cost regressions—using key identification variables such as post-HLT leverage, interest coverage, EBITDA margins, capex, net cash flow, industry benchmarks, predistress capital value, resolution value, adverse economic shocks, bank debt share, deal size, and time in distress—to show that leverage, not poor operating fundamentals, usually triggered distress, while pure financial distress costs were moderate and often small absent real business shocks, implying that distress costs for mature cash-flow-positive firms are far below catastrophic levels and arise mainly through underinvestment, depressed asset sales, and delay."

- title: "Greenwood, Hanson, and Stein (JF, 2015) - A Comparative-Advantage Approach to Government Debt Maturity"
  file: "Greenwood_Hanson_Stein_JF_2015.pdf"
  desc: "This note summarizes the paper, which combines stylized-fact evidence on Treasury bill convenience premia and financial commercial paper with a normative model of government debt maturity and private money creation—using key identification and mechanism variables such as T-bill z-spreads, BILLS/GDP, NONBILLS/GDP, seasonal tax-date bill-supply instruments, FINCP/GDP, debt-to-GDP, weighted-average Treasury maturity, rollover-risk parameter b, short-term debt share S, private money M_P, fire-sale costs, and crowding-out elasticity—to show that short-term government debt provides valuable monetary services but creates rollover risk, and that T-bill issuance can also improve financial stability by crowding out fragile private short-term funding, implying that debt maturity policy should be treated as part of the financial-stability toolkit."

- title: "Zingales (RFS, 1994) - The Value of the Voting Right: A Study of the Milan Stock Exchange Experience"
  file: "Zingales_RFS_1994.pdf"
  desc: "This note summarizes the paper, which uses Italian dual-class firms on the Milan Stock Exchange from 1987–1990 to estimate the value of voting rights by comparing voting common shares with nonvoting savings shares that have superior dividend rights, and relates the resulting voting premium to ownership structure and pivotal voting power—using key identification variables such as raw and dividend-adjusted voting premia, relative Shapley value, fraction of voting shares, majority-control status, largest and second-largest shareholder stakes, dividend privileges, and the Credito Italiano privatization case—to show that voting shares command extremely large premia when votes can affect control, implying that private benefits of control and weak minority-investor protection can make voting rights as valuable as cash-flow rights."

- title: "Roberts & Sufi (JFE, 2009) - Renegotiation of Financial Contracts: Evidence from Private Credit Agreements"
  file: "Roberts_Sufi_JFE_2009.pdf"
  desc: "This note summarizes the paper, which uses 1,000 SEC-filed private credit agreements of U.S. public firms from 1996–2005 and tracks the first ex post changes to loan amount, spread, or maturity before stated maturity through SEC filings, Dealscan, Compustat, and CRSP—using key identification variables such as renegotiation timing, borrower credit quality, asset growth, leverage, profitability, equity returns, investment opportunities, covenant violations, lender health, macro credit spreads, initial maturity, pricing grids, borrowing bases, and financial covenants—to show that private debt renegotiation is pervasive, early, and economically large, implying that loan contingencies mainly allocate bargaining power in future renegotiations rather than preventing renegotiation altogether."

- title: "Graham (JF, 2000) - How Big Are the Tax Benefits of Debt?"
  file: "Graham_JF_2000.pdf"
  desc: "This note summarizes the paper, which constructs firm-specific simulated marginal tax benefit functions for corporate interest deductions using COMPUSTAT firm-years from 1980–1994 and values debt tax shields by integrating under those functions—using key measurement variables such as simulated marginal tax rates, tax-loss carrybacks and carryforwards, non-debt tax shields, interest deductions, gross and net tax benefits, kink, ZeroBen, leverage, Z-scores, profitability, liquidity, growth options, collateral, and persistence of debt conservatism—to show that the tax benefits of debt are economically large but many financially healthy firms use debt conservatively and leave substantial tax benefits unused, implying a central capital-structure puzzle beyond simple tax-versus-bankruptcy trade-off theory."

- title: "Dyck & Zingales (JF, 2004) - Private Benefits of Control: An International Comparison"
  file: "Dyck_Zingales_JF_2004.pdf"
  desc: "This note summarizes the paper, which uses 393 private control-block transactions across 39 countries from 1990–2000 to estimate private benefits of control from block-price premia relative to post-announcement market prices and then relates these premia to financial development and institutional variables—using key identification variables such as block size, market price, country fixed effects, bargaining controls, majority control, foreign acquirer status, U.S. cross-listing, ownership concentration, IPOs, listed firms, external equity capitalization, legal protections, newspaper diffusion, tax compliance, and legal origin—to show that private benefits of control are large, vary sharply across countries, reduce public equity-market development, and are constrained not only by formal investor-protection law but also by media scrutiny and tax enforcement."

- title: "Benmelech (RFS, 2009) - Asset Salability and Debt Maturity: Evidence from Nineteenth-Century American Railroads"
  file: "Benmelech_RFS_2009.pdf"
  desc: "This note summarizes the paper, which uses nineteenth-century American railroad data and track-gauge compatibility as a physical measure of collateral salability, estimating leverage, debt-maturity, buyer-size, crisis-refinancing, and robustness regressions—using key identification variables such as road and rolling-stock salability, number and mileage of solvent same-gauge potential buyers, receiverships share, standard-gauge status, leverage, weighted debt maturity, long-term bond issuance, credit-line reliance, and 1875 depression refinancing—to show that more salable collateral supports longer debt maturity and better access to long-term financing in distress, implying that liquidation value depends not just on asset tangibility but on the thickness and financial health of the resale market."

- title: "Diamond and Rajan (QJE, 2011) - Fear of Fire Sales, Illiquidity Seeking, and Credit Freezes"
  file: "Diamond_Rajan_QJE_2011.pdf"
  desc: "This note summarizes the paper, which develops a theoretical model of banks with illiquid assets, short-term debt, limited liability, and finite outside liquidity—using key mechanism variables such as date-0 asset prices, future fire-sale prices, liquidity-shock probability, withdrawal demand, bank debt, outside buyer liquidity, ordinary lending, solvency thresholds, and forced asset sales—to show that weak banks may rationally refuse early asset sales because the insurance value mainly benefits debt holders, while liquid buyers hoard cash for future fire sales, implying that anticipated fire-sale risk can simultaneously freeze asset markets and reduce current lending."

- title: "Bertrand and Mullainathan (JPE, 2003) - Enjoying the Quiet Life? Corporate Governance and Managerial Preferences"
  file: "Bertrand_Mullainathan_JPE_2003.pdf"
  desc: "This note summarizes the paper, which uses staggered state business-combination antitakeover laws as governance shocks and estimates firm- and plant-level differences-in-differences using LRD–Compustat manufacturing data and auxiliary-establishment data—using key identification variables such as state of incorporation, state of plant location, law adoption timing, blue- and white-collar wages, white-collar employment, plant births and deaths, capital expenditures, firm size, TFP, and return on capital—to show that weaker takeover discipline raises worker rents and administrative staffing, reduces both plant closures and openings, leaves investment and scale largely unchanged, and lowers productivity and profitability, implying that poorly governed managers mainly enjoy a “quiet life” rather than aggressively build empires."

- title: "Diamond (RES, 1984) - Financial Intermediation and Delegated Monitoring"
  file: "Diamond_RES_1984.pdf"
  desc: "This note summarizes the paper, which develops a pure theory model of financial intermediation as delegated monitoring—using key mechanism variables such as privately observed project returns, monitoring cost K, many dispersed lenders, debt contracts, bankruptcy penalties, intermediary receipts, depositor repayments, portfolio size N, and delegation cost D_N —to show that direct monitoring is inefficient when lenders are dispersed, but a diversified intermediary can monitor borrowers once, pool independent loan cash flows, drive per-borrower delegation costs toward zero, and issue safe debt-like claims, implying that banks exist because diversification makes delegated monitoring incentive compatible."

- title: "Frydman & Saks (RFS, 2010) - Executive Compensation: A New View from a Long-Term Perspective, 1936–2005"
  file: "Frydman_Saks_RFS_2010.pdf"
  desc: "This note summarizes the paper, which hand-collects a long-run panel of top executive compensation in large U.S. public firms from 1936–2005 and analyzes pay levels, pay components, firm-size correlations, taxes, CEO premia, stock and option holdings, and pay-to-performance sensitivity—using key measurement variables such as salary, bonus, long-term pay, Black–Scholes option values, firm market value, after-tax compensation, Jensen–Murphy incentives, equity-at-stake, and CEO versus non-CEO status—to show that executive pay was nearly flat from the late 1940s to the mid-1970s but rose sharply after the 1980s with stronger equity-linked incentives and a historically new firm-size/pay relationship, implying that no single explanation such as firm size, taxes, governance, risk, or options alone can explain the modern executive-pay boom."

- title: "Brav, Jiang, Partnoy & Thomas (JF, 2008) - Hedge Fund Activism, Corporate Governance, and Firm Performance"
  file: "Brav_Jiang_Partnoy_Thomas_JF_2008.pdf"
  desc: "This note summarizes the paper, which uses a hand-collected U.S. hedge fund activism sample from 2001–2006 centered on Schedule 13D filings and estimates matched-firm comparisons, targeting probits, announcement-window abnormal returns, cross-sectional return regressions, long-run factor regressions, and post-event performance tests—using key identification variables such as activist objectives, tactics, ownership stakes, target characteristics, 13D event windows, abnormal turnover, holding periods, CEO pay and turnover, payout, leverage, and operating performance—to show that activist hedge funds typically take minority stakes but generate positive announcement returns, no long-run reversal, and real governance and operating changes, implying that hedge fund activism functions as an effective monitoring mechanism rather than merely short-term trading."

- title: "Giannetti, Liberti & Sturgess (RFS, 2017) - Information Sharing and Rating Manipulation"
  file: "Giannetti_Liberti_Sturgess_RFS_2017.pdf"
  desc: "This note summarizes the paper, which uses Argentina’s 1998 public credit-registry expansion as a local difference-in-differences around the USD 200,000 disclosure threshold and exploits the announcement-to-implementation interim period—using key identification variables such as treated versus control borrowers, interim timing, single- versus multiple-lender relationships, local-bank status, rating downgrades/upgrades, future default, and post-reform lending relationships—to show that banks strategically manipulated borrower ratings before disclosure, downgrading good exclusive borrowers to preserve informational rents and upgrading weaker multiple-lender borrowers to avoid creditor runs, implying that information-sharing reforms can improve credit allocation only when the supplied information remains incentive-compatible and reliable."

- title: "Kaplan & Rauh (JEP, 2013) - It’s the Market: The Broad-Based Rise in the Return to Top Talent"
  file: "Kaplan_Rauh_JEP_2013.pdf"
  desc: "This note summarizes the paper, which uses descriptive evidence on CEO pay, top income shares, hedge fund and private equity pay, law-partner income, professional-athlete salaries, Forbes 400 wealth origins, and non-US billionaire composition—using key comparison variables such as realized and estimated CEO pay, CEO pay relative to top 0.1% AGI, top 1% income shares before and after taxes/transfers, inherited versus first-generation wealth, childhood wealth background, and industry sources of fortunes—to argue that the rise in top incomes is broad-based across scalable talent markets rather than concentrated only in public-company managerial power, implying that technology, finance, globalization, and market scale raised the return to top talent."

- title: "Khwaja & Mian (AER, 2008) - Tracing the Impact of Bank Liquidity Shocks: Evidence from an Emerging Market"
  file: "Khwaja_Mian_AER_2008.pdf"
  desc: "This note summarizes the paper, which uses Pakistan’s 1998 foreign-currency-deposit freeze as a bank liquidity shock and estimates bank–firm lending regressions with firm fixed effects plus extensive-margin, interest-rate, firm-borrowing, size-heterogeneity, and default tests—using key identification variables such as banks’ pre-shock dollar-deposit exposure, deposit growth, bank–firm loan changes, loan exit and entry, interest rates, aggregate firm borrowing, firm size, new-bank borrowing, and default rates—to show that liquidity-hit banks cut lending to the same firms, mainly through quantity rationing, but large firms hedge by borrowing from other banks while small firms cannot and suffer higher financial distress, implying that bank lending shocks matter for the real economy when borrowers lack lender-substitution capacity."

- title: "Shue & Townsend (JF, 2017) - How Do Quasi-Random Option Grants Affect CEO Risk-Taking?"
  file: "Shue_Townsend_JF_2017.pdf"
  desc: "This note summarizes the paper, which uses Execucomp CEO grant-level option data and two quasi-random IV designs based on multiyear compensation cycles—predicted first years of fixed-value cycles and fixed-number plans interacted with industry returns—using key identification variables such as new option grant value, delta, vega, fixed-value and fixed-number plan status, predicted cycle starts, industry returns, equity volatility, leverage, debt issuance, and investment outcomes, to show that moderate increases in new at-the-money CEO option grants causally raise firm risk-taking, mainly through higher leverage rather than large investment changes."

- title: "Whited (JF, 1992) - Debt, Liquidity Constraints, and Corporate Investment: Evidence from Panel Data"
  file: "Whited_JF_1992.pdf"
  desc: "This note summarizes the paper, which uses a dynamic investment Euler-equation framework estimated by GMM on a panel of U.S. manufacturing firms, augmenting the standard neoclassical model with a latent shadow cost of external finance parameterized by leverage and interest-coverage distress measures—using key identification variables such as bond-rating status, debt-to-assets, interest coverage, investment, capital, output, variable costs, Tobin’s q, firm/time effects, and overidentification tests—to show that the standard Euler equation fails mainly for financially distressed and non-rated firms, while allowing firm-specific financing wedges greatly improves model fit, implying that debt-market frictions alter real investment by changing firms’ effective intertemporal discount rates."

- title: "La Porta, Lopez-de-Silanes, Shleifer, & Vishny (JF, 1997) - Legal Determinants of External Finance"
  file: "LaPorta_LopezDeSilanes_Shleifer_Vishny_JF_1997.pdf"
  desc: "This note summarizes the paper, which uses a 49-country cross-section of legal origins, investor-protection rules, enforcement quality, and external-finance outcomes, together with country-level regressions, rights-sorted means, and WorldScope firm-level comparisons—using key identification variables such as English/French/German/Scandinavian legal origin, rule of law, antidirector rights, one-share-one-vote, creditor rights, outsider-held stock-market capitalization, listed firms, IPOs, and debt/GNP—to show that countries with stronger investor protections and better legal enforcement have larger and broader equity and debt markets, implying that external finance depends fundamentally on legal institutions that protect outside investors from expropriation."

- title: "Acharya, Schnabl, & Suarez (JFE, 2013) - Securitization without risk transfer"
  file: "Acharya_Schnabl_Suarez_JFE_2013.pdf"
  desc: "This note summarizes the paper, which uses Moody’s ABCP conduit data, sponsor bank balance sheets, guarantee classifications, the August 2007 ABCP run, rollover outcomes, bank stock returns, and missing-capital calculations—using key identification variables such as liquidity versus credit guarantees, conduit exposure, sponsor leverage and Tier 1 capital ratios, ABCP outstanding, spreads, repayment/default status, and bank equity returns—to show that banks used liquidity-guaranteed conduits for regulatory capital arbitrage while retaining economic risk, implying that this form of securitization shifted assets off balance sheet without meaningful risk transfer."

- title: "Rauh (JF, 2006) - Investment and Financing Constraints: Evidence from the Funding of Corporate Pension Plans"
  file: "Rauh_JF_2006.pdf"
  desc: "This note summarizes the paper, which uses mandatory contributions to underfunded defined-benefit pension plans as legally driven internal-cash shocks and estimates investment regressions with firm/year fixed effects, Tobin’s Q, nonpension cash flow, pension funding-status controls, predictable versus unexpected contribution components, financing-constraint heterogeneity, and industry-offset tests—using key identification variables such as mandatory pension contributions, pension funding status, capital expenditures, nonpension cash flow, credit ratings, dividends, cash-minus-debt, firm age, and non-DB industry investment—to show that required pension funding crowds out corporate investment by roughly 60–80 cents per dollar, especially for financially constrained firms, implying that internal financial resources causally affect real investment decisions."

- title: "Behn, Haselmann, & Wachtel (JF, 2016) - Procyclical Capital Regulation and Lending"
  file: "Behn_Haselmann_Wachtel_JF_2016.pdf"
  desc: "This note summarizes the paper, which uses German credit-register data around the Lehman shock and the phased Basel II IRB rollout to compare IRB and SA loans within and across banks—using key identification variables such as loan regulatory approach, PD-based risk weights, IRB loan status, SA loan status, bank and firm fixed effects, SME capital-charge discounts, bank capital, loan size, firm profitability, loan quantities, interest rates, and firm-level total borrowing—to show that risk-sensitive model-based capital regulation made banks cut IRB loans more than comparable SA loans when credit risk rose, implying that microprudential risk sensitivity can amplify downturns through procyclical credit contraction."

- title: "Jiménez, Ongena, Peydró, & Saurina (Econometrica, 2014) - Hazardous Times for Monetary Policy: What Do Twenty-Three Million Bank Loans Say About the Effects of Monetary Policy on Credit Risk-Taking?"
  file: "Jimenez_Ongena_Peydro_Saurina_Econometrica_2014.pdf"
  desc: "This note summarizes the paper, which uses Spanish credit-register data on loan applications and granted loans from 2002–2008 and estimates two-stage selection models with firm-time and bank-time fixed effects plus macro horse-race tests—using key identification variables such as overnight-rate changes, firm risk, bank capital, their triple interaction, loan approval, committed credit, collateral, and future default—to show that lower short-term rates make low-capital banks expand credit more aggressively to risky firms, grant larger and less-collateralized loans, and suffer higher subsequent default, implying that monetary policy affects not only credit volume but also the risk composition of bank lending."

- title: "Zwick & Mahon (AER, 2017) - Tax Policy and Heterogeneous Investment Behavior"
  file: "Zwick_Mahon_AER_2017.pdf"
  desc: "This note summarizes the paper, which uses IRS corporate tax-return data and a continuous difference-in-differences design based on industry variation in the present value of bonus depreciation benefits—using key identification variables such as eligible equipment investment, depreciation-schedule exposure z_{N,t}, firm and year fixed effects, structures placebo investment, bonus take-up, firm size, dividend status, cash holdings, taxable status, and Section 179 bunching—to show that temporary depreciation incentives significantly raise investment, especially for small, financially constrained, and currently taxable firms, implying that investment tax policy works through heterogeneous liquidity and immediacy channels rather than a uniform representative-firm user-cost response."

- title: "Kaplan and Zingales (QJE, 1997) - Do Investment-Cash Flow Sensitivities Provide Useful Measures of Financing Constraints?"
  file: "Kaplan_Zingales_QJE_1997.pdf"
  desc: "This note summarizes the paper, which revisits the classic Fazzari-Hubbard-Petersen low-dividend firm sample and combines a theoretical model of costly external finance with archival firm-year classifications from annual reports, 10-Ks, liquidity discussions, and financial statements, estimating FHP-style investment-q-cash flow regressions, status-interaction tests, lagged-status regressions, cash-stock specifications, Euler-equation robustness checks, and outlier trims—using key identification variables such as investment, cash flow, Tobin’s Q and internal funds—to show that investment-cash flow sensitivity is not monotone in financing constraints and that less constrained firms often have higher sensitivities, implying that high cash-flow sensitivity is not a reliable measure of financial constraint severity."

- title: "Hayashi (Econometrica, 1982) - Tobin’s Marginal q and Average q: A Neoclassical Interpretation"
  file: "Hayashi_Econometrica_1982.pdf"
  desc: "This note summarizes the paper, which develops a neoclassical dynamic investment model with adjustment costs, taxes, depreciation allowances, and investment tax credits, and illustrates it with U.S. aggregate corporate data from 1952–1978—using key mechanism variables such as capital K, investment I, installation function ψ(I,K), marginal q, average q, modified tax-adjusted q, tax shields A(0), depreciation value z, investment tax credit k, and market power—to show that investment is governed by modified marginal q, that observable average q equals marginal q only under competitive constant-returns conditions after tax corrections, and that raw average q is generally an invalid empirical proxy when taxes or monopoly rents matter."

- title: "Tørsløv, Wier, and Zucman (RES, 2023) - The Missing Profits of Nations"
  file: "Torslov_Wier_Zucman_RES_2023.pdf"
  desc: "This note summarizes the paper, which builds a global macro-accounting framework using national accounts, foreign affiliates statistics, U.S. outward FATS, and bilateral balance-of-payments data—using key identification variables such as foreign-versus-local firm profitability, profits-to-wages ratios, effective tax rates, tax-haven status, excess high-risk service exports, intra-group interest flows, shifted-profit allocations, and corrected GDP/factor-share measures—to show that multinationals shifted about $616 billion of profits to tax havens in 2015, heavily distorting measured profits, tax bases, trade balances, GDP, and capital shares across countries, especially in high-tax Europe and tax-haven economies."

- title: "Grinblatt, Keloharju, and Linnainmaa (JF, 2011) - IQ and Stock Market Participation"
  file: "Grinblatt_Keloharju_Linnainmaa_JF_2011.pdf"
  desc: "This note summarizes the paper, which uses Finnish administrative data linking military IQ scores to stock and mutual-fund ownership, tax records, demographics, sibling links, and portfolio outcomes, and estimates participation probits, affluent-subsample tests, Fairlie-Blinder-Oaxaca decompositions, sibling control-function models, family random-effects probits, and portfolio-quality regressions—using key identification variables such as IQ stanines and subscores, stock-market participation, income, wealth, education proxies, sibling IQ, family effects, Sharpe ratios, diversification, mutual-fund ownership, and portfolio risk—to show that cognitive ability strongly predicts both stock market entry and investment quality even after rich controls, implying that cognitive skill is a first-order friction behind household nonparticipation and poor portfolio choice."

- title: "Bolton and Scharfstein (AER, 1990) - A Theory of Predation Based on Agency Problems in Financial Contracting"
  file: "Bolton_Scharfstein_AER_1990.pdf"
  desc: "This note summarizes the paper, which develops a two-period theoretical model of predation under agency-based financial contracting—using key mechanism variables such as unverifiable profits, low and high profit states, fixed operating cost F, refinancing probabilities β1 ,β2 , incentive constraints, contract observability, predation cost Δ, and continuation rules—to show that rivals can rationally prey on financially constrained firms by increasing the likelihood that performance-based financing cutoffs trigger inefficient exit, and that observable contracts can deter predation by softening survival sensitivity, while hidden contracts restore the steep incentive contract and make predation occur in equilibrium."

- title: "Kaul, Mehrotra, & Morck (JF, 2000) - Demand Curves for Stocks Do Slope Down: New Evidence from an Index Weights Adjustment"
  file: "Kaul_Mehrotra_Morck_JF_2000.pdf"
  desc: "This note summarizes the paper, which uses the 1996 TSE 300 public-float redefinition as a mechanical, information-light index-demand shock and estimates event-week excess returns, beta-adjusted abnormal returns, excess-turnover tests, reversal regressions, and cross-sectional SUR demand-shift regressions—using key identification variables such as float changes, index-weight changes, DaysTraded, affected versus comparison stocks, event-week returns, turnover spikes, and post-event reversals—to show that stocks receiving larger index-induced demand increases experience persistent price increases and higher trading volume, implying that individual stock demand curves slope downward rather than being perfectly elastic."

- title: "Heimer & Simsek (JFE, 2019) - Should retail investors’ leverage be limited?"
  file: "Heimer_Simsek_JFE_2019.pdf"
  desc: "This note summarizes the paper, which uses the 2010 CFTC retail-FX leverage cap as a policy experiment and estimates U.S.-Europe difference-in-differences, event-study, high-leverage heterogeneity, trader-return portfolio, broker-capital, and relative-spread regressions—using key identification variables such as U.S. treatment status, post-constraint implementation, pre-policy leverage use, trading volume, number of trades, trader returns, broker excess capital, and retail-versus-interbank bid-ask spreads—to show that limiting retail leverage sharply reduces speculative trading and trader losses, shrinks broker intermediation rents, and does not measurably worsen local liquidity, implying that retail leverage mainly financed costly speculation rather than socially useful liquidity provision."

- title: "Kashyap, Kovrijnykh, Li, and Pavlova (JFE, 2021) - The benchmark inclusion subsidy"
  file: "Kashyap_Kovrijnykh_Li_Pavlova_JFE_2021.pdf"
  desc: "This note summarizes the paper, which develops a theoretical model of benchmarked asset management and calibrates the benchmark inclusion subsidy using institutional ownership differences between S&P 500 firms and the broader market—using key mechanism variables such as benchmark membership, manager relative-performance incentives, inelastic benchmark demand, cash-flow variance, project covariance with existing assets, passive-management share, institutional ownership gaps, cost-of-capital wedges, M&A, IPOs, spinoffs, and ESG benchmark design—to show that benchmark firms value risky cash flows more than otherwise identical non-benchmark firms, implying that benchmarking can lower project-specific costs of capital and affect real corporate decisions beyond asset prices."

- title: "Bell, Kakhbod, Lettau, & Nazemi (JFE, 2026) - Glass box machine learning and corporate bond returns"
  file: "Bell_Kakhbod_Lettau_Nazemi_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses TRACE/WRDS firm-level corporate bond returns from 2002–2020 and an interpretable Explainable Boosting Machine with nonlinear additive shape functions and selected pairwise interactions—using key prediction variables such as changes in financial and macroeconomic uncertainty, TERM, LTREVB, spread, rating, spread-times-rating, maturity, duration, and out-of-sample R^2, portfolio returns, EBM importance scores, SHAP comparisons, and simulation diagnostics—to show that glass-box machine learning can match black-box predictive performance while revealing that corporate bond return predictability is driven mainly by tail nonlinearities in uncertainty and interactions between uncertainty shocks and bond risk characteristics."

- title: "Hartzmark & Shue (JF, 2018) - A Tough Act to Follow: Contrast Effects in Financial Markets"
  file: "Hartzmark_Shue_JF_2018.pdf"
  desc: "This note summarizes the paper, which uses U.S. quarterly earnings announcements from 1984–2013 and estimates contrast-effect regressions, interaction tests, reversal tests, trading-strategy returns, information-transmission checks, and robustness tests—using key identification variables such as the firm’s own earnings surprise, the previous trading day’s salient large-firm earnings surprise, characteristic-adjusted announcement returns, event windows, long-run reversals, alternative surprise measures, announcement timing, firm size, and industry comparison groups—to show that investors undervalue today’s earnings news after unusually good prior salient news and overvalue it after bad prior news, implying that contrast effects create temporary mispricing even in liquid financial markets."

- title: "Dang, Gorton, Holmstrom, and Ordonez (AER, 2017) - Banks as Secret Keepers"
  file: "Dang_Gorton_Holmstrom_Ordonez_AER_2017.pdf"
  desc: "This note summarizes the paper, which develops a theoretical model comparing banks and capital markets as information regimes—using key mechanism variables such as project quality, state-contingent returns, liquidity needs, information acquisition cost γ, success probability λ, bank secrecy, market price discovery, investment scale, money provision, and welfare losses from risky liquidity versus bank distortion—to show that banks create safe money-like liquidity by keeping asset information secret, while markets reveal information and create risky liquidity, implying that bank opacity is productive for opaque information-insensitive assets but becomes costly when information is cheap to produce, causing transparent or information-sensitive assets to migrate to capital markets."

- title: "Benmelech, Garmaise, and Moskowitz (QJE, 2005) - Do Liquidation Values Affect Financial Contracts? Evidence from Commercial Loan Contracts and Zoning Regulation"
  file: "Benmelech_Garmaise_Moskowitz_QJE_2005.pdf"
  desc: "This note summarizes the paper, which uses commercial real estate loan contracts and property-level zoning flexibility as an ex ante proxy for collateral redeployability/liquidation value, estimating loan-contract regressions with census-tract, zoning-category, property-type, year, and bank fixed effects—using key identification variables such as redeployability, sale price, cap rate, foreclosure costs, zoning strictness, local land-market tightness, historic zoning, interest rates, leverage, maturity, duration, and multiple-creditor structure—to show that more redeployable assets receive cheaper, larger, and longer loans with simpler creditor structures, implying that liquidation value and collateral quality materially shape financial contracting."

- title: "Chodorow-Reich & Falato (JF, 2022) - The Loan Covenant Channel: How Bank Health Transmits to the Real Economy"
  file: "ChodorowReich_Falato_JF_2022.pdf"
  desc: "This note summarizes the paper, which uses supervisory Shared National Credit data with direct loan-level covenant compliance and estimates lender-health-by-covenant-violation regressions, near-threshold designs, IV specifications, credit-quantity tests, real-outcome regressions, robustness checks, and aggregation exercises—using key identification variables such as bad lender health, covenant violation status, their interaction, loan maturity, credit reductions, committed and drawn credit, borrower controls, supervisor strictness instruments, payouts, capital expenditures, and employment growth—to show that unhealthy banks cut credit more aggressively after borrowers violate covenants, transmitting bank balance-sheet shocks to existing long-term borrowers and reducing real activity through a loan covenant channel."

- title: "Holmstr¨om & Tirole (JPE, 1998) - Private and Public Supply of Liquidity"
  file: "Holmstrom_Tirole_JPE_1998.pdf"
  desc: "This note summarizes the paper, which develops a theoretical liquidity-demand model with moral hazard, limited pledgeability, date-1 liquidity shocks, credit lines, liquid reserves, private intermediaries, and government bonds—using key mechanism variables such as investment scale, pledgeable return ρ0 , social return ρ1 , continuation cutoff ρ∗, idiosyncratic versus aggregate liquidity shocks, liquidity premia, and state-contingent public bonds—to show that private intermediaries can pool idiosyncratic liquidity risk, but aggregate liquidity shocks require government-supplied liquidity because private claims cannot fully pledge future resources, implying that public liquidity provision is most valuable when it is state-contingent and supplied in bad aggregate states."

- title: "Spiegler (RES, 2026) - Behavioural Causal Inference"
  file: "Spiegler_RES_2026.pdf"
  desc: "This note summarizes the paper, which develops a theoretical equilibrium model of behavioural causal inference in which decision-makers learn from endogenous observational data and control for different variable sets—using key mechanism variables such as binary actions, preference types, outcomes, exogenous controls, perceived causal effects, endogenous action distributions, welfare loss, vertical versus horizontal control-set ordering, adjustment sets, and true causal-effect parameter β—to show that bad controls can generate self-sustaining mistaken choices when data access is horizontally fragmented, while vertically nested controls sharply discipline errors and bound welfare losses, implying that the social cost of flawed causal reasoning depends on how data access and expertise are organized."

- title: "Chen, Noronha & Singal (JF, 2004) - The Price Response to S&P 500 Index Additions and Deletions: Evidence of Asymmetry and a New Explanation"
  file: "Chen_Noronha_Singal_JF_2004.pdf"
  desc: "This note summarizes the paper, which uses S&P 500 additions and deletions from 1962–2000 across changing announcement/indexing regimes and estimates event-study abnormal returns, turnover ratios, shareholder and institutional ownership changes, Merton shadow-cost measures, and CAR60–shadow-cost regressions—using key identification variables such as addition versus deletion status, announcement and effective dates, CAR20/CAR60, investor-base changes, institutional holdings, and changes in shadow cost—to show that additions create permanent positive price effects while deletion losses largely reverse, implying that index inclusion raises investor recognition and lowers required returns, while awareness is sticky and does not disappear symmetrically after deletion."

- title: "Constantinides, Jackwerth, & Perrakis (RFS, 2009) - Mispricing of S&P 500 Index Options"
  file: "Constantinides_Jackwerth_Perrakis_RFS_2009.pdf"
  desc: "This note summarizes the paper, which uses stochastic-dominance tests and option-bound linear programs on monthly cross sections of 1-month S&P 500 index calls from 1986–2006—using key identification variables such as call bid-ask prices, moneyness, transaction-cost assumptions, nonparametric and conditional index-return distributions, pricing-kernel monotonicity, ITM/OTM status, implied-volatility adjustments, and upper/lower stochastic-dominance bounds—to show that many option prices cannot be rationalized by any positive decreasing pricing kernel for a risk-averse marginal trader, even after allowing for incompleteness, transaction costs, volatility conditioning, and intermediate trading, implying that the mispricing is deeper than a simple rejection of Black-Scholes."

- title: "He, Qian & Strahan (JF, 2012) - Are All Ratings Created Equal? The Impact of Issuer Size on the Pricing of Mortgage-Backed Securities"
  file: "He_Qian_Strahan_JF_2012.pdf"
  desc: "This note summarizes the paper, which uses private-label non-GSE MBS tranche data from 2000–2006 with price histories through 2009 and estimates ex ante yield-spread and ex post price-change regressions—using key identification variables such as lagged issuer market share, hot MBS market conditions, the IssuerShare × HOT interaction, tranche ratings, rating-shopping proxies, deal structure, collateral quality, issuer type, and subsequent price changes—to show that large issuers’ same-rated tranches carried higher initial yields during boom years and later performed worse, implying that MBS ratings were not issuer-invariant measures of credit quality and that investors partly, but not fully, priced rating-agency conflicts under the issuer-pays model."

- title: "Nini, Smith, and Sufi (JFE, 2009) - Creditor control rights and firm investment policy"
  file: "Nini_Smith_Sufi_JFE_2009.pdf"
  desc: "This note summarizes the paper, which uses hand-collected private credit agreements from EDGAR matched to DealScan and Compustat and estimates restriction-incidence models, renegotiation tests, investment difference-in-differences, contractual-limit bunching tests, and performance regressions—using key identification variables such as capital expenditure restriction status, borrower credit quality, ratings, financial covenant violations, exact spending limits, capital expenditures, market-to-book, and operating performance—to show that creditors impose direct investment restrictions when borrower risk rises, that these restrictions bind and reduce capital expenditures, and that firms receiving new restrictions subsequently improve in value and operating performance, implying that private debt contracts allocate real control rights and can discipline inefficient investment."

- title: "Akins, De Angelis & Gaulin (JF, 2020) - Debt Contracting on Management"
  file: "Akins_DeAngelis_Gaulin_JF_2020.pdf"
  desc: "This note summarizes the paper, which uses hand-collected change-of-management restriction clauses from EDGAR private loan contracts matched to DealScan, Compustat, CRSP, and ExecuComp, and estimates CMR-inclusion probits, selection-adjusted loan-pricing tests, CEO-turnover regressions, and future-performance regressions—using key identification variables such as CMR presence and binding status, founder CEO, inside-promotion industries, absence of an heir apparent, CEO ownership, unvested equity, noncompete enforceability, retirement age, loan yield spreads, CEO turnover, Tobin’s Q, and operating cash flow—to show that lenders use CMRs as targeted control rights over managerial human-capital and retention risk rather than as CEO-entrenchment devices, since CMRs are associated with lower predicted loan yields, sharply reduced CEO turnover while active, and improved outcomes in firms where retention risk or default risk is highest."

- title: "Hau, Massa, & Peress (RFS, 2010) - Do Demand Curves for Currencies Slope Down? Evidence from the MSCI Global Index Change"
  file: "Hau_Massa_Peress_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses the 2000 MSCI Global Equity Index free-float redefinition as an exogenous portfolio-demand shock and estimates stock-return, exchange-rate, FX-volume-scaled, order-flow, implementation, and currency-comovement regressions—using key identification variables such as country and stock MSCI weight changes, upweighted versus downweighted countries, abnormal stock returns, dollar and basket exchange-rate returns, FX trading volume, euro-dollar order flow, implementation dates, and post-event MSCI currency-basket loadings—to show that global stock and currency demand curves slope downward, since upweighted stocks rise, upweighted currencies appreciate, and upweighted currencies later comove more with the MSCI basket, implying that mechanical equity index flows can move exchange rates and alter FX correlation structure even without fundamental news."

- title: "Hortaçsu, Matvos, Syverson, & Venkataraman (RFS, 2013) - Indirect Costs of Financial Distress in Durable Goods Industries: The Case of Auto Manufacturers"
  file: "Hortacsu_Matvos_Syverson_Venkataraman_RFS_2013.pdf"
  desc: "This note summarizes the paper, which uses over six million U.S. wholesale used-car auction transactions and high-frequency manufacturer CDS spreads in car-type-region-week fixed-effect regressions—using key identification variables such as manufacturer CDS, used-car prices, warranty status and remaining warranty, mileage, condition, auction controls, placebo CDS, dealer distress, and new-car price controls—to show that rising manufacturer financial distress lowers durable-good values, especially for low-mileage and in-warranty cars, because buyers discount the risk that warranties, parts, maintenance, and dealer support will deteriorate, implying large indirect costs of financial distress that can materially affect firms’ optimal capital structure."

- title: "Matvos & Seru (RFS, 2014) - Resource Allocation within Firms and Financial Market Dislocation: Evidence from Diversified Conglomerates"
  file: "Matvos_Seru_RFS_2014.pdf"
  desc: "This note summarizes the paper, which uses Compustat segment data and a dynamic structural model of diversified firms’ internal capital markets—using key identification variables such as division productivity, investment, cash holdings, productivity dispersion, external-finance costs, TED/EBP credit-stress measures, the corporate-socialism parameter λ, and crisis-period excess value—to show that conglomerates misallocate capital toward weaker divisions in normal times but become relatively more valuable during financial-market dislocations because they can reallocate scarce internal funds across divisions, partially offsetting the crisis shock by about 16–30%."

- title: "Xiong & Yan (RFS, 2010) - Heterogeneous Expectations and Bond Markets"
  file: "Xiong_Yan_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses a calibrated theoretical bond-pricing model with heterogeneous expectations and simulation evidence—where the key identification/mechanism variables are investors’ differing beliefs about the long-run inflation target, wealth shares, the wealth-weighted average belief, nominal short rates, bond yields, forward rates, yield spreads, trading volume, and Cochrane–Piazzesi return-predictive factors—to show that disagreement-induced trading and wealth redistribution amplify bond-yield volatility, generate time-varying risk premia, explain failures of the expectations hypothesis, and produce a tent-shaped forward-rate factor that predicts bond excess returns."

- title: "Beneish & Whaley (JF, 1996) - An Anatomy of the “S&P Game”: The Effects of Changing the Rules"
  file: "Beneish_Whaley_JF_1996.pdf"
  desc: "This note summarizes the paper, which uses S&P 500 additions around the 1989 preannouncement rule change and intraday event-study regressions with S&P 500 futures benchmarks—using key identification variables such as old versus new announcement policy, announcement-to-effective-day interval, abnormal returns, close-to-open and open-to-close return components, abnormal volume, trade size, quoted spreads, and post-effective reversals—to show that preannouncement reduced the immediate overnight price jump but created a tradable “S&P game” in which arbitrageurs bought before the effective day and sold into index-fund demand, increasing the total premium paid by passive indexers and demonstrating how market-design rules can reshape prices, liquidity, and trading profits."

- title: "Dewatripont and Maskin (RES, 1995) - Credit and Efficiency in Centralized and Decentralized Economies"
  file: "Dewatripont_Maskin_RFS_1995.pdf"
  desc: "This note summarizes the paper, which develops a theoretical asymmetric-information credit model comparing centralized and decentralized lending, using key mechanism variables such as project type, creditor liquidity/size, monitoring effort, refinancing incentives, entrepreneur private benefits, and the continuation-value condition Πp∗ >1>Πp∗∗ , to show that decentralized credit can harden budget constraints and screen out poor projects by making refinancing less credible, but may also create excessive short-termism when slow high-value projects require continuation finance, implying a fundamental trade-off between commitment and efficient long-term investment."

- title: "Fleckenstein & Longstaff (RFS, 2025) - Do Municipal Bond Investors Pay a Convenience Premium to Avoid Taxes?"
  file: "Fleckenstein_Longstaff_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses a yield-decomposition design for state-issued tax-exempt municipal bonds—using state CDS to identify credit risk, taxable municipal bonds to identify liquidity, matched Treasury/repo-OIS benchmarks, maximum marginal tax rates, and variables such as convenience premia, tax uncertainty, municipal fund flows, migration, tax-minimizing strategies, SALT exposure, maturity structure, and issuance—to show that tax-exempt munis contain an average 15.49 basis point convenience premium beyond credit, liquidity, and mechanical tax benefits, implying that investors pay for freedom from taxation and that municipal issuers respond to this tax-related richness by issuing more debt."

- title: "Baghai & Becker (JFE, 2018) - Non-rating revenue and conflicts of interest"
  file: "Baghai_Becker_JFE_2018.pdf"
  desc: "This note summarizes the paper, which uses Indian issuer-agency-year rating data after SEBI’s non-rating-revenue disclosure rule and within-issuer-year rating regressions with agency-year fixed effects—where the key identification variables are non-rating-services ties, non-rating fee amounts, issuer ratings, rating thresholds such as AA- and BBB-, multiple-rater comparisons, and future default outcomes—to show that agencies give more favorable ratings to issuers from whom they earn non-rating revenue, especially near important thresholds, and that these issuers default more within rating categories, implying that commercial ties create rating inflation and lower rating quality."

- title: "Barberis & Shleifer (JFE, 2003) - Style Investing"
  file: "Barberis_Shleifer_JFE_2003.pdf"
  desc: "This note summarizes the paper, which develops a theoretical asset-pricing model with simulated two-style economies—where the key mechanism variables are investor classification into styles, switcher demand based on relative past style returns, style prices, cash-flow shocks, reclassification, return covariance, own- and cross-autocorrelations, and arbitrageur risk limits—to show that style-level fund flows can create excess comovement within styles, deficient comovement across styles, index-inclusion effects, short-run momentum, long-run reversal, and profitable style-level strategies, implying that some return factors may arise from investor categorization and demand pressure rather than fundamental risk alone."

- title: "Fan, Wong, & Zhang (JFE, 2007) - Politically connected CEOs, corporate governance, and Post-IPO performance of China’s newly partially privatized firms"
  file: "Fan_Wong_Zhang_JFE_2007.pdf"
  desc: "This note summarizes the paper, which uses hand-coded CEO and board biographies for 790 Chinese A-share IPO firms and post-IPO stock, accounting, IPO-pricing, and board-structure regressions—where the key identification variables are politically connected CEO status, defined by current or former government/military office, post-IPO CARs, ROS, sales and earnings growth, IPO initial returns, board bureaucrat/professional composition, and firm controls such as ownership, market-to-book, leverage, size, and regulated-industry status—to show that politically connected CEOs are associated with significantly weaker post-IPO performance, lower initial returns, more bureaucratic and less professional boards, implying that China’s partial privatization did not fully improve governance when the state retained CEO appointment power and control rights."

- title: "Giannetti and Wang (JF, 2016) - Corporate Scandals and Household Stock Market Participation"
  file: "Giannetti_Wang_JF_2016.pdf"
  desc: "This note summarizes the paper, which uses household-panel OLS/reduced-form regressions, brokerage-account trading tests, Gallup trust regressions, within-state lifetime fraud exposure, and an Arthur Andersen shock IV design—using key identification variables such as local state-level fraud revelation, fraud intensity scaled by listed firms, household stock participation, entry, exit, equity-wealth ratio, net equity purchases, trust in big business and banks, and AA-client exposure—to show that corporate scandals reduce household stock-market participation and equity demand by eroding trust rather than simply creating wealth losses or risk-aversion effects, generating negative spillovers even for nonfraudulent firms through lower retail ownership and more concentrated institutional ownership."

- title: "Agarwal, Mukherjee & Naaraayanan (RFS, 2023) - Roads and Loans"
  file: "Agarwal_Mukherjee_Naaraayanan_RFS_2023.pdf"
  desc: "This note summarizes the paper, which uses a population-threshold regression discontinuity/reduced-form design around India’s PMGSY rural road program—using 2001 Census village population around the 500 and 1,000 cutoffs, an above-cutoff road-priority indicator, road receipt, and bank-loan outcomes such as bank entry, number of borrowers, loan amount, loan purpose, interest rate, maturity, and repayment—to show that new roads significantly increase formal bank lending and productive borrowing, especially for low-asset households, without worsening loan quality or raising interest rates, implying that rural infrastructure expands productive opportunities and works as a complement to formal finance."

- title: "Guvenen (Econometrica, 2009) - A Parsimonious Macroeconomic Model for Asset Pricing"
  file: "Guvenen_Econometrica_2009.pdf"
  desc: "This note summarizes the paper, which uses a calibrated two-agent RBC production asset-pricing model with limited stock-market participation, Epstein–Zin preferences, heterogeneous EIS, and equilibrium simulation/moment matching—where the key identification/mechanism variables are household type, stock-market access, stockholder vs non-stockholder EIS, bond holdings, capital, technology shocks, consumption growth, equity returns, and the risk-free rate—to show that low-EIS non-stockholders smooth labor-income risk through bonds, forcing stockholders to absorb concentrated aggregate risk and thereby generating a high and countercyclical equity premium, a low and smooth risk-free rate, return predictability, and realistic wealth concentration, though the model still faces macro-quantity trade-offs."

- title: "Grossman & Stiglitz (AER, 1980) - On the Impossibility of Informationally Efficient Markets"
  file: "Grossman_Stiglitz_AER_1980.pdf"
  desc: "This note summarizes the paper, which builds a CARA–normal noisy rational-expectations model with a riskless asset, a risky asset u=θ+ε, an endogenous fraction of informed traders who pay to observe θ, and noisy supply that prevents prices from fully revealing information, and proves that competitive equilibrium requires only partially informative prices (an “equilibrium degree of disequilibrium”) because perfect informational efficiency would eliminate incentives to produce costly information."

- title: "Andonov, Kräussl, & Rauh (RFS, 2021) - Institutional Investors and Infrastructure Investing"
  file: "Andonov_Kraussl_Rauh_RFS_2021.pdf"
  desc: "This note summarizes the paper, which estimates a time-varying empirical pricing kernel from one-month S&P 500 index option cross-sections by pairing no-arbitrage option pricing with an asymmetric-GARCH objective return density (plus an empirical innovation distribution), fitting both a parsimonious power kernel and a flexible orthogonal-polynomial kernel month by month, and validating the implied (countercyclical) risk-aversion dynamics via out-of-sample delta–gamma hedging performance."

- title: "Peress and Schmidt (JF, 2020) - Glued to the TV: Distracted Noise Traders and Stock Market Liquidity"
  file: "Peress_Schmidt_JF_2020.pdf"
  desc: "This note summarizes the paper, which constructs exogenous investor-distraction shocks from high “news pressure” days in U.S. TV broadcasts filtered to remove economic/market headlines, combines retail brokerage trades, ANcerno institutional transactions, CRSP and TAQ microstructure measures, and event-study / cross-event regressions (with heterogeneity by retail-ownership proxies and algorithmic-trading intensity) to show that when noise traders are distracted and trade less, volatility and short-run reversals fall but liquidity worsens via higher adverse selection in a Kyle-style mechanism."

- title: "charya, Parlatore, & Sundaresan (RFS, 2025) - Financing Infrastructure in the Shadow of Expropriation"
  file: "Acharya_Parlatore_Sundaresan_RFS.pdf"
  desc: "This note summarizes the paper, which builds a four-stage public–private-partnership model with double moral hazard (operator effort and government expropriation) under fiscal-capacity/ability-to-pay constraints, solves the constrained-efficient contract over project scale, success-state coupons, and failure-state government guarantees/coinvestment to derive a fiscal pecking order (guarantees → coinvestment → higher success repayments), and illustrates the mechanism with descriptive evidence on Indian highway disputes, stressed thermal power projects, and global expropriation cases."

- title: "Gao, Sockin, & Xiong (RFS, 2021) - Learning about the Neighborhood"
  file: "Gao_Sockin_Xiong_RFS_2021.pdf"
  desc: "This note summarizes the paper, which develops a noisy rational-expectations housing model in which households (and capital producers) learn neighborhood fundamentals from housing prices and, because entry decisions are locally complementary, supply-side noise can generate amplified boom–bust price cycles and overbuilding that are nonmonotonic in housing-supply elasticity (peaking at intermediate elasticity), and it illustrates the mechanism by showing the 2000s U.S. MSA cross-section of price booms/busts and permits lines up with these predictions using Saiz (2010) supply elasticity and nontradable-employment-share complementarity proxies (with sand-state robustness)."

- title: "Dagostino (JFE, 2025) - The Impact of Bank Financing on Municipalities’ Bond Issuance and the Real Economy"
  file: "Dagostino_JFE_2025.pdf"
  desc: "This note summarizes the paper, which exploits the ARRA’s temporary 2009–2010 increase in the bank-qualified municipal issuance threshold (from $10m to $30m) as a tax-induced notch, quantifies issuers’ responses with bunching around the $10m cutoff and a county-level DiD/2SLS + event-study design based on pre-policy buncher exposure, and links the policy to banks’ balance-sheet reallocation (a deposit-share Bartik exposure) and local real effects (jobs per $1m) while testing for crowd-out in private lending."

- title: "Schwert (JF, 2017) - Municipal Bond Liquidity and Default Risk"
  file: "Schwert_JF_2017.pdf"
  desc: "This note summarizes the paper, which estimates a time-varying empirical pricing kernel from one-month S&P 500 index option cross-sections by pairing no-arbitrage option pricing with an asymmetric-GARCH objective return density (plus an empirical innovation distribution), fitting both a parsimonious power kernel and a flexible orthogonal-polynomial kernel month by month, and validating the implied (countercyclical) risk-aversion dynamics using out-of-sample hedging performance comparisons."

- title: "Kaustia & Torstila (JFE, 2011) - Stock Market Aversion? Political Preferences and Stock Market Participation"
  file: "Kaustia_Torstila_JFE_2011.pdf"
  desc: "This note summarizes the paper, which tests the “value-expressive stock market aversion” hypothesis by linking Finnish registry stock ownership to zip-code election votes and estimating zip-code OLS plus individual exit-poll and Member-of-Parliament logit models (and national survey participation/attitude regressions), showing that more left-wing political orientation robustly predicts lower stock market participation but not conditional equity allocation and is instead tied to negative stock-market attitudes rather than pessimistic return expectations."

- title: "Baron, Verner, and Xiong (QJE, 2021) - Banking Crises without Panics"
  file: "Baron_Verner_Xiong_QJE_2021.pdf"
  desc: "This note summarizes the paper, which recovers a monthly, state-contingent empirical pricing kernel by fitting one-month S&P 500 index option cross-sections to no-arbitrage pricing formulas using an asymmetric-GARCH objective return density (with an empirical innovation distribution), compares a parsimonious power kernel to a flexible orthogonal-polynomial kernel (with bond-pricing normalization), relates the implied risk aversion to business-cycle indicators, and validates the estimates via out-of-sample delta–gamma hedging performance."

- title: "Mankiw & Zeldes (JFE, 1991) - The Consumption of Stockholders and Nonstockholders"
  file: "Mankiw_Zeldes_JFE_1991.pdf"
  desc: "This note summarizes the paper, which uses PSID household data (food consumption, 1970–1984) and 1984 stockholding status to construct stockholder vs. nonstockholder per-capita consumption-growth series, compares their covariances with the market excess return via moment comparisons and covariance-difference regressions, and calibrates the consumption-CAPM to show implied risk aversion drops sharply (≈100 → ≈35) when pricing equity with stockholder consumption rather than aggregate consumption."

- title: "Lin (RFS, 2020) - Bank Deposits and the Stock Market"
  file: "Lin_RFS_2020.pdf"
  desc: "This note summarizes the paper, which identifies a stock-market-to-deposit portfolio channel by interacting aggregate stock returns with cross-county/ZIP variation in IRS dividend-income ratios (a stock-participation proxy) to show that high-participation places—and banks whose depositor bases are more stock-active—suffer larger deposit outflows after booms, leading to funding substitution, weaker small-business lending, and slower employment growth in externally finance-dependent sectors."

- title: "Odean (AER, 1999) - Do Investors Trade Too Much?"
  file: "Odean_AER_1999.pdf"
  desc: "This note summarizes the paper, which uses account-level trades from 10,000 discount-brokerage investors (1987–1993) to compute event-time buy-minus-sell return differentials over 84/252/504 trading days, benchmarks them against an estimated 5.9% round-trip trading cost, conducts size–book-to-market matched bootstrap replacements and calendar-time factor regressions, and shows purchases underperform sales even before costs—evidence of excessive trading driven by misinterpreted signals/attention and disposition-style behavior."

- title: "Rosenberg & Engle (JFE, 2002) - Empirical Pricing Kernels"
  file: "Rosenberg_Engle_JFE_2002.pdf"
  desc: "This note summarizes the paper, which estimates a time-varying empirical pricing kernel from one-month S&P 500 index option cross-sections by pairing no-arbitrage option pricing with an asymmetric-GARCH objective return density (plus an empirical innovation distribution), fits both a parsimonious power kernel and a flexible orthogonal-polynomial kernel month by month, and validates the extracted (countercyclical) risk-aversion dynamics using out-of-sample hedging performance comparisons."

- title: "Vestman (RFS, 2019) - Limited Stock Market Participation Among Renters and Homeowners"
  file: "Vestman_RFS_2019.pdf"
  desc: "This note summarizes the paper, which uses Swedish registry panel data (LINDA matched to detailed financial holdings and the real-estate registry) and a life-cycle model with endogenous tenure choice and one-time stock-entry costs to show that renters’ low stock-market participation reflects type-based sorting (low-savings households rent and stay out) rather than homeownership mechanically crowding out equity, supported by household fixed-effects DiD/event studies showing home purchases do not reduce participation while home sales (especially with divorce) reduce risky-asset exposure."

- title: "Hirshleifer (JF, 2020) - Social Transmission Bias in Economics and Finance"
  file: "Hirshleifer_JF_2020.pdf"
  desc: "This note summarizes the paper, which proposes social transmission bias as a core mechanism in economics and finance, developing five “fables” (with a formal biased-information-percolation model) to show how small distortions or selective sharing of ideas in social networks can recursively amplify into action booms, asset-price bubbles, momentum/reversal patterns, and belief dynamics that mimic familiar behavioral biases—pointing to new empirical proxies based on sociability, network position, visibility, and communication technology."

- title: "Mehrotra, Morck, Shim, and Wiwattanakantang (JFE, 2013) - Adoptive expectations: Rising sons in Japanese family firms"
  file: "Mehrotra_Morck_Shim_Wiwattanakantang_JFE_2013.pdf"
  desc: "This note summarizes the paper, which uses a near-universe panel of postwar Japanese listed firms (1962–2000) and a succession-event design to show that Japan’s adult-adoption/son-in-law institutions let family firms choose heirs on merit: non-blood heirs (adopted sons or sons-in-law) outperform blood heirs and professional “sarariman” managers, with the largest profitability improvements occurring around non-blood successions."

- title: "Rajan, Servaes & Zingales (JF, 2000) - The Cost of Diversity: The Diversification Discount and Inefficient Investment"
  file: "Rajan_Servaes_Zingales_JF_2000.pdf"
  desc: "This note summarizes the paper, which uses Compustat segment data (1979–1993) to measure diversity as dispersion in resource-weighted segment opportunities (industry Tobin’s q × segment asset share), estimates segment-level transfer regressions showing that higher diversity induces wrong-way internal subsidies (away from high weighted-opportunity segments toward low weighted-opportunity segments) to manage ex post bargaining incentives, and links these distortions to a lower “value added by allocation” and a sizable diversification discount in excess-value regressions."

- title: "Coase (Economica, 1937) - The Nature of the Firm"
  file: "Coase_Economica_1937.pdf"
  desc: "This note summarizes the paper, which explains why firms exist by arguing that using the price mechanism is costly (search, bargaining, contracting, and adaptation), so an employment/authority contract can economize on transaction costs, with firm boundaries determined by the marginal tradeoff between rising internal organization costs and the cost of carrying out the same transaction through markets (or other firms)."

- title: "Shleifer and Vishny (JF, 1992) - Liquidation Values and Debt Capacity: A Market Equilibrium Approach"
  file: "Shleifer_Vishny_JF_1992.pdf"
  desc: "This note summarizes the paper, which develops a general-equilibrium theory of debt capacity where liquidation values are endogenously low in industry downturns because the highest-value industry buyers are themselves debt-overhung and financially constrained, so distress sales can become fire sales to lower-value outsiders and leverage/liquidity are jointly determined with potential multiple equilibria."

- title: "Alchian and Demsetz (AER, 1972) - Production, Information Costs, and Economic Organization"
  file: "Alchian_Demsetz_AER_1972.pdf"
  desc: "This note summarizes the paper, which explains the classical firm as an efficient contractual response to team production with costly metering: because individual contributions are hard to observe, equal sharing induces shirking, so efficiency calls for a centralized monitor who is also the residual claimant and has the right to revise/terminate bilateral contracts—making “authority” an outcome of contracts rather than the firm’s primitive defining feature."

- title: "Stein (JF, 1997) - Internal Capital Markets and the Competition for Corporate Resources"
  file: "Stein_JF_1997.pdf"
  desc: "This note summarizes the paper, which builds a credit-rationing model with privately informed, empire-building division managers and shows that corporate headquarters can create value through winner-picking—reallocating a fixed pool of scarce capital toward relatively strong projects (enabled by control rights that enforce “loser-sticking”)—and then derives optimal firm size and scope as tradeoffs between relaxing financing constraints and degrading monitoring, with the subtle result that focus can improve allocation when it makes evaluation errors more correlated and thus preserves relative ranking."

- title: "Aghion and Bolton (RES, 1992) - An Incomplete Contracts Approach to Financial Contracting"
  file: "Aghion_Bolton_RES_1992.pdf"
  desc: "This note summarizes the paper, which develops an incomplete-contract, wealth-constrained entrepreneur–investor model where control rights determine the renegotiation status quo and hence pledgeable income, implying an optimal “capital structure as governance” logic in which contingent control based on verifiable performance signals (interpretable as debt/default and related convertibles) can dominate pure entrepreneur control or pure investor control by protecting investors in bad states while preserving entrepreneurial discretion in good states."

- title: "Rajan (JF, 1992) - Insiders and Outsiders: The Choice between Informed and Arm’s-Length Debt"
  file: "Rajan_JF_1992.pdf"
  desc: "This note summarizes the paper, which develops an incomplete-contract model where informed bank debt improves efficiency by giving the lender control to liquidate bad projects, but also weakens entrepreneurial effort through ex post hold-up/bargaining rents, generating sharp predictions for the choice between bank versus arm’s-length debt and for optimal maturity and priority structures that trade off control against rent extraction."

- title: "DeMarzo (RFS, 2005) - The Pooling and Tranching of Securities: A Model of Informed Intermediation"
  file: "DeMarzo_RFS_2005.pdf"
  desc: "This note summarizes the paper, which develops an asymmetric-information model of securitization showing that pure pooling can hurt an informed seller by destroying asset-specific signaling rents, but pooling with tranching can be optimal because diversification supports a senior debt tranche that is relatively information-insensitive, while uninformed originators pool to reduce informed buyers’ cherry-picking and informed intermediaries pool-and-tranche dynamically to recycle capital and scale their information advantage."

- title: "Diamond & Dybvig (JPE, 1983) - Bank Runs, Deposit Insurance, and Liquidity"
  file: "Diamond_Dybvig_JPE_1983.pdf"
  desc: "This note summarizes the paper, which builds a three-period model where privately informed liquidity needs make demand deposits a welfare-improving liquidity-insurance contract that transforms illiquid long-term assets into liquid claims, but the same sequential-service deposit contract creates multiple equilibria—including a self-fulfilling run that forces inefficient early liquidation—so policies like suspension and especially credible deposit insurance can eliminate the run equilibrium and implement the first-best allocation."

- title: "Xiong & Yu (AER, 2011) - The Chinese Warrants Bubble"
  file: "Xiong_Yu_AER_2011.pdf"
  desc: "This note summarizes the paper, which documents a remarkably clean field bubble in China’s 2005–2008 put warrants by showing many warrants traded at large positive prices even when both Black–Scholes fundamentals and model-free payoff upper bounds were essentially zero, and explains the persistence and maturity patterns with heterogeneous beliefs plus binding short-sale constraints that create a speculative resale option amplified by extreme turnover and short-horizon feedback trading."

- title: "Calomiris & Kahn (AER, 1991) - The Role of Demandable Debt in Structuring Optimal Banking Arrangements"
  file: "Calomiris_Kahn_AER_1991.pdf"
  desc: "This note summarizes the paper, which provides an incentive-based theory of banking in which demandable deposits with sequential service implement costly monitoring by rewarding informed depositors to withdraw early on bad private signals, so the threat of a run and liquidation disciplines bankers who could otherwise abscond—making bank fragility and reserves part of an optimal governance arrangement rather than a pure liquidity accident."

- title: "Stein (QJE, 1989) - Efficient Capital Markets, Inefficient Firms: A Model of Myopic Corporate Behavior"
  file: "Stein_QJE_1989.pdf"
  desc: "This note summarizes the paper, which shows that even with fully rational investors and efficient stock prices, managers can behave myopically in a signal-jamming equilibrium by boosting current reported earnings (via “hidden borrowing” from future earnings/hidden investment cuts) to raise today’s price, with the distortion increasing in short-horizon pressure π and in how informative current earnings are about future value (a_0)."

- title: "Bolton & Scharfstein (JPE, 1996) - Optimal Debt Structure and the Number of Creditors"
  file: "Bolton_Scharfstein_JPE_1996.pdf"
  desc: "This note summarizes the paper, which builds an incomplete-contract model where unverifiable cash flow creates both strategic and liquidity default, and shows optimal debt structure chooses the number of creditors, collateral allocation, and voting rules to balance ex post renegotiation—multiple secured creditors can discipline managers via holdup (lowering strategic-default rents) but can also reduce liquidation value in true distress—implying safer firms optimally use more dispersed creditor structures while riskier firms prefer concentrated lending."

- title: "Miller (JF, 1977) - Debt and Taxes"
  file: "Miller_JF_1977.pdf"
  desc: "This note summarizes the paper, which extends Modigliani–Miller to a tax equilibrium by showing that once personal taxes on interest and equity are included, the corporate interest tax shield can be competed away through investor tax clienteles and market-clearing bond yields—so the economy can have an equilibrium aggregate debt level without any firm having a unique tax-driven optimal leverage ratio."

- title: "Myers (JFE, 1977) - Determinants of Corporate Borrowing"
  file: "Myers_JFE_1977.pdf"
  desc: "This note summarizes the paper, which develops the debt-overhang theory by modeling firm value as assets in place plus growth options and showing that risky long-maturity debt makes equity underinvest (it invests only when V(s)≥I+P, not V(s)≥I) because part of the marginal gain from new investment is transferred to existing bondholders, implying optimal leverage is lower for growth firms, debt capacity differs from value-maximizing debt, and covenants/maturity matching help protect investment incentives"

- title: "Kyle (Econometrica, 1985) - Continuous Auctions and Insider Trading"
  file: "Kyle_Econometrica_1985.pdf"
  desc: "This note summarizes the paper, which develops a dynamic linear-normal model of insider trading in continuous auctions with a monopolistic informed trader, noise traders, and competitive market makers who set prices as conditional expectations, deriving a unique linear equilibrium in which the insider optimally trades gradually because of price impact, prices reveal information through order flow, market depth is summarized by Kyle’s λ, and in the continuous-time limit depth is constant and all private information is incorporated into prices by the end of trading."

- title: "DeMarzo & Duffie (Econometrica, 1999) - A Liquidity-Based Model of Security Design"
  file: "DeMarzo_Duffie_Econometrica_1999.pdf"
  desc: "This note summarizes the paper, which models security design when an issuer must sell claims under future private information that makes sales a costly signal (endogenous illiquidity), characterizes issuance profits as a decreasing and convex function of the issuer’s private valuation, and shows that optimal designs load the security on low–information-sensitivity cash flows—yielding pure equity when informational sensitivity is small, but standard (generally risky) debt as the optimal monotone claim under a uniform worst-case condition because it minimizes informational sensitivity and thus the retention needed to sell."

- title: "Modigliani and Miller (AER, 1958) - The Cost of Capital, Corporation Finance and the Theory of Investment"
  file: "Modigliani_Miller_AER_1958.pdf"
  desc: "This note summarizes the paper, which proves via an arbitrage “homemade leverage” argument that in perfect capital markets a firm’s total value and weighted-average cost of capital are independent of capital structure (Proposition I), that higher leverage mechanically raises the required return on equity to keep the overall cost of capital constant (Proposition II), and that the firm’s investment rule depends only on the risk-class discount rate (not on financing), with interest tax shields as the main channel that breaks irrelevance in extensions."

- title: "Myers and Majluf (JFE, 1984) - Corporate Financing and Investment Decisions When Firms Have Information That Investors Do Not"
  file: "Myers_Majluf_JFE_1984.pdf"
  desc: "This note summarizes the paper, which develops an adverse-selection model where managers with private information about assets in place and project value may reject positive-NPV investments because issuing underpriced equity transfers value from old to new shareholders, implying that financial slack and safe debt mitigate underinvestment and generate a pecking order (internal funds → debt → equity) with equity-issue announcements lowering stock price as bad news."

- title: "Holmstr¨om & Milgrom (Econometrica, 1987) - Aggregation and Linearity in the Provision of Intertemporal Incentives"
  file: "Holmstrom_Milgrom_Econometrica_1987.pdf"
  desc: "This note summarizes the paper, which studies a multi-period moral-hazard problem with repeated actions and exponential preferences and proves that optimal incentives aggregate to end-of-period accounting totals—so the optimal contract is linear in final account balances (and, under coarse monitoring, linear in the observed aggregates such as profits)—with a Brownian-limit formulation that reduces the dynamic problem to a static normal-linear agency problem and explains why linear, accounting-based compensation dominates fragile nonlinear “rare-event punishment” schemes."

- title: "Townsend (JET, 1979) - Optimal Contracts and Competitive Markets with Costly State Verification"
  file: "Townsend_JET_1979.pdf"
  desc: "This note summarizes the paper, which develops an optimal-contracting framework with costly state verification in which implementability forces a fixed transfer in nonverified states but allows state-contingent transfers when auditing occurs, proves the optimal (deterministic) audit set is a low-state cutoff S∗={y<γ} that yields debt-like default thresholds and insurance deductibles, and extends the logic to random auditing and to a restricted multi-agent competitive equilibrium that implements the constrained optimum."

- title: "Innes (JET, 1990) - Limited Liability and Incentive Contracting with Ex-ante Action Choices"
  file: "Innes_JET_1990.pdf"
  desc: "This note summarizes the paper, which studies a hidden-action financing problem under limited liability and shows that if the investor’s payoff must be weakly increasing in realized profit then the optimal incentive contract is standard debt Bd(π;z)=min{π,z}, whereas without the monotonicity restriction the optimal contract becomes a nonmonotone live-or-die payoff that concentrates investor claims in low-profit states and can even restore first-best effort when the required outside funding is small enough."

- title: "Zwiebel (AER, 1996) - Dynamic Capital Structure under Managerial Entrenchment"
  file: "Zwiebel_AER_1996.pdf"
  desc: "This note summarizes the paper, which develops a dynamic agency model where partially entrenched managers endogenously choose net debt and dividends as a self-imposed commitment device—debt raises the bankruptcy probability of bad projects and bankruptcy removes entrenchment—yielding a partition of manager types with endogenous debt maturity/frequency patterns and the central prediction that debt and payout are complements while excessive debt becomes costly by destroying discipline once bankruptcy is inevitable."

- title: "Hennessy and Whited (JF, 2005) - Debt Dynamics"
  file: "Hennessy_Whited_JF_2005.pdf"
  desc: "This note summarizes the paper, which builds and structurally estimates a dynamic trade-off model where firms jointly choose leverage, cash saving, payouts, and investment under a progressive corporate tax schedule, equity issuance costs, and collateral/distress constraints, and shows (via indirect-inference estimation on Compustat plus simulated “auxiliary” leverage regressions) that regime-dependent financing margins can rationalize debt conservatism, leverage hysteresis, and the negative leverage–profitability and leverage–weighted-Q patterns without invoking large market-timing or adverse-selection premia."

- title: "Jensen & Meckling (JFE, 1976) - Theory of the Firm: Managerial Behavior, Agency Costs and Ownership Structure"
  file: "Jensen_Meckling_JFE_1976.pdf"
  desc: "This note summarizes the paper, which defines the firm as a nexus of contracts and formalizes agency costs as the sum of monitoring, bonding, and residual loss, develops stylized models of outside equity and debt that show how ownership and capital structure jointly shape managerial incentives (perquisite/effort distortions and risk shifting), and uses the model’s figure-based comparative statics to explain why real-world governance institutions—audits, covenants, limited liability, and mixed debt–equity financing—arise endogenously despite persistent conflicts of interest."

- title: "Gabaix and Landier (QJE, 2008) - Why Has CEO Pay Increased So Much?"
  file: "Gabaix_Landier_QJE_2008.pdf"
  desc: "This note summarizes the paper, which develops a competitive assignment model with extreme-value spacing of top talent to derive a closed-form “dual scaling” equation for CEO pay (pay rises with both own-firm size and the aggregate size of large firms), estimates the key elasticities in U.S. ExecuComp–Compustat panels and long-run time series, and shows that the roughly sixfold rise in the market value of large U.S. firms from 1980–2003 can quantitatively explain the roughly sixfold rise in CEO compensation."

- title: "Feldhütter & Schaefer (JFE, 2023) - Debt dynamics and credit risk"
  file: "Feldhutter_Schaefer_JFE_2023.pdf"
  desc: "This note summarizes the paper, which documents new debt-policy facts in CRSP/Compustat showing debt is mean-reverting in the long run but firms often borrow more after negative equity shocks in the short run, builds a stochastic-debt structural credit-risk model that adds mean reversion plus a correlated debt shock to standard firm-value diffusion, calibrates default boundaries to historical default rates (not spreads), and then shows in out-of-sample tests that the stochastic-debt model markedly improves the cross-section and time-series fit of corporate bond spreads—especially short-maturity investment-grade spreads and spread volatility."

- title: "Bahaj & Reis (RES, 2026) - Jumpstarting an International Currency"
  file: "Bahaj_Reis_RES_2026.pdf"
  desc: "This note summarizes the paper, which uses the staggered rollout of PBoC RMB swap lines (2009–2018) as a lender-of-last-resort policy shock and estimates country–month DiD/event studies in SWIFT cross-border payments to show swap lines “jumpstart” RMB international use (large extensive- and intensive-margin increases), validate the mechanism with synthetic RMB borrowing-cost declines and insulation during the 2015–2016 offshore RMB funding spike, and document heterogeneity consistent with a working-capital trade-finance channel (stronger effects for higher China trade, intermediate imports, and working-capital-intensive exports) and currency substitution away from USD/EUR in payments with China."

- title: "Zhang, Zhu, and Linnainmaa (RFS, 2025) - Man versus Machine Learning Revisited"
  file: "Zhang_Zhu_Linnainmaa_RFS_2025.pdf"
  desc: "This note summarizes the paper, which forensically replicates Binsbergen–Han–Lopez-Lira’s random-forest earnings benchmark and bias-sorted trading strategy, identifies a horizon-specific look-ahead error in the “last-period realized earnings” feature, and shows that correcting only this timing mistake collapses the reported large five-factor alpha and Sharpe ratio of trading against analyst “conditional bias,” with diagnostics and alternative ML models confirming that forecast accuracy gains do not translate into robust abnormal returns once information-set discipline is enforced."

- title: "Akey, Heimer, and Lewellen (JFE, 2021) - Politicizing Consumer Credit"
  file: "Akey_Heimer_Lewellen_JFE_2021.pdf"
  desc: "This note summarizes the paper, which uses seniority-driven U.S. Senate committee-chair ascensions (1999–2012) as political-power shocks and estimates Equifax CCP supply-ratio DiD/event studies (new credit lines per hard inquiries) plus HMDA approval-rate and CRA-threshold tests, showing that banks headquartered in the newly powerful Senator’s state curtail credit to protected borrowers—especially subprime borrowers in majority-minority and CRA-eligible tracts—consistent with reduced fair-lending compliance when expected enforcement weakens."

- title: "Malloy (JF, 2005) - The Geography of Equity Analysis"
  file: "Malloy_JF_2005.pdf"
  desc: "This note summarizes the paper, which uses I/B/E/S analyst forecasts and recommendations (1994–2001) matched to hand-collected analyst office locations to run within–firm-year relative-accuracy regressions and forecast-revision event studies, showing that geographically local analysts (within 100 km of firm HQ) produce more informative earnings forecasts and trigger larger stock-price reactions—especially for small/remote firms and negative revisions—while underwriter-affiliation recommendation bias is concentrated among distant affiliated analysts rather than local ones."

- title: "Farhi and Tirole (RES, 2021) - Shadow Banking and the Four Pillars of Traditional Financial Intermediation"
  file: "Farhi_Tirole_RES_2021.pdf"
  desc: "This note summarizes the paper, which builds a two-sector mechanism-design model in which banks can choose regulated retail banking or migrate to shadow banking, shows that public liquidity provision (deposit insurance and lender-of-last-resort) is socially valuable but creates leverage-driven moral hazard unless paired with prudential supervision, and derives the “four pillars” complementarity—core lending (e.g., SME credit), insured deposits, LOLR access, and supervision—while extending the framework to explain why ring-fencing and CCP-style centralized clearing are needed to prevent bogus liquidity and contagion from cross-exposures between regulated and shadow banks."

- title: "Mian (JF, 2006) - Distance Constraints: The Limits of Foreign Lending in Poor Economies"
  file: "Mian_JF_2006.pdf"
  desc: "This note summarizes the paper, which uses Pakistan’s loan-level credit-registry data (1996–2002) to compare foreign versus domestic private-bank corporate lending, showing that foreign banks concentrate on hard-information borrowers (large firms, big cities, foreign firms, conglomerates, multi-creditor borrowers, transactional loans) and—using borrower fixed effects and recovery/litigation outcomes—finds domestic banks are systematically better at soft-information relationship lending (higher recovery and more renegotiation-based resolution), implying that cultural/organizational distance limits foreign banks’ ability to expand credit to opaque firms in poor economies."

- title: "Kogan, Livdan, and Yaron (JF, 2009) - Oil Futures Prices in a Production Economy with Investment Constraints"
  file: "Kogan_Livdan_Yaron_JF_2009.pdf"
  desc: "This note summarizes the paper, which documents a V-shaped relation between crude-oil futures volatility and the forward-curve slope (high volatility in both steep backwardation and steep contango) using NYMEX data (1983–2000), and explains it with a competitive continuous-time production economy where irreversible investment and an upper bound on capacity expansion make supply inelastic when capacity is far above or far below demand; the paper estimates the model by simulated method of moments to match the term structure of volatility and the V-shape coefficients and shows production-side constraints—not storage alone—are central for oil futures dynamics."

- title: "Lu, Ray, & Teo (JFE, 2016) - Limited Attention, Marital Events, and Hedge Funds"
  file: "Lu_Ray_Teo_JFE_2016.pdf"
  desc: "This note summarizes the paper, which links hand-collected U.S. marriage/divorce records for hedge-fund managers to monthly hedge-fund performance (1994–2012) and estimates event-study and matched difference-in-differences regressions showing that these marital events act as attention shocks that significantly reduce Fung–Hsieh alpha, increase style/index hugging (lower Active Share / factor R^2), and exacerbate behavioral trading mistakes (a stronger disposition effect), especially for low-bandwidth managers running multiple funds or lacking a team."

- title: "Ozdagli and Weber (RFS, 2026) - Monetary Policy through Production Networks: Evidence from the Stock Market"
  file: "Ozdagli_Weber_RFS_2026.pdf"
  desc: "This note summarizes the paper, which uses 30-minute industry stock returns around scheduled FOMC announcements (1994–2008) and federal funds futures surprises to identify monetary shocks, maps BEA input–output tables into a supplier–customer network, estimates a structurally motivated spatial autoregression of industry returns on the shock and network-weighted returns, and decomposes total effects into direct versus higher-order Leontief network amplification with placebo-network and realized-fundamentals validations."

- title: "Huberman (RFS, 2001) - Familiarity Breeds Investment"
  file: "Huberman_RFS_2001.pdf"
  desc: "This note summarizes the paper, which uses state-by-state shareholder-account and shareholding data for the seven U.S. Regional Bell Operating Companies (1996) to compare local versus out-of-state ownership, documenting a strong local familiarity bias (the local RBOC has the most shareholder accounts in 47 of 48 served states and receives larger local dollar holdings and account sizes) and interpreting the pattern as underdiversification driven by familiarity/comfort rather than standard hedging or market-access frictions."

- title: "Kang, Rouwenhorst, and Tang (JF, 2020) - A Tale of Two Premiums: The Role of Hedgers and Speculators in Commodity Futures Markets"
  file: "Kang_Rouwenhorst_Tang_JF_2020.pdf"
  desc: "This note summarizes the paper, which uses weekly CFTC Commitment of Traders positions for 26 commodities (1994–2017) to decompose commodity futures expected returns into a slow-moving hedging premium captured by smoothed commercial hedging pressure and a short-horizon liquidity provision premium captured by weekly commercial net buying, estimating Fama–MacBeth return-predictability regressions and position-sorted portfolios (with DCOT validation, momentum vs. nonmomentum trading decompositions, and risk-environment interactions) that show commercials earn positive short-run returns as liquidity suppliers while noncommercials pay for immediacy."

- title: "Kacperczyk, Sialm, and Zheng (JF, 2005) - On the Industry Concentration of Actively Managed Equity Mutual Funds"
  file: "Kacperczyk_Sialm_Zheng_JF_2005.pdf"
  desc: "This note summarizes the paper, which constructs a market-adjusted Industry Concentration Index from CRSP–CDA/Spectrum mutual-fund holdings (1984–1999), tests whether more industry-concentrated active funds outperform via Carhart four-factor and conditional-alphas, DGTW holdings-based and industry-adjusted stock-selection/timing decompositions, panel regressions with fund controls, and buy-minus-sell trade-portfolio tests, and finds concentrated funds deliver higher risk-adjusted performance primarily through superior within-industry stock selection rather than mere industry timing."

- title: "Dávila and Parlatore (RFS, 2026) - Identifying Price Informativeness"
  file: "Davila_Parlatore_RFS_2026.pdf"
  desc: "This note summarizes the paper, which defines a model-based measure of relative price informativeness as the fraction of uncertainty about future payoff innovations resolved by observing the price, identifies it with a normalized incremental-R^2 formula from two regressions of price changes on current vs. current+future payoff growth (τ[πR]: the fraction of that residual uncertainty that is resolved by the price’s information about future payoffs (a unit-free “how informative is price about future fundamentals?” measure)), implements it in U.S. stock panels using CRSP/Compustat (earnings as payoffs) and IBES for a learnable-payoff extension, and documents that informativeness is small but rising over time and concentrated in large/liquid/covered stocks while emphasizing linearity and payoff-measurement limitations."

- title: "Jiang, Liu, Peng, and Yan (QJE, 2025) - Investor Memory and Biased Beliefs: Evidence from the Field"
  file: "Jiang_Liu_Peng_Yan_QJE_2025.pdf"
  desc: "This note summarizes the paper, which runs a large field survey of Chinese retail investors (merged to brokerage transactions for a subsample) that elicits FreeRecall market episodes and ProbedRecall own past returns under randomized prompts, exploits quasi-random survey-day market-return cues to identify cue-dependent memory, estimates recall→belief regressions (expected returns and crash probabilities) in horse races against actual experiences with order/anchoring checks, and shows that the memory-induced component of beliefs predicts subsequent net buying."

- title: "French and Poterba (AER, 1991) - Investor Diversification and International Equity Markets"
  file: "French_Poterba_AER_1991.pdf"
  desc: "This note summarizes the paper, which documents the late-1980s international equity home-bias in U.S., Japanese, and U.K. portfolios across six major markets and uses a mean–variance/exponential-utility portfolio inversion (μ=AΣw, with A=3) to back out the expected-return (or perceived-risk) wedges needed to rationalize observed domestic concentration—implying large “domestic optimism” premia (about 90bp for the U.S., 250bp for Japan, and 440bp for the U.K.) relative to a global value-weighted benchmark while arguing taxes/transaction costs/controls are unlikely to fully explain the pattern."

- title: "Jha, Liu, and Manela (RFS, 2026) - Does Finance Benefit Society? A Language Embedding Approach"
  file: "Jha_Liu_Manela_RFS_2026.pdf"
  desc: "This note summarizes the paper, which constructs a century-long cross-country panel of finance sentiment from Google Books by embedding finance-mentioning 5-grams with BERT, scoring each sentence via cosine similarity to a positive-minus-negative “finance benefits society” direction, aggregating to language–year indices, and then relates sentiment to capitalism/participation/inequality, crisis timing (sentiment falls before banking distress), and macro dynamics using event studies and local projections showing short-run sentiment increases precede higher credit and GDP growth (with extensive placebo-industry validation)."

- title: "Coval and Moskowitz (JF, 1999) - Home Bias at Home: Local Equity Preference in Domestic Portfolios"
  file: "Coval_Moskowitz_JF_1999.pdf"
  desc: "This note summarizes the paper, which measures U.S. professional managers’ domestic local equity preference by computing manager–firm geographic distances and a benchmark-adjusted “local bias” statistic (actual portfolio vs. equal-/value-weighted and style benchmarks), shows managers hold stocks about 160–184 km closer than benchmarks (≈9–11% local bias, robust to excluding NYC and fund-type restrictions), and links the bias to an information channel via stronger locality for small, highly levered, and nontraded (no foreign-sales) firms while extrapolating the distance effect to explain a meaningful share of international home bias."

- title: "O’Hara, Rapp, and Zhou (RFS, 2026) - Bond Market Resiliency: The Role of Insurers"
  file: "OHara_Rapp_Zhou_RFS_2026.pdf"
  desc: "This note summarizes the paper, which uses NAIC insurer bond transactions and TRACE dealer trades around the March 6–19, 2020 COVID liquidity crisis to show that stable-funded insurers acted as net buyers when dealers retrenched, that insurers provided targeted liquidity through relationship dealers who later reciprocated with better execution, and that dealer–insurer funding stability reduced transaction costs and held down investment-grade yields—especially for bonds exposed to mutual-fund fire-sale pressure."

- title: "Eisenbach and Phelan (RFS, 2026) - Fragility of Safe Asset Markets"
  file: "Eisenbach_Phelan_RFS_2026.pdf"
  desc: "This note summarizes the paper, which builds a two-date global-games model of safe-asset trading where liquidity investors’ preemptive selling interacts with dealers’ convex balance-sheet costs to generate strategic complementarities and a threshold “dash-for-cash” price crash, shows how flight-to-safety demand can be stabilizing in resilient states but destabilizing in fragile states, and interprets March 2020 as a regime shift driven by dealer constraints and strategic selling with policy implications for credible purchase backstops and dealer-capacity relief."

- title: "Acemoglu and Yared (AER P&P, 2010) - Political Limits to Globalization"
  file: "Acemoglu_Yared_AER_P_P_2010.pdf"
  desc: "This note summarizes the paper, which uses cross-country long-difference (and bilateral) regressions relating changes in trade openness to changes in militarization—measured by military spending or personnel for a country and its distance-weighted neighbors—to show that rising militarization is robustly associated with smaller increases in trade (even excluding wars/Asia and allowing OECD trends), highlighting political-economy limits to globalization rather than purely technological inevitability."

- title: "Chen, Petukhov, Wang, and Xing (JF, 2024) - The Dark Side of Circuit Breakers"
  file: "Chen_Petukhov_Wang_Xing_JF_2024.pdf"
  desc: "This note summarizes the paper, which develops a two-investor equilibrium model where a market-wide circuit breaker creates an endogenous illiquidity state and a “magnet effect” that amplifies volatility as prices approach the halt threshold, and tests the model using minute-level E-mini S&P 500 futures (2013–2020) by relating realized volatility, skewness, expected returns, and abnormal volume to the market’s distance-to-threshold while controlling for leverage effects and intraday fixed effects, finding strong pre-halt volatility amplification and higher expected returns near the boundary."

- title: "Chen, Ma, Martin, and Michaely (JFE, 2022) - On the Fast Track: Information Acquisition Costs and Information Production"
  file: "Chen_Ma_Martin_Michaely_JFE_2022.pdf"
  desc: "This note summarizes the paper, which uses the staggered rollout of China’s high-speed rail as a travel-cost shock in firm–brokerage-pair DiD (with pair and city-year or firm-year/broker-year fixed effects) to show that cheaper in-person access increases analysts’ site visits, improves forecast accuracy, strengthens market reactions to forecast revisions and recommendations, and makes earnings announcements less informative—consistent with high-speed rail enabling more soft-information production and faster price discovery."

- title: "Jones and Kaul (JF, 1996) - Oil and the Stock Markets"
  file: "Jones_Kaul_JF_1996.pdf"
  desc: "This note summarizes the paper, which uses quarterly data for the U.S., Canada, Japan, and the U.K. to test whether stock markets price oil-price innovations rationally via a Campbell–Shiller cash-flow vs. discount-rate decomposition by regressing real stock returns on prewhitened oil shocks and then showing that the oil coefficients largely disappear once future industrial production growth (cash-flow news) is controlled for in the U.S. and Canada but remain significant in Japan and the U.K. even after adding standard expected-return predictors—suggesting those markets’ oil sensitivity is too large relative to measured fundamentals."

- title: "Titman, Wei, and Zhao (JFE, 2022) - Corporate Actions and the Manipulation of Retail Investors in China: An Analysis of Stock Splits"
  file: "Titman_Wei_Zhao_JFE_2022.pdf"
  desc: "This note summarizes the paper, which uses Chinese A-share stock splits (1999–2015) and an ex ante “suspicious split” classification (lock-up expirations, atypical timing, or high accruals) together with SSE account-level trading, block trades, share-pledge loans, and message-board activity to show that suspicious splits generate a retail-attention-driven inverse U-shaped price pattern (run-up then long-run reversal), with small retail investors buying while large/institutional investors and insiders sell or pledge shares—consistent with corporate actions being used to transfer wealth from less sophisticated retail investors when short selling is constrained."

- title: "Berger, Miller, Petersen, Rajan, and Stein (JFE, 2005) - Does Function Follow Organizational Form? Evidence from the Lending Practices of Large and Small Banks"
  file: "Berger_Miller_Petersen_Rajan_Stein_JFE_2005.pdf"
  desc: "This note summarizes the paper, which decomposes commodity futures expected returns into spot premia (captured by Short-Roll returns on near contracts) versus term premia (captured by Excess-Holding and maturity-spread returns), uses bimonthly data on 21 commodities (1986–2010) to show that the basis is the central forecasting variable, and demonstrates that a single basis HML factor prices the cross-section of spot premia while term premia require two separate basis-spreading factors (high-basis and low-basis) to explain maturity-spread returns."

- title: "Cremers and Petajisto (RFS, 2009) - How Active Is Your Fund Manager? A New Measure That Predicts Performance"
  file: "Cremers_Petajisto_RFS_2009.pdf"
  desc: "This note summarizes the paper, which introduces Active Share—a holdings-based measure defined as 1/2 ∑i ∣wi(fund) −wi(bench) ∣—and, using U.S. equity mutual funds (1980–2003) with endogenously assigned benchmarks among major S&P/Russell/Wilshire indexes, shows that Active Share (stock-selection activeness) and tracking error (factor-timing activeness) capture distinct dimensions of active management and that high Active Share funds (especially smaller ones) earn significantly higher future benchmark-adjusted performance while low Active Share “closet indexers” underperform net of fees."

- title: "Flynn, Ghent, and Tchistyi (RFS, 2020) - Informational Efficiency in Securitization after Dodd-Frank"
  file: "Flynn_Ghent_Tchistyi_RFS_2020.pdf"
  desc: "This note summarizes the paper, which studies post–Dodd-Frank CMBS issuance (2017–2019) to show the 5% risk-retention rule is binding and stringent—eliminating level-based signaling—so issuers signal collateral quality through the retention structure (vertical vs. horizontal first-loss vs. hybrid), and documents in a signaling model and issue-spread regressions that horizontal retention is interpreted as good news and is priced with lower spreads (especially for information-sensitive tranches), implying relatively small residual asymmetric information in the post-crisis CMBS market."

- title: "Caldara and Iacoviello (AER, 2022) - Measuring Geopolitical Risk"
  file: "Caldara_Iacoviello_AER_2022.pdf"
  desc: "This note summarizes the paper, which constructs a long-run newspaper-based Geopolitical Risk (GPR) index (1900–present) that separates threats from acts, validates it against historical episodes and narrative measures, and then uses VARs, cross-country disaster/quantile-growth regressions, and industry/firm exposure designs to show that both threats and realized events predict lower investment and hours, higher disaster probability, and larger downside risks to growth, with stronger investment cuts in more GPR-exposed industries and in firms mentioning geopolitical risk in earnings calls."

- title: "Kacperczyk and Seru (JF, 2007) - Fund Manager Use of Public Information: New Evidence on Managerial Skills"
  file: "Kacperczyk_Seru_JF_2007.pdf"
  desc: "This note summarizes the paper, which constructs a holdings-based “Reliance on Public Information” (RPI) measure—each fund-quarter’s R^2 from regressing portfolio holding changes on lagged analyst recommendation changes—and shows in a Grossman–Stiglitz framework and in mutual-fund data (1993–2002) that low-RPI managers (less tied to public signals) deliver higher subsequent factor- and holdings-based performance, attract higher future fund flows, and exhibit less risk-shifting than high-RPI managers."

- title: "Begenau and Landvoigt (RES, 2022) - Financial Regulation in a Quantitative Model of the Modern Banking System"
  file: "Begenau_Landvoigt_RES_2022.pdf"
  desc: "This note summarizes the paper, which builds and calibrates a general-equilibrium model with insured regulated commercial banks and uninsured runnable shadow banks (both supplying imperfectly substitutable liquidity services), quantifies how tighter commercial-bank capital requirements shift activity toward shadow banking through competing competition and liquidity-demand channels, and shows in a U.S.-calibrated economy that an optimal capital requirement around 16% raises welfare even though shadow banks become larger and slightly riskier because the reduction in commercial-bank default risk dominates."

- title: "Agarwal, Chomsisengphet, Mahoney, and Stroebel (QJE, 2015) - Regulating Consumer Financial Products: Evidence from Credit Cards"
  file: "Agarwal_Chomsisengphet_Mahoney_Stroebel_QJE_2015.pdf"
  desc: "This note summarizes the paper, which uses OCC account-level monthly data (2008–2011) and a difference-in-differences design comparing consumer credit cards (treated) to small-business cards (control) around the CARD Act’s phased implementation, showing that fee caps sharply reduced over-limit and late-fee revenue—especially for low-FICO borrowers—without meaningful offsets in interest charges, other fees, or credit supply, while the 36-month payoff disclosure nudge produced only modest repayment bunching."

- title: "Dinç (JFE, 2005) - Politicians and Banks: Political Influences on Government-Owned Banks in Emerging Markets"
  file: "Dinc_JFE_2005.pdf"
  desc: "This note summarizes the paper, which builds a cross-country bank-year panel of large banks (1994–2000), classifies government ownership using a 20% control threshold, and estimates a bank fixed-effects difference-in-differences regression that interacts an election-year indicator with government ownership to show that—in emerging markets—state-owned banks expand lending in election years relative to private banks (with robustness to macro controls, alternative election timing windows, and pre/post-election placebos)."

- title: "Plantin (RFS, 2015) - Shadow Banking and Bank Capital Regulation"
  file: "Plantin_RFS_2014.pdf"
  desc: "This note summarizes the paper, which builds a two-date banking model where money-like bank liabilities create real externalities, derives the optimal risk-adjusted leverage (capital) requirement under perfect enforcement, and then shows that when banks can secretly refinance risk through an opaque MMF “shadow banking” spot market with adverse selection (a lemons price r<p), tighter capital rules can induce inefficient regulatory arbitrage—forcing banks to sell more risk per dollar raised—so the welfare-optimal regulator may loosen formal requirements to keep money creation inside regulated banking rather than expand shadow banking."

- title: "Gopal and Schnabl (RFS, 2022) - The Rise of Finance Companies and FinTech Lenders in Small Business Lending"
  file: "Gopal_Schnabl_RFS_2022.pdf"
  desc: "This note summarizes the paper, which builds a new nationwide UCC-filing dataset of secured non-real-estate small-business loans (2006–2016) to track bank versus nonbank lending, uses counties’ precrisis bank lending share as exposure to the post-2008 bank credit-supply shock, and estimates county-level, county×industry/collateral, and within-firm substitution regressions (plus bank-shock natural experiments and bank-owned vs. independent finance-company comparisons) showing finance companies and FinTech lenders expanded most where banks pulled back—largely offsetting missing bank credit and leaving little long-run effect on local establishments, employment, or wages by 2016."

- title: "Bartlett, Morse, Stanton, and Wallace (JFE, 2022) - Consumer-Lending Discrimination in the FinTech Era"
  file: "Bartlett_Morse_Stanton_Wallace_JFE_2022.pdf"
  desc: "This note summarizes the paper, which exploits the GSE/FHA institutional risk-pricing grids (credit-score × LTV buckets) to decompose mortgage rates into grid-implied credit-risk prices versus residual lender markups, estimates loan-level pricing regressions with grid×time and lender×time fixed effects in merged 2009–2015 HMDA–ATTOM–McDash–Equifax data (and confirms with 2018–2019 HMDA including points and total loan costs), and shows Black and Latinx borrowers pay systematically higher residual rates—especially in high-minority-share tracts—while FinTech lenders do not eliminate these disparities, consistent with discriminatory price discrimination unrelated to creditworthiness."

- title: "Adena, Enikolopov, Petrova, Santarosa and Zhuravskaya (QJE, 2015) - Radio and the Rise of the Nazis in Prewar Germany"
  file: "Adena_Enikolopov_Petrova_Santarosa_Zhuravskaya_QJE_2015.pdf"
  desc: "This note summarizes the paper, which exploits cross-district variation in predicted radio signal strength (terrain × transmitter location/power) interacted with sharp time shifts in broadcast content control (apolitical → pro–Weimar/anti-extremist, 1929–Jan 1933 → pro-Nazi after Jan 1933) to estimate panel fixed-effects and first-difference event-study regressions on Nazi electoral outcomes, then extends to dictatorship-era mechanisms using city-level anti-Semitic incidents, Nazi party membership, deportations, and Der Stürmer letters with IV and predisposition-heterogeneity tests (medieval pogroms, 1924 extremist vote share, land inequality) showing propaganda effects are strongest where audiences are most receptive and can backfire elsewhere."

- title: "Mian, Sufi, and Verner (QJE, 2017) - Household Debt and Business Cycles Worldwide"
  file: "Mian_Sufi_Verner_QJE_2017.pdf"
  desc: "This note summarizes the paper, which uses a 30-country annual panel (1960–2012) to show that three-year household debt-to-GDP booms predict a delayed GDP growth bust (unlike nonfinancial firm debt), estimates this boom–bust pattern with panel VARs, local projections, and medium-run predictive regressions, supports a credit-supply mechanism with proxy-SVAR and cross-sectional IV evidence using mortgage–sovereign spread declines, documents overly optimistic expectations via IMF/OECD forecast-error regressions, and highlights nonlinearities, exchange-rate-regime dependence, unemployment effects, and a synchronized global household debt cycle that limits external adjustment."

- title: "Dinc and Gupta (JF, 2011) - The Decision to Privatize: Finance and Politics"
  file: "Dinc_Gupta_JF_2011.pdf"
  desc: "This note summarizes the paper, which studies India’s post-1991 federal SOE “disinvestment” by estimating Cox hazard models of privatization timing on lagged firm fundamentals (size, profitability, wages/sales) and local electoral competition (government vs. opposition vote shares, vote-share differences within a radius around each firm), documents a stark patronage fact that firms in the responsible minister’s home state are never privatized, and then uses political competition as an instrument for privatization in 2SLS performance regressions to show privatization improves profitability and productivity once selection is accounted for."

- title: "Petersen and Rajan (JF, 1994) - The Benefits of Lending Relationships: Evidence from Small Business Data"
  file: "Petersen_Rajan_JF_1994.pdf"
  desc: "This note summarizes the paper, which uses the 1988–1989 National Survey of Small Business Finances to measure lending relationships (relationship length, multiple-service ties, and borrowing concentration/number of banks), estimates loan-rate regressions for the firm’s most recent institutional loan and credit-availability regressions using costly trade-credit behavior (late payment and foregone early-payment discounts) as proxies for rationing, and shows that relationship strength has weak effects on interest rates but large effects on credit availability—consistent with relationship lenders using private information to relax quantity constraints rather than simply lowering quoted loan prices.”"

- title: "Farhi and Maggiori (QJE, 2018) - A Model of the International Monetary System"
  file: "Farhi_Maggiori_QJE_2018.pdf"
  desc: "This note summarizes the paper, which builds a tractable hegemon–rest-of-world model of the international monetary system where global demand for safe reserve assets meets a reserve issuer’s limited commitment not to devalue (treating devaluation as partial default), characterizes a safety / instability / collapse zone with self-fulfilling confidence crises (the Triffin dilemma), derives when the hegemon underissues or overissues reserves relative to world welfare, and extends the framework to the ZLB/gold-exchange standard and to multipolar reserve competition (including Nurkse-style instability)."

- title: "Duchin and Sosyura (JFE, 2012) - The Politics of Government Investment"
  file: "Duchin_Sosyura_JFE_2012.pdf"
  desc: "This note summarizes the paper, which hand-collects application status for CPP-eligible public financial institutions (TARP, 2008–2009), measures political influence via House Financial Services subcommittee district ties, connected directors, targeted lobbying, and targeted campaign contributions, estimates logit approval regressions conditional on applying with CAMELS-style controls and regulator/industry fixed effects (plus systemic-importance and placebo robustness), and shows political connections predict higher approval but worse post-CPP performance (ROA, Tobin’s Q, and returns), consistent with politically distorted government investment."

- title: "Kim, Pence, Stanton, Walden, and Wallace (ARFE, 2022) - Nonbanks and Mortgage Securitization"
  file: "Kim_Pence_Stanton_Walden_Wallace_ARFE_2022.pdf"
  desc: "This note summarizes the paper, which reviews and extends the post-GFC nonbank–agency/Ginnie Mae securitization system by (i) modeling how faster securitization and weaker capital regulation reduce nonbanks’ incentives to acquire costly soft information (shifting “skin in the game” to MSRs and servicing/advance obligations), (ii) estimating loan-level performance regressions showing nonbank-originated loans prepay earlier (especially in Ginnie Mae) and Ginnie Mae nonbank loans default earlier, and (iii) using Mortgage Call Report filings for the largest nonbank Ginnie Mae issuers to document balance-sheet composition and how liquidity/capital look under leverage vs. MSR-penalizing risk-weighted rules, highlighting a regulatory tradeoff between stability and servicing/MSR-market capacity."

- title: "Cohen and Frazzini (JF, 2008) - Economic Links and Predictable Returns"
  file: "Cohen_Frazzini_JF_2008.pdf"
  desc: "This note summarizes the paper, which uses Compustat segment disclosures to map public customer–supplier links (1980–2004), builds a “customer momentum” strategy that sorts suppliers on lagged customer returns, estimates large factor-adjusted alphas and underreaction coefficients showing supplier prices incorporate only ~60% of customer news immediately, and supports a limited-attention mechanism with cross-sectional variation in mutual-fund common ownership and fund-trading timing plus real-outcome link regressions tying customer shocks to supplier sales and operating income."

- title: "Cohen, Frazzini, & Malloy (JF, 2010) - Sell-Side School Ties"
  file: "Cohen_Frazzini_Malloy_JF_2010.pdf"
  desc: "This note summarizes the paper, which matches I/B/E/S sell-side recommendations (1993–2006) to hand-collected analyst education and BoardEx officer/director education to define school-tie links between analysts and firm insiders, tests performance using linked-versus-nonlinked buy/sell recommendation portfolios and panel regressions with analyst fixed effects and rich controls, and shows that linked buy recommendations earn large abnormal returns that largely vanish after Regulation FD (and persist in the U.K.), consistent with social networks facilitating selective information flow.”"

- title: "Demiroglu & James (RFS, 2012) - How Important is Having Skin in the Game? Originator–Sponsor Affiliation and Losses on Mortgage-backed Securities"
  file: "Demiroglu_James_RFS_2012.pdf"
  desc: "This note summarizes the paper, which uses 2003–2007 Alt-A RMBS deals (ABSNet + prospectuses) to measure “skin in the game” via originator–sponsor affiliation and originator servicing retention, estimates deal- and loan-level loss/default regressions with rich risk controls and low-doc heterogeneity, strengthens identification with propensity-score matching, an IV based on sponsors’ past affiliation tendencies, and a DiD around originator acquisitions that change affiliation, and shows affiliated/servicing-retaining originators produce substantially lower low-documentation losses that are also priced ex ante through lower yields and less credit enhancement (subordination/overcollateralization), including within AAA tranches."

- title: "Solomon, Soltes & Sosyura (JFE, 2014) - Winners in the Spotlight: Media Coverage of Fund Holdings as a Driver of Flows"
  file: "Solomon_Soltes_Sosyura_JFE_2014.pdf"
  desc: "This note summarizes the paper, which links active U.S. equity mutual funds’ disclosed holdings (Thomson/CRSP, 1998–2008) to national-newspaper coverage of the held stocks (Factiva: WSJ/NYT/WashPost/USA Today), estimates fund-flow regressions showing investors chase the lagged market-adjusted returns of media-covered holdings (but not other holdings) after controlling for fund returns and rich fixed effects, and supports a salience mechanism with disclosure-timing tests (effects appear only after holdings become public), recency and headline/lead-paragraph prominence, marketing-fee (less sophisticated clientele) interactions, and weak informativeness/window-dressing tests."

- title: "Loh and Stulz (RFS, 2011) - When Are Analyst Recommendation Changes Influential?"
  file: "Loh_Stulz_RFS_2011.pdf"
  desc: "This note summarizes the paper, which shifts the analyst-literature focus from average event CARs to firm-event “influence” by defining a recommendation change as influential only if its (DGTW-adjusted) two-day CAR is correctly signed and exceeds a firm-specific volatility threshold (and analogously for abnormal turnover), applies these filters to I/B/E/S–First Call recommendation changes (1994–2006) after removing earnings/guidance and multiple-recommendation news days, and shows only about one in ten recommendation changes are visibly influential—with influence predictable from analyst reputation/prior influence and away-from-consensus calls and followed by higher volatility, turnover, and analyst activity consistent with “paradigm-shift” information events."

- title: "Cortés et al. (JFE, 2020) - Stress tests and small business lending"
  file: "Cortes_Demyanyk_Lei_Loutskina_Strahan_JFE_2020.pdf"
  desc: "This note summarizes the paper, which exploits cross-bank variation in Federal Reserve stress-test exposure (distance to stressed-capital thresholds) and compares stress-tested banks within the same county-year to estimate how stress tests reshape small-business credit supply: exposed banks cut CRA originations in riskier, non-local markets (identified by county employment beta and lack of local branches), raise STBL loan rates for riskier borrowers especially in local markets, reduce risky-loan shares in non-local lending, and show aggregate county credit is largely preserved as small local banks substitute in where large non-local stress-tested banks retreat."

- title: "Garicano and Rossi-Hansberg (QJE, 2006) - Organization and Inequality in a Knowledge Economy"
  file: "Garicano_RossiHansberg_QJE_2006.pdf"
  desc: "This note summarizes the paper, which builds a general-equilibrium model of Garicano-style knowledge hierarchies where heterogeneous-ability agents choose how much to learn and then sort into workers, managers, and entrepreneurs who solve routine vs. exceptional problems via costly communication, deriving positive sorting, occupational stratification, and convex wages, and showing that cheaper communication (lower h) increases hierarchy layers/spans and raises top inequality while reducing lower-tail inequality, whereas cheaper learning (lower t) decentralizes problem solving and raises within-occupation inequality.”"

- title: "Chernenko, Erel, and Prilmeier (RFS, 2022) - Why Do Firms Borrow Directly from Nonbanks?"
  file: "Chernenko_Erel_Prilmeier_RFS_2022.pdf"
  desc: "This note summarizes the paper, which uses hand-collected SEC credit agreements for U.S. middle-market firms (2010–2015) to show bank regulation segments credit supply—negative EBITDA and very high debt/EBITDA borrowers are pushed toward direct nonbank lenders—documents higher spreads and distinct nonprice terms on nonbank loans (fewer covenants/performance pricing, more warrants/convertibility, riskier seniority), and supports the causal channel with OCC/local-banking-market interactions and a fuzzy RDD around the zero-EBITDA threshold."

- title: "Pedersen (JFE, 2022) - Game on: Social Networks and Markets"
  file: "Pedersen_JFE_2022.pdf"
  desc: "This note summarizes the paper, which builds a tractable asset-pricing model that embeds DeGroot social learning in a network with naive investors, hardheaded “fanatics,” and rational long- and short-term traders, derives closed-form expressions for influencer value and thought leadership and for prices as a rational benchmark plus a network-driven bubble component, and uses the framework to explain momentum, reversals, volume spikes, and meme-stock episodes such as GameStop through rational bubble-riding and eventual reversal trading."

- title: "Kaniel, Saar, and Titman (JF, 2008) - Individual Investor Trading and Stock Returns"
  file: "Kaniel_Saar_Titman_JF_2008.pdf"
  desc: "This note summarizes the paper, which uses NYSE audit-trail order data (2000–2003) to construct stock-week Net Individual Trading (retail buy–sell dollar imbalance scaled by past volume), documents that individuals are short-horizon contrarians (buy after recent declines, sell after rises), and shows that intense retail buying predicts positive next-month abnormal returns while intense retail selling predicts negative returns—robust to past-return and turnover controls, stronger in illiquid stocks, and consistent with a liquidity-provision/price-pressure reversal mechanism rather than informed trading."

- title: "Andersen, Campbell, Nielsen, and Ramadorai (AER, 2020) - Sources of Inaction in Household Finance: Evidence from the Danish Mortgage Market"
  file: "Andersen_Campbell_Nielsen_Ramadorai_AER_2020.pdf"
  desc: "This note summarizes the paper, which uses Danish administrative mortgage and household data (2009–2017) in a setting with penalty-free non-cash-out refinancing to estimate a mixture model that combines state-dependent refinancing thresholds (ADL benchmark plus psychological costs) with a Calvo-style “asleep”/inattention probability, decomposes missed refinancing into these two frictions, and runs policy counterfactuals showing “wake-up” interventions can outperform fee subsidies—especially for older, lower-income, and less-educated households."

- title: "Frame, Gerardi, Mayer, Xu, and Zhao (JFE, 2026) - Government Litigation Risk and the Decline in Low-Income Mortgage Lending"
  file: "Frame_Gerardi_Mayer_Xu_Zhao_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses DOJ/HUD False Claims Act litigation in the 2010s as a lender-legal-risk shock and estimates lender- and county-level difference-in-differences/triple-differences (FHA vs. conventional) using pre-2012 exposure to top FHA bank lenders, showing large banks exit FHA and exposed counties see a sizable, only partially offset decline in FHA credit that reduces low-income mortgage access without clear improvements in underwriting/defaults or borrower service quality."

- title: "Avenancio-León and Howard (QJE, 2022) - The Assessment Gap: Racial Inequalities in Property Taxation"
  file: "AvenancioLeon_Howard_QJE_2022.pdf"
  desc: "This note summarizes the paper, which links nationwide ATTOM assessment and transaction records (2003–2016) to HMDA homeowner race and GIS-defined taxing jurisdictions to estimate jurisdiction-year fixed-effects regressions of log assessment ratios, documents a large Black/Hispanic assessment gap (≈10–13%) with a spatial decomposition down to tract/block-group comparisons, and pinpoints mechanisms—assessments underweight neighborhood characteristics relative to market prices and unequal Cook County appeals amplify within-neighborhood disparities—while translating the gap into higher effective property-tax burdens for minority homeowners."

- title: "Granja, Leuz, and Rajan (JF, 2022) - Going the Extra Mile: Distant Lending and Credit Cycles"
  file: "Granja_Leuz_Rajan_JF_2022.pdf"
  desc: "This note summarizes the paper, which uses CRA small-business lending by bank–county–year merged with branch locations to measure lending distance, estimates bank-fixed-effects and county×year fixed-effects regressions showing distance lending is strongly procyclical (spiking 2004–2007), validates that boom-time distant loans are riskier but not priced with higher rates using SBA charge-offs and interest-rate evidence, and links the mechanism to Fed tightening–induced deposit reallocation toward competitive origin markets and to managerial short-termism/limited internal capital-market frictions, with systemic-risk tests showing banks with more procyclical distance lending suffer worse crisis outcomes.”"

- title: "Ahern and Sosyura (RFS, 2015) - Rumor Has It: Sensationalism in Financial Media"
  file: "Ahern_Sosyura_RFS_2015.pdf"
  desc: "This note summarizes the paper, which hand-collects 501 newspaper merger-rumor scoops (2000–2011) to estimate logit accuracy models where “truth” is a public bid within one year, shows rumors about more newsworthy targets (large/public/brand/advertising-heavy) are systematically less accurate while journalist traits and article text (weak modal language vs. concrete deal details) predict accuracy, and documents that markets overreact by not fully incorporating these public credibility signals—producing predictable reversals and long–short returns that are strongest when arbitrage is difficult (illiquid/high-idiosyncratic-vol stocks)."

- title: "Hu, Pan, and Wang (JF, 2013) - Noise as Information for Illiquidity"
  file: "Hu_Pan_Wang_JF_2013.pdf"
  desc: "This note summarizes the paper, which fits a smooth daily U.S. Treasury yield curve (Svensson) and defines Treasury “noise” as the cross-sectional RMS yield deviation from the fitted curve, shows noise spikes precisely in liquidity crises, and then prices this aggregate illiquidity factor by estimating hedge funds’ noise betas and running Fama–MacBeth tests (more negative noise exposure earns higher returns) and by explaining currency carry returns as compensation for noise-related liquidity crash risk."

- title: "Agarwal and Ben-David (JFE, 2018) - Loan Prospecting and the Loss of Soft Information"
  file: "Agarwal_BenDavid_JFE_2018.pdf"
  desc: "This note summarizes the paper, which exploits a quasi-random 2005 bank pilot that moved some small-business loan officers from fixed salary to prospecting-based incentives to run a loan-officer fixed-effects difference-in-differences design, showing incentives raise approvals and loan sizes without improving application inflow, shift approval decisions toward hard information and away from soft (internal) assessments, and ultimately increase ex post defaults—evidence that sales incentives can erode relationship-lending soft information and break down existing credit models."

- title: "Chen, De, Hu, and Hwang (RFS, 2014) - Wisdom of Crowds: The Value of Stock Opinions Transmitted Through Social Media"
  file: "Chen_De_Hu_Hwang_RFS_2014.pdf"
  desc: "This note summarizes the paper, which uses 2005–2012 Seeking Alpha single-ticker articles and their first-two-day comment threads to construct text-based negativity measures (Loughran–McDonald dictionary), estimates predictability regressions and calendar-time portfolios on t+3 to t+60 characteristic-adjusted abnormal returns (skipping the immediate window), and shows both article tone and—more strongly when there are many comments—crowd comment tone predict future returns and future earnings surprises, with reputation/track-record tests indicating readers reward consistent authors and comments can correct weak authors (a “wisdom of crowds” mechanism)."

- title: "Cole, Paulson, and Shastry (RFS, 2014) - Smart Money? The Effect of Education on Financial Outcomes"
  file: "Cole_Paulson_Shastry_RFS_2014.pdf"
  desc: "This note summarizes the paper, which uses historical U.S. state compulsory schooling laws as instruments (and a two-sample IV linking Census first stages to FRBNY-CCP credit outcomes) to estimate causal effects of marginal schooling on household finance, showing that additional education substantially increases participation in higher-return assets and retirement income while reducing severe credit distress—bankruptcy, foreclosure, and delinquency—especially during the financial crisis."

- title: "Irani, Iyer, Meisenzahl, and Peydro (RFS, 2021) - The Rise of Shadow Banking: Evidence from Capital Regulation"
  file: "Irani_Iyer_Meisenzahl_Peydro_RFS_2021.pdf"
  desc: "This note summarizes the paper, which uses the Shared National Credit registry to exploit within–loan-year comparisons of syndicate members and a Basel III capital-shortfall shock to show that low-capital banks sell syndicated term-loan shares to reduce risk-weighted assets and that these sales raise nonbank (shadow-bank) loan ownership, then links this regulatory-driven risk migration to financial fragility by showing that loans funded by unstable-liability nonbanks suffer larger price drops and sharper credit contractions during the 2008 crisis.”"

- title: "Liu and Pan (Trade WP, 2025) - Pricing the Global Trade Vulnerability"
  file: "Liu_Pan_Trade_WP_2025.pdf"
  desc: "This note summarizes the paper, which uses shipment-level Panjiva bill-of-lading data matched to Compustat/CRSP to construct a firm-level import country-concentration (Herfindahl) vulnerability measure, forms value-weighted portfolios sorted on industry-demeaned concentration to build a trade-risk factor (high-concentration importers minus zero-trade firms), and shows this factor earns large and robust alphas that survive five-factor, industry-neutral/within-industry, technology controls, and is especially salient around trade-war/COVID/tariff episodes—implying global supply-chain fragility is a priced systematic risk."

- title: "Li (RES, 2018) - Better Lucky Than Rich? Welfare Analysis of Automobile Licence Allocations in Beijing and Shanghai"
  file: "Li_RES_2018.pdf"
  desc: "This note summarizes the paper, which estimates a random-coefficients automobile demand model for four Chinese cities and leverages Shanghai’s license-auction bids (car price + bid) plus common-trend, income-share micro moments, and quota-matching moments to recover households’ WTP for a license, then conducts a welfare comparison showing Beijing’s nontransferable lottery reduces externalities but generates far larger allocative losses than a uniform-price auction (with large implied auction revenues)."

- title: "Falck, Gold, and Heblich (AER, 2014) - E-lections: Voting Behavior and the Internet"
  file: "Falck_Gold_Heblich_AER_2014.pdf"
  desc: "This note summarizes the paper, which identifies the causal effect of broadband Internet on political participation in Germany by instrumenting municipal DSL availability with predetermined quirks of the preexisting telephone network (the 4,200-meter copper-distance cutoff, “no closer MDF” constraints, and East German OPAL fiber areas), estimating first-difference IV regressions across election cycles and showing that early broadband access reduced voter turnout—especially in nonlocal (federal/state) elections—through a media-substitution mechanism that crowds out TV and increases entertainment time without robustly shifting party vote shares."

- title: "Dessein and Santos (JPE, 2006) - Adaptive Organizations"
  file: "Dessein_Santos_JPE_2006.pdf"
  desc: "This note summarizes the paper, which develops a team-theoretic model of organizational design where firms choose task specialization, task bundling, and communication quality to trade off Smithian specialization gains against adaptation–coordination losses from using workers’ local information, showing that better communication can reduce specialization by making an “adaptive” mode attractive (broad jobs, higher flexibility, more horizontal communication), with nonmonotone comparative statics in task interdependence and communication quality and strong complementarities that generate clustered workplace practices."

- title: "Bolton and Dewatripont (QJE, 1994) - The Firm as a Communication Network"
  file: "Bolton_Dewatripont_QJE_1994.pdf"
  desc: "This note summarizes the paper, which models the firm as an information-processing/communication network with costly message transmission (fixed and marginal reading costs) and returns to specialization in repeated processing, derives when efficient organizations become pyramidal hierarchies with one-agent–one-superior reporting, nonredundant links, and increasingly aggregated reports at higher layers (implying smaller spans at the top), and contrasts regular pyramids with conveyor-belt chains to show organizational form trades off specialization gains against communication-link and transit costs."

- title: "Martin and Yurukoglu (AER, 2017) - Bias in Cable News: Persuasion and Polarization"
  file: "Martin_Yurukoglu_AER_2017.pdf"
  desc: "This note summarizes the paper, which instruments Fox News viewership with local cable channel position (lower positions increase viewing) to estimate persuasion effects on presidential voting and then fits a structural model with both selective exposure (taste for like-minded news) and persuasion (viewing shifts ideology), using text-based slant measures to trace how cable news can move vote shares and modestly amplify polarization through feedback between media choice and ideological influence."

- title: "Berry, Levinsohn, and Pakes (JPE, 2004) - Differentiated Products Demand Systems from a Combination of Micro and Macro Data: The New Car Market"
  file: "Berry_Levinsohn_Pakes_JPE_2004.pdf"
  desc: "This note summarizes the paper, which estimates a random-coefficients demand system for the 1993 U.S. new-car market by combining aggregate product shares (to recover mean utilities via the BLP contraction) with CAMIP micro data on buyer demographics and—crucially—stated second choices (to discipline substitution patterns and identify unobserved taste heterogeneity), and then discusses how the level of price elasticities still requires additional information (instruments, a pricing equation, or an aggregate-elasticity normalization) while using the fitted model for counterfactual entry/exit predictions (e.g., introducing a high-end SUV or discontinuing Oldsmobile)."

- title: "Garicano (JPE, 2000) - Hierarchies and the Organization of Knowledge in Production"
  file: "Garicano_JPE_2000.pdf"
  desc: "This note summarizes the paper, which develops a theory of knowledge-based hierarchies where production tasks are “problems” drawn from a distribution and workers either learn solutions (costly) or ask specialists for help (also costly), yielding an optimal management-by-exception organization in which frontline workers learn common/routine problems, higher layers learn rarer exceptions, and the resulting nonoverlapping knowledge allocation generates a pyramidal hierarchy; comparative statics show cheaper knowledge acquisition decentralizes and flattens organizations, cheaper communication increases reliance on specialists and span of control, and greater production complexity raises specialist intervention and reduces spans."

- title: "Mullainathan and Shleifer (AER, 2005) - The Market for News"
  file: "Mullainathan_Shleifer_AER_2005.pdf"
  desc: "This note summarizes the paper, which develops a Hotelling-style demand-side theory of media bias where profit-maximizing newspapers choose slant (distorting reported news away from the underlying signal) to cater to readers’ confirmatory preferences, showing that with rational accuracy-seeking readers monopoly and duopoly are unbiased, but with biased readers competition does not eliminate slant (homogeneous beliefs → common slant; heterogeneous beliefs → polarized outlets that can be more extreme than any reader), while cross-checking across opposing slants can improve accuracy for “conscientious” multi-source readers."

- title: "Petrin (JPE, 2002) - Quantifying the Benefits of New Products: The Case of the Minivan"
  file: "Petrin_JPE_2002.pdf"
  desc: "This note summarizes the paper, which estimates a BLP-style random-coefficients demand-and-supply model of U.S. automobiles (1981–1993) augmented with CEX micro moments (purchase rates by income group and buyer family-size/age moments for minivans and other family vehicles) to discipline substitution patterns, and then runs a counterfactual that removes minivans and solves for the new Bertrand equilibrium to compute compensating-variation consumer surplus and producer-profit effects—showing micro moments greatly reduce inflated WTP estimates and yielding large total welfare gains from the minivan that accrue mostly to consumers despite Chrysler’s temporary first-mover profits."

- title: "Gentzkow, Shapiro, and Sinkinson (AER, 2011) - The Effect of Newspaper Entry and Exit on Electoral Politics"
  file: "Gentzkow_Shapiro_Sinkinson_AER_2011.pdf"
  desc: "This note summarizes the paper, which builds a county-level panel of U.S. daily newspapers (1869–2004) and uses newspaper entry/exit events in first-difference regressions with state-year fixed effects and event-study pretrend checks to identify causal effects on politics, finding that newspapers primarily mobilize voters—raising turnout (especially the first newspaper in a county) and readership—while explicitly partisan newspaper balance does not meaningfully shift party vote shares or incumbency advantage on average."

- title: "Autor, Dorn, and Hanson (AER, 2013) - The China Syndrome: Local Labor Market Effects of Import Competition in the United States"
  file: "Autor_Dorn_Hanson_AER_2013.pdf"
  desc: "This note summarizes the paper, which measures commuting-zone exposure to Chinese import competition with a shift-share “import exposure per worker” variable, identifies the China supply-shock component using an IV based on China’s export growth to other high-income countries, and estimates stacked first-difference 2SLS regressions showing that more exposed local labor markets suffer large, persistent manufacturing job losses that spill over into higher unemployment and nonparticipation, lower wages (especially in nonmanufacturing), and higher transfer receipts with little offsetting migration—highlighting concentrated local adjustment costs of globalization.”"

- title: "Nevo (JEMS, 2000) - A Practitioner’s Guide to Estimation of Random-Coefficients Logit Models of Demand"
  file: "Nevo_JEMS_2000.pdf"
  desc: "This note summarizes the paper, which provides a step-by-step practitioner guide to estimating random-coefficients logit (BLP) demand by inverting observed market shares to recover mean utilities via the contraction mapping, treating the implied unobserved product quality ξjt as the structural error, and estimating taste heterogeneity and price sensitivity with IV/GMM using cost shifters, BLP-style characteristics instruments, or Hausman cross-market price instruments (often with brand fixed effects), illustrated with a cereal-style application and an implementation checklist plus common pitfalls."

- title: "Deaton & Laroque (RES, 1992) - On the Behaviour of Commodity Prices"
  file: "Deaton_Laroque_RES_1992.pdf"
  desc: "This note summarizes the paper, which develops a rational-expectations competitive storage model where the non-negativity constraint on inventories creates two regimes (a storage regime with positive inventories and a stockout regime with zero inventories), derives the resulting kinked conditional-mean and rising conditional-variance restrictions for prices, and then solves/simulates the model and estimates it by GMM on annual real prices for 13 commodities (1900–1987) to show the storage mechanism can generate skewness, fat tails, and occasional price spikes but struggles to match the very high autocorrelation observed in the data without additional persistence or richer institutions."

- title: "Di Maggio et al. (AER, 2017) - Interest Rate Pass-Through: Mortgage Rates, Household Consumption, and Voluntary Deleveraging"
  file: "DiMaggio_Kermani_Keys_Piskorski_Ramcharan_Seru_Yao_AER_2017.pdf"
  desc: "This note summarizes the paper, which exploits predetermined five-year ARM reset timing as an exogenous mortgage-payment shock (avoiding refinancing selection) by estimating borrower fixed-effects event studies and DiD comparisons to longer-reset ARMs, showing that crisis-era index declines cut non-agency ARM payments by about $940/month and led households to both increase durable consumption (auto spending) and voluntarily deleverage (faster mortgage principal repayment) with strong heterogeneity by income/LTV, and that these effects aggregate up in regional IV evidence where higher pre-crisis ARM exposure predicts larger local rate pass-through, lower delinquency, and stronger house-price, auto-sales, and employment growth."

- title: "Berry, Levinsohn, and Pakes (Econometrica, 1995) - Automobile Prices in Market Equilibrium"
  file: "Berry_Levinsohn_Pakes_Econometrica_1995.pdf"
  desc: "This note summarizes the paper, which introduces the canonical BLP framework for differentiated-products markets by estimating a random-coefficients logit demand system using an inversion from observed market shares to mean utilities, addressing price endogeneity with instruments built from own- and rival-product characteristics, and combining the demand estimates with multiproduct Bertrand first-order conditions to back out marginal costs and markups—delivering realistic substitution patterns (unlike simple logit) and enabling counterfactual pricing and welfare analysis in the U.S. automobile market."

- title: "Hubbard (QJE, 1986) - Supply Shocks and Price Adjustment in the World Oil Market"
  file: "Hubbard_QJE_1986.pdf"
  desc: "This note summarizes the paper, which builds a two-price world oil market model (spot vs. long-term contract/official prices) where the relevant demand price is a weighted average Pt =αPtC +(1−α)PtS , derives a rational-expectations contract-price adjustment rule that makes even white-noise supply shocks generate persistent contract-price movements (with spot prices jumping on impact and then being pulled back as contract prices drift), and illustrates the mechanism with 1973–1984 spot/contract data and unstable pre- vs post-1980 spot→contract regressions—showing that the contracting structure (α) and pricing rule, not shock persistence, drive observed price inertia.”"

- title: "Conlon and Gortmaker (J. Econometrics, 2025) - Incorporating Micro Data into Differentiated Products Demand Estimation with PyBLP"
  file: "Conlon_Gortmaker_JEconometrics_2025.pdf"
  desc: "This note summarizes the paper, which formalizes a micro-BLP estimator that augments standard aggregate BLP moments with carefully weighted micro moments (survey/panel summaries, conditional means/covariances, and especially second-choice/diversion moments) computed from known sampling rules, shows how these moments target weakly identified heterogeneity parameters (Π from demographic–choice links and Σ from substitution patterns), provides compatibility tests and score-based optimal micro moments (useful only when micro data are complete/consistent), and implements the full nested fixed-point GMM workflow in PyBLP, illustrated in simulations and a Seattle sweetened-beverage-tax application where adding second-choice moments materially changes predicted substitution."

- title: "Mayer, Morrison, Piskorski, and Gupta (AER, 2014) - Mortgage Modification and Strategic Behavior: Evidence from a Legal Settlement with Countrywide"
  file: "Mayer_Morrison_Piskorski_Gupta_AER_2014.pdf"
  desc: "This note summarizes the paper, which uses the October 2008 Countrywide legal settlement as a quasi-experimental information/eligibility shock and estimates a diff-in-diff/event-study on subprime 2/28 ARMs (Countrywide-serviced vs. similar non-Countrywide loans) showing that making 60-day delinquency central to modification eligibility raised the monthly “rollover” rate from current to 60+ days delinquent by about 0.48–0.54 pp (≈10–11%), with stronger effects among borrowers with unused credit card liquidity or CLTV < 100 and no comparable jumps on nontargeted debts (credit cards/second liens/FRMs), consistent with strategic default induced by simple delinquency-based relief rules."

- title: "Hamilton (JPE, 1983) - Oil and the Macroeconomy since World War II"
  file: "Hamilton_JPE_1983.pdf"
  desc: "This note summarizes the paper, which combines historical episode evidence on petroleum-sector/geopolitical disruptions with quarterly Granger-causality tests in a Sims-style macro system to show that crude oil price increases systematically predict lower future real GNP growth and higher unemployment with a lag of about 3–4 quarters, while standard macro variables generally do not predict oil price changes—supporting the interpretation of oil shocks as plausibly exogenous supply disturbances that helped shape the timing and severity of many postwar U.S. recessions (including pre-OPEC)."

- title: "Mian and Sufi (AER, 2011) - House Prices, Home Equity–Based Borrowing, and the US Household Leverage Crisis"
  file: "Mian_Sufi_AER_2011.pdf"
  desc: "This note summarizes the paper, which uses 1997 homeowner credit-bureau panels and an IV strategy based on MSA housing-supply elasticity (plus a within-MSA triple-difference using 1997 subprime share × supply inelasticity) to identify the causal effect of 2002–2006 house-price appreciation on home-equity borrowing, finding that existing homeowners increase debt by about 0.52% per 1% house-price gain (≈25 cents per $1 of home-value gains), with borrowing concentrated among low-credit-score/high-credit-utilization/younger households, and that this channel explains roughly $1.25 trillion of debt growth and at least 39% of new defaults in 2006–2008."

- title: "Conlon and Gortmaker (RAND J Econ, 2020) - Best Practices for Differentiated Products Demand Estimation with PyBLP"
  file: "Conlon_Gortmaker_RAND_J_Econ_2020.pdf"
  desc: "This note summarizes the paper, which provides a practical “best practices” guide to estimating BLP-style random-coefficients demand (and supply) with the PyBLP package by formalizing the nested fixed-point GMM workflow (share inversion → markups/marginal costs → stacked demand/supply moments), and showing via Monte Carlo and replications (Nevo cereal; BLP autos) that tight inversion tolerances, careful integration rules (e.g., scrambled Halton / Gauss–Hermite / sparse grids), analytic gradients, fixed-effect absorption, robust pricing-equilibrium solvers (ζ-markup iteration), and especially feasible optimal instruments plus correctly specified supply restrictions greatly reduce bias and eliminate apparent “local optima” instability—making counterfactual elasticities, markups, and merger simulations far more stable and replicable.”"

- title: "Acharya, Lochstoer, and Ramadorai (JFE, 2013) - Limits to Arbitrage and Hedging: Evidence from Commodity Markets"
  file: "Acharya_Lochstoer_Ramadorai_JFE_2013.pdf"
  desc: "This note summarizes the paper, which develops a hedging-pressure model where distressed oil-and-gas producers have stronger incentives to short futures to hedge and capital-constrained speculators take the long side with a downward-sloping demand curve, implying higher producer default risk predicts higher futures risk premia and higher expected spot-price changes; it tests these predictions in crude oil, heating oil, gasoline, and natural gas using producer default risk (Zmijewski score and KMV EDF) as a hedging-demand proxy validated by EDGAR hedging disclosures, and shows the forecasting relation is strongest when futures volatility is high and when broker-dealer balance sheets shrink (tight arbitrage capital), with supporting evidence from CFTC positions, inventories, and the basis linking financial limits-to-arbitrage to real inventory/spot-price dynamics."

- title: "Berry and Haile (Handbook, 2021) - Foundations of Demand Estimation"
  file: "Berry_Haile_Handbook_2021.pdf"
  desc: "This note summarizes the paper, which lays out the index–inversion–instruments logic behind modern demand estimation: it explains why multi-product demand is not “just regression” because prices and shares are jointly endogenous to a vector of latent demand shocks, develops random-utility discrete-choice foundations (including the BLP random-coefficients model), shows how connected-substitutes invertibility lets researchers recover mean utilities/demand shocks from observed market shares, and clarifies what identification requires—namely instruments that shift both prices and shares (cost shifters, rival characteristics/BLP instruments, market-structure shifts) and how micro data/panels/ranked choices reduce instrument needs by providing within-market variation while leaving the price endogeneity problem."

- title: "Ausubel (AER, 1991) - The Failure of Competition in the Credit Card Market"
  file: "Ausubel_AER_1991.pdf"
  desc: "This note summarizes the paper, which documents that the U.S. credit card market in the 1980s looks competitive by structure but not by outcomes—credit card APRs stay near 18% with extremely small pass-through to funding costs (cost-of-funds coefficient ≈ 0.04–0.05), issuers earn persistently high adjusted profitability (often 70–120% pretax ROE for major issuers), and portfolios sell at sizable premia (≈20%)—and argues the failure of price competition is driven by consumer inattention/search frictions and adverse selection (rate cuts disproportionately attract planned revolvers who are riskier and less profitable than inattentive borrowers), leading competition to shift toward nonprice dimensions rather than finance charges."

- title: "Brown, Cookson, and Heimer (JFE, 2019) - Growing up without Finance"
  file: "Brown_Cookson_Heimer_JFE_2019.pdf"
  desc: "This note summarizes the paper, which exploits Public Law 280’s 1953 assignment of some Native American reservations to state courts (versus tribal courts) as a long-run shock to local banking development, links reservation census tracts to the FRBNY–CCP/Equifax credit-bureau panel (1999–2015) and complementary CFPB-complaint and Qualtrics-survey data, and estimates cohort/age/region fixed-effects entry and adult-credit-health regressions showing that growing up under weaker local finance (tribal-court areas) leads to lower credit-report coverage and slower credit entry, and in adulthood to ~7–10 point lower credit scores and ~2–4pp higher delinquency, with effects absent for older placebo cohorts and fading only slowly after movers leave reservations; mechanism evidence points to bank-specific financial literacy and trust rather than general knowledge."

- title: "Odean (JF, 1998) - Are Investors Reluctant to Realize Their Losses?"
  file: "Odean_JF_1998.pdf"
  desc: "This note summarizes the paper, which uses trading records from 10,000 U.S. discount-brokerage accounts (1987–1993) to test the disposition effect by constructing opportunity-adjusted realization rates—the Proportion of Gains Realized (PGR = RG/(RG+PG)) and Proportion of Losses Realized (PLR = RL/(RL+PL))—and showing that investors realize gains significantly more often than losses for most of the year (full-year PGR 0.148 vs. PLR 0.098), with the pattern reversing in December consistent with tax-loss selling; extensive robustness checks (account-level tests, full-position sales, no-repurchase filters, price/return bins) and ex post performance comparisons show sold winners continue to outperform paper losers, implying that reluctance to realize losses is behaviorally driven and economically costly."

- title: "Gaspar, Massa, and Matos (JFE, 2005) - Shareholder Investment Horizons and the Market for Corporate Control"
  file: "Gaspar_Massa_Matos_JFE_2005.pdf"
  desc: "This note summarizes the paper, which uses U.S. M&A data (SDC deals, 1980–1999) merged with CRSP/Compustat and 13F institutional holdings to measure shareholder horizons via institutional investors’ portfolio churn rates (a firm-level weighted average of owners’ total-portfolio turnover, measured 6–9 months before announcements), and then estimates takeover-premium, bidder-CAR, acquisition-likelihood, and long-run acquirer-performance regressions (with rich ownership/liquidity/activism/arbitrage and deal controls plus Heckman selection correction). The paper finds that short-horizon target shareholders make firms more likely targets and significantly reduce takeover premia (≈3 pp lower premium per 1 SD higher turnover), while short-horizon bidder shareholders are associated with more negative bidder announcement returns and substantial post-merger underperformance (high-turnover minus low-turnover acquirers ≈ −0.7% per month over three years), with cross-effects showing short-horizon bidders tend to overpay (raising target premia), supporting a bargaining-power channel for targets and a monitoring/agency channel for bidders."

- title: "Allen, Qian, Shan, and Zhu (JF, 2024) - Dissecting the Long-Term Performance of the Chinese Stock Market"
  file: "Allen_Qian_Shan_Zhu_JF_2024.pdf"
  desc: "This note summarizes the paper, which diagnoses China’s puzzlingly poor long-run A-share performance (1991–2018; especially 2000–2018) by combining cross-country comparisons, within-China comparisons to externally listed Chinese firms and matched unlisted Chinese firms, and a simple valuation model that nests three explanations—institutional deficiencies (IPO/delisting rules and governance), behavioral optimism under short-sale constraints, and financial repression—and then testing them with IPO event-window operating-performance reversals, “ST” (weak delisting) evidence, governance/tunneling indices, and sentiment measures. The paper shows A-shares deliver near-zero real buy-and-hold returns while external Chinese listings perform strongly, that A-share firms invest more but generate lower operating and net cash flows, that underperformance is concentrated in large A-share firms, and that governance predicts both future returns and cash-flow performance while sentiment mainly predicts low future returns—implying the A-share market’s failure reflects distorted entry/exit, weak governance, and speculative pricing more than (though partly also) low discount rates from repression."

- title: "Agarwal, Qian, Seru, and Zhang (JFE, 2020) - Disguised Corruption: Evidence from Consumer Credit in China"
  file: "Agarwal_Qian_Seruc_Zhang_JFE_2020.pdf"
  desc: "This note summarizes the paper, which uses a representative sample of 185k+ Chinese credit-card customers (2003–2005) from a major commercial bank to test whether consumer credit is used as disguised corruption: it propensity-score matches government bureaucrats to observably similar non-bureaucrats, estimates city×time fixed-effect regressions and quantile regressions showing bureaucrats receive significantly larger credit lines (≈16% on average, larger in the right tail), and then applies an outcome-test logic showing bureaucrats are more likely to become delinquent and yet receive softer ex post treatment (higher and slower reinstatement), with effects concentrated among high-rank, non-retiring bureaucrats and in more corrupt regions. The paper links these credit favors to quid-pro-quo bank benefits (future branch openings and government deposits), documents crowd-out of credit to ordinary households in high-premium cities, and provides quasi-experimental evidence from staggered anti-corruption crackdowns showing the bureaucrat premium and abnormal delinquency/reinstatement patterns largely disappear when investigation risk rises."

- title: "Barber, Huang, Odean, and Schwarz (JF, 2022) - Attention-Induced Trading and Returns: Evidence from Robinhood Users"
  file: "Barber_Huang_Odean_Schwarz_JF_2022.pdf"
  desc: "This note summarizes the paper, which uses Robintrack stock-level Robinhood user counts (May 2018–Aug 2020) as a proxy for coordinated retail buying pressure, links these user-count jumps to standard attention measures (extreme returns, abnormal volume, Google searches, news, earnings), and then identifies app-induced attention effects using (i) unexpected Robinhood outages as shocks to trading access and (ii) a regression discontinuity at the roughly $300M market-cap cutoff for eligibility in Robinhood’s “Top Movers” list. The paper documents that Robinhood net buying is unusually concentrated (top-10 stocks ≈35% of daily net buying), that Top Movers display leads users to buy both big gainers and big losers (unlike broader TAQ retail), and that extreme “purchase herding” predicts sharp post-event reversals—baseline top-0.5% herding stocks earn about −4.7% BHAR over the next 20 trading days, with much more negative returns (approaching −20%) for the most intense episodes—while abnormal short volume spikes around herding events, consistent with sophisticated traders trading against attention-driven price pressure."

- title: "Liu, Lu, and Yuan (JDE, 2025) - The Quiet Revolution: Send-down Movement and Female Empowerment in China"
  file: "Liu_Lu_Yuan_JDE_2025.pdf"
  desc: "This note summarizes the paper, which studies China’s late-1960s–1970s Send-down Movement as a large, temporary urban-to-rural migration shock and uses a cohort difference-in-differences design that interacts county-level SDY inflow intensity (SDYs as a share of 1964 county population) with whether rural individuals were of primary-school age during the movement (treated cohorts born 1956–1969 vs. older controls born 1946–1955). Using Census and survey outcomes decades later, the paper finds higher SDY exposure significantly raises rural women’s education (especially middle/high school completion), formal labor participation, work hours, and financial independence, and also delays marriage, reduces fertility, increases political participation, and shifts preferences toward gender-equal norms (self-confidence, independence, risk-taking, equal spousal relations). Event studies show no meaningful pre-trends, effects are generally larger for women than men (narrowing gender gaps), and mechanism tests indicate both human-capital channels (SDYs as teachers; longer school exposure matters for schooling/labor outcomes) and ideology/role-model transmission (attitude changes appear even with shorter exposure and in out-of-school interaction settings)."

- title: "Antràs and Caballero (JPE, 2009) - Trade and Capital Flows: A Financial Frictions Perspective"
  file: "Antras_Caballero_JPE_2009.pdf"
  desc: "This note summarizes the paper, which builds a two-country, two-sector trade model where countries differ in financial contractibility and sectors differ in external-finance dependence, so financial frictions distort autarky production toward the unconstrained sector and depress the local rental rate of capital. It shows that goods-trade openness and capital mobility can be complements for financially underdeveloped economies: when trade costs are high, the underdeveloped country’s rental rate is low and capital tends to flow out (capital flight), but as trade barriers fall, the country can specialize more in the unconstrained sector, which raises the marginal product and rental rate of capital enough to reverse the ranking and attract capital inflows. The paper derives a threshold trade-cost condition governing the direction of capital flows, proves the complementarity result is robust to general preferences/technologies (an “anti–Stolper–Samuelson” logic), extends the mechanism dynamically to interest rates and net capital flows, and highlights a policy implication that protectionism can worsen global imbalances when they are rooted in financial frictions."

- title: "Barberis, Shleifer, and Vishny (JFE, 1998) - A Model of Investor Sentiment"
  file: "Barberis_Shleifer_Vishny_JFE_1998.pdf"
  desc: "This note summarizes the paper, which develops a parsimonious behavioral asset-pricing model to jointly explain short-run underreaction and long-run overreaction by assuming earnings are a true random walk but investors mistakenly believe earnings switch between a mean-reverting regime and a trending regime and update Bayesianly within this wrong regime-switching model. The model maps conservatism into underreaction after isolated news (investors overweight mean reversion so prices adjust too little, generating drift/momentum) and representativeness into overreaction after long streaks (investors infer a trend regime and over-extrapolate, generating reversals and a value premium), and simulations replicate the sign pattern of post-earnings drift, momentum at short horizons, reversal at longer horizons, and higher returns for high earnings-price (“value”) stocks without invoking risk-based explanations."

- title: "Griffin, Hirschey, and Kelly (RFS, 2011) - How Important Is the Financial Media in Global Markets?"
  file: "Griffin_Hirschey_Kelly_RFS_2011.pdf"
  desc: "This note summarizes the paper, which uses a global Factiva dataset of firm-level news (871k+ articles for 2,593 firms in 56 countries, 2003–2009) to measure how much public media news moves stock prices by comparing idiosyncratic volatility on news days versus non-news days, first in clean earnings-announcement windows and then for general firm news. It documents that developed markets exhibit much larger incremental volatility on earnings/news days than emerging markets (e.g., normalized earnings-announcement volatility ≈0.38 vs. 0.15), and explains cross-country heterogeneity using country-level regressions and Bayesian SSVS that highlight insider trading prevalence (negative) and technological development/news dissemination (positive) as the dominant correlates (with accounting standards mattering for earnings but not general news). The paper strengthens the insider-trading interpretation with two auxiliary tests: low-news-reaction countries show much larger pre-announcement takeover run-ups (information leakage) and smaller reversals after extreme non-news-day returns (more informed trading on non-news days), implying that when private information is incorporated before public releases, media announcements arrive partly stale."

- title: "Li, Ng, and Swaminathan (JFE, 2013) - Predicting Market Returns Using Aggregate Implied Cost of Capital"
  file: "Li_Ng_Swaminathan_JFE_2013.pdf"
  desc: "This note summarizes the paper, which constructs a monthly aggregate implied cost of capital (ICC) for the S&P 500 (1977–2011) by backing out firm-level discount rates from current prices and analyst earnings forecasts in a finite-horizon residual-income/valuation model and then value-weighting across firms, and tests whether this ICC proxies for the market’s time-varying expected return. Using long-horizon return-predictability regressions with careful small-sample/overlap inference (including Monte Carlo p-values), bivariate horse races against classic predictors (D/P, E/P, B/M, payout yield, term and default spreads, short rate, long yield), and portfolio-level and out-of-sample forecasting tests, the paper finds ICC robustly and positively predicts future excess market returns from 1 month to 4 years and generally subsumes the predictive content of standard valuation ratios and business-cycle variables, delivering the strongest out-of-sample performance and meaningful utility gains for a mean–variance investor."

- title: "Carpenter, Lu, and Whitelaw (JFE, 2021) - The Real Value of China’s Stock Market"
  file: "Carpenter_Lu_Whitelaw_JFE_2021.pdf"
  desc: "This note summarizes the paper, which applies Bai et al. (2016)’s “forecasting vs. revelatory price efficiency” framework to China’s A-share market (1995–2016) by estimating yearly cross-sectional regressions that map current valuation ratios log(M/A) into future profits, future investment, and the investment–future-profit link (allocational efficiency), benchmarking these predicted-variation measures against the U.S. and then interacting them with state ownership, dual listing (H-shares), and QFII foreign ownership. It finds that after the early-2000s reform wave China’s stock prices become about as informative about future profits as U.S. prices, and for private firms this coincides with stronger price–investment sensitivity and improved allocational efficiency (consistent with managers learning from prices), while high state ownership becomes a major drag after 2008–2009 and dual listing is associated with lower A-share informativeness; the paper also provides suggestive return-based evidence of a higher implied cost of equity in China due to under-diversification and incomplete global integration.”"

- title: "Huang and Sacchetto (JFE, 2026) - Bonding with Risk: Corporate Investment and Savings in Risky Financial Assets"
  file: "Huang_Sacchetto_JFE_2026.pdf"
  desc: "This note summarizes the paper, which builds a dynamic investment-and-cash-management model where firms allocate precautionary savings between a safe asset and risky bond-like financial assets to hedge state-contingent funding needs, and tests the key prediction in a new 10-K–based dataset of U.S. firms’ safe vs. risky financial-asset holdings (2009–2018) using a firm-level financing-deficit beta—the sensitivity of a firm’s financing deficit to bond-market returns—as the sufficient statistic for hedge demand. Empirically, firms with higher financing-deficit betas hold significantly more risky financial assets (but not more safe assets), especially when the beta loads on medium/long-term interest-rate risk and among small, volatile, and R&D-intensive firms; counterfactuals in the model show restricting access to risky financial assets reduces firm value and investment while increasing reliance on external finance, implying risky financial assets can be a rational liquidity-management tool rather than pure agency or tax behavior."

- title: "Griffin, Kruger, and Mahajan (RFS, 2026) - Is Fraud Contagious? Social Connections and the Looting of COVID Relief Programs"
  file: "Griffin_Kruger_Mahajan_RFS_2026.pdf"
  desc: "This note summarizes the paper, which uses the universe of PPP loans and validated suspicious-loan flags to build ZIP- and county-level measures of fraud, then combines them with Facebook’s Social Connectedness Index to construct each ZIP code’s social proximity to suspicious PPP lending (a friendship-weighted average of fraud in other ZIP codes) and estimates within-county regressions showing social proximity is the strongest predictor of local fraud—explaining an order of magnitude more variation than any single demographic or crime proxy and predicting subsequent fraud growth across PPP rounds, especially for FinTech-originated loans. It strengthens the contagion interpretation by showing social proximity dominates physical distance, remains strong using only long-distance links, and predicts granular mechanisms—common use of the same FinTech platforms (e.g., Womply/BlueAcorn), clusters of nearly identical loan application features across socially connected places, and membership in social-media groups that discuss PPP “methods”—supporting the view that fraud diffused through networks via both information transmission and norm formation."

- title: "Holden, Lu, Lugovskyy, and Puzzello (JFE, 2021) - What Is the Impact of Introducing a Parallel OTC Market? Theory and Evidence from the Chinese Interbank FX Market"
  file: "Holden_Lu_Lugovskyy_Puzzello_JFE_2021.pdf"
  desc: "This note summarizes the paper, which exploits China’s January 4, 2006 reform that introduced a parallel decentralized OTC market alongside the existing centralized anonymous limit order book (LOB) for USD/CNY spot trading, using CFETS transaction-level data (Aug 2005–Dec 2006) to document rapid venue migration and estimate venue-specific transaction-cost schedules with a Heckman selection correction. It shows that the LOB features a single, upward-sloping effective-spread schedule (larger trades cost more, consistent with adverse-selection pricing), while the OTC exhibits multiple, downward-sloping price functions (larger trades get lower costs and large banks receive systematically better prices than medium/small banks, consistent with fixed-cost dilution and bargaining power), and it rationalizes these facts with a structural model of parallel LOB–OTC markets that predicts (and the data confirm) that higher-bargaining-power banks switch to OTC at smaller trade sizes."

- title: "Inderst and Muller (JFE, 2004) - The Effect of Capital Market Characteristics on the Value of Start-Up Firms"
  file: "Inderst_Muller_JFE_2004.pdf"
  desc: "This note summarizes the paper, which builds an equilibrium venture-capital search-and-bargaining model with double-sided moral hazard (both founder effort and VC value-adding effort are noncontractible), defines capital-market “competition” as the investor-to-entrepreneur ratio y=Mv/Me that pins down endogenous outside options and thus the negotiated equity share s, and shows that while higher competition raises pre- and post-money valuations mechanically (L=I/s, G=I(1−s)/s), it makes real value creation and success probabilities hump-shaped because too little competition gives founders too little stake and too much competition gives VCs too little stake. The model links boom–bust dynamics to profitability shocks that induce VC entry, studies how entry costs and transparency shift bargaining power and matching rates, and delivers testable predictions for how ownership shares, search times, screening intensity, and success rates co-move with hot versus cold VC markets.”"

- title: "Boutchkova, Doshi, Durnev, and Molchanov (RFS, 2012) - Precarious Politics and Return Volatility"
  file: "Boutchkova_Doshi_Durnev_Molchanov_RFS_2012.pdf"
  desc: "This note summarizes the paper, which uses a 50-country panel (1990–2006) of firm returns aggregated to industry–country–year cells to estimate how political uncertainty transmits into stock-return volatility through three industry exposure channels—trade dependence, contract-enforcement sensitivity (input complexity), and labor intensity—via Rajan–Zingales-style interaction regressions with country political variables (elections, autocracy, ICRG political risk, left-party governments, and employment rigidity) and rich fixed effects. It decomposes volatility into systematic versus idiosyncratic components, showing that foreign political risk transmitted through trade mainly raises idiosyncratic volatility while domestic political risk mainly raises systematic volatility, and provides mechanism and robustness tests (election-timing splits, IVs for political institutions, and alternative volatility constructions) that highlight how trade links, contracting needs, and labor regulation make some sectors especially sensitive to “precarious politics.”"

- title: "Fagereng, Gottlieb, and Guiso (JF, 2017) - Asset Market Participation and Portfolio Choice over the Life-Cycle"
  file: "Fagereng_Gottlieb_Guiso_JF_2017.pdf"
  desc: "This note summarizes the paper, which uses near-universe Norwegian administrative portfolio data (1995–2009) to document a two-margin life-cycle pattern—households reduce risky shares before retirement and then increasingly exit the stock market after retirement—and estimates selection-corrected (Heckman) age–time–cohort profiles to separate participation from conditional allocation. It then fits a structural life-cycle portfolio model with uninsurable labor income risk, borrowing constraints, a per-period participation cost, and rare disaster (tail) stock-market losses, showing that human-capital rebalancing explains the pre-retirement risky-share decline while participation costs plus a small crash probability (≈1% annually, calibrated to Norwegian crashes) are necessary to match the timing and extent of post-retirement exit and the joint wealth/participation/risky-share profiles."

- title: "Gu, Kelly, and Xiu (RFS, 2020) - Empirical Asset Pricing via Machine Learning"
  file: "Gu_Kelly_Xiu_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses U.S. monthly stock returns (1957–2016) and a high-dimensional predictor set (94 firm characteristics interacted with 8 macro variables plus industry dummies) to run a strict train/validation/test forecasting horse race across linear, regularized, dimension-reduction, spline, tree-based, and neural-network methods, showing that naive high-dimensional OLS overfits badly while regularization helps and nonlinear interaction models (especially boosted trees and moderately deep neural networks) deliver the best out-of-sample expected-return estimates. It translates forecast gains into economic value via bottom-up portfolio timing and decile long–short strategies (substantially higher Sharpe ratios and factor-adjusted alphas), and uses variable-importance and interaction diagnostics to show that price trends, liquidity, and volatility signals—often through nonlinearities and state-dependent interactions—drive most of the predictive power, while emphasizing the contribution is improved measurement of expected returns rather than identification of causal mechanisms."

- title: "Bekaert, Harvey, and Lundblad (JFE, 2005) - Does Financial Liberalization Spur Growth?"
  file: "Bekaert_Harvey_Lundblad_JFE_2005.pdf"
  desc: "This note summarizes the paper, which uses a cross-country panel of 1980–1997 data and standard conditional-growth regressions (OLS on nonoverlapping five-year growth windows and GMM with overlapping windows plus country/time effects) to estimate how equity market liberalization—measured by official opening dates, first-sign access (ADR/country-fund/official), and investable-share “liberalization intensity”—predicts subsequent real per-capita GDP growth. It finds liberalization is followed by about a one percentage point increase in annual growth, a result that survives controls for the world business cycle, broader capital-account openness (IMF and Quinn measures), and an external industry-based growth-opportunity control, and it shows the effect is larger where financial development, institutions, and investor protection are stronger—while emphasizing the evidence is robustly predictive but not a clean randomized causal experiment."

- title: "Malmendier and Nagel (QJE, 2011) - Depression Babies: Do Macroeconomic Experiences Affect Risk Taking?"
  file: "Malmendier_Nagel_QJE_2011.pdf"
  desc: "This note summarizes the paper, which uses repeated cross-sections of the U.S. Survey of Consumer Finances (1960–2007) merged with long-run stock and bond return histories to construct for each household a lifetime experienced-return measure (a recency-weighted average with an estimated decay parameter λ), and then estimates ordered-probit/probit/NLS portfolio-choice regressions showing that better experienced stock returns (and bond returns) make households more risk tolerant, more likely to participate in the corresponding asset market, and—conditional on participation—allocate larger liquid-asset shares to that asset; it corroborates a beliefs channel with UBS/Gallup expectations regressions and shows the micro-estimated experience index lines up with aggregate valuation swings, implying that risk taking and asset demand depend persistently on lived macro experiences rather than only on stable preferences and publicly available history."

- title: "Starks, Venkat, and Zhu (JF, 2026) - Corporate ESG Profiles and Investor Horizons"
  file: "Starks_Venkat_Zhu_JF_2026.pdf"
  desc: "This note summarizes the paper, which combines U.S. institutional holdings (active mutual funds and 13F institutions, 2000–2018) with multiple ESG ratings (MSCI, Sustainalytics, Refinitiv) to show that longer-horizon investors (low turnover/churn) hold higher-ESG portfolios and that high-ESG firms have more patient shareholder bases, then distinguishes mechanisms using text evidence from shareholder reports and trading responses: long-term funds are more patient after earnings misses but sell more aggressively after negative environmental/social incidents, consistent with an information-processing channel. It further supports a limits-to-arbitrage explanation by linking higher flow–performance sensitivity to lower ESG tilts and by using the SEC’s 2004 holdings-disclosure frequency increase as an IV-style shock that shortens horizons and reduces ESG exposure, while finding little evidence for simple clientele catering via Morningstar sustainability ratings or climate-news salience tests."

- title: "Duffie and Strulovici (Econometrica, 2012) - Capital Mobility and Asset Pricing"
  file: "Duffie_Strulovici_Econometrica_2012.pdf"
  desc: "This note summarizes the paper, which develops a dynamic two-market equilibrium where otherwise identical assets have different risk premia solely because capital is imbalanced across markets and moves slowly through costly, capacity-constrained intermediaries who search for investors and charge fees equal to a share of switching gains; it shows the state variable is the capital-imbalance ratio Zt =Xt /Yt and proves equilibrium intermediation takes a unique bang-bang trigger form (no search below a threshold T, full search above T), yielding persistent return gaps that mean-revert as capital is gradually reallocated. The model delivers sharp comparative statics—mobility falls with search costs and discounting, rises with cross-market payoff gaps and intermediary bargaining power, and can be reduced by greater competition when it erodes intermediaries’ fee shares—and interprets these dynamics as a foundation for slow-moving-capital effects in settings like reinsurance, index shocks, and credit dislocations."

- title: "Calomiris, Fisman, and Wang (JFE, 2010) - Profiting from Government Stakes in a Command Economy: Evidence from Chinese Asset Sales"
  file: "Calomiris_Fisman_Wang_JFE_2010.pdf"
  desc: "This note summarizes the paper, which uses two surprise Chinese policy announcements—July 24, 2001 (planned sale of state-owned shares) and June 23, 2002 (cancellation)—to run B-share event studies and cross-sectional regressions that isolate the valuation of government connections from simple dilution/supply effects, showing that firms with higher state (and state-related legal-person) ownership suffer more negative abnormal returns when privatization becomes likely and more positive returns when the plan is reversed, while firms with managers who have city-government experience react in the opposite direction (personal ties substitute for ownership ties). It further probes mechanisms with interaction regressions and finds the connection value is strongest in Special Economic Zones—pointing to discretionary local policy as the main channel—while liquidity/turnover and placebo pretrends do not explain the pattern."

- title: "Kasahara and Shimotsu (Econometrica, 2009) - Nonparametric Identification of Finite Mixture Models of Dynamic Discrete Choices"
  file: "Kasahara_Shimotsu_Econometrica_2009.pdf"
  desc: "This note summarizes the paper, which proves nonparametric identification of finite-mixture dynamic discrete choice models in panel data by exploiting time-series structure and covariate support to factor observable probability matrices (after dividing out common transition dynamics) into type-specific choice objects and mixture weights, using rank/eigenvalue and Hadamard-product constructions to identify both the number of latent types and their type-specific conditional choice probabilities (and, in richer Markov/state-dependent settings, type-specific transition kernels via an every-other-period conditioning trick), thereby clarifying when unobserved “types” are genuinely identified without parametric mixture assumptions and when identification fails because of insufficient support, short panels, or weak cross-type heterogeneity."

- title: "Geng and Pan (WP, 2026) - Model-Based Cross-Section Factors in Corporate Bonds"
  file: "Geng_Pan_WP_ModelBasedFactors_2026.pdf"
  desc: "This note summarizes the paper, which builds a structurally grounded three-factor model of corporate bond returns—credit, duration, and liquidity—derives bond-by-bond factor loadings from an arbitrage-free Merton-style default model with Vasicek rates and Poisson liquidity shocks (using a KMV-style inversion from equity values/volatility and Bao–Pan–Wang gamma as the trading-cost proxy), and then extracts monthly and daily factor realizations from cross-sectional regressions of bond excess returns on these model-implied loadings. It finds credit and liquidity earn sizable premia (especially post-GFC), the three factors price 19/20 bond test portfolios and travel to other asset classes, and key applications decompose Treasury returns into pure duration versus a “safety premium” (clarifying flight-to-safety vs dash-for-cash in March 2020) and show strong asymmetry where credit shocks forecast future illiquidity far more reliably than liquidity shocks forecast future credit stress, with post-2017 liquidity volatility tightly linked to dealer balance-sheet capacity."

- title: "Babina, Fedyk, He, and Hodson (JFE, 2024) - Artificial intelligence, firm growth, and product innovation"
  file: "Babina_Fedyk_He_Hodson_JFE_2024.pdf"
  desc: "This note summarizes the paper, which constructs novel firm-level AI adoption measures from employee resumes and job postings (2010–2018), estimates long-difference and dynamic panel specifications linking changes in AI labor share to subsequent growth in sales, employment, and market value (with strong effects concentrated among initially larger firms), and strengthens identification with an IV based on firms’ pre-2010 hiring-network exposure to universities that were historically strong in AI research. It finds AI investment predicts faster firm growth primarily through product innovation—more trademarks, more product patents, and greater product-mix change—rather than through cost cutting or measured productivity gains, and shows industries with faster AI adoption experience both higher growth and higher concentration, consistent with AI amplifying superstar-firm dynamics."

- title: "Heath, Macciocchi, Michaely, and Ringgenberg (RFS, 2022) - Do Index Funds Monitor?"
  file: "Heath_Macciocchi_Michaely_Ringgenberg_RFS_2022.pdf"
  desc: "This note summarizes the paper, which combines fund-level ISS voting records (2004–2018) with a post-2006 Russell banding index-switching DiD to identify passive-ownership shocks, estimates vote-level regressions with firm-by-year fixed effects showing index funds are ~10pp more likely than active funds to side with management on contentious items (especially compensation), finds little evidence of offsetting public/private engagement (near-zero 13D use and lower shareholder-proposal pass rates after passive ownership rises), and then traces the Russell-induced rise in passive ownership to weaker incentives and governance (lower pay-performance sensitivity, higher pay, less board independence) and lower firm value/performance (Tobin’s q, market-to-book, ROA), consistent with index funds being systematically weaker monitors than active mutual funds."

- title: "Barber and Odean (JF, 2000) - Trading Is Hazardous to Your Wealth: The Common Stock Investment Performance of Individual Investors"
  file: "Barber_Odean_JF_2000.pdf"
  desc: "This note summarizes the paper, which uses detailed discount-brokerage records for 66,465 U.S. households (1991–1996) to measure positions, trades, commissions, and execution prices, constructs both gross and net portfolio returns (explicitly subtracting commissions and bid–ask/execution costs) and “own-benchmark” abnormal returns relative to a buy-and-hold of each household’s initial portfolio, and then tests whether active trading is rewarded by sorting households into turnover quintiles and estimating market-adjusted and factor-adjusted alphas. It finds households earn roughly market-like gross returns but underperform net of trading costs; the most active traders do not earn higher gross returns yet suffer sharply lower net performance (top-turnover quintile ≈11.4% net annual return vs. ≈18.5% for the lowest), consistent with overconfidence-driven overtrading rather than informed trading, and the pattern persists in both taxable and tax-deferred accounts."

- title: "Allen, Carletti, and Marquez (RFS, 2011) - Credit Market Competition and Capital Regulation"
  file: "Allen_Carletti_Marquez_RFS_2011.pdf"
  desc: "This note summarizes the paper, which builds a one-period bank-lending model where monitoring is unobservable and incentives can be provided either by a higher loan rate (a transfer) or by more bank capital (a real resource cost), and shows that in competitive credit markets borrowers value capital as a commitment to monitor—creating asset-side market discipline that leads banks to hold positive capital even without regulation. Comparing market outcomes to a constrained regulator who can set only capital (not loan rates), the paper shows competition can induce overcapitalization relative to the social optimum (the regulator prefers loan-rate incentives when projects are sufficiently profitable), while fixed-rate deposit insurance weakens liability-side discipline but generally leaves the asset-side mechanism intact—yielding regions of overcapitalization, constrained efficiency, mild undercapitalization, and cases where the regulator would shut lending down despite private feasibility."

- title: "Pohl, Schmedders, and Wilms (JFE, 2021) - Asset Pricing with Heterogeneous Agents and Long-Run Risk"
  file: "Pohl_Schmedders_Wilms_JFE_2021.pdf"
  desc: "This note summarizes the paper, which extends the Bansal–Yaron long-run risk model to a complete-markets heterogeneous-agent economy with Epstein–Zin preferences where investors disagree only about the persistence of the long-run growth state ρx , solves equilibrium allocations via recursive time-varying Negishi weights (so the endogenous wealth distribution becomes a state variable), decomposes consumption-share dynamics into a speculation term (belief disagreements) and an additional risk-sharing term unique to recursive utility, and shows quantitatively that small belief gaps generate large state-dependent redistribution that endogenously produces excess volatility, a realistic equity premium, and strongly countercyclical/time-varying expected risk premia and recession-strengthened return predictability—effects that cannot be replicated by a representative-agent model with exogenous time-varying persistence because it lacks the redistribution channel."

- title: "Domínguez-Iino (JPE, 2026) - Efficiency and Redistribution in Environmental Policy: An Equilibrium Analysis of Agricultural Supply Chains"
  file: "DominguezIino_JPE_2026.pdf"
  desc: "This note summarizes the paper, which builds and estimates a county-level equilibrium model of South American agricultural supply chains (1995–2017) that combines a nested land-use supply system (commodity switching and deforestation) with oligopsonistic agribusiness demand/markdowns, using Bartik-style destination-demand shifters to identify land substitution elasticities and weather-based instruments to identify final-demand trade elasticities. It shows frontier regions are both more carbon-intensive and less supply-elastic, implying wider oligopsony markdowns and weaker pass-through precisely where environmental damages are largest; consequently, a scalable uniform downstream tax is poorly targeted and regressive, while more targeted upstream or origin-certified downstream policies improve targeting but remain second best—recovering only about one-third of first-best welfare/emissions gains—highlighting the key sufficient statistic: the spatial correlation between market power and emissions intensity."

- title: "Piotroski and Zhang (JFE, 2014) - Politicians and the IPO Decision: The Impact of Impending Political Promotions on IPO Activity in China"
  file: "Piotroski_Zhang_JFE_2014.pdf"
  desc: "This note summarizes the paper, which merges hand-collected provincial party secretary/governor promotion events with China’s NBS industrial-firm panel to construct a risk set of exchange-eligible private firms (2001–2008) and estimate Cox IPO hazard models showing IPO activity spikes in the year before or year of a promotion—especially for non-state firms when turnover is expected to disrupt political connections (Remain/Internal/Tenure interactions) and for SOEs in more market-development-oriented provinces—then links the political-timing shock to lower IPO quality using post-IPO accounting and BHAR regressions, higher controlling-shareholder retention, and more frequent switching of stated IPO proceeds, with demotion-placebo robustness to separate promotions from general provincial strength."

- title: "Belo, Gala, and Li (JFE, 2013) - Government Spending, Political Cycles, and the Cross Section of Stock Returns"
  file: "Belo_Gala_Li_JFE_2013.pdf"
  desc: "This note summarizes the paper, which constructs a tradable firm-level government spending exposure measure from BEA input–output tables (direct + Leontief-inverse indirect exposure), forms annual value-weighted exposure portfolios, and estimates portfolio tests and Fama–MacBeth regressions showing a sharp presidential partisan sign flip: high-exposure firms earn higher relative returns under Democratic presidencies and lower relative returns under Republican presidencies; it then evaluates a party-contingent long–short “presidential investment” strategy with (conditional) factor-model alphas, shows abnormal returns arrive mainly in years 2–3 of presidential terms (suggesting underreaction), and links the return pattern to an expected-cash-flow channel via profitability (ROE) predictability regressions and geography interactions (stronger effects in high federal-spending states) while controlling for standard business-cycle and firm-characteristic confounds."

- title: "Griffin, Kruger, and Mahajan (JF, 2023) - Did FinTech Lenders Facilitate PPP Fraud?"
  file: "Griffin_Kruger_Mahajan_JF_2023.pdf"
  desc: "This note summarizes the paper, which conducts a large-scale forensic analysis of the full PPP loan universe (11.47M loans, $793B) by constructing multiple suspicious-loan flags—business-registry anomalies, multiple loans at the same residential address, abnormally high implied compensation, and EIDL–PPP job inconsistencies—then validating these flags with discontinuities at the $100k compensation cap, rounded-loan bunching, industry×county overrepresentation and lender×county clustering, and external evidence (criminal records, PPP Detective reports, and SAR aggregates). Using rich controls, fixed effects, and matched comparisons, it shows FinTech-originated PPP loans are substantially more likely to be flagged (about 23% vs 7% for traditional lenders), that suspicious lending concentrates in certain high-volume FinTech channels and rises over program rounds, and it quantifies the implied scale of suspicious lending (baseline ≈1.41M loans / $64.2B; conservative confirmed ≈$32.4B), linking the pattern to fee-driven origination incentives with little lender downside risk under government guarantees and weak enforcement."

- title: "Li, Shen & Zhang (RFS, 2024) - Local Effects of Global Capital Flows: A China Shock in the U.S. Housing Market"
  file: "Li_Shen_Zhang_RFS_2024.pdf"
  desc: "This note summarizes the paper, which measures nonresident Chinese housing-capital inflows in California using a conservative three-step imputation algorithm (ethnic name matching → all-cash filter → subtract resident non-Anglo purchases), then estimates a continuous-treatment DID-IV design at the ZIP-code level that instruments local Chinese purchases with historical ethnic-Chinese share interacted with the statewide post-2008 China shock. It finds Chinese inflows raise local house prices, total employment, and establishments—effects concentrated in nontradables via a housing net-worth channel—while also displacing residents (fewer tax filers), with displacement borne mainly by low-income households; event studies, reverse-causality tests, and post-crisis/foreclosure/financial-exposure robustness support the identification."

- title: "Leippold, Wang & Zhou (JFE, 2022) - Machine Learning in the Chinese Stock Market"
  file: "Leippold_Wang_Zhou_JFE_2022.pdf"
  desc: "This note summarizes the paper, which applies the Gu–Kelly–Xiu machine-learning asset-pricing framework to China’s A-share market (2000–2020) by building a high-dimensional predictor set (1,160 covariates: stock characteristics, macro variables, interactions, and industry dummies), comparing linear models, penalized regressions, tree methods, VASA, and deep neural nets in a strict rolling train/validate/test design (out-of-sample 2012–2020), and then translating forecasts into tradable decile portfolios with transaction-cost and daily price-limit adjustments. It finds machine learning substantially boosts predictability—especially for small/retail-heavy/non-SOE stocks at the monthly horizon and for large firms/SOEs at the annual horizon—shows liquidity/trading signals (plus China-specific abnormal turnover and trend measures) dominate variable importance, and demonstrates that the resulting long–short and long-only strategies retain strong Sharpe ratios even after conservative trading-friction assumptions."

- title: "Greenwood (RFS, 2008) - Excess Comovement of Stock Returns: Evidence from Cross-Sectional Variation in Nikkei 225 Weights"
  file: "Greenwood_RFS_2008.pdf"
  desc: "This note summarizes the paper, which uses cross-sectional variation in Nikkei 225 overweighting (a price-weighted index with large, persistent deviations from value weights) to identify demand-driven excess comovement: it estimates rolling 100-day time-series betas of each Nikkei stock on the equal-weighted Nikkei return (and on TOPIX in bivariate regressions), then runs Fama–MacBeth cross-sectional regressions showing that more overweighted constituents comove more with the Nikkei basket and less with nonindex stocks, that this pattern weakens at longer horizons, and that overweighted stocks exhibit stronger next-day reversal after index moves—yielding a high-Sharpe reversal trading strategy—consistent with correlated index-trader demand creating temporary, cross-sectionally predictable mispricing rather than pure common fundamentals."

- title: "Chen, Gupta, and Starmans (JFE, 2026) - Sustainable Investing and Market Governance"
  file: "Chen_Gupta_Starmans_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops a Kyle-style trading-and-contracting model where an informed trader observes both a firm’s financial payoff and its externality and may care about the externality (intensity γ), so sustainable trading dilutes the informativeness of order flow about financial fundamentals; because shareholders use the stock price (order flow) to write incentive contracts, lower price informativeness raises the cost of incentive provision and can lead shareholders to stop inducing efficient managerial effort. The model shows this governance cost arises under both negative screening (refusing to buy good financial news when externalities are bad) and positive screening (buying despite bad financial news when externalities are good), implies no greenium in expected returns under risk-neutral market makers but meaningful effects on volatility and real outcomes, and delivers sharp comparative statics: the ES–governance relation flips sign depending on whether externalities are negative or positive, ES-linked compensation can be optimal purely for information extraction (to decode price signals), and the mechanism strengthens with the prevalence of active informed sustainable investors rather than passive green ownership."

- title: "Garlappi and Song (JFE, 2017) - Capital utilization, market power, and the pricing of investment shocks"
  file: "Garlappi_Song_JFE_2017.pdf"
  desc: "This note summarizes the paper, which builds and calibrates a two-sector production-based asset-pricing model with Epstein–Zin preferences, investment-specific technology (IST) shocks, endogenous capital utilization, and monopolistic competition to explain how utilization and market power jointly determine the price and quantity of IST risk: flexible utilization primarily shifts the price of risk for IST shocks (λz) by changing how investment news maps into current consumption/marginal utility, while market power primarily shifts the market beta to IST shocks (βMz) by adding a monopoly-rent component to firm value that can offset the fall in replacement cost. The model shows IST premia can be positive with either the “classic” (negative λz , negative βMz) or the “new” (positive λz, positive βMz) sign pattern, and in a benchmark monthly calibration with long-run components in TFP/IST, market power, and high EIS it matches a realistic equity premium while decompositions attribute most of the market premium to long-run technology risks and highlight that removing market power flips the premium negative."

- title: "Chen, Fan, Gu, and Zhou (AER, 2020) - Arrival of Young Talent: The Send-Down Movement and Rural Education in China"
  file: "Chen_Fan_Gu_Zhou_AER_2020.pdf"
  desc: "This note summarizes the paper, which digitizes county-level exposure to China’s Cultural Revolution send-down youth (SDY) inflows from 3,000+ local gazetteers and combines it with cohort variation in school-age overlap to implement a cohort difference-in-differences / event-study design using rural-hukou individuals in the 1990 census (treated cohorts born 1956–1969 vs. control cohorts 1946–1955, with county FE, province×cohort FE, and baseline-education trend controls). It finds higher SDY density significantly raises rural educational attainment (≈3.237 years per unit SDY density; ≈0.072 years at mean exposure), especially at the junior-high margin, with larger effects for girls and initially less-educated counties; mechanism regressions using gazetteer teacher data show SDYs increased local teacher supply (particularly non-state-funded and secondary teachers) rather than local education spending, and additional CFPS/census evidence indicates persistent impacts on values (locus of control), later-life outcomes, and second-generation education."

- title: "Goldstein, Spatt, and Ye (RFS, 2021) - Big Data in Finance"
  file: "Goldstein_Spatt_Ye_RFS_2021.pdf"
  desc: "This note summarizes the paper, which serves as the introduction to the RFS special issue on “Big Data in Finance” by proposing a finance-specific taxonomy of big data—large size, high dimension, and complex (unstructured) structure—and using six papers to illustrate how these features change what researchers can measure and predict in corporate finance, market microstructure, and asset pricing. It emphasizes that machine learning is valuable only when the economic problem is genuinely nonlinear/interaction-rich or prediction-focused, highlights how big data can improve causal designs indirectly (e.g., enabling sharper subsamples) and improve measurement directly (e.g., extracting culture or uncertainty from text/clickstreams), and lays out an agenda on feedback effects of machine-based decision makers, richer data types (audio/video/images), and policy issues around regulation, privacy, and fairness."

- title: "List (QJE, 2003) - Does Market Experience Eliminate Market Anomalies?"
  file: "List_QJE_2003.pdf"
  desc: "This note summarizes the paper, which uses field experiments in real collector markets (sportscards and Disney pin trading) to test whether the endowment effect attenuates with market experience by randomly endowing subjects with one of two similar goods and offering a costless swap (benchmark trade rate = 50% absent an endowment effect), then estimating trade-decision logit models on continuous measures of trading experience and validating treatment vs. selection using a one-year follow-up panel with the same subjects plus sample-selection corrections and fixed-effects logits; it also runs a real auction (random nth-price) to compare WTA vs. WTP gaps for dealers versus nondealers. The results show strong aggregate undertrading but sharp convergence with experience (experienced traders trade near 50% and have much smaller WTA–WTP gaps), and within-person evidence indicates that gaining experience increases willingness to trade, implying some “market anomalies” are not fixed primitives but diminish with real market experience."

- title: "Gentzkow and Shapiro (Econometrica, 2010) - What Drives Media Slant? Evidence From U.S. Daily Newspapers"
  file: "Gentzkow_Shapiro_Econometrica_2010.pdf"
  desc: "This note summarizes the paper, which constructs a scalable text-based newspaper slant index by mapping phrase usage in 433 U.S. daily newspapers (2005) to partisan phrase usage by Democrats vs. Republicans in the 2005 Congressional Record, then estimates a structural demand-and-supply model of slant to test whether ideology is driven mainly by reader demand or owner ideology. On the demand side, it uses ZIP-level circulation (ABC GeoCirc) and a zip-ideology proxy from political donations to estimate an ideological “fit” model with market–newspaper fixed effects, addressing measurement error in slant via 2SLS using interactions between zip ideology and a newspaper’s home-market Republicanism; on the supply side, it relates slant to market Republican vote share (with state FE and a church-attendance IV for reverse causality) and decomposes slant variance into consumer vs. owner components. The main findings are that newspapers cater strongly to local consumer ideology, actual slant is close to profit-maximizing (moving 1 SD away would cut variable profits by ~18%), consumer ideology explains ~22% of within-state slant variation while owner ideology explains little (~4% and statistically insignificant once geography is controlled), implying media slant is largely a demand-driven market outcome rather than owner-imposed bias."

- title: "Gurun and Butler (JF, 2012) - Don’t Believe the Hype: Local Media Slant, Local Advertising, and Firm Value"
  file: "Gurun_Butler_JF_2012.pdf"
  desc: "This note summarizes the paper, which uses Factiva news from eight major U.S. local newspapers plus national outlets (WSJ and Dow Jones Newswire) for 2002–2006 to build a text-based local media slant measure (negative-word share from the Loughran–McDonald dictionary) and shows that local papers write systematically less negatively about nearby firms (within 100 miles). It distinguishes three explanations—reader catering, constrained reporting, and advertising pressure—and finds the strongest support for the advertising channel by linking more positive local tone to firms’ local newspaper advertising (TNSMI), using IVs based on industry-year advertising averages, propensity-score matching, and a Craigslist-entry quasi-experiment that increases newspapers’ dependence on corporate ads and strengthens the ad–slant link. Finally, it shows local “hype” is economically meaningful: abnormal local slant predicts subsequent underperformance (a significant long–short alpha) and is associated with higher Tobin’s Q, with effects concentrated in small/opaque/low-liquidity firms where local investors and limits to arbitrage matter most."

- title: "Gabaix and Laibson (QJE, 2006) - Shrouded Attributes, Consumer Myopia, and Information Suppression in Competitive Markets"
  file: "Gabaix_Laibson_QJE_2006.pdf"
  desc: "This note summarizes the paper, which develops a competitive pricing model of a base good plus a potentially shrouded add-on (fees/surcharges/consumables) with two consumer types—myopes who ignore the add-on unless educated and sophisticates who anticipate it and can pay an avoidance cost e—and shows that full-information unraveling fails because of the “curse of debiasing”: a firm that reveals add-on prices makes myopes less profitable and loses the ability to cross-subsidize low base-good prices. In the discrete model, a symmetric shrouded equilibrium exists when the myopic share is large enough (α>e/pˉ, leading to loss-leader base-good pricing and a high add-on price pˉ , with an efficiency loss Λ=(1−α)e from wasteful avoidance; learning extensions weaken but do not eliminate shrouding, and a continuous-demand version replaces the threshold with a debiasing-ratio condition B≥1 comparing cross-subsidies to efficiency gains. The paper closes with concrete empirical diagnostics (surveys, salience experiments, pricing/markup “product audits,” learning patterns) and a policy menu (disclosure, warnings, add-on competition, markup caps) emphasizing that competition alone need not produce transparency."

- title: "Appel, Gormley, and Keim (JFE, 2016) - Passive Investors, Not Passive Owners"
  file: "Appel_Gormley_Keim_JFE_2016.pdf"
  desc: "This note summarizes the paper, which exploits the Russell 1000/2000 cutoff (1998–2006) as an instrument for passive mutual fund ownership—firms just inside the Russell 2000 receive much larger benchmark weights than similarly sized firms just inside the Russell 1000—estimating a 2SLS design with flexible controls for end-of-May market cap and float. The first stage shows Russell 2000 assignment increases passive ownership by about 1.09 pp with no comparable jump in active mutual fund ownership, and the second stage links higher passive ownership to stronger governance (more independent boards, fewer poison pills, more shareholder meeting rights, fewer dual-class shares), voice in voting (less support for management proposals and more support for shareholder governance proposals), and improved longer-run performance (ROA rises once allowing time for governance changes to matter), with little evidence that the effects operate through greater hedge-fund activism—supporting the idea that passive investors are “passive in portfolio choice” but active owners via voting and engagement."

- title: "Fang and Peress (JF, 2009) - Media Coverage and the Cross-section of Stock Returns"
  file: "Fang_Peress_JF_2009.pdf"
  desc: "This note summarizes the paper, which measures firm-level mass-media coverage using circulation-weighted article counts from four major U.S. newspapers (WSJ, NYT, Washington Post, USA Today; 1993–2002) and tests whether “investor recognition” affects expected returns by forming monthly portfolios sorted on lagged coverage (no/low/high) and estimating factor-model alphas for a long–short strategy that buys no-coverage stocks and shorts high-coverage stocks. It finds a sizable “no-media premium” (≈0.39% per month raw; ≈0.23% per month after standard risk and liquidity-factor adjustments) driven mainly by neglected stocks earning positive abnormal returns, with the effect strongest among recognition-poor firms (small, low-analyst, high individual ownership, high idiosyncratic volatility) and broadly robust to microstructure and other anomaly controls—consistent with mass media lowering firms’ cost of capital by broadening awareness while trading frictions help the premium persist."

- title: "Gentzkow (QJE, 2006) - Television and Voter Turnout"
  file: "Gentzkow_QJE_2006.pdf"
  desc: "This note summarizes the paper, which exploits the staggered rollout of television across U.S. counties/DMAs in the 1940s–1950s—shaped by WWII and the 1948–1952 FCC licensing freeze—to estimate a county fixed-effects difference-in-differences/event-time design where “years of TV” accumulates after first access, finding that television reduced congressional turnout (about −0.136 pp per year of TV on average, much larger in off-year elections than presidential years). Mechanism evidence from the 1952 NES shows TV access crowds out information-rich media (lower newspaper/radio campaign information) and reduces political knowledge (especially naming House candidates), with further support from within-demographic-group estimates and a district-fragmentation interaction showing stronger turnout declines where TV coverage of local races is harder."

- title: "Piskorski, Seru, and Witkin (JF, 2015) - Asset Quality Misrepresentation by Financial Intermediaries: Evidence from the RMBS Market"
  file: "Piskorski_Seru_Witkin_JF_2015.pdf"
  desc: "This note summarizes the paper, which uses BlackBox loan tapes matched to Equifax credit-bureau records (2005–2007 originations) to construct a clean asset-quality misrepresentation measure in nonagency RMBS—loans disclosed as having no simultaneous second lien (CLTV≈LTV) that in fact have a piggyback second mortgage within 45 days—then links this hidden leverage to ex post outcomes and security-level losses. It shows misrepresentation is economically large (≈7.13% of “no-second” loans; true CLTV understated by ≈19.6pp), strongly predicts higher default (≈+10.15pp 90-day delinquency within two years), is largely known inside the lending chain (validated with New Century internal files and county deeds, often same lender on both liens), and materially increases RMBS pool and tranche losses and downgrades; yet cross-pool variation in misrepresentation is not priced at issuance (issuance yield spreads and AAA subordination respond to reported CLTV but not hidden-second share), and insurers did not systematically avoid the more misrepresented pools—implying widespread, contractually meaningful misreporting that investors/rating agencies failed to discipline in primary-market pricing."

- title: "Brynjolfsson, Li, and Raymond (QJE, 2025) - Generative AI at Work"
  file: "Brynjolfsson_Li_Raymond_QJE_2025.pdf"
  desc: "This note summarizes the paper, which studies the staggered rollout of a GPT-3–based conversational assistant to 5,172 customer-support agents at a Fortune 500 software company and estimates worker fixed-effects difference-in-differences and Sun–Abraham event-study models showing AI access raises productivity by about 0.301 resolutions per hour (≈15%) mainly by reducing handle time and increasing chats-per-hour, with little average change in resolution rates or customer satisfaction. The gains are highly concentrated among low-skill and low-tenure workers (≈36% for the bottom skill quintile; near zero for top workers), AI compresses the experience curve, and outage-based tests plus adherence heterogeneity indicate learning/knowledge transfer (treated workers remain faster when the tool is unavailable), alongside improvements in English fluency, customer sentiment, and fewer manager-escalation requests."

- title: "Hortacsu and Syverson (QJE, 2004) - Product Differentiation, Search Costs, and Competition in the Mutual Fund Industry: A Case Study of S&P 500 Index Funds"
  file: "Hortacsu_Syverson_QJE_2004.pdf"
  desc: "This note summarizes the paper, which uses the retail S&P 500 index-fund sector (1995–2000)—a near-homogeneous-product market—to show that huge fee dispersion and heavy demand for high-fee funds persist because of investor search frictions and nonportfolio differentiation. It fits an equilibrium search model to observed fund prices (expense + 12b-1 + load annuitization) and asset shares, rejects a simple price-only model using the nonmonotonic price–share relationship, and then recovers the distribution of search costs (and, in extensions, unequal fund visibility driven by age/family size and utility weights on attributes like ETF status and family size) from pricing first-order conditions, finding that median search costs fall for most investors over time but rise in the upper tail—especially among load-fund buyers—helping explain the late-1990s shift of assets toward more expensive funds and delivering welfare counterfactuals (e.g., a Vanguard monopoly benchmark) that quantify the tradeoff between variety and wasted search/scale losses."

- title: "Egan, Matvos, and Seru (JPE, 2019) - The Market for Financial Adviser Misconduct"
  file: "Egan_Matvos_Seru_JPE_2019.pdf"
  desc: "This note summarizes the paper, which builds a near-universe panel of U.S. FINRA-registered financial advisers from BrokerCheck (2005–2015) and defines misconduct conservatively using six “final” disclosure categories, then documents that misconduct is widespread (about 7.28% ever; 0.60% annual flow), persistent/recidivist (prior offenders are ~5× more likely to reoffend), and highly concentrated across firms and local markets. Using adviser-, firm-, and county-level regressions (often with firm×year×county fixed effects), it shows firms punish misconduct strongly (large separation jumps) but the industry only partly does (many offenders are rehired), with offenders sorting to smaller, lower-paying, less prestigious, higher-misconduct firms; “dirty” firms are more tolerant in both firing and hiring, and misconduct is more common at retail/commission firms and in counties with more elderly, fewer college graduates, and higher income—supporting a segmented equilibrium where some firms specialize in exploiting less sophisticated consumers."

- title: "Purnanandam (RFS, 2011) - Originate-to-Distribute Model and the Subprime Mortgage Crisis"
  file: "Purnanandam_RFS_2011.pdf"
  desc: "This note summarizes the paper, which uses bank call reports (2006Q3–2008Q1) merged with HMDA loan-level data to measure each bank’s pre-crisis originate-to-distribute (OTD) intensity (originations for resale scaled by mortgage loans), then implements a bank fixed-effects DiD around the mid-2007 secondary-market freeze showing that high-OTD banks became less able to sell mortgages post-2007 and subsequently experienced larger increases in mortgage NPAs/chargeoffs; it sharpens the mechanism with a “stuck” pipeline measure (pre-crisis OTD originations minus post-crisis sales) that strongly predicts defaults, matched-sample tests that hold borrower observables and even risky-loan rate spreads roughly constant, and soft-information evidence that high-OTD banks have tighter residual loan-spread dispersion (less discriminatory pricing), with heterogeneity showing the effect is strongest for low-capital banks and for banks with lower demand-deposit funding—supporting the interpretation that securitization weakened screening incentives and amplified mortgage losses once liquidity disappeared."

- title: "Meghir and Pistaferri (Econometrica, 2004) - Income Variance Dynamics and Heterogeneity"
  file: "Meghir_Pistaferri_Econometrica_2004.pdf"
  desc: "This note summarizes the paper, which uses PSID male earnings data (1967–1992) to decompose log-earnings residuals into a random-walk permanent component, a short-lived MA(1) transitory component, and measurement error, and then estimates education-specific ARCH(1) models for the conditional variances of both permanent and transitory shocks (with individual fixed heterogeneity in variances) via within-groups GMM moment conditions built from products/sums of residual growth. It finds strong volatility clustering—pooled variance persistence about 0.404 for transitory shocks and 0.56 for permanent shocks—plus sizable time variation and cross-person heterogeneity in risk, implying that earnings uncertainty is state dependent (big shocks predict higher future volatility) and that ARCH dynamics materially change poverty persistence and precautionary motives relative to homoskedastic i.i.d. income processes."

- title: "Geng, Liu, and Pan (WP, 2025) - The Government-Led Credit Cycle in China’s LGFV Bonds and the Real Effects"
  file: "Geng_Liu_Pan_WP_2025.pdf"
  desc: "This note summarizes the paper, which documents a government-led credit cycle in China’s LGFV bonds by tracking the risky-city minus healthy-city spread gap across policy regimes (2014 Directive 43, 2018 asset-management regulation, post-2020 anti-bailout tightening, and the 2023 Debt Resolution package), models LGFV spreads as the sum of expected default loss, liquidity premia, and a bailout-belief multiplier (1−πt) that scales how strongly fundamentals load into spreads, and shows empirically that most of the 2017–2022 spread-gap widening reflects bailout repricing rather than fundamentals/liquidity; it then traces spillovers from post-2023 LGFV spread compression to lower local-bank subordinated-bond and municipal-bond spreads, while finding adverse bank real effects in riskier cities—lower profitability and market share, higher consolidation probability, and a shift from lending toward financial investments—using continuous-treatment DiD/event studies and within-city heterogeneity by banks’ LGFV exposure."

- title: "Hong and Kubik (JF, 2003) - Analyzing the Analysts: Career Concerns and Biased Earnings Forecasts"
  file: "Hong_Kubik_JF_2003.pdf"
  desc: "This note summarizes the paper, which uses I/B/E/S analyst earnings forecasts (1983–2000) and a brokerage-house prestige hierarchy (Institutional Investor “Leaders,” size, and Carter–Manaster ranks) to infer career incentives from analysts’ job moves, constructing rolling three-year measures of relative forecast accuracy (within-firm rank scores) and relative optimism (indicator for being above the consensus forecast) and estimating probit models for moving up or down the hierarchy with rich controls (experience, portfolio size/coverage, house and year effects). It finds accurate analysts are rewarded, but—conditional on accuracy—more optimistic analysts are also more likely to move up and less likely to move down, with the optimism reward strongest and the accuracy reward weakest when conflicts of interest are salient (coverage of house-underwritten stocks, the late-1990s boom) and with corroborating internal-labor-market evidence that poorly performing analysts are removed from high-profile stocks."

- title: "Budish, Cramton, and Shim (QJE, 2015) - The High-Frequency Trading Arms Race: Frequent Batch Auctions as a Market Design Response"
  file: "Budish_Cramton_Shim_QJE_2015.pdf"
  desc: "This note summarizes the paper, which argues that the high-frequency trading “arms race” is fundamentally a market-design problem of continuous limit order books with serial processing: even symmetrically observed public information mechanically creates stale-quote sniping rents, inducing wasteful investment in speed; it documents the problem with direct-feed millisecond data on the ES–SPY pair showing correlations collapse at very short horizons and generate frequent, short-lived but persistently profitable mechanical arbitrage opportunities (a lower-bound prize ≈$75M/year), builds a stylized CLOB model where the equilibrium spread and thin depth arise purely from sniping risk (no asymmetric info or inventory costs) and where total spread payments equal total speed expenditures under endogenous entry, and proposes frequent batch auctions (e.g., 100ms) that batch orders and clear them in uniform-price auctions to dilute tiny latency advantages (by δ/τ), eliminate sniping rents in the benchmark, deepen liquidity, and potentially halt the speed race by shifting competition from microseconds to price."

- title: "Hendershott, Jones, and Menkveld (JF, 2011) - Does Algorithmic Trading Improve Liquidity?"
  file: "Hendershott_Jones_Menkveld_JF_2011.pdf"
  desc: "This note summarizes the paper, which studies NYSE stocks around the staggered 2003 rollout of autoquote (automated inside-quote updates) and uses that market-design change as an instrument for algorithmic trading intensity (proxied by electronic message traffic per dollar volume), estimating stock and day fixed-effects IV regressions showing that more algorithmic trading narrows quoted and effective spreads for large and mid-cap stocks, with the spread improvement driven primarily by lower adverse selection (price impact) rather than lower liquidity-provider revenues (realized spreads rise temporarily), and that algorithmic trading shifts price discovery away from trades and toward quotes in a Hasbrouck VAR decomposition while also reducing trade size and specialist participation—highlighting that faster quote updating reduces stale-quote losses and improves liquidity in normal conditions."

- title: "Pierce and Schott (AER, 2016) - The Surprisingly Swift Decline of US Manufacturing Employment"
  file: "Pierce_Schott_AER_2016.pdf"
  desc: "This note summarizes the paper, which exploits cross-industry variation in the historical NTR gap (non-NTR tariff minus NTR tariff) as treatment intensity in a generalized DiD/event-study design around China’s 2001 PNTR, showing that industries with larger gaps experience much larger post-2000 U.S. manufacturing employment declines despite little change in applied tariffs; it links the mechanism to the resolution of trade-policy uncertainty (sunk-cost offshoring/sourcing/entry decisions) using trade-transaction evidence on higher imports from China, more U.S. importers and Chinese exporters, and more related-party trade, and documents real-side adjustment via greater skill/capital intensity and plant exit that propagates through downstream input–output linkages, with robustness checks (China-side reforms, MFA quotas, business-cycle controls) and a U.S.–EU triple-difference showing the pattern is specific to the U.S. policy change."

- title: "Fang, Hardy, and Lewis (RFS, 2025) - Who Holds Sovereign Debt and Why It Matters"
  file: "Fang_Hardy_Lewis_RFS.pdf"
  desc: "This note summarizes the paper, which builds a new 101-country sovereign-debt-holdings panel (1990–2018) that decomposes debt by domestic vs foreign and by banks vs nonbanks vs official creditors, estimates “marginal holder” regressions showing private nonbanks absorb a disproportionate share of debt expansions, and then structurally estimates investor demand elasticities for EM sovereign debt using an issuer-side market-clearing IV (predicted supply/holdings from observables) to show foreign nonbanks are the most price-elastic creditors; it combines these elasticities with holding shares to quantify borrowing-cost sensitivity and counterfactuals (e.g., without nonbanks, EM yields rise much more for a given debt increase), highlighting that sovereign funding risk depends critically on who holds the debt as well as how elastic those holders are."

- title: "Antràs and Chor (Econometrica, 2013) - Organizing the Global Value Chain"
  file: "Antras_Chor_Econometrica_2013.pdf"
  desc: "This note summarizes the paper, which develops a Grossman–Hart property-rights model of a sequential global value chain where a final-good firm chooses stage-by-stage integration vs outsourcing under incomplete contracts, shows the optimal ownership pattern depends on an input’s downstreamness and on whether stages are sequential complements (using U.S. related-party import shares (2000–2010) matched to IO-table-based downstreamness measures and buyer-industry demand-elasticity proxies (Broda–Weinstein), estimating interaction regressions that deliver the predicted sign reversal—more downstream inputs are more likely to be intrafirm in high-elasticity industries but less so (or weakly so) in low-elasticity industries—with robustness to buyer-side factor-intensity controls, weighting to address small-flow measurement error, and a Heckman correction for selection into importing."

- title: "Huberman and Regev (JF, 2001) - Contagious Speculation and a Cure for Cancer: A Nonevent that Made Stock Prices Soar"
  file: "Huberman_Regev_JF_2001.pdf"
  desc: "This note summarizes the paper, which uses the EntreMed “cure for cancer” episode as a forensic event study to show that media salience can move prices even without new information: the same scientific result was public in late November 1997 (moderate price response), but a highly prominent New York Times front-page “special report” on May 3, 1998 triggered a massive and partly permanent repricing of ENMD (about +330% from May 1 close to May 4 close) and contagious gains across other biotech stocks and even Bristol-Myers Squibb, despite little evidence of firm-specific news—highlighting attention-driven speculation rather than information arrival as the key driver."

- title: "Oehmke and Zawadowski (RFS, 2017) - The Anatomy of the CDS Market"
  file: "Oehmke_Zawadowski_RFS_2017.pdf"
  desc: "This note summarizes the paper, which uses DTCC single-name CDS net notional positions and trading volume matched to Compustat, TRACE, FISD, Markit, and IBES to test whether CDS activity reflects hedging, speculation, standardization/liquidity advantages, or arbitrage; it estimates censored position regressions and joint Tobit volume regressions showing net CDS rises with insurable interest (outstanding bonds), disagreement predicts CDS trading far more than bond trading, and CDS activity is higher when the underlying bond market is fragmented and contractually heterogeneous (and those bonds are demonstrably more illiquid), while a more negative CDS–bond basis is associated with larger CDS positions consistent with basis-trade arbitrage that compresses the negative basis and reduces bond-market price impact—supporting the view that CDS markets function as a standardized, liquid venue for trading credit risk atop a fragmented OTC bond market."

- title: "Calvet, Campbell, and Sodini (JPE, 2007) - Down or Out: Assessing the Welfare Costs of Household Investment Mistakes"
  file: "Calvet_Campbell_Sodini_JPE_2007.pdf"
  desc: "This note summarizes the paper, which uses Swedish population-wide administrative portfolio data (1999–2002) to construct three household “mistake” measures—underdiversification (Sharpe-ratio loss vs an unhedged world benchmark), risky-share inertia (absolute change in log risky share), and the disposition effect (PGR−PLR based on relative performance)—and then estimates a restricted common-factor system showing that the negatives of these mistakes load on a single latent financial sophistication index (a linear combination of household characteristics). The index rises strongly with log financial wealth, household size, and education and is lower for self-employed and immigrant households; it also offers portable proxies (e.g., fund share in the risky portfolio) for less detailed datasets."

- title: "Foucault, Hombert, and Roşu (JF, 2016) - News Trading and Speed"
  file: "Foucault_Hombert_Rosu_JF_2016.pdf"
  desc: "This note summarizes the paper, which develops a continuous-time Kyle-style model where an informed speculator’s private signals forecast both long-run value and imminent public news, and shows that news trading arises only with speed—when the speculator can trade before the dealer updates quotes to incoming news—so the optimal order has a slow-moving value-trading component plus a distinct high-frequency news-trading component; it derives “footprints” of fast news trading (high participation at very short sampling intervals, low trade autocorrelation, and positive short-horizon trade–return predictability), proves that speed worsens liquidity (higher price impact) but leaves overall price-discovery speed unchanged because trades become more informative about short-run innovations but less informative about long-run mispricing, and delivers comparative statics in news informativeness and dealer latency showing why fast traders can look ultra-short-term in order flow while still earning most profits from longer-horizon value trading."

- title: "Chang, Hong, and Liskovich (RFS, 2015) - Regression Discontinuity and the Price Effects of Stock Market Indexing"
  file: "Chang_Hong_Liskovich_RFS_2015.pdf"
  desc: "This note summarizes the paper, which uses the annual Russell 1000/2000 reconstitution (1996–2012) to implement a fuzzy regression discontinuity around the upper Russell 2000 cutoff (end-of-May market-cap rank) where otherwise similar firms face a sharp discontinuity in index weights and benchmarked demand, estimates first-stage membership jumps and 2SLS RD effects showing ~+5% June returns for additions and ~−5.4% for deletions with little pretrend or reversal, translates the discontinuous benchmarked demand shock into an implied downward-sloping stock-demand elasticity, documents time trends where price impact falls as liquidity/arbitrage capacity rises despite growing indexing, and identifies likely liquidity providers as other mutual funds (larger-cap, growth-oriented holdings) rather than only hedge-fund arbitrageurs."

- title: "DellaVigna and Pollet (JF, 2009) - Investor Inattention and Friday Earnings Announcements"
  file: "DellaVigna_Pollet_JF_2009.pdf"
  desc: "This note summarizes the paper, which exploits Friday earnings announcements as an attention shock, uses I/B/E/S–Compustat announcement dates (validated against PR newswires) matched to CRSP returns and volume (1995–2006), estimates event-study and return-on-surprise regressions showing Friday announcements have a weaker immediate price response but a stronger delayed drift (higher delayed-response ratio) with similar long-run incorporation, corroborates the inattention mechanism with lower abnormal trading volume on Friday and a long–short “Friday drift minus non-Friday drift” strategy, and develops a simple equilibrium model with a fraction of distracted investors (and managerial timing incentives) to map these patterns to attention-driven underreaction as an explanation for PEAD."

- title: "Merton (JF, 1987) - A Simple Model of Capital Market Equilibrium with Incomplete Information"
  file: "Merton_JF_1987.pdf"
  desc: "This note summarizes the paper, which modifies a one-factor CAPM by assuming incomplete investor recognition—each investor knows (and can hold) only a subset of securities—derives equilibrium expected returns and firm values with an additional security-specific shadow cost of limited recognition λk that acts like an extra required return/discount rate, yielding a modified security market line and nonzero CAPM “alpha” αk =λk −βk λM (so less-followed firms with smaller investor bases earn higher expected returns and lower prices), and endogenizes firm behavior by showing managers have incentives to spend on visibility (listings, publicity, ratings) to expand the investor base and reduce the cost of capital."

- title: "Chen, Cui, He, and Milbradt (RFS, 2018) - Quantifying Liquidity and Default Risks of Corporate Bonds over the Business Cycle"
  file: "Chen_Cui_He_Milbradt_RFS_2018.pdf"
  desc: "This note summarizes the paper, which builds and calibrates a structural corporate-bond model with business-cycle states, endogenous default with debt rollover, and an OTC secondary market where investors face idiosyncratic liquidity shocks and bond-price-dependent holding costs, generating a default–liquidity spiral; it matches default rates, credit spreads, bid-ask spreads, bond–CDS spreads, and leverage distributions across ratings and decomposes credit spreads into pure default, pure liquidity, and two interaction terms (liquidity→default and default→liquidity), finding interactions explain a meaningful share of both spread levels and cyclical variation and that liquidity policy in recessions can reduce spreads largely through these feedback channels, with large aggregate issuance-value implications."

- title: "Gupta and Hansman (RFS, 2022) - Selection, Leverage, and Default in the Mortgage Market"
  file: "Gupta_Hansman_RFS_2022.pdf"
  desc: "This note summarizes the paper, which uses a large panel of 2004–2007 U.S. option ARMs (Moody’s/Blackbox) and the crisis-era LIBOR–Treasury divergence as an exogenous shock to borrowers’ realized balances (and thus current LTV) that was not salient at origination, instruments current LTV with a leave-one-out index-type×origination-month mean LTV, and estimates default regressions that include both origination CLTV (selection) and instrumented current LTV (moral hazard), finding roughly a 60/40 split between adverse selection and causal leverage effects and strong nonlinearity around the negative-equity threshold; it then embeds these estimates in a stylized contract-choice model to show that LTV caps reduce defaults less (and at higher equilibrium rates) than a naive regulator would predict because leverage also serves as a screening device."

- title: "Peng and Xiong (JFE, 2006) - Investor Attention, Overconfidence and Category Learning"
  file: "Peng_Xiong_JFE_2006.pdf"
  desc: "This note summarizes the paper, which builds a dynamic equilibrium model with market/sector/firm fundamentals and a representative investor who allocates a scarce attention budget across these layers, yielding endogenous category learning (more attention to market and sector factors than to firm-specific factors) and, when combined with overconfidence about the precision of self-processed signals, generates excess return comovement, a negative relation between synchronicity and price informativeness, time-series declines in average correlations as information technology improves, and cross-sectional predictability patterns (stronger overreaction-based reversals where more firm-specific learning occurs and stronger return predictability from ignored signals where category learning is most severe)."

- title: "D’Acunto and Rossi (RFS, 2022) - Regressive Mortgage Credit Redistribution in the Post-Crisis Era"
  file: "DAcunto_Rossi_RFS_2022.pdf"
  desc: "This note summarizes the paper, which uses HMDA mortgage applications (2007–2017) and rejected-loan information to estimate approval-rate “difference-in-slopes” regressions and distributional (quantile) shifts showing that after 2010 mortgage credit tilts away from small/midsize loans toward larger loans—especially among top-five lenders—beyond what can be explained by local demand conditions or conforming-limit bunching; it strengthens the supply-side interpretation with an IV that instruments post-2010 county exposure to large lenders using the county’s 2007 top-lender share, and concludes that higher post-crisis fixed/per-loan origination costs (regulation/compliance) likely made small loans less attractive, producing a regressive redistribution of mortgage credit."

- title: "Carletti, Leonello, and Marquez (JFE, 2023) - Loan Guarantees, Bank Underwriting Policies and Financial Stability"
  file: "Carletti_Leonello_Marquez_JFE_2023.pdf"
  desc: "This note summarizes the paper, which develops a three-date bank-run model with endogenous underwriting/monitoring effort q, inside capital k, and demandable deposits to study how different public loan-guarantee designs affect run risk, underwriting incentives, and inefficient liquidation/evergreening, deriving run thresholds for well-capitalized versus weak banks and showing that first-loss guarantees with full bankruptcy costs typically lower run risk and raise monitoring by increasing the bank’s survival/charter value, while bankruptcy-protected guarantees can reduce monitoring for very weakly capitalized banks by muting depositor discipline too much; it contrasts these effects with deposit insurance, which never improves monitoring (and can worsen it for weak banks), and highlights a core policy trade-off that guarantees can stabilize credit ex ante but expand evergreening ex post depending on capital and legal design."

- title: "Campbell and Cocco (JF, 2015) - A Model of Mortgage Default"
  file: "Campbell_Cocco_JF_2015.pdf"
  desc: "This note summarizes the paper, which builds a quantitative life-cycle model in which households choose whether to keep paying, default, prepay/cash out, or (for FRMs) refinance under stochastic labor income, house prices, inflation, and real interest rates, and where competitive lenders endogenously set ARM and FRM premia via risk-adjusted zero-profit conditions; it emphasizes a dual-trigger default mechanism (negative equity and liquidity/payment-to-income stress), shows ARMs and FRMs tend to default in different aggregate states because ARMs transmit interest-rate resets while FRMs trap underwater borrowers when rates fall and refinancing is blocked, and uses calibrated simulations and crisis-path counterfactuals to match key U.S. patterns in LTV/LTI/MTI dynamics, default waves, refinancing/cash-out behavior, and mortgage premia while delivering welfare comparisons across contracts."

- title: "Goel and Thakor (JFE, 2015) - Information Reliability and Welfare: A Theory of Coarse Credit Ratings"
  file: "Goel_Thakor_JFE_2015.pdf"
  desc: "This note summarizes the paper, which models credit ratings as a cheap-talk game where project quality is continuous but the CRA’s objective mixes the social value of information precision (better investment) with an issuer-catering wealth-transfer motive that prefers inflated perceived quality, proves that truthful continuous ratings are impossible and that any equilibrium must be coarse—a finite partition of the quality space into rating buckets separated by a minimum gap—derives comparative statics showing ratings become finer when the CRA is more investor-oriented (higher weight on social value) and coarser when the private gains from inflation are larger, extends to two-CRA competition where each CRA’s individual rating can become even coarser even as total information and welfare can rise when investors combine both ratings, and draws regulatory implications emphasizing reducing issuer-catering/rating-shopping incentives rather than mechanically tying regulatory benefits to rating labels."

- title: "Rajan, Seru, and Vig (JFE, 2015) - The Failure of Models that Predict Failure: Distance, Incentives, and Defaults"
  file: "Rajan_Seru_Vig_JFE_2015.pdf"
  desc: "This note summarizes the paper, which uses LoanPerformance securitized subprime mortgages (1997–2006) plus market-wide securitization rates and an internal New Century lender file to test a Lucas-critique mechanism in credit risk: as securitization intensifies, lenders rely more on reportable hard information (FICO/LTV) and less on unreported soft information, documented by year-by-year interest-rate regressions with sharply rising R^2, within-FICO shrinkage in rate dispersion, and the declining pricing/acceptance role of NCFC’s internal rating; it then shows that interest rates become a worse predictor of default and that a historical default model estimated in the low-securitization era systematically underpredicts defaults in the high-securitization era—especially for low-doc, low-FICO/high-LTV, and more easily securitized loans (nonjudicial states, just above the 620 threshold)—with placebo and house-price-augmented robustness confirming a regime-change failure rather than generic misspecification."

- title: "Manso (JFE, 2013) - Feedback Effects of Credit Ratings"
  file: "Manso_JFE_2013.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time model where credit ratings are defined to be accurate (match target default probabilities over horizon T) but also feed back into fundamentals through ratings-based performance-sensitive debt (downgrades raise coupons, which induce earlier equity default), characterizes Markov equilibria as fixed points between the firm’s optimal default threshold and the rating agency’s accuracy-based rating thresholds, shows strategic complementarity can generate multiple self-consistent “soft” and “tough” accurate equilibria with large welfare differences (bankruptcy costs), and derives policy and competition implications—small issuer-paid survival fees can select the good (soft) equilibrium while stress tests or minimum-rating contracts can select the bad (tough) equilibrium and create credit-cliff dynamics—illustrated with numerical examples where mean reversion yields large gaps in expected bankruptcy losses."

- title: "Piskorski, Seru, and Vig (JFE, 2010) - Securitization and Distressed Loan Renegotiation: Evidence from the Subprime Mortgage Crisis"
  file: "Piskorski_Seru_Vig_JFE_2010.pdf"
  desc: "This note summarizes the paper, which uses LPS loan-level servicing data for first-lien non-agency mortgages originated in 2005–2006 and tracks outcomes through 2008Q1 to compare workout versus foreclosure decisions for loans that become seriously delinquent, estimating logit and hazard models (with rich borrower/contract controls, MSA fixed effects, updated FICO/LTV-at-delinquency controls, and transfer-attrition corrections) showing that delinquent bank-held loans are foreclosed substantially less and cured more than comparable securitized loans—especially for medium/high-quality borrowers—and then provides causal evidence from a quasi-experiment around 90-day repurchase/early-payment-default clauses where delinquent loans repurchased back onto originators’ balance sheets are foreclosed about 6.5 percentage points less often than otherwise similar loans remaining securitized, implying securitization governance frictions amplified foreclosures during the subprime crisis."

- title: "Benson, Li, and Shue (AER, 2026) - “Potential” and the Gender Promotion Gap"
  file: "Benson_Li_Shue_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses worker-month personnel data from a large North American retail chain (2011–2015) with “Nine Box” evaluations that separately rate current performance and future potential, estimates promotion regressions showing women are promoted less despite higher performance because they receive lower potential ratings (which explain about half the promotion gap), tests whether the potential gap is justified by regressing future performance and future potential on current ratings and gender and finds women outperform men conditional on the same ratings while managers still do not update women’s potential upward, and investigates mechanisms via leave-of-absence controls, strategic retention/risk-of-loss evidence, local gender-norm heterogeneity, and a Becker-style outcomes test using an IV for marginal promotion opportunities—concluding that biased assessments of “potential,” not inferior performance, are a central driver of the gender promotion gap."

- title: "Loutskina and Strahan (JF, 2009) - Securitization and the Declining Impact of Bank Finance on Loan Supply: Evidence from Mortgage Originations"
  file: "Loutskina_Strahan_JF_2009.pdf"
  desc: "This note summarizes the paper, which uses HMDA mortgage applications (1992–2004) matched to bank Call Reports and the GSE jumbo cutoff as an institutional liquidity discontinuity to compare banks’ origination and approval behavior for liquid conforming (nonjumbo) loans versus illiquid jumbo loans, estimating within-bank-year difference regressions (nonjumbo minus jumbo) that relate relative lending to bank balance-sheet liquidity and deposit funding costs, validating the supply channel with acceptance-rate specifications and a homogeneous near-cutoff probit based on loans that switch classification when the cutoff rises, and documenting a complementary sorting channel where financially stronger banks attract more jumbo applications—concluding that securitization/secondary-market liquidity weakens the traditional bank lending channel by making bank funding constraints matter far less for liquid conforming credit."

- title: "Buchak, Matvos, Piskorski, and Seru (JFE, 2018) - Fintech, Regulatory Arbitrage, and the Rise of Shadow Banks"
  file: "Buchak_Matvos_Piskorski_Seru_JFE_2018.pdf"
  desc: "This note summarizes the paper, which combines HMDA (2007–2015), GSE conforming-loan data, FHA servicing data, and bank regulatory exposure measures to document the post-crisis rise of nonbank “shadow” mortgage originators and online fintech lenders, estimates within-market loan-level regressions and county-level exposure regressions (with event-study timing around the OTS closure and MSR rule changes) showing shadow banks expand most where local banks are hit harder by post-crisis regulation (capital rebuilding, MSR treatment, lawsuits, and supervision), and contrasts fintech versus other shadow banks to isolate technology by showing fintech specializes in refinancing, sells loans faster, prices less on standard hard information, and charges a positive rate premium consistent with convenience, then uses a calibrated lender-choice model to decompose growth—attributing most overall shadow-bank expansion to regulation but most fintech growth to technology."

- title: "Greenwood and Sammon (JF, 2025) - The Disappearing Index Effect"
  file: "Greenwood_Sammon_JF_2025.pdf"
  desc: "This note summarizes the paper, which studies S&P 500 additions and deletions (1980–2020) to explain why the classic index-inclusion abnormal return has nearly vanished despite much larger passive tracking demand, measures mechanical demand shocks using holdings-based “tracker” net trading (Thomson S12) and decomposes events into direct changes versus MidCap↔S&P 500 migrations that create offsetting passive flows, estimates event-study CARs and composition-controlled regressions plus decade-specific price-impact multipliers in the relation Price Impact=M×D (with longer-window robustness for front-running), and concludes that composition and predictability explain only part of the decline while the dominant change is a collapse in the implied multiplier (a dramatic rise in effective demand elasticity) consistent with much deeper liquidity and organized institutional absorption of index rebalancing order flow."

- title: "Hong, Kubik, and Stein (JF, 2004) - Social Interaction and Stock-Market Participation"
  file: "Hong_Kubik_Stein_JF_2004.pdf"
  desc: "This note summarizes the paper, which uses the 1992 Health and Retirement Study to measure household stock-market participation outside retirement accounts and three direct sociability proxies (knowing neighbors, visiting neighbors, attending church), estimates household-level linear-probability (and probit/logit) participation regressions with very rich wealth/demographic/personality controls, and identifies a peer-effects “social fixed-cost” channel using state-level social-multiplier interactions showing sociability predicts participation much more strongly in high-participation states while risk tolerance does not (plus a checking-account placebo that fails), concluding that social interaction lowers effective participation costs and can amplify participation booms via local diffusion."

- title: "Da, Engelberg, and Gao (JF, 2011) - In Search of Attention"
  file: "Da_Engelberg_Gao_JF_2011.pdf"
  desc: "This note summarizes the paper, which uses weekly Google Trends ticker searches to construct abnormal search volume (ASVI) as a direct revealed-attention measure, validates it with timing VARs and Dash-5 retail order-flow regressions (showing search spikes predict higher retail orders/turnover, especially in less sophisticated retail venues), and then estimates Fama–MacBeth return regressions for Russell 3000 stocks and IPO return regressions to show that ASVI predicts short-run positive price pressure followed by long-run reversal (stronger in small and retail-heavy stocks) and that high pre-IPO ASVI predicts greater first-day underpricing and attention-driven long-run underperformance when combined with high first-day returns."

- title: "Hong and Stein (JF, 1999) - A Unified Theory of Underreaction, Momentum Trading, and Overreaction in Asset Markets"
  file: "Hong_Stein_JF_1999.pdf"
  desc: "This note summarizes the paper, which builds a behavioral asset-pricing model with slowly diffusing private news among “newswatchers” (who do not infer information from prices) and overlapping-generation momentum traders (who forecast using recent price changes), derives equilibrium prices that underreact to new information and then overshoot because trend followers cannot distinguish fresh-news price moves from momentum-induced moves, and shows that this single mechanism generates both short-horizon momentum and long-horizon reversal with testable comparative statics in the information-diffusion horizon z, momentum holding horizon j, and arbitrage risk tolerance (including extensions with contrarians and finite-risk-tolerance smart money)."

- title: "Plantin and Tirole (AER, 2018) - Marking to Market versus Taking to Market"
  file: "Plantin_Tirole_AER_2018.pdf"
  desc: "This note summarizes the paper, which builds a three-date agency model where insiders are incentivized using either a free-but-noisy public market signal (marking to market) or a costly-but-precise realized resale price (taking to market), shows the privately optimal contract can be implemented by an accounting rule with an endogenous degree of conservatism (how much unrealized gains are recognized), and then endogenizes bids and secondary-market liquidity to generate (under secret contracts) multiple equilibria—an efficient liquid equilibrium and an inefficient illiquid equilibrium where firms rely too much on mediocre market data and sell too rarely—so modestly more conservative regulation can eliminate the bad equilibrium; with endogenous liquidity, laissez-faire is generically inefficient because firms do not internalize the thick-market externality that their own sales improve others’ price informativeness, implying welfare can be improved by liquidity support and/or more conservative accounting than firms privately choose."

- title: "Cookson, Lu, Mullins, and Niessner (JFE, 2024) - The Social Signal"
  file: "Cookson_Lu_Mullins_Niessner_JFE_2024.pdf"
  desc: "This note summarizes the paper, which builds a 2012–2021 firm-day panel for the 1,500 most-discussed StockTwits firms and measures cross-platform attention (message-share) and sentiment (directional tone) on StockTwits, Twitter, and Seeking Alpha, uses unconditional and news/firm/lagged-return residualized PCA to show attention is highly common across platforms while sentiment is fragmented (also within StockTwits across user types), estimates return and retail-trading predictability regressions showing common sentiment predicts positive next-day abnormal returns with no reversal while common attention predicts negative next-day returns after strong same-day retail buying and partial reversal, and sharpens interpretation with event studies around the 2019 StockTwits character-limit increase (sentiment becomes more informative, especially for long messages) and the 2021 GameStop/new-user influx (sentiment informativeness collapses, driven by new users)."

- title: "Qian, Strahan, and Yang (JF, 2015) - The Impact of Incentives and Communication Costs on Information Production and Use: Evidence from Bank Lending"
  file: "Qian_Strahan_Yang_JF_2015.pdf"
  desc: "This note summarizes the paper, which uses proprietary loan-level data from a large Chinese state-owned bank (2000–2006) to study how an exogenous 2002–2003 organizational reform that shifted credit-rating responsibility from committees to identifiable loan officers affects information production and use, estimating difference-in-differences pricing and repayment regressions that interact internal ratings with the post-reform indicator (and coastal-province intensity), and then testing a communication-cost channel in the post-reform subsample by interacting ratings with officer–branch-president time worked together (overlap), showing that after the reform ratings become more conservative and more aligned with hard information, are priced more strongly into interest rates, and predict repayment much better—especially when overlap is longer—implying incentives and internal communication jointly determine soft-information quality and credit allocation."

- title: "Hirshleifer, Lim, and Teoh (JF, 2009) - Driven to Distraction: Extraneous Events and Underreaction to Earnings News"
  file: "Hirshleifer_Lim_Teoh_JF_2009.pdf"
  desc: "This note summarizes the paper, which measures investor distraction using the within-quarter decile rank of the number of other firms’ same-day earnings announcements (1995–2004), estimates 10×10 double sorts and multivariate regressions that interact earnings-surprise deciles with announcement-day crowding to show weaker announcement-window reactions (CAR[0,1]) but stronger post-earnings-announcement drift (CAR[2,61]) and lower abnormal announcement trading volume on high-news days, validates the design with pretrend/leakage checks, seasonality placebos based on prior-year crowding, and same-firm high- vs low-news comparisons, and translates the effect into economic magnitude via a PEAD trading strategy that earns much higher alpha following crowded-day announcements—especially when competing news is unrelated or has large surprises."

- title: "Vives (RFS, 2014) - Strategic Complementarity, Fragility, and Regulation"
  file: "Vives_RFS_2014.pdf"
  desc: "This note summarizes the paper, which develops a global-games crisis framework in which a continuum of investors decide whether to run based on noisy private signals and a public prior, shows that strategic complementarity (captured by the slope of a “resistance function” h(θ)) is the sufficient driver of fragility and multiplicity, applies the model to a wholesale-funded bank balance sheet with short-term leverage, liquid reserves, and fire-sale penalties to distinguish insolvency (θ<θ_) from run-induced illiquidity (θ_≤θ<θ), derives comparative statics showing crisis risk rises with leverage, funding pressure, fire-sale losses, and sometimes more precise public information when fundamentals are weak, and solves a regulator’s problem that delivers non-substitutable solvency and liquidity requirements (the optimal mix tightens solvency when funding competition increases, and tightens liquidity when fire-sale penalties or disclosure/coordination forces rise), interpreting the SIV/ABCP run and ABX collapse as an application."

- title: "Barber & Odean (RFS, 2008) - All That Glitters: The Effect of Attention and News on the Buying Behavior of Individual and Institutional Investors"
  file: "Barber_Odean_RFS_2008.pdf"
  desc: "This note summarizes the paper, which uses three large U.S. retail brokerage trade datasets and an institutional money-manager dataset to test whether attention affects buying more than selling by sorting stock-days on three attention proxies (same-day abnormal volume, previous-day extreme returns, and same-day Dow Jones news), computing daily buy–sell imbalances (by number and by value) within each partition, and running size and announcement-window robustness plus “already-owned stocks” tests to address short-sale constraints, finding that individual investors are strong net buyers of attention-grabbing stocks (including both big winners and big losers) while institutions trade in strategy-specific patterns—supporting an attention-driven choice-set mechanism for retail demand."

- title: "Bernstein, Giroud, and Townsend (JF, 2016) - The Impact of Venture Capital Monitoring"
  file: "Bernstein_Giroud_Townsend_JF_2016.pdf"
  desc: "This note summarizes the paper, which uses the introduction of new airline routes that reduce travel time between a VC and an already-funded portfolio company as a monitoring-cost shock, estimates VC–company–year difference-in-differences/event-study regressions with VC–company pair fixed effects and very demanding VC- and company-location MSA×year fixed effects, and finds that cheaper travel increases innovation (more patents and citations per patent) and exit success (higher IPO and IPO-or-large-acquisition probabilities) with effects emerging after a 1–2 year lag and concentrated in routes connecting the company to its lead VC, supported by survey evidence and treatment-intensity/robustness analyses."

- title: "Mankiw and Reis (QJE, 2002) - Sticky Information versus Sticky Prices: A Proposal to Replace the New Keynesian Phillips Curve"
  file: "Mankiw_Reis_QJE_2002.pdf"
  desc: "This note summarizes the paper, which replaces Calvo sticky prices with sticky information by assuming firms can change prices every period but only a fraction λ update their information and reoptimize, derives a sticky-information Phillips curve in which inflation depends on current slack and lagged expectations about current inflation and output growth, and compares the model’s impulse responses and correlations to macro facts—showing disinflations are contractionary (though less so when announced credibly), inflation responds to monetary shocks with a long delay (peaking around seven quarters in the baseline), and output is positively correlated with changes in inflation (“acceleration”)—addressing key counterfactuals of the standard New Keynesian Phillips curve."

- title: "Asriyan and Vanasco (RES, 2024) - Security Design in Non-Exclusive Markets with Asymmetric Information"
  file: "Asriyan_Vanasco_RES_2024.pdf"
  desc: "This note summarizes the paper, which develops a two-period adverse-selection model of security design under non-exclusive competition where a privately informed seller can accept contracts from multiple competitive buyers subject to cash-flow feasibility, shows that non-exclusivity destroys classic separating “retention” equilibria because low types can mimic and then sell the residual piece elsewhere, characterizes a unique semi-pooling star equilibrium in which both types issue the same senior debt tranche priced at average valuation while only the low type sells the junior tranche at low valuation (sustained by a withdrawal stage and latent contracts), compares welfare across full-information, exclusive, and non-exclusive markets (non-exclusive can raise or lower liquidity when quality is exogenous), and proves that with endogenous origination effort non-exclusivity always increases mispricing and weakens incentives, lowering average asset quality—yielding empirical predictions for tranching and the weak link between retention and senior pricing in securitization markets."

- title: "Lerner (JF, 1995) - Venture Capitalists and the Oversight of Private Firms"
  file: "Lerner_JF_1995.pdf"
  desc: "This note summarizes the paper, which builds a corrected panel of U.S. private biotech venture financings (271 firms, 653 rounds, 1978–1989) and board rosters to test VC monitoring by (i) comparing board-seat changes around CEO turnover events and estimating Poisson regressions for newly added directors by type (showing CEO turnover triggers large increases in VC directors but not other outsiders) and (ii) estimating probit board-membership regressions for VC–firm pairs showing VC board service declines sharply with geographic distance to the nearest VC office (conditional on equity stake and VC characteristics), interpreting both patterns as evidence that venture capitalists provide local, state-contingent oversight rather than purely passive certification."

- title: "Sirri and Tufano (JF, 1998) - Costly Search and Mutual Fund Flows"
  file: "Sirri_Tufano_JF_1998.pdf"
  desc: "This note summarizes the paper, which uses an annual panel of U.S. equity mutual funds (ICDI, 1971–1990, with fee and media supplements) to define net flows as asset growth net of returns, estimates Fama–MacBeth flow regressions with a piecewise-linear (quintile/segment) performance-rank specification plus risk, fees, fund size, and objective-category flows, and shows a pronounced hockey-stick flow–performance relation (strong winner-chasing but little punishment for losers) that is consistent with costly investor search, supported by interactions with search-cost proxies (complex size and fee-based marketing intensity), survivorship-bias checks using dead funds, fee-change regressions, and media-citation evidence on visibility."

- title: "Tetlock (JF, 2007) - Giving Content to Investor Sentiment: The Role of Media in the Stock Market"
  file: "Tetlock_JF_2007.pdf"
  desc: "This note summarizes the paper, which converts daily Wall Street Journal “Abreast of the Market” columns (1984–1999) into a quantitative pessimism measure using General Inquirer word-category counts and a rolling PCA factor (plus Negative/Weak word alternatives), estimates daily predictive VAR-style regressions of Dow returns, NYSE detrended log volume, and SMB returns with rich lag/volatility/calendar controls and timing-robust windows (e.g., 10am-to-close next-day returns and after-morning volume), and finds that high pessimism forecasts a short-run market decline followed by reversal while absolute pessimism forecasts higher volume and small-stock effects are more persistent—supporting a sentiment/price-pressure interpretation over fundamental-news or stale-information views."

- title: "Brown, Harlow, and Starks (JF, 1996) - Of Tournaments and Temptations: An Analysis of Managerial Incentives in the Mutual Fund Industry"
  file: "Brown_Harlow_Starks_JF_1996.pdf"
  desc: "This note summarizes the paper, which tests the mutual-fund “tournament” incentive hypothesis using 334 U.S. growth funds (1976–1991) by classifying funds as interim winners/losers based on cumulative returns through midyear months (April–August) and measuring risk shifting with a post- vs pre-assessment volatility risk-adjustment ratio (RAR), implementing 2×2 contingency-table χ2 tests and logistic regressions (with cumulative-performance controls) and validating active risk-taking with unmanaged CRSP-stock control portfolios and volatility/beta subtournaments, finding that interim losers disproportionately increase risk—especially around July rankings, in newer/smaller funds, and in the late-1980s high-attention period—consistent with convex flow-based rewards for top performance."

- title: "Kacperczyk, Van Nieuwerburgh, and Veldkamp (JF, 2014) - Time-Varying Fund Manager Skill"
  file: "Kacperczyk_VanNieuwerburgh_Veldkamp_JF_2014.pdf"
  desc: "This note summarizes the paper, which uses CRSP mutual-fund data and Thomson holdings (1980–2005) to construct holdings-based measures of market timing (beta tilts before market returns) and stock picking (idiosyncratic-return tilts), estimates fund- and manager-level panel and quantile regressions showing timing skill rises in recessions while picking skill is stronger in expansions (especially in the right tail), documents that the same top expansion stock pickers become top recession market timers (strategy switching), and builds a real-time recession-probability-weighted Skill Index that predicts future fund alpha even though timing and picking are not separately persistent."

- title: "Kleven, Landais, and Leite-Mariante (RES, 2025) - The Child Penalty Atlas"
  file: "Kleven_Landais_LeiteMariante_RES_2025.pdf"
  desc: "This note summarizes the paper, which constructs a global “Child Penalty Atlas” for women’s employment using harmonized microdata from 134 countries, estimating gender-specific event-study effects around first birth with age and year controls in panel settings and extending this to most countries via a pseudo-event-study matching design on repeated cross sections (matched on age, year, education, marital status, and rural/urban status), validating the pseudo approach against true panel benchmarks (high R^2), and then mapping the resulting scaled child penalties across countries and cities and decomposing the gender employment gap into child- versus marriage-related components over development—showing large cross-country heterogeneity, larger penalties in cities, and a rising share of gender inequality explained by child penalties as economies urbanize and shift away from agriculture."

- title: "Vissing-Jørgensen (JPE, 2002) - Limited Asset Market Participation and the Elasticity of Intertemporal Substitution"
  file: "VissingJorgensen_JPE_2002.pdf"
  desc: "This note summarizes the paper, which uses CEX microdata (1980–1996) to classify households as stockholders versus nonstockholders and bondholders versus nonbondholders, constructs semiannual nondurable consumption growth and predictable variation in stock and Treasury-bill returns, and estimates log-linearized Euler equations by IV/GMM separately for holders and nonholders (with overlap-robust standard errors, wealth-layer splits, single-individual-household checks, and a median-household robustness procedure), showing that pooling nonparticipants biases EIS estimates toward zero—while EIS is economically meaningful for actual participants (≈0.3–0.4 for stockholders and ≈0.8–1 for bondholders, larger for richer layers)."

- title: "Beraja, Fuster, Hurst, and Vavra (QJE, 2019) - Regional Heterogeneity and the Refinancing Channel of Monetary Policy"
  file: "Beraja_Fuster_Hurst_Vavra_QJE_2019.pdf"
  desc: "This note summarizes the paper, which uses mortgage microdata (CRISM/HMDA/CoreLogic/Polk) and the QE1 mortgage-rate drop as a quasi-experimental shock to estimate MSA-level difference-in-differences regressions showing that regions with higher pre-QE home equity experienced much larger increases in refinancing, cash-out refinancing, and durable spending, links aggregate refinancing to the evolving cross-regional distribution of house price growth/equity via time-series interaction regressions, and then builds a heterogeneous-household model with fixed refinancing costs and collateral (LTV) constraints plus lender-side general-equilibrium offsets to quantify how the nonlinearity in refinancing with respect to extractable equity makes monetary transmission state dependent—weak and inequality-increasing in 2008 when many borrowers are underwater, but much stronger under a 2001-style equity distribution—while interpreting the core figures and counterfactuals."

- title: "Gurun, Matvos, and Seru (JF, 2016) - Advertising Expensive Mortgages"
  file: "Gurun_Matvos_Seru_JF_2016.pdf"
  desc: "This note summarizes the paper, which matches lender–DMA–quarter mortgage advertising expenditures (TNS) to subprime loan-level contracts (LoanPerformance, 2002–2006) to construct a lender-level “mortgage expensiveness” measure from residual ARM reset rates conditional on borrower/contract/market/time controls (including the initial teaser rate), estimates within-lender fixed-effects regressions showing more local advertising predicts more expensive mortgages (especially via newspaper ads and in less sophisticated borrower markets), and establishes causality using staggered Craigslist entry as an instrument for paid advertising plus delinquency and fee-based falsification tests and ad-content evidence that reset rates are almost never disclosed—supporting a persuasion rather than informative-advertising channel."

- title: "Hartman-Glaser, Mayer & Milbradt (RES, 2025) - A Theory of Cash Flow-Based Financing with Distress Resolution"
  file: "HartmanGlaser_Mayer_Milbradt_RES_2025.pdf"
  desc: "This note summarizes the paper, which develops a continuous-time dynamic contracting model where a liquidity-constrained firm manages cash-flow risk with costly internal cash and an intermediary with limited risk-bearing capacity and intermittent access to outside equity, shows net liquidity C=M−Y is the sufficient state variable, solves an HJB with an upper payout boundary and a lower distress boundary that endogenously determines whether financing is asset-based (liquidation at −L) or cash-flow-based (continuation supported by future refinancing), implements the optimal contract with equity plus senior secured debt and an unsecured risky credit line (the junior piece absorbs losses and thereby raises secured debt capacity), and interprets bankruptcy as optimal risk sharing—Chapter 11 as continuation with partial default on unsecured claims versus Chapter 7 liquidation when financing capacity is exhausted—highlighting complementarities between secured and unsecured debt and between debt capacity and future equity access."

- title: "Wang (AER, 2011) - State Misallocation and Housing Prices: Theory and Evidence from China"
  file: "Wang_AER_2011.pdf"
  desc: "This note summarizes the paper, which develops a model of China’s 1994 urban housing reform where privatizing state-owned housing shifts both private-market supply and demand, shows that the sign of the equilibrium price change is pinned down by a prereform mismatch sufficient statistic (how much housing state-sector households were allocated relative to their market demand), estimates mismatch from prereform private-housing demand in CHNS panel data and validates it by showing postreform mismatch collapses to zero, then uses household-level mismatch interactions and province-level mismatch DiD-style price regressions to link larger mismatch to more postreform mobility/renovation/upgrading and higher private-market price appreciation, and finally computes a welfare counterfactual comparing in-kind housing allocation to cash wages."

- title: "Bolton, Freixas, and Shapiro (JF, 2012) - The Credit Ratings Game"
  file: "Bolton_Freixas_Shapiro_JF_2012.pdf"
  desc: "This note summarizes the paper, which develops a game-theoretic model of issuer-paid credit ratings with ratings shopping (selective disclosure), CRA misreporting incentives traded off against reputation costs, and heterogeneous investors split between sophisticated and trusting clienteles, solves monopoly and duopoly equilibria with threshold “inflate vs truth-tell” regimes, and shows that competition often lowers welfare because a second rating mainly expands issuers’ shopping opportunities (so a truth-telling monopoly can strictly dominate a truth-telling duopoly), with a two-period extension endogenizing reputation that further strengthens the monopoly-dominance result and yielding policy implications emphasizing upfront fees plus mandatory disclosure of solicited ratings and methodology oversight."

- title: "Nucera, Sarno, and Zinna (RFS, 2024) - Currency Risk Premiums Redux"
  file: "Nucera_Sarno_Zinna_RFS_2024.pdf"
  desc: "This note summarizes the paper, which prices a large cross-section of currency strategy portfolios (46 test assets from 9 strategies, 1983–2017) by first extracting the latent currency SDF using an augmented Giglio–Xiu three-pass procedure with risk-premium PCA (RP-PCA) to recover weak but high-Sharpe pricing factors, then projecting 134 candidate nontradable macro/financial/text factors onto the latent pricing space to correct for omitted-factor and measurement-error biases, and concludes that the robust FX pricing kernel has at least three factors (dollar, carry, and short-term momentum) while only a small set of mostly volatility/uncertainty/liquidity proxies earn significant risk premia once the “factor zoo” is properly filtered."

- title: "Chevalier (AER, 1995) - Capital Structure and Product-Market Competition: Empirical Evidence from the Supermarket Industry"
  file: "Chevalier_AER_1995.pdf"
  desc: "This note summarizes the paper, which exploits late-1980s supermarket LBOs as large leverage shocks, estimates rival-stock event studies (market-model SUR) that compare direct local competitors to noncompetitors to infer whether leverage softens or toughens competition, and then uses an MSA-level panel of store counts to run market-growth OLS, incumbent expansion ordered-probit/OLS, and de novo entry probit regressions on pre-LBO local “LBO share” (split into early vs late LBO exposure and carefully reassigning post-LBO asset sales), finding positive rival announcement returns and more rival entry/expansion in high-LBO-share markets consistent with leverage softening product-market competition rather than selecting chronically weak firms."

- title: "Mustre-del-Río, Sánchez, Mather, and Athreya (RFS, 2025) - The Effects of Macroeconomic Shocks: Household Financial Distress Matters"
  file: "MustredelRio_Sanchez_Mather_Athreya_RFS_2025.pdf"
  desc: "This note summarizes the paper, which combines ZIP-level credit-bureau evidence on financial distress (FD) (30+ day delinquency on unsecured debt) and FD–shock correlations in the Great Recession and COVID with a quantitative life-cycle model featuring housing, mortgages, unsecured debt, delinquency, and bankruptcy with endogenous credit pricing, estimates cross-FD-quintile household heterogeneity (discount-factor mix and rental-housing values) to match savings, homeownership, leverage, and FD persistence, calibrates house-price and labor-income shocks by FD quintile, and then uses counterfactual decompositions (shutting down FD heterogeneity vs. FD–shock correlation) to show that FD-driven heterogeneity in MPCs changes aggregate consumption, inequality, poverty, and housing-market responses to macro shocks substantially—more than differences in shock exposure alone."

- title: "Chodorow-Reich, Darmouni, Luck, and Plosser (JFE, 2022) - Bank Liquidity Provision across the Firm Size Distribution"
  file: "ChodorowReich_Darmouni_Luck_Plosser_JFE_2022.pdf"
  desc: "This note summarizes the paper, which uses Fed supervisory Y-14Q loan-level data spanning the firm-size distribution to document that small firms’ credit lines are short-maturity, heavily collateralized, and effectively discretionary, then estimates facility-level DiD and exposure-based triple-difference/event-study regressions of COVID-era drawdowns showing that large firms (especially in highly exposed industries) drew heavily on committed lines while similarly exposed SMEs did not, complements the design with an IV that instruments industry COVID exposure using physical-proximity requirements, and interprets PPP repayment patterns as public liquidity substituting for private bank commitment in the SME segment."

- title: "Darmouni and Mota (RFS, 2024) - The Savings of Corporate Giants"
  file: "Darmouni_Mota_RFS_2024.pdf"
  desc: "This note summarizes the paper, which hand-collects 10-K fair-value footnote data to build a 2000–2021 panel of financial-asset composition (cash-like instruments vs. marketable securities split into Treasuries, corporate bonds, equity, etc.) for 200 U.S. corporate giants, estimates firm/time fixed-effects event-study DiD designs around the 2017 TCJA (tech/pharma and high-foreign-income exposure) and the 2020 COVID revenue shock (industry exposure) to show that tax changes mainly unwind securities portfolios while liquidity shocks mainly raise cash-like balances, and quantifies the downside of this shift with portfolio-return calculations highlighting large duration-driven losses in 2022."

- title: "Wollmann (AER, 2018) - Trucks without Bailouts: Equilibrium Product Characteristics for Commercial Vehicles"
  file: "Wollmann_AER_2018.pdf"
  desc: "This note summarizes the paper, which estimates a two-stage differentiated-products oligopoly model for U.S. commercial trucks (1986–2012) where firms first choose which models to offer (paying sunk entry costs and receiving scrap values upon exit) and then set prices given a rich demand system with buyer heterogeneity by industry and geography, identifies product repositioning incentives with exogenous demand shifters (construction-buyer composition and cab-length deregulation), uses moment inequalities from one-product deviation conditions to bound sunk costs, and then runs bailout/merger/liquidation counterfactuals showing that allowing endogenous product entry/exit dramatically attenuates predicted post-policy markup spikes and output/welfare losses compared to fixed-product models."

- title: "Hsu, Tian, and Xu (JFE, 2014) - Financial development and innovation: Cross-country evidence"
  file: "Hsu_Tian_Xu_JFE_2014.pdf"
  desc: "This note summarizes the paper, which builds a country–industry panel (32 countries, 1976–2006) and measures innovation using U.S. patent counts and quality metrics (citations/originality/generality) plus public-firm R&D, then implements a Rajan–Zingales-style interaction design with country-year fixed effects that interacts U.S.-benchmarked industry external-finance dependence or high-tech intensity with separate measures of equity-market depth (stock market cap/GDP) and credit-market depth (bank credit/GDP), showing that equity development raises innovation in finance-dependent/high-tech industries while credit development reduces it, with robustness to alternative finance proxies, country–industry fixed effects, and technology-class (patent-class) analyses."

- title: "Edmond, Midrigan, and Xu (AER, 2015) - Competition, Markups, and the Gains from International Trade"
  file: "Edmond_Midrigan_Xu_AER_2015.pdf"
  desc: "This note summarizes the paper, which calibrates a variable-markup oligopolistic trade model with nested CES demand to highly disaggregated Taiwanese manufacturing data (concentration moments, the labor-share–market-share slope, import and exporter shares, and an aggregate trade elasticity), uses the model’s Cournot pricing formulas to map market shares into endogenous markups and misallocation, and then quantifies gains from moving from autarky to Taiwan’s observed openness—decomposing total productivity gains into standard first-best trade gains versus procompetitive gains from reduced markup dispersion that mainly come from trade disciplining near-monopoly sectors where employment is concentrated."

- title: "Hortaçsu, Kastl, and Zhang (AER, 2018) - Bid Shading and Bidder Surplus in the US Treasury Auction System"
  file: "Hortacsu_Kastl_Zhang_AER_2018.pdf"
  desc: "This note summarizes the paper, which uses bidder-level step-function bids from U.S. Treasury bill and note uniform-price share auctions (2009–2013) to structurally decompose primary dealers’ higher-yield bids into willingness to pay versus bid shading, adapting the Wilson/Kastl share-auction model with dealer–customer information asymmetry, estimating each bidder’s expected residual supply elasticity via resampling rival bids (kernel-conditioning on observed indirect order flow for dealers) to recover marginal valuations and shading measures auction by auction, and then quantifying bidder surplus and allocative efficiency losses—showing dealers typically have higher values but shade more, especially in longer-maturity notes where surplus and inefficiency are largest."

- title: "Halpern, Koren, and Szeidl (AER, 2015) - Imported Inputs and Productivity"
  file: "Halpern_Koren_Szeidl_AER_2015.pdf"
  desc: "This note summarizes the paper, which merges Hungarian firm balance sheets with product-level customs records (1992–2003) to structurally estimate how imported input varieties raise productivity through a quality channel and an imperfect-substitution/complementarity channel, identifies the import-gain parameter using an import-share equation, a materials-share restriction, and an Olley–Pakes-style control-function production-function estimation (with demand controls), estimates per-product import fixed costs via an ordered-probit import-choice model and allows heterogeneity by foreign ownership, and then aggregates the estimated mechanism to quantify how much of Hungary’s manufacturing TFP growth is explained by imported inputs and to run tariff/FDI/fixed-cost counterfactuals."

- title: "Dubois and Lasio (AER, 2018) - Identifying Industry Margins with Price Constraints: Structural Estimation on Pharmaceuticals"
  file: "Dubois_Lasio_AER_2018.pdf"
  desc: "This note summarizes the paper, which estimates a random-coefficient logit demand system for French anti-ulcer drugs (2003–2013) using IMS data and cross-country variation from Germany and the U.S., then embeds it in a Bertrand supply model with unobserved price constraints (TFR reimbursement ceilings and regulatory price-cut rules) to recover which products are bindingly capped and how much margins would be overstated under an unconstrained model, identifying shadow constraint multipliers via cross-market cost restrictions and unconstrained FOCs, and finally runs counterfactual equilibria under free pricing versus external reference pricing to quantify spending, margins, generic penetration, and welfare effects."

- title: "Atanassov, Julio, and Leng (RFS, 2024) - The Bright Side of Political Uncertainty: The Case of R&D"
  file: "Atanassov_Julio_Leng_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses close U.S. gubernatorial elections (margin ≤ 5%) as quasi-exogenous shocks to political uncertainty, estimates firm- and time-fixed-effects DiD/event-time specifications in Compustat annual and quarterly panels to compare R&D intensity and CAPX responses in close versus nonclose election cycles, validates the uncertainty channel with higher stock-return volatility and polling “tossup” evidence, and tests mechanisms with heterogeneity by politically sensitive industries and high-tech/growth-option firms plus state-level EPU (and an IV-style design using election quarters for EPU), finding that uncertainty raises R&D while lowering capital expenditures and that the R&D effect is not explained by simple substitution or political spending cycles."

- title: "Dinerstein, Einav, Levin, and Sundaresan (AER, 2018) - Consumer Price Search and Platform Design in Internet Commerce"
  file: "Dinerstein_Einav_Levin_Sundaresan_AER_2018.pdf"
  desc: "This note summarizes the paper, which studies eBay’s 2011 shift from Best-Match search to a product-page design that ranks listings largely by price (with a Buy Box), estimates a structural model where the platform shapes consumers’ observed consideration sets (using browsing data) and sellers set Nash prices given that search process, identifies the key “visibility” parameter that makes low prices more likely to be shown, recovers seller costs from before-period pricing FOCs, and then runs counterfactual platform designs (quality-rank, price-rank, demand-rank, no-frictions) and uses a 2012 A/B experiment for external validation to show the redesign lowered prices mainly by increasing the price–visibility link (raising effective demand elasticities and cutting seller margins), with optimal ranking depending on product heterogeneity."

- title: "Brown, Fazzari, and Petersen (JF, 2009) - Financing Innovation and Growth: Cash Flow, External Equity, and the 1990s R&D Boom"
  file: "Brown_Fazzari_Petersen_JF_2009.pdf"
  desc: "This note summarizes the paper, which uses Compustat panels of U.S. high-tech firms (1990–2004) to estimate a dynamic Euler-equation-style R&D investment model via Arellano–Bond GMM, augmenting the baseline with internal cash flow and net stock issuance (plus sales/Tobin’s q and industry-year effects) and exploiting a young vs. mature public-firm split as the key identification contrast, showing that equity-financing supply shifts strongly raise R&D only for young, equity-dependent firms (not mature firms), and using the estimated coefficients to quantify that cash-flow and equity-issuance booms explain most of the late-1990s R&D boom and the post-2000 bust."

- title: "Crawford, Shcherbakov, and Shum (AER, 2019) - Quality Overprovision in Cable Television Marketss"
  file: "Crawford_Shcherbakov_Shum_AER_2019.pdf"
  desc: "This note summarizes the paper, which estimates a structural random-coefficients demand model and cable firms’ joint price-and-quality (bundle lineup) first-order conditions in U.S. cable markets (1997–2006) treating national DBS bundles as an exogenous high-end outside option, measures quality as affiliate-fee–weighted channel counts, identifies demand with BLP-style instruments and supply with MSO/capacity cost shifters, and then computes social-planner counterfactuals to show that when both prices and qualities are optimized the cable monopolist overprovides quality and overcharges (especially in multi-product systems) because it inflates bundle quality to steal business from DBS, with the overprovision largely disappearing when DBS competition is removed."

- title: "Amiti & Konings (AER, 2007) - Trade Liberalization, Intermediate Inputs, and Productivity: Evidence from Indonesia"
  file: "Amiti_Konings_AER_2007.pdf"
  desc: "This note summarizes the paper, which uses Indonesia’s 1991–2001 tariff liberalization and plant-level manufacturing census data to separately construct output tariffs and input-use–weighted input tariffs, estimates plant TFP with a modified Olley–Pakes production-function approach that treats importing/exporting as endogenous state variables, and then runs firm- and island-year fixed-effects regressions of TFP on output tariffs, input tariffs, and input-tariff×importer interactions—showing that once input tariffs are included the import-competition effect of output-tariff cuts is modest, while the dominant productivity gains come from lower input tariffs, especially for firms that actually import intermediates, with extensive robustness to markups, product switching, crisis/exchange-rate confounds, alternative tariff constructions, and IV checks."

- title: "Crawford, Lee, Whinston, and Yurukoglu (Econometrica, 2018) - The Welfare Effects of Vertical Integration in Multichannel Television Markets"
  file: "Crawford_Lee_Whinston_Yurukoglu_Econometrica_2018.pdf"
  desc: "This note summarizes the paper, which estimates a structural multistage model of U.S. multichannel TV markets that links household viewership (with RSN utility shifters from blackouts and stadium distance), bundle choice (BLP demand with satellite-tax instruments), and distributor pricing/carriage with Nash-in-Nash affiliate-fee bargaining, allowing vertically integrated RSN owners to partially internalize upstream–downstream profits (μ) and to foreclose rivals when Program Access Rules (PARs) are ineffective (terrestrial-loophole–identified lower bounds on foreclosure incentives), and then runs RSN-by-RSN counterfactuals comparing no integration vs integration with PARs vs integration without PARs to decompose double-marginalization/carriage efficiency gains from rival-foreclosure harms and quantify net welfare effects."

- title: "Darmouni, Siani, and Xiao (forthcoming JF) - Nonbank Fragility in Credit Markets: Evidence from a Two-Layer Asset Demand System"
  file: "Darmouni_Siani_Xiao_ForthcomingJF.pdf"
  desc: "This note summarizes the paper, which develops a two-layer asset-demand system where households allocate wealth across institutions (generating flow-to-performance sensitivities) and institutions allocate across bond types (generating downward-sloping asset demand), estimates the flow layer using CRSP/Morningstar fund data and the demand layer using IVs built from other institutions’ idiosyncratic flow shocks interacted with lagged portfolio weights (netting out benchmark-index rebalancing), and then combines these estimates with holdings network data to construct an amplification matrix that quantifies price–flow feedback and cross-asset contagion in crises (March 2020 and 2015–2016 energy), ranks bond classes by systemic importance, and evaluates policy counterfactuals such as rate cuts, asset purchases, direct financing of mutual funds, redemption restrictions, and swing pricing by their price-impact multipliers."

- title: "Bustos (AER, 2011) - Trade Liberalization, Exports, and Technology Upgrading: Evidence on the Impact of MERCOSUR on Argentinian Firms"
  file: "Bustos_AER_2011.pdf"
  desc: "This note summarizes the paper, which embeds fixed-cost technology upgrading into a Melitz-style heterogeneous-firm trade model and tests it using MERCOSUR as a trade-policy shock by exploiting cross-industry variation in Brazil’s tariff cuts (1992–1996), estimating firm first-difference/DiD regressions of export entry and technology spending (and binary product/process innovation indices) on tariff changes with rich controls for Argentina’s own tariffs and industry characteristics, and showing that larger tariff cuts raise export entry and induce technology upgrading primarily for upper-middle (third-quartile) firms near the adoption threshold, with parallel upgrading among both pre-1992 exporters and nonexporters supporting a revenue-based mechanism rather than pure learning-by-exporting."

- title: "Chiappori and Salanié (JPE, 2000) - Testing for Asymmetric Information in Insurance Markets"
  file: "Chiappori_Salanie_JPE_2000.pdf"
  desc: "This note summarizes the paper, which tests for asymmetric information in competitive French auto insurance by examining whether—conditional on the insurer’s observables—choosing comprehensive coverage (TR vs. minimum RC) is positively correlated with having an at-fault multi-car accident, implementing the test with (i) separate probits plus a generalized-residual independence statistic, (ii) a bivariate probit estimating the latent correlation ρ, and (iii) fully nonparametric cell-by-cell χ2 independence tests, and then uses beginner-driver samples and a bonus–malus “bonus-0.5” institutional variation to probe moral hazard—finding essentially zero conditional dependence and thus little evidence of risk-related asymmetric information."

- title: "Siani (RFS, 2025) - Raising Bond Capital in Segmented Markets"
  file: "Siani_RFS_2025.pdf"
  desc: "This note summarizes the paper, which measures the issuance premium as the new-issue spread minus the first-day secondary-market spread, builds and estimates a structural primary-market model with heterogeneous short- vs long-term investor demand, endogenous firm issuance supply, and an underwriter pricing problem that splits surplus between issuers and investors, identifies investor demand using an IV based on same-day crowdedness (other underwriters’ issuance volume) and identifies supply using within-day issue-size revisions tied to price talk, and then estimates an investor-favoring underwriter bargaining weight (about η^ ≈0.73, higher in bad times) to show underwriter pricing is the main driver of the level and countercyclicality of issuance premiums while short-term investors partly stabilize the market."

- title: "Lileeva and Trefler (QJE, 2010) - Improved Access to Foreign Markets Raises Plant-Level Productivity... for Some Plants"
  file: "Lileeva_Trefler_QJE_2010.pdf"
  desc: "This note summarizes the paper, which uses the Canada–U.S. FTA as an exogenous foreign-market-access shock by constructing plant-specific U.S. tariff cuts from each plant’s HS6 product mix, instruments export entry/growth with these tariff cuts in heterogeneous-treatment (Angrist–Imbens) IV designs across initial size–productivity bins, and shows that tariff-induced new exporters—especially initially smaller and less productive plants—experience large within-plant labor-productivity gains alongside technology adoption (MIS/inspection/communications) and product innovation, with additional domestic-sales and input-usage evidence supporting real efficiency improvements rather than pure markup effects, while contrasting these “negative-selection” gains for new exporters with more homogeneous gains for pre-FTA exporters."

- title: "Acemoglu, Akcigit, Alp, Bloom and Kerr (AER, 2018) - Innovation, Reallocation, and Growth"
  file: "Acemoglu_Akcigit_Alp_Bloom_Kerr_AER_2018.pdf"
  desc: "This note summarizes the paper, which introduces moment-based Markov equilibrium (MME) for Ericson–Pakes dynamic oligopoly in concentrated industries by letting firms track their own state and the full states of a few dominant firms but compressing the many-fringe-firm distribution into a small set of moments with a perceived Markov transition kernel, provides a simulation-based algorithm to compute MME, validates it by comparing long-run investment and surplus outcomes to exact MPE in small benchmark models, applies it in a large-scale calibrated beer/advertising industry to show why explicitly modeling the fringe disciplines dominant-firm investment and shapes concentration, and derives a robust dynamic-programming upper bound on the value of deviating from MME to a full-information strategy as an approximation-error diagnostic."

- title: "Ifrach and Weintraub (RES, 2017) - A Framework for Dynamic Oligopoly in Concentrated Industries"
  file: "Ifrach_Weintraub_RES_2017.pdf"
  desc: "This note summarizes the paper, which introduces moment-based Markov equilibrium (MME) for Ericson–Pakes dynamic oligopoly in concentrated industries by letting firms track their own state and the full states of a few dominant firms but compressing the many-fringe-firm distribution into a small set of moments with a perceived Markov transition kernel, provides a simulation-based algorithm to compute MME, validates it by comparing long-run investment and surplus outcomes to exact MPE in small benchmark models, applies it in a large-scale calibrated beer/advertising industry to show why explicitly modeling the fringe disciplines dominant-firm investment and shapes concentration, and derives a robust dynamic-programming upper bound on the value of deviating from MME to a full-information strategy as an approximation-error diagnostic."

- title: "Krasnokutskaya (RES, 2011) - Identification and Estimation of Auction Models with Unobserved Heterogeneity"
  file: "Krasnokutskaya_RES_2011.pdf"
  desc: "This note summarizes the paper, which develops a nonparametric identification and estimation approach for first-price procurement auctions with unobserved auction heterogeneity by modeling costs as a multiplicative common auction shock Y times bidder-specific private costs Xi , exploiting within-auction bid dependence and Kotlarski-style deconvolution on joint bid distributions (in logs) to separately recover fY and fX , and then inverting equilibrium bidding conditions to estimate markups and reserve-price counterfactuals—showing in Michigan highway auctions that ignoring unobserved heterogeneity (IPV/APV) overstates private-information dispersion and markups and yields substantially worse procurement reserve-price policies."

- title: "Tamer (RES, 2003) - Incomplete Simultaneous Discrete Response Model with Multiple Equilibria"
  file: "Tamer_RES_2003.pdf"
  desc: "This note summarizes the paper, which studies a two-player simultaneous binary-response game that can generate multiple equilibria and thus an incomplete econometric model with inequality restrictions on outcome probabilities, proves point identification of the structural interaction parameters and coefficients under rich support and an excluded continuous regressor even when some (or all) outcome probabilities are only bounded, and proposes a semiparametric maximum-likelihood estimator that nonparametrically estimates the nonunique off-diagonal outcome probability and trims it to satisfy the model-implied bounds—delivering efficiency gains relative to “coherency” fixes or pooled-outcome likelihoods that discard information from multiplicity."

- title: "Miller and Weinberg (Econometrica, 2017) - Understanding the Price Effects of the MillerCoors Joint Venture"
  file: "Miller_Weinberg_Econometrica_2017.pdf"
  desc: "This note summarizes the paper, which studies the 2008 MillerCoors joint venture using U.S. retail scanner data across 39 regions and a structural beer demand-and-supply model, estimates a random-coefficient nested-logit demand system with cost-shifter instruments (shipping-distance × diesel) and then a supply-side pricing model augmented with a post-merger conduct parameter κ that allows ABI and MillerCoors to partially internalize each other’s pricing externalities, identifies κ by comparing ABI’s post-merger price rise to the import “outside group” (Modelo/Heineken) and to unilateral-efficiency predictions, and runs counterfactual decompositions showing efficiencies and unilateral effects roughly offset while coordinated effects explain most of the observed 6%–8% price increase above Nash–Bertrand and most consumer-surplus losses."

- title: "Smith (RES, 2004) - Supermarket Choice and Supermarket Competition in Market Equilibrium"
  file: "Smith_RES_2004.pdf"
  desc: "This note summarizes the paper, which estimates a structural model of U.K. supermarket competition that combines household store-choice plus expenditure demand (using distance, store size, parking, firm identity, income, and primary vs. secondary shopping) with a multi-store Nash pricing system, identifies price sensitivity by matching model-implied margins to observed firm-level gross profit margins (instead of unobserved store-level prices), and then runs merger/demerger counterfactuals to quantify how multi-store ownership internalizes within-chain cannibalization and raises equilibrium prices (implying demerger lowers the price index while big-chain mergers raise it)."

- title: "Orame, Ramcharan, and Robatto (RFS, 2025) - Macroprudential Regulation, Quantitative Easing, and Bank Lending"
  file: "Orame_Ramcharan_Robatto_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses Italian credit-register bank–firm panels matched to security-level supervisory holdings and each sovereign bond’s accounting classification (mark-to-market vs historical cost) to study the ECB’s 2015 and 2019 PSPP announcements, estimates event-study and DiD loan-supply regressions with bank fixed effects and firm×time fixed effects showing QE raises lending and lowers loan rates only for banks with PSPP-eligible sovereign exposure valued under mark-to-market accounting (with a clean 2015–2019 test based on the AFS accounting switch), and then distinguishes channels by showing capital gains on mark-to-market securities (not trading flows or liquidity) drive the lending response and that the extra credit tilts toward safer firms, highlighting a macroprudential accounting tradeoff between capital-stability insulation and monetary-policy transmission."

- title: "Hansman, Hong, Jiang, Liu, and Meng (RFS, 2025) - Effects of Credit Expansions on Stock Market Booms and Busts"
  file: "Hansman_Hong_Jiang_Liu_Meng_RFS_2025.pdf"
  desc: "This note summarizes the paper, which studies China’s 2010–2015 margin-lending deregulation by combining (i) event studies showing strong pre-marginability run-ups and near-zero average post-implementation jumps, (ii) a formula-threshold regression discontinuity / fuzzy RD around the inclusion-index cutoff that identifies a large causal price effect of becoming marginable (≈5% after 5 days, ≈8.5% after 20 days, ≈25% after 60 days), (iii) mutual-fund and top-holder holdings evidence that institutions buy ahead and sell after the rollout, and (iv) a parsimonious dynamic information-revelation model (exponential pre-trends) to estimate how quickly markets anticipated the credit shock and how much of the ultimate price impact was priced in before the policy date."

- title: "Artavanis et al. (RFS, 2025) - Cross-Subsidization of Bad Credit in a Lending Crisis"
  file: "Artavanis_Lee_Panageas_Tsoutsoura_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses rare Greek bank corporate-loan data that observe both contractual interest rates and the bank’s internally computed break-even (marginal-cost) rates to directly measure loan markups, tests a crisis limit-pricing/cross-subsidization theory by estimating pass-through regressions of actual rates on BE rates with time/industry (and firm) fixed effects and borrower/loan controls, and shows sharply incomplete and asymmetric pass-through (≈0.30 overall; near zero for high-BE/riskier borrowers but ≈0.43 for low-BE/safer borrowers) that collapses during the May–July 2015 peak of the Greek crisis and jumps after the July 2015 memorandum, supported by guideline-introduction difference tests and future-rating/placebo evidence that rules out noncompliance or superior-information stories."

- title: "Ackerberg, Caves, and Frazer (Econometrica, 2015) - Identification Properties of Recent Production Function Estimators"
  file: "Ackerberg_Caves_Frazer_Econometrica_2015.pdf"
  desc: "This note summarizes the paper, which proves that the usual OP/LP proxy-variable first stage often does not identify the labor coefficient because labor can be functionally dependent on the same state variables and proxy input absorbed by the nonparametric control function, characterizes the narrow timing/noise conditions under which OP/LP first-stage identification survives, and proposes the ACF “conditional input demand inversion” estimator that conditions the proxy (materials or investment) on labor so the first stage only purges the unanticipated shock while all production elasticities are identified in a second-stage Markov/GMM step, supported by Monte Carlo evidence mapping a robustness–efficiency tradeoff across data-generating processes and measurement-error scenarios."

- title: "Bloom and Van Reenen (QJE, 2007) - Measuring and Explaining Management Practices across Firms and Countries"
  file: "Bloom_VanReenen_QJE_2007.pdf"
  desc: "This note summarizes the paper, which constructs a cross-country firm-level management practices index from double-blind interviews that score 18 operations/monitoring/targets/incentives practices for 732 mid-sized manufacturing firms in the U.S., U.K., France, and Germany, validates the measure with production-function and performance regressions (productivity, profitability, Tobin’s Q, growth, and survival) and repeat-survey reliability checks, and then explains cross-firm and cross-country variation using regressions linking poor management to weaker product-market competition and to family-control firms with primogeniture succession, showing that a long left tail of badly managed firms accounts for much of the cross-country management gap."

- title: "Boustanifar and Kang (RFS, 2025) - The Brand Premium"
  file: "Boustanifar_Kang_RFS_2025.pdf"
  desc: "This note summarizes the paper, which replaces the standard advertising-stock proxy for brand capital with two output-based brand measures—Interbrand’s annual Best Global Brands list and a new SEC-filings text measure (brand-word frequency)—and shows that portfolios of top-brand firms earn robust abnormal returns (≈22–30 bps/month) in factor regressions and Fama–MacBeth tests (strongest in equal- and capped value-weighting), then pinpoints a mispricing mechanism by showing the premium concentrates in internally generated brands (low reported acquired intangibles), is linked to analysts’ systematic underforecasting of future earnings, and is realized disproportionately around earnings announcements, while the traditional input-based advertising measure yields no robust alpha once profitability and investment factors are controlled for."

- title: "Gennaioli, La Porta, Lopez-de-Silanes, and Shleifer (QJE, 2013) - Human Capital and Regional Development"
  file: "Gennaioli_LaPorta_LopezdeSilanes_Shleifer_QJE_2013.pdf"
  desc: "This note summarizes the paper, which builds a global dataset of 1,569 subnational regions in 110 countries and shows in country–fixed-effect regional income regressions that education is the dominant correlate of within-country development relative to geography, institutions, and culture, complements this with firm-level production-function regressions (World Bank Enterprise Surveys) that separately load productivity on manager schooling, worker schooling, and regional schooling, and then calibrates a Lucas-style regional model with worker human capital, entrepreneurial/managerial human capital, and spillovers to perform development accounting—highlighting that standard worker-only Mincer returns understate human capital’s role because educated entrepreneurs/managers and occupational composition (directors/officers) matter strongly for regional prosperity."

- title: "Doraszelski and Jaumandreu (RES, 2013) - R&D and Productivity: Estimating Endogenous Productivity"
  file: "Doraszelski_Jaumandreu_RES_2013.pdf"
  desc: "This note summarizes the paper, which models firm productivity as a controlled Markov process shifted by lagged R&D, recovers latent productivity from firms’ static labor-demand inversion (chosen after observing productivity) to address simultaneity, and estimates a production function jointly with a flexible, potentially nonlinear and uncertain R&D–productivity law of motion via GMM in an unbalanced panel of Spanish manufacturing firms (1990s), showing exogenous and deterministic “knowledge-capital” productivity processes are rejected and that R&D has heterogeneous, state-dependent, risky but high average returns and explains a large share of productivity growth."

- title: "Cunha, Heckman, and Schennach (Econometrica, 2010) - Estimating the Technology of Cognitive and Noncognitive Skill Formation"
  file: "Cunha_Heckman_Schennach_Econometrica_2010.pdf"
  desc: "This note summarizes the paper, which develops and estimates a multistage CES skill-formation technology for latent cognitive and noncognitive skills using the Children of the NLSY79, identifies skills and parental investments via a nonlinear dynamic factor measurement system with many noisy proxies (explicitly correcting measurement error), anchors latent skills to interpretable adult outcomes (e.g., completed schooling), models endogenous parental investment responses with unobserved heterogeneity and an investment equation, and then uses the estimated elasticities to run planner policy simulations showing cognitive skills become much less substitutable later in childhood while noncognitive skills remain more malleable—implying efficient remediation tilts toward early investment, especially for disadvantaged children."

- title: "Armstrong (Econometrica, 2016) - Large Market Asymptotics for Differentiated Product Demand Estimators with Economic Models of Supply"
  file: "Armstrong_Econometrica_2016.pdf"
  desc: "This note summarizes the paper, which develops large-J (many-products-per-market) asymptotics for BLP-style differentiated-demand estimation under Bertrand pricing, proves a high-level inconsistency result showing product-characteristic instruments become asymptotically weak when equilibrium markups converge too quickly to a constant (so rival characteristics stop shifting prices), characterizes when identification is rescued (fixed number of firms with many products per firm, richer substitution structure such as many nests, or many markets growing fast enough relative to products), and supports the theory with Monte Carlo evidence and practical diagnostics/weak-IV-robust inference recommendations that emphasize matching the instrument strategy to the implied supply-side markup variation."

- title: "Pohl, Schmedders, and Wilms (RFS, 2024) - Existence of the Wealth-Consumption Ratio in Asset Pricing Models with Recursive Preferences"
  file: "Pohl_Schmedders_Wilms_RFS_2024.pdf"
  desc: "This note summarizes the paper, which develops an order-theoretic toolkit to determine existence, nonexistence, and uniqueness of the wealth–consumption ratio in asset-pricing models with Epstein–Zin (and related) recursive preferences by constructing Minkowski upper/lower bounds and a Jensen/CRRA comparison bound, exploiting affine state dynamics to reduce convergence to a closed-form limit statistic Ω(⋅), and applying these conditions to leading long-run-risk, stochastic-volatility, time-varying-disaster, and learning/ambiguity calibrations—showing many benchmark models are well defined while some learning models with unbounded priors are not."

- title: "Igami (JPE, 2017) - Estimating the Innovator’s Dilemma: Structural Analysis of Creative Destruction in the Hard Disk Drive Industry, 1981–1998"
  file: "Igami_JPE_2017.pdf"
  desc: "This note summarizes the paper, which structurally estimates a dynamic oligopoly model of creative destruction in the 1981–1998 hard disk drive industry by combining an IV-logit demand system over HDD categories with Cournot pricing to back out marginal costs and period profits, and then fitting a finite-horizon dynamic entry/exit/innovation game (with extreme-value private shocks) by maximum likelihood to recover fixed operating costs and incumbent versus entrant sunk innovation costs, using counterfactuals to decompose the “innovator’s dilemma” into cannibalization versus preemption (showing cannibalization explains most of incumbents’ delayed adoption despite lower estimated innovation costs) and to evaluate ex ante versus ex post patent-policy scenarios."

- title: "Bernstein (JF, 2021) - Negative Home Equity and Household Labor Supply"
  file: "Bernstein_JF_2021.pdf"
  desc: "This note summarizes the paper, which uses U.S. administrative household data from a large financial institution (2010–2014) to measure labor income via deposit inflows, constructs a timing-based synthetic LTV (origination-cohort median LTV × synthetic amortization path × local house-price growth) and instruments actual underwater status with an indicator for synthetic LTV ≥ 100%, and estimates 2SLS specifications with very rich region×time and cohort×time (and household) fixed effects plus placebo tests to show that crossing into negative home equity causally reduces household labor income in a highly nonlinear way concentrated at the 100% LTV threshold."

- title: "Campello (JFE, 2006) - Debt Financing: Does It Boost or Hurt Firm Performance in Product Markets?"
  file: "Campello_JFE_2006.pdf"
  desc: "This note summarizes the paper, which develops a financing-and-product-market model with renegotiation and asymmetric information where moderate debt can serve as a strategic commitment device (credible overinvestment threat) but excessive debt undermines that logic, and then tests the resulting nonmonotonic debt–performance relation in a 1971–2000 Compustat panel of 4-digit SIC product markets by regressing firms’ relative-to-rival sales growth on relative leverage using spline (leverage-region) specifications, instrumenting leverage with asset tangibility (liquidation-value weights) and using IV/GMM robustness, and showing that moderately high leverage predicts market-share gains while very high relative leverage predicts sharp underperformance, especially in concentrated industries and conditional on leadership status."

- title: "Chen and Wang (RFS, 2025) - Dynamic Market Making with Asymmetric Information and Market Power"
  file: "Chen_Wang_RFS_2025.pdf"
  desc: "This note summarizes the paper, which builds a multiperiod microstructure model with informed traders, hedgers facing intraday liquidity shocks, and oligopolistic market makers (agency vs principal inventory-carrying regimes), derives closed-form equilibrium bid–ask spreads and trading volume as functions of endogenous reservation-price gaps and dealer market power, shows how early information trading and delayed hedging jointly generate the observed double U-shaped intraday patterns in spreads and turnover (with distinctive agency vs principal close-of-day volume dynamics), and calibrates the model to NASDAQ TAQ intraday spread and turnover moments (2000–2021) to match the joint curves and deliver comparative statics in signal precision, liquidity-shock uncertainty, number of dealers, and trading rounds."

- title: "MacKay and Phillips (RFS, 2005) - How Does Industry Affect Firm Financial Structure?"
  file: "MacKay_Phillips_RFS_2005.pdf"
  desc: "This note summarizes the paper, which uses a Compustat–CRSP manufacturing panel (1981–2000) split into competitive (HHI<1000) versus concentrated (HHI>1800) industries to show most leverage variation is within industries, constructs an industry-position “natural hedge” measure based on how close a firm’s capital–labor ratio is to the industry median plus peer-change measures (intra-/extra-quantile), and estimates a first-differenced GMM simultaneous-equations system for changes in leverage, capital intensity, and cash-flow risk (instrumenting with second lags and using industry×year effects) to show core firms in competitive industries use less debt and firms adjust against peer moves, while in concentrated industries leverage is higher and peer interactions dominate and the natural-hedge effect largely disappears."

- title: "Heath and Mobarak (JDE, 2015) - Manufacturing growth and the lives of Bangladeshi women"
  file: "Heath_Mobarak_JDE_2015.pdf"
  desc: "This note summarizes the paper, which uses a 2009 household survey with retrospective schooling/marriage/childbirth histories from 60 Bangladeshi villages plus village-level timing of first garment-job access (collected in 2014) to implement difference-in-differences and discrete-time hazard models comparing garment-proximate versus control villages and exploiting cohort-by-exposure variation within garment villages (with sibling fixed effects and brother comparisons for schooling), showing that nearby export-manufacturing jobs raise young women’s outside-work participation, delay marriage and first birth, and increase girls’ schooling—especially at younger ages—while documenting no differential pre-trends and benchmarking against the 1994 female stipend program which appears much less important in this setting."

- title: "Doshi and Kumar (RFS, 2025) - Capital Investment, Equity Returns, and Aggregate Dynamics in Oligopolistic Production Economies"
  file: "Doshi_Kumar_RFS_2025.pdf"
  desc: "This note summarizes the paper, which builds and calibrates a dynamic general-equilibrium oligopolistic production economy where firms sustain tacit collusion through a repeated-game punishment threat and choose prices, capacity utilization, and capital investment under real frictions, highlighting that off-equilibrium (punishment-path) equity values discipline defection and therefore link financial markets to real decisions, and then tests the model’s comparative statics in U.S. data using Fama–MacBeth return regressions on text-based industry concentration (THHI) interacted with operating leverage, operating profitability, depreciation sensitivity, and boom states—showing concentration’s return effect is conditional and can flip sign—alongside investment regressions on concentration in high-entry-threat industries."

- title: "Subrahmanyam, Tang, and Wang (RFS, 2014) - Does the Tail Wag the Dog?: The Effect of Credit Default Swaps on Credit Risk"
  file: "Subrahmanyam_Tang_Wang_RFS_2014.pdf"
  desc: "This note summarizes the paper, which uses North American CDS transaction data (1997–2009) to estimate monthly discrete-time hazard/logit models for rating downgrades and bankruptcy around CDS inception (CDS Active), corrects for endogenous CDS selection with a CDS-introduction probit (lender-side instruments based on creditors’ FX-hedging activity and Tier 1 capital), propensity-score matching, and joint FIML treatment–outcome estimation, and then tests empty-creditor mechanisms by showing bankruptcy risk rises with CDS notional intensity, spikes among already distressed firms, is stronger for no-restructuring CDS contracts, and increases with post-CDS expansion in the lender base (creditor coordination)."

- title: "Do, Levchenko, and Raddatz (JDE, 2016) - Comparative Advantage, International Trade, and Fertility"
  file: "Do_Levchenko_Raddatz_JDE_2016.pdf"
  desc: "This note summarizes the paper, which links Becker-style fertility choice to Ricardian comparative advantage by constructing a country-level “female labor needs of exports” measure (sector female-employment shares weighted by export composition), estimating cross-sectional and panel regressions of log fertility on this export-gender-intensity index, and identifying causality with a geography-based sector-specific gravity IV (Frankel–Romer style, using heterogeneous distance/border coefficients across sectors to instrument for export composition rather than openness), showing that specialization in female-labor-intensive exports lowers fertility with economically large elasticities and robust results across decades, subsamples, and controls."

- title: "van Binsbergen, Nozawa, and Schwert (RFS, 2025) - Duration-Based Valuation of Corporate Bonds"
  file: "vanBinsbergen_Nozawa_Schwert_RFS_2025.pdf"
  desc: "This note summarizes the paper, which decomposes each corporate bond’s realized return into a duration-matched Treasury-strip return and a residual duration-adjusted excess return using bond cash-flow weights, shows that most standard excess returns over T-bills—especially for investment-grade bonds—are actually long-duration safe-rate windfalls from the secular decline in yields, and then re-evaluates asset-pricing models by running CAPM and two-factor “duration-adjusted CAPM” regressions (splitting the equity market factor into a Treasury-duration component and a dividend-risk component, with subperiod tests exploiting the post-2001 stock–bond correlation regime change) and comparing to bond-factor models and anomaly sorts, finding alphas largely disappear after duration adjustment except for momentum."

- title: "Harrison, Ross, and Swarthout (JPE, 2026) - Gender, Confidence, and the Mismeasure of Intelligence, Competitiveness, and Literacy"
  file: "Harrison_Ross_Swarthout_JPE_2026.pdf"
  desc: "This note summarizes the paper, which uses randomized Raven-matrix experiments to compare traditional forced multiple-choice scoring to an incentivized quadratic scoring rule (QSR) interface that elicits full belief distributions (one-token “modal” reports vs 80-token confidence reports, with progressive vs scrambled question order), evaluates performance with both accuracy and welfare-relevant earnings efficiency metrics, and shows that salient incentives raise accuracy while confidence reporting raises efficiency and flips standard gender conclusions (women outperform on efficiency once confidence is measured), then extends the same confidence-and-welfare framework to reinterpret tournament “competitiveness” choices as risky lotteries using elicited win probabilities and risk preferences, and to reinterpret financial “literacy” as confidence calibration rather than point bias."

- title: "Saretto & Tookes (RFS, 2013) - Corporate Leverage, Debt Maturity, and Credit Supply: The Role of Credit Default Swaps"
  file: "Saretto_Tookes_RFS_2013.pdf"
  desc: "This note summarizes the paper, which studies whether single-name CDS trading relaxes credit supply by estimating a simultaneous system of firm leverage and debt-maturity regressions on CDS Trading (within-firm timing), validating the hedging mechanism with within-CDS liquidity tests (quote counts and bid–ask spreads), an IV for CDS introduction based on connected lenders’/underwriters’ FX-derivatives hedging propensity, and a matched-firm DiD event design around CDS start dates, and then shows the effects are strongest when supply is tight (aggregate credit tightening, local defaults, and connected-bank crisis writedowns) and work mainly through greater bond financing rather than loans—implying CDS markets expand debt capacity and lengthen maturity rather than merely reprice spreads."

- title: "Autor, Dorn, and Hanson (AER: Insights, 2019) - When Work Disappears: Manufacturing Decline and the Falling Marriage Market Value of Young Men"
  file: "Autor_Dorn_Hanson_AERInsight_2019.pdf"
  desc: "This note summarizes the paper, which uses commuting-zone exposure to Chinese import competition (stacked first differences for 1990–2000 and 2000–2014) instrumented by China’s export growth to other rich countries, decomposes the shock into male- versus female-intensive industry components, and estimates CZ-level 2SLS regressions showing male-intensive trade shocks reduce young men’s relative employment and earnings, raise male idleness and premature mortality, and spill over into lower marriage and fertility and higher child poverty and single-parent households (with opposite-signed family effects for female-intensive shocks)."

- title: "Jansen (RFS, 2025) - Long-Term Investors, Demand Shifts, and Yields"
  file: "Jansen_RFS_2025.pdf"
  desc: "This note summarizes the paper, which exploits the Netherlands’ July 2012 UFR reform to the regulatory discount curve as an exogenous maturity-specific demand shock for pension funds and insurers, estimates difference-in-differences portfolio regressions using pre-reform liability duration and solvency constraints to show exposed institutions rotate out of ≥30-year bonds into 15–25-year bonds and take more risk, and then instruments maturity-bucket yields with the reform-implied discount-curve weights to estimate a Koijen–Yogo-style government-bond demand system that quantifies yield effects and identifies banks as the most price-elastic investors and primary shock absorbers, with corroborating evidence from swap positions and European external-validity tests."

- title: "Valta (JFE, 2012) - Competition and the Cost of Debt"
  file: "Valta_JFE_2012.pdf"
  desc: "This note summarizes the paper, which links U.S. syndicated loan spreads from Dealscan (matched to Compustat/CRSP and Hoberg–Phillips concentration measures) to product-market competition in panel regressions with rich borrower and contract controls, and then identifies causality using large import tariff reductions as quasi-exogenous competition shocks in difference-in-differences/event-timing and within-firm change specifications, showing that heightened competition raises the cost of bank debt—especially when firms are strategically vulnerable (small vs. large rivals, concentrated interaction) and when collateral is hard to liquidate (high asset specificity/illiquidity)."

- title: "Bansal and Yaron (JF, 2004) - Risks for the Long Run: A Potential Resolution of Asset Pricing Puzzles"
  file: "Bansal_Yaron_JF_2004.pdf"
  desc: "This note summarizes the paper, which introduces the long-run risks framework by modeling consumption and dividends with a tiny but highly persistent expected-growth component and stochastic consumption volatility, pricing assets with Epstein–Zin preferences so IES and risk aversion are disentangled, and then calibrating the two nested cases (growth-only and growth+volatility) to show that long-run growth news and volatility news jointly generate a high equity premium with a low risk-free rate, persistent and volatile price–dividend ratios, time-varying return volatility and volatility feedback, and long-horizon return predictability—while matching key macro moments and decomposing pricing-kernel variance into expected-growth versus uncertainty shocks."

- title: "Danzer and Zyska (AEJ: Economic Policy, 2023) - Pensions and Fertility: Microeconomic Evidence"
  file: "Danzer_Zyska_AEJEP_2023.pdf"
  desc: "This note summarizes the paper, which exploits Brazil’s large 1991 rural pension expansion as an exogenous pension-wealth shock by comparing rural (treated) and urban (control) women in a difference-in-differences design and using the rural×post interaction as an instrument for log pension wealth in 2SLS, then traces dynamic and long-run effects with a cohort event-study of completed fertility at age 45, documenting that fertility falls sharply for older women (especially ages 30–44), primarily through fewer higher-parity births and stronger reductions among women who already have sons, and showing the resulting ≈1.3-child decline in rural completed fertility is large enough to materially worsen the PAYG system’s long-run contribution base while ruling out major confounders (education, health, labor supply, income/wealth, media, trade, migration)."

- title: "Jung (RFS, 2025) - Real Consequences of Shocks to Intermediaries Supplying Corporate Hedging Instruments"
  file: "Jung_RFS_2025.pdf"
  desc: "This note summarizes the paper, which exploits South Korea’s 2010 macroprudential cap on banks’ FX-derivatives (FXD)-to-capital ratios as a quasi-exogenous shock to intermediaries’ supply of corporate hedging instruments, estimates bank-level difference-in-differences/event-study and continuous-exposure regressions showing constrained banks shrink FXD positions (not capital), traces transmission using firm–bank contract-level regressions that compare exporters’ hedging with constrained versus unconstrained banks, and then tests real effects in firm-level exposure×pre-shock-hedge interaction regressions showing exposed high-hedge (especially small) exporters reduce total hedging and cut exports (with domestic-sales and credit-channel placebos plus CIP-deviation price evidence)."

- title: "Colacito and Croce (JPE, 2011) - Risks for the Long Run and the Real Exchange Rate"
  file: "Colacito_Croce_JPE_2011.pdf"
  desc: "This note summarizes the paper, which builds a two-country complete-markets Epstein–Zin long-run risk model in which exchange rates move with differences in countries’ stochastic discount factors driven by both short-run consumption shocks and persistent expected-growth news, shows that if long-run growth components are highly correlated across countries then pricing kernels can be much more correlated than contemporaneous consumption growth—muting real exchange-rate volatility without extreme risk aversion—measures long-run risk in U.S. and U.K. data using predictive regressions that combine financial variables (price–dividend ratios, risk-free rates, consumption–output ratios, default premia) with consumption growth and validates the mechanism with time-varying correlation evidence (higher long-run-risk correlation coincides with lower FX volatility), and estimates preference/long-run-risk parameters via Euler-equation GMM and joint consumption–dividend–return systems to match exchange-rate and international asset-pricing moments."

- title: "Rossi and Godard (AEJ: Policy, 2022) - The Old-Age Security Motive for Fertility: Evidence from the Extension of Social Pensions in Namibia"
  file: "Rossi_Godard_AEJEP_2022.pdf"
  desc: "This note summarizes the paper, which exploits Namibia’s 1990s post-apartheid expansion and equalization of social pensions by building a region×ethnicity “initial old-age-support needs” treatment measure from pre-reform pension coverage and benefit generosity, estimating period and cohort difference-in-differences designs that interact these initial needs with post-reform timing and cohort exposure (with rich pre-trend validation and sample restrictions excluding Whites and the Khomas capital region), and showing that improved pension protection significantly reduces fertility—concentrated among women aged 30–45 and operating mainly through earlier stopping (lower ideal family size, higher desire to stop, lower age at last birth) rather than delayed starts—with strong nonlinearity where effects are largest when initial protection is very low."

- title: "Liao and Zhang (RFS, 2025) - The Hedging Channel of Exchange Rate Determination"
  file: "Liao_Zhang_RFS_2025.pdf"
  desc: "This note summarizes the paper, which proposes a currency hedging channel linking slow-moving external dollar debt imbalances to fast exchange-rate dynamics by modeling investors’ optimal hedge ratios as increasing in expected FX volatility and intermediaries’ constrained supply of forwards, and then tests the mechanism in G-10 data with (i) unconditional cross-sectional regressions relating USD net debt holdings to more negative cross-currency bases and more expensive domestic-currency calls (risk reversals), (ii) panel interaction regressions showing volatility shocks amplify basis and option-skew moves and generate spot appreciation for dollar-rich countries followed by predictable reversals, and (iii) supporting term-structure, Solvency II DiD, and COVID swap-line usage evidence."

- title: "Abis and Veldkamp (RFS, 2024) - The Changing Economics of Knowledge Production"
  file: "Abis_Veldkamp_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses Burning Glass job postings (2010–2018) and Payscale wages in investment management to structurally estimate a two-stage knowledge-production model where data-management labor accumulates a depreciating structured-data stock and analysts (AI vs. traditional) combine data and labor with different Cobb–Douglas data exponents, identifying a shift toward “industrialized” knowledge production by showing the AI data exponent α exceeds the old-tech exponent γ (implying lower diminishing returns to data and a decline in labor’s share within knowledge production), and translating the estimates into the rising private value of data and the fast growth of AI-analyst hiring."

- title: "Chen, Hwang, and Peng (RFS, 2025) - Why Do Investors Like Short-leg Securities? Evidence from a Textual Analysis of Buy Recommendations"
  file: "Chen_Hwang_Peng_RFS_2025.pdf"
  desc: "This note summarizes the paper, which asks why investors bid up “short-leg” anomaly stocks by classifying the narratives in 1.7M sell-side buy recommendations and 141k Seeking Alpha long-idea articles (2006–2021) using investor-survey–generated dictionaries for safety, supremacy, and lottery language (with negation handling), comparing word-share “abnormality” in short-leg recommendations versus other recommendations across 186 anomalies and 32 economic categories, validating the text results with new institutional and retail surveys of investors’ actual purchases, and showing that lottery/upside-potential language is the dominant explanation across both institutional and retail environments and survives alternative scalars, theory word lists, and FinBERT classifiers—reframing many anomaly short legs as overpriced because of perceived upside rather than safe-haven demand."

- title: "Chen, Liu, Wang, Wang, and Yu (RFS, 2025) - Investor Sentiment and the Pricing of Characteristics-Based Factors"
  file: "Chen_Liu_Wang_Wang_Yu_RFS_2025.pdf"
  desc: "This note summarizes the paper, which tests whether characteristics-based factor betas capture risk or mispricing by forming decile portfolios sorted on ex ante beta to 13 prominent characteristics-based factors and comparing their high–low beta return spreads across high- versus low-sentiment regimes (Baker–Wurgler and alternatives), estimating predictive and contemporaneous sentiment-change regressions (with macro controls), extending the tests to mutual funds and hedge funds, and decomposing returns into overnight versus intraday components, finding that beta-sorted spreads are near zero unconditionally but become strongly positive after high sentiment (driven mainly by the low-beta leg), the opposite of macro risk factors—supporting the interpretation that characteristics-based factor beta is a noisy proxy for sentiment-related mispricing rather than systematic risk and cautioning against using such factors as risk-adjustment benchmarks in performance and event studies."

- title: "Cuddy and Currie (JPE, 2026) - Rules versus Discretion: Treatment of Mental Illness in US Adolescents"
  file: "Cuddy_Currie_JPE_2026.pdf"
  desc: "This note summarizes the paper, which uses Blue Cross Blue Shield claims (2012–2018) linked to IQVIA prescription data to classify adolescents’ first anxiety/depression/adjustment-disorder episodes into no treatment, therapy, or drug treatment—then into FDA-approved, guideline-consistent gray-area, and red-flag prescribing—identifies causal effects using area-level provider supply and prescribing-style instruments selected via post-Lasso 2SLS, and interprets the treatment “decision-tree” results showing red-flag drugs raise costs, ER/hospital use, and self-harm, FDA-approved drugs reduce self-harm but are costly, and gray-area drugs lower costs and facility use without increasing self-harm."

- title: "Bergemann, Heumann, and Morris (JPE, 2026) - Screening with Persuasion"
  file: "Bergemann_Heumann_Morris_JPE_2026.pdf"
  desc: "This note summarizes the paper, which integrates nonlinear pricing (screening) with Bayesian persuasion by letting a seller jointly choose a public menu of qualities/prices and an information structure about buyers’ willingness to pay, reformulates the problem as a joint optimization over the distribution of posterior means and the induced quality allocation (mean-preserving contraction constraint), and proves sharp structure results: the optimal mechanism has a finite (often pooled) menu with convex quality steps, sufficiently high-entropy value distributions force pooling, and under modest-tails and convex-marginal-cost conditions the optimum collapses to a single-item menu with a binary buy/no-buy recommendation."

- title: "Rodríguez-Clare, Ulate, and Vásquez (JPE, 2026) - Trade with Nominal Rigidities: Understanding the Unemployment and Welfare Effects of the China Shock"
  file: "RodriguezClare_Ulate_Vasquez_JPE_2026.pdf"
  desc: "This note summarizes the paper, which builds a dynamic multi-region multi-sector trade-and-migration model with Armington trade, input–output linkages, nested sector-versus-region mobility, and downward nominal wage rigidity plus a nominal anchor to generate transition unemployment, calibrates the China shock using imports-from-China variation and pins down the rigidity and mobility parameters by matching Autor–Dorn–Hanson reduced-form moments for unemployment, NILF, and population responses across U.S. states, and then uses dynamic exact-hat algebra to quantify unemployment paths and state-level welfare—showing DNWR creates a temporary unemployment hump and sharply reduces aggregate gains while producing substantial losses in highly exposed states."

- title: "Inoue and Kilian (JPE, 2026) - When Is the Use of Gaussian-Inverse Wishart-Haar Priors Appropriate?"
  file: "Inoue_Kilian_JPE_2026.pdf"
  desc: "This note summarizes the paper, which critiques blanket claims that conventional sign-identified Bayesian VAR inference is “prior driven” by showing that the practical importance of the Gaussian–inverse Wishart–Haar prior depends on the width of the identified set, develops a stylized set-identification model and a bivariate price–quantity VAR to illustrate how data (reduced-form covariance structure) and added restrictions tighten or loosen identification, and proposes a simple applied diagnostic—compare conventional posterior means/credible intervals to prior-robust identified sets using the Hausdorff distance—then demonstrates in several empirical VAR examples that conventional inference is misleading when identified sets are wide (e.g., weak sign identification) but close to robust inference when additional sign/narrative restrictions make the set narrow."

- title: "Pycia and Woodward (JPE, 2026) - A Case for Pay-as-Bid Auctions"
  file: "Pycia_Woodward_JPE_2026.pdf"
  desc: "This note summarizes the paper, which solves symmetric-information pay-as-bid multiunit auctions by proving a minimum clearing-price boundary condition, essential uniqueness of the pure-strategy equilibrium, and a closed-form bid representation as a weighted average of marginal values over higher quantities (implying bids flatten as supply uncertainty vanishes), then characterizes the seller’s optimal design—deterministic supply and full disclosure of realized supply—and shows that in the seller’s design game optimally designed pay-as-bid auctions raise weakly higher expected revenue than any perfect Bayesian equilibrium of the optimally designed uniform-price auction (where equilibrium multiplicity drives the comparison)."

- title: "Benabou & Tirole (JPE, 2026) - Laws and Norms"
  file: "Benabou_Tirole_JPE_2026.pdf"
  desc: "This note summarizes the paper, which develops a unified theory of prosocial behavior in which agents respond to intrinsic motives, material incentives, and image concerns that generate endogenous honor and stigma (a U-shaped reputational return), derives modified Pigou–Ramsey optimal incentives that subtract zero-sum reputational rents and yield hump-shaped optimal subsidies (highest where social pressure is weakest), and then analyzes expressive law under asymmetric information where the principal’s chosen incentive signals societal values or harm magnitudes—characterizing when equilibrium law should be softened versus toughened and when expressive equilibria separate, pool, or fail."

- title: "Kalyani, Bloom, Carvalho, Hassan, Lerner, and Tahoun (QJE, 2025) - The Diffusion of New Technologies"
  file: "Kalyani_Bloom_Carvalho_Hassan_Lerner_Tahoun_QJE_2025.pdf"
  desc: "This note summarizes the paper, which builds a patent-text–based pipeline to identify novel and influential technologies (novel bigrams filtered via pre-1970 text, citation-normalized influence, and Wikipedia technology screens), dates each technology’s emergence and pioneer locations from early patenting, links technologies to U.S. job postings (Burning Glass) and earnings calls to track economically important technologies, and then documents stylized facts on diffusion—technology jobs diffuse geographically only slowly (multi-decade), pioneer locations retain a long-lived employment advantage especially in high-skill and R&D/production (RDP) jobs, and technologies remain highly skill biased at birth but gradually broaden toward lower-skill “use” jobs."

- title: "Akerman, Gaarder, and Mogstad (QJE, 2015) - The Skill Complementarity of Broadband Internet"
  file: "Akerman_Gaarder_Mogstad_QJE_2015.pdf"
  desc: "This note summarizes the paper, which exploits Norway’s staggered public broadband rollout (2001–2007) to estimate municipality and year fixed-effects intention-to-treat effects on workers and firms, then instruments firm-level broadband adoption with household broadband availability (and availability×covariate interactions) to estimate an IV production function showing broadband is skill-biased technological change—raising the output elasticity and wages/employment of skilled (abstract-task) labor while lowering those of routine/low-skill labor—supported by event-study patterns, Levinsohn–Petrin corrections, placebo tests on always/never adopters, and task-based wage regressions that show broadband complements abstract tasks and substitutes for routine tasks."

- title: "Getmansky Sherman and Tookes (JF, 2022) - Female Representation in the Academic Finance Profession"
  file: "GetmanskySherman_Tookes_JF_2022.pdf"
  desc: "This note summarizes the paper, which builds a new faculty-level panel for finance at top-100 U.S. business schools (2009–2017) by merging Academic Analytics rosters with Scopus publications/citations (plus hand-verified gender, tenure, exits, and FOIA salary data), and estimates year-by-year and career-horizon regressions with cohort and institution controls to document where gender gaps persist—women are underrepresented (especially at top schools), placed at lower-ranked institutions conditional on productivity, less likely to be full professors, publish fewer papers mainly outside top journals, and have smaller/differently structured coauthor networks—while showing some gaps (placement/tenure/salary) narrow over time but the full-professor gap remains."

- title: "Song (RFS, 2020) - Financial Illiteracy and Pension Contributions: A Field Experiment on Compound Interest in China"
  file: "Song_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses a three-arm randomized field experiment in rural China’s New Rural Social Pension Insurance Program to separate the effect of (i) providing pension-benefit calculations from (ii) directly teaching compound interest, estimates intent-to-treat regressions with village and enumerator fixed effects on administrative contribution outcomes showing the compound-interest education treatment raises annual contributions by about 49–53 RMB (vs. ~20–25 RMB for calculations) with stronger effects for initial underestimators and older households, validates the mechanism with post-intervention financial-literacy tests concentrated on compound-interest questions, and then structurally estimates a life-cycle model with an exponential-growth-underestimation bias parameter to run subsidy-versus-education counterfactuals and welfare comparisons."

- title: "Howell, Kuchler, Snitkof, Stroebel, and Wong (JF, 2024) - Lender Automation and Racial Disparities in Credit Access"
  file: "Howell_Kuchler_Snitkof_Stroebel_Wong_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses the Paycheck Protection Program’s fixed terms and 100% government guarantee as a setting where lender decisions are primarily processing/triage rather than risk pricing, estimates cross-lender linear-probability regressions (with rich week×loan-size×ZIP×industry controls) showing Black-owned firms are much more likely to receive PPP loans from highly automated fintechs, and provides causal evidence from within-bank event-study and diff-in-diff designs around small/medium banks’ adoption of automation (software providers) that raises their Black-owned lending shares, complemented by discrimination-channel tests using local racial-animus interactions, quasi-random lender routing evidence from Lendio applications, and relationship-banking checks using Ocrolus bank-statement data."

- title: "Guriev, Melnikov, and Zhuravskaya (QJE, 2021) - 3G Internet and Confidence in Government"
  file: "Guriev_Melnikov_Zhuravskaya_QJE_2020.pdf"
  desc: "This note summarizes the paper, which combines Gallup World Poll microdata for 840k+ individuals in 2,232 subnational regions across 116 countries (2008–2017) with population-weighted 1km-grid maps of 3G coverage to estimate region and year fixed-effects difference-in-differences (and country-year FE) effects of mobile broadband on confidence in government and perceived corruption, validates causality with lead–lag and sharp-expansion event studies, a 2G placebo, and a lightning-strike IV for rollout speed, and then links the attitude effects to political behavior using district-election panels for 102 European parliamentary elections, finding 3G expansion lowers incumbent vote shares and raises populist support especially where the internet is uncensored and traditional media are censored and where actual corruption exposure is high."

- title: "Futia (QJE, 1980) - Schumpeterian Competition"
  file: "Futia_QJE_1980.pdf"
  desc: "This note summarizes the paper, which develops a stochastic Schumpeterian industry model where innovation temporarily concentrates the market and creates rents that are later eroded by imitation and entry, endogenizes the innovation probability via a one-period R&D game, and characterizes long-run concentration and innovative pace using the stationary distribution of a Markov chain over industry size—showing that easier entry reduces long-run concentration but also lowers the payoff to winning innovation races, so the long-run concentration–innovation relationship is positive on average yet can display an inverted-U with innovation peaking at intermediate concentration depending on innovative opportunity and entry conditions."

- title: "De La Roca and Puga (RES, 2017) - Learning by Working in Big Cities"
  file: "DeLaRoca_Puga_RES_2017.pdf"
  desc: "This note summarizes the paper, which uses Spanish administrative matched employer–employee data to estimate a wage equation that separates (i) a static city-size premium from current location, (ii) sorting via worker fixed effects, and (iii) dynamic learning by letting the return to experience depend on where experience was accumulated and whether it is used in big cities, then maps the estimated city effects into short-term versus medium-term city-size elasticities and validates them with an IV strategy for city size based on historical/population-geography instruments and migration event-time checks, finding that big-city experience is highly portable and especially valuable for high-ability workers, so roughly half of the medium-term big-city wage premium reflects learning rather than pure sorting."

- title: "König, Storesletten, Song, and Zilibotti (Econometrica, 2022) - From Imitation to Innovation: Where Is All That Chinese R&D Going?"
  file: "Konig_Storesletten_Song_Zilibotti_Econometrica_2022.pdf"
  desc: "This note summarizes the paper, which structurally estimates an endogenous-growth model that assigns firms to imitation versus innovation based on distance to the frontier and distorted by Hsieh–Klenow-style output wedges, mapping Chinese ASIF manufacturing data (balanced 2007–2012 panel) into innovators (positive R&D) and imitators (zero R&D), recovering TFP and wedges with explicit measurement-error corrections, and fitting key moments on R&D incidence by TFP and size plus subsequent TFP-growth patterns via simulated method of moments (with extensions for heterogeneous innovation costs, industrial-policy tilt, and “fake R&D”), then benchmarking to Taiwanese plant data and running counterfactuals showing that reducing misallocation and improving diffusion can raise long-run TFP growth while indiscriminate R&D subsidies can backfire by pushing low-TFP firms away from high-return imitation."

- title: "Hau, Huang, Lin, Shan, Sheng, Wei (JF, 2024) - FinTech Credit and Entrepreneurial Growth"
  file: "Hau_Huang_Lin_Shan_Sheng_Wei_JF_2024.pdf"
  desc: "This note summarizes the paper, which uses Ant Group’s automated Taobao-vendor credit scoring rule with a discontinuous approval jump at a credit-score cutoff of 480 to implement a fuzzy regression discontinuity / 2SLS design on a near-universe panel of small Chinese e-commerce firms, estimates large local treatment effects of FinTech credit access on sales and transaction growth and customer ratings, and then validates an information-advantage mechanism with heterogeneity (stronger effects for younger/more opaque/less-collateral firms) and operating-channel regressions showing credit raises advertising, product variety, and visitor-to-buyer conversion, supported by density/no-manipulation and placebo-cutoff checks and persistence tests."

- title: "Berg, Burg, Gombovic and Puri (RFS, 2020) - On the Rise of FinTechs: Credit Scoring Using Digital Footprints"
  file: "Berg_Burg_Gombovic_Puri_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses transaction-level data from a German e-commerce “buy-now-pay-later” setting (goods shipped before payment) to show that a handful of low-cost digital-footprint variables (device/OS, e-mail host/structure, channel, checkout time, and typing/error markers) predict default about as well as a traditional credit-bureau score and strongly complement it, estimating logistic default-scoring models evaluated by AUC with extensive out-of-sample/out-of-time and alternative-default/LGD robustness plus an external-validity test predicting future bureau-score changes, and then exploits the firm’s October 19, 2015 adoption of footprint-based scoring to document a sharp fall in defaults and a reshuffling (not simple contraction) of credit access—especially improving screening for previously unscorable customers."

- title: "Cornaggia, Mao, Tian, and Wolfe (JFE, 2015) - Does Banking Competition Affect Innovation?"
  file: "Cornaggia_Mao_Tian_Wolfe_JFE_2015.pdf"
  desc: "This note summarizes the paper, which exploits staggered U.S. interstate branching deregulation (Rice–Strahan restrictions index after IBBEA) as a quasi-natural experiment for banking competition, estimates state and year fixed-effects panel regressions of future 3-year patent counts and citations (from NBER patents) on branching restrictions with event-time and randomization-placebo tests, and then unpacks mechanisms by separating public corporations versus private firms and running interaction designs for private firms’ external-finance dependence and prior out-of-state borrowing (DealScan) plus acquisition-based tests showing deregulation reduces public-firm innovation by shrinking the pool of innovative targets while increasing innovation for constrained private firms."

- title: "Kacperczyk, Sialm & Zheng (RFS, 2008) - Unobserved Actions of Mutual Funds"
  file: "Kacperczyk_Sialm_Zheng_RFS_2008.pdf"
  desc: "This note summarizes the paper, which- uses CRSP mutual-fund data merged with Thomson Reuters holdings and a manager panel (1980–2005) to construct holdings-based Timing and Picking skill measures, estimates panel and quantile regressions (plus same-fund and manager fixed-effect tests) showing skilled managers shift from stock picking in expansions to market timing in recessions, and builds a real-time recession-weighted Skill Index that predicts future risk-adjusted fund alpha."

- title: "Aghion, Bloom, Blundell, Griffith, and Howitt (QJE, 2005) - Competition and Innovation: An Inverted-U Relationship"
  file: "Aghion_Bloom_Blundell_Griffith_Howitt_QJE_2005.pdf"
  desc: "This note summarizes the paper, which combines a step-by-step Schumpeterian model (escape-competition vs. laggard discouragement) with a U.K. industry panel (1973–1994) to estimate an inverted-U relationship between product-market competition (1 − Lerner index from firm markups) and innovation (citation-weighted patents), using Poisson industry-year regressions with industry and year fixed effects and an endogeneity correction via a policy-instrument control function based on Thatcher privatizations, the EU Single Market Programme, and MMC interventions, and then validates the mechanism with technology-gap (“neck-and-neck”) measures from TFP showing competition widens gaps and the inverted-U is steeper in more neck-and-neck industries."

- title: "Young (QJE, 2000) - The Razor’s Edge: Distortions and Incremental Reform in the People’s Republic of China"
  file: "Young_QJE_2000.pdf"
  desc: "This note summarizes the paper, which argues that China’s incremental post-1978 reforms devolved planning power to local governments and thereby generated new distortions—industrial duplication, local protectionism, and internal market fragmentation—documented through province-level convergence in output structure, rising/intermittently high interregional price dispersion from multiple retail/industrial/agricultural price panels, a variance decomposition showing output-share convergence alongside divergence in relative productivities and labor allocations, and agriculture-weather comparative-advantage regressions showing provinces with better rainfall-based farming conditions increasingly withdrew labor and complementary inputs from agriculture."

- title: "Faber (RES, 2014) - Trade Integration, Market Size, and Industrialization: Evidence from China’s National Trunk Highway System"
  file: "Faber_RES_2014.pdf"
  desc: "This note summarizes the paper, which uses China’s National Trunk Highway System (1992 plan; major buildout 1998–2003) as a trade-integration shock between huge metropolitan “nodes” and much smaller peripheral counties, estimates province-FE county difference-in-differences regressions of 1997–2006 growth outcomes for connected versus nonconnected peripheral counties, instruments for endogenous route placement with two cost-minimizing counterfactual networks (a least-cost-path spanning tree and a Euclidean spanning tree), and then tests mechanisms with placebo pre-network periods, neighbor/urbanization spillover checks, distance-to-highway gradients, and core-periphery heterogeneity (initial size and remoteness), finding that NTHS connection reduced peripheral industrial/GDP/revenue growth consistent with market-size asymmetry and increased core competition."

- title: "Atkeson and Burstein (JPE, 2010) - Innovation, Firm Dynamics, and International Trade"
  file: "Atkeson_Burstein_JPE_2010.pdf"
  desc: "This note summarizes the paper, which builds a two-country heterogeneous-firm general-equilibrium trade model with fixed and iceberg trade costs, endogenous export and exit decisions, and two innovation margins—incumbent process innovation (firm productivity dynamics) and entrant product innovation (free entry)—derives an analytical decomposition showing that in several key special cases the first-order indirect effect of trade-cost reductions on aggregate productivity is pinned down (and can be zero when research uses only labor) because free entry adjusts the mass of products to keep expected entry value at zero, and then calibrates the model to U.S. firm-dynamics and trade moments to show large micro reallocations in average-firm productivity can coexist with only modest additional welfare gains over benchmark trade models due to offsetting entry responses and very slow transition dynamics."

- title: "Giroud (QJE, 2013) - Proximity and Investment: Evidence from Plant-Level Data"
  file: "Giroud_QJE_2013.pdf"
  desc: "This note summarizes the paper, which uses U.S. Census plant-level data (1977–2005) matched to airline-route introductions that reduce headquarters–plant travel time to implement a plant fixed-effects difference-in-differences and event-time design (with leave-one-out MSA-year and firm-year controls and hub/merger/same-leg robustness), finding that improved HQ access raises plant investment by about 8–9% and TFP by about 1.3–1.4% with no pretrends and stronger effects when headquarters is more time-constrained and in earlier years, and complements the intensive-margin results with extensive-margin regressions showing constrained HQs open plants closer and close more distant plants while firms’ location choices become more remote over time."

- title: "Henderson, Squires, Storeygard, and Weil (QJE, 2018) - The Global Distribution of Economic Activity: Nature, History, and the Role of Trade"
  file: "Henderson_Squires_Storeygard_Weil_QJE_2018.pdf"
  desc: "This note summarizes the paper, which combines global nighttime-lights data on a quarter-degree grid (2010) with rich first-nature geography (base, agriculture, and trade/coastal-access blocks) and country-level measures of development timing (schooling/urbanization/GDP per capita in 1950) to estimate cross-sectional and country–fixed-effect regressions of log lights, uses Shapley decompositions and data-driven early–late sample splits to show agricultural geography explains far more within-country activity in early agglomerators while trade-access geography matters relatively more in late agglomerators (consistent with urban persistence and the timing of falling transport costs), and links this to spatial-inequality outcomes via lights and education Gini regressions."

- title: "Goldberg, Khandelwal, Pavcnik, and Topalova (AER, 2009) - Trade Liberalization and New Imported Inputs"
  file: "Goldberg_Khandelwal_Pavcnik_Topalova_AER_2009.pdf"
  desc: "This note summarizes the paper, which uses Indian customs microdata (HS8 aggregated to conservative HS6) from 1987–2000 around the 1991 liberalization to decompose import growth into new products, new source-country varieties within existing products, and the intensive margin, classifies goods by end use (inputs vs final goods) and OECD vs non-OECD origin, and then computes Feenstra/Broda–Weinstein variety indices for machinery to show that most post-reform import growth—especially for production inputs—came from the extensive margin and that variety expansion substantially lowered the effective imported-input price index."

- title: "Harris and Gurel (JF, 1986) - Price and Volume Effects Associated with Changes in the S&P 500 List: New Evidence for the Existence of Price Pressures"
  file: "Harris_Gurel_JF_1986.pdf"
  desc: "This note summarizes the paper, which uses S&P 500 additions and (a small clean sample of) deletions from 1973–1983 as plausibly information-free demand shocks from index-fund rebalancing, measures abnormal trading with standardized volume ratios and abnormal returns with market-model event studies split into an early (1973–1977) and index-fund era (1978–1983), and then tests competing hypotheses by showing a large day-1 price increase and volume surge for additions in the late period followed by a statistically supported full reversal over the next 2–3 weeks (with little pre-announcement anticipation) while trading volume remains persistently higher—evidence favoring temporary price pressure over permanent imperfect-substitutes or information/certification explanations."

- title: "Shleifer (JF, 1986) - Do Demand Curves for Stocks Slope Down?"
  file: "Shleifer_JF_1986.pdf"
  desc: "This note summarizes the paper, which uses S&P 500 additions (1966–1983, with a cleaner post-1976 announcement-timing subsample) as plausibly exogenous demand shocks from index-fund buying, estimates market-model event-study abnormal returns and persistence windows showing a large, nonreversing announcement-date price jump, and supports a downward-sloping stock-demand interpretation with time-series (larger effects as indexing grows) and cross-sectional quantity evidence (bigger abnormal volume → bigger price impact; higher usual volume → smaller impact) while testing and largely rejecting certification/liquidity alternatives using bond-rating and Fortune-500 comparisons."

- title: "Santacreu (JPE, 2025) - Dynamic Gains from Trade Agreements with Intellectual Property Provisions"
  file: "Santacreu_JPE_2025.pdf"
  desc: "This note summarizes the paper, which combines bilateral royalty-payment data (OECD services) and an RTA database distinguishing agreements with IP provisions to motivate a multicountry dynamic trade-and-growth model with innovation, international technology adoption/licensing, and Nash-bargained royalty shares pinned down by IP enforcement, calibrates trade costs and productivity via trade gravity and identifies adoption/IP parameters via royalty gravity and patent-rights data, and then solves for the Nash-bargaining US–China “deep” trade agreement (tariffs + stronger IP enforcement) and a suite of counterfactuals (tariff-only, IP-only, unilateral reform, Nash trade war, gradual/anticipated implementation, deviation/retaliation) to quantify dynamic welfare and transition paths—showing immediate U.S. gains but short-run Chinese losses that reverse only later as growth rises."

- title: "Fisman (AER, 2001) - Estimating the Value of Political Connections"
  file: "Fisman_AER_2001.pdf"
  desc: "This note summarizes the paper, which estimates the market value of political connections in Suharto-era Indonesia by constructing a firm-level Suharto Dependency Index for 79 listed group affiliates and running event studies around six Suharto-health rumor episodes, using event-specific cross-sectional return regressions and a pooled interaction design that scales the dependence effect by an event-severity measure (the Jakarta index net of regional market moves), and then extrapolating from the estimated interaction to quantify how much connected firms’ valuations would fall under a large regime-break shock, while validating robustness to thin trading, generic “bad-news beta,” event-window choice, and nonlinear dependence specifications."

- title: "Agarwal and Hauswald (RFS, 2010) - Distance and Private Information in Lending"
  file: "Agarwal_Hauswald_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses a loan-application panel from a large U.S. bank (2002–2003) with geocoded bank/competitor distances and the bank’s proprietary credit score to construct a soft private-information proxy (the residual “Subjective Credit Assessment” after purging public credit scores), estimates logit/OLS models for loan offers, APRs, borrower switching, and delinquency showing that raw distance effects on credit access and pricing largely vanish once private information is included, and provides direct tests that information quality deteriorates with distance (higher switching at the periphery and higher delinquency plus weaker predictive power of the private signal), concluding that distance matters mainly through local soft information and the bank’s strategic use of informational rents."

- title: "Bonaparte and Kumar (JFE, 2013) - Political Activism, Information Costs, and Stock Market Participation"
  file: "Bonaparte_Kumar_JFE_2013.pdf"
  desc: "This note summarizes the paper, which combines detailed U.S. Pew/PSRA survey data with SCF-imputed measures of wealth and risk tolerance to show, in probit stock-market participation regressions, that politically active households are more likely to hold stocks. The paper strengthens identification with an IV strategy based on plausibly exogenous geographic exposure to politics, including battleground-state residence and campaign intensity, extends the evidence with state-level and cross-country turnout-participation correlations as well as robustness checks in the NLSY and CPS, and supports the information-cost mechanism by showing that politically active households consume more news, seek investment information more frequently, and exhibit greater economic and market knowledge."

- title: "Acharya and Subramanian (RFS, 2009) - Bankruptcy Codes and Innovation"
  file: "Acharya_Subramanian_2009_RFS.pdf"
  desc: "This note summarizes the paper, which links cross-country changes in bankruptcy creditor rights (Djankov–McLiesh–Shleifer index, 1978–2002) to innovation using USPTO patent counts, citations, and patenting-firm measures, estimating country/patent-class/year fixed-effects difference-in-differences around 12 creditor-rights reforms and a Rajan–Zingales-style interaction design where stronger creditor rights disproportionately reduce innovation in industries with higher U.S.-benchmarked innovation intensity, reinforced by a reform-based triple-difference mechanism test, and then connects the channel to finance and growth with G7 firm-level leverage regressions and industry value-added growth regressions showing innovative sectors lever less and grow more slowly in creditor-friendly regimes."

- title: "Gao, Ru, and Tang (JFE, 2021) - Subnational Debt of China: The Politics-Finance Nexus"
  file: "Gao_Ru_Tang_JFE_2021.pdf"
  desc: "This note summarizes the paper, which uses Chinese regulatory loan-level data on LGFV borrowing from 19 major banks (2007–2013) and political-rank differences across lenders to test selective default, estimating baseline and distressed-city-year fixed-effects default regressions that compare the same borrower (firm-year) across the China Development Bank (ministerial rank) versus commercial banks, validating the political channel with a difference-in-differences around the 2008 CDB commercialization reform that weakened its political power and with politician-term promotion regressions showing CDB defaults (but not commercial-bank defaults) reduce local officials’ promotion odds, and further tightening the mechanism with heterogeneity by borrower and politician rank/Politburo connections."

- title: "Coval and Moskowitz (JPE, 2001) - The Geography of Investment: Informed Trading and Asset Prices"
  file: "Coval_Moskowitz_JPE_2001.pdf"
  desc: "This note summarizes the paper, which uses U.S. mutual-fund holdings and transactions (CDA tapes, 1975–1994) matched to fund and firm headquarters locations to define “local” stocks (within 100 km), computes characteristic-adjusted portfolio returns to show local holdings outperform distant holdings and local stocks held outperform local stocks nearby-but-not-held, and uses local buy–sell portfolios, lagged-holdings persistence tests, fund-heterogeneity sorts (small/old/focused/remote funds), and stock-level Fama–MacBeth regressions and local-ownership long–short portfolios (plus turnover and herding tests) to link geographic proximity to an information advantage that is priced in expected returns—especially among small firms."

- title: "Berk and van Binsbergen (JFE, 2015) - Measuring Skill in the Mutual Fund Industry"
  file: "Berk_vanBinsbergen_JFE_2015.pdf"
  desc: "This note summarizes the paper, which defines mutual-fund manager skill as dollar value added—benchmark-adjusted gross return times lagged AUM—rather than net/gross alpha, constructs feasible tradable benchmarks from Vanguard index funds (contrasted with Fama–French–Carhart factors), and tests for skill using long-horizon out-of-sample persistence and exact order-statistic inference, finding economically large positive average value added with near-zero investor net alpha and showing investors allocate more capital (higher compensation) to skilled funds while gross alpha is a poor proxy for skill."

- title: "Ferreira, Manso, and Silva (RFS, 2014) - Incentives to Innovate and the Decision to Go Public or Private"
  file: "Ferreira_Manso_Silva_RFS_2014.pdf"
  desc: "This note summarizes the paper, which develops a two-period theory of public versus private ownership in which an insider chooses between exploitation and exploration projects under liquidity shocks and asymmetric information, showing that private opacity creates a tolerance-for-failure channel (insiders can sell after bad news at pooled prices) that raises equilibrium innovation, while public transparency creates short-termism (early success is quickly priced and can be cashed out) that tilts choices toward safer conventional projects, and characterizes the ownership choice by trading off the innovation advantage of private firms against the capital-cost and liquidity advantages of public markets (with an extension where illiquid private securities weaken private ownership), interpreting the technology-tree, timing, and equilibrium-innovation figures and the paper’s testable predictions throughout."

- title: "Petersen and Rajan (JF, 2002) - Does Distance Still Matter? The Information Revolution in Small Business Lending"
  file: "Petersen_Rajan_JF_2002.pdf"
  desc: "This note summarizes the paper, which uses the 1993 (and validation with 1988) NSSBF to build a synthetic panel of U.S. small-firm lending relationships formed from 1973–1993, estimates cohort regressions of log(1+distance) to the lender and the probability of impersonal communication (phone/mail vs. in-person) on relationship-start year with rich firm/loan/lender controls and within-firm fixed effects, rejects alternative explanations such as bank consolidation, changing loan mix, deposit-market deregulation, and weaker underwriting, and links the secular rise in distance and decline in face-to-face contact to improvements in lending technology by showing regional declines in bank employees per dollar of output/loans explain most of the trend and that the credit-quality signal embedded in “predicted distance/communication” weakens over time as distant credit becomes available to a broader set of firms."

- title: "Gopinath et al. (QJE, 2017) - Capital Allocation and Productivity in South Europe"
  file: "Gopinath_KalemliOzcan_Karabarbounis_VillegasSanchez_QJE_2017.pdf"
  desc: "This note summarizes the paper, which uses ORBIS-AMADEUS data on (mostly private) Spanish manufacturing firms (1999–2012) to document a sharp rise in within-industry dispersion of MRPK but not MRPL and a decline in TFP relative to its efficient (Hsieh–Klenow) benchmark, then explains these facts with a calibrated dynamic heterogeneous-firm model featuring capital adjustment costs and a size-dependent borrowing constraint in which the euro-era fall in real interest rates channels capital toward high-net-worth firms rather than high-productivity firms, generating rising MRPK dispersion and worsening allocative efficiency while matching micro moments on leverage–size gradients and net-worth-driven capital growth and passing large-firm and nested-model robustness tests."

- title: "Xu (AER, 2018) - The Costs of Patronage: Evidence from the British Empire"
  file: "Xu_AER_2018.pdf"
  desc: "This note summarizes the paper, which digitizes British Colonial Office personnel and fiscal records (456 governors across 70 colonies, 1854–1966) and measures governor–superior social ties using predetermined ancestry/peerage/elite-school links to estimate within-governor (and within governor×colony) fixed-effects regressions that exploit Secretary-of-State turnover as shocks to connectedness, shows connected governors receive higher pay mainly via promotion to higher-salary colonies (not within-post raises) and—conditional on holding the same colony—collect about 4% less revenue (especially customs) and cut revenue-service/public-works spending, and validates patronage causality with a difference-in-differences break around the 1930 Warren Fisher Reform (appointments board) that eliminates both the promotion premium and the performance penalty."

- title: "Azmat and Ferrer (JPE, 2017) - Gender Gaps in Performance: Evidence from Young Lawyers"
  file: "Azmat_Ferrer_JPE_2017.pdf"
  desc: "This note summarizes the paper, which uses the After the JD longitudinal survey of U.S. lawyers admitted in 2000 to study direct profession-standard performance measures—annual hours billed and new client revenue in 2006—and estimates performance, earnings, and 2012 partnership regressions on a female indicator with rich demographic, firm, and ability-proxy controls plus mechanism interactions, showing large gender gaps in billed hours and especially client origination that are not explained by target billable hours or measured discrimination channels, but are strongly linked to young children (for billed hours) and partner aspirations/career concerns (for client revenue), and that these performance differences explain a substantial share of the gender gaps in annual earnings and promotion (with little gender difference in returns to performance)."

- title: "Hombert and Matray (JF, 2018) - Can Innovation Help U.S. Manufacturing Firms Escape Import Competition from China?"
  file: "Hombert_Matray_JF_2018.pdf"
  desc: "This note summarizes the paper, which asks whether ex ante innovation makes U.S. manufacturing firms more resilient to the China import shock by estimating firm×year panel regressions of sales growth, ROA, capex, and employment on lagged Chinese import penetration and its interaction with a firm’s lagged R&D capital stock, instrumenting import penetration with Chinese import growth in other high-income countries and instrumenting firm R&D with state R&D tax-credit–induced user-cost variation weighted by inventor locations (then building R&D stock via perpetual inventory), and validates a product-differentiation mechanism using Hoberg–Phillips text-based differentiation measures and triple-interaction industry tests plus PNTR and input-competition robustness."

- title: "Stein (JF, 2002) - Information Production and Capital Allocation: Decentralized versus Hierarchical Firms"
  file: "Stein_JF_2002.pdf"
  desc: "This note summarizes the paper, which builds a two-division capital-allocation model with empire-building managers and an external financing constraint to compare decentralized versus hierarchical firms, shows that with soft (nonverifiable) information hierarchy can weaken line-manager research incentives because CEOs may reallocate budgets away from informed divisions (so decentralization can deliver higher information production and sometimes higher output), but with hard (verifiable) information the result reverses because documented good news lets division managers advocate for larger internal budgets (so hierarchy both reallocates capital better and induces more research), and draws implications for flatter organizations, endogenous bureaucracy, and bank consolidation’s impact on relationship lending."

- title: "Melitz (Econometrica, 2003) - The Impact of Trade on Intra-Industry Reallocations and Aggregate Industry Productivity"
  file: "Melitz_Econometrica_2003.pdf"
  desc: "This note summarizes the paper, which extends the Krugman (1980) monopolistic-competition trade model by adding Hopenhayn-style firm heterogeneity with sunk entry, fixed operating costs, and fixed/iceberg export costs, derives domestic survival and exporter productivity cutoffs pinned down by zero-cutoff-profit and free-entry conditions with a tractable sufficient-statistic “average productivity” index, and shows that opening to trade (or further liberalization via more partners/lower trade costs/lower export fixed costs) raises the domestic cutoff, forces the least productive firms to exit, reallocates market shares toward more productive firms and exporters, and thereby increases aggregate industry productivity and welfare beyond pure variety gains."

- title: "Garmaise and Moskowitz (RFS, 2004) - Confronting Information Asymmetries: Evidence from Real Estate Markets"
  file: "Garmaise_Moskowitz_RFS_2004.pdf"
  desc: "This note summarizes the paper, which uses COMPS commercial real-estate transactions (10,351 U.S. property sales, 1996–1999) and a direct jurisdiction-level information-quality measure—the property-tax assessment coefficient of dispersion (COD) from state ratio studies—to test adverse-selection predictions by estimating regressions of buyer distance (limited participation) and property age (selective offering) on COD with rich local-heterogeneity and price-growth controls, plus logit/Klein–Spady segmentation tests showing broker sellers disproportionately trade with broker buyers when COD is high, and then runs financing and signaling regressions for vendor-to-buyer financing, bank mortgages, and cap rates that deliver weak/mixed support, concluding that markets respond to information asymmetry mainly by who trades and what gets traded rather than by financing design."

- title: "Adda, Dustmann, and Stevens (JPE, 2017) - The Career Costs of Children"
  file: "Adda_Dustmann_Stevens_JPE_2017.pdf"
  desc: "This note summarizes the paper, which combines German administrative wage/employment histories (IABS) with survey data on fertility, marriage, and savings (GSOEP/EVS) to structurally estimate (by simulated method of moments) a dynamic life-cycle model in which women choose early-career apprenticeship occupation, fertility timing, labor supply, marriage, and savings under occupation- and career-stage–dependent skill accumulation and atrophy, using regional×cohort training-position shortages as occupation-cost shifters and hundreds of wage/interruptions/fertility/savings moments to identify depreciation and preferences, and then decomposes the total career cost of children—about 35% of discounted lifetime income—into labor-supply losses versus wage losses from reduced human capital and pre-birth occupational sorting, with policy counterfactuals (birth transfers) showing large short-run timing effects but modest completed-fertility changes."

- title: "Brown, Martinsson, and Petersen (JF, 2013) - Law, Stock Markets, and Innovation"
  file: "Brown_Martinsson_Petersen_JF_2013.pdf"
  desc: "This note summarizes the paper, which uses a firm-level Rajan–Zingales interaction design on ~5,300 non-U.S. public firms in 32 countries (1990–2007) to test whether legal institutions and stock market access spur innovation by interacting a U.S.-benchmarked industry external-finance dependence measure with country-level equity-access proxies (e.g., equity issuance, IPOs/GDP, accounting standards) and contrasting them with credit-market depth, estimates OLS and 2SLS specifications with country and industry fixed effects (instrumenting equity access with legal origin, enforcement, and anti-self-dealing protection), and shows that equity access significantly raises long-run R&D intensity—especially for small and young firms—while having little effect on fixed investment, with supporting mechanism regressions linking investor protection to greater stock issuance and weaker R&D–cash-flow dependence plus downstream effects on intangible assets and productivity growth."

- title: "Goldin (AER, 2014) - A Grand Gender Convergence: Its Last Chapter"
  file: "Goldin_AER_2014.pdf"
  desc: "This note summarizes the paper, which argues that the “last chapter” of gender convergence hinges on job structure—specifically whether earnings are convex in hours and whether workers are good substitutes—by combining U.S. Census/ACS synthetic-cohort life-cycle earnings profiles, within-occupation residual gender-gap regressions, occupation-level hours elasticities and O*Net measures of time pressure/interpersonal dependence/structure, and detailed professional evidence for MBAs, lawyers, and pharmacists to show that the gender gap opens mainly after labor-market entry and is largest in occupations (business/law) with strong long-hours premia and costly temporal flexibility, but is much smaller in more substitutable/linear-pay occupations (especially pharmacy)."

- title: "Card, Cardoso, and Kline (QJE, 2016) - Bargaining, Sorting, and the Gender Wage Gap: Quantifying the Impact of Firms on the Relative Pay of Women"
  file: "Card_Cardoso_Kline_QJE_2016.pdf"
  desc: "This note summarizes the paper, which uses Portuguese matched employer–employee data (Quadros de Pessoal, 2002–2009) linked to firm financials (SABI) to estimate separate gender-specific AKM two-way fixed-effects wage models, normalizes firm effects using a low-surplus (value-added-per-worker) “zero-rent” threshold, and applies an Oaxaca-style decomposition to split the firm component of the gender wage gap into sorting (women underrepresented at high-premium firms) and bargaining/rent-sharing (women capture a smaller share of firm surplus), validating the bargaining channel by regressing firm premiums and within-firm wage changes on excess value added and showing women receive about 88–90% of men’s rent-sharing gains."

- title: "Chevalier and Ellison (JF, 1999) - Are Some Mutual Fund Managers Better than Others? Cross-Sectional Patterns in Behavior and Performance"
  file: "Chevalier_Ellison_JF_1999.pdf"
  desc: "This note summarizes the paper, which uses Morningstar fund data for single-manager U.S. growth and growth-and-income funds (1988–1994) to relate performance to observable manager characteristics (undergrad-institution SAT score, MBA, age, tenure), estimating raw excess-return regressions and then progressively more demanding risk-adjusted (market-model and Carhart four-factor) performance regressions with controls for expenses, turnover, fund size, and investment-style loadings, addressing survivorship with fund/manager survival probits and a Heckman-style correction (and instrumenting expenses/turnover with lags), and concludes that the most robust predictor of higher risk-adjusted performance is manager undergraduate-institution SAT while the MBA “outperformance” largely reflects higher beta and the youth effect is partly selection-driven."

- title: "Campbell (JF, 2006) - Household Finance"
  file: "Campbell_JF_2006.pdf"
  desc: "This note summarizes the paper, which lays out a research agenda for household finance by framing key household decisions—risky-asset participation and allocation, portfolio diversification, and mortgage choice/refinancing—as a gap between positive (what households do in SCF/HRS/brokerage/401(k) data and Swedish administrative registers) and normative (Merton-style intertemporal portfolio and mortgage models with labor income, housing, borrowing constraints, and taxes) benchmarks, documents core empirical patterns of nonparticipation, underdiversification, and refinancing failures with welfare-loss metrics and demographic gradients in sophistication, and proposes equilibrium mechanisms in retail financial markets (hidden fees and cross-subsidies from naive to sophisticated households) that can slow product innovation and motivate policy tools such as disclosure, default options, regulation, and “financial hygiene” interventions."

- title: "Peress (JF, 2014) - The Media and the Diffusion of Information in Financial Markets: Evidence from Newspaper Strikes"
  file: "Peress_JF_2014.pdf"
  desc: "This note summarizes the paper, which identifies the causal role of mass media in information diffusion by using national newspaper strikes as exogenous media blackouts (52 strikes/88 strike days across France, Greece, Italy, and Norway, 1989–2010), implements country-day event studies (Patell/Corrado tests) on turnover, intraday range, and cross-sectional return dispersion (from Compustat Global) plus size-quintile heterogeneity showing effects are concentrated in small/retail-held stocks, and distinguishes delayed news incorporation from noise reduction using return-autocorrelation regressions (weaker same-day and stronger next-day predictability on strike days), corroborated by out-of-sample local U.S. city-strike evidence on retail dollar trading."

- title: "Cookson, Fox, Gil-Bazo, Imbet, and Schiller (JFE, 2026) - Social media as a bank run catalyst"
  file: "Cookson_Fox_GilBazo_Imbet_Schiller_JFE_2026.pdf"
  desc: "This note summarizes the paper, which combines comprehensive Twitter cashtag data (2020–Mar 2023) with bank balance-sheet run-risk measures (% uninsured deposits × mark-to-market losses), intraday stock returns, and FDIC call-report deposit flows to test whether pre-existing Twitter exposure amplifies the March 2023 SVB-style run, estimating cross-sectional triple-interaction regressions showing higher pre-exposure predicts larger run-period stock losses and uninsured deposit outflows especially for high-run-risk banks, and corroborating the coordination mechanism with hourly panel regressions using lagged tweet attention and tweet-level event studies showing immediate price impacts of run/contagion/tech-community tweets, while distinguishing attention/retweet propagation from sentiment (negative sentiment does not explain differential run vulnerability)."

- title: "van Rooij, Lusardi, and Alessie (JFE, 2011) - Financial Literacy and Stock Market Participation"
  file: "vanRooij_Lusardi_Alessie_JFE_2011.pdf"
  desc: "This note summarizes the paper, which uses special 2005–2006 modules of the Dutch DNB Household Survey to construct latent basic and advanced financial literacy indices via factor analysis on randomized-wording quiz questions, estimates stock market participation (stocks/mutual funds) regressions showing advanced literacy strongly predicts participation beyond education, income, and wealth, addresses endogeneity and measurement error with a GMM-IV design that instruments advanced literacy using family-experience variables (oldest sibling’s relative financial condition and parents’ financial understanding), and conducts extensive robustness checks with peer-composition controls, alternative cognition proxies (euro/health-insurance reform difficulty), and risk-aversion controls, concluding that financial literacy acts like a reduction in information/participation costs and has an independent causal role in stock market entry."

- title: "Keys, Pope, and Pope (JFE, 2016) - Failure to Refinance"
  file: "Keys_Pope_Pope_JFE_2016.pdf"
  desc: "This note summarizes the paper, which uses a nationally representative CoreLogic loan-level panel of ~1M mortgages active in December 2010 to compute borrower-specific refinancing gains and an Agarwal–Driscoll–Laibson optimal-refinancing threshold (accounting for taxes, discounting, mobility, and option value), applies a conservative eligibility screen based on origination FICO/LTV, pristine payment history, and updated current LTV/CLTV to estimate that about 20% of borrowers who should refinance fail to do so—leaving large median monthly and present-value savings on the table—documents broad-based heterogeneity and weak links to local lender concentration, and validates the behavioral interpretation with micro evidence from a nonprofit lender’s preapproved zero-cash-upfront mail campaigns (low 13–24% take-up) and follow-up surveys consistent with inattention/procrastination/misunderstanding."

- title: "Bikhchandani, Hirshleifer, and Welch (JPE, 1992) - A Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades"
  file: "Bikhchandani_Hirshleifer_Welch_JPE_1992.pdf"
  desc: "This note summarizes the paper, which develops a general sequential social-learning model where agents observe predecessors’ actions but not signals, proves an informational cascade almost surely starts under monotone likelihood ratio and no-long-run-ties conditions (so individuals eventually ignore private information and follow the crowd), shows cascades can be mistaken and are intrinsically fragile because later imitators stop adding information so even small public signals can overturn long-lived conformity, analyzes “fashion leader” effects when early movers have higher precision, and extends the framework to allow value changes to demonstrate fads—behavior can reverse more often than fundamentals."

- title: "Guiso, Sapienza, and Zingales (JF, 2008) - Trusting the Stock Market"
  file: "Guiso_Sapienza_Zingales_JF_2008.pdf"
  desc: "This note summarizes the paper, which models stockholding as a portfolio choice with an additional cheating-risk (mistrust) probability that lowers the effective expected return and, when combined with fixed participation costs, sharply raises the wealth threshold for entering the stock market, then tests the theory using Dutch household survey data with direct measures of generalized trust plus specially designed measures of risk aversion, ambiguity aversion, optimism, and stock-return expectations, estimating probit/Tobit/Poisson regressions for (i) direct stock and risky-asset participation, (ii) portfolio shares, and (iii) diversification (number of stocks) and insurance-demand “horse races” that distinguish trust from risk tolerance, corroborates the mechanism with Italian bank-customer data on personalized trust in one’s banker, and extends to cross-country regressions linking higher trust to greater participation and lower ownership concentration, interpreting the core calibrated thresholds, micro coefficients, and cross-country patterns throughout."

- title: "Engelberg and Parsons (JF, 2011) - The Causal Impact of Media in Financial Markets"
  file: "Engelberg_Parsons_JF_2011.pdf"
  desc: "This note summarizes the paper, which identifies the causal impact of media on retail trading by holding S&P 500 earnings announcements fixed and exploiting cross-city variation in whether a local newspaper covers the same event, estimating city×firm×date panel regressions of local trading volume (and buy/sell splits) on local coverage with rich firm and surprise controls plus increasingly saturated firm–city, firm–date, and city–date fixed effects, and validating transmission using extreme-weather delivery disruptions and day-by-day timing falsification tests (only same-day coverage predicts same-day trading), concluding that local media coverage causally raises local trading by roughly 8%–50% depending on specification."

- title: "Kirilenko, Kyle, Samadi, and Tuzun (JF, 2017) - The Flash Crash: High-Frequency Trading in an Electronic Market"
  file: "Kirilenko_Kyle_Samadi_Tuzun_JF_2017.pdf"
  desc: "This note summarizes the paper, which uses account-level CME audit-trail transactions for the June 2010 E-mini S&P 500 futures (May 3–6, 2010) to classify traders based on pre-crash inventory and volume behavior into HFTs, Market Makers, Fundamental Buyers/Sellers, Opportunistic Traders, and Small Traders, then estimates second-by-second inventory–price-change regressions and Flash-Crash interaction specifications, inventory-bound calculations, and event-time/quote-change participation designs to distinguish textbook inventory intermediation from stale-quote sniping, finding that HFTs had tightly bounded inventories and their aggressive trades systematically preceded short-horizon price moves (consistent with quote sniping/latency arbitrage) while Market Makers exhibited classic contrarian inventory dynamics and changed behavior during the crash, implying limited risk-bearing capacity and nontraditional “liquidity provision” during the Flash Crash."

- title: "Colliard, Foucault, and Lovo (RFS, 2026) - Algorithmic Pricing and Liquidity in Securities Markets"
  file: "Colliard_Foucault_Lovo_RFS_2026.pdf"
  desc: "This note summarizes the paper, which embeds Q-learning “algorithmic market makers” in a Glosten–Milgrom dealer market (and a no-adverse-selection control treatment) and uses large-scale computational experiments to show that learning dealers quickly avoid being overpriced but fail to learn to compete all the way down to the competitive price because the gains from small undercuts have low signal-to-noise while experimentation decays and rivals’ learning creates strategic uncertainty, leading to persistently supra-competitive quotes and positive realized spreads even without adverse selection, with comparative statics showing spreads widen when profit volatility rises (higher σ liquidity-shock dispersion, higher Δv payoff volatility), entry generally reduces spreads, and tick-size reductions can backfire unless exploration is rescaled—along with state-dependent asymmetries to shocks and a two-period extension where rare states are least competitive."

- title: "Brown, Ivkovic, Smith, and Weisbenner (JF, 2008) - Neighbors Matter: Causal Community Effects and Stock Market Participation"
  file: "Brown_Ivkovic_Smith_Weisbenner_JF_2008.pdf"
  desc: "This note summarizes the paper, which uses a 1987–1996 IRS taxpayer panel to measure taxable stockholding via dividend reporting, estimates a household fixed-effects IV design on native nonmovers where community (MSA) participation is instrumented by the lagged average stock ownership in the birth states of nonnative neighbors, and finds large causal community effects—roughly a 4.2pp increase in own participation for a 10pp increase in community participation—strengthened by mechanism evidence from sociability interactions and supported by rich household/community controls and state-year fixed effects that address sorting and common shocks."

- title: "Veldkamp (AER, 2006) - Media Frenzies in Markets for Financial Information"
  file: "Veldkamp_AER_2006.pdf"
  desc: "This note summarizes the paper, which builds a dynamic asset-pricing model with a competitive information market where information has high fixed cost and near-zero marginal cost so its price falls when more investors demand it (creating information-demand complementarities), generating regime switches between low-information/low-price and high-information/high-price states (“media frenzies”) and, with multiple markets and limited attention, information crowd-out that concentrates news in a subset of markets and produces excess cross-market price dispersion (“herding through the news market”), and then tests the theory in a 23-country emerging-markets weekly panel (1989–2002) by showing payoff volatility (instrumented with dividends) predicts Financial Times story counts, news predicts higher prices and price–dividend ratios (with Granger/3SLS support), and news predicts higher cross-market price dispersion"

- title: "Banerjee (QJE, 1992) - A Simple Model of Herd Behavior"
  file: "Banerjee_QJE_1992.pdf"
  desc: "This note summarizes the paper, which develops a sequential Bayesian-choice model over many alternatives where agents sometimes receive noisy private signals but later agents also observe predecessors’ discrete actions (not their signals), derives a unique equilibrium under conservative tie-breaking in which information cascades start early—agents rationally ignore their own signals once an option gains repeated visible support—so social learning can fail and the probability the population never discovers the correct option remains high, shows the inefficiency comes from a herd externality (copying destroys information for future decision makers) rather than payoff complementarities or agency, and proves that welfare can improve if some early movers are prevented from observing others’ choices (preserving informativeness)."

- title: "Kaustia and Knüpfer (JFE, 2012) - Peer Performance and Stock Market Entry"
  file: "Kaustia_Knupfer_JFE_2012.pdf"
  desc: "This note summarizes the paper, which uses Finnish Central Securities Depository population-wide trading records (1995–2002) to build a ZIP-code×month panel and measure stock market entry as first-time voluntary stock purchases, relates next-month entry rates to lagged neighborhood portfolio returns with ZIP fixed effects and province-month fixed effects, tests social-learning mechanisms through heterogeneity by local participation rates and a kinked positive-vs-negative return specification showing strong effects of positive peer returns but little response to negative returns (selective communication), and rules out alternative explanations (local stocks/wealth shocks, household cross-buying, and short-sale constraints) with extensive robustness and an IPO-entry placebo-style design."

- title: "Tetlock (RFS, 2010) - Does Public Financial News Resolve Asymmetric Information?"
  file: "Tetlock_RFS_2010.pdf"
  desc: "This note summarizes the paper, which links firm-day Dow Jones/WSJ news (1979–2007) to CRSP returns and turnover, Compustat and I/B/E/S characteristics, 13F ownership, and intraday ISSM/TAQ order flow to test a three-period microstructure model where public news reveals fundamentals and helps uninformed traders infer and absorb a persistent liquidity shock, estimating Fama–MacBeth return-predictability regressions showing news attenuates short-run reversals and generates stronger postnews continuation when turnover/message count is high, documenting a sharp event-time increase in the volume–absolute return correlation around news, and using 5-minute price-impact measures to show signed order flow moves prices less on news days (with stronger effects for small/illiquid/high-message events)."

- title: "Weller (RFS, 2018) - Does Algorithmic Trading Reduce Information Acquisition?"
  file: "Weller_RFS_2018.pdf"
  desc: "This note summarizes the paper, which uses U.S. stocks around 2012–2016 quarterly earnings announcements to measure pre-disclosure information acquisition with a stock-quarter price jump ratio (announcement-window CAR over total event-related CAR from 21 days before to 2 days after), links it to SEC MIDAS order-book–based algorithmic-trading proxies (odd-lot ratio, trade-to-order ratio, cancel-to-trade ratio, average trade size) in panel regressions with rich lagged controls and fixed effects, addresses endogeneity with an IV design that instruments algorithmic trading using lagged log share price (via the minimum tick-size “fine price grid” mechanism), and corroborates causality with day-by-day response-ratio timing evidence plus alternative information measures (event-period nonsynchronicity and intraperiod timeliness portfolios) and broader RavenPack event categories, finding that higher algorithmic trading causally reduces pre-announcement information acquisition by roughly 9–13% per standard deviation and the gap widens throughout the month before disclosure."

- title: "Allen, Morris, and Shin (RFS, 2006) - Beauty Contests and Iterated Expectations in Asset Markets"
  file: "Allen_Morris_Shin_RFS_2006.pdf"
  desc: "This note summarizes the paper, which embeds Keynes's beauty-contest logic in a fully rational dynamic noisy rational-expectations model with short-lived CARA traders, private signals, public priors, and noisy supply, shows that average expectations fail the law of iterated expectations so equilibrium prices become iterated averages plus a risk/supply term, implying a systematic higher-order wedge where prices overweight public information, underreact and drift toward fundamentals, and can lie farther from fundamentals than the market's average expectation, with a Markov-chain representation of iterated beliefs and robustness to longer-lived traders."

- title: "Braun, Dorau, Jenkinson, and Urban (JF, 2026) - Size, Returns, and Value: Do Private Equity Firms Allocate Capital According to Manager Skill?"
  file: "Braun_Dorau_Jenkinson_Urban_JF_2026.pdf"
  desc: "This note summarizes the paper, which uses proprietary buyout deal-level cash-flow data from three large LPs (940 funds, 12,910 deals) linked to hand-collected individual manager attribution and career outcomes to argue that NPV (discounted value added) is the right skill metric when PE scales, estimates fund- and manager-level persistence regressions showing PME persistence fades over time while NPV persistence strengthens as successful managers are scaled up into larger deals with lower relative returns, decomposes manager performance into “skill” and “scalability” components, and tests PE internal labor-market capital allocation by linking managers’ NPV track records to subsequent deal size, partner promotion, and industry exit, finally quantifying that a large share (~40%, often 33–45%) of PE NPV is associated with the organization’s capital reallocation decisions rather than deal-maker fixed effects."

- title: "Zhong and Zhou (RFS, 2026) - Dynamic Coordination and Bankruptcy Regulations"
  file: "Zhong_Zhou_RFS_2026.pdf"
  desc: "This note summarizes the paper, which models distressed firms with staggered debt and asynchronous creditor learning as a dynamic clock game where creditors choose an exit time (waiting τ) trading off interest income against the hazard of being caught by bankruptcy, derives a sharp decomposition of equilibrium patience into a recovery-rate channel (value preserved for late creditors) and a hazard-rate channel (probability bankruptcy arrives before one exits), shows that committing to earlier bankruptcy filing/automatic stay can delay runs by improving expected recovery, proves a welfare-maximizing regulator intervenes earlier than the firm, and introduces avoidable-preference clawback as a more powerful policy tool with a closed-form optimal clawback window that shifts the pivotal creditor without shutting down production as early, with extensions showing seniority can have nonmonotonic effects on coordination."

- title: "Agarwal, Lucca, Seru, and Trebbi (QJE, 2014) - Inconsistent Regulators: Evidence from Banking"
  file: "Agarwal_Lucca_Seru_Trebbi_QJE_2014.pdf"
  desc: "This note summarizes the paper, which exploits legally mandated alternate examination policies that rotate eligible U.S. state-chartered banks between state and federal supervisors to identify within-bank differences in supervisory toughness, estimates exam-frequency fixed-effects regressions showing federal regulators assign systematically worse CAMELS ratings (with downgrades concentrated in federal spells and offsetting upgrades in state spells), links federal oversight to bank behavioral responses in quarterly panels (higher capital ratios, lower ROA, higher expenses, and worse measured asset quality without a significant loan-growth contraction), and uses cross-state heterogeneity, predictive-distress tests, and regulator-resource/local-economy interactions to argue that supervisory inconsistency is economically costly and driven mainly by local interests and state capacity rather than capture."

- title: "Holmström and Tirole (QJE, 1997) - Financial Intermediation, Loanable Funds, and the Real Sector"
  file: "Holmstrom_Tirole_QJE_1997.pdf"
  desc: "This note summarizes the paper, which builds a two-period moral-hazard model where firm collateral (net worth K_f) and intermediary “informed capital” (net worth K_m) are distinct scarce resources because monitoring relaxes borrower incentives only if monitors themselves have skin in the game, derives financing cutoffs that sort firms into no finance / monitored (mixed) finance / direct market finance and equilibrium prices for uninformed funds (γ) and informed capital (β), and uses comparative statics to show that credit crunches (K_m ↓ ), collateral squeezes (K_f ↓ ), and savings squeezes (inward S(γ)) all reduce investment and ration out the least-capitalized firms first but imply different movements in γ, β, and solvency ratios—providing a unified framework for the balance-sheet versus lending channels and the procyclicality of capital adequacy."

- title: "Drechsler, Savov, Schnabl, and Wang (JF, 2026) - Deposit Franchise Runs"
  file: "Drechsler_Savov_Schnabl_Wang_JF_2026.pdf"
  desc: "This note summarizes the paper, which develops a bank-valuation model where the deposit franchise (low-beta deposits priced below market) is a negative-duration asset that can offset long-duration asset losses when rates rise, but whose uninsured component is runnable and can vanish in a self-fulfilling “deposit-franchise run” even if bank assets are fully liquid; it derives run/no-run and hedging-dilemma conditions showing vulnerability scales with low-beta uninsured deposits and motivates a capital requirement proportional to the potential loss of the uninsured franchise, then empirically implements the framework using U.S. call reports (2015–2024) to estimate mark-to-market asset losses, insured vs uninsured deposit betas, and deposit operating costs and to compute bank values with and without runs—finding most banks were cushioned by insured franchise value in 2022–2023 while run exposure was concentrated in outliers like SVB/Signature/First Republic."

- title: "Martin, Puri, and Ufier (JF, 2026) - Deposit Inflows and Outflows in Failing Banks: The Role of Deposit Insurance"
  file: "Martin_Puri_Ufier_JF_2026.pdf"
  desc: "This note summarizes the paper, which uses uniquely granular daily account-level FDIC data from a failed U.S. bank to separately measure gross uninsured outflows and gross insured inflows across placebo, precrisis, postcrisis, and formal-enforcement-action periods, estimates account-level liquidation regressions to show uninsured and brokered deposits run while checking/direct-deposit/older and TAG/DFA-covered accounts are stickier, documents that the bank offset fleeing deposits by attracting large amounts of new insured institutional term deposits (often structured just below the insurance limit via listing services) using daily inflow regressions and rate-spread elasticities, and generalizes the compositional substitution with bank–quarter panels for all U.S. banks under regulatory action plus RateWatch evidence that stressed (including large) banks raise CD rates to pull in insured funding."

- title: "Leland and Pyle (JF, 1977) - Informational Asymmetries, Financial Structure, and Financial Intermediation"
  file: "Leland_Pyle_JF_1977.pdf"
  desc: "This note summarizes the paper, which develops a competitive capital-market signaling model where entrepreneurs privately know project quality and credibly reveal it by retaining equity (a costly “skin-in-the-game” signal), proves that with normal asset demand the equilibrium valuation schedule is strictly increasing in insider retention and that competition selects the least-cost separating schedule, shows signaling distorts portfolio holdings (entrepreneurs overretain relative to full information) but leaves project selection efficient, derives capital-structure implications (riskier projects use less debt and value–debt correlations can arise without taxes or bankruptcy costs), and offers a conceptual foundation for financial intermediation as informed institutions that hold assets and signal information quality through insider capital at risk and leverage."

- title: "Cetemen, Cisternas, Kolb, and Viswanathan (JF, 2026) - Leader-Follower Dynamics in Shareholder Activism"
  file: "Cetemen_Cisternas_Kolb_Viswanathan_JF_2026.pdf"
  desc: "This note summarizes the paper, which builds a Kyle-style sequential-trading model of two activist blockholders whose terminal ownership endogenously determines firm value via costly activism effort, shows that the leader strategically uses first-period order flow to manipulate the wedge between the follower’s inference and the market maker’s price-setting—making leader trades predictable on average with the sign flipping with the correlation of activists’ initial blocks (sell when positively correlated, buy when negatively correlated) while the follower’s trade remains conditionally mean zero—derives implications for free riding, abnormal prices, and the value of leading versus following (including multiple-follower “wolf-pack” amplification and liquidity comparative statics), and illustrates the mechanisms."

- title: "Mian, Rao, and Sufi (QJE, 2013) - Household Balance Sheets, Consumption, and the Economic Slump"
  file: "Mian_Rao_Sufi_QJE_2013.pdf"
  desc: "This note summarizes the paper, which develops a tractable ordered-search model where heterogeneous products (quality q_i , search appeal Δ_i , market potential 1−γ_i ) generate two position externalities—business stealing from above and price-disciplining search appeal from below—implies a simple equilibrium pricing recursion p_i =q_i −∑_(j>i) Δ_j and demand D_i =(1−γ_i )∏_(j<i) γj for any directed order, derives closed-form ranking indices for the search order that maximizes total industry profit versus consumer surplus (often conflicting), and then embeds the endogenous position values into a GSP position auction to show that auction outcomes are biased toward the joint-profit ranking when heterogeneity is mainly in quality/markups but toward the consumer-surplus ranking when heterogeneity is mainly in market potential/conversion."

- title: "Li and Yu (JF, 2026) - Investor Composition and the Liquidity Component in the U.S. Corporate Bond Market"
  file: "Li_Yu_JF_2026.pdf"
  desc: "This note summarizes the paper, which combines TRACE bid-ask spreads and credit spreads with Lipper eMaxx holdings (2005Q2–2019Q2) to document a sharp rise in the cross-sectional loading of credit spreads on bid-ask spreads and the implied liquidity share of spreads, constructs a bond-level investor-composition measure based on holders’ persistent net trading to proxy for short-term liquidity-shock frequency, identifies the causal effect of short-term investors using a discontinuity at the 10-year maturity cutoff created by intermediate-term bond fund mandates (instrumenting investor composition and its interaction with bid-ask spreads), and rationalizes the trend in a search-theoretic OTC model with heterogeneous investors and bonds where falling risk-free rates induce entry of short-term mutual-fund/ETF investors that raise trading frequency and amplify the capitalization of transaction costs and trade-delay (seller–buyer ratio) into yields."

- title: "Aizawa, Mommaerts, and Rennane (Econometrica, 2026) - Firm Accommodation After Workplace Disability: Labor Market Impacts and Implications for Subsidy Design"
  file: "Aizawa_Mommaerts_Rennane_Econometrica_2026.pdf"
  desc: "This note summarizes the paper, which combines TRACE bid-ask spreads and credit spreads with Lipper eMaxx holdings (2005Q2–2019Q2) to document a sharp rise in the cross-sectional loading of credit spreads on bid-ask spreads and the implied liquidity share of spreads, constructs a bond-level investor-composition measure based on holders’ persistent net trading to proxy for short-term liquidity-shock frequency, identifies the causal effect of short-term investors using a discontinuity at the 10-year maturity cutoff created by intermediate-term bond fund mandates (instrumenting investor composition and its interaction with bid-ask spreads), and rationalizes the trend in a search-theoretic OTC model with heterogeneous investors and bonds where falling risk-free rates induce entry of short-term mutual-fund/ETF investors that raise trading frequency and amplify the capitalization of transaction costs and trade-delay (seller–buyer ratio) into yields."

- title: "Lin and Vella (JPE, 2026) - Endogenous Treatment Models with Social Interactions: An Application to the Impact of Exercise on Self-Esteem"
  file: "Lin_Vella_JPE_2026.pdf"
  desc: "This note summarizes the paper, which develops an endogenous-treatment framework with social interactions in both the treatment and outcome equations by modeling exercise choice and self-esteem as two linked incomplete-information Bayesian games, represents equilibrium in conditional choice probabilities and estimates it with a computationally tractable nested pseudo joint likelihood (NPJL) fixed-point algorithm, defines both partial (holding peers fixed) and composite (general-equilibrium network) treatment effects, and applies the method to Add Health friendship networks (9,036 U.S. adolescents) to estimate positive peer effects in exercise and a large positive causal effect of exercise on self-esteem (with outcome peer effects concentrated in the low-self-esteem tail) and to run targeted-intervention counterfactuals showing sizable spillovers when treating popular or poor students."

- title: "Guerrieri and Lorenzoni (QJE, 2017) - Credit Crises, Precautionary Savings, and the Liquidity Trap"
  file: "Guerrieri_Lorenzoni_QJE_2017.pdf"
  desc: "This note summarizes the paper, which builds a quantitative heterogeneous-agent incomplete-markets (Bewley–Aiyagari) model where a tightening of household borrowing limits triggers both borrower deleveraging and lender precautionary saving, forcing the natural real interest rate to overshoot downward because the initial wealth distribution has too much mass near the borrowing constraint, decomposes the resulting recession into a large partial-equilibrium consumption drop that is partly offset by the endogenous interest-rate decline, shows a strong labor-supply composition effect (hours can rise while output falls), and then introduces nominal wage rigidity with a zero lower bound to generate a larger contraction and slower deleveraging, with extensions for debt-financed transfers, debt deflation, and durables/collateralized borrowing that produce especially large durable-spending collapses under spread shocks."

- title: "Bergemann and Välimäki (JPE, 2006) - Dynamic Pricing of New Experience Goods"
  file: "Bergemann_Valimaki_JPE_2006.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time monopoly model of an experience good where consumers learn their own match value only through consumption (Poisson learning) so the state is the fraction informed a(t), derives a sharp mass-market vs. niche-market classification based on whether an uninformed buyer’s willingness to pay at the static monopoly benchmark w^ exceeds the static monopoly price p^ , characterizes Markov-perfect equilibrium pricing paths with either skimming (high initial prices that decline toward p^ ) or penetration (low introductory prices that build an informed base and then jump up to p^ at a stopping point), and studies welfare and policy comparisons showing competition is efficient under purely idiosyncratic learning but monopoly can dominate under social-learning externalities, interpreting the key propositions and price-path figures throughout."

- title: "Jehiel and Weber (RES, 2026) - Endogenous Clustering and Analogy-Based Expectation Equilibrium"
  file: "Jehiel_Weber_RES_2026.pdf"
  desc: "This note summarizes the paper, which endogenizes analogy partitions in Analogy-Based Expectation Equilibrium by requiring that players with a memory bound K_i choose coarse categories to minimize prediction error about opponents’ behavior (via prototype/K-means-style local or global clustering under squared-Euclidean or KL divergence), shows that the resulting fixed point between clustering and play may fail to exist in pure strategies (matching-pennies example) and therefore introduces Clustered Distributional ABEE (mixing over partitions) with general existence, and characterizes how strategic complements generate self-attractive partitions and multiplicity while strategic substitutes generate self-repelling partitions and equilibrium heterogeneity/polarization, illustrating the mechanisms in beauty-contest, monitoring, and linear-best-reply applications and interpreting the key propositions and figures throughout."

- title: "Schenone (RFS, 2010) - Lending Relationships and Information Rents: Do Banks Exploit Their Information Advantages?"
  file: "Schenone_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses U.S. Dealscan syndicated loans matched to SDC IPO firms (1998–2003) to treat the IPO as an information-releasing shock, constructs a novel relationship-intensity (lock-in) measure based on the share of a firm’s past loans led by the current lead lender, and estimates firm fixed-effects loan-spread regressions separately before and after the IPO (and in a unified before/after interaction specification) showing a pre-IPO U-shaped spread–intensity pattern consistent with information-rent extraction at high dependence but a post-IPO monotone declining pattern consistent with pure relationship cost reductions once disclosure levels the playing field, ruling out risk-sharing and loan–underwriting bundling explanations with syndicate-structure and IPO-underwriter interaction tests."

- title: "Chen, Gentry, Li, and Lu (RES, 2026) - Identification and Inference in First-Price Auctions with Risk-Averse Bidders and Selective Entry"
  file: "Chen_Gentry_Li_Lu_RES_2026.pdf"
  desc: "This note summarizes the paper, which studies first-price auctions with risk-averse bidders and selective entry, derives an equilibrium inverse-bidding representation in quantile form where bids and observed entry thresholds identify objects b_k (α∣z) and R_k (α∣z) and candidate latent value quantiles v_k (α∣z) must satisfy a sharp set of cross-environment restrictions (M, O, I, D, S) that characterize the identified set for utility and the value–signal structure, highlights a key boundary-condition discontinuity between full-entry and partial-entry cases (lowest type bids value vs. reserve), shows risk neutrality is nonparametrically testable and that variation in both N and an entry-cost shifter z identifies risk aversion up to a bounded constant (with point identification under CRRA/CARA), and develops robust likelihood-ratio inference and fast MPEC/Chebyshev-collocation computation for set-identified models with parameter-dependent bid support."

- title: "Diamond and Rajan (JPE, 2001) - Liquidity Risk, Liquidity Creation, and Financial Fragility: A Theory of Banking"
  file: "Diamond_Rajan_JPE_2001.pdf"
  desc: "This note summarizes the paper, which builds a three-date theory of relationship lending where loans are intrinsically illiquid because relationship-specific collection skills cannot be credibly pledged to outsiders, introduces an interim (privately observed) banker liquidity shock that makes direct lending require an illiquidity premium or liquidation, and shows that financing these illiquid loans with fragile demand deposits creates liquidity by serving as a commitment device—any attempt to underpay depositors triggers a run that strips the banker of rents—thereby allowing the bank to borrow against the loan’s full collectible value, while interpreting the bargaining-tree figures, timeline table, and run-logic diagram and drawing policy implications for narrow banking, capital, and deposit insurance."

- title: "Drechsler, Savov, and Schnabl (QJE, 2017) - The Deposits Channel of Monetary Policy"
  file: "Drechsler_Savov_Schnabl_QJE_2017.pdf"
  desc: "This note summarizes the paper, which develops a model where monetary tightening raises banks’ deposit-market power by making deposits less substitutable with cash, predicts higher deposit spreads and deposit outflows that contract lending, and tests the “deposits channel” using U.S. branch-level deposit-rate data (RateWatch) and deposit quantities (FDIC) with within-bank designs that interact Fed funds changes with local deposit-market concentration (county HHI), complemented by event-time and expected-vs-unexpected rate-change evidence, then traces transmission to bank- and county-level small-business lending and real activity with bank-HHI and spread-beta sufficient-statistic regressions, showing the mechanism also comoves tightly with the T-bill liquidity premium."

- title: "Krishnamurthy and Vissing-Jorgensen (JPE, 2012) - The Aggregate Demand for Treasury Debt"
  file: "Krishnamurthy_VissingJorgensen_JPE_2012.pdf"
  desc: "This note summarizes the paper, which models Treasuries as convenience assets (money-like claims providing liquidity and safety services) so their yields embed a convenience yield that is decreasing in the market value of publicly held Treasury debt relative to GDP, estimates long- and short-maturity spread regressions in a long U.S. annual sample linking corporate–Treasury and deposit–bill spreads to log(debt/GDP) with rich default-risk and risk-premium controls, uses IV (powers of total debt/GDP) for maturity-specific Treasury supply to address endogenous maturity choice, and exploits asset-pair designs (Baa–Aaa and P2–P1 for safety; insured CD–bill and deposits–bill for liquidity) plus a piecewise-linear specification to quantify the level of the convenience yield (≈73 bps on long Treasuries, with at most 46 bps liquidity and at least 27 bps safety)."

- title: "Baron and Xiong (QJE, 2017) - Credit Expansion and Neglected Crash Risk"
  file: "Baron_Xiong_QJE_2017.pdf"
  desc: "This note summarizes the paper, which uses a long international panel of 20 advanced economies (1920–2012) to measure bank credit booms via the annualized three-year change in bank credit-to-GDP and tests whether bank equity investors price the associated tail risk by estimating probit regressions for future bank-equity crash probabilities, panel return-predictability regressions for nonoverlapping 1–3 year ahead excess returns, threshold regressions for extreme booms/busts, and interaction/quantile specifications that separate “credit-boom sentiment” from dividend-yield sentiment—finding credit expansion predicts higher crash risk but lower subsequent bank equity returns (especially in low-dividend-yield states), consistent with neglected crash risk."

- title: "Sweeting, Roberts, and Gedge (JPE, 2020) - A Model of Dynamic Limit Pricing with an Application to the Airline Industry"
  file: "Sweeting_Roberts_Gedge_JPE_2020.pdf"
  desc: "This note summarizes the paper, which develops a dynamic asymmetric-information limit-pricing model with persistent incumbent marginal costs and a D1-refined unique separating MPBE, then tests its key empirical signature—nonmonotonic (U-shaped) preentry price cuts that are largest at intermediate Southwest entry probabilities—using U.S. airline route data (DB1 + T100) and a first-stage predicted-entry-probability measure, rules out capacity/load-factor/airport-improvement and loyalty alternatives with parallel regressions on capacity, passengers, and load factors, and calibrates a nested-logit demand system, Markov cost process, and entry-cost distribution (via entry hazards) to match out-of-sample phase-2 price declines and quantify welfare and entry-subsidy counterfactuals."

- title: "Aguirregabiria and Magesan (RES, 2020) - Identification and Estimation of Dynamic Games When Players’ Beliefs Are Not in Equilibrium"
  file: "Aguirregabiria_Magesan_RES_2020.pdf"
  desc: "This note summarizes the paper, which develops identification and estimation for dynamic discrete games when players are rational but may hold non-equilibrium (biased) beliefs about rivals, shows how a payoff exclusion restriction yields (i) a likelihood-ratio test of equilibrium/unbiased beliefs and (ii) point identification of contemporaneous beliefs and payoff differences when beliefs are known only on an “anchor” subset of states (partially unbiased beliefs), proposes a constructive nonparametric two-step estimator with a parametric pseudo-likelihood extension, and applies the method to McDonalds–Burger King store-location choices across 422 UK districts (1991–1995) to reject unbiased beliefs for Burger King but not McDonalds and to show imposing equilibrium beliefs can severely attenuate estimated competition effects."

- title: "Kiyotaki and Moore (JPE, 1997) - Credit Cycles"
  file: "Kiyotaki_Moore_JPE_1997.pdf"
  desc: "This note summarizes the paper, which builds a dynamic general-equilibrium credit-cycle model where a durable asset (land) is both an input and collateral so borrowing limits depend on its market price, derives a powerful intertemporal (dynamic) collateral-price multiplier in which shocks to constrained borrowers’ net worth reduce land demand and land prices which further tighten borrowing capacity and propagate shocks, extends the framework by adding uncollateralizable capital (trees) and lumpy investment opportunities to generate hump-shaped responses and damped cycles and by adding a second sector to show spillovers through a shared collateral market, and interprets the key figures on the mechanism, steady-state misallocation, and simulated dynamics throughout."

- title: "Crawford, Pavanini, and Schivardi (AER, 2018) - Asymmetric Information and Imperfect Competition in Lending Markets"
  file: "Crawford_Pavanini_Schivardi_AER_2018.pdf"
  desc: "This note summarizes the paper, which builds and estimates a structural model of Italian small-business lending that jointly captures firms’ bank choice (mixed-logit demand), loan utilization, default, and Bertrand-Nash bank pricing, identifies adverse selection through correlated unobservables linking demand and utilization to default and moral hazard through the direct price–default effect, overcomes missing counterfactual prices by predicting unchosen-bank rates using firm fixed effects (validated by showing pricing residuals no longer predict default) and instruments bank demand with deposit-market shifters, and then runs counterfactuals (more adverse selection, higher marginal costs, and mergers) to show market power mitigates the price and default responses to selection and funding shocks—so competition and asymmetric information interact nonlinearly."

- title: "Gu, Peng, and Zhang (RFS, 2024) - The Gender Gap in Household Bargaining Power: A Revealed-Preference Approach"
  file: "Gu_Peng_Zhang_RFS_2024.pdf"
  desc: "This note summarizes the paper, which develops a revealed-preference structural household-portfolio model where the household’s effective risk aversion is a bargaining-weighted aggregation of spouses’ latent risk aversions, estimates participation costs and risky-asset demand using both the extensive and intensive margins in Australian HILDA panel data (2006/2010/2014/2018) with measurement error and household heterogeneity, recovers spousal bargaining weights via a logistic bargaining equation that loads on spousal differences (earnings, employment, cognition, etc.) and “financial head” types, decomposes the resulting gender gap into observables versus a residual gender/norm component, and validates the pattern with norm interactions and replications in Germany (GSOEP) and the U.S. (HRS), interpreting the core tables and figures on a persistent ≈60–40 husband–wife bargaining split and its determinants."

- title: "Rajan and Zingales (AER, 1998) - Financial Dependence and Growth"
  file: "Rajan_Zingales_AER_1998.pdf"
  desc: "This note summarizes the paper, which introduces the canonical difference-in-differences interaction design for finance and growth by combining an industry–country panel of manufacturing growth (1980–1990) with a U.S.-based industry measure of external finance dependence, estimating regressions with industry and country fixed effects where the key coefficient is Dependence(j) ×FinancialDevelopment(k) (and instrumenting disclosure/accounting standards with legal origin and legal-system quality), and then decomposes outcomes into growth in the number of establishments versus average establishment size and runs extensive robustness and channel tests (cash-flow vs investment-intensity interactions, reverse-causality and omitted-variable checks) to show financially dependent industries grow disproportionately faster in financially developed countries, especially through new establishment creation."

- title: "Holmes (Econometrica, 2011) - The Diffusion of Wal-Mart and Economies of Density"
  file: "Holmes_Econometrica_2011.pdf"
  desc: "This note summarizes the paper, which estimates a store-level demand model from Wal-Mart’s 2005 store sales to quantify local cannibalization, embeds it in a dynamic store-location problem with distribution-center distances and population-density-dependent fixed costs, and then uses a revealed-preference moment-inequality approach based on pairwise “resequencing” deviations in Wal-Mart’s observed 1962–2005 rollout (plus instrumented interaction moments and a distribution-center-opening cross-check) to partially identify and tightly bound the magnitude of economies of density in distribution costs—showing Wal-Mart’s contiguous expansion is rationalized by large per-mile logistics savings that outweigh cannibalization."

- title: "Jiménez, Ongena, Peydró, and Saurina (AER, 2012) - Credit Supply and Monetary Policy: Identifying the Bank Balance-Sheet Channel with Loan Applications"
  file: "Jimenez_Ongena_Peydro_Saurina_AER_2012.pdf"
  desc: "This note summarizes the paper, which uses Spain’s credit-register microdata on loan applications (information requests) matched to subsequent loan granting, combines time variation in monetary policy (3-month interbank rate changes) and macro conditions (GDP growth) with cross-bank balance-sheet heterogeneity (capital and liquidity), and estimates linear-probability loan-granting regressions with increasingly demanding firm FE, firm-month FE, and loan FE designs to identify a bank balance-sheet lending channel (weak banks cut approvals more when rates rise or growth falls), then tests real constraint relevance with substitution regressions after rejections and relationship-heterogeneity interactions showing multiple bank relationships mitigate but do not eliminate the credit crunch."

- title: "Petersen and Rajan (QJE, 1995) - The Effect of Credit Market Competition on Lending Relationships"
  file: "Petersen_Rajan_QJE_1995.pdf"
  desc: "This note summarizes the paper, which develops a relationship-lending model where banks with greater local market power can backload repayments and intertemporally smooth loan pricing—subsidizing young/opaque firms early and recouping rents later once types are revealed—so competition can reduce credit availability for risky startups, and tests the predictions in NSSBF small-firm survey data by measuring local credit-market competition with county/MSA deposit Herfindahls, estimating Tobit regressions of trade-credit discount taking as a rationing proxy, credit-availability regressions for institutional borrowing over the firm life cycle, and loan-rate regressions that allow the age slope to differ by market structure, showing that concentrated markets finance more young firms and offer lower initial rates but much flatter age–rate declines (a life-cycle crossover)."

- title: "Grossman and Hart (Econometrica, 1983) - An Analysis of the Principal-Agent Problem"
  file: "Grossman_Hart_Econometrica_1983.pdf"
  desc: "This note summarizes the paper, which provides a rigorous global solution to the moral-hazard principal–agent problem by transforming outcome-contingent payments through the agent’s utility vi =V(Ii ) so that implementing any target action becomes a convex programming problem with linear (global) incentive and participation constraints, establishes existence and the wedge between first-best and second-best implementation costs, characterizes when optimal contracts are monotone/progressive/regressive (showing MLRC alone is insufficient once multiple deviations can bind), derives sharp linear-sharing results and a constructive algorithm in the two-outcome case, and delivers comparative statics showing that Blackwell garblings (worse information) and higher risk aversion make incentives more costly."

- title: "Bhamra and Uppal (AER, 2019) - Does Household Finance Matter? Small Financial Errors with Large Social Costs"
  file: "Bhamra_Uppal_AER_2019.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time production-economy model with many risky firms and Epstein–Zin households who exhibit familiarity bias (modeled as ambiguity that tilts portfolios toward familiar assets), calibrates the degree of underdiversification and risky shares to household data (e.g., Swedish portfolio volatilities and the equity premium), and then quantifies welfare in three layers—static mean–variance, dynamic consumption–savings responses, and general-equilibrium growth feedback—showing that seemingly small diversification mistakes (≈1%/year in static terms) can generate much larger private and social welfare losses once they reduce households’ optimal risky share, distort intertemporal consumption, and alter aggregate saving and growth, with comparative statics in impatience and EIS and robustness to preference heterogeneity."

- title: "Ke (JF, 2021) - Who Wears the Pants? Gender Identity Norms and Intrahousehold Financial Decision-Making"
  file: "Ke_JF_2021.pdf"
  desc: "This note summarizes the paper, which uses large U.S. household surveys (CPS-ASEC, Census/ACS, and HRS) to estimate participation regressions comparing households where only the wife versus only the husband works in finance (with rich spouse-by-spouse controls, bank-manager subsamples, and within-household “career switcher” tests), shows the husband-in-finance effect on stock market participation is systematically larger, links the gap to gender-norm proxies (working-mother exposure, plough ancestry, Southern culture, religiosity, and reported household authority), and provides causal mechanism evidence with a randomized ESPP experiment that primes gender identity and finds female identity salience reduces women’s willingness to contribute correct financial advice while male identity salience does not reduce men’s willingness to accept it, interpreting the results as intrahousehold authority frictions driven by gender identity norms."

- title: "Giroud and Mueller (QJE, 2017) - Firm Leverage, Consumer Demand, and Employment Losses During the Great Recession"
  file: "Giroud_Mueller_QJE_2017.pdf"
  desc: "This note summarizes the paper, which matches U.S. Census LBD establishment employment (2007–2009) to parent-firm Compustat leverage measured pre-crisis (2006) and local Zillow house-price changes to estimate establishment-level employment regressions with rich zip/industry/firm fixed effects that interact local demand shocks with firm leverage, shows the amplification effect is concentrated in nontradable (local-demand) sectors and absent in tradables (placebo), validates the financial-constraint channel with firm-level financing, investment, and establishment-closure responses, strengthens identification by instrumenting house-price changes with Saiz (2010) housing-supply elasticity, and shows the mechanism survives aggregation in county-level employment regressions."

- title: "Takahashi (AER, 2015) - Estimating a War of Attrition: The Case of the US Movie Theater Industry"
  file: "Takahashi_AER_2015.pdf"
  desc: "This note summarizes the paper, which develops and estimates a continuous-time oligopoly war-of-attrition exit model with private exit values in a declining industry, uses U.S. county-level movie-theater panel data (Film Daily Yearbooks, 1949–1959) and cross-county variation in television diffusion to identify the demand-decay path, disciplines initial conditions with an auxiliary pre-1949 entry model, and estimates the structural parameters by indirect inference to decompose slow consolidation into an oligopoly-competition component versus an additional strategic-waiting component under asymmetric information—finding sizable overall exit delay but that most comes from noncooperative oligopoly rather than private-information-driven delay."

- title: "Ericson and Pakes (RES, 1995) - Markov-Perfect Industry Dynamics: A Framework for Empirical Work"
  file: "Ericson_Pakes_RES_1995.pdf"
  desc: "This note summarizes the paper, which introduces the Ericson–Pakes dynamic industry framework where heterogeneous firms invest to improve a firm-specific “success” state under idiosyncratic innovation shocks while entry and exit are endogenous and strategic interaction operates through the cross-sectional distribution of firms across states, proves existence of a rational-expectations Markov-perfect equilibrium with finite entry/compact effective state space and an ergodic invariant distribution over industry structures (so industries exhibit persistent churn rather than converging to a fixed structure), and illustrates the framework in a homogeneous-product Cournot example comparing decentralized MPE to collusion and a planner to show how competition shapes investment, turnover, prices, and welfare, interpreting the key state-space and investment-surface figures throughout.."

- title: "Notes: Aguirregabiria (RES, 1999) - The Dynamics of Markups and Inventories in Retailing Firms"
  file: "Aguirregabiria_RES_1999.pdf"
  desc: "This note summarizes the paper, which builds and structurally estimates a dynamic retail model in which a supermarket chain jointly chooses prices (with asymmetric menu costs) and order quantities (with fixed ordering costs) under stockout risk so inventories and markups become strategic substitutes, uses monthly brand-level data for 534 products from a Spanish supermarket chain (1990–1992) to document cyclical markups that fall after replenishment and rise between orders, estimates the model with a Hotz–Miller-style two-stage sequential discrete-choice/GMM procedure that combines nonparametric CCPs, model-implied exclusion restrictions, and selection-corrected profit components, and runs counterfactual simulations showing that large fixed ordering costs explain roughly half of observed sales promotions and markup variability while menu-cost asymmetry plays a secondary role."

- title: "Doraszelski, Lewis, and Pakes (AER, 2018) - Just Starting Out: Learning and Equilibrium in a New Market"
  file: "Doraszelski_Lewis_Pakes_AER_2018.pdf"
  desc: "This note summarizes the paper, which studies the UK electricity frequency-response market after its 2005 deregulation as a laboratory for out-of-equilibrium behavior, estimates a logit demand system with an eligibility (zero-share) model using quasi-differencing to handle persistent unobserved demand shocks, recovers marginal costs using a “weak rationality” moment that firms’ first-order-condition mistakes average to zero in the late-phase rest point (rather than assuming Nash equilibrium throughout), and then compares predicted bid paths from complete-information Nash to learning models that combine fictitious play about rivals with adaptive learning about demand parameters—showing learning fits the transition (bubble and convergence) much better while equilibrium becomes accurate only once the market stabilizes."

- title: "Markowitz (JF, 1952) - Portfolio Selection"
  file: "Markowitz_JF_1952.pdf"
  desc: "This note summarizes the paper, which replaces “maximize expected return” with a mean–variance decision rule by defining portfolio expected return as a weighted average of individual expected returns and portfolio risk as a quadratic form in portfolio weights driven by the full covariance matrix, characterizes efficient portfolios as those minimizing variance for a given mean (or maximizing mean for a given variance), and uses geometric constructions (isomean lines, isovariance ellipses, and the critical line) to show that diversification is valuable because of imperfectly correlated returns—so covariance, not the number of securities, is the central risk object."

- title: "Tobin (RES, 1958) - Liquidity Preference as Behavior Towards Risk"
  file: "Tobin_RES_1958.pdf"
  desc: "This note summarizes the paper, which reformulates Keynesian liquidity preference as a mean–variance portfolio problem over monetary assets (cash versus interest-bearing bonds) by introducing uncertainty about future interest-rate–driven capital gains/losses and risk-averse preferences, derives interior diversification between cash and bonds (rather than Keynes’s all-or-nothing speculative corners under sticky expectations), shows that a higher interest rate or lower perceived bond risk typically reduces desired cash holdings—especially at low rates—and extends the framework to multiple risky monetary assets where investors first choose an efficient risky composite and then choose how much cash to hold against it, interpreting the paper’s geometric figures on the opportunity locus, indifference curves, and aggregation throughout.."

- title: "Greenwood, Seshadri, and Yorukoglu (RES, 2005) - Engines of Liberation"
  file: "Greenwood_Seshadri_Yorukoglu_RES_2005.pdf"
  desc: "This note summarizes the paper, which combines historical diffusion and time-use facts on electrification and labor-saving household durables with a calibrated dynamic general-equilibrium household-production model featuring heterogeneous households, falling durable prices, and discrete adoption and female labor-supply participation decisions, shows that a standard wage-growth home-production model cannot generate the large rise in married women’s market work, and then quantifies that the household durable-goods revolution explains a major share of the 1900–1980 increase in female labor-force participation (with strong interaction effects with the narrowing gender wage gap), matching diffusion timing across income types and transition paths and interpreting the key figures and welfare decompositions throughout."

- title: "Bertrand, Kamenica, and Pan (QJE, 2015) - Gender Identity and Relative Income within Households"
  file: "Bertrand_Kamenica_Pan_QJE_2015.pdf"
  desc: "This note summarizes the paper, which documents a sharp discontinuity in the distribution of wives’ share of household income at the 50% breadwinner threshold using SIPP-linked administrative earnings and cleaned Census/ACS data, identifies marriage-market and labor-supply responses to “wife-out-earns-husband” risk using market-level regressions where the key shifter is the probability a randomly drawn woman would out-earn a randomly drawn man (instrumented with a Bartik-style predicted-earnings distribution based on national industry wage changes and predetermined local industry composition), estimates household-level labor-force-participation and realized-versus-potential-earnings regressions using a couple-specific PrWifeEarnsMore measure, and links threshold crossing to lower marital satisfaction, higher divorce risk, and compensatory housework using NSFH/ATUS and PSID within-couple fixed-effects evidence, interpreting the patterns as the imprint of a gender-identity norm that the husband should earn more.."

- title: "Sharpe (JF, 1964) - Capital Asset Prices: A Theory of Market Equilibrium under Conditions of Risk"
  file: "Sharpe_JF_1964.pdf"
  desc: "This note summarizes the paper, which derives an equilibrium theory of asset prices in a one-period mean–variance setting with a riskless borrowing/lending rate and homogeneous expectations, shows that market clearing implies a capital market line where all investors hold combinations of the risk-free asset and an efficient risky portfolio, and uses a tangency argument to price individual securities—proving expected returns are linear in systematic risk (a beta-like covariance with an efficient portfolio) while idiosyncratic risk is not priced because it can be diversified away—illustrated through the paper’s geometric figures linking the efficient frontier, diversification, the CML, and the regression interpretation of beta."

- title: "Aguirregabiria and Mira (Econometrica, 2007) - Sequential Estimation of Dynamic Discrete Games"
  file: "Aguirregabiria_Mira_Econometrica_2007.pdf"
  desc: "This note summarizes the paper, which develops computationally tractable estimation for dynamic discrete games with multiple equilibria by representing Markov perfect equilibrium as a fixed point in conditional choice probability (CCP) space, constructs pseudo maximum likelihood (PML) estimators that avoid solving the full game at every trial parameter, and introduces the nested pseudo likelihood (NPL) algorithm that iterates between parameter estimation and CCP best-response updating to reduce finite-sample bias and handle large state spaces and permanent unobserved heterogeneity, validating the approach in Monte Carlo experiments and applying it to dynamic entry–exit in Chilean local retail markets (restaurants, gas stations, bookstores, shoe shops, fish shops) to recover fixed costs, sunk entry costs, strategic interaction, and market-level heterogeneity."

- title: "Nurisso (JFE, 2026) - Learning by Lending Securities"
  file: "Nurisso_JFE_2026.pdf"
  desc: "This note summarizes the paper, which builds a Kyle-style trading model in which securities lending is an information-acquisition stage: an informed short seller’s borrowing decision reveals bad news to the lender, who sets lending fees and may trade on (and potentially recall) lent shares before the short sale occurs, deriving equilibrium fee setting and trading strategies under passive versus active lenders, showing how recall risk creates a commitment problem that imposes a positive lower bound on active-lender fees and tightens short-sale constraints, and proving that passive lenders—despite charging higher fees—can attract more shorting demand and sometimes improve price efficiency because they do not leak information through trading, with additional results on lender reputation, lender competition, and equilibrium price/fee/shorting-efficiency comparative statics illustrated in the core figures."

- title: "Allen, Carmichael, Clark, Li, and Vincent (JFE, 2026) - Housing affordability and parental income support: The role of mortgage co-signing"
  file: "Allen_Carmichael_Clark_Li_Vincent_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses matched Canadian TransUnion credit-bureau records and OSFI mortgage-contract data (2015–2022, with co-signing trends back to 2004) to define parent co-signing via age gaps and simulate qualification-rule counterfactuals that remove parents’ income/debt/credit scores under observed GDS/TDS/PTI constraints, quantifies how co-signing relaxes affordability and shifts first-time buyers toward earlier, higher-priced, high-λ (near-max-PTI) housing choices, and then assesses financial fragility with delinquency-change regressions and an event-study around the 2016 insured and 2018 uninsured Canadian mortgage stress tests as quasi-exogenous PTI tightening that increases marginal co-signing, showing co-signing raises leverage and post-origination delinquency risk for both children (especially constrained/high-λ) and sometimes parents."

- title: "Cicero, Shen, and Shenoy (JF, 2026) - Corporate M&As and Labor Market Concentration -- Efficiency Gains or Power Grabs?"
  file: "Cicero_Shen_Shenoy_JF_2026.pdf"
  desc: "This note summarizes the paper, which measures deal-induced changes in local labor-market concentration for 2,664 U.S. public-firm mergers (1991–2016) using establishment-level NETS employment shares in county×SIC3 labor markets, links this overlap to combined announcement-period wealth effects in cross-sectional merger-value regressions, and then distinguishes labor-power from labor-efficiency channels using mobility/noncompete/union heterogeneity, related-party event-study portfolios for rivals/customers/suppliers, and stacked difference-in-differences real-effects panels showing that high-overlap mergers cut overlapping-market employment while raising IT intensity and (at the firm level) increase revenues, operating income, and labor productivity without raising margins—consistent with efficiency-enhancing reorganization rather than monopsony rent extraction."

- title: "Goyal, Wahal, and Yavuz (JFE, 2026) - Picking partners: Manager selection in private markets"
  file: "Goyal_Wahal_Yavuz_JFE_2026.pdf"
  desc: "This note summarizes the paper, which studies LP selection of private-market managers using 61,602 Preqin commitments (1995–2019) and a novel LP-year opportunity-set construction that incorporates access/rationing, commitment-size constraints, fund-type specialization, timing windows, and personal-relationship relaxations (including failed fundraising attempts), estimates within-opportunity-set fund-choice regressions with rich fixed effects showing LPs chase past performance but select first-time and young GPs at rates comparable to top-quartile incumbents, rejects “hidden expected outperformance” and “toehold into future star funds” using rolling expected-return forecasts and realized IRR evidence, and identifies a market-clearing pressure-to-invest mechanism by interacting LP under-allocation/fast-growing demand measures with GP types to show LPs under deployment pressure substitute toward new entrants when incumbent supply does not scale."

- title: "Barry, Carlin, Crane, and Graham (JFE, 2026) - Hurdle Rate Buffers and Bargaining Power in Asset Acquisition"
  file: "Barry_Carlin_Crane_Graham_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops a delegated-bargaining model where CFO-set hurdle-rate “buffers” (hurdle minus WACC) act as a commitment device that can improve negotiated terms in project development or acquisitions at the cost of rejecting some positive-NPV deals, disciplines the mechanism with six Duke CFO surveys (hurdle/WACC levels and persistence), Compustat ROIC bunching just above the hurdle (not WACC), and M&A fairness-opinion discount rates to proxy bidder hurdles in deal-level regressions showing higher buffers predict lower premia and higher bidder announcement returns without higher combined gains (surplus capture), and links buffer use to ex ante bargaining power (supplier/customer concentration and supplier markups) with stronger effects when assets are less redeployable."

- title: "Sannino (JFE, 2026) - Committing to Trade: A Theory of Intermediation"
  file: "Sannino_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops a two-period lemons-market theory where sellers privately know asset quality and part of their valuation while a common shock to gains from trade is revealed only right before final buyers make offers, shows that competitive intermediation can raise welfare even without superior information by making sellers commit to trade before the shock (improving expected traded-asset quality and shifting trade toward low-demand states where adverse selection is most severe), characterizes two welfare channels (volume and redistribution) and sharp comparative statics in shock volatility and selection severity, extends the model to allow disintermediation via costly search and proves that lower search frictions can reduce welfare by undermining the commitment device, and introduces optimal threshold delegation contracts and applications to underwrite-to-distribute leveraged loans and principal-versus-agency OTC dealer markets."

- title: "Catherine, Ebrahimian, and Yannelis (JFE, 2026) - How do income-driven repayment plans benefit student debt borrowers?"
  file: "Catherine_Ebrahimian_Yannelis_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses a 2000–2020 TransUnion borrower-panel to decompose the post-2010 rise in U.S. student-loan balances into new borrowing versus repayment deferral by constructing counterfactual standard-plan amortization paths, then embeds student-loan rules in an incomplete-markets life-cycle model with income risk and safety-net programs to quantify welfare effects of income-driven repayment (IDR) and decompose borrower gains into insurance, intertemporal smoothing, and taxpayer transfers, and finally searches over key IDR parameters (repayment horizon, income threshold, repayment rate) to characterize the welfare frontier—showing that long horizons with progressive thresholds deliver similar borrower welfare at far lower fiscal cost and that SAVE-style generosity mainly operates through transfers rather than efficiency."

- title: "Edmond, Midrigan, and Xu (JPE, 2023) - How Costly Are Markups?"
  file: "Edmond_Midrigan_Xu_JPE_2023.pdf"
  desc: "This note summarizes the paper, which builds a dynamic heterogeneous-firm macro-IO model with endogenous entry/exit, capital accumulation, and size-dependent markups (disciplined by U.S. Census of Manufactures moments on concentration, materials shares, and the markup–market-share slope), shows that the macro-relevant distortion is the cost-weighted (sales-weighted harmonic) aggregate markup rather than the usual sales-weighted arithmetic average (which conflates the aggregate wedge with dispersion), decomposes welfare losses into an aggregate-markup wedge, misallocation from markup dispersion, and a small entry distortion, and runs policy counterfactuals demonstrating that uniform output subsidies and size-dependent misallocation corrections capture most gains while entry subsidies barely move the aggregate markup."

- title: "Murphy, Shleifer, and Vishny (JPE, 1989) - Industrialization and the Big Push"
  file: "Murphy_Shleifer_Vishny_JPE_1989.pdf"
  desc: "This note summarizes the paper, which formalizes Rosenstein–Rodan’s “big push” logic in a sequence of stylized general-equilibrium models with increasing returns and market-size spillovers, shows that pure profit (dividend) spillovers yield a unique equilibrium (no coordination failure), and then identifies three mechanisms that generate multiple equilibria and a self-sustaining industrialization path—a factory wage premium that raises aggregate demand, intertemporal investment that shifts demand into the future, and shared infrastructure with a large fixed cost that requires coordinated adoption—deriving the conditions under which the industrial equilibrium exists and is (often, but not always) Pareto-preferred and highlighting the role of policy in coordinating complementary sectoral investments."

- title: "Atkeson and Burstein (JPE, 2019) - Aggregate Implications of Innovation Policy"
  file: "Atkeson_Burstein_JPE_2019.pdf"
  desc: "This note summarizes the paper, which derives a unified first-order (sufficient-statistics) mapping from innovation subsidies to aggregate productivity, output, welfare, and fiscal cost in a growth model that nests entrant-only and incumbent-innovation environments, showing that the medium- and long-run effects of innovation policy depend primarily on two objects—the impact elasticity V of productivity growth with respect to real innovative investment and the intertemporal research spillover parameter f — measures V from U.S. aggregate and firm-dynamics evidence on entrants’ contribution to trend productivity growth and entrants’ share of innovative investment (with and without business stealing), and then calibrates alternative f values to compute 1-year, 20-year, and long-run elasticities and optimal research-labor shares, concluding that uniform innovation subsidies have modest 20-year output effects but potentially sizable welfare gains through long-run productivity."

- title: "Krugman (JPE, 1991) - Increasing Returns and Economic Geography"
  file: "Krugman_JPE_1991.pdf"
  desc: "This note summarizes the paper, which introduces the canonical “core–periphery” model of new economic geography by combining Dixit–Stiglitz monopolistic competition and increasing returns in manufacturing with iceberg transport costs and mobile manufacturing labor (agriculture tied to immobile land), characterizes short-run equilibrium wages and price indices and long-run migration driven by real-wage differentials, and derives agglomeration conditions—via both numerical stability of the symmetric allocation and an analytic “defecting firm” profitability test summarized by a scalar statistic ν — showing that self-reinforcing backward/forward linkages generate endogenous manufacturing concentration when transport costs are low, the manufacturing expenditure share is high, and scale economies are strong (low σ), interpreting the three core figures that map these thresholds in (μ,τ,σ) space."

- title: "Ossa (JPE, 2011) - A “New Trade” Theory of GATT/WTO Negotiations"
  file: "Ossa_JPE_2011.pdf"
  desc: "This note summarizes the paper, which develops a “new trade” theory of GATT/WTO negotiations in a Krugman-style monopolistic-competition model with increasing returns and endogenous firm location, shows that unilateral tariffs create a production-relocation externality (attracting manufacturing firms/jobs) that drives inefficient Nash protection, proves that reciprocity restores efficiency by fixing manufacturing trade balances (and thus firm masses) while nondiscrimination makes this logic work multilaterally by internalizing third-country spillovers, and then calibrates a multi-country exact-hat system to 2004 bilateral manufacturing trade flows and applied tariffs for major blocs to compute Nash tariffs and welfare losses from tariff wars and remaining gains from cooperative liberalization."

- title: "Bornstein and Peter (AER, 2025) - Nonlinear Pricing and Misallocation"
  file: "Bornstein_Peter_AER_2025.pdf"
  desc: "This note summarizes the paper, which documents pervasive quantity discounts in NielsenIQ scanner data by estimating within–product-line unit-price slopes across package sizes, builds a general-equilibrium model where firms use second-degree nonlinear pricing to screen consumers with private taste heterogeneity, proves under constant-elasticity-of-differences (CED) preferences that nonlinear pricing generates large within-firm misallocation (high-taste consumers overbuy and low-taste consumers underbuy) but does not create across-firm misallocation conditional on aggregate labor, calibrates the nonlinear- and linear-pricing versions to the same empirical moments on package-size dispersion, concentration, and markup patterns, and quantifies that welfare losses and labor wedges can be much larger under nonlinear pricing while showing that size-dependent subsidies optimal under linear pricing can reduce welfare when pricing is nonlinear."

- title: "Akcigit, Hanley, and Stantcheva (Econometrica, 2022) - Optimal Taxation and R&D Policies"
  file: "Akcigit_Hanley_Stantcheva_Econometrica_2022.pdf"
  desc: "This note summarizes the paper, which formulates optimal corporate taxation and R&D subsidies as a dynamic mechanism-design problem with innovation spillovers, monopoly distortions, privately known firm research productivity, and unobservable R&D effort, derives optimal “profit” and “R&D” wedges that combine Pigouvian, market-power, and screening terms governed by Hicksian complementarity (e.g., whether observable R&D amplifies hidden type more than hidden effort), estimates the model by matching Census firm outcomes to USPTO patent/citation-based innovation quality and reported R&D spending (recovering key parameters like strong R&D–type complementarity and spillover strength), and evaluates implementable policy classes—showing that a linear profit tax paired with a nonlinear R&D subsidy achieves nearly the full welfare gain relative to the unrestricted optimum while the US-style linear-linear system performs poorly."

- title: "Itskhoki and Moll (Econometrica, 2019) - Optimal Development Policies with Financial Frictions"
  file: "Itskhoki_Moll_Econometrica_2019.pdf"
  desc: "This note summarizes the paper, which solves a Ramsey-optimal development-policy problem in a macro model with heterogeneous entrepreneurs facing collateral constraints and workers supplying labor, derives tractable aggregation where entrepreneurial wealth x and its shadow value ν are sufficient statistics for transition dynamics, and shows that the optimal policy is stage-dependent—initially subsidizing labor supply (wage suppression) and potentially combining it with credit/wage-bill/capital subsidies to accelerate entrepreneurs’ net-worth accumulation and relax future financial frictions, then later switching to pro-worker labor taxation once wealth is abundant—validated in a richer quantitative calibration (persistent productivity, hand-to-mouth workers, OLG) and extended to a multi-sector setting where policy targets sectors with latent comparative advantage (including consumption-tax/labor-subsidy wedges in nontradables)."

- title: "Halac and Yared (JPE, 2025) - A Theory of Fiscal Responsibility and Irresponsibility"
  file: "Halac_Yared_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops a repeated-game political-economy model of government borrowing in a small open economy where each period’s deficit-biased incumbent privately observes fiscal-need shocks and future governments can punish only based on observed debt choices, proves that the welfare-maximizing self-enforcing equilibrium features bang-bang continuation values and thus two endogenous fiscal regimes—a “responsible” regime implemented as a maximally enforced deficit limit and an “irresponsible” punishment regime implemented as a maximally enforced surplus (minimum borrowing) limit—derives crisis-triggered regime-switching logic and an operator fixed-point condition for regime existence (requiring sufficiently high patience and deficit bias), and illustrates the mechanism with analytical log-utility thresholds and numerical simulations that match crisis-timed consolidation waves."

- title: "Elliott, Houngbonon, Ivaldi, and Scott (JPE, 2025) - Market Structure, Investment, and Technical Efficiencies in Mobile Telecommunications"
  file: "Elliott_Houngbonon_Ivaldi_Scott_JPE_2025.pdf"
  desc: "This note summarizes the paper, which estimates a unified empirical-IO and engineering model of the French mobile market (2015) where consumers choose plans and endogenously choose data usage under soft caps, delivered download speeds are determined by base-station density, spectrum bandwidth, and congestion (queueing + Shannon–Hartley), and operators choose national prices and local infrastructure; it identifies demand with a modified BLP-style inversion using rich Orange plan-by-commune shares plus national rival shares, externally calibrated Orange elasticities, and a population-density instrument for endogenous quality, then recovers per-user and infrastructure costs from pricing and investment FOCs to run counterfactuals that vary the number of firms and spectrum allocation and simulate mergers, quantifying the price–quality tradeoff, the welfare-maximizing market structure by income, and the social versus private value of spectrum."

- title: "Bartelme, Costinot, Donaldson, and Rodríguez-Clare (JPE, 2025) - The Textbook Case for Industrial Policy: Theory Meets Data: The Case of Air Toxics Standards"
  file: "Bartelme_Costinot_Donaldson_RodriguezClare_JPE_2025.pdf"
  desc: "This note summarizes the paper, which quantifies the “textbook” Pigouvian case for industrial policy in a multi-sector open-economy model with external economies of scale and terms-of-trade distortions, estimates sector-specific scale elasticities g(k) from OECD ICIO bilateral trade flows using gravity structure with imported trade elasticities and demand-based instruments for sector size (and an IV estimate of across-sector substitution), and then computes optimal employment subsidies and export taxes plus exact general-equilibrium welfare gains and Harberger-triangle approximations—showing meaningful estimated scale elasticities but modest average gains because equilibrium reallocation across sectors is limited, with larger gains in an extended model with capital and input–output linkages."

- title: "Gowrisankaran, Langer, and Zhang (JPE, 2025) - Policy Uncertainty in the Market for Coal Electricity: The Case of Air Toxics Standards"
  file: "Gowrisankaran_Langer_Zhang_JPE_2025.pdf"
  desc: "This note summarizes the paper, which uses EPA CEMS hourly generator data and related EIA/market datasets to build annual profit and SO₂ pollution “surfaces” for 310 merchant coal generators (Eastern Interconnection, 2006–2017), estimates a dynamic oligopoly model of adopt/continue/exit under uncertain MATS enforcement using an Approximate Belief Oligopoly Equilibrium (ABOE) and nested fixed-point simulated maximum likelihood, identifies time-varying subjective enforcement probabilities by comparing MATS units to units under earlier state air-toxics standards as a low-uncertainty benchmark, and runs timing-of-resolution counterfactuals showing earlier uncertainty resolution would raise profits but can increase pollution by keeping marginal coal units operating."

- title: "Delabastita and Rubens (JPE, 2025) - Colluding against Workers"
  file: "Delabastita_Rubens_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops a production-cost and labor-supply framework to separate ordinary oligopsony from employer collusion by (i) estimating firm-year wage markdowns from a production function and input revenue shares (a De Loecker–Warzynski-style cost-side identity) without imposing labor-market conduct, (ii) estimating local labor-supply elasticities using coal-demand shifters and the 1897 cartel shock, and (iii) mapping observed markdowns into a 0–1 collusion index by comparing them to model-implied no-collusion and full-collusion bounds, then applies the method to a unique panel of 227 Belgian coal firms (1845–1913) with observed cartel and employers’-association institutions to quantify that the post-1900 markdown surge reflects collusion and to run counterfactual wage/employment effects of the 1897 Liège cartel."

- title: "Hémous, Olsen, Zanella, and Dechezleprêtre (JPE, 2025) - Induced Automation Innovation: Evidence from Firm-Level Patent Data"
  file: "Hemous_Olsen_Zanella_Dechezlepretre_JPE_2025.pdf"
  desc: "This note summarizes the paper, which quantifies the “textbook” Pigouvian case for industrial policy in a multi-sector open-economy model with external economies of scale and terms-of-trade distortions, estimates sector-specific scale elasticities g(k) from OECD ICIO bilateral trade flows using gravity structure with imported trade elasticities and demand-based instruments for sector size (and an IV estimate of across-sector substitution), and then computes optimal employment subsidies and export taxes plus exact general-equilibrium welfare gains and Harberger-triangle approximations—showing meaningful estimated scale elasticities but modest average gains because equilibrium reallocation across sectors is limited, with larger gains in an extended model with capital and input–output linkages."

- title: "Marra (JPE, 2025) - Estimating an Auction Platform Game with Two-Sided Entry"
  file: "Marra_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops and estimates a two-sided auction-platform model with endogenous bidder entry (Poisson counts with free entry/inspection costs) and heterogeneous seller entry/selection (sellers know values ex ante and choose whether to list and what reserve to set), nonparametrically identifies bidder values from zero-reserve auctions via order statistics and identifies seller values by inverting the optimal reserve-pricing rule, pins down bidder and seller entry costs using zero-profit conditions, and implements a nested pseudo-likelihood–style estimation algorithm on a scraped panel of 3,481 UK wine auctions to run fee-incidence, optimal fee reallocation (commission-index) and antitrust counterfactuals that highlight a “lemons effect” and nonlinear incidence across both sides."

- title: "Fan and Yang (JPE, 2025) - Estimating Discrete Games with Many Firms and Many Decisions: An Application to Merger and Product Variety"
  file: "Fan_Yang_JPE_2025.pdf"
  desc: "This note summarizes the paper, which proposes a scalable estimator for large discrete games by bounding each binary action’s conditional choice probability between “dominant” and “not dominated” regions (yielding moment-inequality restrictions that avoid enumerating equilibria), implements a computational approximation that evaluates best/worst-case rival configurations, and applies the method to a two-stage differentiated-products model of California retail craft beer—estimating demand with a random-coefficients logit using barley-price cost shifters as instruments, backing out marginal costs from pricing FOCs, and then estimating product-entry fixed costs from market-size and distance shifters—to run merger counterfactuals that decompose effects on entry, product variety, prices, and welfare under alternative fixed-cost efficiency assumptions."

- title: "Le Grand and Ragot (JPE, 2025) - Optimal Fiscal Policy with Heterogeneous Agents and Capital: Should We Increase or Decrease Public Debt and Capital Taxes?"
  file: "LeGrand_Ragot_JPE_2025.pdf"
  desc: "This note summarizes the paper, which characterizes optimal Ramsey fiscal policy in a heterogeneous-agent incomplete-markets economy with capital and occasionally binding borrowing constraints, deriving conditions under which the steady-state optimal capital tax is positive (a savings-induced factor-price externality that vanishes under separable CRRA but survives under GHH/DRRA preferences) and establishing existence/stability thresholds, then quantifies the implications in a calibrated HANK model anchored to the U.S. fiscal system via an inverse-optimal mapping of social welfare weights and computes MIT-shock impulse responses showing capital taxes and labor-tax progressivity rise after spending shocks while the optimal public-debt response flips sign with shock persistence (debt smooths transitory shocks but falls under persistent shocks)."

- title: "Wang and Yang (JPE, 2025) - Policy Experimentation in China: The Political Economy of Policy Learning"
  file: "Wang_Yang_JPE_2025.pdf"
  desc: "This note summarizes the paper, which builds a novel database of 652 Chinese “experimentation point” policies from 19,812 central/local government documents (1980–2020), tests representativeness by comparing pre-pilot characteristics of experimentation versus nonexperimentation sites (showing strong positive selection), identifies strategic pilot implementation effort using a triple-differences design on domain-specific local fiscal expenditure shares (county×year, domain×year, and county×domain fixed effects) and text-based implementation differentiation, and shows the center naively interprets pilot outcomes using IV evidence from land-revenue windfalls (land-suitability×interest-rate instrument) and politician-turnover incentive shocks that predict national rollout, plus estimator horse races (naive pre/post predicts rollout, pretrend-adjusted and synthetic control do not) and shrinkage comparisons from pilot to national effects."

- title: "Zaffaroni (JPE, 2025) - Factor Models for Conditional Asset Pricing"
  file: "Zaffaroni_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops a fixed-T, large-N framework for conditional asset pricing by estimating latent factors via local (rolling-window) PCA under no-arbitrage and a scalar cross-section-average idiosyncratic covariance restriction, derives asymptotic theory when only the local factor space (not loadings) is consistently estimated, proposes a fixed-T factor-number criterion and bias-corrected pricing tests for risk premia and the SDF that separate finite-window noise from true misspecification, and validates the approach in Monte Carlo horse races against IPCA/constant PCA and in CRSP monthly stock returns (1980–2019)."

- title: "Rodnyansky, Timmer, and Yago (JFE, 2026) - Intervening against the Fed"
  file: "Rodnyansky_Timmer_Yago_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses high-frequency Fed funds futures shocks around FOMC announcements (90 events, 2000–2019) and daily sterilized FX-intervention data for 13 countries to estimate local-projection event-study DID designs, isolates “unexpected” intervention via residuals from an FXI reaction function, and identifies the corporate balance-sheet channel with firm-level US-dollar-debt heterogeneity (Capital IQ repayment-currency data) in triple-interaction stock-return regressions with country-date fixed effects, showing that selling dollars after US tightening stabilizes exchange rates, currency risk premia, and portfolio flows and largely neutralizes the stock-price hit to dollar-debt firms—especially when reserves are high—while highlighting a tradeoff for exporters and firms with foreign revenues."

- title: "Brandsaas and Kvaerner (JFE, 2026) - Partial Homeownership: A Quantitative Analysis"
  file: "Brandsaas_Kvaerner_JFE_2026.pdf"
  desc: "This note summarizes the paper, which embeds a real-world Norwegian partial-homeownership (deleie) contract from OBOS—allowing households to buy 50–90% of a home and rent the remainder with contract-specific share-adjustment pricing—into a calibrated life-cycle housing model with stochastic income and house prices, mortgage LTV/DTI constraints, and discrete housing-size choice, estimates key preferences and the new “ownership elasticity” parameter by simulated method of moments using Norwegian administrative wealth/homeownership-by-age moments and the observed initial PO share distribution, and then runs quantitative counterfactuals for take-up, willingness-to-pay, debt-to-income distributions, and default under stress scenarios to show PO expands access for young/constrained households while compressing extreme leverage and lowering default risk."

- title: "Backer-Peral, Hazell, and Mian (AER, 2026) - Dynamics of the Long-Term Housing Yield: Evidence from Natural Experiments"
  file: "BackerPeral_Hazell_Mian_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses UK administrative leasehold-extension records matched to transaction prices (and listings/rents for validation) to estimate the causal price gain from extending a lease via a property-level difference-in-differences design with repeat-sales local controls, maps that DiD estimand into the market’s long-run expected housing yield yt(∗) by fitting a discounted-cash-flow pricing equation with a DiD–nonlinear least squares estimator that differences out the short end of the yield curve, and then analyzes time-series and cross-sectional patterns in yt(∗) (real-time updating, comparisons to other asset yields, and links to climate risk and housing supply elasticity using an IV based on post-2002 planning-delay reforms)."

- title: "Bordalo, Gennaioli, Shleifer, and Terry (AER, 2026) - Real Credit Cycles"
  file: "Bordalo_Gennaioli_Shleifer_Terry_AER_2026.pdf"
  desc: "This note summarizes the paper, which documents predictable managerial forecast errors (IBES guidance matched to Compustat) and firm-level boom–bust reversals in bond returns and investment, embeds diagnostic expectations into a heterogeneous-firm neoclassical model with risky debt, default, and adjustment costs so borrowers and lenders overreact to TFP news and endogenously generate compressed spreads in booms and sharp spread/investment reversals when optimism fades, and estimates the model by simulated method of moments using forecast-error covariance moments to identify the diagnosticity parameter (alongside macro spread/default targets and TRACE/FISD bond data), showing the DE model matches spread volatility and the 2007–2009 crisis dynamics far better than a rational-expectations benchmark."

- title: "Khanna, Murathanoglu, Theoharides, and Yang (AER, 2026) - Abundance from Abroad: Migrant Income and Long-Run Economic Development"
  file: "Khanna_Murathanoglu_Theoharides_Yang_AER_2026.pdf"
  desc: "This note summarizes the paper, which studies Philippine provinces after the 1997 Asian Financial Crisis using a province-level migrant-income shift-share shock that interacts persistent destination exchange-rate changes with pre-crisis province–destination migrant income exposure weights built from matched POEA–OWWA administrative data, estimates province and time fixed-effects regressions and event studies (with flexible controls for the shock components and trade-shift-share confounders), and then quantifies channels—education upgrades, migration reallocation toward higher-paying destinations (gravity elasticity), spending multipliers and enterprise investment, and structural change out of primary sectors—showing most long-run gains come from domestic income rather than migrant income."

- title: "Brandt, Van Biesebroeck, Wang, and Zhang (JDE, 2026) - Where Has All the Dynamism Gone? Productivity Growth in China’s Manufacturing Sector, 1998–2013"
  file: "Brandt_VanBiesebroeck_Wang_Zhang_JDE_2026.pdf"
  desc: "This note summarizes the paper, which combines China’s NBS above-scale industrial survey with the STA tax survey (1998–2013) to repair post-2007 data problems by estimating year-specific density-ratio (importance) weights from the overlap and drawing simulated representative STA samples, estimates gross-output production functions separately pre/post-2007 using the Gandhi–Navarro–Rivers (2020) estimator, and aggregates output-share-weighted firm TFP to document a sharp, broad-based collapse in manufacturing TFP growth after 2007 (with ownership/industry/region and young-vs-old-firm decompositions and robustness checks)."

- title: "Brandt, Van Biesebroeck, and Zhang (JDE, 2012) - Creative Accounting or Creative Destruction? Firm-level Productivity Growth in Chinese Manufacturing"
  file: "Brandt_VanBiesebroeck_Zhang_JDE_2012.pdf"
  desc: "This note summarizes the paper, which uses the NBS above-scale Chinese manufacturing firm panel (1998–2007) with extensive cleaning (firm ID linking through restructuring, deflators, and real-capital construction) to measure productivity using a benchmark Törnqvist index-number approach (gross-output and value-added) with OP/ACF production-function estimates as robustness, and then decomposes aggregate manufacturing growth into incumbent TFP, entry/exit (creative destruction), and within-incumbent reallocation (Olley–Pakes/BHC-style covariance) plus ownership-based breakdowns, showing exceptionally rapid TFP growth driven mainly by net entry and post-entry learning but relatively weak productivity-enhancing reallocation among surviving firms."

- title: "Dix-Carneiro, Goldberg, Meghir, and Ulyssea (Econometrica, 2026) - Trade and Domestic Distortions: The Case of Informality"
  file: "DixCarneiro_Goldberg_Meghir_Ulyssea_Econometrica_2026.pdf"
  desc: "This note summarizes the paper, which builds and estimates a dynamic open-economy general-equilibrium model of Brazil with heterogeneous firms, formal–informal status choice under size-dependent imperfect enforcement, and a search-and-matching labor market with payroll/VAT taxes, firing costs, and minimum wages, disciplines the framework using seven matched Brazilian datasets (RAIS, ECINF, PME, PIA/PAS/PAC, SECEX) via indirect inference on dozens of moments (size–informality gradients, productivity/wage gaps, turnover, unemployment flows, exporter shares), and then runs trade-cost counterfactuals that decompose gains into mechanical import-price effects versus distortion-driven reallocation (showing informality amplifies trade gains but also shapes unemployment buffering and inequality responses)."

- title: "Bernstein, Frydman, and Hilt (JPE, 2026) - The Value of Ratings: Evidence from Their Introduction in Securities Markets"
  file: "Bernstein_Frydman_Hilt_JPE_2026.pdf"
  desc: "This note summarizes the paper, which exploits the April-1909 introduction of Moody’s first letter-graded railroad bond ratings in a regulation-free setting, constructs “negative rating surprises” by comparing Moody’s ratings to prerating yield quartiles, and estimates bond-week difference-in-differences/event-study (and within-railroad bond-level) yield regressions with bond and week fixed effects and rating-level trends showing yields rise after negative surprises, then identifies liquidity effects of being rated using NYSE bid–ask quote panels and a 2SLS design instrumenting rating status with the issuer’s other bonds’ prerating yields, complemented by underwriter-board-connection heterogeneity and trade-size (single-lot) participation tests."

- title: "Jiang (RFS, 2023) - Financing Competitors: Shadow Banks’ Funding and Mortgage Market Competition"
  file: "Jiang_RFS_2023.pdf"
  desc: "This note summarizes the paper, which builds a new loan-level panel of shadow-bank warehouse credit lines from S.A.F.E. Mortgage Licensing Act call reports matched to HMDA, shows that shadow banks’ warehouse funding is concentrated in banks that compete with them in the same local mortgage markets using overlap-based matching regressions with bank-year and shadow-bank-year fixed effects, identifies lender differentiation and limited substitutability via a DiD around the 2014 oil-price net-worth shock to exposed banks, documents strategic vertical conduct with reduced-form “cannibalization” (funding less in concentrated downstream markets) and “funding-channel” (banks with larger warehouse shares charge higher mortgage rates) regressions, and then calibrates a structural model of upstream warehouse pricing and downstream mortgage competition to quantify welfare and policy counterfactuals such as shortening warehouse duration through secondary-market innovations."

- title: "Begenau and Palazzo (JFE, 2021) - Firm Selection and Corporate Cash Holdings"
  file: "Begenau_Palazzo_JFE_2021.pdf"
  desc: "This note summarizes the paper, which documents that the post-1970s rise in U.S. public-firm cash is largely a cohort/selection effect (entrants arrive with progressively higher cash while incumbents run cash down), formalizes this with an accounting decomposition of aggregate cash growth into within-incumbent versus entry/exit components split by R&D-intensive versus non-R&D sectors, and then structurally estimates a dynamic corporate finance model with costly equity issuance and cash carry costs, decreasing returns, mean-reverting productivity, and heterogeneous entry signals via simulated method of moments to match entry and lifecycle cash/investment/volatility moments and quantify how changing entrant composition and risk drive the secular trends."

- title: "Lyonnet and Chrétien (RFS, 2026) - Why Do Traditional and Shadow Banks Coexist?"
  file: "Lyonnet_Chretien_RFS_2025.pdf"
  desc: "This note summarizes the paper, which builds a three-date equilibrium model where shadow banks can issue money-like debt in good times because they expect insured traditional banks to buy their risky assets at fire-sale prices in crises (creating a crisis-asset-market complementarity that supports coexistence), disciplines the mechanism with crisis evidence from 2007 and 2020 on liability runs out of shadow banks, deposit inflows into large traditional banks, asset transfers (notably MBS) from shadow to traditional balance sheets, and fire-sale price pressure, and tests the key prediction with bank-level regressions showing insured-deposit inflows predict MBS purchases during 2007–2009, then uses the model for comparative statics on regulation/crisis risk and a planner exercise showing the market equilibrium has too many shadow banks."

- title: "Huang, Pagano, and Panizza (JF, 2020) - Local Crowding-Out in China"
  file: "Huang_Pagano_Panizza_JF_2020.pdf"
  desc: "This note summarizes the paper, which constructs a new prefecture-level panel of Chinese local government debt via LGFV bond-disclosure balance sheets (2006–2013) matched to ASIF firm data, documents geographic credit-market segmentation, and identifies local crowding-out of private investment by estimating firm and city(-year) fixed-effects regressions supplemented with three within-city identification strategies—proximity to outside-city banks, Rajan–Zingales-style industry external-finance dependence interactions, and cash-flow-sensitivity (plus an endogenous switching-regression regime split)—showing that rising local debt tightens credit constraints and reduces investment/leverage mainly for private and small firms while SOEs are largely insulated."

- title: "Cull and Xu (JDE, 2003) - Who gets credit? The behavior of bureaucrats and state banks in allocating credit to Chinese state-owned enterprises"
  file: "Cull_Xu_JDE_2003.pdf"
  desc: "This note summarizes the paper, which uses two linked surveys of Chinese manufacturing SOEs (1980–1994) to compare how state banks versus government bureaucracies allocated external finance for fixed investment, estimating probit/tobit reduced-form credit-supply regressions of bank- and government-finance access/shares on lagged profitability, payment history, governance oversight, and reform “signal” variables from the Contract Responsibility System (performance contracts, wage–profit elasticity, base-profit retention) with time interactions to track changes across the 1980s and 1990s, and interpreting the core tables/figures showing banks became more profitability-sensitive in the 1980s but less so in the 1990s as bailout responsibilities shifted onto banks, while government transfers remained weakly tied to performance."

- title: "Lee (JFE, 2026) - Face-to-face Social Interactions and Local Informational Advantage"
  file: "Lee_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses U.S. active equity mutual-fund holdings and hand-collected manager locations to split portfolios into local (within 100 miles of firm HQ) versus distant stocks, exploits COVID-19 stay-at-home orders, mobility (SafeGraph foot-traffic collapses), and local case counts as shocks to face-to-face interactions in a fund-level difference-in-differences on benchmark- and DGTW-adjusted returns, and then pinpoints a timing channel with stock×time fixed-effect regressions of local-versus-distant weight changes on contemporaneous returns and subsequent abnormal-return tests, complemented by mechanism heterogeneity using trust-distance and CEO-delta (impression management) measures and alternative-channel checks."

- title: "Metrick and Schmelzing (RFS, 2026) - Banking-Crisis Interventions across Time and Space"
  file: "Metrick_Schmelzing_RFS_2026.pdf"
  desc: "This note summarizes the paper, which builds a new cross-country historical database of 1,946 banking-crisis interventions (7 major categories and 20 subcategories) across 910 crisis episodes in 143 countries, uses a balance-sheet-based taxonomy to code policy tools and logit regressions with precrisis covariates (income, fiscal space, polity, and exchange-rate regime) to describe how intervention mixes vary across time and countries, measures medium-run output losses with a five-year cumulative GDP-gap-to-trend metric and relates them to crisis types and country characteristics, and aggregates the series back to 1665 to document long-run trends in intervention frequency and advanced-economy bank-stress shares."

- title: "Neuhann, Sefidgaran, and Sockin (RFS, 2026) - Portfolio Regulation of Financial Institutions with Market Power"
  file: "Neuhann_Sefidgaran_Sockin_RFS_2026.pdf"
  desc: "This note summarizes the paper, which develops a Cournot–Walras equilibrium model in which large financial institutions trade strategically with price impact so the regulator’s key policy lever is the asset span (complete Arrow markets vs. bundled/restricted portfolios), characterizes when complete markets are constrained-inefficient (too much state-contingent rent extraction when N<Z) and how a “missing asset” representation guides welfare-improving bundling, and calibrates the framework to sovereign bond and CDS markets to evaluate a ban on naked CDS (covered-bond-only trading) by matching yields, bond/CDS bid–ask spreads, and the CDS–bond basis and comparing complete-markets versus regulated counterfactual outcomes."

- title: "Maggio and Kermani (RFS, 2017) - Credit-Induced Boom and Bust"
  file: "Maggio_Kermani_RFS_2017.pdf"
  desc: "This note summarizes the paper, which exploits the 2004 OCC preemption of state anti-predatory lending laws as a regulatory credit-supply shock, estimates agency-level first-stage and county-level triple-difference/event-study regressions that interact APL status, Post-2004, and counties’ predetermined 2003 national-bank (OCC) lending share, and then uses the interaction as an IV for local mortgage origination to quantify effects on house-price growth, nontradable employment, and boom-bust delinquency dynamics, supported by placebo/border-tract designs and risk-lending mechanism tests (high-cost and high-DTI loans)."

- title: "Begley and Srinivasan (RFS, 2022) - Small Bank Lending in the Era of Fintech and Shadow Banks: A Sideshow?"
  file: "Begley_Srinivasan_RFS_2022.pdf"
  desc: "This note summarizes the paper, which uses HMDA lender-class×county mortgage origination data (2008–2015) to estimate local substitution regressions showing small banks expand most where the Big4 retreat, identifies the Big4 retreat with two county-level IVs (predetermined 2008 Big4 share and exposure to Big4 mortgage-lawsuit penalties) to isolate supply-driven reallocation, and then tests mechanisms by splitting outcomes into balance-sheet versus sold (GSE) lending and exploiting the 2011–2015 GSE guarantee-fee parity/level shocks (with jumbo-loan placebos and validation tests) to show small banks’ comparative advantage is retained lending."

- title: "Restuccia and Rogerson (RED, 2008) - Policy Distortions and Aggregate Productivity with Heterogeneous Establishments"
  file: "Restuccia_Rogerson_RED_2008.pdf"
  desc: "This note summarizes the paper, which builds a neoclassical growth model with heterogeneous establishments, decreasing returns, and entry/exit where idiosyncratic output (and factor-cost) taxes/subsidies distort plant scale, calibrates the undistorted benchmark to U.S. establishment size and macro moments, and then runs quantitative policy-counterfactuals contrasting uncorrelated versus productivity-correlated distortions (with fixed-capital and endogenous-capital variants and alternative tax bases) to show that misallocation—especially subsidies to low-productivity plants and taxes on high-productivity plants—can generate large (≈30–50%) losses in aggregate output and measured TFP."

- title: "Straub and Ulbricht (RES, 2024) - Endogenous Uncertainty and Credit Crunches"
  file: "Straub_Ulbricht_RES_2024.pdf"
  desc: "This note summarizes the paper, which develops a general-equilibrium model where firms need bank funding to operate a risky high-productivity technology and where learning is endogenous—firms denied credit switch to a safe low-productivity technology and generate less information, so their posterior uncertainty rises and future credit tightens via a belief-threshold lending rule—quantifies how this credit–learning feedback turns a temporary financial shock into a persistent credit crunch by comparing to an exogenous-uncertainty counterfactual, and shows the mechanism survives in capital (RBC-wedge) and New Keynesian extensions and in Bayesian estimation to U.S. macro/lending data (including a Great Recession interpretation)."

- title: "Huneeus and Rogerson (RES, 2024) - Heterogeneous Paths of Industrialization"
  file: "Huneeus_Rogerson_RES_2024.pdf"
  desc: "This note summarizes the paper, which documents heterogeneous (non-agriculture share, manufacturing employment share) industrialization paths in GGDC data, builds a three-sector structural-change model with subsistence in agriculture and manufacturing–services complementarity that generates a hump-shaped manufacturing share, calibrates the benchmark to U.S. 1880–1950 data, and then inverts the model country by country to infer the sectoral productivity-growth profiles consistent with observed employment shares—showing that cross-country differences in agricultural productivity growth explain most of the variation in the level and timing of peak manufacturing (“premature deindustrialization”)."

- title: "Bergeaud, Schmidt, and Zago (JFE, 2026) - Patents that match your standards: Firm-level evidence on competition, innovation and growth"
  file: "Bergeaud_Schmidt_Zago_JFE_2026.pdf"
  desc: "This note summarizes the paper, which links 7.5M U.S. patents to ~0.65M standards using TF-IDF cosine-similarity text matching to construct a firm-quarter “technological proximity to newly released standards” measure, validates the measure with patent-value/citations/renewal regressions, and estimates distributed lead–lag event-study panels with firm and NAICS3×time fixed effects to track abnormal returns and EPS revisions around the draft-release window and subsequent dynamics in sales, market share, and R&D (with heterogeneity by industry competitiveness), then aggregates to industry-level growth and convergence/citation-spillover tests showing temporary leader gains but longer-run follower catch-up and lower concentration."

- title: "Blickle, Parlatore, and Saunders (JF, 2026) - Specialization in Banking"
  file: "Blickle_Parlatore_Saunders_JF_2026.pdf"
  desc: "This note summarizes the paper, which uses U.S. supervisory Y-14Q C&I loan data (2012Q2–2023Q2) to construct bank–industry “excess/relative specialization” measures, estimates loan-level panel regressions with saturated bank-time and industry-time fixed effects (plus internal risk-rating, pricing/terms, relationship, and geography controls and SNC size heterogeneity) showing that loans originated in a bank’s specialized industries are less likely to become nonperforming, documents correlated rent-sharing in loan terms (larger, cheaper, longer—especially for unsecured borrowers), and extends to bank-level and deposit-shock exercises linking specialization to stability/profitability trade-offs and the industry allocation of COVID-era deposit inflows."

- title: "Ayyagari, Demirguc-Kunt, and Maksimovic (RFS, 2010) - Formal versus Informal Finance: Evidence from China"
  file: "Ayyagari_DemirgucKunt_Maksimovic_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses the 2003 World Bank Investment Climate Survey for ~2,400 Chinese firms (with 1999–2002 performance data) to compare formal bank finance versus informal/self-financing, estimates baseline city-fixed-effects regressions of sales growth, productivity growth, and profit reinvestment on bank-access measures, and addresses endogeneity with a Heckman-style treatment-effects/selection model and LIML-IV and propensity-score matching that instrument loan access with collateral availability (and government-help robustness and nonapplicant comparisons), concluding that bank finance is the financing margin most robustly associated with faster growth and reinvestment while external informal finance is not."

- title: "Levinsohn and Petrin (RES, 2003) - Estimating Production Functions Using Inputs to Control for Unobservables"
  file: "Levinsohn_Petrin_RES_2003.pdf"
  desc: "This note summarizes the paper, which extends the Olley–Pakes proxy-variable approach by using intermediate inputs (materials/electricity) instead of investment to proxy for unobserved productivity in a gross-output production function when investment is frequently zero, identifies the flexible non-proxy input coefficients in a first-stage partially linear regression after inverting a monotone intermediate-input demand function, identifies the proxy-input and capital coefficients in a second-stage GMM using lagged proxy inputs and predetermined capital as instruments (with monotonicity plots, proxy-invariance, and over-identification diagnostics), and applies the method to Chilean manufacturing plants to show OLS overstates variable-input elasticities and understates capital relative to LP."

- title: "Olley and Pakes (Econometrica, 1996) - The Dynamics of Productivity in the Telecommunications Equipment Industry"
  file: "Olley_Pakes_Econometrica_1996.pdf"
  desc: "This note summarizes the paper, which introduces the Olley–Pakes semiparametric production-function estimator by modeling firms’ dynamic investment and endogenous exit decisions, inverting a monotone investment policy to proxy for unobserved productivity in a partially linear first stage and using a survival-probability selection correction to identify capital and age coefficients in a second stage, and then applies the method to U.S. telecommunications equipment plants (1974–1987) to show that post-deregulation productivity growth comes mainly from reallocation (the OP mean-plus-covariance decomposition) rather than from rising average plant productivity or improved within-plant variable-input efficiency."

- title: "Khandelwal, Schott, and Wei (AER, 2013) - Trade Liberalization and Embedded Institutional Reform: Evidence from Chinese Exporters"
  file: "Khandelwal_Schott_Wei_AER_2013.pdf"
  desc: "This note summarizes the paper, which uses Chinese customs transaction data to study the 2005 abolition of MFA export quotas and implements a product×destination difference-in-differences design comparing quota-bound versus quota-free markets for the same HS product, tests an efficient auction-allocation benchmark by decomposing post-reform adjustment into incumbent versus entrant/adders/exiter market-share and price components (including Griliches–Regev and quality-adjusted price decompositions), and then calibrates counterfactual “auction” versus “political” quota allocation scenarios to show that most productivity gains come from dismantling the misallocating licensing institution (reallocation away from SOEs toward private entrants) rather than from removing the quota itself."

- title: "Hsieh and Klenow (QJE, 2009) - Misallocation and Manufacturing TFP in China and India"
  file: "Hsieh_Klenow_QJE_2009.pdf"
  desc: "This note summarizes the paper, which builds a monopolistic-competition model with plant-level output and capital wedges that implies TFPR should be equalized within narrowly defined industries, uses plant-level manufacturing data for China, India, and the United States to construct TFPQ/TFPR and back out implied marginal-product distortions, and then computes counterfactual aggregate manufacturing TFP gains from reallocating labor and capital to reduce TFPR dispersion (full equalization and “U.S.-efficiency” benchmarks) with extensive robustness and policy-diagnostics exercises."

- title: "Bartelsman, Haltiwanger, and Scarpetta (AER, 2013) - Cross-Country Differences in Productivity: The Role of Allocation and Selection"
  file: "Bartelsman_Haltiwanger_Scarpetta_AER_2013.pdf"
  desc: "This note summarizes the paper, which uses harmonized cross-country firm-level manufacturing moments (U.S., Western Europe, and transition economies) to document that the Olley–Pakes size–productivity covariance varies much more systematically across countries than dispersion measures, and then disciplines a heterogeneous-firm model with overhead labor, quasi-fixed capital, and endogenous entry/exit by running distortion-distribution counterfactuals calibrated to match each country’s covariance moment—showing how distortions weaken both allocation and selection and implying sizable cross-country consumption/productivity gaps."

- title: "Braguinsky, Ohyama, Okazaki, and Syverson (AER, 2015) - Acquisitions, Productivity, and Profitability: Evidence from the Japanese Cotton Spinning Industry"
  file: "Braguinsky_Ohyama_Okazaki_Syverson_AER_2015.pdf"
  desc: "This note summarizes the paper, which uses the universe of Japanese cotton-spinning plants (1896–1920) with physical output, prices, operating days, and service-flow inputs to estimate quantity-based TFP (TFPQ) and profitability (ROCE), implements within-plant event-study and within-deal DiD comparisons around acquisitions, decomposes post-acquisition profit gains into price margins versus input-intensity/utilization and productivity components, and links the mechanism to “demand management” using inventory/accrued-payment measures and network/engineer heterogeneity, interpreting the core tables and figures on why more profitable acquirers improve underutilized but not necessarily low-TFP targets."

- title: "Brandt, Tombe, and Zhu (RED, 2013) - Factor Market Distortions Across Time, Space and Sectors in China"
  file: "Brandt_Tombe_Zhu_RED_2012.pdf"
  desc: "This note summarizes the paper, which builds a province×ownership-sector allocation model with Cobb–Douglas production and CES aggregation to map observed labor/capital wedges (identified from value-product ratios and provincial price levels, with sectoral prices inferred from nominal shares) into efficient-versus-actual aggregate TFP for China’s non-agricultural economy (1985–2007), and then runs counterfactual decompositions that separate within-province state–nonstate versus between-province distortions and labor versus capital wedges—showing large average TFP losses and a post-1997 deterioration driven mainly by within-province capital misallocation toward the state sector."

- title: "Asker, Collard-Wexler, and De Loecker (JPE, 2014) - Dynamic Inputs and Resource (Mis)Allocation"
  file: "Asker_CollardWexler_DeLoecker_JPE_2014.pdf"
  desc: "This note summarizes the paper, which develops a dynamic investment model with time-to-build and fixed/convex adjustment costs to show that higher TFPR volatility mechanically generates higher cross-sectional dispersion in the static MRPK (even under efficient behavior), documents the prediction in multiple producer-level panels (within- and cross-country MRPK-dispersion-on-volatility regressions and firm-level MRPK responses to TFPR shocks), and then structurally estimates industry-country TFPR AR(1) processes and capital-adjustment-cost parameters (via minimum-distance matching of capital-change moments) to quantify how much observed MRPK dispersion the dynamic benchmark can explain."

- title: "Koijen and Yogo (JPE, 2019) - A Demand System Approach to Asset Pricing"
  file: "Koijen_Yogo_JPE_2019.pdf"
  desc: "This note summarizes the paper, which builds an equilibrium asset-pricing model with heterogeneous, characteristics-based investor demand estimated from 13F holdings (plus a residual household sector), instruments for endogenous prices/market equity using other investors’ investment-universe overlap × wealth (a counterfactual “equal-weight over feasible assets” market-equity shifter), and then uses the estimated demand system and market clearing to compute institution-level and aggregate price impact, variance decompositions of stock returns into supply/characteristics/AUM/latent-demand components, the role of large institutions in 2008 volatility, and return predictability from mean reversion in latent demand."

- title: "Garfinkel & Hammoudeh (RFS, 2025) Competition and Innovation Revisited: A Project-Level View"
  file: "Garfinkel_Hammoudeh_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses Cortellis pharmaceutical project-level data (2010–2021) and FDA Breakthrough Therapy Designation (BTD) awards as market-specific “unleveling” shocks, validates surprise with announcement-return event studies, and estimates Cox hazard/event-time designs for rivals’ phase-II→phase-III continuation that interact BTD shocks with therapeutic-market competition and technology overlap (SM vs. SMST) to recover an inverted-U competition–innovation response and a distance-to-frontier channel, complemented by manufacturing-scope benchmarks and resource-reallocation tests."

- title: "Gandhi, Navarro, and Rivers (JPE, 2020) - On the Identification of Gross Output Production Functions"
  file: "Gandhi_Navarro_Rivers_JPE_2020.pdf"
  desc: "This note summarizes the paper, which proves that standard proxy-variable/dynamic-panel methods generically fail to identify gross-output production functions when intermediate inputs are flexible, then introduces a new nonparametric identification strategy that uses the flexible-input first-order condition to estimate the intermediate-input elasticity from revenue shares via a share regression, integrates this elasticity to recover the production function up to an integration constant that is pinned down with lagged-input Markov moments (implemented with a two-step sieve estimator), and illustrates the approach in Monte Carlo simulations and Chilean/Colombian plant data."

- title: "De Loecker (Econometrica, 2011) - Product Differentiation, Multiproduct Firms, and Estimating the Impact of Trade Liberalization on Productivity"
  file: "DeLoecker_Econometrica_2011.pdf"
  desc: "This note summarizes the paper, which combines Belgian textile production data with firm-level product mix and EU quota-liberalization exposure to embed a segment-level demand system inside a (multi-product) production-function framework, estimates demand-contaminated revenue equations with rich product/product-group and protection controls and a timing restriction (current quotas shift prices/demand, lagged quotas shift productivity), and then uses OP/LP-style proxy estimators (materials or investment controls) to recover corrected physical productivity and re-estimate the true productivity impact of quota removal—showing standard revenue-based methods substantially overstate the gains."

- title: "De Loecker & Warzynski (AER, 2012) - Markups and Firm-Level Export Status"
  file: "DeLoecker_Warzynski_AER_2012.pdf"
  desc: "This note summarizes the paper, which develops a production-function-based markup estimator from a flexible-input cost-minimization FOC (μ=θX/αX), estimates firm- and time-varying output elasticities with an OP/LP/ACF-style control-function approach (using materials to proxy for unobserved productivity and a second-stage productivity law of motion with moment conditions), corrects input expenditure shares using first-stage residuals, and applies the method to Slovenian manufacturing to run cross-sectional and within-firm export-entry regressions of log markups (plus robustness to unobserved prices and destination-market decompositions)."

- title: "Collard-Wexler & De Loecker (AER, 2015) - Reallocation and Technology: Evidence from the US Steel Industry"
  file: "CollardWexler_DeLoecker_AER_2015.pdf"
  desc: "This note summarizes the paper, which uses U.S. Census steel plant data (1963–2002) to estimate technology-specific production functions with Olley–Pakes investment/selection corrections and plant-specific output/input price deflators, quantifies the minimill productivity premium, and decomposes aggregate TFP growth into within-plant improvement, within-technology and between-technology reallocation (Olley–Pakes covariance and entry/exit terms), complemented by De Loecker–Warzynski markup estimates to link minimill diffusion to intensified competition and incumbent (integrated-plant) selection."

- title: "Koijen & Yogo (AER: Insights, 2023) - Understanding the Ownership Structure of Corporate Bonds"
  file: "Koijen_Yogo_AERInsights_2023.pdf"
  desc: "This note summarizes the paper, which combines long-run institutional holdings data (Financial Accounts and NAIC portfolios) with a two-period equilibrium asset-pricing model featuring leverage-constrained households/institutions and risk-based-capital regulation for insurers, shows how leverage constraints flatten the security market line so low-beta assets earn positive alpha that insurers can lever via underwriting (annuities), derives the resulting optimal insurer tilt toward investment-grade corporate bonds (and comparative statics for downgrades and life vs. P&C behavior), and interprets the four core descriptive figures on corporate-bond ownership, portfolio composition, rating-bucket tilts, and time-varying portfolio credit risk."

- title: "Gabaix & Koijen (JPE, 2024) - Granular Instrumental Variables"
  file: "Gabaix_Koijen_JPE_2024.pdf"
  desc: "This note summarizes the paper, which develops “granular instrumental variables” by isolating idiosyncratic shocks to large entities in a factor-structured panel, constructs the optimal GIV as the size vector projected orthogonally to common-factor loadings (collapsing to size-weighted minus equal-weighted outcomes in the one-factor case), and shows how to use the resulting instrument in IV/OLS moment conditions to identify supply–demand elasticities, pass-through, and extensions with controls, recoverable factors, and heterogeneous elasticities."

- title: "Koijen & Yogo (JPE, forthcoming) - Exchange Rates and Asset Prices in a Global Demand System"
  file: "Kojien_Yogo_ForthcomingJPE.pdf"
  desc: "This note summarizes the paper, which estimates a global nested-logit asset demand system for 37 countries (2003–2020) across short-term debt, long-term debt, and equity using international portfolio holdings and an expected-return index that depends on asset prices and real exchange rates, identifies within-asset-class demand elasticities with a gravity-driven residual-supply IV (predicted demand from other investors based on distance/home bias minus predicted supply based on country size) and identifies across-asset-class substitution with home-bias–shifted outside weights, then uses market clearing to recover latent demand and perform variance decompositions and crisis/convenience-yield counterfactuals for exchange rates, yields, and equity prices."

- title: "Lauermann & Wolinsky (RES, 2026) - Auctions with Frictions: Recruitment, Entry, and Limited Commitment"
  file: "Lauermann_Wolinsky_RES_2016.pdf"
  desc: "This note summarizes the paper, which develops a theoretical first-price auction model with costly bidder recruitment (Poisson contacts), costly bidder entry (paid to learn values), and limited seller commitment, compares participation-observable (PO) versus participation-unobservable (PU) environments, characterizes equilibrium recruitment/entry as fixed points of bidders’ break-even participation threshold and the seller’s marginal-revenue condition (yielding PO uniqueness but PU multiplicity with an always-present no-trade equilibrium), and uses the model’s comparative statics and welfare benchmark to interpret when transparency increases revenue/trade versus when hidden participation acts as an endogenous commitment device."

- title: "David, Hopenhayn, and Venkateswaran (QJE, 2016) - Information, Misallocation, and Aggregate Productivity"
  file: "David_Hopenhayn_Venkateswaran_QJE_2016.pdf"
  desc: "This note summarizes the paper, which embeds noisy firm learning and noisy rational-expectations stock prices into a heterogeneous-firm GE model to make residual uncertainty V a sufficient statistic for informational misallocation, identifies V by matching production-side moments with stock-market moments (the cross-sectional correlations of lagged returns with future fundamentals and with investment, plus return volatility), quantifies implied TFP/output losses for the U.S., China, and India under “capital-only” versus “capital-and-labor” information frictions, and validates the inferred uncertainty measure using I/B/E/S-guidance forecast errors and macro micro-uncertainty benchmarks."

- title: "Brown, Martinsson, and Thomann (RFS, 2022) - Can Environmental Policy Encourage Technical Change? Emissions Taxes and R&D Investment in Polluting Firms"
  file: "Brown_Martinsson_Petersen_RFS_2022.pdf"
  desc: "This note summarizes the paper, which combines OECD country-year SOx emissions-tax variation (1990–2012) with a pre-determined industry SOx-intensity measure (Levinson 1987 U.S. emissions) to implement a Rajan–Zingales-style differential-exposure DiD in firm-year panels (firm FE + country-year and industry-year controls, plus event-time lead/lag checks), then tests whether the response is “first-face” invention or “second-face” absorptive/process R&D using PATSTAT triadic/clean patents, process-R&D and spillover-sector subsamples, and market-value regressions for the marginal value of R&D."

- title: "Mann (JFE, 2018) - Creditor Rights and Innovation: Evidence from Patent Collateral"
  file: "Mann_JFE_2018.pdf"
  desc: "This note summarizes the paper, which uses USPTO patent-collateral (security-interest) filings matched to NBER/Compustat to measure patent pledgeability, and exploits four federal court decisions (2002/2003/2007/2009) that increased the relevance of state secured-transactions law—creating a Delaware-versus-non-Delaware stacked DiD/event-study—to identify how stronger creditor rights to patents raise firms’ debt capacity, R&D spending, and (lagged) patenting, supported by heterogeneity/placebo tests (no-patent firms; trademarks) and citation-weighted output dynamics."

- title: "Terry, Chaney, Burchardi, Tarquinio, & Hassan (AER, 2026) - Immigration, Innovation, and Growth"
  file: "Terry_Chaney_Burchardi_Tarquinio_Hassan_AER_2026.pdf"
  desc: "This note summarizes the paper, which studies U.S. counties (1975–2010) using a two-step predicted-ancestry shift-share instrument—first predicting preexisting ancestry from historical 1880–1930 push–pull migration forces with leave-out restrictions, then interacting predicted ancestry with contemporaneous national inflows by origin to instrument county immigration—estimates county–five-year difference regressions and IHS elasticities for patenting and wages with extensive randomization/inference checks, and disciplines a quantitative regional endogenous-growth migration model by matching the innovation–immigration elasticity to run counterfactuals for innovation and output."

- title: "Iaria, Schwarz, and Waldinger (QJE, 2018) - Frontier Knowledge and Scientific Production: Evidence from the Collapse of International Science"
  file: "Iaria_Schwarz_Waldinger_QJE_2018.pdf"
  desc: "This note summarizes the paper, which uses WWI and the postwar Allied boycott as a geopolitical shock that collapsed cross-camp scientific exchange, documents the first stage with paper-level citation-share regressions (home vs. inside-camp vs. outside-camp) and LSA title-similarity measures, and then estimates a shift-share-style scientist-year DiD/event study that interacts post-1914 with field–country prewar reliance on frontier (top 1%/3%/5%) foreign research to identify causal effects on publications, Nobel-level output, and novel (patent-relevant) scientific words."

- title: "Zacchia (RES, 2020) - Knowledge Spillovers through Networks of Scientists"
  file: "Zacchia_RES_2020.pdf"
  desc: "This note summarizes the paper, which builds a firm-to-firm scientist network from inventor co-patenting histories to construct a connection-weighted external R&D stock, estimates firm-year production-function regressions with firm and year fixed effects, and identifies causal knowledge spillovers using a network-distance IV that instruments neighbors’ R&D with the R&D of sufficiently distant “indirect friends” (preferred distance 3), complemented by System GMM and social-return calculations."

- title: "Akcigit, Hanley, and Serrano-Velarde (RES, 2021) - Back to Basics: Basic Research Spillovers, Innovation Policy, and Growth"
  file: "Akcigit_Hanley_Serrano_Velarde_RES_2021.pdf"
  desc: "This note summarizes the paper, which builds a multi-industry Schumpeterian growth model distinguishing basic vs. applied R&D, identifies cross-industry spillovers from French firm-level R&D survey data (2000–2006) using Tobit regressions of basic-research intensity on multi-industry scope and an IV based on 1980s state-led conglomeration, disciplines within-industry spillovers and cooldown with patent-citation moments, structurally estimates the full GE model by simulated method of moments, and runs planner/subsidy counterfactuals showing large welfare gains from heavily subsidizing basic research relative to applied."

- title: "Accominotti, Albers, and Oosterlinck (RFS, 2024) - Selective Default Expectations"
  file: "Accominotti_Albers_Oosterlinck_RFS_2024.pdf"
  desc: "This note summarizes the paper, which exploits identical sterling Dawes bonds traded in London versus continental markets and the June-1934 transfer moratorium/affidavit rules that segmented secondary markets to identify selective-default expectations, decomposes cross-market yield spreads into default-versus-liquidity components using a simple risk-neutral pricing framework (with Roll-implied bid–ask spreads), validates segmentation with Jordà local projections, and traces creditor-specific news effects with event-study and difference-in-differences specifications."

- title: "Bisetti, Li, & Yu (RFS, 2024) - The Technical Default Spread"
  file: "Bisetti_Li_Yu_RFS_2024.pdf"
  desc: "This note summarizes the paper, which combines a calibrated macro–finance model with endogenous loan covenants that shift control rights to lenders in technical default with an empirical design that constructs DealScan-based covenant strictness (ex ante breach probability) and tests its pricing and real effects using strictness-sorted portfolios and Fama–MacBeth regressions, an RDD around covenant-threshold violations, and macro-risk exposure/sensitivity regressions for investment, profitability, and cash flows."

- title: "Bartram, Conrad, Lee, and Subrahmanyam (RFS, 2022) - Credit Default Swaps around the World"
  file: "Bartram_Conrad_Lee_Subrahmanyam_RFS_2022.pdf"
  desc: "This note summarizes the paper, which extends the Bolton–Oehmke “empty creditor” framework by adding legal uncertainty about CDS trigger-event recognition and then uses Markit-based CDS introductions for 56k+ nonfinancial firms in 51 countries (2001–2015) to estimate propensity-score overlap-weighted panel regressions of leverage (and investment) on CDS introduction interacted with creditor-rights, liquidation, property-rights, and ownership-concentration measures—backed by covariate-balance and omitted-variable sensitivity checks—to show CDS trading raises debt capacity most where local bankruptcy/enforcement regimes make creditor control and recoveries more effective."

- title: "Ding, Xiong, and Zhang (JFE, 2022) - Issuance Overpricing of China’s Corporate Debt Securities"
  file: "Ding_Xiong_Zhang_JFE_2022.pdf"
  desc: "This note summarizes the paper, which documents systematic issuance overpricing in China’s interbank CP/MTN market by comparing issuance spreads to first-trade spreads (and benchmarked excess returns), and traces the mechanism to underwriter repeat-business incentives using underwriter-switching regressions, difference-in-differences/event-time tests around the October 2017 rebate ban (central-SOE/Big-Four treatment splits), and confidential auction-allocation evidence plus regressions linking overpricing to underwriter self-purchases/overbidding and post-ban improvements in issuance-price “quality” (R^2)."

- title: "Allen, Qian, Tu, and Yu (JFE, 2019) - Entrusted Loans: A Close Look at China’s Shadow Banking System"
  file: "Allen_Qian_Tu_Yu_JFE_2019.pdf"
  desc: "This note summarizes the paper, which hand-collects transaction-level entrusted loans from mandatory annual-report disclosures for Chinese listed nonfinancial firms (2004–2013), distinguishes affiliated (support/ICM) versus nonaffiliated (arm’s-length) lending, compares loan rates to official bank benchmarks and lenders’ own bond funding costs, estimates firm-year logit/Tobit models of who lends, loan-level spread regressions and ex post logit performance tests to assess risk-based pricing, and market-model event studies (with a Heckman announcement-selection correction) to evaluate shareholder value effects."

- title: "Xu (QJE, 2022) - Reshaping Global Trade: The Immediate and Long-Run Effects of Bank Failures"
  file: "Xu_QJE_2022.pdf"
  desc: "This note summarizes the paper, which digitizes Bank of England discount-window loan records to construct a location-level Bartik exposure to the 1866 London bank failures (pre-crisis bank shares × failure), estimates short-run export contractions using country- and within-country port-level DiD/event-study regressions on Lloyd’s List shipping flows and extensive-margin entry/exit outcomes, and traces decades-long trade hysteresis with dynamic bilateral market-share (gravity) regressions with destination-year fixed effects plus indirect-exposure re-sourcing tests and a structural-gravity interpretation."

- title: "Amiti and Weinstein (JPE, 2018) - How Much Do Idiosyncratic Bank Shocks Affect Investment? Evidence from Matched Bank-Firm Loan Data"
  file: "Amiti_Weinstein_JPE_2018.pdf"
  desc: "This note summarizes the paper, which uses matched Japanese bank–firm loan data to estimate time‐varying bank loan-supply and firm borrowing shocks via a lagged-loan-weighted fixed-effects decomposition of percentage loan growth (with an explicit correction for new lending relationships so the estimated shocks aggregate exactly to bank, firm, and macro lending), and then links these shocks to firm investment using loan-share-weighted exposure regressions and to aggregate lending/investment using market-share-weighted “granular bank shock” decompositions."

- title: "Bigio & La’O (QJE, 2020) - Distortions in Production Networks"
  file: "Bigio_LaO_QJE_2020.pdf"
  desc: "This note summarizes the paper, which develops a static multisector production-network model with sectoral distortion wedges, proves a Hulten-like theorem showing distortions affect the aggregate labor wedge (not TFP) at first order with Domar weights (and Leontief-inverse/network-centrality in the Cobb–Douglas case), and quantifies 2008–09 amplification by mapping Gilchrist–Zakrajsek credit spreads into sector wedges using BEA input–output tables and benchmarking the network economy against a horizontal counterfactual while interpreting the core tables and figures on bottlenecks and the ≈2 labor-wedge network multiplier."

- title: "Clayton, Dos Santos, Maggiori, & Schreger (AER, 2025) - Internationalizing Like China"
  file: "Clayton_DosSantos_Maggiori_Schreger_AER_2025.pdf"
  desc: "This note summarizes the paper, which combines new foreign-holdings and investor-entry datasets for China’s onshore bond market (COFER/CPIS-style reserves and portfolio data plus monthly QFII/RQFII/CIBM Direct/Bond Connect rosters matched to investor types) with security-level mutual-fund/ETF portfolios to compute RMB “DM-likeness” correlation statistics, and develops a dynamic reputation model with stable vs. flighty investors and crisis-time capital-control incentives to rationalize China’s gradual opening and the V-shaped 2015–2016 capital-flight episode."

- title: "Acharya and Xu (JFE, 2017) - Financial Dependence and Innovation: The Case of Public versus Private Firms"
  file: "Acharya_Xu_JFE_2017.pdf"
  desc: "This note summarizes the paper, which links S&P Capital IQ private/public firm data to the NBER patent citation database to compare innovation inputs and outputs, constructs Rajan–Zingales-style industry external finance dependence and matches private firms to similar public firms, estimates panel regressions and Heckman-style treatment-effect models with the key Public × EFD heterogeneity, and then provides quasi-experimental causal evidence using a fuzzy regression discontinuity around Nasdaq delisting thresholds (plus REM, competition, and analyst-coverage mechanism tests)."

- title: "Azoulay, Graff Zivin, Li, and Sampat (RES, 2019) - Public R&D Investments and Private-sector Patenting: Evidence from NIH Funding Rules"
  file: "Azoulay_Zivin_Li_Sampat_RES_2019.pdf"
  desc: "This note summarizes the paper, which links NIH grants (1980–2005) to publications and downstream life-science patents (1980–2012) via a grant→PubMed→USPTO bibliometric bridge (including a broader PubMed “related-article” mapping), aggregates activity into disease–science–time (DST) cells, and estimates fixed-effects and 2SLS models that instrument DST funding with quasi-random “windfall” variation created by NIH payline rules to identify the causal effect of public biomedical R&D on private-sector patenting, spillovers, and crowd-out."

- title: "Li (RFS, 2011) - Constraints, R&D Investment, and Stock Returns"
  file: "Li_RFS_2011.pdf"
  desc: "This note summarizes the paper, which extends a multi-stage R&D investment model by adding external financing constraints (pledgeability p(n)) to derive suspension/continuation thresholds and an interaction prediction for risk premia, and then tests it in Compustat–CRSP data (1975–2007) using Fama–MacBeth interaction regressions and double/triple portfolio sorts across multiple financial-constraint proxies (e.g., KZ/WW/SA, size, age) and multiple R&D-intensity measures, interpreting the core tables and figures on the joint pricing of constraints and R&D."

- title: "Tham, Baslandze, Sojli, & Liu (JFE, 2026)- Foundational Processes and Growth"
  file: "Tham_Baslandze_Sojli_Liu_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops a simple innovation-and-growth model distinguishing product innovation from two types of process innovation (cost-reducing vs. foundational), builds a 1900–2020 patent-text dataset to classify product vs. process patents using titles/claim preambles and then identifies “foundational” processes via within-firm TF–IDF cosine-similarity ratios to past versus future product patents (top-20% threshold), and tests the framework using local-projection firm-growth regressions on market-value–weighted patent stocks (CRSP–Compustat/Kogan values) plus cross-country GDP/TFP growth and product-quality evidence (including FDA Orange Book drug outcomes)."

- title: "Naaraayanan and Wolfenzon (RFS, 2024) - Business Group Spillovers"
  file: "Naaraayanan_Wolfenzon_RFS_2024.pdf"
  desc: "This note summarizes the paper, which exploits the staggered construction of India’s Golden Quadrilateral highway upgrades as a common investment-opportunity shock and estimates standalone-firm difference-in-differences and dynamic event-study regressions that interact PostGQ with local business-group prevalence (HighBGS), then tests a financing-channel mechanism using borrower fixed-effect loan-supply regressions that relate banks’ post-upgrade lending changes to their pre-upgrade exposure to group-affiliated firms, alongside extensive pretrend/horse-race and alternative-mechanism robustness checks."

- title: "Griffin, Kruger, & Mahajan (JFE, 2026) - Did Pandemic Relief Fraud Inflate House Prices?"
  file: "Griffin_Kruger_Mahajan_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses loan-level PPP fraud flags to construct ZIP-level suspicious-lending-per-capita shocks and then estimates borrower-level DiD/event studies for home purchases and moving, county-FE ZIP-level house-price-growth regressions with 5-mile neighborhood measures plus synthetic-control and social-network IV designs, and complementary event-time analyses of housing-market tightness, vehicle purchases, consumer spending/mobility, and regional inflation to interpret the mechanism and reversal of fraud-driven demand."

- title: "Mayordomo, Pavanini, & Tarantino (RFS, 2026) - The Impact of Bank Consolidation on Credit Supply and Performance"
  file: "Mayordomo_Pavanini_Tarantino_RFS_2026.pdf"
  desc: "This note summarizes the paper, which exploits Spain’s 2009–2011 regulator-induced savings-bank consolidation to compare full mergers (M&As) versus SIP business groups, estimates bank–firm difference-in-differences/event-time regressions (credit growth, loan-rate spreads, application rejections, and NPLs) using a historical 1995 “credit overlap” instrument for consolidation form, and then fits a structural bank model with borrower demand, endogenous screening/acceptance, and default to recover screening-cost efficiencies and market-power effects and run counterfactual decompositions."

- title: "Tombe and Zhu (AER, 2019) - Trade, Migration, and Productivity: A Quantitative Analysis of China"
  file: "Tombe_Zhu_AER_2019.pdf"
  desc: "This note summarizes the paper, which combines a two-sector (ag/non-ag) multi-province Eaton–Kortum trade model with intermediate inputs and land plus a Fréchet-choice migration block that embeds hukou and local land-income rebates as a flow migration wedge, estimates the migration elasticity κ from census migration shares using IVs (neighbor-income and Bartik expected-income), inverts bilateral trade and migration costs from interregional trade shares (Head–Ries) and migration shares, and then uses hat-algebra counterfactuals to decompose China’s 2000–2005 labor-productivity growth into internal trade, external trade, and migration reforms (and to evaluate land-reform and further-liberalization scenarios)."

- title: "Müller & Verner (RES, 2024) - Credit Allocation and Macroeconomic Fluctuations"
  file: "Muller_Verner_RES_2024.pdf"
  desc: "This note summarizes the paper, which builds a new long-run cross-country sectoral private credit database (117 countries, 1940–2014), defines major credit booms from detrended credit-to-GDP and classifies booms by tradable vs non-tradable credit shares, estimates sector-level reallocation regressions (including within-country-year interactions), event-study DiD paths around boom starts, and panel local projections / medium-run growth regressions plus banking-crisis prediction models to show that boom-time credit growth tilted toward households and non-tradables predicts medium-run GDP slowdowns and systemic crises whereas tradable-sector credit growth does not (and instead aligns with stronger future productivity)."

- title: "Asriyan, Laeven, Martin, Van der Ghote, & Vanasco (RES, 2025) - Falling Interest Rates and Credit Reallocation: Lessons from General Equilibrium"
  file: "Asriyan_Laeven_Martin_Vander_Ghote_Vanasco_RES_2025.pdf"
  desc: "This note summarizes the paper, which builds a small-open-economy general-equilibrium model with heterogeneous entrepreneurs facing borrowing constraints and an imperfectly elastic supply of collateralizable capital (land/real estate), extends it dynamically with wealth accumulation and a constrained-planner benchmark to show that persistent rate declines can misallocate capital and reduce output, calibrates the mechanism to the long-run U.S. real-rate decline, and tests its key cross-firm prediction in Compustat using 2SLS/local-projection investment regressions that instrument MSA house-price growth with interest-rate changes interacted with Saiz (2010) housing-supply elasticity."

- title: "Begenau, Bigio, Majerovitz, & Vieyra (RES, 2026) - A Q-Theory of Banks"
  file: "Begenau_Bigio_Majerovitz_Vieyra_RES_2026.pdf"
  desc: "This note summarizes the paper, which develops and structurally estimates a dynamic Q-theory model of bank leverage under delayed loan-loss recognition (separating fundamental, book, and market equity) using U.S. publicly traded BHC data (FR Y-9C + CRSP, 1990Q3–2021Q1) to identify idiosyncratic net-worth shocks from factor-residual excess returns and estimate distributed-lag IRFs for Tobin’s Q, leverage, and liabilities, match these moments in an SMM estimation of the recognition-speed and liquidation/regulatory constraints, and run micro-/macroprudential counterfactuals (accounting-speed reforms vs CCyB)."

- title: "Jiang, Vayanos, and Zheng (RFS, 2025) - Passive Investing and the Rise of Mega-Firms"
  file: "Jiang_Vayanos_Zheng_RFS_2025.pdf"
  desc: "This note summarizes the paper, which builds a mean–variance equilibrium with unconstrained experts (active investors) and index-constrained non-experts (passive investors) with optional noise traders, derives a closed-form affine price decomposition and comparative statics showing an idiosyncratic-supply amplification channel that makes passive flows disproportionately reprice mega-firms, quantifies the mechanism in a calibration with a power-law firm-size distribution and partial-index counterfactuals, and validates the key predictions using S&P500 passive-flow predictability and idiosyncratic-volatility regressions (with an S&P600 placebo)."

- title: "Altavilla, Ellul, Pagano, Polo, & Vlassopoulos (JFE, 2025) - Loan Guarantees, Bank Lending and Credit Risk Reallocation"
  file: "Altavilla_Ellul_Pagano_Polo_Vlassopoulos_JFE_2025.pdf"
  desc: "This note summarizes the paper, which studies euro-area COVID-19 loan guarantee programs by combining a simple renegotiation/bargaining model of guarantee-driven risk transfer with granular AnaCredit loan-level data and ECB supervisory bank data, and empirically identifies credit substitution using a Khwaja–Mian-style within-firm across-bank design (firm and bank fixed effects) that regresses the change in each bank’s non-guaranteed exposure on its guaranteed-loan intensity, extended to interest-rate and maturity outcomes, borrower/bank heterogeneity, and robustness checks (e.g., excluding maturing loans and splitting callable vs. non-callable credit) to interpret the core tables and figures on partial crowd-out and contract-term concessions."

- title: "Altavilla, Boucinha, Burlon, Giannetti, & Schumacher (JFE, 2025) - Central Bank Liquidity Reallocation and Bank Lending: Evidence from the Tiering System"
  file: "Altavilla_Boucinha_Burlon_Giannetti_Schumacher_JFE_2025.pdf"
  desc: "This note summarizes the paper, which exploits the ECB’s 2019 tiered reserve remuneration reform as a quasi-natural experiment by constructing bank-level treatment intensity from unused exemption allowances, estimating difference-in-differences/event-time regressions for excess-liquidity accumulation and money-market reallocation, and then identifying causal loan-supply effects with matched bank–firm data using borrower-time (and bank–firm) fixed effects plus mechanism and heterogeneity tests, interpreting the core tables and figures on reserve redistribution, balance-sheet rebalancing, and credit expansion."

- title: "Coppola (RFS, 2025) - In Safe Hands: The Financial and Real Impact of Investor Composition over the Credit Cycle"
  file: "Coppola_RFS_2025.pdf"
  desc: "This note summarizes the paper, which links NAIC insurer and Morningstar fund/ETF holdings to TRACE (and S&P Global abroad) bond prices to measure crisis drawdowns in duration-hedged excess returns, estimates within-issuer event-by-characteristics fixed-effects regressions of log drawdowns on pre-crisis insurer share, strengthens identification with a primary-market allocation shift-share IV based on large insurers’ issuance purchases (and non-U.S. proxy tests using 1−fund share), and aggregates ownership to the firm level to run instrumented event-study DiD specifications showing safer investor bases preserve issuance, lower offering yields, and raise crisis investment."

- title: "Gulen, Ion, Jens, & Rossi (RFS, 2024) - Credit Cycles, Expectations, and Corporate Investment"
  file: "Gulen_Ion_Jens_Rossi_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses IBES long-term earnings-growth forecasts to construct firm-level predictable forecast errors from rolling regressions of future forecast errors on lagged forecast revisions, aggregates them into a debt-issuance–weighted macroPFE index that closely tracks and predicts credit-market sentiment, estimates panel local-projection impulse responses of corporate investment and debt issuance (with firm fixed effects and rich firm/macro controls) plus cross-sectional tercile-interaction and financial-constraints tests, and rationalizes the boom–bust reversals with a Q-theory model featuring diagnostic expectations by both managers and credit investors and risky-debt credit-supply effects."

- title: "Kehrig and Vincent (RES, 2026) - Good Dispersion, Bad Dispersion"
  file: "Kehrig_Vincent_RES_2026.pdf"
  desc: "This note summarizes the paper, which uses U.S. Census plant-level manufacturing data to decompose dispersion in marginal revenue products and investment within vs. between multi-plant firms, exploits within-firm geographic distance as a proxy for internal-capital-market frictions in reduced-form regressions, and calibrates a two-plant dynamic model with lumpy adjustment costs and costly external finance (varying an internal-friction parameter) to show that better internal capital markets can raise both output and within-firm dispersion (“good dispersion”), with implications for cross-country misallocation accounting."

- title: "Cui, Wright, & Zhu (JPE, 2025) - Endogenous Liquidity and Capital Reallocation"
  file: "Cui_Wright_Zhu_JPE_2025.pdf"
  desc: "This note summarizes the paper, which constructs Compustat-based aggregate measures of used-capital reallocation (full vs. partial sales) and documents their long-run/cyclical comovement with inflation, estimates firm- and state-level fixed-effects regressions linking cash holdings to the likelihood and size of full acquisitions and linking inflation to lower liquid balances, and then builds and calibrates a monetary search-and-bargaining model with money-and-credit liquidity constraints in the secondary capital market to match these moments and run business-cycle and policy/welfare counterfactuals for reallocation, TFP, and prices."

- title: "Peters (Econometrica, 2020) - Heterogeneous Markups, Growth, and Endogenous Misallocation"
  file: "Peters_Econometrica_2020.pdf"
  desc: "This note summarizes the paper, which builds a tractable endogenous-growth model with Bertrand competition and quality-ladder innovation that endogenously generates a Pareto markup distribution pinned down by the churning-to-own-innovation ratio, measures markup and employment life-cycle moments from Indonesian manufacturing census data using De Loecker–Warzynski-style factor-share markups, calibrates the model to match these moments plus entry and aggregate growth, and runs counterfactual changes in entry/expansion frictions to quantify the joint implications for misallocation, labor shares, and growth."

- title: "Varela (RES, 2018) - Reallocation, Competition, and Productivity: Evidence from a Financial Liberalization Episode"
  file: "Varela_RES_2018.pdf"
  desc: "This note summarizes the paper, which exploits Hungary’s 2001 removal of foreign-exchange controls as a natural experiment, estimates firm-level first-differenced difference-in-differences comparing domestic versus foreign-owned manufacturers (APEH census panel) plus a Rajan–Zingales financial-dependence triple-difference, measures revenue TFP via Olley–Pakes and markups via the production-elasticity/labor-share wedge, complements the core design with BEEPS survey regressions on financing terms and innovation, and decomposes aggregate RTFP growth into within-firm versus reallocation components."

- title: "Boehm & Oberfield (QJE, 2020) - Misallocation in the Market for Inputs: Enforcement and the Organization of Production"
  file: "Boehm_Oberfield_QJE_2020.pdf"
  desc: "This note summarizes the paper, which uses Indian ASI plant-level input–output data and cross-state High Court congestion (instrumented by the High Court’s age) to estimate reduced-form regressions on materials shares, input mix, and vertical span, then structurally recovers enforcement wedges in a “recipes” model by clustering plants into common input-mix recipes and identifying distortions from within-recipe first-moment cost-share restrictions, and finally runs network counterfactuals that translate improved enforcement into sizable aggregate manufacturing productivity gains."

- title: "Baqaee & Farhi (QJE, 2020)- Productivity and Misallocation in General Equilibrium"
  file: "Baqaee_Farhi_QJE_2020.pdf"
  desc: "This note summarizes the paper, which derives a first-order general-equilibrium aggregation theorem for productivity and wedge/markup shocks in distorted production networks using producer-level envelope conditions (implying cost-based Domar weights and a distortion-adjusted Solow residual), develops second-order “distance-to-frontier” misallocation formulas in nested CES economies, and illustrates the framework with a U.S. application that combines BEA input–output tables with Compustat-based firm markup series (imputing firm-level networks) to decompose 1997–2015 aggregate TFP growth into pure-technology versus allocative-efficiency components."

- title: "Duval, Hong, and Timmer (RFS, 2020)- Financial Frictions and the Great Productivity Slowdown"
  file: "Duval_Hong_Timmer_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses a cross-country ORBIS firm panel and a Lehman-era long-difference DiD design that treats pre-crisis rollover risk (debt maturing in 2008 scaled by sales) as predetermined exposure, strengthens credit-supply identification with interactions using Lehman-window bank CDS jumps (country-level and firm–creditor-bank matched), measures within-firm TFP via Wooldridge (2009) GMM production-function residuals, and tests the innovation channel with intangible-investment and patenting regressions plus placebo/robustness checks while interpreting the core tables and figures on persistent post-crisis TFP hysteresis."

- title: "Choi, Tian, Wu, & Kargar (JFE, 2025) - Investor demand, firm investment, and capital misallocation"
  file: "Choi_Tian_Wu_Kargar_JFE_2025.pdf"
  desc: "This note summarizes the paper, which embeds a Koijen–Yogo–style equity demand system (logit portfolio weights with latent “excess demand” shocks) into a dynamic corporate finance model of investment and payout/issuance/repurchase choices, estimates demand parameters via indirect inference (matching an auxiliary holdings-on-characteristics regression) and firm-side parameters via simulated method of moments, and then uses the estimated equilibrium to run counterfactual no-excess-demand misallocation accounting (dispersion in log(MPK) and TFP-loss)."

- title: "Chen, Jiang, Liu, Suárez Serrato & Xu (RES, 2023) - Tax Policy and Lumpy Investment Behaviour: Evidence from China’s VAT Reform"
  file: "Chen_Jiang_Liu_Suarez_Serrato_Xu_RES_2023.pdf"
  desc: "This note summarizes the paper, which exploits China’s unexpected nationwide 2009 switch from a production- to consumption-based VAT on equipment as a quasi-experiment (domestic firms treated vs. foreign firms in encouraged industries already eligible), estimates event-study and firm-FE DiD effects on both extensive and intensive investment margins with placebo/triple-difference validation, and then disciplines a dynamic lumpy-investment model with partial irreversibility plus convex and fixed adjustment costs by estimating profit/shock processes via system GMM and frictions via method of simulated moments to run counterfactual tax-reform simulations and interpret the core tables and figures on inaction regions, investment spikes, and policy effectiveness."

- title: "Bau & Matray (Econometrica, 2023) - Misallocation and Capital Market Integration: Evidence from India"
  file: "Bau_Matray_Econometrica_2023.pdf"
  desc: "This note summarizes the paper, which exploits India’s staggered 2001/2006 foreign-capital liberalization at the 5-digit industry level as a natural experiment, measures ex ante constraints using pre-reform MRPK (Revenue/K) and estimates firm- and year-fixed-effects heterogeneous DiD/event-study regressions of capital, revenues, wages, and MRPK on Reform × HighMRPK, validates the financing channel with first-stage evidence on foreign funding and investment, and maps the micro reallocation into conservative aggregate productivity effects using a Solow-residual/wedge-change decomposition and a lower-bound aggregation strategy."

- title: "Bloom, Draca, and Van Reenen (RES, 2016) - Trade Induced Technical Change? The Impact of Chinese Imports on Innovation, IT and Productivity"
  file: "Bloom_Draca_Van_Reenen_RES_2016.pdf"
  desc: "This note summarizes the paper, which uses Amadeus firm/plant panels for 12 European countries matched to EPO patents and Harte Hanks IT to estimate long-difference (firm FE) regressions of within-firm patenting, computers-per-worker, and TFP on changes in Chinese import penetration, identifies the trade shock with WTO-driven textile/apparel quota abolition (quota-coverage IV) and an “initial-conditions” IV based on lagged Chinese comparative advantage, and quantifies both within-firm upgrading and between-firm reallocation/exit using employment–survival interaction specifications and an aggregate decomposition."

- title: "Li, Lin, and Xu (RFS, 2020) - Political Investment Cycles of State-Owned Enterprises"
  file: "Li_Lin_Xu_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses a 25-country Amadeus firm-year panel of SOEs and matched non-SOEs around 82 national elections (2001–2015) to estimate firm- and year-fixed-effects election-year DiD/SUR investment regressions with close-election and fixed-timing interactions plus placebo and incumbent-incentive falsification tests, and then traces the mechanism with parallel bank-loan issuance and employment-growth specifications to show a politically induced SOE investment cycle financed through state-dominated banking systems."

- title: "Ma (RFS, 2025) - Technological Obsolescence"
  file: "Ma_RFS_2025.pdf"
  desc: "This note summarizes the paper, which constructs a firm-year patent-citation measure of technological obsolescence from declines in external citations to a predetermined technological base, relates it to future profits/output/capital/labor/TFP using within-industry-year panel regressions with extensive robustness and validation, and documents a mispricing channel via obsolescence-sorted portfolio alphas and analyst forecast-error regressions consistent with underreaction."

- title: "Li & Li (RES, 2025)- Firm Quality Dynamics and the Slippery Slope of Credit Intervention"
  file: "Li_Li_RES_2025.pdf"
  desc: "This note summarizes the paper, which builds a quantitative crisis-credit model with heterogeneous firm quality, Tobin’s-q investment, and strategic default, solves the equilibrium survival-financing problem under private funding limits and size-based government lending, calibrates/moment-matches the model to crisis and firm-level targets, and runs welfare and dynamic counterfactuals (optimal vs pseudo-optimal policy and inter-crisis pass-through) to quantify the quantity–quality trade-off and the “slippery slope” of credit intervention."

- title: "De Ridder, Grassi, and Morzenti (Econometrica, 2026) - The Hitchhiker’s Guide to Markup Estimation: Assessing Estimates From Financial Data"
  file: "De_Ridder_Grassi_Morzenti_Econometrica_2026.pdf"
  desc: "This note summarizes the paper, which develops an analytical characterization of the production-approach (Hall–De Loecker–Warzynski) markup estimator when researchers observe revenue but not quantities, validates the resulting bias and “what survives” using Monte Carlo simulations of an Atkeson–Burstein-style oligopoly model and French administrative price–quantity data (FARE+EAP, 2009–2019), implements a modified two-stage translog production-function estimator with a first-stage purging regression that controls for prices and markup proxies (e.g., market share), and shows that revenue-based markups are unreliable for levels but informative for within-sector dispersion and time-series trends."

- title: "Chen & Kung (QJE, 2019) - Busting the “Princelings”: The Campaign against Corruption in China’s Primary Land Market"
  file: "Chen_Kung_QJE_2019.pdf"
  desc: "This note summarizes the paper, which matches 1.6M Chinese primary-land transactions (2004–2016) to Politburo-family (“princeling”) firms and nearby nonprinceling parcels (500m/1500m) to estimate transaction-level log price-per-sqm regressions with rich controls and high-dimensional fixed effects, then extends the analysis with patron-rank/retirement heterogeneity, quantity (land-area) regressions, ordered-probit promotion regressions for local leaders, and DiD/event-study evidence around Xi’s anticorruption campaign (central inspections, Xi-appointed officials, Zhou Yongkang’s arrest) to quantify political rent discounts and their subsequent collapse."

- title: "Bennett, Stulz, & Wang (JFE, 2020) - Does the Stock Market Make Firms More Productive?"
  file: "Bennett_Stulz_Wang_JFE_2020.pdf"
  desc: "This note summarizes the paper, which estimates firm- and year-fixed-effects panel regressions linking ACF-estimated firm TFP to lagged stock-price informativeness (PIN/PSI), strengthens identification with DiD/event-study designs around brokerage-house research closures, S&P 500 additions, and mutual-fund redemption pressure, and tests a CEO-discipline mechanism via turnover–Tobin’s q interactions."

- title: "Adamopoulos, Brandt, Chen, Restuccia, & Wei (QJE, 2024) - Land Security and Mobility Frictions"
  file: "Adamopoulos_Brandt_Chen_Restuccia_Wei_QJE_2024.pdf"
  desc: "This note summarizes the paper, which builds a family-based Roy-style structural model where insecure rural land rights make renting out land risky and thus act as a household-level mobility barrier, disciplines land insecurity using a dedicated survey on reallocation/loss risk and calibrates the remaining labor-mobility and within-agriculture distortion wedges to rich RCRE household/individual moments (farm-operator share, sectoral income gaps, part-time work, TFP/TFPR dispersion) for 2004–2018, and then uses counterfactuals to decompose China’s post-2004 structural transformation and productivity gains into improved land security versus other mobility frictions."

- title: "Chari, Liu, Wang, & Wang (RES, 2021) - Property Rights, Land Misallocation, and Agricultural Efficiency in China"
  file: "Chari_Liu_Wang_Wang_RES_2021.pdf"
  desc: "This note summarizes the paper, which exploits staggered provincial implementation of China’s 2003 Rural Land Contracting Law to run household- and village-level DiD/event-study regressions on land renting and agricultural output, constructs farmer–crop productivity and marginal products from crop-specific Cobb–Douglas (and robustness translog) production functions, decomposes aggregate TFP gains using Olley–Pakes and Baily–Hulten–Campbell reallocation terms and a full-reallocation planner benchmark, and identifies improved dynamic land allocation via crop price-response regressions instrumenting Chinese prices with U.S. prices."

- title: "Whited and Zhao (JF, 2021) - The Misallocation of Finance"
  file: "Whited_Zhao_JF_2021.pdf"
  desc: "This note summarizes the paper, which extends the Hsieh–Klenow misallocation framework to the liability side by modeling firm “benefit” as a CES function of debt and equity, uses Chinese NBS industrial-firm data and U.S. Compustat to estimate sectoral debt–equity substitution elasticities (Kmenta fixed effects and GMM), calibrates demand elasticities using the U.S. as an efficiency benchmark, backs out firm-level wedges / distortion-inclusive marginal financing costs from first-order conditions, and computes planner reallocation counterfactuals that decompose gains into scale vs. mix components with bootstrap inference and dynamic-validation evidence, while interpreting the core tables and figures on China-versus-U.S. financial misallocation."

- title: "Adamopoulos, Brandt, Leight, & Restuccia (Econometrica, 2022) - Misallocation, Selection, and Productivity: A Quantitative Analysis With Panel Data From China"
  file: "Adamopoulos_Brandt_Leight_Restuccia_Econometrica_2022.pdf"
  desc: "This note summarizes the paper, which uses a rural China household panel (1993–2002) to estimate permanent farm TFP and TFPR wedges via year effects and village-purged household fixed effects (validated with a Bils–Klenow–Ruane mismeasurement test), computes within- and across-village reallocation TFP gains relative to an efficient planner benchmark, and then embeds the estimated joint distribution of ability and distortions in a two-sector Roy-style selection model to quantify how land-institution wedges amplify misallocation through occupational sorting."

- title: "Cucic and Gorea (RFS, 2026) - Nonbank Lending and the Transmission of Monetary Policy"
  file: "Cucic_Gorea_RFS_2026.pdf"
  desc: "This note summarizes the paper, which uses universe Danish administrative loan-level data on unsecured corporate and consumer credit (2003–2018) and quasi-exogenous ECB monetary policy surprises (via Denmark’s euro peg) to estimate borrower-year fixed-effect loan-supply regressions comparing banks vs nonbanks, links the resulting “spare-tire” substitution to lenders’ funding structure with lender-balance-sheet panel tests and interaction regressions (showing long-term-debt-funded nonbanks expand most when banks’ long-term funding contracts), and then traces borrower-level and spillover real effects (investment/profits/wage bill and household consumption/assets) with event-study/heterogeneity and risk-taking falsification analyses."

- title: "Fleckenstein, Gopal, Gutiérrez, and Hillenbrand (RFS, 2026) - Nonbank Lending and Credit Cyclicality"
  file: "Fleckenstein_Gopal_Gutierrez_Hillenbrand_RFS_2026.pdf"
  desc: "This note summarizes the paper, which uses DealScan syndicated-loan facilities (2000–2020) to separate bank tranches (revolvers/Term A) from institutional nonbank tranches (Term B+), decomposes the GFC origination and employment contractions into bank vs nonbank components, and identifies the nonbank sector’s greater cyclicality by estimating borrower×deal×time fixed-effect within-deal regressions of facility size/spreads on the Excess Bond Premium (with within-bank/lender-role robustness and CLO funding-cost mechanism evidence)."

- title: "Kwon and Tang (RES, 2026) - Extreme Categories and Overreaction to News"
  file: "Kwon_Tang_RES_2026.pdf"
  desc: "This note summarizes the paper, which combines a diagnostic-expectations model with category-specific power-law tails, measures each news category’s “extremeness” by estimating tail exponents from announcement-day absolute returns in Capital IQ Key Developments matched to CRSP (2011–2018), and tests the theory using category-by-category and pooled drift/reversal regressions that interact day-0 returns with extremeness (with overlapping-news controls, alternative-explanation horse races, and inference robustness), plus complementary turnover and analyst-forecast evidence, interpreting the core tables and figures on why fat-tailed news categories generate overreaction, reversals, and higher trading volume."

- title: "Cohn, Johnson, Liu, and Wardlaw (JFE, 2026) - Past is Prologue: Inference from the Cross Section of Returns Around an Event"
  file: "Cohn_Johnson_Liu_Wardlaw_JFE_2026.pdf"
  desc: "This note summarizes the paper, which shows that standard event-day cross-sectional return–characteristic regressions massively over-reject because “routine news” induces time-varying characteristic slopes even absent any event effect, and proposes a time-series benchmarked inference approach—TS-OLS and a novel PCA-based TS-GLS that estimates a high-dimensional daily return covariance from recent comovement and conducts inference using the empirical CDF of pre-event coefficients—validated on CRSP–Compustat U.S. stocks (1991–2021) across eight characteristics with extensive simulations/robustness and a survey of event-study practice."

- title: "Kelly, Mokyr, and O Grada (JPE, 2023) - The Mechanics of the Industrial Revolution"
  file: "Kelly_Mokyr_Grada_JPE_2023.pdf"
  desc: "This note summarizes the paper, which explains where Britain’s early mechanized textiles and metals emerged by constructing county-level pre-Industrial measures of mechanical/toolmaking skills and estimating semiparametric spatial regressions with flexible geography controls (plus an IV/2SLS strategy using watchmaking apprenticeship fees to instrument for skills), then contrasting these results with “placebo” traditional industries and interpreting the core tables, maps, and figures on skills, wages, market access, and coal."

- title: "Heston & Rouwenhorst (JFE, 1994) - Does Industrial Structure Explain the Benefits of International Diversification?"
  file: "Heston_Rouwenhorst_JFE_1994.pdf"
  desc: "This note summarizes the paper, which runs monthly stock-level two-way (country×industry) dummy-variable regressions (ANOVA) under EW-OLS and VW-WLS identification restrictions to extract “pure” European market, country, and industry return components, constructs industry-corrected country indices and variance decompositions (plus currency-effect regressions) to test whether industrial structure explains international diversification, and interprets the core tables and figure showing country effects dominate and diversification gains persist after controlling for industry mix."

- title: "Wang, Whited, Wu, and Xiao (JF, 2022) - Bank Market Power and Monetary Policy Transmission: Evidence from a Structural Estimation"
  file: "Wang_Whited_Wu_Xiao_JF_2022.pdf"
  desc: "This note summarizes the paper, which quantifies bank-based monetary policy transmission by structurally estimating a dynamic imperfect-competition banking model with reserve and capital constraints, using a two-stage approach that first identifies deposit and loan demand via BLP-style discrete-choice estimation with cost-shifter instruments and then estimates balance-sheet frictions/operating costs in a plug-in dynamic bank problem via simulated minimum distance, complemented by reduced-form validation using high-frequency FOMC surprises and an HHI×Low difference-in-differences test of the low-rate “reversal” mechanism, while interpreting the core tables and figures that decompose transmission into deposit market power, loan market power, capital regulation, and reserve requirements."

- title: "Orr (JPE, 2022) - Within-Firm Productivity Dispersion: Estimates and Implications"
  file: "Orr_JPE_2022.pdf"
  desc: "This note summarizes the paper, which derives an input-allocation theorem for multiproduct plants that uses product-level prices/quantities to estimate a nested-logit demand system (with cost-shifter IVs), invert pricing FOCs to recover marginal costs, impute unobserved product-line input shares, and then estimate product-level TFPQ and “revenue efficiency” via quasi-differenced GMM production-function regressions and product-dropping probits, interpreting the core tables and figures on within-firm productivity dispersion and core competence."

- title: "Bonfim, Ferreira, Queir´o, Zhao (AER, 2025) - Fiscal Policy and Credit Supply in a Crisis"
  file: "Bonfim_Ferreira_Queiro_Zhao_AER_2025.pdf"
  desc: "This note summarizes the paper, which uses Portugal’s sovereign-debt-crisis procurement cuts as a fiscal shock, constructs bank-level exposure via a shift-share measure that combines contractor-level procurement revenue drops with pre-crisis bank–contractor lending shares, estimates bank–firm credit-supply regressions with sector×municipality fixed effects and Khwaja–Mian within-firm (multi-bank) comparisons plus event-study dynamics and identification/robustness checks (including Rotemberg-weight diagnostics and alternative demand controls), links the shock to firm real outcomes and to amplification/mitigation through bank leverage and recapitalization interactions, and rationalizes the reduced-form estimates in a calibrated general-equilibrium banking model that maps micro exposure into aggregate credit and output elasticities."

- title: "Glitz & Meyersson (AER, 2020) - Industrial Espionage and Productivity"
  file: "Glitz_Meyersson_AER_2020.pdf"
  desc: "This note summarizes the paper, which uses the Stasi’s SIRA intelligence archive to construct sector-year inflows of stolen West German industrial information (mapped from keywords/text into industries and scaled by East German sector output), estimates diffusion-style productivity-growth and West–East TFP-gap panel regressions with rich fixed effects in rolling multi-year windows, tackles targeting endogeneity with two IV strategies (a shift-share “old-informants” instrument and quasi-exogenous informant-exit shocks) plus placebo and alternative text-classification robustness, and interprets the core tables and figures on espionage-driven TFP catch-up and heterogeneity by absorptive capacity and import constraints."

- title: "Greenwald & Guren (AER, 2025) - Do Credit Conditions Move House Prices?"
  file: "Greenwald_Guren_AER_2025.pdf"
  desc: "This note summarizes the paper, which asks whether credit easing primarily raises the homeownership rate or instead gets capitalized into the price–rent ratio, estimates the relative elasticities of log(p/q) and HO to plausibly exogenous credit-supply shocks using local projections with a CLL-based shift-share instrument and complementary event-study designs (APL preemption and PLS expansion), and disciplines a dynamic structural housing model with borrowers/landlords/savers by calibrating a tenure-segmentation parameter to match these impulse responses to quantify boom accounting and macroprudential counterfactuals."

- title: "Juhász, Squicciarini, and Voigtländer (JPE, 2024) - Technology Adoption and Productivity Growth: Evidence from Industrialization in France"
  file: "Juha_sz_Squicciarini_Voigtla_nder_JPE_2024.pdf"
  desc: "This note summarizes the paper, which uses repeated cross-sections of French plant-level industrial surveys (c.1800 vs. 1840) to measure output-per-worker productivity and estimate pooled and quantile regressions showing lower-tail-driven catch-up in cotton spinning (relative to metallurgy and paper), then corroborates a “best-practice diffusion” mechanism with exit/survival comparisons, age–productivity regressions controlling for machinery and plant characteristics, factory-design convergence metrics, and spatial diffusion regressions based on distance to top-performing plants, linking the facts to a stylized search-and-imitation model."

- title: "Lashkaripour & Lugovskyy (AER, 2023) - Profits, Scale Economies, and the Gains from Trade and Industrial Policy"
  file: "Lashkaripour_Lugovskyy_AER_2023.pdf"
  desc: "This note summarizes the paper, which develops a multi-country multi-industry “generalized Krugman” trade model with markups/scale economies, derives sufficient-statistics formulas for first-best and unilateral optimal trade versus industrial policies (tariffs, export subsidies, Pigouvian output subsidies) and the rationale for deep industrial-policy coordination, estimates industry-level trade elasticities and scale/markup parameters from Colombian import microdata using shift-share exchange-rate and variety-count instruments (GMM/2SLS), and then quantifies welfare gains, retaliation losses, and cooperation counterfactuals by calibrating a WIOD input–output general-equilibrium model."

- title: "Di Maggio & Kacperczyk (JFE, 2017) - The Unintended Consequences of the Zero Lower Bound Policy"
  file: "Maggio_Kacperczyk_JFE_2017.pdf"
  desc: "This note summarizes the paper, which studies how the zero lower bound and forward guidance reshape the U.S. prime money market fund industry by estimating (i) policy-rate pass-through regressions to MMF gross returns, (ii) flow–performance sensitivity models with low-rate interactions (“flow fragility”), (iii) event-study difference-in-differences around major FOMC forward-guidance “ZLB shocks” with predetermined controls, (iv) sponsor-type and within-independent reputation heterogeneity, (v) nonlinear Fed-rate effects near the ZLB, and (vi) holdings-, issuer-, and fund-family–level analyses (N-MFP security yields, corporate financing around fund closures, and product-menu reallocation)."

- title: "Criscuolo, Martin, Overman, and Van Reenen (AER, 2019) - Some Causal Effects of an Industrial Policy"
  file: "Criscuolo_Martin_Overman_Reenen_AER_2019.pdf"
  desc: "This note summarizes the paper, which evaluates the UK Regional Selective Assistance place-based investment subsidy by exploiting EU state-aid rule/map reforms to build a policy-rule instrument (ordered-probit estimated eligibility weights × predetermined area characteristics) for maximum subsidy caps (NGE), estimating area/plant/firm-level 2SLS and event-study–style difference specifications (including take-up/TOT and spillover checks via labor-market aggregation), and interpreting the core tables and figures on employment, unemployment, investment/output, and (non-)effects on TFP."

- title: "Liu (QJE, 2019) - Industrial Policies in Production Networks"
  file: "Liu_QJE_2019.pdf"
  desc: "This note summarizes the paper, which develops a static multi-sector production-network model with wedge distortions and input/value-added subsidies, derives distortion centrality ξi = μi /γi as the sufficient statistic for the marginal welfare “bang-per-buck” of targeting sector i (implying ΔlnY ≈ Cov(ξ,s)), and then computes and stress-tests ξ using hierarchical input–output matrices to evaluate South Korea’s 1970s HCI drive and modern China’s credit/tax/SOE interventions via sector-level regressions and counterfactual targeting exercises, interpreting the core tables and figures throughout."

- title: "Menzio & Shi (JPE, 2011) - Efficient Search on the Job and the Business Cycle"
  file: "Menzio_Shi_JPE_2011.pdf"
  desc: "This note summarizes the paper, which builds an efficient directed-search model with on-the-job search and match-quality heterogeneity (experience vs. inspection goods via an information parameter), characterizes the constrained-efficient allocation through a planner problem and proves separability/block-recursivity plus decentralization via submarkets and posted contracts, calibrates the monthly economy to U.S. worker-flow and tenure moments, and simulates impulse responses and business-cycle statistics (with Pissarides/Mortensen–Pissarides benchmarks) to show how vacancy composition and poaching amplify small productivity shocks."

- title: "Lane (QJE, 2025) - Manufacturing Revolutions: Industrial Policy and Industrialization in South Korea"
  file: "Lane_QJE_2025.pdf"
  desc: "This note summarizes the paper, which uses South Korea’s 1973–1979 Heavy and Chemical Industry (HCI) drive as a sector-targeted industrial-policy shock, estimating dynamic industry-level DiD event studies (Targeted×Year with industry and year fixed effects and pre-trend checks) and corroborating them with a doubly robust DiD ATT estimator and cross-country triple differences in trade, then unpacking mechanisms via plant-level production-function TFP comparisons, learning-by-doing experience interactions, and input–output linkage spillover event studies, while interpreting the core tables and figures on persistent industrial expansion, gradual export upgrading, and downstream network propagation."

- title: "Lagos (RES, 2006) - A Model of TFP"
  file: "Lagos_RES_2006.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time search-and-matching model with match-specific productivity shocks and endogenous job destruction, derives closed-form surplus and job-creation/job-destruction conditions that aggregate to an exact Cobb–Douglas under Pareto shocks (with true TFP A∝R, the reservation cutoff), uses policy comparative statics and a measurement framework (true A vs. Solow residuals using K vs. Ke and employment vs. hours), and calibrates the model to quantify how labor-market institutions shift selection, hoarding, unemployment, and measured versus true TFP."

- title: "Eusepi, Giannoni, and Preston (JPE, 2026) - The Short-Run Policy Constraints of Long-Run Expectations"
  file: "Eusepi_Giannoni_Preston_JPE_2026.pdf"
  desc: "This note summarizes the paper, which derives a new monetary-policy feasibility constraint in a stylized New Keynesian model when agents form long-run “endpoints” for inflation and nominal rates via constant-gain (shifting-endpoints) learning, embeds that mechanism in a medium-scale NK model with imperfect-information expectations and a measurement block using surveys, long-term yields, and a ZLB shadow rate, and then uses Bayesian estimation plus welfare/optimal-policy counterfactuals (varying policy aggressiveness and endogenous learning gain) to quantify how anchoring long-run expectations relaxes the constraint and enables more aggressive stabilization."

- title: "Chen, Ren, and Zha (AER, 2018) - The Nexus of Monetary Policy and Shadow Banking in China"
  file: "Chen_Ren_Zha_AER_2018.pdf"
  desc: "This note summarizes the paper, which identifies exogenous Chinese monetary-policy shocks by estimating an endogenously switching M2-growth rule, then combines hand-collected entrusted-loan trustee data and bank balance-sheet data to estimate trustee/bank panel regressions (entrusted lending and ARIX responses with bank-type and constraint interactions) plus a dynamic panel VAR for aggregate credit, alongside a bank model with deposit-withdrawal shocks and regulatory constraints to interpret the core tables and figures on why tightening can expand shadow banking."

- title: "House, Proebsting, and Tesar (RES, 2026) - Quantifying the Benefits of Labour Mobility in a Currency Union"
  file: "House_Proebsting_Tesar_RES_2026.pdf"
  desc: "This note summarizes the paper, which quantifies the benefits (and potential costs) of higher labor mobility inside a currency union by documenting euro-area vs U.S. differences in unemployment dispersion and cyclical migration using variance decompositions, local projections, and migration–unemployment regressions, embedding these facts in a multi-country New Keynesian DSGE with Calvo wage/price rigidities, Eaton–Kortum trade, and multinomial-logit endogenous migration, estimating key parameters via moment matching, and running counterfactuals that raise EA mobility to U.S. levels (vs. floating exchange rates) to compute compensating-variation welfare under demand versus supply shocks."

- title: "Song, Storesletten, and Zilibotti (AER, 2011) - Growing Like China"
  file: "Song_Storesletten_Zilibotti_AER_2011.pdf"
  desc: "This note summarizes the paper, which builds a transition OLG model with two firm types—credit-favored, low-productivity SOEs (“F-firms”) and credit-constrained, high-productivity private firms (“E-firms”)—to explain China’s joint pattern of labor reallocation and TFP growth alongside a persistent deposit–loan gap and foreign reserve accumulation, disciplines the mechanism with motivating facts and reduced-form evidence, and matches key time series using a calibrated multi-period quantitative version plus two-sector (capital- vs labor-intensive) and market-power extensions."

- title: "Olsson & Tåg (JF, 2025) - What Is the Cost of Privatization for Workers?"
  file: "Olsson_Tag_JF_2025.pdf"
  desc: "This note summarizes the paper, which uses Swedish linked employer–employee administrative registers to match workers in SOEs that are privatized to similar workers in SOEs that remain state-owned and estimates stacked difference-in-differences event studies (with complementary firm-level DiD and job-flow decompositions) to quantify worker income/unemployment/transfer effects and firm productivity gains, alongside mechanism and heterogeneity tests (e.g., CEO replacement vs labor-quality/financial-engineering channels and privatization type/buyer identity) and a simple welfare accounting comparing worker losses to efficiency gains."

- title: "Heblich, Redding, and Sturm (QJE, 2020) - The Making of the Modern Metropolis: Evidence from London"
  file: "Heblich_Redding_Sturm_QJE_2020.pdf"
  desc: "This note summarizes the paper, which combines parish-level event-study evidence around railway-station arrivals with a quantitative spatial equilibrium model (Frechét location-choice + land-market clearing), estimates commuting-cost elasticities from a gravity regression instrumenting rail travel time with straight-line distance, uses exact hat algebra to recover implied wage and commuting-flow changes from population and rateable-value shifts, estimates production and residential agglomeration elasticities, and runs counterfactuals removing the railway network to quantify the welfare/value gains and the “workplace center + residential suburbs” reorganization of London."

- title: "Brunnermeier, Sockin, and Xiong (RES, 2022) - China’s Model of Managing the Financial System"
  file: "Brunnermeier_Sockin_Xiong_RES_2022.pdf"
  desc: "This note summarizes the paper, which builds a stylized asset-market model with CARA investors and noise traders, models government “stabilization” as a trading program that leans against noise demand but adds endogenous policy noise, introduces information frictions with filtering and discrete investor information-choice (learn fundamentals vs. policy) to generate multiple noisy rational-expectations equilibria and regime switches, and then calibrates/numerically solves the model to quantify the volatility–price-informativeness trade-off and characterize welfare-optimal intervention."

- title: "Barwick, Kalouptsidi, and Zahur (RES, 2025) - Industrial Policy Implementation: Empirical Evidence from China’s Shipbuilding Industry"
  file: "Barwick_Kalouptsidi_Zahur_RES_2025.pdf"
  desc: "This note summarizes the paper, which studies China’s shipbuilding industrial policy (1998–2014) by building and structurally estimating a dynamic empirical-IO model—static Cournot competition across ship types embedded in heterogeneous firms’ entry/exit/investment dynamics that infers unobserved production, investment, and entry subsidies—using a two-stage Hotz–Miller/BBL-style approach (instrumented demand estimation, Tobit marginal-cost estimation from Cournot FOCs, and value-function/B-spline recovery of dynamic parameters) and then running counterfactual simulations to rank policy instruments and compare pro- vs counter-cyclical, temporary, and targeted designs."

- title: "Che (RES, 2009) - A Dynamic Model of Privatization with Endogenous Post-Privatization Performance"
  file: "Che_RES_2009.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time dynamic bargaining model of privatization with endogenous effort, gradually improving property-rights protection μ(t), and a hard buyer budget B, characterizes Markov subgame-perfect equilibrium timing (no/efficient/delayed/premature privatization) using the PV objects W(t) and V(t) and binding incentive constraints, derives implications for post-privatization performance jumps and endogenous “underpricing,” and interprets the paper’s main propositions and figures."

- title: "Li, Wang, Cheung, and Jiang (RFS, 2011) - Privatization and Risk Sharing: Evidence from the Split Share Structure Reform in China"
  file: "Li_Wang_Cheung_Jiang_RFS_2011.pdf"
  desc: "This note summarizes the paper, which uses China’s 2005–2007 Split Share Structure Reform as a nationwide quasi-experiment and treats the negotiated compensation ratio as a revealed-preference outcome, developing a pure price-impact benchmark model alongside a risk-sharing channel and testing both with cross-sectional/fixed-effects regressions, heterogeneity by controlling NTS-holder diversification, and falsification tests of the valuation-wedge prediction, while interpreting the core tables and figures on how idiosyncratic risk, float expansion, bargaining power, and firm performance jointly determine compensation."

- title: "Hachem & Song (JPE, 2021) - Liquidity Rules and Credit Booms"
  file: "Hachem_Song_JPE_2021.pdf"
  desc: "This note summarizes the paper, which develops a three-date banking model with interbank market power and stochastic liquidity shocks to show how tightening an on-balance-sheet liquidity rule induces shadow-banking arbitrage and deposit reallocation that can reduce required system liquidity and generate a credit boom, and then tests the mechanism in China using repo-rate regressions on Big-Four NCD announcements, calibrated policy-counterfactuals, WMP–interbank-rate comovement, and moment-matched structural shock decompositions."

- title: "Khwaja & Mian (QJE, 2005) - Do Lenders Favor Politically Connected Firms? Rent Provision in an Emerging Financial Market"
  file: "Khwaja_Mian_QJE_2005.pdf"
  desc: "This note summarizes the paper, which uses the universe of Pakistani corporate loans (1996–2002) to define political connections from directors running in elections, decomposes loan returns into interest/default/recovery components, and identifies political rent provision by combining bank-FE cross-sectional regressions with within-firm government-versus-private lender comparisons (firm and bank fixed effects) and within-firm event-time evidence around political victories (relationship fixed effects), interpreting the core tables on credit quantity, default, and misallocation costs."

- title: "Moll (AER, 2014) - Productivity Losses from Financial Frictions: Can Self-Financing Undo Capital Misallocation?"
  file: "Moll_AER_2014.pdf"
  desc: "This note summarizes the paper, which develops a highly tractable continuous-time general-equilibrium model of entrepreneurs facing collateral constraints but able to self-finance, derives closed-form aggregation in terms of productivity-type wealth shares governed by a PDE (implying measured TFP is a truncated wealth-weighted mean of productivity), and uses steady-state comparative statics and transition simulations to show how idiosyncratic productivity persistence jointly determines the long-run misallocation loss and the speed of convergence, interpreting the main figures and welfare implications."

- title: "Midrigan & Xu (AER, 2014) - Finance and Misallocation: Evidence from Plant-Level Data"
  file: "Midrigan_Xu_AER_2014.pdf"
  desc: "This note summarizes the paper, which builds a two-sector heterogeneous-plant model with collateral-based borrowing constraints and limited equity issuance/entry into a modern technology, derives misallocation and TFP-loss accounting from dispersion in the shadow cost of capital, and disciplines the model with plant-level and financing moments via simulated method of moments to run counterfactuals (tightening external finance, shutting down entry/adoption/operation, and crisis dynamics), interpreting the core tables and figures on why finance implies modest steady-state within-sector misallocation but large extensive-margin effects."

- title: "David & Venkateswaran (AER, 2019) - The Sources of Capital Misallocation"
  file: "David_Venkateswaran_AER_2019.pdf"
  desc: "This note summarizes the paper, which builds a CES-demand dynamic investment model with capital adjustment costs, firm-specific capital wedges, and imperfect information about productivity, derives a log-linear Euler-equation policy rule that links capital dynamics to wedges and “news,” identifies and decomposes observed ARPK dispersion using multiple investment and ARPK–productivity comovement moments, estimates the key parameters by simulated method of moments (with extensions for nonconvex adjustment costs and frictional labor), and then augments the accounting with markup/technology and size-dependent-liquidity mechanisms to interpret the core tables and figures mapping variance shares into aggregate TFP losses and policy-relevant sources of misallocation."

- title: "Ouyang (Accepted JFE) - Cashless Payment and Financial Inclusion"
  file: "Ouyang_Accepted_JFE.pdf"
  desc: "This note summarizes the paper, which uses the staggered rollout of Alipay-bundled dockless shared bikes across Chinese cities as an instrument for individual in-person payment flow, estimates a core 2SLS design with individual and month fixed effects plus user/city event studies, mechanism tests (information via noncredit transactions vs enforcement via AUM controls) and financial-inclusion heterogeneity, and interprets the main tables and figures on how cashless payments causally expand BigTech credit access and credit limits for underserved users."

- title: "Borisova & Megginson (RFS, 2011) - Does Government Ownership Affect the Cost of Debt? Evidence from Privatization"
  file: "Borisova_Megginson_RFS_2011.pdf"
  desc: "\" This note summarizes the paper, which builds a bond–year panel of European privatized firms (Privatization Barometer matched to Bloomberg bond yields, 2001–2009), measures credit spreads against maturity-matched sovereign benchmarks, and estimates baseline panel regressions (with orthogonalized ratings) that allow for nonlinearity via a partial-privatization indicator plus retained-ownership percentage (and quadratic terms), crisis and golden-share interactions, speed-of-privatization tests, and 2SLS/within-firm fixed-effects robustness.\""

- title: "Cong, Gao, Ponticelli, and Yang (RFS, 2019) - Credit Allocation Under Economic Stimulus: Evidence from China"
  file: "Cong_Gao_Ponticelli_Yang_RFS_2019.pdf"
  desc: "\" This note summarizes the paper, which uses confidential bank–firm loan-level data from China’s largest banks to build a two-step credit-supply shifter (bank lending growth outside a firm’s city/sector, shift-shared by pre-stimulus lender weights), validates it with Khwaja–Mian within-firm across-lender tests, and estimates fixed-effects (dynamic DiD/event-study) regressions with productivity (APK) and state-ownership interactions—plus an implicit-guarantees mechanism model—to interpret the core tables and figures on stimulus-driven credit misallocation and its persistence.\""

- title: "Ru (JF, 2018) — Government Credit, a Double-Edged Sword: Evidence from the China Development Bank"
  file: "Ru_JF_2018.pdf"
  desc: "This note summarizes the paper, which exploits predetermined city secretary turnover cycles to instrument for China Development Bank credit, estimating city-level lending-cycle event studies and province×industry first-stage regressions and then 2SLS firm-panel effects for same-industry crowding-out and input–output–based upstream-to-downstream spillovers, supported by hazard-model and promotion-probit diagnostics plus exclusion and robustness tests (other policy channels, stronger effects in CDB-connected cities) and a multi-endogenous IV that separates industrial SOE loans from infrastructure loans."

- title: "Bai, Ríos-Rull, and Storesletten (RES, 2026) — Demand Shocks as Technology Shocks"
  file: "Bai_Rios-Rull_Storesletten_RES_2026.pdf"
  desc: "\" This note summarizes the paper, which builds a competitive-search DSGE with product-market matching (shopping effort) so demand shocks can masquerade as technology shocks, derives equilibrium and measured-TFP implications plus identification using shopping-time moments, estimates the full stochastic growth model via mixed-frequency Bayesian methods (ATUS shopping time and the relative price of investment), and interprets the core figures and variance-decomposition tables.\""

- title: "Celentano & Rempel (RES, 2026) — Public Listing Choice with Persistent Hidden Information"
  file: "Celentano_Rempel_RES_2026.pdf"
  desc: "\" This note summarizes the paper, which develops a continuous-time financing-and-contracting model with a persistent hidden cash-flow component (OU dynamics) that creates an endogenous public “information premium,” derives equilibrium sorting between public incentive contracts and private monitoring under scarce private capital (with endogenous PE entry/matching), and then brings the model to the data using public–private listing-choice and CEO-pay reduced-form regressions (LPM/logit and pay-composition specifications) plus a structural GMM estimation that matches listing and pay-performance-sensitivity moments.\""

- title: "Liao, Liu, and Wang (JFE, 2014) — China’s Secondary Privatization"
  file: "Liao_Liu_Wang_JFE_2014.pdf"
  desc: "\" This note summarizes the paper, which treats China’s 2005–2007 Split-Share Structure Reform as a secondary-privatization shock, measures SOE “privatization-led” performance changes using matched size×industry (or size×M/B) benchmark-adjusted DiD-style comparisons, estimates median/Wilcoxon and Koenker–Bassett quantile regressions (plus Fama–French risk-adjusted return tests) on state ownership and government supportive-action proxies, and uses negotiated consideration and approval rates to test market-mechanism information-discovery predictions.\""

- title: "Allen, Gu, Li, Qian, and Qian (JFE, 2023) — Implicit guarantees and the rise of shadow banking: The case of trust products"
  file: "Allen_Gu_Li_Qian_Qian_JFE_2023.pdf"
  desc: "\" This note summarizes the paper, which develops a screening-and-implicit-guarantee contracting model (and a SOE–private capital-misallocation extension) and then tests its predictions in a comprehensive Chinese trust-product dataset using baseline cross-sectional yield-spread regressions on implicit-guarantee proxies/IG index and risk controls, difference-in-differences around the 2015 stock-market crash, risk-sensitivity interactions and risk-shock event studies (2014 default and 2010 housing restrictions), and a policy-shock DiD around the 2018 asset-management regulations with issuance-size/credit-rationing regressions.\""

- title: "Chen, He, and Liu (JFE, 2020) — The financing of local government in China: Stimulus loan wanes and shadow banking waxes"
  file: "Chen_He_Liu_JFE_2020.pdf"
  desc: "\" This note summarizes the paper, which constructs a province-level 2009 stimulus bank-loan shock and an “abnormal” LGFV municipal corporate bond (MCB) issuance measure, estimates year-by-year cross-sectional regressions and a province×year event-study panel with fixed effects (plus an IV using governor late-term tenure and heterogeneity tests based on long-maturity CDB loan exposure), and links the post-2012 rise in MCB issuance and shadow-banking activity (entrusted loans/WMP funding) to a delayed refinancing “stimulus-loan hangover” mechanism.\""

- title: "Alok & Ayyagari (RFS, 2020) — Politics, State Ownership, and Corporate Investments"
  file: "Alok_Ayyagari_RFS_2020.pdf"
  desc: "\" This note summarizes the paper, which uses Indian CAPEX project announcements matched to national/state election timing to document a political investment cycle in SOEs by estimating district-year fixed-effects DiD regressions and IV-2SLS models that instrument election-year indicators with the constitutionally scheduled five-year cycle, extending to swing-district (Close) and minister/ideology heterogeneity and event-time dynamics, project-level visibility/composition regressions, stock-market event studies of announcement (and implementation) returns, and private-investment crowding-out specifications.\""

- title: "Fang, Lerner, and Wu (RFS, 2017) — Intellectual Property Rights Protection, Ownership, and Innovation: Evidence from China"
  file: "Fang_Lerner_Wu_RFS_2017.pdf"
  desc: "\" This note summarizes the paper, which constructs a prefecture-year IPR protection score and firm patent-stock measures, treats China’s SOE privatization events as within-firm ownership shocks, estimates baseline panel DiD regressions of log(1 + Ki,t ) on POST, lagged IPRScore, and the key POST × IPRScore interaction with rich controls and fixed effects, corroborates the interaction with a propensity-score–matched dynamic event-study DiD around privatization, and addresses IPR endogeneity with a 2SLS strategy instrumenting IPRScore using historical Christian-college and British-settlement exposure, interpreting the core tables and figures on how stronger local IPR amplifies post-privatization innovation.\""

- title: "Huang, Li, Ma and Xu (AER, 2017) — Hayek, Local Information, and Commanding Heights: Decentralizing State-Owned Enterprises in China"
  file: "Huang_Li_Ma_Xu_AER_2017.pdf"
  desc: "\" This note summarizes the paper, which tests Hayek’s local-information view of decentralization using Chinese SOE oversight transfers in ASIF (1998–2007) by estimating baseline probit models of decentralization on log distance to the oversight government with rich firm/province controls and fixed effects, corroborating the result with Cox hazard and multinomial-logit (decentralize vs restructure) specifications, addressing endogeneity with a Third Front Construction IV for distance and placebo-distance tests, and using interaction designs with communication-cost proxies (road density), performance heterogeneity, strategic-industry status (“commanding heights”), and rent/corruption measures to discriminate among competing mechanisms.\""

- title: "Brandt, VanBiesebroeck, Wang, and Zhang (AER, 2017) - WTO Accession and Performance of Chinese Manufacturing Firms"
  file: "Brandt_VanBiesebroeck_Wang_Zhang_AER_2017.pdf"
  desc: "This note summarizes the paper, which studies China’s WTO-driven trade liberalization by separating output vs. input tariff cuts, instrumenting applied tariffs with WTO bound tariffs, estimating firm-level fixed-effects regressions of markups and productivity, measuring markups via the De Loecker–Warzynski cost-share method, addressing revenue-TFP price-deflator bias, and decomposing industry outcomes into within/between reallocation and entry/exit margins while interpreting the core tables and figures on how competition and input-cost channels jointly reshape markups and productivity."

- title: "Avramov, Ge, Li, and Linton (JFE, 2026) - Dual Peer Effects and Cross-Stock Predictability"
  file: "Avramov_Ge_Li_Linton_JFE_2026.pdf"
  desc: "This note summarizes the paper, which builds an economically structured Peer Index (PI) return predictor by mapping peer-network–transformed characteristics—peer averages (“peer strength”) and within-peer deviations (“relative position”)—into expected returns via ridge-regularized dual-peer-effects estimation, benchmarks PI against own-characteristic ML using Fama–MacBeth regressions, out-of-sample R2/MSPE comparisons, portfolio sorts and factor-spanning tests, studies slow information diffusion with lag-augmented local projections and earnings-surprise predictability regressions, and extends to directed networks through a symmetric–antisymmetric decomposition and drop-one-out importance analysis while interpreting the core tables and figures."

- title: "Sun & Tongnd (JFE, 2003) - China Share Issue Privatization: The Extent of Its Success"
  file: "Sun_Tong_JFE_2003.pdf"
  desc: "This note summarizes the paper, which evaluates China’s share-issue privatization using an event-time before–after design around the listing year for 634 firms (1994–1998), constructs real/normalized profit, output, leverage, and productivity measures, applies Wilcoxon signed-rank/rank-sum and proportion tests plus cross-sectional and firm fixed-effects regressions to link post-listing performance to ownership structure (state vs legal-person/foreign shares), and addresses selection with state-share regressions and a logit for foreign-share issuance while interpreting the core tables and Figure 1 on stock-market returns."

- title: "Hansen & Tong (RFS, 2026) — Option Pricing with Time-Varying Volatility Risk Aversion"
  file: "Hansen_Tong_RFS_2026.pdf"
  desc: "\" This note summarizes the paper, which builds a discrete-time option-pricing framework that keeps physical returns in a Heston–Nandi GARCH but lets volatility risk aversion vary over time through a derivative-implied variance risk ratio ηt , derives the no-arbitrage mapping to time-varying risk-neutral dynamics and a closed-form VIX, prices options using an MGF-based second-order analytic approximation under stochastic ηt , and estimates ηt with a score-driven (observation-driven) state update in a joint likelihood on returns, VIX, and option panels while interpreting the core tables and figures on pricing-kernel curvature flips and the DHNG model’s large in-/out-of-sample fit gains.\""

- title: "Taschereau-Dumouchel (RES, 2026) - Cascades and Fluctuations in an Economy with an Endogenous Production Network"
  file: "Taschereau-Dumouchel_RES_2026.pdf"
  desc: "This note summarizes the paper, which models endogenous production-network formation through firms’ costly operate/exit decisions in a CES input-output economy, solves the NP-hard planner problem over the operating set with a “reshaping” relaxation that preserves and selects corner solutions, characterizes efficient versus distorted equilibria and cascade dynamics arising from complementarities, and quantifies the mechanism by calibrating and simulating the model on U.S. supply-chain data (FactSet/Compustat) and estimating distance-based neighbor-exit spillover regressions, with interpretation of the core tables and figures on clustering, cascades, and aggregate fluctuations."

- title: "Drechsler, Savov, and Schnabl (JFE, 2022) — How monetary policy shaped the housing boom"
  file: "Drechsler_Savov_Schnabl_JFE_2022.pdf"
  desc: "\" This note summarizes the paper, which identifies a “deposits channel” of monetary tightening by estimating pre-boom deposit-spread betas at the branch level and funding-cost (interest-expense spread) betas at the bank level, aggregating them into a predetermined county exposure measure using 2002 portfolio-mortgage shares, and then running sequential branch-, bank-, and county-level reduced-form and 2SLS tests (beta → spread changes; beta → deposit growth with within-bank comparisons; deposit growth → balance-sheet mortgage lending; and county outcomes for portfolio lending and the shift toward PLS/nonbanks), culminating in an aggregate counterfactual and interpretation of the core tables/figures on why 2004–2006 tightening reallocated mortgage finance from bank portfolios to PLS and nonbank lending.\""

- title: "Jiang & Zhang (JFE, 2025) — Collateral Value Uncertainty and Mortgage Credit Provision"
  file: "Jiang_Zhang_JFE_2025.pdf"
  desc: "\" This note summarizes the paper, which measures collateral value uncertainty using a hedonic-price/heteroskedasticity house price dispersion estimator (predicted idiosyncratic price volatility, aggregated to zipcode-year), estimates reduced-form fixed-effects regressions linking dispersion to mortgage rejections, interest-rate menus conditional on leverage, and loan-to-price outcomes, identifies causality with a house non-standardization IV in 2SLS (validated via ex-post default “exclusion” tests), and calibrates a structural mortgage-origination model that decomposes effects into collateral-recovery versus appraisal-risk channels and evaluates policy counterfactuals.\""

- title: "Giroud, Liu, and Mueller (JFE, 2026) — Innovation spillovers across U.S. tech clusters"
  file: "Giroud_Liu_Mueller_JFE_2026.pdf"
  desc: "\" This note summarizes the paper, which uses Census plant-year data matched to USPTO patents (1976–2018) to define clusters as BEA economic area × CPC field and measure inventor productivity and plant TFPR; it estimates within-cluster spillover regressions with plant and city×year/field×year/city×field fixed effects and cross-cluster spillover regressions that compare plants in the same city×field×year but connected through their parent firm to different innovating clusters; identification is bolstered with inventor-based placebos, a network-based 2SLS instrument for connected-cluster size, and mechanism evidence from no distance decay and patent-citation shares; finally, it develops a multi-location model and calibrates a social–private innovation wedge γn /βn to rank clusters by underinvestment and policy relevance.\""

- title: "Taylor (JF, 2010) — Why Are CEOs Rarely Fired? Evidence from Structural Estimation"
  file: "Taylor_JF_2010.pdf"
  desc: "\" This note summarizes the paper, which structurally estimates a dynamic board firing problem with Bayesian learning about CEO ability from persistent profitability plus an additional signal, embeds a threshold dismissal rule with both real turnover costs and an entrenchment (board “personal cost”) wedge, and fits the model by simulated method of moments to CEO-spell, profitability-dynamics, and event-time/hazard moments to explain why forced CEO turnover is rare and to run counterfactuals (e.g., removing entrenchment).\""

- title: "Schroth, Suarez, and Taylor (JFE, 2014) — Dynamic debt runs and financial fragility: Evidence from the 2007 ABCP crisis"
  file: "Schroth_Suarez_Taylor_JFE_2014.pdf"
  desc: "\" This note summarizes the paper, which estimates a structural continuous-time short-term debt run model with endogenous rollover yields (dilution-risk amplification) and a yield-cap–pinned run threshold, fits it to weekly conduit-level DTCC ABCP issuance/yield data via simulated method of moments using yield-volatility, pre-run event-time spread dynamics, and run-forecasting moments (separately for strong vs weak guarantee subsamples), and uses the estimated parameters to quantify fragility and warning signals.\""

- title: "Cookson, Niessner, and Schiller (JF, 2026) — Can Social Media Inform Corporate Decisions? Evidence from Merger Withdrawals"
  file: "Cookson_Niessner_Schiller_JF_2026.pdf"
  desc: "\" This note summarizes the paper, which uses StockTwits cashtagged posts to construct deal-level abnormal sentiment around M&A announcements, estimates linear-probability withdrawal regressions with rich CAR/news/analyst controls and fixed effects, tests value implications via post-announcement BHAR and an AbnSent × Withdrawn interaction, and provides learning-mechanism evidence using corporate-Twitter adoption interactions plus text/topic classifications (max-entropy/naive Bayes sentiment and BTM topics).\""

- title: "Boguth, Duchin, and Simutin(JF, 2022) — Dissecting Conglomerate Valuations"
  file: "Boguth_Duchin_Simutin_JF_2022.pdf"
  desc: "\" This note summarizes the paper, which replaces standalone-industry multiples with a conglomerate-implied estimator of divisional q (year-by-year cross-sectional median/quantile regressions of value-to-sales on segment-share exposures), defines RDQ as the log wedge between divisional and standalone q, uses economic vs. credit-shock sensitivity regressions (including PC “horse races”) and coinsurance/covariance splits to isolate a financing-frictions/internal-capital-markets mechanism, and links RDQ to real outcomes via investment–q sensitivities (including spinoff pre/post flips) and diversifying M&A intensity and announcement-return regressions.\""

- title: "Tomunen (RFS, 2026) — Failure to Share Natural Disaster Risk"
  file: "Tomunen_RFS_2026.pdf"
  desc: "\" This note summarizes the paper, which uses catastrophe bonds as a clean laboratory where disaster cash flows are (approximately) orthogonal to household macro risk, develops a segmented-intermediary asset-pricing model with a “skin-in-the-game” outside-capital constraint and mean–variance/CRRA mapping, constructs bond-level expected excess returns as discount margin minus expected actuarial loss, estimates forward-looking “cat-market betas” via Monte Carlo simulations of bond-state returns by peril category, tests “failure to share” risk through Fama–MacBeth cross-sectional pricing regressions and pooled time-series restrictions tying the aggregate disaster premium to specialist AUM versus market size, and validates the exclusion restriction plus alternative channels with international macro local projections and liquidity/climate-change robustness checks.\""

- title: "Vesa_Pursiainen (JF, 2022) — Cultural Biases in Equity Analysis"
  file: "Vesa_Pursiainen_JF_2022.pdf"
  desc: "\" This note summarizes the paper, which constructs a bilateral cultural trust-bias measure from Eurobarometer survey residuals (origin-, destination-, and year-FE), estimates analyst–firm–month recommendation/target-price (and earnings-forecast) regressions with demanding analyst–month and firm–month fixed effects plus salience and sentiment interactions, exploits the European debt crisis and Brexit as perception shocks in triple-difference/event-time designs, and tests market recognition and information content using recommendation-announcement CAR regressions and monthly-return predictability specifications.\""

- title: "Li, Sokolinski, and Tamoni (JFE, 2026) — Which investors drive anomaly returns and how?"
  file: "Li_Sokolinski_Tamoni_JFE_2026.pdf"
  desc: "\" This note summarizes the paper, which estimates a two-tier nested-logit equity demand system (industry allocation and within-industry stock choice) on holdings data using counterfactual price instruments, solves the implied equilibrium pricing map each quarter to run sequential block-by-block counterfactuals (industry rotation, shares/characteristics, AUM/flows, characteristics demand, latent demand), maps the resulting price changes into anomaly long–short portfolio returns to perform a covariance-based time-series variance decomposition by trading motive and investor type, and embeds these components in a Campbell-style VAR cash-flow vs discount-rate news decomposition to interpret the core tables and figures on who drives anomaly returns and why.\""

- title: "Dinc and Erel (JF, 2013) — Economic Nationalism in Mergers and Acquisitions"
  file: "Dinc_Erel_JF_2013.pdf"
  desc: "\" This note summarizes the paper, which hand-collects EU-15 government reactions (oppose/support/neutral) to large domestic vs. foreign takeover bids (1997–2006), estimates multinomial-logit reaction models with nationalist-sentiment and political interactions, links reactions to completion via logit, addresses premium endogeneity with a probit-first-stage/2SLS IV design, and quantifies deterrence using firm- and country-level Cox hazard models of subsequent foreign bids while interpreting the core tables and figures on economic nationalism.\""

- title: "Cao, Liang, Yao, and Zhang (JFE, 2026) — Liquidity characteristics of market anomalies and institutional trading"
  file: "Cao_Liang_Yao_Zhang_JFE_2026.pdf"
  desc: "\" This note summarizes the paper, which studies 32 market anomalies by forming long–short tercile portfolios, measuring liquidity with ranked Amihud illiquidity and pre-formation liquidity changes, decomposing institutional trading into liquidity-related vs residual components via cross-sectional regressions (within exchange/size cells), tracing liquidity gradients to corporate events and information-environment shocks using Fama–MacBeth and event-driven trading decompositions, validating causality with tick-size-reform DiD quasi-experiments, and linking liquidity-motivated “wrong-way” trading to anomaly alphas by sorting on trading direction while interpreting all core tables and figures.\""

- title: "Ahern and Sosyura (JF, 2014) — Who Writes the News? Corporate Press Releases during Merger Negotiations"
  file: "Ahern_Sosyura_JF_2014.pdf"
  desc: "\" This note summarizes the paper, which exploits fixed- versus floating-exchange-ratio stock mergers as incentive-shifting quasi-experimental variation, uses hand-collected negotiation-start dates and Factiva daily media counts (with newswires as a firm-originated proxy) to estimate firm–deal fixed-effects difference-in-differences and valuation-interaction regressions, tests for post-announcement reversals and tone shifts, and links negotiation-period media to the division of merger gains and to cross-sectional determinants of active media management.\""

- title: "Kepler, Naiker, and Stewar (JF, 2023) — Stealth Acquisitions and Product Market Competition"
  file: "Kepler_Naiker_Stewar_JF_2023.pdf"
  desc: "\" This note summarizes the paper, which exploits the time-varying Hart–Scott–Rodino (HSR) filing threshold as a regulatory notch by standardizing deal values around the cutoff, documents “stealth” bunching with McCrary density and histogram-bin tests plus placebo/falsification cutoffs, characterizes avoidance using fixed-effects linear probability models of being just-below (earnouts/contract terms, payment form, CEO ties, and overlap–concentration interactions), and links these deals to reduced competition using rival announcement-return event studies, industry gross-margin changes, and retail-scanner price difference-in-differences (including common-vs-uncommon products).\""

- title: "Goldstein, Liu, and Yang (JFE, 2026) — Market Feedback: Evidence from the Horse’s Mouth"
  file: "Goldstein_Liu_Yang_JFE_2026.pdf"
  desc: "\" This note summarizes the paper, which surveys (nearly) the universe of Chinese listed firms in 2019 and 2022 about stock-price monitoring and learning vs. financing motives, and then validates these responses using (i) cross-sectional Probit models for the determinants of “learning,” (ii) firm-year fixed-effects regressions of investment-to-price (Tobin’s Q) sensitivity (including content-specific splits), (iii) M&A activity/performance regressions tied to “learning about M&A,” and (iv) firm-month Probit models of discretionary trading suspensions interacted with large price drops, interpreting the core tables and figures as direct evidence of market feedback.\""

- title: "Beyhaghi, Fracassi, and Weitzner (JF, 2026) — Adverse Selection in Corporate Loan Markets"
  file: "Beyhaghi_Fracassi_Weitzner_JF_2026.pdf"
  desc: "\" This note summarizes the paper, which uses Federal Reserve Y-14Q supervisory loan data with banks’ internal PD/LGD to validate lender private information (pricing and ex post default regressions), estimates loan- and county-level panel specifications linking interest rates, borrower risk, lending volumes, and risk-orthogonalized markups to local market structure (the number of banks) with rich fixed effects and mechanism tests (tangibility splits and stay-with-bank “information rent” regressions), and then provides causal evidence via a Bartik-style DiD/event-study and 2SLS instrument based on counties’ pre-2016 GSIB exposure to the 2016–2019 capital-surcharge shock, interpreting the core tables and figures on adverse selection reversing standard competition effects in corporate loan markets.\""

- title: "Cunningham, Ederer, and Ma (JPE, 2021) — Killer Acquisitions"
  file: "Cunningham_Ederer_Ma_JPE_2021.pdf"
  desc: "\" This note summarizes the paper, which formalizes “killer acquisitions” in a simple acquisition-and-innovation model where product-market overlap creates a replacement effect that makes incumbents optimally discontinue acquired innovation, and then tests the predictions using pharma project-level data by estimating project-year development panel triple-difference regressions 1{Acquired}×1{Post}×1{Overlap} with rich fixed effects and pre-trend checks, competition and patent-life heterogeneity designs, a deal-fixed-effect conditional logit for acquisition choice, and discontinuity-style evidence around HSR antitrust thresholds, complemented by asset-redeployment/human-capital and deal-value analyses.\""

- title: "Hilscher, Raviv, and Reis (RFS, 2026) — How Likely Is an Inflation Disaster?"
  file: "Hilscher_Raviv_Reis_RFS_2026.pdf"
  desc: "\" This note summarizes the paper, which measures forward (e.g., 5y5y) inflation “disaster” probabilities from inflation options by (i) recovering nominal and risk-neutral distributions from option prices via strike-curvature identities, (ii) applying an inflation (real-payoff) adjustment to convert conventional nominal objects into real risk-neutral probabilities, (iii) imposing a parsimonious restricted Markov-chain persistence model (estimated by GMM using 5y/10y and forward-starting option slices) to transform cumulative horizons into forward-window probabilities, and (iv) mapping risk-neutral tails into physical tails with a tail-only rare-disaster risk-adjustment model (Pareto disaster sizes calibrated to long-run macro data), then interpreting the core tables and figures on deanchoring, reanchoring, and “scarring” in long-run inflation tail risk.\""

- title: "Boone & Mulherin (JF, 2007) — How Are Firms Sold?"
  file: "Boone_Mulherin_JF_2007.pdf"
  desc: "This note summarizes the paper, which opens the private takeover “black box” by hand-collecting sale-process measures from SEC filings (contacts, confidentiality/standstill agreements, private written bids, and public bids), classifies auctions vs. negotiations based on the private stage, and tests whether auctions generate higher target returns using announcement-window event studies, multivariate OLS, and an endogeneity-corrected two-stage probit least squares (2SPLS) system."

- title: "Adelino, Schoar, and Severino (RFS, 2016) — Loan Originations and Defaults in the Mortgage Crisis: The Role of the Middle Class"
  file: "Adelino_Schoar_Severino_RFS_2016.pdf"
  desc: "This note summarizes the paper, which uses HMDA–IRS–LPS/Blackbox–SCF–Zillow data to decompose mortgage-origination growth into intensive vs. extensive margins (dollars= #loans × avg size), estimate ZIP-level growth regressions benchmarking Mian–Sufi with pooled/within-county (county FE) and between-county variation plus within–between variance decompositions, run ZIP-panel and loan-level fixed-effects specifications (including year-interacted slopes), and conduct heterogeneity/robustness analyses (buyer vs resident income, GSE/subprime splits, refinancing) to interpret the core tables and figures showing that boom origination dollars and crisis delinquent dollars were largely middle-class/prime and that “credit–income decoupling” mainly reflects transaction volume rather than unusually large loans to low-income borrowers."

- title: "Fang, Liu, and Roussanov (RFS, 2026) — Getting to the Core: Inflation Risks Within and Across Asset Classes"
  file: "Fang_Liu_Roussanov_RFS_2026.pdf"
  desc: "This note summarizes the paper, which extracts headline/core/food/energy inflation shocks from a reduced-form VAR, estimates cross-asset inflation betas via inflation-hedging time-series regressions, prices these risks in the cross section using a two-step Fama–MacBeth (Shanken-corrected) beta-pricing framework and factor-mimicking portfolios (within and across eight asset classes), studies time variation with conditional risk-price estimation and spanning/high-frequency announcement tests, and rationalizes the core-versus-energy findings in a two-sector New Keynesian asset-pricing model with sticky core prices and flexible energy."

- title: "Bao & Edmans (RFS, 2011) — Do Investment Banks Matter for M&A Returns?"
  file: "Bao_Edmans_RFS_2011.pdf"
  desc: "This note summarizes the paper, which uses a large SDC–CRSP sample of U.S. acquisitions to compute (−1,+1) acquirer announcement CARs, estimates deal-level regressions with advisor (bank) fixed effects (with time and acquirer controls/fixed effects and residualized CAR measures) to quantify economically large bank effects, tests persistence via bank performance sorts and bank-year panel regressions, and studies why persistence survives using market-share dynamics, repeat-advisor (relationship lock-in) comparisons, and a no-relationship logit bank-choice model."

- title: "Horenstein, Vasquez, and Xiao (RFS, 2026) — Common Factors in Equity Option Returns"
  file: "Horenstein_Vasquez_Xiao_RFS_2026.pdf"
  desc: "This note summarizes the paper, which constructs daily delta-hedged equity option returns from OptionMetrics and characteristic-sorted ATM (and OTM) call/put portfolios, estimates the latent common-factor structure using PCA and factor-number/residual-factor tests, and then translates those latent factors into a parsimonious tradable model by searching across candidate long–short strategies to select the four-factor benchmark {EWOP,HV–IV,Cash,VOV}, interpreting the core tables and figures on shared vs contract-specific option-return factors and their in-/out-of-sample pricing performance."

- title: "Keys and Wang (JFE, 2019) — Minimum payments and debt paydown in consumer credit cards"
  file: "Keys_Wang_JFE_2019.pdf"
  desc: "This note summarizes the paper, which uses CFPB credit-card account data and issuer-level minimum-payment formula changes as quasi-experiments, estimates event-study difference-in-differences models with account and month fixed effects (binary exposure and dollar-intensity specifications) to track how payments shift relative to the new minimum, maps these distributional responses into lower bounds on anchoring versus upper bounds on liquidity constraints using a simple conceptual framework, and interprets the core tables and figures on minimum payments as a salient behavioral anchor for debt paydown."

- title: "Bombardini, Li, and Trebbi (AER, 2023) — Did US Politicians Expect the China Shock?"
  file: "Bombardini_Li_Trebbi_AER_2023.pdf"
  desc: "This note summarizes the paper, which models repeated 1990–2001 House votes on renewing China’s NTR as a forward-looking probit choice that depends on legislators’ expected future district China-import shock, estimates preference and information parameters under alternative information sets using probit MLE (when the information set is specified) and moment-inequality inference (when it is only partially observed), constructs past and future district exposure via an industry-level shift-share China-shock measure aggregated from commuting zones, and uses heterogeneity tests and counterfactual simulations (perfect information vs stronger constituent sensitivity) to assess whether politicians anticipated the China shock and how much they weighted it relative to ideology."

- title: "Bennett, Bettis, Gopalan, and Milbourn (JFE, 2017) — Compensation goals and firm performance"
  file: "Bennett_Bettis_Gopalan_Milbourn_JFE_2017.pdf"
  desc: "This note summarizes the paper, which uses Incentive Lab executive-contract disclosures matched to Compustat to test for “just-beat-the-goal” bunching in Actual−Goal at zero via McCrary density discontinuity, Bollen–Pool-style across-density tests, bootstrap/bin-based regressions, and then examines mechanisms through target-ratcheting and forced-turnover regressions plus earnings-management/real-actions tests (abnormal accruals and R&D/SG&A cuts)."

- title: "Bretscher, Schmid, Sen, and Sharma (RFS, 2026) — Institutional Corporate Bond Pricing"
  file: "Bretscher_Schmid_Sen_Sharma_RFS_2026.pdf"
  desc: "This note summarizes the paper, which builds and estimates a demand-based equilibrium corporate bond pricing model using institutional holdings and bond prices, specifies a nested-logit demand system within and across rating groups (IG vs HY) identified via a mandate-based sequential IV strategy, imposes market clearing to back out equilibrium spreads, and uses the estimated elasticities to quantify price impact/fragility and counterfactual spread effects of ownership shifts, downgrades, and fund outflows."

- title: "\"Landais (AEJEP, 2015) — Assessing the Welfare Effects of Unemployment Benefits Using the Regression Kink"
  file: "Landais_AEJEP_2015.pdf"
  desc: "This note summarizes the paper, which uses kinked U.S. unemployment-insurance schedules (weekly benefit level and potential duration) to implement a local-polynomial Regression Kink Design on administrative UI data, combines the RKD estimates with a dynamic search model (Proposition 1) to correct for state dependence and separately identify liquidity vs moral-hazard (Frisch) effects from level-versus-duration changes, and interprets the key density/covariate smoothness validity checks plus the core tables and figures on duration elasticities and welfare implications."

- title: "Cengiz, Dube, Lindner, and Zipperer (QJE, 2019) — The Effect of Minimum Wages on Low-Wage Jobs"
  file: "Cengiz_Dube_Lindner_Zipperer_QJE_2019.pdf"
  desc: "This note summarizes the paper, which uses CPS MORG employment–wage data (benchmarked to QCEW) to estimate a stacked event-study difference-in-differences in state×quarter×wage-bin cells around 138 state minimum-wage hikes, decomposes the wage-distribution response into “missing” jobs below the new floor and “excess” jobs at/above it (plus spillover and elasticity calculations, event-by-event heterogeneity, and TWFE diagnostic comparisons), and interprets all core tables and figures on reallocation within the low-wage distribution with near-zero net employment effects."

- title: "Heider and Ljungqvist (JFE, 2015) — As certain as debt and taxes: Estimating the tax sensitivity of leverage from state tax changes"
  file: "Heider_Ljungqvist_JFE_2015.pdf"
  desc: "This note summarizes the paper, which exploits staggered U.S. state corporate income tax changes as quasi-exogenous shocks, estimates first-difference diff-in-diff and event-study (leads/lags) regressions with industry-year fixed effects, strengthens identification with neighbor-state falsifications and cross-border county-pair designs, extends exposure measurement for multi-state firms using employee/sales weights and headquarters-history corrections, and interprets the core tables and figures documenting asymmetric leverage responses (tax hikes raise long-term leverage while tax cuts do not) consistent with dynamic tradeoff “ratcheting.”"

- title: "Bennedsen, Nielsen, Perez-Gonzalez, and Wolfenzon (QJE, 2007) — Inside the Family Firm: The Role of Families in Succession Decisions and Performance"
  file: "Bennedsen_Nielsen_Perez-Gonzalez_Wolfenzon_QJE_2007.pdf"
  desc: "This note summarizes the paper, which links Danish registry data on firms and family relations to a CEO-turnover event design (pre/post profitability changes), estimates baseline OLS and an instrumental-variables (2SLS) strategy that instruments family-CEO appointments with the departing CEO’s firstborn-child gender (with balance, first-stage, and reduced-form validation plus alternative male-child and CEO-death instruments), and interprets all core tables and figures on the causal performance effects of family succession."

- title: "Baghai, Silva, and Ye (RFS, 2024) — Teams and Bankruptcy"
  file: "Baghai_Silva_Ye_RFS_2024.pdf"
  desc: "This note summarizes the paper, which links inventor–firm–year patent data to staggered corporate bankruptcies (1980–2015) and estimates inventor fixed-effects DiD and event-study regressions of patent quantity/quality around filing, identifies team-specific human-capital losses by interacting post-bankruptcy exposure with a pre-bankruptcy team-dependence measure, and tests mechanisms with team-stability (“remain together”) outcomes plus pair-level joint-mobility and bankruptcy-resolution/noncompete-enforceability heterogeneity specifications while interpreting the core tables and figures."

- title: "Crane, Michenaud, and Weston (RFS, 2016) — The Effect of Institutional Ownership on Payout Policy: Evidence from Index Thresholds"
  file: "Crane_Michenaud_Weston_RFS_2016.pdf"
  desc: "This note summarizes the paper, which exploits the annual Russell 1000/2000 reconstitution as a quasi-experiment, estimates a sharp regression discontinuity at the market-cap rank cutoff as a first stage for institutional ownership and then a 2SLS/RD-IV second stage for payout policy (dividends, repurchases, total payout), supplements the design with governance-engagement RD regressions and agency-proxy heterogeneity tests (plus bandwidth/float-adjustment/banding robustness), and interprets the core tables and figures linking index-induced institutional ownership to higher payouts via monitoring/agency channels."

- title: "Leary & Roberts (JF, 2014) — Do Peer Firms Affect Corporate Financial Policy?"
  file: "Leary_Roberts_JF_2014.pdf"
  desc: "This note summarizes the paper, which estimates contemporaneous peer effects in firms’ leverage and financing by instrumenting peer-average financial policies with peers’ lagged idiosyncratic equity-return shocks (constructed from rolling factor-model residuals), running reduced-form and 2SLS peer-effects regressions with industry/year fixed effects plus correlated-effects falsifications (customer–supplier and placebo tests), and quantifying amplification/spillovers and leader–follower heterogeneity."

- title: "Brandt, Kambourov, and Storesletten (RES, 2026) — Barriers to Entry and Regional Economic Growth in China"
  file: "Brandt_Kambourov_Storesletten_RES_2026.pdf"
  desc: "This note summarizes the paper, which documents rapid prefecture-level convergence in China’s non-state manufacturing using the Chinese Industry Census, builds an analytically tractable Hopenhayn-style entry-and-selection model with output/capital wedges plus an explicit licensing-based entry barrier, inverts the model to impute prefecture entry barriers from wages (using firm-level wedge measures and migration-based N/M), validates the barrier measure with World Bank “Doing Business” data and cohort/firm-age mechanism evidence, decomposes convergence and aggregate growth via model-based counterfactual accounting, and then links barriers causally to the SOE sector using cross-sectional IVs and a Bartik design around the 1997 SOE reform."

- title: "Kremens, Martin, and Varela (JF, 2025)— Long-Horizon Exchange Rate Expectations"
  file: "Kremens_Martin_Varela_JF_2025.pdf"
  desc: "This note summarizes the paper, which uses professional FX surveys to construct long-horizon expected appreciation and expected excess returns (SCA/SXR), estimates panel forecasting regressions that augment UIP (RCA/RXR on SXR and IRD with currency/time fixed effects), benchmarks surveys against predictors like the quanto-implied risk premium (QRP), real exchange rate, VIX, and CA/GDP using in-sample and Goyal–Welch out-of-sample R2 tests, “explains” expectations by projecting surveys on these state variables and testing for any residual “secret sauce,” and studies horizon dependence via annualization and forward-expectation decompositions while interpreting the results through risk-based vs variance-constrained intermediary models and the core tables/figures."

- title: "Gompers, Kaplan, and Mukharlyamov (JFE, 2016)— What do private equity firms say they do?"
  file: "Gompers_Kaplan_Mukharlyamov_JFE_2016.pdf"
  desc: "This note summarizes the paper, which uses a detailed survey of private equity investors to document how PE firms say they evaluate deals, choose leverage, govern portfolio companies, and create operational value, then applies descriptive cross-tab comparisons and empirical classification tools (k-means clustering and factor analysis) to map heterogeneous “PE styles” and relate them to founder backgrounds while interpreting the core tables and figures."

- title: "Chen, Chen, He, Liu, and Xie (JF, 2023)— Pledgeability and Asset Prices: Evidence from the Chinese Corporate Bond Markets"
  file: "Chen_Chen_He_Liu_Xie_JF_2023.pdf"
  desc: "This note summarizes the paper, which models corporate bond prices as fundamental value + λ × pledgeability (via repo haircuts), exploits dual-listed enterprise bonds trading in segmented exchange vs interbank markets to net out fundamentals, uses the Dec 8, 2014 exchange-only repo-eligibility shock for AA+/AA bonds to run event-study DiD and 2SLS (IV) estimates of the pledgeability premium from cross-market yield wedges (with an exchange-only matched-AAA upper-bound design and arbitrage-bound logic), and interprets the core tables and figures quantifying how a haircut jump (0→100) raises yields by roughly 39–85 bps."

- title: "Eaton, Green, Roseman, and Wu (JFE, 2026)— Retail option traders and the implied volatility surface"
  file: "Eaton_Green_Roseman_Wu_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses OPRA option-trade data (with a Nasdaq “small customer” proxy as a robustness check) to construct chain-weighted Black–Scholes implied-volatility surfaces and net retail demand pressure, and identifies the causal impact of retail participation via a difference-in-differences design around retail brokerage outages (outage windows vs the same time-of-day in the prior five trading days; high-retail-interest stocks vs low-retail controls), estimating 15-minute panel regressions and event-time plots across moneyness/maturity/call-put slices to show that removing retail demand lowers IV where retail is normally a net buyer (short-dated OTM calls) and raises IV where retail is normally a net writer (long maturity), flattening the smile, term structure, and call–put wedge."

- title: "Masta (JF, 2010)— Capital Structure as a Strategic Variable: Evidence from Collective Bargaining"
  file: "Matsa_JF_2010.pdf"
  desc: "This note summarizes the paper, which models debt as a commitment device in union wage bargaining (generalized Nash bargaining under no-refinancing/non-pledgeability), derives the key prediction that leverage (especially near-term debt) rises with union power × profit volatility, and tests it using Rajan–Zingales-style cross-sectional leverage regressions plus state labor-law quasi-experiments (RTW adoption and WSP repeal) in DiD/event-time specifications and complementary inventory-policy evidence, interpreting the core tables and figures."

- title: "Biais, Hombert, and Weill(AER, 2021)— Incentive Constrained Risk Sharing, Segmentation, and Asset Pricing"
  file: "Biais_Hombert_Weill_AER_2021.pdf"
  desc: "This note summarizes the paper, which builds a finite-horizon asset-pricing model with one-step Arrow securities and a rich menu of trees under limited commitment/imperfect pledgeability, derives equilibrium no-arbitrage bounds, existence, and private valuation operators with incentive wedges, characterizes endogenous asset-holding segmentation as an assignment/optimal-transport (power-diagram) partition of payoff space, and develops pricing implications—one-directional (negative) bases versus long-only replication and concave expected-return relations in factor loadings—illustrated with parametric examples and Figures 1–4."

- title: "Ammann, Cochardt, Cohen and Heller (JFE, 2026)— Hidden alpha"
  file: "Ammann_Cochardt_Cohen_Heller_JFE_2026.pdf"
  desc: "This note summarizes the paper, which constructs a large-scale mutual-fund-manager–firm-officer social network from Facebook (matched to Morningstar and BoardEx) and a key “friendship visibility” state (FullyHidden vs visible), then documents “hidden alpha” using holdings-weight tilting regressions, calendar-time connected–nonconnected long–short portfolios with four-factor and DGTW-adjusted alphas, falsification via connected-not-held portfolios, trade-based buy–sell timing tests, daily news-event return decompositions, and Fama–MacBeth cross-sectional predictability regressions, interpreting the core tables and figures throughout."

- title: "Giroud and Mueller (JFE, 2010)— Does corporate governance matter in competitive industries?"
  file: "Giroud_Mueller_JFE_2010.pdf"
  desc: "This note summarizes the paper, which uses the staggered passage of state business combination (BC) laws as an anti-takeover governance shock, estimates firm-year panel DiD regressions with firm and year fixed effects and a BC×HHI (industry concentration) interaction (plus alternative competition measures and robustness/pre-trend checks), complements the analysis with incorporation-state portfolio market-model event studies and takeover-hazard/mechanism tests, and interprets the core tables and figures showing that product-market competition substitutes for external governance (via a “quiet life” cost channel in concentrated industries)."

- title: "van Binsbergen (JFE, 2026)— Duration-based stock valuation: Reassessing stock market performance and volatility"
  file: "van_Binsbergen_JFE_2026.pdf"
  desc: "This note summarizes the paper, which redefines the equity premium using a duration-matched benchmark by valuing equity as a portfolio of dividend strips, constructing strip-weighted constant-maturity and strip-replicating zero-coupon bond counterfactuals from yield curves (with Gordon-growth and dividend-futures-implied weighting schemes), and evaluating U.S. and international evidence via return/volatility term-structure comparisons and a variance decomposition that separates dividend-risk premia from term premia, while interpreting the core tables and figures."

- title: "Bollen and Pool (JF, 2009)— Do Hedge Fund Managers Misreport Returns? Evidence from the Pooled Distribution"
  file: "Bollen_Pool_JF_2009.pdf"
  desc: "This note summarizes the paper, which tests for hedge-fund return misreporting by detecting a zero-return “kink” in the pooled monthly return distribution using histogram/KDE-based discontinuity tests (bin-by-bin Z-statistics with smoothed-bootstrap confidence bands), links the incentive to avoid small losses via flow–performance regressions, corroborates manipulation with reversal and out-of-sample deterioration tests using a fund-level kink measure, rules out alternative explanations with audit-window, fitted-return, and liquidity/smoothing (MA(2)) robustness checks, and quantifies investor wealth transfers from inflated NAVs while interpreting the core tables and figures."

- title: "Stavrakeva and Tang (JF, 2026)— The Dollar during the Great Recession: The Information Channel of U.S. Monetary Policy and the “Flight to Safety”"
  file: "Stavrakeva_Tang_JF_2026.pdf"
  desc: "This note summarizes the paper, which identifies high-frequency U.S. monetary policy surprises from one-hour changes in ED4 Eurodollar futures around FOMC (and QE) announcements, estimates local-projection impulse responses and panel interaction/event-study specifications across pre-/Great-Recession/post subsamples (and separates forward guidance vs LSAP using Swanson factors), decomposes FX and equity responses into expected-rate-path versus residual (risk-premium/inflation or dividend-growth) components, and rationalizes the Great-Recession medium-horizon sign reversal (easing ⇒ USD appreciation and equities fall, strongest against bad-hedge currencies and after minutes) with a parsimonious information-channel asset-pricing model while interpreting the core tables and figures."

- title: "Jiménez, Kuvshinov, Peydró, and Richter(JF, 2026)— Monetary Policy, Inflation, and Crises: Evidence from History and Administrative Data"
  file: "Jime_nez_Kuvshinov_Peydro__Richter_JF_2026.pdf"
  desc: "This note summarizes the paper, which shows (in a 17-country, 150+ year historical panel) that systemic banking crises are disproportionately preceded by a U-shaped policy-rate path (prolonged cuts then hikes), identifies this path dependence using crisis-window event studies and crisis-risk linear-probability models with a cuts × subsequent hikes interaction (and a trilemma-based IV), links the mechanism to “financial red zones” via local projections of post-hike reversals, and supports the channel with Spanish administrative bank–firm data on credit supply, debt costs, and loan-default responses, interpreting the core tables and figures throughout."

- title: "Blanchard, Bown, and Johnson (RES, 2026)— Global Value Chains and Trade Policy"
  file: "Blanchard_Bown_Johnson_RES_2026.pdf"
  desc: "This note summarizes the paper, which develops a value-added (GVC-as-factor-services) theory of optimal bilateral tariffs and tariff preferences—showing how domestic value added embodied in partners’ exports (DVA) and foreign value added embodied in domestic production (FVA) weaken protection—extends it to a many-country political-economy setting, tests the predictions using WIOD value-added content (1995–2015) in OLS/Tobit regressions of applied–MFN tariffs and temporary trade barrier coverage with differentiation heterogeneity, and then calibrates a quantitative Roy–Fréchet input-sourcing model to run counterfactuals such as GVC autarky and G7–China upstream decoupling while interpreting the core tables and figures."

- title: "Beck, Levine, and Levkov (JF, 2010)— Big Bad Banks? The Winners and Losers from Bank Deregulation in the United States"
  file: "Beck_Levine_Levkov_JF_2010.pdf"
  desc: "This note summarizes the paper, which exploits the staggered timing of U.S. intrastate branch deregulation as a quasi-experiment, estimates state-year DiD and event-study specifications with state/year fixed effects (and a Weibull duration test for deregulation timing), traces distributional effects via income-percentile regressions and Theil decompositions, and tests a labor-demand mechanism using relative wage/hours and unemployment dynamics, interpreting the core tables and figures on deregulation’s inequality-reducing impact."

- title: "DellaVigna and Kaplan (QJE, 2007) — The Fox News Effect: Media Bias and Voting"
  file: "DellaVigna_Kaplan_QJE_2007.pdf"
  desc: "This note summarizes the paper, which exploits the staggered 1996–2000 rollout of Fox News across local cable systems as quasi-random variation, estimates town-level difference-in-differences regressions of 2000–1996 Republican vote-share (and turnout/Senate outcomes) changes on Fox carriage with rich cable and demographic controls plus district/county fixed effects, validates identification with selection and placebo pre-trend tests and matching/robustness checks, and then combines the reduced-form voting effect with Scarborough audience “first-stage” regressions to infer persuasion rates while interpreting the core tables and figures."

- title: "Chang, Wang, and Xiong (RFS 2026) — Price and Volume Divergence in China’s Real Estate Markets: The Role of Local Governments"
  file: "Chang_Wang_Xiong_RFS_2026.pdf"
  desc: "This note summarizes the paper, which documents China’s 2020–2022 land and new-housing price–volume divergence and attributes it to local-government price management, using transaction-level and city-year panel regressions plus dynamic DID/event-study designs that interact pre-COVID (2019) fiscal exposures (land dependence and LGFV debt) with year dummies, complemented by mechanism tests on LGFV countercyclical buying and bidding, housing-permit supply restrictions, and bond-spread/developer-sales analyses, while interpreting all core tables and figures."

- title: "Klingler & Lando (RFS, 2018)— Safe Haven CDS Premiums"
  file: "Klingler_Lando_RFS_2018.pdf"
  desc: "This note summarizes the paper, which develops a one-period equilibrium model in which Basel III CVA capital relief makes dealer demand for sovereign CDS highly inelastic (despite near-zero default risk), derives closed-form equilibrium CDS premia under margin/capital constraints and summarizes regulation via a reduced-form kappa(s), and then tests the mechanism using DTCC/EBA quantity evidence and sovereign/corporate panel regressions (CDS volumes on derivatives exposures; changes in yields on changes in CDS and risk-free rates across safety buckets; and changes in CDS on credit-risk versus regulatory proxies such as CDS/IR volatility, CtD, and dealer balance-sheet measures), interpreting the core tables and figures on the safe-haven CDS premium and the CDS–bond yield disconnect."

- title: "\"Cunat, Gine, and Guadalupe (JF, 2012) — The Vote Is Cast: The Effect of Corporate"
  file: "Cunat_Gine_Guadalupe_JF_2012.pdf"
  desc: "This note summarizes the paper, which exploits close-call shareholder votes on governance proposals to implement a regression discontinuity design at the majority threshold. It combines Carhart-factor abnormal-return event studies with polynomial and dynamic (stacked) RD specifications—estimated at the meeting level—and supports identification with density/manipulation tests, covariate-balance checks, and extensive robustness and heterogeneity analyses. The note interprets the core tables and figures on the causal value of governance reforms and their longer-run effects on entrenchment (G-index), acquisitions, investment, and firm valuation."

- title: "Almeida, Ersahin, Fos, Irani, and Kronlund (RFS, 2026) — How Do Short-Term Incentives Affect Long-Term Productivity?"
  file: "Almeida_Ersahin_Fos_Irani_Kronlund_RFS_2026.pdf"
  desc: "This note summarizes the paper by linking U.S. Census plant-level manufacturing data to Compustat/CRSP/IBES, constructing a counterfactual “pre-repurchase” EPS surprise as the running variable, estimating a fuzzy regression discontinuity around the zero-surprise threshold to identify the causal effects of EPS-motivated buyback incentives on subsequent firm/plant TFP and resource allocation (investment and employment), and interpreting the core tables and figures on mechanisms via labor/financial frictions, investor horizon, CEO EPS-pay sensitivity, and adjustment costs."

- title: "Malenko & Shen (RFS, 2016) — The Role of Proxy Advisory Firms: Evidence from a Regression-Discontinuity Design"
  file: "Malenko_Shen_RFS_2016.pdf"
  desc: "This note summarizes the paper by exploiting ISS’s explicit TSR cutoff for say-on-pay votes to implement a fuzzy regression discontinuity / 2SLS design (BelowCutoff as an instrument for a negative ISS recommendation), running RD validity checks (McCrary density, covariate balance, placebo/falsification), heterogeneity and bandwidth/functional-form robustness, and interpreting the core tables and figures on the causal effect of proxy-advisor recommendations on voting support."

- title: "Pierce & Schott (AER: Insights, 2020) — Trade Liberalization and Mortality: Evidence from US Counties"
  file: "Pierce_and_Schott_AER_Insights_2020.pdf"
  desc: "This note summarizes the paper by constructing county exposure to China’s PNTR using a 1990 employment–share shift-share NTR-gap measure, estimating population-weighted county-by-year generalized DiD/event-study regressions with county and year fixed effects plus rich controls/heterogeneity/robustness checks, and interpreting the core figures on post-2000 increases in drug-overdose “deaths of despair” and related labor-market and disability mechanisms."

- title: "Chen, Chen, Kang, and Peng (JFE, 2020) — Board structure, director expertise, and advisory role of outside directors"
  file: "Chen_Chen_Kang_Peng_JFE_2020.pdf"
  desc: "This note summarizes the paper by framing PNTR as an exogenous demand shock for China expertise, presenting the DiD and IV designs for board composition (including Smoot–Hawley and non-U.S. import-penetration instruments), the event-study/OLS–2SLS tests linking China-experience directors to China-deal and appointment CARs, the director labor-market seat-growth analysis, and the residence-based monitoring–advisory trade-off, while interpreting all core tables and figures."

- title: "Lian and Ma (QJE 2025)— Anatomy of Corporate Borrowing Constraints"
  file: "Lian_Ma_QJE_2021.pdf"
  desc: "This note summarizes the paper by decomposing corporate debt into asset-based versus cash-flow-based components, estimating firm- and year-fixed-effects panel regressions linking borrowing and investment to operating earnings and covenant tightness, leveraging the SFAS 123(r) accounting change as an IV for EBITDA, testing collateral-value channels using real-estate shocks (including a Great Recession cross-section), and interpreting the core tables, figures, and macro implications for earnings-based versus collateral constraints."

- title: "Card and Krueger (AER, 1994) — Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania"
  file: "Card_Krueger_AER_1994.pdf"
  desc: "This note summarizes the paper by using the 1992 New Jersey minimum-wage increase (vs. eastern Pennsylvania) as a quasi-experiment, estimating raw and regression-adjusted DiD/first-difference models with a continuous treatment-intensity measure (the initial wage gap) plus proportional-change and robustness/placebo specifications, and interpreting the core tables and figures on employment, wages, prices, and store-entry outcomes in fast-food restaurants."

- title: "Khorrami & Mendo (WP, 2025)— Dynamic Self-Fulfilling Fire Sales"
  file: "Khorrami_and_Mendo_WP_2025.pdf"
  desc: "This note summarizes the paper by developing a continuous-time macro–finance model with hedgeable fundamental risk but unspanned sunspot shocks, characterizing fundamental versus self-fulfilling fire-sale equilibria (Brownian and Poisson) via Markov pricing ODEs, risk-balance conditions, and refinement/selection arguments, and interpreting the main and appendix figures on capital prices, endogenous volatility, wealth-share dynamics, and misallocation."

- title: "Dougal, Engelberg, Garcia, Parsons (RFS, 2012) — Journalists and the Stock Market"
  file: "Dougal_Engelberg_Garcia_Parsons_RFS_2012.pdf"
  desc: "This note summarizes the paper by leveraging the quasi-exogenous rotation of Wall Street Journal 'Abreast of the Market' columnists, estimating daily DJIA excess-return regressions with journalist indicators/fixed effects (plus interaction, falsification, and robustness specifications), validating identification with schedule-prediction LPM/IV-style tests and text-based tone/readability measures, and interpreting the core tables and figures."

- title: "Vandeweyer, Yang, Yannelis (JFE, 2026)— Discount factors and monetary policy: Evidence from dual-listed stocks"
  file: "Vandeweyer_Yang_Yannelis_JFE_2026.pdf"
  desc: "This note summarizes the paper by using dual-listed A- and H-share price ratios to difference out cash-flow news and isolate relative discount-factor changes, estimating an event-study difference-in-differences design around FOMC (Kuttner-style) monetary policy surprises with firm/announcement/event-time fixed effects, heterogeneity (triple-difference) tests and stacked-DiD robustness, and interpreting the core tables and figures."

- title: "Hong & Kacperczyk (QJE, 2010) — Competition and Bias"
  file: "Hong_Kacperczyk_QJE_2010.pdf"
  desc: "This note summarizes the paper by laying out the brokerage-house merger natural experiment, the baseline OLS and difference-in-differences designs (including benchmark-adjusted DID via matching and fixed-effects regressions), and interpreting the core tables and figures on how analyst competition shapes forecast optimism and incentives."

- title: "Sammon & Shim (JFE, 2026) — Index rebalancing and stock market composition: Do indexes time the market?"
  file: "Sammon_and_Shim_JFE_2026.pdf"
  desc: "This note distills the paper’s ownership-ratio framework for value-weighted index rebalancing and its evidence that rebalancing trades entail adverse market timing—implying a tracking-error/return trade-off and motivating delayed shares-outstanding updates in index design."

- title: "Paravisini, Rappoport, Schnabl and Wolfenzon (RES, 2014) — Dissecting the Effect of Credit Supply on Trade: Evidence from Matched Credit–Export Data"
  file: "Paravisini_Rappoport_Schnabl_Wolfenzon_RES_2014.pdf"
  desc: "This note distills the paper by summarizing the matched bank–firm credit and customs data, the shift-share IV design based on banks’ foreign-funding exposure, and the finding that negative credit-supply shocks primarily reduce exports on the intensive margin rather than through firm entry/exit."

- title: "Hennessy & Whited (JF, 2007) — How Costly Is External Financing? Evidence from a Structural Estimation"
  file: "Hennessy_Whited_JF_2007.pdf"
  desc: "This note distills a dynamic corporate finance model and its simulated method of moments (SMM) estimation to quantify the structural costs of external financing—especially equity issuance and default frictions—and interpret the main empirical results and financing-constraint proxies."

- title: "Wermers (JF, 2000) — Mutual Fund Performance: An Empirical Decomposition into Stock-Picking Talent, Style, Transactions Costs, and Expenses"
  file: "Wermers_JF_2000.pdf"
  desc: "This note file distills Russ Wermers’s 2000 mutual-fund paper into a holdings-based performance decomposition that separates stock-picking skill from style exposures, transaction costs, and expenses."

- title: "Ghosh, Vall and Zeng (JF, 2025) — FinTech Lending and Cashless Payments"
  file: "Ghosh_Vall_Zeng_JF_2025.pdf"
  desc: "This note file summarizes the paper’s core question, data and variable construction, empirical identification (OLS/within-borrower/IV), main results across figures and tables, and the accompanying screening model linking cashless payment traces to FinTech lending outcomes."

- title: "Dick-Nielsen, Feldh¨utter, and Lando (WP, 2025) — The Financial Premium"
  file: "Dick_Nielsen_Feldhu_tter_Lando_ForthcomingJF.pdf"
  desc: "This note distills the paper by showing that financial firms’ corporate bonds trade at systematically higher yield spreads than matched industrial bonds because financial intermediaries’ diversified asset portfolios load more on priced systematic risk (higher excess debt betas), a mechanism strongly supported by premium–beta evidence and extensive robustness checks."

- title: "Caramp & Silva (JF, 2026) — Monetary Policy and Wealth Effects: The Role of Risk and Heterogeneity"
  file: "Caramp_Silva_JF_2026.pdf"
  desc: "This file provides structured notes on a D-HANK/New Keynesian model in which monetary policy moves asset prices by shifting the market-implied disaster probability through belief heterogeneity and redistribution across households with different iMPCs, with the aggregate wealth effect ultimately pinned down by fiscal backing and government debt."

- title: "Carpenter, Lu and Whitelaw (JFE, 2026) — Government Bond Risk and Return in the US and China"
  file: "Carpenter_Lu_Whitelaw_JFE_2026.pdf"
  desc: "This note file distills the paper into structured study notes that (i) present the key theory and GMM estimation framework for decomposing government-bond risk premia into time-varying volatility and Sharpe ratios and (ii) interpret the main tables and figures for the US and China."

- title: "Adelino, Schoar and Severino (JFE, 2025) — Credit supply and house prices: Evidence from mortgage market segmentation"
  file: "Adelino_Schoar_Severino_JFE_2025.pdf"
  desc: "This file summarizes the paper by explaining how annual increases in the conforming loan limit—interacting with the 80% LTV rule—create a local difference-in-differences design to identify how easier, cheaper mortgage credit is capitalized into house prices."

- title: "\"Bertrand and Schoar (QJE, 2003) — The Effect of Managers on Firm"
  file: "Bertrand_Schoar_QJE_2003.pdf"
  desc: "This file shows, using manager–firm matched data and manager fixed effects, that individual executives have persistent “management styles” that systematically shape firms’ investment, financing, strategy, and performance beyond firm and year effects."

- title: "Roberts & Sufi (JF, 2009) — Control Rights and Capital Structure: An Empirical Investigation"
  file: "Roberts_Sufi_JF_2009.pdf"
  desc: "This file summarizes the paper’s mechanism, emphasizing their pooled threshold-discontinuity design around covenant violations and the central result that net debt issuance drops sharply and persistently after violations, consistent with creditor intervention."

- title: "Kilic & Tuzel (JFE, 2026) — Investing in Misallocation"
  file: "Kilic_Tuzel_JFE_2026_StudyNotes.pdf"
