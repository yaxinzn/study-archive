- title: "Dunne, Klimek, Roberts & Xu (RAND J Econ, 2013) — Entry, Exit, and the Determinants of Market Structure"
  file: "Dunne__Klimek__Roberts__and_Xu__RAND_J__Econ___2013_.pdf"
