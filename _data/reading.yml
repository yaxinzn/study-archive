- title: "Berk and van Binsbergen (JFE, 2015) - Measuring Skill in the Mutual Fund Industry"
  file: "Berk_vanBinsbergen_JFE_2015.pdf"
  desc: "This note summarizes the paper, which defines mutual-fund manager skill as dollar value added—benchmark-adjusted gross return times lagged AUM—rather than net/gross alpha, constructs feasible tradable benchmarks from Vanguard index funds (contrasted with Fama–French–Carhart factors), and tests for skill using long-horizon out-of-sample persistence and exact order-statistic inference, finding economically large positive average value added with near-zero investor net alpha and showing investors allocate more capital (higher compensation) to skilled funds while gross alpha is a poor proxy for skill."

- title: "Ferreira, Manso, and Silva (RFS, 2014) - Incentives to Innovate and the Decision to Go Public or Private"
  file: "Ferreira_Manso_Silva_RFS_2014.pdf"
  desc: "This note summarizes the paper, which develops a two-period theory of public versus private ownership in which an insider chooses between exploitation and exploration projects under liquidity shocks and asymmetric information, showing that private opacity creates a tolerance-for-failure channel (insiders can sell after bad news at pooled prices) that raises equilibrium innovation, while public transparency creates short-termism (early success is quickly priced and can be cashed out) that tilts choices toward safer conventional projects, and characterizes the ownership choice by trading off the innovation advantage of private firms against the capital-cost and liquidity advantages of public markets (with an extension where illiquid private securities weaken private ownership), interpreting the technology-tree, timing, and equilibrium-innovation figures and the paper’s testable predictions throughout."

- title: "Petersen and Rajan (JF, 2002) - Does Distance Still Matter? The Information Revolution in Small Business Lending"
  file: "Petersen_Rajan_JF_2002.pdf"
  desc: "This note summarizes the paper, which uses the 1993 (and validation with 1988) NSSBF to build a synthetic panel of U.S. small-firm lending relationships formed from 1973–1993, estimates cohort regressions of log(1+distance) to the lender and the probability of impersonal communication (phone/mail vs. in-person) on relationship-start year with rich firm/loan/lender controls and within-firm fixed effects, rejects alternative explanations such as bank consolidation, changing loan mix, deposit-market deregulation, and weaker underwriting, and links the secular rise in distance and decline in face-to-face contact to improvements in lending technology by showing regional declines in bank employees per dollar of output/loans explain most of the trend and that the credit-quality signal embedded in “predicted distance/communication” weakens over time as distant credit becomes available to a broader set of firms."

- title: "Gopinath et al. (QJE, 2017) - Capital Allocation and Productivity in South Europe"
  file: "Gopinath_KalemliOzcan_Karabarbounis_VillegasSanchez_QJE_2017.pdf"
  desc: "This note summarizes the paper, which uses ORBIS-AMADEUS data on (mostly private) Spanish manufacturing firms (1999–2012) to document a sharp rise in within-industry dispersion of MRPK but not MRPL and a decline in TFP relative to its efficient (Hsieh–Klenow) benchmark, then explains these facts with a calibrated dynamic heterogeneous-firm model featuring capital adjustment costs and a size-dependent borrowing constraint in which the euro-era fall in real interest rates channels capital toward high-net-worth firms rather than high-productivity firms, generating rising MRPK dispersion and worsening allocative efficiency while matching micro moments on leverage–size gradients and net-worth-driven capital growth and passing large-firm and nested-model robustness tests."

- title: "Xu (AER, 2018) - The Costs of Patronage: Evidence from the British Empire"
  file: "Xu_AER_2018.pdf"
  desc: "This note summarizes the paper, which digitizes British Colonial Office personnel and fiscal records (456 governors across 70 colonies, 1854–1966) and measures governor–superior social ties using predetermined ancestry/peerage/elite-school links to estimate within-governor (and within governor×colony) fixed-effects regressions that exploit Secretary-of-State turnover as shocks to connectedness, shows connected governors receive higher pay mainly via promotion to higher-salary colonies (not within-post raises) and—conditional on holding the same colony—collect about 4% less revenue (especially customs) and cut revenue-service/public-works spending, and validates patronage causality with a difference-in-differences break around the 1930 Warren Fisher Reform (appointments board) that eliminates both the promotion premium and the performance penalty."

- title: "Azmat and Ferrer (JPE, 2017) - Gender Gaps in Performance: Evidence from Young Lawyers"
  file: "Azmat_Ferrer_JPE_2017.pdf"
  desc: "This note summarizes the paper, which uses the After the JD longitudinal survey of U.S. lawyers admitted in 2000 to study direct profession-standard performance measures—annual hours billed and new client revenue in 2006—and estimates performance, earnings, and 2012 partnership regressions on a female indicator with rich demographic, firm, and ability-proxy controls plus mechanism interactions, showing large gender gaps in billed hours and especially client origination that are not explained by target billable hours or measured discrimination channels, but are strongly linked to young children (for billed hours) and partner aspirations/career concerns (for client revenue), and that these performance differences explain a substantial share of the gender gaps in annual earnings and promotion (with little gender difference in returns to performance)."

- title: "Hombert and Matray (JF, 2018) - Can Innovation Help U.S. Manufacturing Firms Escape Import Competition from China?"
  file: "Hombert_Matray_JF_2018.pdf"
  desc: "This note summarizes the paper, which asks whether ex ante innovation makes U.S. manufacturing firms more resilient to the China import shock by estimating firm×year panel regressions of sales growth, ROA, capex, and employment on lagged Chinese import penetration and its interaction with a firm’s lagged R&D capital stock, instrumenting import penetration with Chinese import growth in other high-income countries and instrumenting firm R&D with state R&D tax-credit–induced user-cost variation weighted by inventor locations (then building R&D stock via perpetual inventory), and validates a product-differentiation mechanism using Hoberg–Phillips text-based differentiation measures and triple-interaction industry tests plus PNTR and input-competition robustness."

- title: "Stein (JF, 2002) - Information Production and Capital Allocation: Decentralized versus Hierarchical Firms"
  file: "Stein_JF_2002.pdf"
  desc: "This note summarizes the paper, which builds a two-division capital-allocation model with empire-building managers and an external financing constraint to compare decentralized versus hierarchical firms, shows that with soft (nonverifiable) information hierarchy can weaken line-manager research incentives because CEOs may reallocate budgets away from informed divisions (so decentralization can deliver higher information production and sometimes higher output), but with hard (verifiable) information the result reverses because documented good news lets division managers advocate for larger internal budgets (so hierarchy both reallocates capital better and induces more research), and draws implications for flatter organizations, endogenous bureaucracy, and bank consolidation’s impact on relationship lending."

- title: "Melitz (Econometrica, 2003) - The Impact of Trade on Intra-Industry Reallocations and Aggregate Industry Productivity"
  file: "Melitz_Econometrica_2003.pdf"
  desc: "This note summarizes the paper, which extends the Krugman (1980) monopolistic-competition trade model by adding Hopenhayn-style firm heterogeneity with sunk entry, fixed operating costs, and fixed/iceberg export costs, derives domestic survival and exporter productivity cutoffs pinned down by zero-cutoff-profit and free-entry conditions with a tractable sufficient-statistic “average productivity” index, and shows that opening to trade (or further liberalization via more partners/lower trade costs/lower export fixed costs) raises the domestic cutoff, forces the least productive firms to exit, reallocates market shares toward more productive firms and exporters, and thereby increases aggregate industry productivity and welfare beyond pure variety gains."

- title: "Garmaise and Moskowitz (RFS, 2004) - Confronting Information Asymmetries: Evidence from Real Estate Markets"
  file: "Garmaise_Moskowitz_RFS_2004.pdf"
  desc: "This note summarizes the paper, which uses COMPS commercial real-estate transactions (10,351 U.S. property sales, 1996–1999) and a direct jurisdiction-level information-quality measure—the property-tax assessment coefficient of dispersion (COD) from state ratio studies—to test adverse-selection predictions by estimating regressions of buyer distance (limited participation) and property age (selective offering) on COD with rich local-heterogeneity and price-growth controls, plus logit/Klein–Spady segmentation tests showing broker sellers disproportionately trade with broker buyers when COD is high, and then runs financing and signaling regressions for vendor-to-buyer financing, bank mortgages, and cap rates that deliver weak/mixed support, concluding that markets respond to information asymmetry mainly by who trades and what gets traded rather than by financing design."

- title: "Adda, Dustmann, and Stevens (JPE, 2017) - The Career Costs of Children"
  file: "Adda_Dustmann_Stevens_JPE_2017.pdf"
  desc: "This note summarizes the paper, which combines German administrative wage/employment histories (IABS) with survey data on fertility, marriage, and savings (GSOEP/EVS) to structurally estimate (by simulated method of moments) a dynamic life-cycle model in which women choose early-career apprenticeship occupation, fertility timing, labor supply, marriage, and savings under occupation- and career-stage–dependent skill accumulation and atrophy, using regional×cohort training-position shortages as occupation-cost shifters and hundreds of wage/interruptions/fertility/savings moments to identify depreciation and preferences, and then decomposes the total career cost of children—about 35% of discounted lifetime income—into labor-supply losses versus wage losses from reduced human capital and pre-birth occupational sorting, with policy counterfactuals (birth transfers) showing large short-run timing effects but modest completed-fertility changes."

- title: "Brown, Martinsson, and Petersen (JF, 2013) - Law, Stock Markets, and Innovation"
  file: "Brown_Martinsson_Petersen_JF_2013.pdf"
  desc: "This note summarizes the paper, which uses a firm-level Rajan–Zingales interaction design on ~5,300 non-U.S. public firms in 32 countries (1990–2007) to test whether legal institutions and stock market access spur innovation by interacting a U.S.-benchmarked industry external-finance dependence measure with country-level equity-access proxies (e.g., equity issuance, IPOs/GDP, accounting standards) and contrasting them with credit-market depth, estimates OLS and 2SLS specifications with country and industry fixed effects (instrumenting equity access with legal origin, enforcement, and anti-self-dealing protection), and shows that equity access significantly raises long-run R&D intensity—especially for small and young firms—while having little effect on fixed investment, with supporting mechanism regressions linking investor protection to greater stock issuance and weaker R&D–cash-flow dependence plus downstream effects on intangible assets and productivity growth."

- title: "Goldin (AER, 2014) - A Grand Gender Convergence: Its Last Chapter"
  file: "Goldin_AER_2014.pdf"
  desc: "This note summarizes the paper, which argues that the “last chapter” of gender convergence hinges on job structure—specifically whether earnings are convex in hours and whether workers are good substitutes—by combining U.S. Census/ACS synthetic-cohort life-cycle earnings profiles, within-occupation residual gender-gap regressions, occupation-level hours elasticities and O*Net measures of time pressure/interpersonal dependence/structure, and detailed professional evidence for MBAs, lawyers, and pharmacists to show that the gender gap opens mainly after labor-market entry and is largest in occupations (business/law) with strong long-hours premia and costly temporal flexibility, but is much smaller in more substitutable/linear-pay occupations (especially pharmacy)."

- title: "Card, Cardoso, and Kline (QJE, 2016) - Bargaining, Sorting, and the Gender Wage Gap: Quantifying the Impact of Firms on the Relative Pay of Women"
  file: "Card_Cardoso_Kline_QJE_2016.pdf"
  desc: "This note summarizes the paper, which uses Portuguese matched employer–employee data (Quadros de Pessoal, 2002–2009) linked to firm financials (SABI) to estimate separate gender-specific AKM two-way fixed-effects wage models, normalizes firm effects using a low-surplus (value-added-per-worker) “zero-rent” threshold, and applies an Oaxaca-style decomposition to split the firm component of the gender wage gap into sorting (women underrepresented at high-premium firms) and bargaining/rent-sharing (women capture a smaller share of firm surplus), validating the bargaining channel by regressing firm premiums and within-firm wage changes on excess value added and showing women receive about 88–90% of men’s rent-sharing gains."

- title: "Chevalier and Ellison (JF, 1999) - Are Some Mutual Fund Managers Better than Others? Cross-Sectional Patterns in Behavior and Performance"
  file: "Chevalier_Ellison_JF_1999.pdf"
  desc: "This note summarizes the paper, which uses Morningstar fund data for single-manager U.S. growth and growth-and-income funds (1988–1994) to relate performance to observable manager characteristics (undergrad-institution SAT score, MBA, age, tenure), estimating raw excess-return regressions and then progressively more demanding risk-adjusted (market-model and Carhart four-factor) performance regressions with controls for expenses, turnover, fund size, and investment-style loadings, addressing survivorship with fund/manager survival probits and a Heckman-style correction (and instrumenting expenses/turnover with lags), and concludes that the most robust predictor of higher risk-adjusted performance is manager undergraduate-institution SAT while the MBA “outperformance” largely reflects higher beta and the youth effect is partly selection-driven."

- title: "Campbell (JF, 2006) - Household Finance"
  file: "Campbell_JF_2006.pdf"
  desc: "This note summarizes the paper, which lays out a research agenda for household finance by framing key household decisions—risky-asset participation and allocation, portfolio diversification, and mortgage choice/refinancing—as a gap between positive (what households do in SCF/HRS/brokerage/401(k) data and Swedish administrative registers) and normative (Merton-style intertemporal portfolio and mortgage models with labor income, housing, borrowing constraints, and taxes) benchmarks, documents core empirical patterns of nonparticipation, underdiversification, and refinancing failures with welfare-loss metrics and demographic gradients in sophistication, and proposes equilibrium mechanisms in retail financial markets (hidden fees and cross-subsidies from naive to sophisticated households) that can slow product innovation and motivate policy tools such as disclosure, default options, regulation, and “financial hygiene” interventions."

- title: "Peress (JF, 2014) - The Media and the Diffusion of Information in Financial Markets: Evidence from Newspaper Strikes"
  file: "Peress_JF_2014.pdf"
  desc: "This note summarizes the paper, which identifies the causal role of mass media in information diffusion by using national newspaper strikes as exogenous media blackouts (52 strikes/88 strike days across France, Greece, Italy, and Norway, 1989–2010), implements country-day event studies (Patell/Corrado tests) on turnover, intraday range, and cross-sectional return dispersion (from Compustat Global) plus size-quintile heterogeneity showing effects are concentrated in small/retail-held stocks, and distinguishes delayed news incorporation from noise reduction using return-autocorrelation regressions (weaker same-day and stronger next-day predictability on strike days), corroborated by out-of-sample local U.S. city-strike evidence on retail dollar trading."

- title: "Cookson, Fox, Gil-Bazo, Imbet, and Schiller (JFE, 2026) - Social media as a bank run catalyst"
  file: "Cookson_Fox_GilBazo_Imbet_Schiller_JFE_2026.pdf"
  desc: "This note summarizes the paper, which combines comprehensive Twitter cashtag data (2020–Mar 2023) with bank balance-sheet run-risk measures (% uninsured deposits × mark-to-market losses), intraday stock returns, and FDIC call-report deposit flows to test whether pre-existing Twitter exposure amplifies the March 2023 SVB-style run, estimating cross-sectional triple-interaction regressions showing higher pre-exposure predicts larger run-period stock losses and uninsured deposit outflows especially for high-run-risk banks, and corroborating the coordination mechanism with hourly panel regressions using lagged tweet attention and tweet-level event studies showing immediate price impacts of run/contagion/tech-community tweets, while distinguishing attention/retweet propagation from sentiment (negative sentiment does not explain differential run vulnerability)."

- title: "van Rooij, Lusardi, and Alessie (JFE, 2011) - Financial Literacy and Stock Market Participation"
  file: "vanRooij_Lusardi_Alessie_JFE_2011.pdf"
  desc: "This note summarizes the paper, which uses special 2005–2006 modules of the Dutch DNB Household Survey to construct latent basic and advanced financial literacy indices via factor analysis on randomized-wording quiz questions, estimates stock market participation (stocks/mutual funds) regressions showing advanced literacy strongly predicts participation beyond education, income, and wealth, addresses endogeneity and measurement error with a GMM-IV design that instruments advanced literacy using family-experience variables (oldest sibling’s relative financial condition and parents’ financial understanding), and conducts extensive robustness checks with peer-composition controls, alternative cognition proxies (euro/health-insurance reform difficulty), and risk-aversion controls, concluding that financial literacy acts like a reduction in information/participation costs and has an independent causal role in stock market entry."

- title: "Keys, Pope, and Pope (JFE, 2016) - Failure to Refinance"
  file: "Keys_Pope_Pope_JFE_2016.pdf"
  desc: "This note summarizes the paper, which uses a nationally representative CoreLogic loan-level panel of ~1M mortgages active in December 2010 to compute borrower-specific refinancing gains and an Agarwal–Driscoll–Laibson optimal-refinancing threshold (accounting for taxes, discounting, mobility, and option value), applies a conservative eligibility screen based on origination FICO/LTV, pristine payment history, and updated current LTV/CLTV to estimate that about 20% of borrowers who should refinance fail to do so—leaving large median monthly and present-value savings on the table—documents broad-based heterogeneity and weak links to local lender concentration, and validates the behavioral interpretation with micro evidence from a nonprofit lender’s preapproved zero-cash-upfront mail campaigns (low 13–24% take-up) and follow-up surveys consistent with inattention/procrastination/misunderstanding."

- title: "Bikhchandani, Hirshleifer, and Welch (JPE, 1992) - A Theory of Fads, Fashion, Custom, and Cultural Change as Informational Cascades"
  file: "Bikhchandani_Hirshleifer_Welch_JPE_1992.pdf"
  desc: "This note summarizes the paper, which develops a general sequential social-learning model where agents observe predecessors’ actions but not signals, proves an informational cascade almost surely starts under monotone likelihood ratio and no-long-run-ties conditions (so individuals eventually ignore private information and follow the crowd), shows cascades can be mistaken and are intrinsically fragile because later imitators stop adding information so even small public signals can overturn long-lived conformity, analyzes “fashion leader” effects when early movers have higher precision, and extends the framework to allow value changes to demonstrate fads—behavior can reverse more often than fundamentals."

- title: "Guiso, Sapienza, and Zingales (JF, 2008) - Trusting the Stock Market"
  file: "Guiso_Sapienza_Zingales_JF_2008.pdf"
  desc: "This note summarizes the paper, which models stockholding as a portfolio choice with an additional cheating-risk (mistrust) probability that lowers the effective expected return and, when combined with fixed participation costs, sharply raises the wealth threshold for entering the stock market, then tests the theory using Dutch household survey data with direct measures of generalized trust plus specially designed measures of risk aversion, ambiguity aversion, optimism, and stock-return expectations, estimating probit/Tobit/Poisson regressions for (i) direct stock and risky-asset participation, (ii) portfolio shares, and (iii) diversification (number of stocks) and insurance-demand “horse races” that distinguish trust from risk tolerance, corroborates the mechanism with Italian bank-customer data on personalized trust in one’s banker, and extends to cross-country regressions linking higher trust to greater participation and lower ownership concentration, interpreting the core calibrated thresholds, micro coefficients, and cross-country patterns throughout."

- title: "Engelberg and Parsons (JF, 2011) - The Causal Impact of Media in Financial Markets"
  file: "Engelberg_Parsons_JF_2011.pdf"
  desc: "This note summarizes the paper, which identifies the causal impact of media on retail trading by holding S&P 500 earnings announcements fixed and exploiting cross-city variation in whether a local newspaper covers the same event, estimating city×firm×date panel regressions of local trading volume (and buy/sell splits) on local coverage with rich firm and surprise controls plus increasingly saturated firm–city, firm–date, and city–date fixed effects, and validating transmission using extreme-weather delivery disruptions and day-by-day timing falsification tests (only same-day coverage predicts same-day trading), concluding that local media coverage causally raises local trading by roughly 8%–50% depending on specification."

- title: "Kirilenko, Kyle, Samadi, and Tuzun (JF, 2017) - The Flash Crash: High-Frequency Trading in an Electronic Market"
  file: "Kirilenko_Kyle_Samadi_Tuzun_JF_2017.pdf"
  desc: "This note summarizes the paper, which uses account-level CME audit-trail transactions for the June 2010 E-mini S&P 500 futures (May 3–6, 2010) to classify traders based on pre-crash inventory and volume behavior into HFTs, Market Makers, Fundamental Buyers/Sellers, Opportunistic Traders, and Small Traders, then estimates second-by-second inventory–price-change regressions and Flash-Crash interaction specifications, inventory-bound calculations, and event-time/quote-change participation designs to distinguish textbook inventory intermediation from stale-quote sniping, finding that HFTs had tightly bounded inventories and their aggressive trades systematically preceded short-horizon price moves (consistent with quote sniping/latency arbitrage) while Market Makers exhibited classic contrarian inventory dynamics and changed behavior during the crash, implying limited risk-bearing capacity and nontraditional “liquidity provision” during the Flash Crash."

- title: "Colliard, Foucault, and Lovo (RFS, 2026) - Algorithmic Pricing and Liquidity in Securities Markets"
  file: "Colliard_Foucault_Lovo_RFS_2026.pdf"
  desc: "This note summarizes the paper, which embeds Q-learning “algorithmic market makers” in a Glosten–Milgrom dealer market (and a no-adverse-selection control treatment) and uses large-scale computational experiments to show that learning dealers quickly avoid being overpriced but fail to learn to compete all the way down to the competitive price because the gains from small undercuts have low signal-to-noise while experimentation decays and rivals’ learning creates strategic uncertainty, leading to persistently supra-competitive quotes and positive realized spreads even without adverse selection, with comparative statics showing spreads widen when profit volatility rises (higher σ liquidity-shock dispersion, higher Δv payoff volatility), entry generally reduces spreads, and tick-size reductions can backfire unless exploration is rescaled—along with state-dependent asymmetries to shocks and a two-period extension where rare states are least competitive."

- title: "Brown, Ivkovic, Smith, and Weisbenner (JF, 2008) - Neighbors Matter: Causal Community Effects and Stock Market Participation"
  file: "Brown_Ivkovic_Smith_Weisbenner_JF_2008.pdf"
  desc: "This note summarizes the paper, which uses a 1987–1996 IRS taxpayer panel to measure taxable stockholding via dividend reporting, estimates a household fixed-effects IV design on native nonmovers where community (MSA) participation is instrumented by the lagged average stock ownership in the birth states of nonnative neighbors, and finds large causal community effects—roughly a 4.2pp increase in own participation for a 10pp increase in community participation—strengthened by mechanism evidence from sociability interactions and supported by rich household/community controls and state-year fixed effects that address sorting and common shocks."

- title: "Veldkamp (AER, 2006) - Media Frenzies in Markets for Financial Information"
  file: "Veldkamp_AER_2006.pdf"
  desc: "This note summarizes the paper, which builds a dynamic asset-pricing model with a competitive information market where information has high fixed cost and near-zero marginal cost so its price falls when more investors demand it (creating information-demand complementarities), generating regime switches between low-information/low-price and high-information/high-price states (“media frenzies”) and, with multiple markets and limited attention, information crowd-out that concentrates news in a subset of markets and produces excess cross-market price dispersion (“herding through the news market”), and then tests the theory in a 23-country emerging-markets weekly panel (1989–2002) by showing payoff volatility (instrumented with dividends) predicts Financial Times story counts, news predicts higher prices and price–dividend ratios (with Granger/3SLS support), and news predicts higher cross-market price dispersion"

- title: "Banerjee (QJE, 1992) - A Simple Model of Herd Behavior"
  file: "Banerjee_QJE_1992.pdf"
  desc: "This note summarizes the paper, which develops a sequential Bayesian-choice model over many alternatives where agents sometimes receive noisy private signals but later agents also observe predecessors’ discrete actions (not their signals), derives a unique equilibrium under conservative tie-breaking in which information cascades start early—agents rationally ignore their own signals once an option gains repeated visible support—so social learning can fail and the probability the population never discovers the correct option remains high, shows the inefficiency comes from a herd externality (copying destroys information for future decision makers) rather than payoff complementarities or agency, and proves that welfare can improve if some early movers are prevented from observing others’ choices (preserving informativeness)."

- title: "Kaustia and Knüpfer (JFE, 2012) - Peer Performance and Stock Market Entry"
  file: "Kaustia_Knupfer_JFE_2012.pdf"
  desc: "This note summarizes the paper, which uses Finnish Central Securities Depository population-wide trading records (1995–2002) to build a ZIP-code×month panel and measure stock market entry as first-time voluntary stock purchases, relates next-month entry rates to lagged neighborhood portfolio returns with ZIP fixed effects and province-month fixed effects, tests social-learning mechanisms through heterogeneity by local participation rates and a kinked positive-vs-negative return specification showing strong effects of positive peer returns but little response to negative returns (selective communication), and rules out alternative explanations (local stocks/wealth shocks, household cross-buying, and short-sale constraints) with extensive robustness and an IPO-entry placebo-style design."

- title: "Tetlock (RFS, 2010) - Does Public Financial News Resolve Asymmetric Information?"
  file: "Tetlock_RFS_2010.pdf"
  desc: "This note summarizes the paper, which links firm-day Dow Jones/WSJ news (1979–2007) to CRSP returns and turnover, Compustat and I/B/E/S characteristics, 13F ownership, and intraday ISSM/TAQ order flow to test a three-period microstructure model where public news reveals fundamentals and helps uninformed traders infer and absorb a persistent liquidity shock, estimating Fama–MacBeth return-predictability regressions showing news attenuates short-run reversals and generates stronger postnews continuation when turnover/message count is high, documenting a sharp event-time increase in the volume–absolute return correlation around news, and using 5-minute price-impact measures to show signed order flow moves prices less on news days (with stronger effects for small/illiquid/high-message events)."

- title: "Weller (RFS, 2018) - Does Algorithmic Trading Reduce Information Acquisition?"
  file: "Weller_RFS_2018.pdf"
  desc: "This note summarizes the paper, which uses U.S. stocks around 2012–2016 quarterly earnings announcements to measure pre-disclosure information acquisition with a stock-quarter price jump ratio (announcement-window CAR over total event-related CAR from 21 days before to 2 days after), links it to SEC MIDAS order-book–based algorithmic-trading proxies (odd-lot ratio, trade-to-order ratio, cancel-to-trade ratio, average trade size) in panel regressions with rich lagged controls and fixed effects, addresses endogeneity with an IV design that instruments algorithmic trading using lagged log share price (via the minimum tick-size “fine price grid” mechanism), and corroborates causality with day-by-day response-ratio timing evidence plus alternative information measures (event-period nonsynchronicity and intraperiod timeliness portfolios) and broader RavenPack event categories, finding that higher algorithmic trading causally reduces pre-announcement information acquisition by roughly 9–13% per standard deviation and the gap widens throughout the month before disclosure."

- title: "Allen, Morris, and Shin (RFS, 2006) - Beauty Contests and Iterated Expectations in Asset Markets"
  file: "Allen_Morris_Shin_RFS_2006.pdf"
  desc: "This note summarizes the paper, which embeds Keynes's beauty-contest logic in a fully rational dynamic noisy rational-expectations model with short-lived CARA traders, private signals, public priors, and noisy supply, shows that average expectations fail the law of iterated expectations so equilibrium prices become iterated averages plus a risk/supply term, implying a systematic higher-order wedge where prices overweight public information, underreact and drift toward fundamentals, and can lie farther from fundamentals than the market's average expectation, with a Markov-chain representation of iterated beliefs and robustness to longer-lived traders."

- title: "Braun, Dorau, Jenkinson, and Urban (JF, 2026) - Size, Returns, and Value: Do Private Equity Firms Allocate Capital According to Manager Skill?"
  file: "Braun_Dorau_Jenkinson_Urban_JF_2026.pdf"
  desc: "This note summarizes the paper, which uses proprietary buyout deal-level cash-flow data from three large LPs (940 funds, 12,910 deals) linked to hand-collected individual manager attribution and career outcomes to argue that NPV (discounted value added) is the right skill metric when PE scales, estimates fund- and manager-level persistence regressions showing PME persistence fades over time while NPV persistence strengthens as successful managers are scaled up into larger deals with lower relative returns, decomposes manager performance into “skill” and “scalability” components, and tests PE internal labor-market capital allocation by linking managers’ NPV track records to subsequent deal size, partner promotion, and industry exit, finally quantifying that a large share (~40%, often 33–45%) of PE NPV is associated with the organization’s capital reallocation decisions rather than deal-maker fixed effects."

- title: "Zhong and Zhou (RFS, 2026) - Dynamic Coordination and Bankruptcy Regulations"
  file: "Zhong_Zhou_RFS_2026.pdf"
  desc: "This note summarizes the paper, which models distressed firms with staggered debt and asynchronous creditor learning as a dynamic clock game where creditors choose an exit time (waiting τ) trading off interest income against the hazard of being caught by bankruptcy, derives a sharp decomposition of equilibrium patience into a recovery-rate channel (value preserved for late creditors) and a hazard-rate channel (probability bankruptcy arrives before one exits), shows that committing to earlier bankruptcy filing/automatic stay can delay runs by improving expected recovery, proves a welfare-maximizing regulator intervenes earlier than the firm, and introduces avoidable-preference clawback as a more powerful policy tool with a closed-form optimal clawback window that shifts the pivotal creditor without shutting down production as early, with extensions showing seniority can have nonmonotonic effects on coordination."

- title: "Agarwal, Lucca, Seru, and Trebbi (QJE, 2014) - Inconsistent Regulators: Evidence from Banking"
  file: "Agarwal_Lucca_Seru_Trebbi_QJE_2014.pdf"
  desc: "This note summarizes the paper, which exploits legally mandated alternate examination policies that rotate eligible U.S. state-chartered banks between state and federal supervisors to identify within-bank differences in supervisory toughness, estimates exam-frequency fixed-effects regressions showing federal regulators assign systematically worse CAMELS ratings (with downgrades concentrated in federal spells and offsetting upgrades in state spells), links federal oversight to bank behavioral responses in quarterly panels (higher capital ratios, lower ROA, higher expenses, and worse measured asset quality without a significant loan-growth contraction), and uses cross-state heterogeneity, predictive-distress tests, and regulator-resource/local-economy interactions to argue that supervisory inconsistency is economically costly and driven mainly by local interests and state capacity rather than capture."

- title: "Holmström and Tirole (QJE, 1997) - Financial Intermediation, Loanable Funds, and the Real Sector"
  file: "Holmstrom_Tirole_QJE_1997.pdf"
  desc: "This note summarizes the paper, which builds a two-period moral-hazard model where firm collateral (net worth K_f) and intermediary “informed capital” (net worth K_m) are distinct scarce resources because monitoring relaxes borrower incentives only if monitors themselves have skin in the game, derives financing cutoffs that sort firms into no finance / monitored (mixed) finance / direct market finance and equilibrium prices for uninformed funds (γ) and informed capital (β), and uses comparative statics to show that credit crunches (K_m ↓ ), collateral squeezes (K_f ↓ ), and savings squeezes (inward S(γ)) all reduce investment and ration out the least-capitalized firms first but imply different movements in γ, β, and solvency ratios—providing a unified framework for the balance-sheet versus lending channels and the procyclicality of capital adequacy."

- title: "Drechsler, Savov, Schnabl, and Wang (JF, 2026) - Deposit Franchise Runs"
  file: "Drechsler_Savov_Schnabl_Wang_JF_2026.pdf"
  desc: "This note summarizes the paper, which develops a bank-valuation model where the deposit franchise (low-beta deposits priced below market) is a negative-duration asset that can offset long-duration asset losses when rates rise, but whose uninsured component is runnable and can vanish in a self-fulfilling “deposit-franchise run” even if bank assets are fully liquid; it derives run/no-run and hedging-dilemma conditions showing vulnerability scales with low-beta uninsured deposits and motivates a capital requirement proportional to the potential loss of the uninsured franchise, then empirically implements the framework using U.S. call reports (2015–2024) to estimate mark-to-market asset losses, insured vs uninsured deposit betas, and deposit operating costs and to compute bank values with and without runs—finding most banks were cushioned by insured franchise value in 2022–2023 while run exposure was concentrated in outliers like SVB/Signature/First Republic."

- title: "Martin, Puri, and Ufier (JF, 2026) - Deposit Inflows and Outflows in Failing Banks: The Role of Deposit Insurance"
  file: "Martin_Puri_Ufier_JF_2026.pdf"
  desc: "This note summarizes the paper, which uses uniquely granular daily account-level FDIC data from a failed U.S. bank to separately measure gross uninsured outflows and gross insured inflows across placebo, precrisis, postcrisis, and formal-enforcement-action periods, estimates account-level liquidation regressions to show uninsured and brokered deposits run while checking/direct-deposit/older and TAG/DFA-covered accounts are stickier, documents that the bank offset fleeing deposits by attracting large amounts of new insured institutional term deposits (often structured just below the insurance limit via listing services) using daily inflow regressions and rate-spread elasticities, and generalizes the compositional substitution with bank–quarter panels for all U.S. banks under regulatory action plus RateWatch evidence that stressed (including large) banks raise CD rates to pull in insured funding."

- title: "Leland and Pyle (JF, 1977) - Informational Asymmetries, Financial Structure, and Financial Intermediation"
  file: "Leland_Pyle_JF_1977.pdf"
  desc: "This note summarizes the paper, which develops a competitive capital-market signaling model where entrepreneurs privately know project quality and credibly reveal it by retaining equity (a costly “skin-in-the-game” signal), proves that with normal asset demand the equilibrium valuation schedule is strictly increasing in insider retention and that competition selects the least-cost separating schedule, shows signaling distorts portfolio holdings (entrepreneurs overretain relative to full information) but leaves project selection efficient, derives capital-structure implications (riskier projects use less debt and value–debt correlations can arise without taxes or bankruptcy costs), and offers a conceptual foundation for financial intermediation as informed institutions that hold assets and signal information quality through insider capital at risk and leverage."

- title: "Cetemen, Cisternas, Kolb, and Viswanathan (JF, 2026) - Leader-Follower Dynamics in Shareholder Activism"
  file: "Cetemen_Cisternas_Kolb_Viswanathan_JF_2026.pdf"
  desc: "This note summarizes the paper, which builds a Kyle-style sequential-trading model of two activist blockholders whose terminal ownership endogenously determines firm value via costly activism effort, shows that the leader strategically uses first-period order flow to manipulate the wedge between the follower’s inference and the market maker’s price-setting—making leader trades predictable on average with the sign flipping with the correlation of activists’ initial blocks (sell when positively correlated, buy when negatively correlated) while the follower’s trade remains conditionally mean zero—derives implications for free riding, abnormal prices, and the value of leading versus following (including multiple-follower “wolf-pack” amplification and liquidity comparative statics), and illustrates the mechanisms."

- title: "Mian, Rao, and Sufi (QJE, 2013) - Household Balance Sheets, Consumption, and the Economic Slump"
  file: "Mian_Rao_Sufi_QJE_2013.pdf"
  desc: "This note summarizes the paper, which develops a tractable ordered-search model where heterogeneous products (quality q_i , search appeal Δ_i , market potential 1−γ_i ) generate two position externalities—business stealing from above and price-disciplining search appeal from below—implies a simple equilibrium pricing recursion p_i =q_i −∑_(j>i) Δ_j and demand D_i =(1−γ_i )∏_(j<i) γj for any directed order, derives closed-form ranking indices for the search order that maximizes total industry profit versus consumer surplus (often conflicting), and then embeds the endogenous position values into a GSP position auction to show that auction outcomes are biased toward the joint-profit ranking when heterogeneity is mainly in quality/markups but toward the consumer-surplus ranking when heterogeneity is mainly in market potential/conversion."

- title: "Li and Yu (JF, 2026) - Investor Composition and the Liquidity Component in the U.S. Corporate Bond Market"
  file: "Li_Yu_JF_2026.pdf"
  desc: "This note summarizes the paper, which combines TRACE bid-ask spreads and credit spreads with Lipper eMaxx holdings (2005Q2–2019Q2) to document a sharp rise in the cross-sectional loading of credit spreads on bid-ask spreads and the implied liquidity share of spreads, constructs a bond-level investor-composition measure based on holders’ persistent net trading to proxy for short-term liquidity-shock frequency, identifies the causal effect of short-term investors using a discontinuity at the 10-year maturity cutoff created by intermediate-term bond fund mandates (instrumenting investor composition and its interaction with bid-ask spreads), and rationalizes the trend in a search-theoretic OTC model with heterogeneous investors and bonds where falling risk-free rates induce entry of short-term mutual-fund/ETF investors that raise trading frequency and amplify the capitalization of transaction costs and trade-delay (seller–buyer ratio) into yields."

- title: "Aizawa, Mommaerts, and Rennane (Econometrica, 2026) - Firm Accommodation After Workplace Disability: Labor Market Impacts and Implications for Subsidy Design"
  file: "Aizawa_Mommaerts_Rennane_Econometrica_2026.pdf"
  desc: "This note summarizes the paper, which combines TRACE bid-ask spreads and credit spreads with Lipper eMaxx holdings (2005Q2–2019Q2) to document a sharp rise in the cross-sectional loading of credit spreads on bid-ask spreads and the implied liquidity share of spreads, constructs a bond-level investor-composition measure based on holders’ persistent net trading to proxy for short-term liquidity-shock frequency, identifies the causal effect of short-term investors using a discontinuity at the 10-year maturity cutoff created by intermediate-term bond fund mandates (instrumenting investor composition and its interaction with bid-ask spreads), and rationalizes the trend in a search-theoretic OTC model with heterogeneous investors and bonds where falling risk-free rates induce entry of short-term mutual-fund/ETF investors that raise trading frequency and amplify the capitalization of transaction costs and trade-delay (seller–buyer ratio) into yields."

- title: "Lin and Vella (JPE, 2026) - Endogenous Treatment Models with Social Interactions: An Application to the Impact of Exercise on Self-Esteem"
  file: "Lin_Vella_JPE_2026.pdf"
  desc: "This note summarizes the paper, which develops an endogenous-treatment framework with social interactions in both the treatment and outcome equations by modeling exercise choice and self-esteem as two linked incomplete-information Bayesian games, represents equilibrium in conditional choice probabilities and estimates it with a computationally tractable nested pseudo joint likelihood (NPJL) fixed-point algorithm, defines both partial (holding peers fixed) and composite (general-equilibrium network) treatment effects, and applies the method to Add Health friendship networks (9,036 U.S. adolescents) to estimate positive peer effects in exercise and a large positive causal effect of exercise on self-esteem (with outcome peer effects concentrated in the low-self-esteem tail) and to run targeted-intervention counterfactuals showing sizable spillovers when treating popular or poor students."

- title: "Guerrieri and Lorenzoni (QJE, 2017) - Credit Crises, Precautionary Savings, and the Liquidity Trap"
  file: "Guerrieri_Lorenzoni_QJE_2017.pdf"
  desc: "This note summarizes the paper, which builds a quantitative heterogeneous-agent incomplete-markets (Bewley–Aiyagari) model where a tightening of household borrowing limits triggers both borrower deleveraging and lender precautionary saving, forcing the natural real interest rate to overshoot downward because the initial wealth distribution has too much mass near the borrowing constraint, decomposes the resulting recession into a large partial-equilibrium consumption drop that is partly offset by the endogenous interest-rate decline, shows a strong labor-supply composition effect (hours can rise while output falls), and then introduces nominal wage rigidity with a zero lower bound to generate a larger contraction and slower deleveraging, with extensions for debt-financed transfers, debt deflation, and durables/collateralized borrowing that produce especially large durable-spending collapses under spread shocks."

- title: "Bergemann and Välimäki (JPE, 2006) - Dynamic Pricing of New Experience Goods"
  file: "Bergemann_Valimaki_JPE_2006.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time monopoly model of an experience good where consumers learn their own match value only through consumption (Poisson learning) so the state is the fraction informed a(t), derives a sharp mass-market vs. niche-market classification based on whether an uninformed buyer’s willingness to pay at the static monopoly benchmark w^ exceeds the static monopoly price p^ , characterizes Markov-perfect equilibrium pricing paths with either skimming (high initial prices that decline toward p^ ) or penetration (low introductory prices that build an informed base and then jump up to p^ at a stopping point), and studies welfare and policy comparisons showing competition is efficient under purely idiosyncratic learning but monopoly can dominate under social-learning externalities, interpreting the key propositions and price-path figures throughout."

- title: "Jehiel and Weber (RES, 2026) - Endogenous Clustering and Analogy-Based Expectation Equilibrium"
  file: "Jehiel_Weber_RES_2026.pdf"
  desc: "This note summarizes the paper, which endogenizes analogy partitions in Analogy-Based Expectation Equilibrium by requiring that players with a memory bound K_i choose coarse categories to minimize prediction error about opponents’ behavior (via prototype/K-means-style local or global clustering under squared-Euclidean or KL divergence), shows that the resulting fixed point between clustering and play may fail to exist in pure strategies (matching-pennies example) and therefore introduces Clustered Distributional ABEE (mixing over partitions) with general existence, and characterizes how strategic complements generate self-attractive partitions and multiplicity while strategic substitutes generate self-repelling partitions and equilibrium heterogeneity/polarization, illustrating the mechanisms in beauty-contest, monitoring, and linear-best-reply applications and interpreting the key propositions and figures throughout."

- title: "Schenone (RFS, 2010) - Lending Relationships and Information Rents: Do Banks Exploit Their Information Advantages?"
  file: "Schenone_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses U.S. Dealscan syndicated loans matched to SDC IPO firms (1998–2003) to treat the IPO as an information-releasing shock, constructs a novel relationship-intensity (lock-in) measure based on the share of a firm’s past loans led by the current lead lender, and estimates firm fixed-effects loan-spread regressions separately before and after the IPO (and in a unified before/after interaction specification) showing a pre-IPO U-shaped spread–intensity pattern consistent with information-rent extraction at high dependence but a post-IPO monotone declining pattern consistent with pure relationship cost reductions once disclosure levels the playing field, ruling out risk-sharing and loan–underwriting bundling explanations with syndicate-structure and IPO-underwriter interaction tests."

- title: "Chen, Gentry, Li, and Lu (RES, 2026) - Identification and Inference in First-Price Auctions with Risk-Averse Bidders and Selective Entry"
  file: "Chen_Gentry_Li_Lu_RES_2026.pdf"
  desc: "This note summarizes the paper, which studies first-price auctions with risk-averse bidders and selective entry, derives an equilibrium inverse-bidding representation in quantile form where bids and observed entry thresholds identify objects b_k (α∣z) and R_k (α∣z) and candidate latent value quantiles v_k (α∣z) must satisfy a sharp set of cross-environment restrictions (M, O, I, D, S) that characterize the identified set for utility and the value–signal structure, highlights a key boundary-condition discontinuity between full-entry and partial-entry cases (lowest type bids value vs. reserve), shows risk neutrality is nonparametrically testable and that variation in both N and an entry-cost shifter z identifies risk aversion up to a bounded constant (with point identification under CRRA/CARA), and develops robust likelihood-ratio inference and fast MPEC/Chebyshev-collocation computation for set-identified models with parameter-dependent bid support."

- title: "Diamond and Rajan (JPE, 2001) - Liquidity Risk, Liquidity Creation, and Financial Fragility: A Theory of Banking"
  file: "Diamond_Rajan_JPE_2001.pdf"
  desc: "This note summarizes the paper, which builds a three-date theory of relationship lending where loans are intrinsically illiquid because relationship-specific collection skills cannot be credibly pledged to outsiders, introduces an interim (privately observed) banker liquidity shock that makes direct lending require an illiquidity premium or liquidation, and shows that financing these illiquid loans with fragile demand deposits creates liquidity by serving as a commitment device—any attempt to underpay depositors triggers a run that strips the banker of rents—thereby allowing the bank to borrow against the loan’s full collectible value, while interpreting the bargaining-tree figures, timeline table, and run-logic diagram and drawing policy implications for narrow banking, capital, and deposit insurance."

- title: "Drechsler, Savov, and Schnabl (QJE, 2017) - The Deposits Channel of Monetary Policy"
  file: "Drechsler_Savov_Schnabl_QJE_2017.pdf"
  desc: "This note summarizes the paper, which develops a model where monetary tightening raises banks’ deposit-market power by making deposits less substitutable with cash, predicts higher deposit spreads and deposit outflows that contract lending, and tests the “deposits channel” using U.S. branch-level deposit-rate data (RateWatch) and deposit quantities (FDIC) with within-bank designs that interact Fed funds changes with local deposit-market concentration (county HHI), complemented by event-time and expected-vs-unexpected rate-change evidence, then traces transmission to bank- and county-level small-business lending and real activity with bank-HHI and spread-beta sufficient-statistic regressions, showing the mechanism also comoves tightly with the T-bill liquidity premium."

- title: "Krishnamurthy and Vissing-Jorgensen (JPE, 2012) - The Aggregate Demand for Treasury Debt"
  file: "Krishnamurthy_VissingJorgensen_JPE_2012.pdf"
  desc: "This note summarizes the paper, which models Treasuries as convenience assets (money-like claims providing liquidity and safety services) so their yields embed a convenience yield that is decreasing in the market value of publicly held Treasury debt relative to GDP, estimates long- and short-maturity spread regressions in a long U.S. annual sample linking corporate–Treasury and deposit–bill spreads to log(debt/GDP) with rich default-risk and risk-premium controls, uses IV (powers of total debt/GDP) for maturity-specific Treasury supply to address endogenous maturity choice, and exploits asset-pair designs (Baa–Aaa and P2–P1 for safety; insured CD–bill and deposits–bill for liquidity) plus a piecewise-linear specification to quantify the level of the convenience yield (≈73 bps on long Treasuries, with at most 46 bps liquidity and at least 27 bps safety)."

- title: "Baron and Xiong (QJE, 2017) - Credit Expansion and Neglected Crash Risk"
  file: "Baron_Xiong_QJE_2017.pdf"
  desc: "This note summarizes the paper, which uses a long international panel of 20 advanced economies (1920–2012) to measure bank credit booms via the annualized three-year change in bank credit-to-GDP and tests whether bank equity investors price the associated tail risk by estimating probit regressions for future bank-equity crash probabilities, panel return-predictability regressions for nonoverlapping 1–3 year ahead excess returns, threshold regressions for extreme booms/busts, and interaction/quantile specifications that separate “credit-boom sentiment” from dividend-yield sentiment—finding credit expansion predicts higher crash risk but lower subsequent bank equity returns (especially in low-dividend-yield states), consistent with neglected crash risk."

- title: "Sweeting, Roberts, and Gedge (JPE, 2020) - A Model of Dynamic Limit Pricing with an Application to the Airline Industry"
  file: "Sweeting_Roberts_Gedge_JPE_2020.pdf"
  desc: "This note summarizes the paper, which develops a dynamic asymmetric-information limit-pricing model with persistent incumbent marginal costs and a D1-refined unique separating MPBE, then tests its key empirical signature—nonmonotonic (U-shaped) preentry price cuts that are largest at intermediate Southwest entry probabilities—using U.S. airline route data (DB1 + T100) and a first-stage predicted-entry-probability measure, rules out capacity/load-factor/airport-improvement and loyalty alternatives with parallel regressions on capacity, passengers, and load factors, and calibrates a nested-logit demand system, Markov cost process, and entry-cost distribution (via entry hazards) to match out-of-sample phase-2 price declines and quantify welfare and entry-subsidy counterfactuals."

- title: "Aguirregabiria and Magesan (RES, 2020) - Identification and Estimation of Dynamic Games When Players’ Beliefs Are Not in Equilibrium"
  file: "Aguirregabiria_Magesan_RES_2020.pdf"
  desc: "This note summarizes the paper, which develops identification and estimation for dynamic discrete games when players are rational but may hold non-equilibrium (biased) beliefs about rivals, shows how a payoff exclusion restriction yields (i) a likelihood-ratio test of equilibrium/unbiased beliefs and (ii) point identification of contemporaneous beliefs and payoff differences when beliefs are known only on an “anchor” subset of states (partially unbiased beliefs), proposes a constructive nonparametric two-step estimator with a parametric pseudo-likelihood extension, and applies the method to McDonalds–Burger King store-location choices across 422 UK districts (1991–1995) to reject unbiased beliefs for Burger King but not McDonalds and to show imposing equilibrium beliefs can severely attenuate estimated competition effects."

- title: "Kiyotaki and Moore (JPE, 1997) - Credit Cycles"
  file: "Kiyotaki_Moore_JPE_1997.pdf"
  desc: "This note summarizes the paper, which builds a dynamic general-equilibrium credit-cycle model where a durable asset (land) is both an input and collateral so borrowing limits depend on its market price, derives a powerful intertemporal (dynamic) collateral-price multiplier in which shocks to constrained borrowers’ net worth reduce land demand and land prices which further tighten borrowing capacity and propagate shocks, extends the framework by adding uncollateralizable capital (trees) and lumpy investment opportunities to generate hump-shaped responses and damped cycles and by adding a second sector to show spillovers through a shared collateral market, and interprets the key figures on the mechanism, steady-state misallocation, and simulated dynamics throughout."

- title: "Crawford, Pavanini, and Schivardi (AER, 2018) - Asymmetric Information and Imperfect Competition in Lending Markets"
  file: "Crawford_Pavanini_Schivardi_AER_2018.pdf"
  desc: "This note summarizes the paper, which builds and estimates a structural model of Italian small-business lending that jointly captures firms’ bank choice (mixed-logit demand), loan utilization, default, and Bertrand-Nash bank pricing, identifies adverse selection through correlated unobservables linking demand and utilization to default and moral hazard through the direct price–default effect, overcomes missing counterfactual prices by predicting unchosen-bank rates using firm fixed effects (validated by showing pricing residuals no longer predict default) and instruments bank demand with deposit-market shifters, and then runs counterfactuals (more adverse selection, higher marginal costs, and mergers) to show market power mitigates the price and default responses to selection and funding shocks—so competition and asymmetric information interact nonlinearly."

- title: "Gu, Peng, and Zhang (RFS, 2024) - The Gender Gap in Household Bargaining Power: A Revealed-Preference Approach"
  file: "Gu_Peng_Zhang_RFS_2024.pdf"
  desc: "This note summarizes the paper, which develops a revealed-preference structural household-portfolio model where the household’s effective risk aversion is a bargaining-weighted aggregation of spouses’ latent risk aversions, estimates participation costs and risky-asset demand using both the extensive and intensive margins in Australian HILDA panel data (2006/2010/2014/2018) with measurement error and household heterogeneity, recovers spousal bargaining weights via a logistic bargaining equation that loads on spousal differences (earnings, employment, cognition, etc.) and “financial head” types, decomposes the resulting gender gap into observables versus a residual gender/norm component, and validates the pattern with norm interactions and replications in Germany (GSOEP) and the U.S. (HRS), interpreting the core tables and figures on a persistent ≈60–40 husband–wife bargaining split and its determinants."

- title: "Rajan and Zingales (AER, 1998) - Financial Dependence and Growth"
  file: "Rajan_Zingales_AER_1998.pdf"
  desc: "This note summarizes the paper, which introduces the canonical difference-in-differences interaction design for finance and growth by combining an industry–country panel of manufacturing growth (1980–1990) with a U.S.-based industry measure of external finance dependence, estimating regressions with industry and country fixed effects where the key coefficient is Dependence(j) ×FinancialDevelopment(k) (and instrumenting disclosure/accounting standards with legal origin and legal-system quality), and then decomposes outcomes into growth in the number of establishments versus average establishment size and runs extensive robustness and channel tests (cash-flow vs investment-intensity interactions, reverse-causality and omitted-variable checks) to show financially dependent industries grow disproportionately faster in financially developed countries, especially through new establishment creation."

- title: "Holmes (Econometrica, 2011) - The Diffusion of Wal-Mart and Economies of Density"
  file: "Holmes_Econometrica_2011.pdf"
  desc: "This note summarizes the paper, which estimates a store-level demand model from Wal-Mart’s 2005 store sales to quantify local cannibalization, embeds it in a dynamic store-location problem with distribution-center distances and population-density-dependent fixed costs, and then uses a revealed-preference moment-inequality approach based on pairwise “resequencing” deviations in Wal-Mart’s observed 1962–2005 rollout (plus instrumented interaction moments and a distribution-center-opening cross-check) to partially identify and tightly bound the magnitude of economies of density in distribution costs—showing Wal-Mart’s contiguous expansion is rationalized by large per-mile logistics savings that outweigh cannibalization."

- title: "Jiménez, Ongena, Peydró, and Saurina (AER, 2012) - Credit Supply and Monetary Policy: Identifying the Bank Balance-Sheet Channel with Loan Applications"
  file: "Jimenez_Ongena_Peydro_Saurina_AER_2012.pdf"
  desc: "This note summarizes the paper, which uses Spain’s credit-register microdata on loan applications (information requests) matched to subsequent loan granting, combines time variation in monetary policy (3-month interbank rate changes) and macro conditions (GDP growth) with cross-bank balance-sheet heterogeneity (capital and liquidity), and estimates linear-probability loan-granting regressions with increasingly demanding firm FE, firm-month FE, and loan FE designs to identify a bank balance-sheet lending channel (weak banks cut approvals more when rates rise or growth falls), then tests real constraint relevance with substitution regressions after rejections and relationship-heterogeneity interactions showing multiple bank relationships mitigate but do not eliminate the credit crunch."

- title: "Petersen and Rajan (QJE, 1995) - The Effect of Credit Market Competition on Lending Relationships"
  file: "Petersen_Rajan_QJE_1995.pdf"
  desc: "This note summarizes the paper, which develops a relationship-lending model where banks with greater local market power can backload repayments and intertemporally smooth loan pricing—subsidizing young/opaque firms early and recouping rents later once types are revealed—so competition can reduce credit availability for risky startups, and tests the predictions in NSSBF small-firm survey data by measuring local credit-market competition with county/MSA deposit Herfindahls, estimating Tobit regressions of trade-credit discount taking as a rationing proxy, credit-availability regressions for institutional borrowing over the firm life cycle, and loan-rate regressions that allow the age slope to differ by market structure, showing that concentrated markets finance more young firms and offer lower initial rates but much flatter age–rate declines (a life-cycle crossover)."

- title: "Grossman and Hart (Econometrica, 1983) - An Analysis of the Principal-Agent Problem"
  file: "Grossman_Hart_Econometrica_1983.pdf"
  desc: "This note summarizes the paper, which provides a rigorous global solution to the moral-hazard principal–agent problem by transforming outcome-contingent payments through the agent’s utility vi =V(Ii ) so that implementing any target action becomes a convex programming problem with linear (global) incentive and participation constraints, establishes existence and the wedge between first-best and second-best implementation costs, characterizes when optimal contracts are monotone/progressive/regressive (showing MLRC alone is insufficient once multiple deviations can bind), derives sharp linear-sharing results and a constructive algorithm in the two-outcome case, and delivers comparative statics showing that Blackwell garblings (worse information) and higher risk aversion make incentives more costly."

- title: "Bhamra and Uppal (AER, 2019) - Does Household Finance Matter? Small Financial Errors with Large Social Costs"
  file: "Bhamra_Uppal_AER_2019.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time production-economy model with many risky firms and Epstein–Zin households who exhibit familiarity bias (modeled as ambiguity that tilts portfolios toward familiar assets), calibrates the degree of underdiversification and risky shares to household data (e.g., Swedish portfolio volatilities and the equity premium), and then quantifies welfare in three layers—static mean–variance, dynamic consumption–savings responses, and general-equilibrium growth feedback—showing that seemingly small diversification mistakes (≈1%/year in static terms) can generate much larger private and social welfare losses once they reduce households’ optimal risky share, distort intertemporal consumption, and alter aggregate saving and growth, with comparative statics in impatience and EIS and robustness to preference heterogeneity."

- title: "Ke (JF, 2021) - Who Wears the Pants? Gender Identity Norms and Intrahousehold Financial Decision-Making"
  file: "Ke_JF_2021.pdf"
  desc: "This note summarizes the paper, which uses large U.S. household surveys (CPS-ASEC, Census/ACS, and HRS) to estimate participation regressions comparing households where only the wife versus only the husband works in finance (with rich spouse-by-spouse controls, bank-manager subsamples, and within-household “career switcher” tests), shows the husband-in-finance effect on stock market participation is systematically larger, links the gap to gender-norm proxies (working-mother exposure, plough ancestry, Southern culture, religiosity, and reported household authority), and provides causal mechanism evidence with a randomized ESPP experiment that primes gender identity and finds female identity salience reduces women’s willingness to contribute correct financial advice while male identity salience does not reduce men’s willingness to accept it, interpreting the results as intrahousehold authority frictions driven by gender identity norms."

- title: "Giroud and Mueller (QJE, 2017) - Firm Leverage, Consumer Demand, and Employment Losses During the Great Recession"
  file: "Giroud_Mueller_QJE_2017.pdf"
  desc: "This note summarizes the paper, which matches U.S. Census LBD establishment employment (2007–2009) to parent-firm Compustat leverage measured pre-crisis (2006) and local Zillow house-price changes to estimate establishment-level employment regressions with rich zip/industry/firm fixed effects that interact local demand shocks with firm leverage, shows the amplification effect is concentrated in nontradable (local-demand) sectors and absent in tradables (placebo), validates the financial-constraint channel with firm-level financing, investment, and establishment-closure responses, strengthens identification by instrumenting house-price changes with Saiz (2010) housing-supply elasticity, and shows the mechanism survives aggregation in county-level employment regressions."

- title: "Takahashi (AER, 2015) - Estimating a War of Attrition: The Case of the US Movie Theater Industry"
  file: "Takahashi_AER_2015.pdf"
  desc: "This note summarizes the paper, which develops and estimates a continuous-time oligopoly war-of-attrition exit model with private exit values in a declining industry, uses U.S. county-level movie-theater panel data (Film Daily Yearbooks, 1949–1959) and cross-county variation in television diffusion to identify the demand-decay path, disciplines initial conditions with an auxiliary pre-1949 entry model, and estimates the structural parameters by indirect inference to decompose slow consolidation into an oligopoly-competition component versus an additional strategic-waiting component under asymmetric information—finding sizable overall exit delay but that most comes from noncooperative oligopoly rather than private-information-driven delay."

- title: "Ericson and Pakes (RES, 1995) - Markov-Perfect Industry Dynamics: A Framework for Empirical Work"
  file: "Ericson_Pakes_RES_1995.pdf"
  desc: "This note summarizes the paper, which introduces the Ericson–Pakes dynamic industry framework where heterogeneous firms invest to improve a firm-specific “success” state under idiosyncratic innovation shocks while entry and exit are endogenous and strategic interaction operates through the cross-sectional distribution of firms across states, proves existence of a rational-expectations Markov-perfect equilibrium with finite entry/compact effective state space and an ergodic invariant distribution over industry structures (so industries exhibit persistent churn rather than converging to a fixed structure), and illustrates the framework in a homogeneous-product Cournot example comparing decentralized MPE to collusion and a planner to show how competition shapes investment, turnover, prices, and welfare, interpreting the key state-space and investment-surface figures throughout.."

- title: "Notes: Aguirregabiria (RES, 1999) - The Dynamics of Markups and Inventories in Retailing Firms"
  file: "Aguirregabiria_RES_1999.pdf"
  desc: "This note summarizes the paper, which builds and structurally estimates a dynamic retail model in which a supermarket chain jointly chooses prices (with asymmetric menu costs) and order quantities (with fixed ordering costs) under stockout risk so inventories and markups become strategic substitutes, uses monthly brand-level data for 534 products from a Spanish supermarket chain (1990–1992) to document cyclical markups that fall after replenishment and rise between orders, estimates the model with a Hotz–Miller-style two-stage sequential discrete-choice/GMM procedure that combines nonparametric CCPs, model-implied exclusion restrictions, and selection-corrected profit components, and runs counterfactual simulations showing that large fixed ordering costs explain roughly half of observed sales promotions and markup variability while menu-cost asymmetry plays a secondary role."

- title: "Doraszelski, Lewis, and Pakes (AER, 2018) - Just Starting Out: Learning and Equilibrium in a New Market"
  file: "Doraszelski_Lewis_Pakes_AER_2018.pdf"
  desc: "This note summarizes the paper, which studies the UK electricity frequency-response market after its 2005 deregulation as a laboratory for out-of-equilibrium behavior, estimates a logit demand system with an eligibility (zero-share) model using quasi-differencing to handle persistent unobserved demand shocks, recovers marginal costs using a “weak rationality” moment that firms’ first-order-condition mistakes average to zero in the late-phase rest point (rather than assuming Nash equilibrium throughout), and then compares predicted bid paths from complete-information Nash to learning models that combine fictitious play about rivals with adaptive learning about demand parameters—showing learning fits the transition (bubble and convergence) much better while equilibrium becomes accurate only once the market stabilizes."

- title: "Markowitz (JF, 1952) - Portfolio Selection"
  file: "Markowitz_JF_1952.pdf"
  desc: "This note summarizes the paper, which replaces “maximize expected return” with a mean–variance decision rule by defining portfolio expected return as a weighted average of individual expected returns and portfolio risk as a quadratic form in portfolio weights driven by the full covariance matrix, characterizes efficient portfolios as those minimizing variance for a given mean (or maximizing mean for a given variance), and uses geometric constructions (isomean lines, isovariance ellipses, and the critical line) to show that diversification is valuable because of imperfectly correlated returns—so covariance, not the number of securities, is the central risk object."

- title: "Tobin (RES, 1958) - Liquidity Preference as Behavior Towards Risk"
  file: "Tobin_RES_1958.pdf"
  desc: "This note summarizes the paper, which reformulates Keynesian liquidity preference as a mean–variance portfolio problem over monetary assets (cash versus interest-bearing bonds) by introducing uncertainty about future interest-rate–driven capital gains/losses and risk-averse preferences, derives interior diversification between cash and bonds (rather than Keynes’s all-or-nothing speculative corners under sticky expectations), shows that a higher interest rate or lower perceived bond risk typically reduces desired cash holdings—especially at low rates—and extends the framework to multiple risky monetary assets where investors first choose an efficient risky composite and then choose how much cash to hold against it, interpreting the paper’s geometric figures on the opportunity locus, indifference curves, and aggregation throughout.."

- title: "Greenwood, Seshadri, and Yorukoglu (RES, 2005) - Engines of Liberation"
  file: "Greenwood_Seshadri_Yorukoglu_RES_2005.pdf"
  desc: "This note summarizes the paper, which combines historical diffusion and time-use facts on electrification and labor-saving household durables with a calibrated dynamic general-equilibrium household-production model featuring heterogeneous households, falling durable prices, and discrete adoption and female labor-supply participation decisions, shows that a standard wage-growth home-production model cannot generate the large rise in married women’s market work, and then quantifies that the household durable-goods revolution explains a major share of the 1900–1980 increase in female labor-force participation (with strong interaction effects with the narrowing gender wage gap), matching diffusion timing across income types and transition paths and interpreting the key figures and welfare decompositions throughout."

- title: "Bertrand, Kamenica, and Pan (QJE, 2015) - Gender Identity and Relative Income within Households"
  file: "Bertrand_Kamenica_Pan_QJE_2015.pdf"
  desc: "This note summarizes the paper, which documents a sharp discontinuity in the distribution of wives’ share of household income at the 50% breadwinner threshold using SIPP-linked administrative earnings and cleaned Census/ACS data, identifies marriage-market and labor-supply responses to “wife-out-earns-husband” risk using market-level regressions where the key shifter is the probability a randomly drawn woman would out-earn a randomly drawn man (instrumented with a Bartik-style predicted-earnings distribution based on national industry wage changes and predetermined local industry composition), estimates household-level labor-force-participation and realized-versus-potential-earnings regressions using a couple-specific PrWifeEarnsMore measure, and links threshold crossing to lower marital satisfaction, higher divorce risk, and compensatory housework using NSFH/ATUS and PSID within-couple fixed-effects evidence, interpreting the patterns as the imprint of a gender-identity norm that the husband should earn more.."

- title: "Sharpe (JF, 1964) - Capital Asset Prices: A Theory of Market Equilibrium under Conditions of Risk"
  file: "Sharpe_JF_1964.pdf"
  desc: "This note summarizes the paper, which derives an equilibrium theory of asset prices in a one-period mean–variance setting with a riskless borrowing/lending rate and homogeneous expectations, shows that market clearing implies a capital market line where all investors hold combinations of the risk-free asset and an efficient risky portfolio, and uses a tangency argument to price individual securities—proving expected returns are linear in systematic risk (a beta-like covariance with an efficient portfolio) while idiosyncratic risk is not priced because it can be diversified away—illustrated through the paper’s geometric figures linking the efficient frontier, diversification, the CML, and the regression interpretation of beta."

- title: "Aguirregabiria and Mira (Econometrica, 2007) - Sequential Estimation of Dynamic Discrete Games"
  file: "Aguirregabiria_Mira_Econometrica_2007.pdf"
  desc: "This note summarizes the paper, which develops computationally tractable estimation for dynamic discrete games with multiple equilibria by representing Markov perfect equilibrium as a fixed point in conditional choice probability (CCP) space, constructs pseudo maximum likelihood (PML) estimators that avoid solving the full game at every trial parameter, and introduces the nested pseudo likelihood (NPL) algorithm that iterates between parameter estimation and CCP best-response updating to reduce finite-sample bias and handle large state spaces and permanent unobserved heterogeneity, validating the approach in Monte Carlo experiments and applying it to dynamic entry–exit in Chilean local retail markets (restaurants, gas stations, bookstores, shoe shops, fish shops) to recover fixed costs, sunk entry costs, strategic interaction, and market-level heterogeneity."

- title: "Nurisso (JFE, 2026) - Learning by Lending Securities"
  file: "Nurisso_JFE_2026.pdf"
  desc: "This note summarizes the paper, which builds a Kyle-style trading model in which securities lending is an information-acquisition stage: an informed short seller’s borrowing decision reveals bad news to the lender, who sets lending fees and may trade on (and potentially recall) lent shares before the short sale occurs, deriving equilibrium fee setting and trading strategies under passive versus active lenders, showing how recall risk creates a commitment problem that imposes a positive lower bound on active-lender fees and tightens short-sale constraints, and proving that passive lenders—despite charging higher fees—can attract more shorting demand and sometimes improve price efficiency because they do not leak information through trading, with additional results on lender reputation, lender competition, and equilibrium price/fee/shorting-efficiency comparative statics illustrated in the core figures."

- title: "Allen, Carmichael, Clark, Li, and Vincent (JFE, 2026) - Housing affordability and parental income support: The role of mortgage co-signing"
  file: "Allen_Carmichael_Clark_Li_Vincent_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses matched Canadian TransUnion credit-bureau records and OSFI mortgage-contract data (2015–2022, with co-signing trends back to 2004) to define parent co-signing via age gaps and simulate qualification-rule counterfactuals that remove parents’ income/debt/credit scores under observed GDS/TDS/PTI constraints, quantifies how co-signing relaxes affordability and shifts first-time buyers toward earlier, higher-priced, high-λ (near-max-PTI) housing choices, and then assesses financial fragility with delinquency-change regressions and an event-study around the 2016 insured and 2018 uninsured Canadian mortgage stress tests as quasi-exogenous PTI tightening that increases marginal co-signing, showing co-signing raises leverage and post-origination delinquency risk for both children (especially constrained/high-λ) and sometimes parents."

- title: "Cicero, Shen, and Shenoy (JF, 2026) - Corporate M&As and Labor Market Concentration -- Efficiency Gains or Power Grabs?"
  file: "Cicero_Shen_Shenoy_JF_2026.pdf"
  desc: "This note summarizes the paper, which measures deal-induced changes in local labor-market concentration for 2,664 U.S. public-firm mergers (1991–2016) using establishment-level NETS employment shares in county×SIC3 labor markets, links this overlap to combined announcement-period wealth effects in cross-sectional merger-value regressions, and then distinguishes labor-power from labor-efficiency channels using mobility/noncompete/union heterogeneity, related-party event-study portfolios for rivals/customers/suppliers, and stacked difference-in-differences real-effects panels showing that high-overlap mergers cut overlapping-market employment while raising IT intensity and (at the firm level) increase revenues, operating income, and labor productivity without raising margins—consistent with efficiency-enhancing reorganization rather than monopsony rent extraction."

- title: "Goyal, Wahal, and Yavuz (JFE, 2026) - Picking partners: Manager selection in private markets"
  file: "Goyal_Wahal_Yavuz_JFE_2026.pdf"
  desc: "This note summarizes the paper, which studies LP selection of private-market managers using 61,602 Preqin commitments (1995–2019) and a novel LP-year opportunity-set construction that incorporates access/rationing, commitment-size constraints, fund-type specialization, timing windows, and personal-relationship relaxations (including failed fundraising attempts), estimates within-opportunity-set fund-choice regressions with rich fixed effects showing LPs chase past performance but select first-time and young GPs at rates comparable to top-quartile incumbents, rejects “hidden expected outperformance” and “toehold into future star funds” using rolling expected-return forecasts and realized IRR evidence, and identifies a market-clearing pressure-to-invest mechanism by interacting LP under-allocation/fast-growing demand measures with GP types to show LPs under deployment pressure substitute toward new entrants when incumbent supply does not scale."

- title: "Barry, Carlin, Crane, and Graham (JFE, 2026) - Hurdle Rate Buffers and Bargaining Power in Asset Acquisition"
  file: "Barry_Carlin_Crane_Graham_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops a delegated-bargaining model where CFO-set hurdle-rate “buffers” (hurdle minus WACC) act as a commitment device that can improve negotiated terms in project development or acquisitions at the cost of rejecting some positive-NPV deals, disciplines the mechanism with six Duke CFO surveys (hurdle/WACC levels and persistence), Compustat ROIC bunching just above the hurdle (not WACC), and M&A fairness-opinion discount rates to proxy bidder hurdles in deal-level regressions showing higher buffers predict lower premia and higher bidder announcement returns without higher combined gains (surplus capture), and links buffer use to ex ante bargaining power (supplier/customer concentration and supplier markups) with stronger effects when assets are less redeployable."

- title: "Sannino (JFE, 2026) - Committing to Trade: A Theory of Intermediation"
  file: "Sannino_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops a two-period lemons-market theory where sellers privately know asset quality and part of their valuation while a common shock to gains from trade is revealed only right before final buyers make offers, shows that competitive intermediation can raise welfare even without superior information by making sellers commit to trade before the shock (improving expected traded-asset quality and shifting trade toward low-demand states where adverse selection is most severe), characterizes two welfare channels (volume and redistribution) and sharp comparative statics in shock volatility and selection severity, extends the model to allow disintermediation via costly search and proves that lower search frictions can reduce welfare by undermining the commitment device, and introduces optimal threshold delegation contracts and applications to underwrite-to-distribute leveraged loans and principal-versus-agency OTC dealer markets."

- title: "Catherine, Ebrahimian, and Yannelis (JFE, 2026) - How do income-driven repayment plans benefit student debt borrowers?"
  file: "Catherine_Ebrahimian_Yannelis_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses a 2000–2020 TransUnion borrower-panel to decompose the post-2010 rise in U.S. student-loan balances into new borrowing versus repayment deferral by constructing counterfactual standard-plan amortization paths, then embeds student-loan rules in an incomplete-markets life-cycle model with income risk and safety-net programs to quantify welfare effects of income-driven repayment (IDR) and decompose borrower gains into insurance, intertemporal smoothing, and taxpayer transfers, and finally searches over key IDR parameters (repayment horizon, income threshold, repayment rate) to characterize the welfare frontier—showing that long horizons with progressive thresholds deliver similar borrower welfare at far lower fiscal cost and that SAVE-style generosity mainly operates through transfers rather than efficiency."

- title: "Edmond, Midrigan, and Xu (JPE, 2023) - How Costly Are Markups?"
  file: "Edmond_Midrigan_Xu_JPE_2023.pdf"
  desc: "This note summarizes the paper, which builds a dynamic heterogeneous-firm macro-IO model with endogenous entry/exit, capital accumulation, and size-dependent markups (disciplined by U.S. Census of Manufactures moments on concentration, materials shares, and the markup–market-share slope), shows that the macro-relevant distortion is the cost-weighted (sales-weighted harmonic) aggregate markup rather than the usual sales-weighted arithmetic average (which conflates the aggregate wedge with dispersion), decomposes welfare losses into an aggregate-markup wedge, misallocation from markup dispersion, and a small entry distortion, and runs policy counterfactuals demonstrating that uniform output subsidies and size-dependent misallocation corrections capture most gains while entry subsidies barely move the aggregate markup."

- title: "Murphy, Shleifer, and Vishny (JPE, 1989) - Industrialization and the Big Push"
  file: "Murphy_Shleifer_Vishny_JPE_1989.pdf"
  desc: "This note summarizes the paper, which formalizes Rosenstein–Rodan’s “big push” logic in a sequence of stylized general-equilibrium models with increasing returns and market-size spillovers, shows that pure profit (dividend) spillovers yield a unique equilibrium (no coordination failure), and then identifies three mechanisms that generate multiple equilibria and a self-sustaining industrialization path—a factory wage premium that raises aggregate demand, intertemporal investment that shifts demand into the future, and shared infrastructure with a large fixed cost that requires coordinated adoption—deriving the conditions under which the industrial equilibrium exists and is (often, but not always) Pareto-preferred and highlighting the role of policy in coordinating complementary sectoral investments."

- title: "Atkeson and Burstein (JPE, 2019) - Aggregate Implications of Innovation Policy"
  file: "Atkeson_Burstein_JPE_2019.pdf"
  desc: "This note summarizes the paper, which derives a unified first-order (sufficient-statistics) mapping from innovation subsidies to aggregate productivity, output, welfare, and fiscal cost in a growth model that nests entrant-only and incumbent-innovation environments, showing that the medium- and long-run effects of innovation policy depend primarily on two objects—the impact elasticity V of productivity growth with respect to real innovative investment and the intertemporal research spillover parameter f — measures V from U.S. aggregate and firm-dynamics evidence on entrants’ contribution to trend productivity growth and entrants’ share of innovative investment (with and without business stealing), and then calibrates alternative f values to compute 1-year, 20-year, and long-run elasticities and optimal research-labor shares, concluding that uniform innovation subsidies have modest 20-year output effects but potentially sizable welfare gains through long-run productivity."

- title: "Krugman (JPE, 1991) - Increasing Returns and Economic Geography"
  file: "Krugman_JPE_1991.pdf"
  desc: "This note summarizes the paper, which introduces the canonical “core–periphery” model of new economic geography by combining Dixit–Stiglitz monopolistic competition and increasing returns in manufacturing with iceberg transport costs and mobile manufacturing labor (agriculture tied to immobile land), characterizes short-run equilibrium wages and price indices and long-run migration driven by real-wage differentials, and derives agglomeration conditions—via both numerical stability of the symmetric allocation and an analytic “defecting firm” profitability test summarized by a scalar statistic ν — showing that self-reinforcing backward/forward linkages generate endogenous manufacturing concentration when transport costs are low, the manufacturing expenditure share is high, and scale economies are strong (low σ), interpreting the three core figures that map these thresholds in (μ,τ,σ) space."

- title: "Ossa (JPE, 2011) - A “New Trade” Theory of GATT/WTO Negotiations"
  file: "Ossa_JPE_2011.pdf"
  desc: "This note summarizes the paper, which develops a “new trade” theory of GATT/WTO negotiations in a Krugman-style monopolistic-competition model with increasing returns and endogenous firm location, shows that unilateral tariffs create a production-relocation externality (attracting manufacturing firms/jobs) that drives inefficient Nash protection, proves that reciprocity restores efficiency by fixing manufacturing trade balances (and thus firm masses) while nondiscrimination makes this logic work multilaterally by internalizing third-country spillovers, and then calibrates a multi-country exact-hat system to 2004 bilateral manufacturing trade flows and applied tariffs for major blocs to compute Nash tariffs and welfare losses from tariff wars and remaining gains from cooperative liberalization."

- title: "Bornstein and Peter (AER, 2025) - Nonlinear Pricing and Misallocation"
  file: "Bornstein_Peter_AER_2025.pdf"
  desc: "This note summarizes the paper, which documents pervasive quantity discounts in NielsenIQ scanner data by estimating within–product-line unit-price slopes across package sizes, builds a general-equilibrium model where firms use second-degree nonlinear pricing to screen consumers with private taste heterogeneity, proves under constant-elasticity-of-differences (CED) preferences that nonlinear pricing generates large within-firm misallocation (high-taste consumers overbuy and low-taste consumers underbuy) but does not create across-firm misallocation conditional on aggregate labor, calibrates the nonlinear- and linear-pricing versions to the same empirical moments on package-size dispersion, concentration, and markup patterns, and quantifies that welfare losses and labor wedges can be much larger under nonlinear pricing while showing that size-dependent subsidies optimal under linear pricing can reduce welfare when pricing is nonlinear."

- title: "Akcigit, Hanley, and Stantcheva (Econometrica, 2022) - Optimal Taxation and R&D Policies"
  file: "Akcigit_Hanley_Stantcheva_Econometrica_2022.pdf"
  desc: "This note summarizes the paper, which formulates optimal corporate taxation and R&D subsidies as a dynamic mechanism-design problem with innovation spillovers, monopoly distortions, privately known firm research productivity, and unobservable R&D effort, derives optimal “profit” and “R&D” wedges that combine Pigouvian, market-power, and screening terms governed by Hicksian complementarity (e.g., whether observable R&D amplifies hidden type more than hidden effort), estimates the model by matching Census firm outcomes to USPTO patent/citation-based innovation quality and reported R&D spending (recovering key parameters like strong R&D–type complementarity and spillover strength), and evaluates implementable policy classes—showing that a linear profit tax paired with a nonlinear R&D subsidy achieves nearly the full welfare gain relative to the unrestricted optimum while the US-style linear-linear system performs poorly."

- title: "Itskhoki and Moll (Econometrica, 2019) - Optimal Development Policies with Financial Frictions"
  file: "Itskhoki_Moll_Econometrica_2019.pdf"
  desc: "This note summarizes the paper, which solves a Ramsey-optimal development-policy problem in a macro model with heterogeneous entrepreneurs facing collateral constraints and workers supplying labor, derives tractable aggregation where entrepreneurial wealth x and its shadow value ν are sufficient statistics for transition dynamics, and shows that the optimal policy is stage-dependent—initially subsidizing labor supply (wage suppression) and potentially combining it with credit/wage-bill/capital subsidies to accelerate entrepreneurs’ net-worth accumulation and relax future financial frictions, then later switching to pro-worker labor taxation once wealth is abundant—validated in a richer quantitative calibration (persistent productivity, hand-to-mouth workers, OLG) and extended to a multi-sector setting where policy targets sectors with latent comparative advantage (including consumption-tax/labor-subsidy wedges in nontradables)."

- title: "Halac and Yared (JPE, 2025) - A Theory of Fiscal Responsibility and Irresponsibility"
  file: "Halac_Yared_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops a repeated-game political-economy model of government borrowing in a small open economy where each period’s deficit-biased incumbent privately observes fiscal-need shocks and future governments can punish only based on observed debt choices, proves that the welfare-maximizing self-enforcing equilibrium features bang-bang continuation values and thus two endogenous fiscal regimes—a “responsible” regime implemented as a maximally enforced deficit limit and an “irresponsible” punishment regime implemented as a maximally enforced surplus (minimum borrowing) limit—derives crisis-triggered regime-switching logic and an operator fixed-point condition for regime existence (requiring sufficiently high patience and deficit bias), and illustrates the mechanism with analytical log-utility thresholds and numerical simulations that match crisis-timed consolidation waves."

- title: "Elliott, Houngbonon, Ivaldi, and Scott (JPE, 2025) - Market Structure, Investment, and Technical Efficiencies in Mobile Telecommunications"
  file: "Elliott_Houngbonon_Ivaldi_Scott_JPE_2025.pdf"
  desc: "This note summarizes the paper, which estimates a unified empirical-IO and engineering model of the French mobile market (2015) where consumers choose plans and endogenously choose data usage under soft caps, delivered download speeds are determined by base-station density, spectrum bandwidth, and congestion (queueing + Shannon–Hartley), and operators choose national prices and local infrastructure; it identifies demand with a modified BLP-style inversion using rich Orange plan-by-commune shares plus national rival shares, externally calibrated Orange elasticities, and a population-density instrument for endogenous quality, then recovers per-user and infrastructure costs from pricing and investment FOCs to run counterfactuals that vary the number of firms and spectrum allocation and simulate mergers, quantifying the price–quality tradeoff, the welfare-maximizing market structure by income, and the social versus private value of spectrum."

- title: "Bartelme, Costinot, Donaldson, and Rodríguez-Clare (JPE, 2025) - The Textbook Case for Industrial Policy: Theory Meets Data: The Case of Air Toxics Standards"
  file: "Bartelme_Costinot_Donaldson_RodriguezClare_JPE_2025.pdf"
  desc: "This note summarizes the paper, which quantifies the “textbook” Pigouvian case for industrial policy in a multi-sector open-economy model with external economies of scale and terms-of-trade distortions, estimates sector-specific scale elasticities g(k) from OECD ICIO bilateral trade flows using gravity structure with imported trade elasticities and demand-based instruments for sector size (and an IV estimate of across-sector substitution), and then computes optimal employment subsidies and export taxes plus exact general-equilibrium welfare gains and Harberger-triangle approximations—showing meaningful estimated scale elasticities but modest average gains because equilibrium reallocation across sectors is limited, with larger gains in an extended model with capital and input–output linkages."

- title: "Gowrisankaran, Langer, and Zhang (JPE, 2025) - Policy Uncertainty in the Market for Coal Electricity: The Case of Air Toxics Standards"
  file: "Gowrisankaran_Langer_Zhang_JPE_2025.pdf"
  desc: "This note summarizes the paper, which uses EPA CEMS hourly generator data and related EIA/market datasets to build annual profit and SO₂ pollution “surfaces” for 310 merchant coal generators (Eastern Interconnection, 2006–2017), estimates a dynamic oligopoly model of adopt/continue/exit under uncertain MATS enforcement using an Approximate Belief Oligopoly Equilibrium (ABOE) and nested fixed-point simulated maximum likelihood, identifies time-varying subjective enforcement probabilities by comparing MATS units to units under earlier state air-toxics standards as a low-uncertainty benchmark, and runs timing-of-resolution counterfactuals showing earlier uncertainty resolution would raise profits but can increase pollution by keeping marginal coal units operating."

- title: "Delabastita and Rubens (JPE, 2025) - Colluding against Workers"
  file: "Delabastita_Rubens_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops a production-cost and labor-supply framework to separate ordinary oligopsony from employer collusion by (i) estimating firm-year wage markdowns from a production function and input revenue shares (a De Loecker–Warzynski-style cost-side identity) without imposing labor-market conduct, (ii) estimating local labor-supply elasticities using coal-demand shifters and the 1897 cartel shock, and (iii) mapping observed markdowns into a 0–1 collusion index by comparing them to model-implied no-collusion and full-collusion bounds, then applies the method to a unique panel of 227 Belgian coal firms (1845–1913) with observed cartel and employers’-association institutions to quantify that the post-1900 markdown surge reflects collusion and to run counterfactual wage/employment effects of the 1897 Liège cartel."

- title: "Hémous, Olsen, Zanella, and Dechezleprêtre (JPE, 2025) - Induced Automation Innovation: Evidence from Firm-Level Patent Data"
  file: "Hemous_Olsen_Zanella_Dechezlepretre_JPE_2025.pdf"
  desc: "This note summarizes the paper, which quantifies the “textbook” Pigouvian case for industrial policy in a multi-sector open-economy model with external economies of scale and terms-of-trade distortions, estimates sector-specific scale elasticities g(k) from OECD ICIO bilateral trade flows using gravity structure with imported trade elasticities and demand-based instruments for sector size (and an IV estimate of across-sector substitution), and then computes optimal employment subsidies and export taxes plus exact general-equilibrium welfare gains and Harberger-triangle approximations—showing meaningful estimated scale elasticities but modest average gains because equilibrium reallocation across sectors is limited, with larger gains in an extended model with capital and input–output linkages."

- title: "Marra (JPE, 2025) - Estimating an Auction Platform Game with Two-Sided Entry"
  file: "Marra_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops and estimates a two-sided auction-platform model with endogenous bidder entry (Poisson counts with free entry/inspection costs) and heterogeneous seller entry/selection (sellers know values ex ante and choose whether to list and what reserve to set), nonparametrically identifies bidder values from zero-reserve auctions via order statistics and identifies seller values by inverting the optimal reserve-pricing rule, pins down bidder and seller entry costs using zero-profit conditions, and implements a nested pseudo-likelihood–style estimation algorithm on a scraped panel of 3,481 UK wine auctions to run fee-incidence, optimal fee reallocation (commission-index) and antitrust counterfactuals that highlight a “lemons effect” and nonlinear incidence across both sides."

- title: "Fan and Yang (JPE, 2025) - Estimating Discrete Games with Many Firms and Many Decisions: An Application to Merger and Product Variety"
  file: "Fan_Yang_JPE_2025.pdf"
  desc: "This note summarizes the paper, which proposes a scalable estimator for large discrete games by bounding each binary action’s conditional choice probability between “dominant” and “not dominated” regions (yielding moment-inequality restrictions that avoid enumerating equilibria), implements a computational approximation that evaluates best/worst-case rival configurations, and applies the method to a two-stage differentiated-products model of California retail craft beer—estimating demand with a random-coefficients logit using barley-price cost shifters as instruments, backing out marginal costs from pricing FOCs, and then estimating product-entry fixed costs from market-size and distance shifters—to run merger counterfactuals that decompose effects on entry, product variety, prices, and welfare under alternative fixed-cost efficiency assumptions."

- title: "Le Grand and Ragot (JPE, 2025) - Optimal Fiscal Policy with Heterogeneous Agents and Capital: Should We Increase or Decrease Public Debt and Capital Taxes?"
  file: "LeGrand_Ragot_JPE_2025.pdf"
  desc: "This note summarizes the paper, which characterizes optimal Ramsey fiscal policy in a heterogeneous-agent incomplete-markets economy with capital and occasionally binding borrowing constraints, deriving conditions under which the steady-state optimal capital tax is positive (a savings-induced factor-price externality that vanishes under separable CRRA but survives under GHH/DRRA preferences) and establishing existence/stability thresholds, then quantifies the implications in a calibrated HANK model anchored to the U.S. fiscal system via an inverse-optimal mapping of social welfare weights and computes MIT-shock impulse responses showing capital taxes and labor-tax progressivity rise after spending shocks while the optimal public-debt response flips sign with shock persistence (debt smooths transitory shocks but falls under persistent shocks)."

- title: "Wang and Yang (JPE, 2025) - Policy Experimentation in China: The Political Economy of Policy Learning"
  file: "Wang_Yang_JPE_2025.pdf"
  desc: "This note summarizes the paper, which builds a novel database of 652 Chinese “experimentation point” policies from 19,812 central/local government documents (1980–2020), tests representativeness by comparing pre-pilot characteristics of experimentation versus nonexperimentation sites (showing strong positive selection), identifies strategic pilot implementation effort using a triple-differences design on domain-specific local fiscal expenditure shares (county×year, domain×year, and county×domain fixed effects) and text-based implementation differentiation, and shows the center naively interprets pilot outcomes using IV evidence from land-revenue windfalls (land-suitability×interest-rate instrument) and politician-turnover incentive shocks that predict national rollout, plus estimator horse races (naive pre/post predicts rollout, pretrend-adjusted and synthetic control do not) and shrinkage comparisons from pilot to national effects."

- title: "Zaffaroni (JPE, 2025) - Factor Models for Conditional Asset Pricing"
  file: "Zaffaroni_JPE_2025.pdf"
  desc: "This note summarizes the paper, which develops a fixed-T, large-N framework for conditional asset pricing by estimating latent factors via local (rolling-window) PCA under no-arbitrage and a scalar cross-section-average idiosyncratic covariance restriction, derives asymptotic theory when only the local factor space (not loadings) is consistently estimated, proposes a fixed-T factor-number criterion and bias-corrected pricing tests for risk premia and the SDF that separate finite-window noise from true misspecification, and validates the approach in Monte Carlo horse races against IPCA/constant PCA and in CRSP monthly stock returns (1980–2019)."

- title: "Rodnyansky, Timmer, and Yago (JFE, 2026) - Intervening against the Fed"
  file: "Rodnyansky_Timmer_Yago_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses high-frequency Fed funds futures shocks around FOMC announcements (90 events, 2000–2019) and daily sterilized FX-intervention data for 13 countries to estimate local-projection event-study DID designs, isolates “unexpected” intervention via residuals from an FXI reaction function, and identifies the corporate balance-sheet channel with firm-level US-dollar-debt heterogeneity (Capital IQ repayment-currency data) in triple-interaction stock-return regressions with country-date fixed effects, showing that selling dollars after US tightening stabilizes exchange rates, currency risk premia, and portfolio flows and largely neutralizes the stock-price hit to dollar-debt firms—especially when reserves are high—while highlighting a tradeoff for exporters and firms with foreign revenues."

- title: "Brandsaas and Kvaerner (JFE, 2026) - Partial Homeownership: A Quantitative Analysis"
  file: "Brandsaas_Kvaerner_JFE_2026.pdf"
  desc: "This note summarizes the paper, which embeds a real-world Norwegian partial-homeownership (deleie) contract from OBOS—allowing households to buy 50–90% of a home and rent the remainder with contract-specific share-adjustment pricing—into a calibrated life-cycle housing model with stochastic income and house prices, mortgage LTV/DTI constraints, and discrete housing-size choice, estimates key preferences and the new “ownership elasticity” parameter by simulated method of moments using Norwegian administrative wealth/homeownership-by-age moments and the observed initial PO share distribution, and then runs quantitative counterfactuals for take-up, willingness-to-pay, debt-to-income distributions, and default under stress scenarios to show PO expands access for young/constrained households while compressing extreme leverage and lowering default risk."

- title: "Backer-Peral, Hazell, and Mian (AER, 2026) - Dynamics of the Long-Term Housing Yield: Evidence from Natural Experiments"
  file: "BackerPeral_Hazell_Mian_AER_2026.pdf"
  desc: "This note summarizes the paper, which uses UK administrative leasehold-extension records matched to transaction prices (and listings/rents for validation) to estimate the causal price gain from extending a lease via a property-level difference-in-differences design with repeat-sales local controls, maps that DiD estimand into the market’s long-run expected housing yield yt(∗) by fitting a discounted-cash-flow pricing equation with a DiD–nonlinear least squares estimator that differences out the short end of the yield curve, and then analyzes time-series and cross-sectional patterns in yt(∗) (real-time updating, comparisons to other asset yields, and links to climate risk and housing supply elasticity using an IV based on post-2002 planning-delay reforms)."

- title: "Bordalo, Gennaioli, Shleifer, and Terry (AER, 2026) - Real Credit Cycles"
  file: "Bordalo_Gennaioli_Shleifer_Terry_AER_2026.pdf"
  desc: "This note summarizes the paper, which documents predictable managerial forecast errors (IBES guidance matched to Compustat) and firm-level boom–bust reversals in bond returns and investment, embeds diagnostic expectations into a heterogeneous-firm neoclassical model with risky debt, default, and adjustment costs so borrowers and lenders overreact to TFP news and endogenously generate compressed spreads in booms and sharp spread/investment reversals when optimism fades, and estimates the model by simulated method of moments using forecast-error covariance moments to identify the diagnosticity parameter (alongside macro spread/default targets and TRACE/FISD bond data), showing the DE model matches spread volatility and the 2007–2009 crisis dynamics far better than a rational-expectations benchmark."

- title: "Khanna, Murathanoglu, Theoharides, and Yang (AER, 2026) - Abundance from Abroad: Migrant Income and Long-Run Economic Development"
  file: "Khanna_Murathanoglu_Theoharides_Yang_AER_2026.pdf"
  desc: "This note summarizes the paper, which studies Philippine provinces after the 1997 Asian Financial Crisis using a province-level migrant-income shift-share shock that interacts persistent destination exchange-rate changes with pre-crisis province–destination migrant income exposure weights built from matched POEA–OWWA administrative data, estimates province and time fixed-effects regressions and event studies (with flexible controls for the shock components and trade-shift-share confounders), and then quantifies channels—education upgrades, migration reallocation toward higher-paying destinations (gravity elasticity), spending multipliers and enterprise investment, and structural change out of primary sectors—showing most long-run gains come from domestic income rather than migrant income."

- title: "Brandt, Van Biesebroeck, Wang, and Zhang (JDE, 2026) - Where Has All the Dynamism Gone? Productivity Growth in China’s Manufacturing Sector, 1998–2013"
  file: "Brandt_VanBiesebroeck_Wang_Zhang_JDE_2026.pdf"
  desc: "This note summarizes the paper, which combines China’s NBS above-scale industrial survey with the STA tax survey (1998–2013) to repair post-2007 data problems by estimating year-specific density-ratio (importance) weights from the overlap and drawing simulated representative STA samples, estimates gross-output production functions separately pre/post-2007 using the Gandhi–Navarro–Rivers (2020) estimator, and aggregates output-share-weighted firm TFP to document a sharp, broad-based collapse in manufacturing TFP growth after 2007 (with ownership/industry/region and young-vs-old-firm decompositions and robustness checks)."

- title: "Brandt, Van Biesebroeck, and Zhang (JDE, 2012) - Creative Accounting or Creative Destruction? Firm-level Productivity Growth in Chinese Manufacturing"
  file: "Brandt_VanBiesebroeck_Zhang_JDE_2012.pdf"
  desc: "This note summarizes the paper, which uses the NBS above-scale Chinese manufacturing firm panel (1998–2007) with extensive cleaning (firm ID linking through restructuring, deflators, and real-capital construction) to measure productivity using a benchmark Törnqvist index-number approach (gross-output and value-added) with OP/ACF production-function estimates as robustness, and then decomposes aggregate manufacturing growth into incumbent TFP, entry/exit (creative destruction), and within-incumbent reallocation (Olley–Pakes/BHC-style covariance) plus ownership-based breakdowns, showing exceptionally rapid TFP growth driven mainly by net entry and post-entry learning but relatively weak productivity-enhancing reallocation among surviving firms."

- title: "Dix-Carneiro, Goldberg, Meghir, and Ulyssea (Econometrica, 2026) - Trade and Domestic Distortions: The Case of Informality"
  file: "DixCarneiro_Goldberg_Meghir_Ulyssea_Econometrica_2026.pdf"
  desc: "This note summarizes the paper, which builds and estimates a dynamic open-economy general-equilibrium model of Brazil with heterogeneous firms, formal–informal status choice under size-dependent imperfect enforcement, and a search-and-matching labor market with payroll/VAT taxes, firing costs, and minimum wages, disciplines the framework using seven matched Brazilian datasets (RAIS, ECINF, PME, PIA/PAS/PAC, SECEX) via indirect inference on dozens of moments (size–informality gradients, productivity/wage gaps, turnover, unemployment flows, exporter shares), and then runs trade-cost counterfactuals that decompose gains into mechanical import-price effects versus distortion-driven reallocation (showing informality amplifies trade gains but also shapes unemployment buffering and inequality responses)."

- title: "Bernstein, Frydman, and Hilt (JPE, 2026) - The Value of Ratings: Evidence from Their Introduction in Securities Markets"
  file: "Bernstein_Frydman_Hilt_JPE_2026.pdf"
  desc: "This note summarizes the paper, which exploits the April-1909 introduction of Moody’s first letter-graded railroad bond ratings in a regulation-free setting, constructs “negative rating surprises” by comparing Moody’s ratings to prerating yield quartiles, and estimates bond-week difference-in-differences/event-study (and within-railroad bond-level) yield regressions with bond and week fixed effects and rating-level trends showing yields rise after negative surprises, then identifies liquidity effects of being rated using NYSE bid–ask quote panels and a 2SLS design instrumenting rating status with the issuer’s other bonds’ prerating yields, complemented by underwriter-board-connection heterogeneity and trade-size (single-lot) participation tests."

- title: "Jiang (RFS, 2023) - Financing Competitors: Shadow Banks’ Funding and Mortgage Market Competition"
  file: "Jiang_RFS_2023.pdf"
  desc: "This note summarizes the paper, which builds a new loan-level panel of shadow-bank warehouse credit lines from S.A.F.E. Mortgage Licensing Act call reports matched to HMDA, shows that shadow banks’ warehouse funding is concentrated in banks that compete with them in the same local mortgage markets using overlap-based matching regressions with bank-year and shadow-bank-year fixed effects, identifies lender differentiation and limited substitutability via a DiD around the 2014 oil-price net-worth shock to exposed banks, documents strategic vertical conduct with reduced-form “cannibalization” (funding less in concentrated downstream markets) and “funding-channel” (banks with larger warehouse shares charge higher mortgage rates) regressions, and then calibrates a structural model of upstream warehouse pricing and downstream mortgage competition to quantify welfare and policy counterfactuals such as shortening warehouse duration through secondary-market innovations."

- title: "Begenau and Palazzo (JFE, 2021) - Firm Selection and Corporate Cash Holdings"
  file: "Begenau_Palazzo_JFE_2021.pdf"
  desc: "This note summarizes the paper, which documents that the post-1970s rise in U.S. public-firm cash is largely a cohort/selection effect (entrants arrive with progressively higher cash while incumbents run cash down), formalizes this with an accounting decomposition of aggregate cash growth into within-incumbent versus entry/exit components split by R&D-intensive versus non-R&D sectors, and then structurally estimates a dynamic corporate finance model with costly equity issuance and cash carry costs, decreasing returns, mean-reverting productivity, and heterogeneous entry signals via simulated method of moments to match entry and lifecycle cash/investment/volatility moments and quantify how changing entrant composition and risk drive the secular trends."

- title: "Lyonnet and Chrétien (RFS, 2026) - Why Do Traditional and Shadow Banks Coexist?"
  file: "Lyonnet_Chretien_RFS_2025.pdf"
  desc: "This note summarizes the paper, which builds a three-date equilibrium model where shadow banks can issue money-like debt in good times because they expect insured traditional banks to buy their risky assets at fire-sale prices in crises (creating a crisis-asset-market complementarity that supports coexistence), disciplines the mechanism with crisis evidence from 2007 and 2020 on liability runs out of shadow banks, deposit inflows into large traditional banks, asset transfers (notably MBS) from shadow to traditional balance sheets, and fire-sale price pressure, and tests the key prediction with bank-level regressions showing insured-deposit inflows predict MBS purchases during 2007–2009, then uses the model for comparative statics on regulation/crisis risk and a planner exercise showing the market equilibrium has too many shadow banks."

- title: "Huang, Pagano, and Panizza (JF, 2020) - Local Crowding-Out in China"
  file: "Huang_Pagano_Panizza_JF_2020.pdf"
  desc: "This note summarizes the paper, which constructs a new prefecture-level panel of Chinese local government debt via LGFV bond-disclosure balance sheets (2006–2013) matched to ASIF firm data, documents geographic credit-market segmentation, and identifies local crowding-out of private investment by estimating firm and city(-year) fixed-effects regressions supplemented with three within-city identification strategies—proximity to outside-city banks, Rajan–Zingales-style industry external-finance dependence interactions, and cash-flow-sensitivity (plus an endogenous switching-regression regime split)—showing that rising local debt tightens credit constraints and reduces investment/leverage mainly for private and small firms while SOEs are largely insulated."

- title: "Cull and Xu (JDE, 2003) - Who gets credit? The behavior of bureaucrats and state banks in allocating credit to Chinese state-owned enterprises"
  file: "Cull_Xu_JDE_2003.pdf"
  desc: "This note summarizes the paper, which uses two linked surveys of Chinese manufacturing SOEs (1980–1994) to compare how state banks versus government bureaucracies allocated external finance for fixed investment, estimating probit/tobit reduced-form credit-supply regressions of bank- and government-finance access/shares on lagged profitability, payment history, governance oversight, and reform “signal” variables from the Contract Responsibility System (performance contracts, wage–profit elasticity, base-profit retention) with time interactions to track changes across the 1980s and 1990s, and interpreting the core tables/figures showing banks became more profitability-sensitive in the 1980s but less so in the 1990s as bailout responsibilities shifted onto banks, while government transfers remained weakly tied to performance."

- title: "Lee (JFE, 2026) - Face-to-face Social Interactions and Local Informational Advantage"
  file: "Lee_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses U.S. active equity mutual-fund holdings and hand-collected manager locations to split portfolios into local (within 100 miles of firm HQ) versus distant stocks, exploits COVID-19 stay-at-home orders, mobility (SafeGraph foot-traffic collapses), and local case counts as shocks to face-to-face interactions in a fund-level difference-in-differences on benchmark- and DGTW-adjusted returns, and then pinpoints a timing channel with stock×time fixed-effect regressions of local-versus-distant weight changes on contemporaneous returns and subsequent abnormal-return tests, complemented by mechanism heterogeneity using trust-distance and CEO-delta (impression management) measures and alternative-channel checks."

- title: "Metrick and Schmelzing (RFS, 2026) - Banking-Crisis Interventions across Time and Space"
  file: "Metrick_Schmelzing_RFS_2026.pdf"
  desc: "This note summarizes the paper, which builds a new cross-country historical database of 1,946 banking-crisis interventions (7 major categories and 20 subcategories) across 910 crisis episodes in 143 countries, uses a balance-sheet-based taxonomy to code policy tools and logit regressions with precrisis covariates (income, fiscal space, polity, and exchange-rate regime) to describe how intervention mixes vary across time and countries, measures medium-run output losses with a five-year cumulative GDP-gap-to-trend metric and relates them to crisis types and country characteristics, and aggregates the series back to 1665 to document long-run trends in intervention frequency and advanced-economy bank-stress shares."

- title: "Neuhann, Sefidgaran, and Sockin (RFS, 2026) - Portfolio Regulation of Financial Institutions with Market Power"
  file: "Neuhann_Sefidgaran_Sockin_RFS_2026.pdf"
  desc: "This note summarizes the paper, which develops a Cournot–Walras equilibrium model in which large financial institutions trade strategically with price impact so the regulator’s key policy lever is the asset span (complete Arrow markets vs. bundled/restricted portfolios), characterizes when complete markets are constrained-inefficient (too much state-contingent rent extraction when N<Z) and how a “missing asset” representation guides welfare-improving bundling, and calibrates the framework to sovereign bond and CDS markets to evaluate a ban on naked CDS (covered-bond-only trading) by matching yields, bond/CDS bid–ask spreads, and the CDS–bond basis and comparing complete-markets versus regulated counterfactual outcomes."

- title: "Maggio and Kermani (RFS, 2017) - Credit-Induced Boom and Bust"
  file: "Maggio_Kermani_RFS_2017.pdf"
  desc: "This note summarizes the paper, which exploits the 2004 OCC preemption of state anti-predatory lending laws as a regulatory credit-supply shock, estimates agency-level first-stage and county-level triple-difference/event-study regressions that interact APL status, Post-2004, and counties’ predetermined 2003 national-bank (OCC) lending share, and then uses the interaction as an IV for local mortgage origination to quantify effects on house-price growth, nontradable employment, and boom-bust delinquency dynamics, supported by placebo/border-tract designs and risk-lending mechanism tests (high-cost and high-DTI loans)."

- title: "Begley and Srinivasan (RFS, 2022) - Small Bank Lending in the Era of Fintech and Shadow Banks: A Sideshow?"
  file: "Begley_Srinivasan_RFS_2022.pdf"
  desc: "This note summarizes the paper, which uses HMDA lender-class×county mortgage origination data (2008–2015) to estimate local substitution regressions showing small banks expand most where the Big4 retreat, identifies the Big4 retreat with two county-level IVs (predetermined 2008 Big4 share and exposure to Big4 mortgage-lawsuit penalties) to isolate supply-driven reallocation, and then tests mechanisms by splitting outcomes into balance-sheet versus sold (GSE) lending and exploiting the 2011–2015 GSE guarantee-fee parity/level shocks (with jumbo-loan placebos and validation tests) to show small banks’ comparative advantage is retained lending."

- title: "Restuccia and Rogerson (RED, 2008) - Policy Distortions and Aggregate Productivity with Heterogeneous Establishments"
  file: "Restuccia_Rogerson_RED_2008.pdf"
  desc: "This note summarizes the paper, which builds a neoclassical growth model with heterogeneous establishments, decreasing returns, and entry/exit where idiosyncratic output (and factor-cost) taxes/subsidies distort plant scale, calibrates the undistorted benchmark to U.S. establishment size and macro moments, and then runs quantitative policy-counterfactuals contrasting uncorrelated versus productivity-correlated distortions (with fixed-capital and endogenous-capital variants and alternative tax bases) to show that misallocation—especially subsidies to low-productivity plants and taxes on high-productivity plants—can generate large (≈30–50%) losses in aggregate output and measured TFP."

- title: "Straub and Ulbricht (RES, 2024) - Endogenous Uncertainty and Credit Crunches"
  file: "Straub_Ulbricht_RES_2024.pdf"
  desc: "This note summarizes the paper, which develops a general-equilibrium model where firms need bank funding to operate a risky high-productivity technology and where learning is endogenous—firms denied credit switch to a safe low-productivity technology and generate less information, so their posterior uncertainty rises and future credit tightens via a belief-threshold lending rule—quantifies how this credit–learning feedback turns a temporary financial shock into a persistent credit crunch by comparing to an exogenous-uncertainty counterfactual, and shows the mechanism survives in capital (RBC-wedge) and New Keynesian extensions and in Bayesian estimation to U.S. macro/lending data (including a Great Recession interpretation)."

- title: "Huneeus and Rogerson (RES, 2024) - Heterogeneous Paths of Industrialization"
  file: "Huneeus_Rogerson_RES_2024.pdf"
  desc: "This note summarizes the paper, which documents heterogeneous (non-agriculture share, manufacturing employment share) industrialization paths in GGDC data, builds a three-sector structural-change model with subsistence in agriculture and manufacturing–services complementarity that generates a hump-shaped manufacturing share, calibrates the benchmark to U.S. 1880–1950 data, and then inverts the model country by country to infer the sectoral productivity-growth profiles consistent with observed employment shares—showing that cross-country differences in agricultural productivity growth explain most of the variation in the level and timing of peak manufacturing (“premature deindustrialization”)."

- title: "Bergeaud, Schmidt, and Zago (JFE, 2026) - Patents that match your standards: Firm-level evidence on competition, innovation and growth"
  file: "Bergeaud_Schmidt_Zago_JFE_2026.pdf"
  desc: "This note summarizes the paper, which links 7.5M U.S. patents to ~0.65M standards using TF-IDF cosine-similarity text matching to construct a firm-quarter “technological proximity to newly released standards” measure, validates the measure with patent-value/citations/renewal regressions, and estimates distributed lead–lag event-study panels with firm and NAICS3×time fixed effects to track abnormal returns and EPS revisions around the draft-release window and subsequent dynamics in sales, market share, and R&D (with heterogeneity by industry competitiveness), then aggregates to industry-level growth and convergence/citation-spillover tests showing temporary leader gains but longer-run follower catch-up and lower concentration."

- title: "Blickle, Parlatore, and Saunders (JF, 2026) - Specialization in Banking"
  file: "Blickle_Parlatore_Saunders_JF_2026.pdf"
  desc: "This note summarizes the paper, which uses U.S. supervisory Y-14Q C&I loan data (2012Q2–2023Q2) to construct bank–industry “excess/relative specialization” measures, estimates loan-level panel regressions with saturated bank-time and industry-time fixed effects (plus internal risk-rating, pricing/terms, relationship, and geography controls and SNC size heterogeneity) showing that loans originated in a bank’s specialized industries are less likely to become nonperforming, documents correlated rent-sharing in loan terms (larger, cheaper, longer—especially for unsecured borrowers), and extends to bank-level and deposit-shock exercises linking specialization to stability/profitability trade-offs and the industry allocation of COVID-era deposit inflows."

- title: "Ayyagari, Demirguc-Kunt, and Maksimovic (RFS, 2010) - Formal versus Informal Finance: Evidence from China"
  file: "Ayyagari_DemirgucKunt_Maksimovic_RFS_2010.pdf"
  desc: "This note summarizes the paper, which uses the 2003 World Bank Investment Climate Survey for ~2,400 Chinese firms (with 1999–2002 performance data) to compare formal bank finance versus informal/self-financing, estimates baseline city-fixed-effects regressions of sales growth, productivity growth, and profit reinvestment on bank-access measures, and addresses endogeneity with a Heckman-style treatment-effects/selection model and LIML-IV and propensity-score matching that instrument loan access with collateral availability (and government-help robustness and nonapplicant comparisons), concluding that bank finance is the financing margin most robustly associated with faster growth and reinvestment while external informal finance is not."

- title: "Levinsohn and Petrin (RES, 2003) - Estimating Production Functions Using Inputs to Control for Unobservables"
  file: "Levinsohn_Petrin_RES_2003.pdf"
  desc: "This note summarizes the paper, which extends the Olley–Pakes proxy-variable approach by using intermediate inputs (materials/electricity) instead of investment to proxy for unobserved productivity in a gross-output production function when investment is frequently zero, identifies the flexible non-proxy input coefficients in a first-stage partially linear regression after inverting a monotone intermediate-input demand function, identifies the proxy-input and capital coefficients in a second-stage GMM using lagged proxy inputs and predetermined capital as instruments (with monotonicity plots, proxy-invariance, and over-identification diagnostics), and applies the method to Chilean manufacturing plants to show OLS overstates variable-input elasticities and understates capital relative to LP."

- title: "Olley and Pakes (Econometrica, 1996) - The Dynamics of Productivity in the Telecommunications Equipment Industry"
  file: "Olley_Pakes_Econometrica_1996.pdf"
  desc: "This note summarizes the paper, which introduces the Olley–Pakes semiparametric production-function estimator by modeling firms’ dynamic investment and endogenous exit decisions, inverting a monotone investment policy to proxy for unobserved productivity in a partially linear first stage and using a survival-probability selection correction to identify capital and age coefficients in a second stage, and then applies the method to U.S. telecommunications equipment plants (1974–1987) to show that post-deregulation productivity growth comes mainly from reallocation (the OP mean-plus-covariance decomposition) rather than from rising average plant productivity or improved within-plant variable-input efficiency."

- title: "Khandelwal, Schott, and Wei (AER, 2013) - Trade Liberalization and Embedded Institutional Reform: Evidence from Chinese Exporters"
  file: "Khandelwal_Schott_Wei_AER_2013.pdf"
  desc: "This note summarizes the paper, which uses Chinese customs transaction data to study the 2005 abolition of MFA export quotas and implements a product×destination difference-in-differences design comparing quota-bound versus quota-free markets for the same HS product, tests an efficient auction-allocation benchmark by decomposing post-reform adjustment into incumbent versus entrant/adders/exiter market-share and price components (including Griliches–Regev and quality-adjusted price decompositions), and then calibrates counterfactual “auction” versus “political” quota allocation scenarios to show that most productivity gains come from dismantling the misallocating licensing institution (reallocation away from SOEs toward private entrants) rather than from removing the quota itself."

- title: "Hsieh and Klenow (QJE, 2009) - Misallocation and Manufacturing TFP in China and India"
  file: "Hsieh_Klenow_QJE_2009.pdf"
  desc: "This note summarizes the paper, which builds a monopolistic-competition model with plant-level output and capital wedges that implies TFPR should be equalized within narrowly defined industries, uses plant-level manufacturing data for China, India, and the United States to construct TFPQ/TFPR and back out implied marginal-product distortions, and then computes counterfactual aggregate manufacturing TFP gains from reallocating labor and capital to reduce TFPR dispersion (full equalization and “U.S.-efficiency” benchmarks) with extensive robustness and policy-diagnostics exercises."

- title: "Bartelsman, Haltiwanger, and Scarpetta (AER, 2013) - Cross-Country Differences in Productivity: The Role of Allocation and Selection"
  file: "Bartelsman_Haltiwanger_Scarpetta_AER_2013.pdf"
  desc: "This note summarizes the paper, which uses harmonized cross-country firm-level manufacturing moments (U.S., Western Europe, and transition economies) to document that the Olley–Pakes size–productivity covariance varies much more systematically across countries than dispersion measures, and then disciplines a heterogeneous-firm model with overhead labor, quasi-fixed capital, and endogenous entry/exit by running distortion-distribution counterfactuals calibrated to match each country’s covariance moment—showing how distortions weaken both allocation and selection and implying sizable cross-country consumption/productivity gaps."

- title: "Braguinsky, Ohyama, Okazaki, and Syverson (AER, 2015) - Acquisitions, Productivity, and Profitability: Evidence from the Japanese Cotton Spinning Industry"
  file: "Braguinsky_Ohyama_Okazaki_Syverson_AER_2015.pdf"
  desc: "This note summarizes the paper, which uses the universe of Japanese cotton-spinning plants (1896–1920) with physical output, prices, operating days, and service-flow inputs to estimate quantity-based TFP (TFPQ) and profitability (ROCE), implements within-plant event-study and within-deal DiD comparisons around acquisitions, decomposes post-acquisition profit gains into price margins versus input-intensity/utilization and productivity components, and links the mechanism to “demand management” using inventory/accrued-payment measures and network/engineer heterogeneity, interpreting the core tables and figures on why more profitable acquirers improve underutilized but not necessarily low-TFP targets."

- title: "Brandt, Tombe, and Zhu (RED, 2013) - Factor Market Distortions Across Time, Space and Sectors in China"
  file: "Brandt_Tombe_Zhu_RED_2012.pdf"
  desc: "This note summarizes the paper, which builds a province×ownership-sector allocation model with Cobb–Douglas production and CES aggregation to map observed labor/capital wedges (identified from value-product ratios and provincial price levels, with sectoral prices inferred from nominal shares) into efficient-versus-actual aggregate TFP for China’s non-agricultural economy (1985–2007), and then runs counterfactual decompositions that separate within-province state–nonstate versus between-province distortions and labor versus capital wedges—showing large average TFP losses and a post-1997 deterioration driven mainly by within-province capital misallocation toward the state sector."

- title: "Asker, Collard-Wexler, and De Loecker (JPE, 2014) - Dynamic Inputs and Resource (Mis)Allocation"
  file: "Asker_CollardWexler_DeLoecker_JPE_2014.pdf"
  desc: "This note summarizes the paper, which develops a dynamic investment model with time-to-build and fixed/convex adjustment costs to show that higher TFPR volatility mechanically generates higher cross-sectional dispersion in the static MRPK (even under efficient behavior), documents the prediction in multiple producer-level panels (within- and cross-country MRPK-dispersion-on-volatility regressions and firm-level MRPK responses to TFPR shocks), and then structurally estimates industry-country TFPR AR(1) processes and capital-adjustment-cost parameters (via minimum-distance matching of capital-change moments) to quantify how much observed MRPK dispersion the dynamic benchmark can explain."

- title: "Koijen and Yogo (JPE, 2019) - A Demand System Approach to Asset Pricing"
  file: "Koijen_Yogo_JPE_2019.pdf"
  desc: "This note summarizes the paper, which builds an equilibrium asset-pricing model with heterogeneous, characteristics-based investor demand estimated from 13F holdings (plus a residual household sector), instruments for endogenous prices/market equity using other investors’ investment-universe overlap × wealth (a counterfactual “equal-weight over feasible assets” market-equity shifter), and then uses the estimated demand system and market clearing to compute institution-level and aggregate price impact, variance decompositions of stock returns into supply/characteristics/AUM/latent-demand components, the role of large institutions in 2008 volatility, and return predictability from mean reversion in latent demand."

- title: "Garfinkel & Hammoudeh (RFS, 2025) Competition and Innovation Revisited: A Project-Level View"
  file: "Garfinkel_Hammoudeh_RFS_2025.pdf"
  desc: "This note summarizes the paper, which uses Cortellis pharmaceutical project-level data (2010–2021) and FDA Breakthrough Therapy Designation (BTD) awards as market-specific “unleveling” shocks, validates surprise with announcement-return event studies, and estimates Cox hazard/event-time designs for rivals’ phase-II→phase-III continuation that interact BTD shocks with therapeutic-market competition and technology overlap (SM vs. SMST) to recover an inverted-U competition–innovation response and a distance-to-frontier channel, complemented by manufacturing-scope benchmarks and resource-reallocation tests."

- title: "Gandhi, Navarro, and Rivers (JPE, 2020) - On the Identification of Gross Output Production Functions"
  file: "Gandhi_Navarro_Rivers_JPE_2020.pdf"
  desc: "This note summarizes the paper, which proves that standard proxy-variable/dynamic-panel methods generically fail to identify gross-output production functions when intermediate inputs are flexible, then introduces a new nonparametric identification strategy that uses the flexible-input first-order condition to estimate the intermediate-input elasticity from revenue shares via a share regression, integrates this elasticity to recover the production function up to an integration constant that is pinned down with lagged-input Markov moments (implemented with a two-step sieve estimator), and illustrates the approach in Monte Carlo simulations and Chilean/Colombian plant data."

- title: "De Loecker (Econometrica, 2011) - Product Differentiation, Multiproduct Firms, and Estimating the Impact of Trade Liberalization on Productivity"
  file: "DeLoecker_Econometrica_2011.pdf"
  desc: "This note summarizes the paper, which combines Belgian textile production data with firm-level product mix and EU quota-liberalization exposure to embed a segment-level demand system inside a (multi-product) production-function framework, estimates demand-contaminated revenue equations with rich product/product-group and protection controls and a timing restriction (current quotas shift prices/demand, lagged quotas shift productivity), and then uses OP/LP-style proxy estimators (materials or investment controls) to recover corrected physical productivity and re-estimate the true productivity impact of quota removal—showing standard revenue-based methods substantially overstate the gains."

- title: "De Loecker & Warzynski (AER, 2012) - Markups and Firm-Level Export Status"
  file: "DeLoecker_Warzynski_AER_2012.pdf"
  desc: "This note summarizes the paper, which develops a production-function-based markup estimator from a flexible-input cost-minimization FOC (μ=θX/αX), estimates firm- and time-varying output elasticities with an OP/LP/ACF-style control-function approach (using materials to proxy for unobserved productivity and a second-stage productivity law of motion with moment conditions), corrects input expenditure shares using first-stage residuals, and applies the method to Slovenian manufacturing to run cross-sectional and within-firm export-entry regressions of log markups (plus robustness to unobserved prices and destination-market decompositions)."

- title: "Collard-Wexler & De Loecker (AER, 2015) - Reallocation and Technology: Evidence from the US Steel Industry"
  file: "CollardWexler_DeLoecker_AER_2015.pdf"
  desc: "This note summarizes the paper, which uses U.S. Census steel plant data (1963–2002) to estimate technology-specific production functions with Olley–Pakes investment/selection corrections and plant-specific output/input price deflators, quantifies the minimill productivity premium, and decomposes aggregate TFP growth into within-plant improvement, within-technology and between-technology reallocation (Olley–Pakes covariance and entry/exit terms), complemented by De Loecker–Warzynski markup estimates to link minimill diffusion to intensified competition and incumbent (integrated-plant) selection."

- title: "Koijen & Yogo (AER: Insights, 2023) - Understanding the Ownership Structure of Corporate Bonds"
  file: "Koijen_Yogo_AERInsights_2023.pdf"
  desc: "This note summarizes the paper, which combines long-run institutional holdings data (Financial Accounts and NAIC portfolios) with a two-period equilibrium asset-pricing model featuring leverage-constrained households/institutions and risk-based-capital regulation for insurers, shows how leverage constraints flatten the security market line so low-beta assets earn positive alpha that insurers can lever via underwriting (annuities), derives the resulting optimal insurer tilt toward investment-grade corporate bonds (and comparative statics for downgrades and life vs. P&C behavior), and interprets the four core descriptive figures on corporate-bond ownership, portfolio composition, rating-bucket tilts, and time-varying portfolio credit risk."

- title: "Gabaix & Koijen (JPE, 2024) - Granular Instrumental Variables"
  file: "Gabaix_Koijen_JPE_2024.pdf"
  desc: "This note summarizes the paper, which develops “granular instrumental variables” by isolating idiosyncratic shocks to large entities in a factor-structured panel, constructs the optimal GIV as the size vector projected orthogonally to common-factor loadings (collapsing to size-weighted minus equal-weighted outcomes in the one-factor case), and shows how to use the resulting instrument in IV/OLS moment conditions to identify supply–demand elasticities, pass-through, and extensions with controls, recoverable factors, and heterogeneous elasticities."

- title: "Koijen & Yogo (JPE, forthcoming) - Exchange Rates and Asset Prices in a Global Demand System"
  file: "Kojien_Yogo_ForthcomingJPE.pdf"
  desc: "This note summarizes the paper, which estimates a global nested-logit asset demand system for 37 countries (2003–2020) across short-term debt, long-term debt, and equity using international portfolio holdings and an expected-return index that depends on asset prices and real exchange rates, identifies within-asset-class demand elasticities with a gravity-driven residual-supply IV (predicted demand from other investors based on distance/home bias minus predicted supply based on country size) and identifies across-asset-class substitution with home-bias–shifted outside weights, then uses market clearing to recover latent demand and perform variance decompositions and crisis/convenience-yield counterfactuals for exchange rates, yields, and equity prices."

- title: "Lauermann & Wolinsky (RES, 2026) - Auctions with Frictions: Recruitment, Entry, and Limited Commitment"
  file: "Lauermann_Wolinsky_RES_2016.pdf"
  desc: "This note summarizes the paper, which develops a theoretical first-price auction model with costly bidder recruitment (Poisson contacts), costly bidder entry (paid to learn values), and limited seller commitment, compares participation-observable (PO) versus participation-unobservable (PU) environments, characterizes equilibrium recruitment/entry as fixed points of bidders’ break-even participation threshold and the seller’s marginal-revenue condition (yielding PO uniqueness but PU multiplicity with an always-present no-trade equilibrium), and uses the model’s comparative statics and welfare benchmark to interpret when transparency increases revenue/trade versus when hidden participation acts as an endogenous commitment device."

- title: "David, Hopenhayn, and Venkateswaran (QJE, 2016) - Information, Misallocation, and Aggregate Productivity"
  file: "David_Hopenhayn_Venkateswaran_QJE_2016.pdf"
  desc: "This note summarizes the paper, which embeds noisy firm learning and noisy rational-expectations stock prices into a heterogeneous-firm GE model to make residual uncertainty V a sufficient statistic for informational misallocation, identifies V by matching production-side moments with stock-market moments (the cross-sectional correlations of lagged returns with future fundamentals and with investment, plus return volatility), quantifies implied TFP/output losses for the U.S., China, and India under “capital-only” versus “capital-and-labor” information frictions, and validates the inferred uncertainty measure using I/B/E/S-guidance forecast errors and macro micro-uncertainty benchmarks."

- title: "Brown, Martinsson, and Thomann (RFS, 2022) - Can Environmental Policy Encourage Technical Change? Emissions Taxes and R&D Investment in Polluting Firms"
  file: "Brown_Martinsson_Petersen_RFS_2022.pdf"
  desc: "This note summarizes the paper, which combines OECD country-year SOx emissions-tax variation (1990–2012) with a pre-determined industry SOx-intensity measure (Levinson 1987 U.S. emissions) to implement a Rajan–Zingales-style differential-exposure DiD in firm-year panels (firm FE + country-year and industry-year controls, plus event-time lead/lag checks), then tests whether the response is “first-face” invention or “second-face” absorptive/process R&D using PATSTAT triadic/clean patents, process-R&D and spillover-sector subsamples, and market-value regressions for the marginal value of R&D."

- title: "Mann (JFE, 2018) - Creditor Rights and Innovation: Evidence from Patent Collateral"
  file: "Mann_JFE_2018.pdf"
  desc: "This note summarizes the paper, which uses USPTO patent-collateral (security-interest) filings matched to NBER/Compustat to measure patent pledgeability, and exploits four federal court decisions (2002/2003/2007/2009) that increased the relevance of state secured-transactions law—creating a Delaware-versus-non-Delaware stacked DiD/event-study—to identify how stronger creditor rights to patents raise firms’ debt capacity, R&D spending, and (lagged) patenting, supported by heterogeneity/placebo tests (no-patent firms; trademarks) and citation-weighted output dynamics."

- title: "Terry, Chaney, Burchardi, Tarquinio, & Hassan (AER, 2026) - Immigration, Innovation, and Growth"
  file: "Terry_Chaney_Burchardi_Tarquinio_Hassan_AER_2026.pdf"
  desc: "This note summarizes the paper, which studies U.S. counties (1975–2010) using a two-step predicted-ancestry shift-share instrument—first predicting preexisting ancestry from historical 1880–1930 push–pull migration forces with leave-out restrictions, then interacting predicted ancestry with contemporaneous national inflows by origin to instrument county immigration—estimates county–five-year difference regressions and IHS elasticities for patenting and wages with extensive randomization/inference checks, and disciplines a quantitative regional endogenous-growth migration model by matching the innovation–immigration elasticity to run counterfactuals for innovation and output."

- title: "Iaria, Schwarz, and Waldinger (QJE, 2018) - Frontier Knowledge and Scientific Production: Evidence from the Collapse of International Science"
  file: "Iaria_Schwarz_Waldinger_QJE_2018.pdf"
  desc: "This note summarizes the paper, which uses WWI and the postwar Allied boycott as a geopolitical shock that collapsed cross-camp scientific exchange, documents the first stage with paper-level citation-share regressions (home vs. inside-camp vs. outside-camp) and LSA title-similarity measures, and then estimates a shift-share-style scientist-year DiD/event study that interacts post-1914 with field–country prewar reliance on frontier (top 1%/3%/5%) foreign research to identify causal effects on publications, Nobel-level output, and novel (patent-relevant) scientific words."

- title: "Zacchia (RES, 2020) - Knowledge Spillovers through Networks of Scientists"
  file: "Zacchia_RES_2020.pdf"
  desc: "This note summarizes the paper, which builds a firm-to-firm scientist network from inventor co-patenting histories to construct a connection-weighted external R&D stock, estimates firm-year production-function regressions with firm and year fixed effects, and identifies causal knowledge spillovers using a network-distance IV that instruments neighbors’ R&D with the R&D of sufficiently distant “indirect friends” (preferred distance 3), complemented by System GMM and social-return calculations."

- title: "Akcigit, Hanley, and Serrano-Velarde (RES, 2021) - Back to Basics: Basic Research Spillovers, Innovation Policy, and Growth"
  file: "Akcigit_Hanley_Serrano_Velarde_RES_2021.pdf"
  desc: "This note summarizes the paper, which builds a multi-industry Schumpeterian growth model distinguishing basic vs. applied R&D, identifies cross-industry spillovers from French firm-level R&D survey data (2000–2006) using Tobit regressions of basic-research intensity on multi-industry scope and an IV based on 1980s state-led conglomeration, disciplines within-industry spillovers and cooldown with patent-citation moments, structurally estimates the full GE model by simulated method of moments, and runs planner/subsidy counterfactuals showing large welfare gains from heavily subsidizing basic research relative to applied."

- title: "Accominotti, Albers, and Oosterlinck (RFS, 2024) - Selective Default Expectations"
  file: "Accominotti_Albers_Oosterlinck_RFS_2024.pdf"
  desc: "This note summarizes the paper, which exploits identical sterling Dawes bonds traded in London versus continental markets and the June-1934 transfer moratorium/affidavit rules that segmented secondary markets to identify selective-default expectations, decomposes cross-market yield spreads into default-versus-liquidity components using a simple risk-neutral pricing framework (with Roll-implied bid–ask spreads), validates segmentation with Jordà local projections, and traces creditor-specific news effects with event-study and difference-in-differences specifications."

- title: "Bisetti, Li, & Yu (RFS, 2024) - The Technical Default Spread"
  file: "Bisetti_Li_Yu_RFS_2024.pdf"
  desc: "This note summarizes the paper, which combines a calibrated macro–finance model with endogenous loan covenants that shift control rights to lenders in technical default with an empirical design that constructs DealScan-based covenant strictness (ex ante breach probability) and tests its pricing and real effects using strictness-sorted portfolios and Fama–MacBeth regressions, an RDD around covenant-threshold violations, and macro-risk exposure/sensitivity regressions for investment, profitability, and cash flows."

- title: "Bartram, Conrad, Lee, and Subrahmanyam (RFS, 2022) - Credit Default Swaps around the World"
  file: "Bartram_Conrad_Lee_Subrahmanyam_RFS_2022.pdf"
  desc: "This note summarizes the paper, which extends the Bolton–Oehmke “empty creditor” framework by adding legal uncertainty about CDS trigger-event recognition and then uses Markit-based CDS introductions for 56k+ nonfinancial firms in 51 countries (2001–2015) to estimate propensity-score overlap-weighted panel regressions of leverage (and investment) on CDS introduction interacted with creditor-rights, liquidation, property-rights, and ownership-concentration measures—backed by covariate-balance and omitted-variable sensitivity checks—to show CDS trading raises debt capacity most where local bankruptcy/enforcement regimes make creditor control and recoveries more effective."

- title: "Ding, Xiong, and Zhang (JFE, 2022) - Issuance Overpricing of China’s Corporate Debt Securities"
  file: "Ding_Xiong_Zhang_JFE_2022.pdf"
  desc: "This note summarizes the paper, which documents systematic issuance overpricing in China’s interbank CP/MTN market by comparing issuance spreads to first-trade spreads (and benchmarked excess returns), and traces the mechanism to underwriter repeat-business incentives using underwriter-switching regressions, difference-in-differences/event-time tests around the October 2017 rebate ban (central-SOE/Big-Four treatment splits), and confidential auction-allocation evidence plus regressions linking overpricing to underwriter self-purchases/overbidding and post-ban improvements in issuance-price “quality” (R^2)."

- title: "Allen, Qian, Tu, and Yu (JFE, 2019) - Entrusted Loans: A Close Look at China’s Shadow Banking System"
  file: "Allen_Qian_Tu_Yu_JFE_2019.pdf"
  desc: "This note summarizes the paper, which hand-collects transaction-level entrusted loans from mandatory annual-report disclosures for Chinese listed nonfinancial firms (2004–2013), distinguishes affiliated (support/ICM) versus nonaffiliated (arm’s-length) lending, compares loan rates to official bank benchmarks and lenders’ own bond funding costs, estimates firm-year logit/Tobit models of who lends, loan-level spread regressions and ex post logit performance tests to assess risk-based pricing, and market-model event studies (with a Heckman announcement-selection correction) to evaluate shareholder value effects.        "

- title: "Xu (QJE, 2022) - Reshaping Global Trade: The Immediate and Long-Run Effects of Bank Failures"
  file: "Xu_QJE_2022.pdf"
  desc: "This note summarizes the paper, which digitizes Bank of England discount-window loan records to construct a location-level Bartik exposure to the 1866 London bank failures (pre-crisis bank shares × failure), estimates short-run export contractions using country- and within-country port-level DiD/event-study regressions on Lloyd’s List shipping flows and extensive-margin entry/exit outcomes, and traces decades-long trade hysteresis with dynamic bilateral market-share (gravity) regressions with destination-year fixed effects plus indirect-exposure re-sourcing tests and a structural-gravity interpretation."

- title: "Amiti and Weinstein (JPE, 2018) - How Much Do Idiosyncratic Bank Shocks Affect Investment? Evidence from Matched Bank-Firm Loan Data"
  file: "Amiti_Weinstein_JPE_2018.pdf"
  desc: "This note summarizes the paper, which uses matched Japanese bank–firm loan data to estimate time‐varying bank loan-supply and firm borrowing shocks via a lagged-loan-weighted fixed-effects decomposition of percentage loan growth (with an explicit correction for new lending relationships so the estimated shocks aggregate exactly to bank, firm, and macro lending), and then links these shocks to firm investment using loan-share-weighted exposure regressions and to aggregate lending/investment using market-share-weighted “granular bank shock” decompositions."

- title: "Bigio & La’O (QJE, 2020) - Distortions in Production Networks"
  file: "Bigio_LaO_QJE_2020.pdf"
  desc: "This note summarizes the paper, which develops a static multisector production-network model with sectoral distortion wedges, proves a Hulten-like theorem showing distortions affect the aggregate labor wedge (not TFP) at first order with Domar weights (and Leontief-inverse/network-centrality in the Cobb–Douglas case), and quantifies 2008–09 amplification by mapping Gilchrist–Zakrajsek credit spreads into sector wedges using BEA input–output tables and benchmarking the network economy against a horizontal counterfactual while interpreting the core tables and figures on bottlenecks and the ≈2 labor-wedge network multiplier."

- title: "Clayton, Dos Santos, Maggiori, & Schreger (AER, 2025) - Internationalizing Like China"
  file: "Clayton_DosSantos_Maggiori_Schreger_AER_2025.pdf"
  desc: "This note summarizes the paper, which combines new foreign-holdings and investor-entry datasets for China’s onshore bond market (COFER/CPIS-style reserves and portfolio data plus monthly QFII/RQFII/CIBM Direct/Bond Connect rosters matched to investor types) with security-level mutual-fund/ETF portfolios to compute RMB “DM-likeness” correlation statistics, and develops a dynamic reputation model with stable vs. flighty investors and crisis-time capital-control incentives to rationalize China’s gradual opening and the V-shaped 2015–2016 capital-flight episode."

- title: "Acharya and Xu (JFE, 2017) - Financial Dependence and Innovation: The Case of Public versus Private Firms"
  file: "Acharya_Xu_JFE_2017.pdf"
  desc: "This note summarizes the paper, which links S&P Capital IQ private/public firm data to the NBER patent citation database to compare innovation inputs and outputs, constructs Rajan–Zingales-style industry external finance dependence and matches private firms to similar public firms, estimates panel regressions and Heckman-style treatment-effect models with the key Public × EFD heterogeneity, and then provides quasi-experimental causal evidence using a fuzzy regression discontinuity around Nasdaq delisting thresholds (plus REM, competition, and analyst-coverage mechanism tests)."

- title: "Azoulay, Graff Zivin, Li, and Sampat (RES, 2019) - Public R&D Investments and Private-sector Patenting: Evidence from NIH Funding Rules"
  file: "Azoulay_Zivin_Li_Sampat_RES_2019.pdf"
  desc: "This note summarizes the paper, which links NIH grants (1980–2005) to publications and downstream life-science patents (1980–2012) via a grant→PubMed→USPTO bibliometric bridge (including a broader PubMed “related-article” mapping), aggregates activity into disease–science–time (DST) cells, and estimates fixed-effects and 2SLS models that instrument DST funding with quasi-random “windfall” variation created by NIH payline rules to identify the causal effect of public biomedical R&D on private-sector patenting, spillovers, and crowd-out."

- title: "Li (RFS, 2011) - Constraints, R&D Investment, and Stock Returns"
  file: "Li_RFS_2011.pdf"
  desc: "This note summarizes the paper, which extends a multi-stage R&D investment model by adding external financing constraints (pledgeability p(n)) to derive suspension/continuation thresholds and an interaction prediction for risk premia, and then tests it in Compustat–CRSP data (1975–2007) using Fama–MacBeth interaction regressions and double/triple portfolio sorts across multiple financial-constraint proxies (e.g., KZ/WW/SA, size, age) and multiple R&D-intensity measures, interpreting the core tables and figures on the joint pricing of constraints and R&D."

- title: "Tham, Baslandze, Sojli, & Liu (JFE, 2026)- Foundational Processes and Growth"
  file: "Tham_Baslandze_Sojli_Liu_JFE_2026.pdf"
  desc: "This note summarizes the paper, which develops a simple innovation-and-growth model distinguishing product innovation from two types of process innovation (cost-reducing vs. foundational), builds a 1900–2020 patent-text dataset to classify product vs. process patents using titles/claim preambles and then identifies “foundational” processes via within-firm TF–IDF cosine-similarity ratios to past versus future product patents (top-20% threshold), and tests the framework using local-projection firm-growth regressions on market-value–weighted patent stocks (CRSP–Compustat/Kogan values) plus cross-country GDP/TFP growth and product-quality evidence (including FDA Orange Book drug outcomes).        "

- title: "Naaraayanan and Wolfenzon (RFS, 2024) - Business Group Spillovers"
  file: "Naaraayanan_Wolfenzon_RFS_2024.pdf"
  desc: "This note summarizes the paper, which exploits the staggered construction of India’s Golden Quadrilateral highway upgrades as a common investment-opportunity shock and estimates standalone-firm difference-in-differences and dynamic event-study regressions that interact PostGQ with local business-group prevalence (HighBGS), then tests a financing-channel mechanism using borrower fixed-effect loan-supply regressions that relate banks’ post-upgrade lending changes to their pre-upgrade exposure to group-affiliated firms, alongside extensive pretrend/horse-race and alternative-mechanism robustness checks."

- title: "Griffin, Kruger, & Mahajan (JFE, 2026) - Did Pandemic Relief Fraud Inflate House Prices?"
  file: "Griffin_Kruger_Mahajan_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses loan-level PPP fraud flags to construct ZIP-level suspicious-lending-per-capita shocks and then estimates borrower-level DiD/event studies for home purchases and moving, county-FE ZIP-level house-price-growth regressions with 5-mile neighborhood measures plus synthetic-control and social-network IV designs, and complementary event-time analyses of housing-market tightness, vehicle purchases, consumer spending/mobility, and regional inflation to interpret the mechanism and reversal of fraud-driven demand."

- title: "Mayordomo, Pavanini, & Tarantino (RFS, 2026) - The Impact of Bank Consolidation on Credit Supply and Performance"
  file: "Mayordomo_Pavanini_Tarantino_RFS_2026.pdf"
  desc: "This note summarizes the paper, which exploits Spain’s 2009–2011 regulator-induced savings-bank consolidation to compare full mergers (M&As) versus SIP business groups, estimates bank–firm difference-in-differences/event-time regressions (credit growth, loan-rate spreads, application rejections, and NPLs) using a historical 1995 “credit overlap” instrument for consolidation form, and then fits a structural bank model with borrower demand, endogenous screening/acceptance, and default to recover screening-cost efficiencies and market-power effects and run counterfactual decompositions."

- title: "Tombe and Zhu (AER, 2019) - Trade, Migration, and Productivity: A Quantitative Analysis of China"
  file: "Tombe_Zhu_AER_2019.pdf"
  desc: "This note summarizes the paper, which combines a two-sector (ag/non-ag) multi-province Eaton–Kortum trade model with intermediate inputs and land plus a Fréchet-choice migration block that embeds hukou and local land-income rebates as a flow migration wedge, estimates the migration elasticity κ from census migration shares using IVs (neighbor-income and Bartik expected-income), inverts bilateral trade and migration costs from interregional trade shares (Head–Ries) and migration shares, and then uses hat-algebra counterfactuals to decompose China’s 2000–2005 labor-productivity growth into internal trade, external trade, and migration reforms (and to evaluate land-reform and further-liberalization scenarios).        "

- title: "Müller & Verner (RES, 2024) - Credit Allocation and Macroeconomic Fluctuations"
  file: "Muller_Verner_RES_2024.pdf"
  desc: "This note summarizes the paper, which builds a new long-run cross-country sectoral private credit database (117 countries, 1940–2014), defines major credit booms from detrended credit-to-GDP and classifies booms by tradable vs non-tradable credit shares, estimates sector-level reallocation regressions (including within-country-year interactions), event-study DiD paths around boom starts, and panel local projections / medium-run growth regressions plus banking-crisis prediction models to show that boom-time credit growth tilted toward households and non-tradables predicts medium-run GDP slowdowns and systemic crises whereas tradable-sector credit growth does not (and instead aligns with stronger future productivity).        "

- title: "Asriyan, Laeven, Martin, Van der Ghote, & Vanasco (RES, 2025) - Falling Interest Rates and Credit Reallocation: Lessons from General Equilibrium"
  file: "Asriyan_Laeven_Martin_Vander_Ghote_Vanasco_RES_2025.pdf"
  desc: "This note summarizes the paper, which builds a small-open-economy general-equilibrium model with heterogeneous entrepreneurs facing borrowing constraints and an imperfectly elastic supply of collateralizable capital (land/real estate), extends it dynamically with wealth accumulation and a constrained-planner benchmark to show that persistent rate declines can misallocate capital and reduce output, calibrates the mechanism to the long-run U.S. real-rate decline, and tests its key cross-firm prediction in Compustat using 2SLS/local-projection investment regressions that instrument MSA house-price growth with interest-rate changes interacted with Saiz (2010) housing-supply elasticity."

- title: "Begenau, Bigio, Majerovitz, & Vieyra (RES, 2026) - A Q-Theory of Banks"
  file: "Begenau_Bigio_Majerovitz_Vieyra_RES_2026.pdf"
  desc: "This note summarizes the paper, which develops and structurally estimates a dynamic Q-theory model of bank leverage under delayed loan-loss recognition (separating fundamental, book, and market equity) using U.S. publicly traded BHC data (FR Y-9C + CRSP, 1990Q3–2021Q1) to identify idiosyncratic net-worth shocks from factor-residual excess returns and estimate distributed-lag IRFs for Tobin’s Q, leverage, and liabilities, match these moments in an SMM estimation of the recognition-speed and liquidation/regulatory constraints, and run micro-/macroprudential counterfactuals (accounting-speed reforms vs CCyB)."

- title: "Jiang, Vayanos, and Zheng (RFS, 2025) - Passive Investing and the Rise of Mega-Firms"
  file: "Jiang_Vayanos_Zheng_RFS_2025.pdf"
  desc: "This note summarizes the paper, which builds a mean–variance equilibrium with unconstrained experts (active investors) and index-constrained non-experts (passive investors) with optional noise traders, derives a closed-form affine price decomposition and comparative statics showing an idiosyncratic-supply amplification channel that makes passive flows disproportionately reprice mega-firms, quantifies the mechanism in a calibration with a power-law firm-size distribution and partial-index counterfactuals, and validates the key predictions using S&P500 passive-flow predictability and idiosyncratic-volatility regressions (with an S&P600 placebo).        "

- title: "Altavilla, Ellul, Pagano, Polo, & Vlassopoulos (JFE, 2025) - Loan Guarantees, Bank Lending and Credit Risk Reallocation"
  file: "Altavilla_Ellul_Pagano_Polo_Vlassopoulos_JFE_2025.pdf"
  desc: "This note summarizes the paper, which studies euro-area COVID-19 loan guarantee programs by combining a simple renegotiation/bargaining model of guarantee-driven risk transfer with granular AnaCredit loan-level data and ECB supervisory bank data, and empirically identifies credit substitution using a Khwaja–Mian-style within-firm across-bank design (firm and bank fixed effects) that regresses the change in each bank’s non-guaranteed exposure on its guaranteed-loan intensity, extended to interest-rate and maturity outcomes, borrower/bank heterogeneity, and robustness checks (e.g., excluding maturing loans and splitting callable vs. non-callable credit) to interpret the core tables and figures on partial crowd-out and contract-term concessions."

- title: "Altavilla, Boucinha, Burlon, Giannetti, & Schumacher (JFE, 2025) - Central Bank Liquidity Reallocation and Bank Lending: Evidence from the Tiering System"
  file: "Altavilla_Boucinha_Burlon_Giannetti_Schumacher_JFE_2025.pdf"
  desc: "This note summarizes the paper, which exploits the ECB’s 2019 tiered reserve remuneration reform as a quasi-natural experiment by constructing bank-level treatment intensity from unused exemption allowances, estimating difference-in-differences/event-time regressions for excess-liquidity accumulation and money-market reallocation, and then identifying causal loan-supply effects with matched bank–firm data using borrower-time (and bank–firm) fixed effects plus mechanism and heterogeneity tests, interpreting the core tables and figures on reserve redistribution, balance-sheet rebalancing, and credit expansion."

- title: "Coppola (RFS, 2025) - In Safe Hands: The Financial and Real Impact of Investor Composition over the Credit Cycle"
  file: "Coppola_RFS_2025.pdf"
  desc: "This note summarizes the paper, which links NAIC insurer and Morningstar fund/ETF holdings to TRACE (and S&P Global abroad) bond prices to measure crisis drawdowns in duration-hedged excess returns, estimates within-issuer event-by-characteristics fixed-effects regressions of log drawdowns on pre-crisis insurer share, strengthens identification with a primary-market allocation shift-share IV based on large insurers’ issuance purchases (and non-U.S. proxy tests using 1−fund share), and aggregates ownership to the firm level to run instrumented event-study DiD specifications showing safer investor bases preserve issuance, lower offering yields, and raise crisis investment."

- title: "Gulen, Ion, Jens, & Rossi (RFS, 2024) - Credit Cycles, Expectations, and Corporate Investment"
  file: "Gulen_Ion_Jens_Rossi_RFS_2024.pdf"
  desc: "This note summarizes the paper, which uses IBES long-term earnings-growth forecasts to construct firm-level predictable forecast errors from rolling regressions of future forecast errors on lagged forecast revisions, aggregates them into a debt-issuance–weighted macroPFE index that closely tracks and predicts credit-market sentiment, estimates panel local-projection impulse responses of corporate investment and debt issuance (with firm fixed effects and rich firm/macro controls) plus cross-sectional tercile-interaction and financial-constraints tests, and rationalizes the boom–bust reversals with a Q-theory model featuring diagnostic expectations by both managers and credit investors and risky-debt credit-supply effects."

- title: "Kehrig and Vincent (RES, 2026) - Good Dispersion, Bad Dispersion"
  file: "Kehrig_Vincent_RES_2026.pdf"
  desc: "This note summarizes the paper, which uses U.S. Census plant-level manufacturing data to decompose dispersion in marginal revenue products and investment within vs. between multi-plant firms, exploits within-firm geographic distance as a proxy for internal-capital-market frictions in reduced-form regressions, and calibrates a two-plant dynamic model with lumpy adjustment costs and costly external finance (varying an internal-friction parameter) to show that better internal capital markets can raise both output and within-firm dispersion (“good dispersion”), with implications for cross-country misallocation accounting."

- title: "Cui, Wright, & Zhu (JPE, 2025) - Endogenous Liquidity and Capital Reallocation"
  file: "Cui_Wright_Zhu_JPE_2025.pdf"
  desc: "This note summarizes the paper, which constructs Compustat-based aggregate measures of used-capital reallocation (full vs. partial sales) and documents their long-run/cyclical comovement with inflation, estimates firm- and state-level fixed-effects regressions linking cash holdings to the likelihood and size of full acquisitions and linking inflation to lower liquid balances, and then builds and calibrates a monetary search-and-bargaining model with money-and-credit liquidity constraints in the secondary capital market to match these moments and run business-cycle and policy/welfare counterfactuals for reallocation, TFP, and prices."

- title: "Peters (Econometrica, 2020) - Heterogeneous Markups, Growth, and Endogenous Misallocation"
  file: "Peters_Econometrica_2020.pdf"
  desc: "This note summarizes the paper, which builds a tractable endogenous-growth model with Bertrand competition and quality-ladder innovation that endogenously generates a Pareto markup distribution pinned down by the churning-to-own-innovation ratio, measures markup and employment life-cycle moments from Indonesian manufacturing census data using De Loecker–Warzynski-style factor-share markups, calibrates the model to match these moments plus entry and aggregate growth, and runs counterfactual changes in entry/expansion frictions to quantify the joint implications for misallocation, labor shares, and growth."

- title: "Varela (RES, 2018) - Reallocation, Competition, and Productivity: Evidence from a Financial Liberalization Episode"
  file: "Varela_RES_2018.pdf"
  desc: "This note summarizes the paper, which exploits Hungary’s 2001 removal of foreign-exchange controls as a natural experiment, estimates firm-level first-differenced difference-in-differences comparing domestic versus foreign-owned manufacturers (APEH census panel) plus a Rajan–Zingales financial-dependence triple-difference, measures revenue TFP via Olley–Pakes and markups via the production-elasticity/labor-share wedge, complements the core design with BEEPS survey regressions on financing terms and innovation, and decomposes aggregate RTFP growth into within-firm versus reallocation components."

- title: "Boehm & Oberfield (QJE, 2020) - Misallocation in the Market for Inputs: Enforcement and the Organization of Production"
  file: "Boehm_Oberfield_QJE_2020.pdf"
  desc: "This note summarizes the paper, which uses Indian ASI plant-level input–output data and cross-state High Court congestion (instrumented by the High Court’s age) to estimate reduced-form regressions on materials shares, input mix, and vertical span, then structurally recovers enforcement wedges in a “recipes” model by clustering plants into common input-mix recipes and identifying distortions from within-recipe first-moment cost-share restrictions, and finally runs network counterfactuals that translate improved enforcement into sizable aggregate manufacturing productivity gains."

- title: "Baqaee & Farhi (QJE, 2020)- Productivity and Misallocation in General Equilibrium"
  file: "Baqaee_Farhi_QJE_2020.pdf"
  desc: "This note summarizes the paper, which derives a first-order general-equilibrium aggregation theorem for productivity and wedge/markup shocks in distorted production networks using producer-level envelope conditions (implying cost-based Domar weights and a distortion-adjusted Solow residual), develops second-order “distance-to-frontier” misallocation formulas in nested CES economies, and illustrates the framework with a U.S. application that combines BEA input–output tables with Compustat-based firm markup series (imputing firm-level networks) to decompose 1997–2015 aggregate TFP growth into pure-technology versus allocative-efficiency components."

- title: "Duval, Hong, and Timmer (RFS, 2020)- Financial Frictions and the Great Productivity Slowdown"
  file: "Duval_Hong_Timmer_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses a cross-country ORBIS firm panel and a Lehman-era long-difference DiD design that treats pre-crisis rollover risk (debt maturing in 2008 scaled by sales) as predetermined exposure, strengthens credit-supply identification with interactions using Lehman-window bank CDS jumps (country-level and firm–creditor-bank matched), measures within-firm TFP via Wooldridge (2009) GMM production-function residuals, and tests the innovation channel with intangible-investment and patenting regressions plus placebo/robustness checks while interpreting the core tables and figures on persistent post-crisis TFP hysteresis."

- title: "Choi, Tian, Wu, & Kargar (JFE, 2025) - Investor demand, firm investment, and capital misallocation"
  file: "Choi_Tian_Wu_Kargar_JFE_2025.pdf"
  desc: "This note summarizes the paper, which embeds a Koijen–Yogo–style equity demand system (logit portfolio weights with latent “excess demand” shocks) into a dynamic corporate finance model of investment and payout/issuance/repurchase choices, estimates demand parameters via indirect inference (matching an auxiliary holdings-on-characteristics regression) and firm-side parameters via simulated method of moments, and then uses the estimated equilibrium to run counterfactual no-excess-demand misallocation accounting (dispersion in log(MPK) and TFP-loss)."

- title: "Chen, Jiang, Liu, Suárez Serrato & Xu (RES, 2023) - Tax Policy and Lumpy Investment Behaviour: Evidence from China’s VAT Reform"
  file: "Chen_Jiang_Liu_Suarez_Serrato_Xu_RES_2023.pdf"
  desc: "This note summarizes the paper, which exploits China’s unexpected nationwide 2009 switch from a production- to consumption-based VAT on equipment as a quasi-experiment (domestic firms treated vs. foreign firms in encouraged industries already eligible), estimates event-study and firm-FE DiD effects on both extensive and intensive investment margins with placebo/triple-difference validation, and then disciplines a dynamic lumpy-investment model with partial irreversibility plus convex and fixed adjustment costs by estimating profit/shock processes via system GMM and frictions via method of simulated moments to run counterfactual tax-reform simulations and interpret the core tables and figures on inaction regions, investment spikes, and policy effectiveness."

- title: "Bau & Matray (Econometrica, 2023) - Misallocation and Capital Market Integration: Evidence from India"
  file: "Bau_Matray_Econometrica_2023.pdf"
  desc: "This note summarizes the paper, which exploits India’s staggered 2001/2006 foreign-capital liberalization at the 5-digit industry level as a natural experiment, measures ex ante constraints using pre-reform MRPK (Revenue/K) and estimates firm- and year-fixed-effects heterogeneous DiD/event-study regressions of capital, revenues, wages, and MRPK on Reform × HighMRPK, validates the financing channel with first-stage evidence on foreign funding and investment, and maps the micro reallocation into conservative aggregate productivity effects using a Solow-residual/wedge-change decomposition and a lower-bound aggregation strategy."

- title: "Bloom, Draca, and Van Reenen (RES, 2016) - Trade Induced Technical Change? The Impact of Chinese Imports on Innovation, IT and Productivity"
  file: "Bloom_Draca_Van_Reenen_RES_2016.pdf"
  desc: "This note summarizes the paper, which uses Amadeus firm/plant panels for 12 European countries matched to EPO patents and Harte Hanks IT to estimate long-difference (firm FE) regressions of within-firm patenting, computers-per-worker, and TFP on changes in Chinese import penetration, identifies the trade shock with WTO-driven textile/apparel quota abolition (quota-coverage IV) and an “initial-conditions” IV based on lagged Chinese comparative advantage, and quantifies both within-firm upgrading and between-firm reallocation/exit using employment–survival interaction specifications and an aggregate decomposition."

- title: "Li, Lin, and Xu (RFS, 2020) - Political Investment Cycles of State-Owned Enterprises"
  file: "Li_Lin_Xu_RFS_2020.pdf"
  desc: "This note summarizes the paper, which uses a 25-country Amadeus firm-year panel of SOEs and matched non-SOEs around 82 national elections (2001–2015) to estimate firm- and year-fixed-effects election-year DiD/SUR investment regressions with close-election and fixed-timing interactions plus placebo and incumbent-incentive falsification tests, and then traces the mechanism with parallel bank-loan issuance and employment-growth specifications to show a politically induced SOE investment cycle financed through state-dominated banking systems."

- title: "Ma (RFS, 2025) - Technological Obsolescence"
  file: "Ma_RFS_2025.pdf"
  desc: "This note summarizes the paper, which constructs a firm-year patent-citation measure of technological obsolescence from declines in external citations to a predetermined technological base, relates it to future profits/output/capital/labor/TFP using within-industry-year panel regressions with extensive robustness and validation, and documents a mispricing channel via obsolescence-sorted portfolio alphas and analyst forecast-error regressions consistent with underreaction."

- title: "Li & Li (RES, 2025)- Firm Quality Dynamics and the Slippery Slope of Credit Intervention"
  file: "Li_Li_RES_2025.pdf"
  desc: "This note summarizes the paper, which builds a quantitative crisis-credit model with heterogeneous firm quality, Tobin’s-q investment, and strategic default, solves the equilibrium survival-financing problem under private funding limits and size-based government lending, calibrates/moment-matches the model to crisis and firm-level targets, and runs welfare and dynamic counterfactuals (optimal vs pseudo-optimal policy and inter-crisis pass-through) to quantify the quantity–quality trade-off and the “slippery slope” of credit intervention."

- title: "De Ridder, Grassi, and Morzenti (Econometrica, 2026) - The Hitchhiker’s Guide to Markup Estimation: Assessing Estimates From Financial Data"
  file: "De_Ridder_Grassi_Morzenti_Econometrica_2026.pdf"
  desc: "This note summarizes the paper, which develops an analytical characterization of the production-approach (Hall–De Loecker–Warzynski) markup estimator when researchers observe revenue but not quantities, validates the resulting bias and “what survives” using Monte Carlo simulations of an Atkeson–Burstein-style oligopoly model and French administrative price–quantity data (FARE+EAP, 2009–2019), implements a modified two-stage translog production-function estimator with a first-stage purging regression that controls for prices and markup proxies (e.g., market share), and shows that revenue-based markups are unreliable for levels but informative for within-sector dispersion and time-series trends."

- title: "Chen & Kung (QJE, 2019) - Busting the “Princelings”: The Campaign against Corruption in China’s Primary Land Market"
  file: "Chen_Kung_QJE_2019.pdf"
  desc: "This note summarizes the paper, which matches 1.6M Chinese primary-land transactions (2004–2016) to Politburo-family (“princeling”) firms and nearby nonprinceling parcels (500m/1500m) to estimate transaction-level log price-per-sqm regressions with rich controls and high-dimensional fixed effects, then extends the analysis with patron-rank/retirement heterogeneity, quantity (land-area) regressions, ordered-probit promotion regressions for local leaders, and DiD/event-study evidence around Xi’s anticorruption campaign (central inspections, Xi-appointed officials, Zhou Yongkang’s arrest) to quantify political rent discounts and their subsequent collapse."

- title: "Bennett, Stulz, & Wang (JFE, 2020) - Does the Stock Market Make Firms More Productive?"
  file: "Bennett_Stulz_Wang_JFE_2020.pdf"
  desc: "This note summarizes the paper, which estimates firm- and year-fixed-effects panel regressions linking ACF-estimated firm TFP to lagged stock-price informativeness (PIN/PSI), strengthens identification with DiD/event-study designs around brokerage-house research closures, S&P 500 additions, and mutual-fund redemption pressure, and tests a CEO-discipline mechanism via turnover–Tobin’s q interactions."

- title: "Adamopoulos, Brandt, Chen, Restuccia, & Wei (QJE, 2024) - Land Security and Mobility Frictions"
  file: "Adamopoulos_Brandt_Chen_Restuccia_Wei_QJE_2024.pdf"
  desc: "This note summarizes the paper, which builds a family-based Roy-style structural model where insecure rural land rights make renting out land risky and thus act as a household-level mobility barrier, disciplines land insecurity using a dedicated survey on reallocation/loss risk and calibrates the remaining labor-mobility and within-agriculture distortion wedges to rich RCRE household/individual moments (farm-operator share, sectoral income gaps, part-time work, TFP/TFPR dispersion) for 2004–2018, and then uses counterfactuals to decompose China’s post-2004 structural transformation and productivity gains into improved land security versus other mobility frictions."

- title: "Chari, Liu, Wang, & Wang (RES, 2021) - Property Rights, Land Misallocation, and Agricultural Efficiency in China"
  file: "Chari_Liu_Wang_Wang_RES_2021.pdf"
  desc: "This note summarizes the paper, which exploits staggered provincial implementation of China’s 2003 Rural Land Contracting Law to run household- and village-level DiD/event-study regressions on land renting and agricultural output, constructs farmer–crop productivity and marginal products from crop-specific Cobb–Douglas (and robustness translog) production functions, decomposes aggregate TFP gains using Olley–Pakes and Baily–Hulten–Campbell reallocation terms and a full-reallocation planner benchmark, and identifies improved dynamic land allocation via crop price-response regressions instrumenting Chinese prices with U.S. prices."

- title: "Whited and Zhao (JF, 2021) - The Misallocation of Finance"
  file: "Whited_Zhao_JF_2021.pdf"
  desc: "This note summarizes the paper, which extends the Hsieh–Klenow misallocation framework to the liability side by modeling firm “benefit” as a CES function of debt and equity, uses Chinese NBS industrial-firm data and U.S. Compustat to estimate sectoral debt–equity substitution elasticities (Kmenta fixed effects and GMM), calibrates demand elasticities using the U.S. as an efficiency benchmark, backs out firm-level wedges / distortion-inclusive marginal financing costs from first-order conditions, and computes planner reallocation counterfactuals that decompose gains into scale vs. mix components with bootstrap inference and dynamic-validation evidence, while interpreting the core tables and figures on China-versus-U.S. financial misallocation."

- title: "Adamopoulos, Brandt, Leight, & Restuccia (Econometrica, 2022) - Misallocation, Selection, and Productivity: A Quantitative Analysis With Panel Data From China"
  file: "Adamopoulos_Brandt_Leight_Restuccia_Econometrica_2022.pdf"
  desc: "This note summarizes the paper, which uses a rural China household panel (1993–2002) to estimate permanent farm TFP and TFPR wedges via year effects and village-purged household fixed effects (validated with a Bils–Klenow–Ruane mismeasurement test), computes within- and across-village reallocation TFP gains relative to an efficient planner benchmark, and then embeds the estimated joint distribution of ability and distortions in a two-sector Roy-style selection model to quantify how land-institution wedges amplify misallocation through occupational sorting."

- title: "Cucic and Gorea (RFS, 2026) - Nonbank Lending and the Transmission of Monetary Policy"
  file: "Cucic_Gorea_RFS_2026.pdf"
  desc: "This note summarizes the paper, which uses universe Danish administrative loan-level data on unsecured corporate and consumer credit (2003–2018) and quasi-exogenous ECB monetary policy surprises (via Denmark’s euro peg) to estimate borrower-year fixed-effect loan-supply regressions comparing banks vs nonbanks, links the resulting “spare-tire” substitution to lenders’ funding structure with lender-balance-sheet panel tests and interaction regressions (showing long-term-debt-funded nonbanks expand most when banks’ long-term funding contracts), and then traces borrower-level and spillover real effects (investment/profits/wage bill and household consumption/assets) with event-study/heterogeneity and risk-taking falsification analyses."

- title: "Fleckenstein, Gopal, Gutiérrez, and Hillenbrand (RFS, 2026) - Nonbank Lending and Credit Cyclicality"
  file: "Fleckenstein_Gopal_Gutierrez_Hillenbrand_RFS_2026.pdf"
  desc: "This note summarizes the paper, which uses DealScan syndicated-loan facilities (2000–2020) to separate bank tranches (revolvers/Term A) from institutional nonbank tranches (Term B+), decomposes the GFC origination and employment contractions into bank vs nonbank components, and identifies the nonbank sector’s greater cyclicality by estimating borrower×deal×time fixed-effect within-deal regressions of facility size/spreads on the Excess Bond Premium (with within-bank/lender-role robustness and CLO funding-cost mechanism evidence)."

- title: "Kwon and Tang (RES, 2026) - Extreme Categories and Overreaction to News"
  file: "Kwon_Tang_RES_2026.pdf"
  desc: "This note summarizes the paper, which combines a diagnostic-expectations model with category-specific power-law tails, measures each news category’s “extremeness” by estimating tail exponents from announcement-day absolute returns in Capital IQ Key Developments matched to CRSP (2011–2018), and tests the theory using category-by-category and pooled drift/reversal regressions that interact day-0 returns with extremeness (with overlapping-news controls, alternative-explanation horse races, and inference robustness), plus complementary turnover and analyst-forecast evidence, interpreting the core tables and figures on why fat-tailed news categories generate overreaction, reversals, and higher trading volume."

- title: "Cohn, Johnson, Liu, and Wardlaw (JFE, 2026) - Past is Prologue: Inference from the Cross Section of Returns Around an Event"
  file: "Cohn_Johnson_Liu_Wardlaw_JFE_2026.pdf"
  desc: "This note summarizes the paper, which shows that standard event-day cross-sectional return–characteristic regressions massively over-reject because “routine news” induces time-varying characteristic slopes even absent any event effect, and proposes a time-series benchmarked inference approach—TS-OLS and a novel PCA-based TS-GLS that estimates a high-dimensional daily return covariance from recent comovement and conducts inference using the empirical CDF of pre-event coefficients—validated on CRSP–Compustat U.S. stocks (1991–2021) across eight characteristics with extensive simulations/robustness and a survey of event-study practice."

- title: "Kelly, Mokyr, and O Grada (JPE, 2023) - The Mechanics of the Industrial Revolution"
  file: "Kelly_Mokyr_Grada_JPE_2023.pdf"
  desc: "This note summarizes the paper, which explains where Britain’s early mechanized textiles and metals emerged by constructing county-level pre-Industrial measures of mechanical/toolmaking skills and estimating semiparametric spatial regressions with flexible geography controls (plus an IV/2SLS strategy using watchmaking apprenticeship fees to instrument for skills), then contrasting these results with “placebo” traditional industries and interpreting the core tables, maps, and figures on skills, wages, market access, and coal."

- title: "Heston & Rouwenhorst (JFE, 1994) - Does Industrial Structure Explain the Benefits of International Diversification?"
  file: "Heston_Rouwenhorst_JFE_1994.pdf"
  desc: "This note summarizes the paper, which runs monthly stock-level two-way (country×industry) dummy-variable regressions (ANOVA) under EW-OLS and VW-WLS identification restrictions to extract “pure” European market, country, and industry return components, constructs industry-corrected country indices and variance decompositions (plus currency-effect regressions) to test whether industrial structure explains international diversification, and interprets the core tables and figure showing country effects dominate and diversification gains persist after controlling for industry mix."

- title: "Wang, Whited, Wu, and Xiao (JF, 2022) - Bank Market Power and Monetary Policy Transmission: Evidence from a Structural Estimation"
  file: "Wang_Whited_Wu_Xiao_JF_2022.pdf"
  desc: "This note summarizes the paper, which quantifies bank-based monetary policy transmission by structurally estimating a dynamic imperfect-competition banking model with reserve and capital constraints, using a two-stage approach that first identifies deposit and loan demand via BLP-style discrete-choice estimation with cost-shifter instruments and then estimates balance-sheet frictions/operating costs in a plug-in dynamic bank problem via simulated minimum distance, complemented by reduced-form validation using high-frequency FOMC surprises and an HHI×Low difference-in-differences test of the low-rate “reversal” mechanism, while interpreting the core tables and figures that decompose transmission into deposit market power, loan market power, capital regulation, and reserve requirements."

- title: "Orr (JPE, 2022) - Within-Firm Productivity Dispersion: Estimates and Implications"
  file: "Orr_JPE_2022.pdf"
  desc: "This note summarizes the paper, which derives an input-allocation theorem for multiproduct plants that uses product-level prices/quantities to estimate a nested-logit demand system (with cost-shifter IVs), invert pricing FOCs to recover marginal costs, impute unobserved product-line input shares, and then estimate product-level TFPQ and “revenue efficiency” via quasi-differenced GMM production-function regressions and product-dropping probits, interpreting the core tables and figures on within-firm productivity dispersion and core competence."

- title: "Bonfim, Ferreira, Queir´o, Zhao (AER, 2025) - Fiscal Policy and Credit Supply in a Crisis"
  file: "Bonfim_Ferreira_Queiro_Zhao_AER_2025.pdf"
  desc: "This note summarizes the paper, which uses Portugal’s sovereign-debt-crisis procurement cuts as a fiscal shock, constructs bank-level exposure via a shift-share measure that combines contractor-level procurement revenue drops with pre-crisis bank–contractor lending shares, estimates bank–firm credit-supply regressions with sector×municipality fixed effects and Khwaja–Mian within-firm (multi-bank) comparisons plus event-study dynamics and identification/robustness checks (including Rotemberg-weight diagnostics and alternative demand controls), links the shock to firm real outcomes and to amplification/mitigation through bank leverage and recapitalization interactions, and rationalizes the reduced-form estimates in a calibrated general-equilibrium banking model that maps micro exposure into aggregate credit and output elasticities."

- title: "Glitz & Meyersson (AER, 2020) - Industrial Espionage and Productivity"
  file: "Glitz_Meyersson_AER_2020.pdf"
  desc: "This note summarizes the paper, which uses the Stasi’s SIRA intelligence archive to construct sector-year inflows of stolen West German industrial information (mapped from keywords/text into industries and scaled by East German sector output), estimates diffusion-style productivity-growth and West–East TFP-gap panel regressions with rich fixed effects in rolling multi-year windows, tackles targeting endogeneity with two IV strategies (a shift-share “old-informants” instrument and quasi-exogenous informant-exit shocks) plus placebo and alternative text-classification robustness, and interprets the core tables and figures on espionage-driven TFP catch-up and heterogeneity by absorptive capacity and import constraints."

- title: "Greenwald & Guren (AER, 2025) - Do Credit Conditions Move House Prices?"
  file: "Greenwald_Guren_AER_2025.pdf"
  desc: "This note summarizes the paper, which asks whether credit easing primarily raises the homeownership rate or instead gets capitalized into the price–rent ratio, estimates the relative elasticities of log(p/q) and HO to plausibly exogenous credit-supply shocks using local projections with a CLL-based shift-share instrument and complementary event-study designs (APL preemption and PLS expansion), and disciplines a dynamic structural housing model with borrowers/landlords/savers by calibrating a tenure-segmentation parameter to match these impulse responses to quantify boom accounting and macroprudential counterfactuals."

- title: "Juhász, Squicciarini, and Voigtländer (JPE, 2024) - Technology Adoption and Productivity Growth: Evidence from Industrialization in France"
  file: "Juha_sz_Squicciarini_Voigtla_nder_JPE_2024.pdf"
  desc: "This note summarizes the paper, which uses repeated cross-sections of French plant-level industrial surveys (c.1800 vs. 1840) to measure output-per-worker productivity and estimate pooled and quantile regressions showing lower-tail-driven catch-up in cotton spinning (relative to metallurgy and paper), then corroborates a “best-practice diffusion” mechanism with exit/survival comparisons, age–productivity regressions controlling for machinery and plant characteristics, factory-design convergence metrics, and spatial diffusion regressions based on distance to top-performing plants, linking the facts to a stylized search-and-imitation model."

- title: "Lashkaripour & Lugovskyy (AER, 2023) - Profits, Scale Economies, and the Gains from Trade and Industrial Policy"
  file: "Lashkaripour_Lugovskyy_AER_2023.pdf"
  desc: "This note summarizes the paper, which develops a multi-country multi-industry “generalized Krugman” trade model with markups/scale economies, derives sufficient-statistics formulas for first-best and unilateral optimal trade versus industrial policies (tariffs, export subsidies, Pigouvian output subsidies) and the rationale for deep industrial-policy coordination, estimates industry-level trade elasticities and scale/markup parameters from Colombian import microdata using shift-share exchange-rate and variety-count instruments (GMM/2SLS), and then quantifies welfare gains, retaliation losses, and cooperation counterfactuals by calibrating a WIOD input–output general-equilibrium model."

- title: "Di Maggio & Kacperczyk (JFE, 2017) - The Unintended Consequences of the Zero Lower Bound Policy"
  file: "Maggio_Kacperczyk_JFE_2017.pdf"
  desc: "This note summarizes the paper, which studies how the zero lower bound and forward guidance reshape the U.S. prime money market fund industry by estimating (i) policy-rate pass-through regressions to MMF gross returns, (ii) flow–performance sensitivity models with low-rate interactions (“flow fragility”), (iii) event-study difference-in-differences around major FOMC forward-guidance “ZLB shocks” with predetermined controls, (iv) sponsor-type and within-independent reputation heterogeneity, (v) nonlinear Fed-rate effects near the ZLB, and (vi) holdings-, issuer-, and fund-family–level analyses (N-MFP security yields, corporate financing around fund closures, and product-menu reallocation)."

- title: "Criscuolo, Martin, Overman, and Van Reenen (AER, 2019) - Some Causal Effects of an Industrial Policy"
  file: "Criscuolo_Martin_Overman_Reenen_AER_2019.pdf"
  desc: "This note summarizes the paper, which evaluates the UK Regional Selective Assistance place-based investment subsidy by exploiting EU state-aid rule/map reforms to build a policy-rule instrument (ordered-probit estimated eligibility weights × predetermined area characteristics) for maximum subsidy caps (NGE), estimating area/plant/firm-level 2SLS and event-study–style difference specifications (including take-up/TOT and spillover checks via labor-market aggregation), and interpreting the core tables and figures on employment, unemployment, investment/output, and (non-)effects on TFP."

- title: "Liu (QJE, 2019) - Industrial Policies in Production Networks"
  file: "Liu_QJE_2019.pdf"
  desc: "This note summarizes the paper, which develops a static multi-sector production-network model with wedge distortions and input/value-added subsidies, derives distortion centrality ξi = μi /γi as the sufficient statistic for the marginal welfare “bang-per-buck” of targeting sector i (implying ΔlnY ≈ Cov(ξ,s)), and then computes and stress-tests ξ using hierarchical input–output matrices to evaluate South Korea’s 1970s HCI drive and modern China’s credit/tax/SOE interventions via sector-level regressions and counterfactual targeting exercises, interpreting the core tables and figures throughout."

- title: "Menzio & Shi (JPE, 2011) - Efficient Search on the Job and the Business Cycle"
  file: "Menzio_Shi_JPE_2011.pdf"
  desc: "This note summarizes the paper, which builds an efficient directed-search model with on-the-job search and match-quality heterogeneity (experience vs. inspection goods via an information parameter), characterizes the constrained-efficient allocation through a planner problem and proves separability/block-recursivity plus decentralization via submarkets and posted contracts, calibrates the monthly economy to U.S. worker-flow and tenure moments, and simulates impulse responses and business-cycle statistics (with Pissarides/Mortensen–Pissarides benchmarks) to show how vacancy composition and poaching amplify small productivity shocks.        "

- title: "Lane (QJE, 2025) - Manufacturing Revolutions: Industrial Policy and Industrialization in South Korea"
  file: "Lane_QJE_2025.pdf"
  desc: "This note summarizes the paper, which uses South Korea’s 1973–1979 Heavy and Chemical Industry (HCI) drive as a sector-targeted industrial-policy shock, estimating dynamic industry-level DiD event studies (Targeted×Year with industry and year fixed effects and pre-trend checks) and corroborating them with a doubly robust DiD ATT estimator and cross-country triple differences in trade, then unpacking mechanisms via plant-level production-function TFP comparisons, learning-by-doing experience interactions, and input–output linkage spillover event studies, while interpreting the core tables and figures on persistent industrial expansion, gradual export upgrading, and downstream network propagation."

- title: "Lagos (RES, 2006) - A Model of TFP"
  file: "Lagos_RES_2006.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time search-and-matching model with match-specific productivity shocks and endogenous job destruction, derives closed-form surplus and job-creation/job-destruction conditions that aggregate to an exact Cobb–Douglas under Pareto shocks (with true TFP A∝R, the reservation cutoff), uses policy comparative statics and a measurement framework (true A vs. Solow residuals using K vs. Ke and employment vs. hours), and calibrates the model to quantify how labor-market institutions shift selection, hoarding, unemployment, and measured versus true TFP."

- title: "Eusepi, Giannoni, and Preston (JPE, 2026) - The Short-Run Policy Constraints of Long-Run Expectations"
  file: "Eusepi_Giannoni_Preston_JPE_2026.pdf"
  desc: "This note summarizes the paper, which derives a new monetary-policy feasibility constraint in a stylized New Keynesian model when agents form long-run “endpoints” for inflation and nominal rates via constant-gain (shifting-endpoints) learning, embeds that mechanism in a medium-scale NK model with imperfect-information expectations and a measurement block using surveys, long-term yields, and a ZLB shadow rate, and then uses Bayesian estimation plus welfare/optimal-policy counterfactuals (varying policy aggressiveness and endogenous learning gain) to quantify how anchoring long-run expectations relaxes the constraint and enables more aggressive stabilization."

- title: "Chen, Ren, and Zha (AER, 2018) - The Nexus of Monetary Policy and Shadow Banking in China"
  file: "Chen_Ren_Zha_AER_2018.pdf"
  desc: "This note summarizes the paper, which identifies exogenous Chinese monetary-policy shocks by estimating an endogenously switching M2-growth rule, then combines hand-collected entrusted-loan trustee data and bank balance-sheet data to estimate trustee/bank panel regressions (entrusted lending and ARIX responses with bank-type and constraint interactions) plus a dynamic panel VAR for aggregate credit, alongside a bank model with deposit-withdrawal shocks and regulatory constraints to interpret the core tables and figures on why tightening can expand shadow banking."

- title: "House, Proebsting, and Tesar (RES, 2026) - Quantifying the Benefits of Labour Mobility in a Currency Union"
  file: "House_Proebsting_Tesar_RES_2026.pdf"
  desc: "This note summarizes the paper, which quantifies the benefits (and potential costs) of higher labor mobility inside a currency union by documenting euro-area vs U.S. differences in unemployment dispersion and cyclical migration using variance decompositions, local projections, and migration–unemployment regressions, embedding these facts in a multi-country New Keynesian DSGE with Calvo wage/price rigidities, Eaton–Kortum trade, and multinomial-logit endogenous migration, estimating key parameters via moment matching, and running counterfactuals that raise EA mobility to U.S. levels (vs. floating exchange rates) to compute compensating-variation welfare under demand versus supply shocks."

- title: "Song, Storesletten, and Zilibotti (AER, 2011) - Growing Like China"
  file: "Song_Storesletten_Zilibotti_AER_2011.pdf"
  desc: "This note summarizes the paper, which builds a transition OLG model with two firm types—credit-favored, low-productivity SOEs (“F-firms”) and credit-constrained, high-productivity private firms (“E-firms”)—to explain China’s joint pattern of labor reallocation and TFP growth alongside a persistent deposit–loan gap and foreign reserve accumulation, disciplines the mechanism with motivating facts and reduced-form evidence, and matches key time series using a calibrated multi-period quantitative version plus two-sector (capital- vs labor-intensive) and market-power extensions."

- title: "Olsson & Tåg (JF, 2025) - What Is the Cost of Privatization for Workers?"
  file: "Olsson_Tag_JF_2025.pdf"
  desc: "This note summarizes the paper, which uses Swedish linked employer–employee administrative registers to match workers in SOEs that are privatized to similar workers in SOEs that remain state-owned and estimates stacked difference-in-differences event studies (with complementary firm-level DiD and job-flow decompositions) to quantify worker income/unemployment/transfer effects and firm productivity gains, alongside mechanism and heterogeneity tests (e.g., CEO replacement vs labor-quality/financial-engineering channels and privatization type/buyer identity) and a simple welfare accounting comparing worker losses to efficiency gains."

- title: "Heblich, Redding, and Sturm (QJE, 2020) - The Making of the Modern Metropolis: Evidence from London"
  file: "Heblich_Redding_Sturm_QJE_2020.pdf"
  desc: "This note summarizes the paper, which combines parish-level event-study evidence around railway-station arrivals with a quantitative spatial equilibrium model (Frechét location-choice + land-market clearing), estimates commuting-cost elasticities from a gravity regression instrumenting rail travel time with straight-line distance, uses exact hat algebra to recover implied wage and commuting-flow changes from population and rateable-value shifts, estimates production and residential agglomeration elasticities, and runs counterfactuals removing the railway network to quantify the welfare/value gains and the “workplace center + residential suburbs” reorganization of London."

- title: "Brunnermeier, Sockin, and Xiong (RES, 2022) - China’s Model of Managing the Financial System"
  file: "Brunnermeier_Sockin_Xiong_RES_2022.pdf"
  desc: "This note summarizes the paper, which builds a stylized asset-market model with CARA investors and noise traders, models government “stabilization” as a trading program that leans against noise demand but adds endogenous policy noise, introduces information frictions with filtering and discrete investor information-choice (learn fundamentals vs. policy) to generate multiple noisy rational-expectations equilibria and regime switches, and then calibrates/numerically solves the model to quantify the volatility–price-informativeness trade-off and characterize welfare-optimal intervention."

- title: "Barwick, Kalouptsidi, and Zahur (RES, 2025) - Industrial Policy Implementation: Empirical Evidence from China’s Shipbuilding Industry"
  file: "Barwick_Kalouptsidi_Zahur_RES_2025.pdf"
  desc: "This note summarizes the paper, which studies China’s shipbuilding industrial policy (1998–2014) by building and structurally estimating a dynamic empirical-IO model—static Cournot competition across ship types embedded in heterogeneous firms’ entry/exit/investment dynamics that infers unobserved production, investment, and entry subsidies—using a two-stage Hotz–Miller/BBL-style approach (instrumented demand estimation, Tobit marginal-cost estimation from Cournot FOCs, and value-function/B-spline recovery of dynamic parameters) and then running counterfactual simulations to rank policy instruments and compare pro- vs counter-cyclical, temporary, and targeted designs."

- title: "Che (RES, 2009) - A Dynamic Model of Privatization with Endogenous Post-Privatization Performance"
  file: "Che_RES_2009.pdf"
  desc: "This note summarizes the paper, which builds a continuous-time dynamic bargaining model of privatization with endogenous effort, gradually improving property-rights protection μ(t), and a hard buyer budget B, characterizes Markov subgame-perfect equilibrium timing (no/efficient/delayed/premature privatization) using the PV objects W(t) and V(t) and binding incentive constraints, derives implications for post-privatization performance jumps and endogenous “underpricing,” and interprets the paper’s main propositions and figures."

- title: "Li, Wang, Cheung, and Jiang (RFS, 2011) - Evidence from the Split Share Structure Reform in China"
  file: "Li_Wang_Cheung_Jiang_RFS_2011.pdf"
  desc: "This note summarizes the paper, which uses China’s 2005–2007 Split Share Structure Reform as a nationwide quasi-experiment and treats the negotiated compensation ratio as a revealed-preference outcome, developing a pure price-impact benchmark model alongside a risk-sharing channel and testing both with cross-sectional/fixed-effects regressions, heterogeneity by controlling NTS-holder diversification, and falsification tests of the valuation-wedge prediction, while interpreting the core tables and figures on how idiosyncratic risk, float expansion, bargaining power, and firm performance jointly determine compensation."

- title: "Hachem & Song (JPE, 2021) - Liquidity Rules and Credit Booms"
  file: "Hachem_Song_JPE_2021.pdf"
  desc: "This note summarizes the paper, which develops a three-date banking model with interbank market power and stochastic liquidity shocks to show how tightening an on-balance-sheet liquidity rule induces shadow-banking arbitrage and deposit reallocation that can reduce required system liquidity and generate a credit boom, and then tests the mechanism in China using repo-rate regressions on Big-Four NCD announcements, calibrated policy-counterfactuals, WMP–interbank-rate comovement, and moment-matched structural shock decompositions."

- title: "Khwaja & Mian (QJE, 2005) - Do Lenders Favor Politically Connected Firms? Rent Provision in an Emerging Financial Market"
  file: "Khwaja_Mian_QJE_2005.pdf"
  desc: "This note summarizes the paper, which uses the universe of Pakistani corporate loans (1996–2002) to define political connections from directors running in elections, decomposes loan returns into interest/default/recovery components, and identifies political rent provision by combining bank-FE cross-sectional regressions with within-firm government-versus-private lender comparisons (firm and bank fixed effects) and within-firm event-time evidence around political victories (relationship fixed effects), interpreting the core tables on credit quantity, default, and misallocation costs."

- title: "Moll (AER, 2014) - Productivity Losses from Financial Frictions: Can Self-Financing Undo Capital Misallocation?"
  file: "Moll_AER_2014.pdf"
  desc: "This note summarizes the paper, which develops a highly tractable continuous-time general-equilibrium model of entrepreneurs facing collateral constraints but able to self-finance, derives closed-form aggregation in terms of productivity-type wealth shares governed by a PDE (implying measured TFP is a truncated wealth-weighted mean of productivity), and uses steady-state comparative statics and transition simulations to show how idiosyncratic productivity persistence jointly determines the long-run misallocation loss and the speed of convergence, interpreting the main figures and welfare implications."

- title: "Midrigan & Xu (AER, 2014) - Finance and Misallocation: Evidence from Plant-Level Data"
  file: "Midrigan_Xu_AER_2014.pdf"
  desc: "This note summarizes the paper, which builds a two-sector heterogeneous-plant model with collateral-based borrowing constraints and limited equity issuance/entry into a modern technology, derives misallocation and TFP-loss accounting from dispersion in the shadow cost of capital, and disciplines the model with plant-level and financing moments via simulated method of moments to run counterfactuals (tightening external finance, shutting down entry/adoption/operation, and crisis dynamics), interpreting the core tables and figures on why finance implies modest steady-state within-sector misallocation but large extensive-margin effects."

- title: "David & Venkateswaran (AER, 2019) - The Sources of Capital Misallocation"
  file: "David_Venkateswaran_AER_2019.pdf"
  desc: "This note summarizes the paper, which builds a CES-demand dynamic investment model with capital adjustment costs, firm-specific capital wedges, and imperfect information about productivity, derives a log-linear Euler-equation policy rule that links capital dynamics to wedges and “news,” identifies and decomposes observed ARPK dispersion using multiple investment and ARPK–productivity comovement moments, estimates the key parameters by simulated method of moments (with extensions for nonconvex adjustment costs and frictional labor), and then augments the accounting with markup/technology and size-dependent-liquidity mechanisms to interpret the core tables and figures mapping variance shares into aggregate TFP losses and policy-relevant sources of misallocation."

- title: "Ouyang (Accepted JFE) - Cashless Payment and Financial Inclusion"
  file: "Ouyang_Accepted_JFE.pdf"
  desc: "This note summarizes the paper, which uses the staggered rollout of Alipay-bundled dockless shared bikes across Chinese cities as an instrument for individual in-person payment flow, estimates a core 2SLS design with individual and month fixed effects plus user/city event studies, mechanism tests (information via noncredit transactions vs enforcement via AUM controls) and financial-inclusion heterogeneity, and interprets the main tables and figures on how cashless payments causally expand BigTech credit access and credit limits for underserved users."

- title: "Borisova & Megginson (RFS, 2011) - Does Government Ownership Affect the Cost of Debt? Evidence from Privatization"
  file: "Borisova_Megginson_RFS_2011.pdf"
  desc: "
This note summarizes the paper, which builds a bond–year panel of European privatized firms (Privatization Barometer matched to Bloomberg bond yields, 2001–2009), measures credit spreads against maturity-matched sovereign benchmarks, and estimates baseline panel regressions (with orthogonalized ratings) that allow for nonlinearity via a partial-privatization indicator plus retained-ownership percentage (and quadratic terms), crisis and golden-share interactions, speed-of-privatization tests, and 2SLS/within-firm fixed-effects robustness."

- title: "Cong, Gao, Ponticelli, and Yang (RFS, 2019) - Credit Allocation Under Economic Stimulus: Evidence from China"
  file: "Cong_Gao_Ponticelli_Yang_RFS_2019.pdf"
  desc: "
This note summarizes the paper, which uses confidential bank–firm loan-level data from China’s largest banks to build a two-step credit-supply shifter (bank lending growth outside a firm’s city/sector, shift-shared by pre-stimulus lender weights), validates it with Khwaja–Mian within-firm across-lender tests, and estimates fixed-effects (dynamic DiD/event-study) regressions with productivity (APK) and state-ownership interactions—plus an implicit-guarantees mechanism model—to interpret the core tables and figures on stimulus-driven credit misallocation and its persistence."


- title: "Ru (JF, 2018) — Government Credit, a Double-Edged Sword: Evidence from the China Development Bank"
  file: "Ru_JF_2018.pdf"
  desc: "This note summarizes the paper, which exploits predetermined city secretary turnover cycles to instrument for China Development Bank credit, estimating city-level lending-cycle event studies and province×industry first-stage regressions and then 2SLS firm-panel effects for same-industry crowding-out and input–output–based upstream-to-downstream spillovers, supported by hazard-model and promotion-probit diagnostics plus exclusion and robustness tests (other policy channels, stronger effects in CDB-connected cities) and a multi-endogenous IV that separates industrial SOE loans from infrastructure loans."

- title: "Bai, Ríos-Rull, and Storesletten (RES, 2026) — Demand Shocks as Technology Shocks"
  file: "Bai_Rios-Rull_Storesletten_RES_2026.pdf"
  desc: "
This note summarizes the paper, which builds a competitive-search DSGE with product-market matching (shopping effort) so demand shocks can masquerade as technology shocks, derives equilibrium and measured-TFP implications plus identification using shopping-time moments, estimates the full stochastic growth model via mixed-frequency Bayesian methods (ATUS shopping time and the relative price of investment), and interprets the core figures and variance-decomposition tables."

- title: "Celentano & Rempel (RES, 2026) — Public Listing Choice with Persistent Hidden Information"
  file: "Celentano_Rempel_RES_2026.pdf"
  desc: "
This note summarizes the paper, which develops a continuous-time financing-and-contracting model with a persistent hidden cash-flow component (OU dynamics) that creates an endogenous public “information premium,” derives equilibrium sorting between public incentive contracts and private monitoring under scarce private capital (with endogenous PE entry/matching), and then brings the model to the data using public–private listing-choice and CEO-pay reduced-form regressions (LPM/logit and pay-composition specifications) plus a structural GMM estimation that matches listing and pay-performance-sensitivity moments."

- title: "Liao, Liu, and Wang (JFE, 2014) — China’s Secondary Privatization"
  file: "Liao_Liu_Wang_JFE_2014.pdf"
  desc: "
This note summarizes the paper, which treats China’s 2005–2007 Split-Share Structure Reform as a secondary-privatization shock, measures SOE “privatization-led” performance changes using matched size×industry (or size×M/B) benchmark-adjusted DiD-style comparisons, estimates median/Wilcoxon and Koenker–Bassett quantile regressions (plus Fama–French risk-adjusted return tests) on state ownership and government supportive-action proxies, and uses negotiated consideration and approval rates to test market-mechanism information-discovery predictions."

- title: "Allen, Gu, Li, Qian, and Qian (JFE, 2023) — Implicit guarantees and the rise of shadow banking: The case of trust products"
  file: "Allen_Gu_Li_Qian_Qian_JFE_2023.pdf"
  desc: "
This note summarizes the paper, which develops a screening-and-implicit-guarantee contracting model (and a SOE–private capital-misallocation extension) and then tests its predictions in a comprehensive Chinese trust-product dataset using baseline cross-sectional yield-spread regressions on implicit-guarantee proxies/IG index and risk controls, difference-in-differences around the 2015 stock-market crash, risk-sensitivity interactions and risk-shock event studies (2014 default and 2010 housing restrictions), and a policy-shock DiD around the 2018 asset-management regulations with issuance-size/credit-rationing regressions."

- title: "Chen, He, and Liu (JFE, 2020) — The financing of local government in China: Stimulus loan wanes and shadow banking waxes"
  file: "Chen_He_Liu_JFE_2020.pdf"
  desc: "
This note summarizes the paper, which constructs a province-level 2009 stimulus bank-loan shock and an “abnormal” LGFV municipal corporate bond (MCB) issuance measure, estimates year-by-year cross-sectional regressions and a province×year event-study panel with fixed effects (plus an IV using governor late-term tenure and heterogeneity tests based on long-maturity CDB loan exposure), and links the post-2012 rise in MCB issuance and shadow-banking activity (entrusted loans/WMP funding) to a delayed refinancing “stimulus-loan hangover” mechanism."

- title: "Alok & Ayyagari (RFS, 2020) — Politics, State Ownership, and Corporate Investments"
  file: "Alok_Ayyagari_RFS_2020.pdf"
  desc: "
This note summarizes the paper, which uses Indian CAPEX project announcements matched to national/state election timing to document a political investment cycle in SOEs by estimating district-year fixed-effects DiD regressions and IV-2SLS models that instrument election-year indicators with the constitutionally scheduled five-year cycle, extending to swing-district (Close) and minister/ideology heterogeneity and event-time dynamics, project-level visibility/composition regressions, stock-market event studies of announcement (and implementation) returns, and private-investment crowding-out specifications."

- title: "Fang, Lerner, and Wu (RFS, 2017) — Intellectual Property Rights Protection, Ownership, and Innovation: Evidence from China"
  file: "Fang_Lerner_Wu_RFS_2017.pdf"
  desc: "
This note summarizes the paper, which constructs a prefecture-year IPR protection score and firm patent-stock measures, treats China’s SOE privatization events as within-firm ownership shocks, estimates baseline panel DiD regressions of log(1 + Ki,t ) on POST, lagged IPRScore, and the key POST × IPRScore interaction with rich controls and fixed effects, corroborates the interaction with a propensity-score–matched dynamic event-study DiD around privatization, and addresses IPR endogeneity with a 2SLS strategy instrumenting IPRScore using historical Christian-college and British-settlement exposure, interpreting the core tables and figures on how stronger local IPR amplifies post-privatization innovation."

- title: "Huang, Li, Ma and Xu (AER, 2017) — Hayek, Local Information, and Commanding Heights: Decentralizing State-Owned Enterprises in China"
  file: "Huang_Li_Ma_Xu_AER_2017.pdf"
  desc: "
This note summarizes the paper, which tests Hayek’s local-information view of decentralization using Chinese SOE oversight transfers in ASIF (1998–2007) by estimating baseline probit models of decentralization on log distance to the oversight government with rich firm/province controls and fixed effects, corroborating the result with Cox hazard and multinomial-logit (decentralize vs restructure) specifications, addressing endogeneity with a Third Front Construction IV for distance and placebo-distance tests, and using interaction designs with communication-cost proxies (road density), performance heterogeneity, strategic-industry status (“commanding heights”), and rent/corruption measures to discriminate among competing mechanisms."

- title: "Brandt, VanBiesebroeck, Wang, and Zhang (AER, 2017) - WTO Accession and Performance of Chinese Manufacturing Firms"
  file: "Brandt_VanBiesebroeck_Wang_Zhang_AER_2017.pdf"
  desc: "This note summarizes the paper, which studies China’s WTO-driven trade liberalization by separating output vs. input tariff cuts, instrumenting applied tariffs with WTO bound tariffs, estimating firm-level fixed-effects regressions of markups and productivity, measuring markups via the De Loecker–Warzynski cost-share method, addressing revenue-TFP price-deflator bias, and decomposing industry outcomes into within/between reallocation and entry/exit margins while interpreting the core tables and figures on how competition and input-cost channels jointly reshape markups and productivity."

- title: "Avramov, Ge, Li, and Linton (JFE, 2026) - Dual Peer Effects and Cross-Stock Predictability"
  file: "Avramov_Ge_Li_Linton_JFE_2026.pdf"
  desc: "This note summarizes the paper, which builds an economically structured Peer Index (PI) return predictor by mapping peer-network–transformed characteristics—peer averages (“peer strength”) and within-peer deviations (“relative position”)—into expected returns via ridge-regularized dual-peer-effects estimation, benchmarks PI against own-characteristic ML using Fama–MacBeth regressions, out-of-sample R2/MSPE comparisons, portfolio sorts and factor-spanning tests, studies slow information diffusion with lag-augmented local projections and earnings-surprise predictability regressions, and extends to directed networks through a symmetric–antisymmetric decomposition and drop-one-out importance analysis while interpreting the core tables and figures."

- title: "Sun & Tongnd (JFE, 2003) - China Share Issue Privatization: The Extent of Its Success"
  file: "Sun_Tong_JFE_2003.pdf"
  desc: "This note summarizes the paper, which evaluates China’s share-issue privatization using an event-time before–after design around the listing year for 634 firms (1994–1998), constructs real/normalized profit, output, leverage, and productivity measures, applies Wilcoxon signed-rank/rank-sum and proportion tests plus cross-sectional and firm fixed-effects regressions to link post-listing performance to ownership structure (state vs legal-person/foreign shares), and addresses selection with state-share regressions and a logit for foreign-share issuance while interpreting the core tables and Figure 1 on stock-market returns."

- title: "Hansen & Tong (RFS, 2026) — Option Pricing with Time-Varying Volatility Risk Aversion"
  file: "Hansen_Tong_RFS_2026.pdf"
  desc: "
This note summarizes the paper, which builds a discrete-time option-pricing framework that keeps physical returns in a Heston–Nandi GARCH but lets volatility risk aversion vary over time through a derivative-implied variance risk ratio ηt , derives the no-arbitrage mapping to time-varying risk-neutral dynamics and a closed-form VIX, prices options using an MGF-based second-order analytic approximation under stochastic ηt , and estimates ηt with a score-driven (observation-driven) state update in a joint likelihood on returns, VIX, and option panels while interpreting the core tables and figures on pricing-kernel curvature flips and the DHNG model’s large in-/out-of-sample fit gains."

- title: "Taschereau-Dumouchel (RES, 2026) - Cascades and Fluctuations in an Economy with an Endogenous Production Network"
  file: "Taschereau-Dumouchel_RES_2026.pdf"
  desc: "This note summarizes the paper, which models endogenous production-network formation through firms’ costly operate/exit decisions in a CES input-output economy, solves the NP-hard planner problem over the operating set with a “reshaping” relaxation that preserves and selects corner solutions, characterizes efficient versus distorted equilibria and cascade dynamics arising from complementarities, and quantifies the mechanism by calibrating and simulating the model on U.S. supply-chain data (FactSet/Compustat) and estimating distance-based neighbor-exit spillover regressions, with interpretation of the core tables and figures on clustering, cascades, and aggregate fluctuations."

- title: "Drechsler, Savov, and Schnabl (JFE, 2022) — How monetary policy shaped the housing boom"
  file: "Drechsler_Savov_Schnabl_JFE_2022.pdf"
  desc: "
This note summarizes the paper, which identifies a “deposits channel” of monetary tightening by estimating pre-boom deposit-spread betas at the branch level and funding-cost (interest-expense spread) betas at the bank level, aggregating them into a predetermined county exposure measure using 2002 portfolio-mortgage shares, and then running sequential branch-, bank-, and county-level reduced-form and 2SLS tests (beta → spread changes; beta → deposit growth with within-bank comparisons; deposit growth → balance-sheet mortgage lending; and county outcomes for portfolio lending and the shift toward PLS/nonbanks), culminating in an aggregate counterfactual and interpretation of the core tables/figures on why 2004–2006 tightening reallocated mortgage finance from bank portfolios to PLS and nonbank lending."

- title: "Jiang & Zhang (JFE, 2025) — Collateral Value Uncertainty and Mortgage Credit Provision"
  file: "Jiang_Zhang_JFE_2025.pdf"
  desc: "
This note summarizes the paper, which measures collateral value uncertainty using a hedonic-price/heteroskedasticity house price dispersion estimator (predicted idiosyncratic price volatility, aggregated to zipcode-year), estimates reduced-form fixed-effects regressions linking dispersion to mortgage rejections, interest-rate menus conditional on leverage, and loan-to-price outcomes, identifies causality with a house non-standardization IV in 2SLS (validated via ex-post default “exclusion” tests), and calibrates a structural mortgage-origination model that decomposes effects into collateral-recovery versus appraisal-risk channels and evaluates policy counterfactuals."

- title: "Giroud, Liu, and Mueller (JFE, 2026) — Innovation spillovers across U.S. tech clusters"
  file: "Giroud_Liu_Mueller_JFE_2026.pdf"
  desc: "
This note summarizes the paper, which uses Census plant-year data matched to USPTO patents (1976–2018) to define clusters as BEA economic area × CPC field and measure inventor productivity and plant TFPR; it estimates within-cluster spillover regressions with plant and city×year/field×year/city×field fixed effects and cross-cluster spillover regressions that compare plants in the same city×field×year but connected through their parent firm to different innovating clusters; identification is bolstered with inventor-based placebos, a network-based 2SLS instrument for connected-cluster size, and mechanism evidence from no distance decay and patent-citation shares; finally, it develops a multi-location model and calibrates a social–private innovation wedge γn /βn to rank clusters by underinvestment and policy relevance."

- title: "Taylor (JF, 2010) — Why Are CEOs Rarely Fired? Evidence from Structural Estimation"
  file: "Taylor_JF_2010.pdf"
  desc: "
This note summarizes the paper, which structurally estimates a dynamic board firing problem with Bayesian learning about CEO ability from persistent profitability plus an additional signal, embeds a threshold dismissal rule with both real turnover costs and an entrenchment (board “personal cost”) wedge, and fits the model by simulated method of moments to CEO-spell, profitability-dynamics, and event-time/hazard moments to explain why forced CEO turnover is rare and to run counterfactuals (e.g., removing entrenchment)."

- title: "Schroth, Suarez, and Taylor (JFE, 2014) — Dynamic debt runs and financial fragility: Evidence from the 2007 ABCP crisis"
  file: "Schroth_Suarez_Taylor_JFE_2014.pdf"
  desc: "
This note summarizes the paper, which estimates a structural continuous-time short-term debt run model with endogenous rollover yields (dilution-risk amplification) and a yield-cap–pinned run threshold, fits it to weekly conduit-level DTCC ABCP issuance/yield data via simulated method of moments using yield-volatility, pre-run event-time spread dynamics, and run-forecasting moments (separately for strong vs weak guarantee subsamples), and uses the estimated parameters to quantify fragility and warning signals."

- title: "Cookson, Niessner, and Schiller (JF, 2026) — Can Social Media Inform Corporate Decisions? Evidence from Merger Withdrawals"
  file: "Cookson_Niessner_Schiller_JF_2026.pdf"
  desc: "
This note summarizes the paper, which uses StockTwits cashtagged posts to construct deal-level abnormal sentiment around M&A announcements, estimates linear-probability withdrawal regressions with rich CAR/news/analyst controls and fixed effects, tests value implications via post-announcement BHAR and an AbnSent × Withdrawn interaction, and provides learning-mechanism evidence using corporate-Twitter adoption interactions plus text/topic classifications (max-entropy/naive Bayes sentiment and BTM topics)."

- title: "Boguth, Duchin, and Simutin(JF, 2022) — Dissecting Conglomerate Valuations"
  file: "Boguth_Duchin_Simutin_JF_2022.pdf"
  desc: "
This note summarizes the paper, which replaces standalone-industry multiples with a conglomerate-implied estimator of divisional q (year-by-year cross-sectional median/quantile regressions of value-to-sales on segment-share exposures), defines RDQ as the log wedge between divisional and standalone q, uses economic vs. credit-shock sensitivity regressions (including PC “horse races”) and coinsurance/covariance splits to isolate a financing-frictions/internal-capital-markets mechanism, and links RDQ to real outcomes via investment–q sensitivities (including spinoff pre/post flips) and diversifying M&A intensity and announcement-return regressions."

- title: "Tomunen (RFS, 2026) — Failure to Share Natural Disaster Risk"
  file: "Tomunen_RFS_2026.pdf"
  desc: "
This note summarizes the paper, which uses catastrophe bonds as a clean laboratory where disaster cash flows are (approximately) orthogonal to household macro risk, develops a segmented-intermediary asset-pricing model with a “skin-in-the-game” outside-capital constraint and mean–variance/CRRA mapping, constructs bond-level expected excess returns as discount margin minus expected actuarial loss, estimates forward-looking “cat-market betas” via Monte Carlo simulations of bond-state returns by peril category, tests “failure to share” risk through Fama–MacBeth cross-sectional pricing regressions and pooled time-series restrictions tying the aggregate disaster premium to specialist AUM versus market size, and validates the exclusion restriction plus alternative channels with international macro local projections and liquidity/climate-change robustness checks."

- title: "Vesa_Pursiainen (JF, 2022) — Cultural Biases in Equity Analysis"
  file: "Vesa_Pursiainen_JF_2022.pdf"
  desc: "
This note summarizes the paper, which constructs a bilateral cultural trust-bias measure from Eurobarometer survey residuals (origin-, destination-, and year-FE), estimates analyst–firm–month recommendation/target-price (and earnings-forecast) regressions with demanding analyst–month and firm–month fixed effects plus salience and sentiment interactions, exploits the European debt crisis and Brexit as perception shocks in triple-difference/event-time designs, and tests market recognition and information content using recommendation-announcement CAR regressions and monthly-return predictability specifications."

- title: "Li, Sokolinski, and Tamoni (JFE, 2026) — Which investors drive anomaly returns and how?"
  file: "Li_Sokolinski_Tamoni_JFE_2026.pdf"
  desc: "
This note summarizes the paper, which estimates a two-tier nested-logit equity demand system (industry allocation and within-industry stock choice) on holdings data using counterfactual price instruments, solves the implied equilibrium pricing map each quarter to run sequential block-by-block counterfactuals (industry rotation, shares/characteristics, AUM/flows, characteristics demand, latent demand), maps the resulting price changes into anomaly long–short portfolio returns to perform a covariance-based time-series variance decomposition by trading motive and investor type, and embeds these components in a Campbell-style VAR cash-flow vs discount-rate news decomposition to interpret the core tables and figures on who drives anomaly returns and why."

- title: "Dinc and Erel (JF, 2013) — Economic Nationalism in Mergers and Acquisitions"
  file: "Dinc_Erel_JF_2013.pdf"
  desc: "
This note summarizes the paper, which hand-collects EU-15 government reactions (oppose/support/neutral) to large domestic vs. foreign takeover bids (1997–2006), estimates multinomial-logit reaction models with nationalist-sentiment and political interactions, links reactions to completion via logit, addresses premium endogeneity with a probit-first-stage/2SLS IV design, and quantifies deterrence using firm- and country-level Cox hazard models of subsequent foreign bids while interpreting the core tables and figures on economic nationalism."

- title: "Cao, Liang, Yao, and Zhang (JFE, 2026) — Liquidity characteristics of market anomalies and institutional trading"
  file: "Cao_Liang_Yao_Zhang_JFE_2026.pdf"
  desc: "
This note summarizes the paper, which studies 32 market anomalies by forming long–short tercile portfolios, measuring liquidity with ranked Amihud illiquidity and pre-formation liquidity changes, decomposing institutional trading into liquidity-related vs residual components via cross-sectional regressions (within exchange/size cells), tracing liquidity gradients to corporate events and information-environment shocks using Fama–MacBeth and event-driven trading decompositions, validating causality with tick-size-reform DiD quasi-experiments, and linking liquidity-motivated “wrong-way” trading to anomaly alphas by sorting on trading direction while interpreting all core tables and figures."

- title: "Ahern and Sosyura (JF, 2014) — Who Writes the News? Corporate Press Releases during Merger Negotiations"
  file: "Ahern_Sosyura_JF_2014.pdf"
  desc: "
This note summarizes the paper, which exploits fixed- versus floating-exchange-ratio stock mergers as incentive-shifting quasi-experimental variation, uses hand-collected negotiation-start dates and Factiva daily media counts (with newswires as a firm-originated proxy) to estimate firm–deal fixed-effects difference-in-differences and valuation-interaction regressions, tests for post-announcement reversals and tone shifts, and links negotiation-period media to the division of merger gains and to cross-sectional determinants of active media management."

- title: "Kepler, Naiker, and Stewar (JF, 2023) — Stealth Acquisitions and Product Market Competition"
  file: "Kepler_Naiker_Stewar_JF_2023.pdf"
  desc: "
This note summarizes the paper, which exploits the time-varying Hart–Scott–Rodino (HSR) filing threshold as a regulatory notch by standardizing deal values around the cutoff, documents “stealth” bunching with McCrary density and histogram-bin tests plus placebo/falsification cutoffs, characterizes avoidance using fixed-effects linear probability models of being just-below (earnouts/contract terms, payment form, CEO ties, and overlap–concentration interactions), and links these deals to reduced competition using rival announcement-return event studies, industry gross-margin changes, and retail-scanner price difference-in-differences (including common-vs-uncommon products)."

- title: "Goldstein, Liu, and Yang (JFE, 2026) — Market Feedback: Evidence from the Horse’s Mouth"
  file: "Goldstein_Liu_Yang_JFE_2026.pdf"
  desc: "
This note summarizes the paper, which surveys (nearly) the universe of Chinese listed firms in 2019 and 2022 about stock-price monitoring and learning vs. financing motives, and then validates these responses using (i) cross-sectional Probit models for the determinants of “learning,” (ii) firm-year fixed-effects regressions of investment-to-price (Tobin’s Q) sensitivity (including content-specific splits), (iii) M&A activity/performance regressions tied to “learning about M&A,” and (iv) firm-month Probit models of discretionary trading suspensions interacted with large price drops, interpreting the core tables and figures as direct evidence of market feedback."

- title: "Beyhaghi, Fracassi, and Weitzner (JF, 2026) — Adverse Selection in Corporate Loan Markets"
  file: "Beyhaghi_Fracassi_Weitzner_JF_2026.pdf"
  desc: "
This note summarizes the paper, which uses Federal Reserve Y-14Q supervisory loan data with banks’ internal PD/LGD to validate lender private information (pricing and ex post default regressions), estimates loan- and county-level panel specifications linking interest rates, borrower risk, lending volumes, and risk-orthogonalized markups to local market structure (the number of banks) with rich fixed effects and mechanism tests (tangibility splits and stay-with-bank “information rent” regressions), and then provides causal evidence via a Bartik-style DiD/event-study and 2SLS instrument based on counties’ pre-2016 GSIB exposure to the 2016–2019 capital-surcharge shock, interpreting the core tables and figures on adverse selection reversing standard competition effects in corporate loan markets."

- title: "Cunningham, Ederer, and Ma (JPE, 2021) — Killer Acquisitions"
  file: "Cunningham_Ederer_Ma_JPE_2021.pdf"
  desc: "
This note summarizes the paper, which formalizes “killer acquisitions” in a simple acquisition-and-innovation model where product-market overlap creates a replacement effect that makes incumbents optimally discontinue acquired innovation, and then tests the predictions using pharma project-level data by estimating project-year development panel triple-difference regressions 1{Acquired}×1{Post}×1{Overlap} with rich fixed effects and pre-trend checks, competition and patent-life heterogeneity designs, a deal-fixed-effect conditional logit for acquisition choice, and discontinuity-style evidence around HSR antitrust thresholds, complemented by asset-redeployment/human-capital and deal-value analyses."

- title: "Hilscher, Raviv, and Reis (RFS, 2026) — How Likely Is an Inflation Disaster?"
  file: "Hilscher_Raviv_Reis_RFS_2026.pdf"
  desc: "
This note summarizes the paper, which measures forward (e.g., 5y5y) inflation “disaster” probabilities from inflation options by (i) recovering nominal and risk-neutral distributions from option prices via strike-curvature identities, (ii) applying an inflation (real-payoff) adjustment to convert conventional nominal objects into real risk-neutral probabilities, (iii) imposing a parsimonious restricted Markov-chain persistence model (estimated by GMM using 5y/10y and forward-starting option slices) to transform cumulative horizons into forward-window probabilities, and (iv) mapping risk-neutral tails into physical tails with a tail-only rare-disaster risk-adjustment model (Pareto disaster sizes calibrated to long-run macro data), then interpreting the core tables and figures on deanchoring, reanchoring, and “scarring” in long-run inflation tail risk."

- title: "Boone & Mulherin (JF, 2007) — How Are Firms Sold?"
  file: "Boone_Mulherin_JF_2007.pdf"
  desc: "This note summarizes the paper, which opens the private takeover “black box” by hand-collecting sale-process measures from SEC filings (contacts, confidentiality/standstill agreements, private written bids, and public bids), classifies auctions vs. negotiations based on the private stage, and tests whether auctions generate higher target returns using announcement-window event studies, multivariate OLS, and an endogeneity-corrected two-stage probit least squares (2SPLS) system."

- title: "Adelino, Schoar, and Severino (RFS, 2016) — Loan Originations and Defaults in the Mortgage Crisis: The Role of the Middle Class"
  file: "Adelino_Schoar_Severino_RFS_2016.pdf"
  desc: "This note summarizes the paper, which uses HMDA–IRS–LPS/Blackbox–SCF–Zillow data to decompose mortgage-origination growth into intensive vs. extensive margins (dollars= #loans × avg size), estimate ZIP-level growth regressions benchmarking Mian–Sufi with pooled/within-county (county FE) and between-county variation plus within–between variance decompositions, run ZIP-panel and loan-level fixed-effects specifications (including year-interacted slopes), and conduct heterogeneity/robustness analyses (buyer vs resident income, GSE/subprime splits, refinancing) to interpret the core tables and figures showing that boom origination dollars and crisis delinquent dollars were largely middle-class/prime and that “credit–income decoupling” mainly reflects transaction volume rather than unusually large loans to low-income borrowers."

- title: "Fang, Liu, and Roussanov (RFS, 2026) — Getting to the Core: Inflation Risks Within and Across Asset Classes"
  file: "Fang_Liu_Roussanov_RFS_2026.pdf"
  desc: "This note summarizes the paper, which extracts headline/core/food/energy inflation shocks from a reduced-form VAR, estimates cross-asset inflation betas via inflation-hedging time-series regressions, prices these risks in the cross section using a two-step Fama–MacBeth (Shanken-corrected) beta-pricing framework and factor-mimicking portfolios (within and across eight asset classes), studies time variation with conditional risk-price estimation and spanning/high-frequency announcement tests, and rationalizes the core-versus-energy findings in a two-sector New Keynesian asset-pricing model with sticky core prices and flexible energy."

- title: "Bao & Edmans (RFS, 2011) — Do Investment Banks Matter for M&A Returns?"
  file: "Bao_Edmans_RFS_2011.pdf"
  desc: "This note summarizes the paper, which uses a large SDC–CRSP sample of U.S. acquisitions to compute (−1,+1) acquirer announcement CARs, estimates deal-level regressions with advisor (bank) fixed effects (with time and acquirer controls/fixed effects and residualized CAR measures) to quantify economically large bank effects, tests persistence via bank performance sorts and bank-year panel regressions, and studies why persistence survives using market-share dynamics, repeat-advisor (relationship lock-in) comparisons, and a no-relationship logit bank-choice model."

- title: "Horenstein, Vasquez, and Xiao (RFS, 2026) — Common Factors in Equity Option Returns"
  file: "Horenstein_Vasquez_Xiao_RFS_2026.pdf"
  desc: "This note summarizes the paper, which constructs daily delta-hedged equity option returns from OptionMetrics and characteristic-sorted ATM (and OTM) call/put portfolios, estimates the latent common-factor structure using PCA and factor-number/residual-factor tests, and then translates those latent factors into a parsimonious tradable model by searching across candidate long–short strategies to select the four-factor benchmark {EWOP,HV–IV,Cash,VOV}, interpreting the core tables and figures on shared vs contract-specific option-return factors and their in-/out-of-sample pricing performance."

- title: "Keys and Wang (JFE, 2019) — Minimum payments and debt paydown in consumer credit cards"
  file: "Keys_Wang_JFE_2019.pdf"
  desc: "This note summarizes the paper, which uses CFPB credit-card account data and issuer-level minimum-payment formula changes as quasi-experiments, estimates event-study difference-in-differences models with account and month fixed effects (binary exposure and dollar-intensity specifications) to track how payments shift relative to the new minimum, maps these distributional responses into lower bounds on anchoring versus upper bounds on liquidity constraints using a simple conceptual framework, and interprets the core tables and figures on minimum payments as a salient behavioral anchor for debt paydown."

- title: "Bombardini, Li, and Trebbi (AER, 2023) — Did US Politicians Expect the China Shock?"
  file: "Bombardini_Li_Trebbi_AER_2023.pdf"
  desc: "This note summarizes the paper, which models repeated 1990–2001 House votes on renewing China’s NTR as a forward-looking probit choice that depends on legislators’ expected future district China-import shock, estimates preference and information parameters under alternative information sets using probit MLE (when the information set is specified) and moment-inequality inference (when it is only partially observed), constructs past and future district exposure via an industry-level shift-share China-shock measure aggregated from commuting zones, and uses heterogeneity tests and counterfactual simulations (perfect information vs stronger constituent sensitivity) to assess whether politicians anticipated the China shock and how much they weighted it relative to ideology."

- title: "Bennett, Bettis, Gopalan, and Milbourn (JFE, 2017) — Compensation goals and firm performance"
  file: "Bennett_Bettis_Gopalan_Milbourn_JFE_2017.pdf"
  desc: "This note summarizes the paper, which uses Incentive Lab executive-contract disclosures matched to Compustat to test for “just-beat-the-goal” bunching in Actual−Goal at zero via McCrary density discontinuity, Bollen–Pool-style across-density tests, bootstrap/bin-based regressions, and then examines mechanisms through target-ratcheting and forced-turnover regressions plus earnings-management/real-actions tests (abnormal accruals and R&D/SG&A cuts)."

- title: "Bretscher, Schmid, Sen, and Sharma (RFS, 2026) — Institutional Corporate Bond Pricing"
  file: "Bretscher_Schmid_Sen_Sharma_RFS_2026.pdf"
  desc: "This note summarizes the paper, which builds and estimates a demand-based equilibrium corporate bond pricing model using institutional holdings and bond prices, specifies a nested-logit demand system within and across rating groups (IG vs HY) identified via a mandate-based sequential IV strategy, imposes market clearing to back out equilibrium spreads, and uses the estimated elasticities to quantify price impact/fragility and counterfactual spread effects of ownership shifts, downgrades, and fund outflows."

- title: "Landais (AEJEP, 2015) — Assessing the Welfare Effects of Unemployment Benefits Using the Regression Kink
Design"
  file: "Landais_AEJEP_2015.pdf"
  desc: "This note summarizes the paper, which uses kinked U.S. unemployment-insurance schedules (weekly benefit level and potential duration) to implement a local-polynomial Regression Kink Design on administrative UI data, combines the RKD estimates with a dynamic search model (Proposition 1) to correct for state dependence and separately identify liquidity vs moral-hazard (Frisch) effects from level-versus-duration changes, and interprets the key density/covariate smoothness validity checks plus the core tables and figures on duration elasticities and welfare implications."

- title: "Cengiz, Dube, Lindner, and Zipperer (QJE, 2019) — The Effect of Minimum Wages on Low-Wage Jobs"
  file: "Cengiz_Dube_Lindner_Zipperer_QJE_2019.pdf"
  desc: "This note summarizes the paper, which uses CPS MORG employment–wage data (benchmarked to QCEW) to estimate a stacked event-study difference-in-differences in state×quarter×wage-bin cells around 138 state minimum-wage hikes, decomposes the wage-distribution response into “missing” jobs below the new floor and “excess” jobs at/above it (plus spillover and elasticity calculations, event-by-event heterogeneity, and TWFE diagnostic comparisons), and interprets all core tables and figures on reallocation within the low-wage distribution with near-zero net employment effects."

- title: "Heider and Ljungqvist (JFE, 2015) — As certain as debt and taxes: Estimating the tax sensitivity of leverage from state tax changes"
  file: "Heider_Ljungqvist_JFE_2015.pdf"
  desc: "This note summarizes the paper, which exploits staggered U.S. state corporate income tax changes as quasi-exogenous shocks, estimates first-difference diff-in-diff and event-study (leads/lags) regressions with industry-year fixed effects, strengthens identification with neighbor-state falsifications and cross-border county-pair designs, extends exposure measurement for multi-state firms using employee/sales weights and headquarters-history corrections, and interprets the core tables and figures documenting asymmetric leverage responses (tax hikes raise long-term leverage while tax cuts do not) consistent with dynamic tradeoff “ratcheting.”"

- title: "Bennedsen, Nielsen, Perez-Gonzalez, and Wolfenzon (QJE, 2007) — Inside the Family Firm: The Role of Families in Succession Decisions and Performance"
  file: "Bennedsen_Nielsen_Perez-Gonzalez_Wolfenzon_QJE_2007.pdf"
  desc: "This note summarizes the paper, which links Danish registry data on firms and family relations to a CEO-turnover event design (pre/post profitability changes), estimates baseline OLS and an instrumental-variables (2SLS) strategy that instruments family-CEO appointments with the departing CEO’s firstborn-child gender (with balance, first-stage, and reduced-form validation plus alternative male-child and CEO-death instruments), and interprets all core tables and figures on the causal performance effects of family succession."

- title: "Baghai, Silva, and Ye (RFS, 2024) — Teams and Bankruptcy"
  file: "Baghai_Silva_Ye_RFS_2024.pdf"
  desc: "This note summarizes the paper, which links inventor–firm–year patent data to staggered corporate bankruptcies (1980–2015) and estimates inventor fixed-effects DiD and event-study regressions of patent quantity/quality around filing, identifies team-specific human-capital losses by interacting post-bankruptcy exposure with a pre-bankruptcy team-dependence measure, and tests mechanisms with team-stability (“remain together”) outcomes plus pair-level joint-mobility and bankruptcy-resolution/noncompete-enforceability heterogeneity specifications while interpreting the core tables and figures."

- title: "Crane, Michenaud, and Weston (RFS, 2016) — The Effect of Institutional Ownership on Payout Policy: Evidence from Index Thresholds"
  file: "Crane_Michenaud_Weston_RFS_2016.pdf"
  desc: "This note summarizes the paper, which exploits the annual Russell 1000/2000 reconstitution as a quasi-experiment, estimates a sharp regression discontinuity at the market-cap rank cutoff as a first stage for institutional ownership and then a 2SLS/RD-IV second stage for payout policy (dividends, repurchases, total payout), supplements the design with governance-engagement RD regressions and agency-proxy heterogeneity tests (plus bandwidth/float-adjustment/banding robustness), and interprets the core tables and figures linking index-induced institutional ownership to higher payouts via monitoring/agency channels."

- title: "Leary & Roberts (JF, 2014) — Do Peer Firms Affect Corporate Financial Policy?"
  file: "Leary_Roberts_JF_2014.pdf"
  desc: "This note summarizes the paper, which estimates contemporaneous peer effects in firms’ leverage and financing by instrumenting peer-average financial policies with peers’ lagged idiosyncratic equity-return shocks (constructed from rolling factor-model residuals), running reduced-form and 2SLS peer-effects regressions with industry/year fixed effects plus correlated-effects falsifications (customer–supplier and placebo tests), and quantifying amplification/spillovers and leader–follower heterogeneity."

- title: "Brandt, Kambourov, and Storesletten (RES, 2026) — Barriers to Entry and Regional Economic Growth in China"
  file: "Brandt_Kambourov_Storesletten_RES_2026.pdf"
  desc: "This note summarizes the paper, which documents rapid prefecture-level convergence in China’s non-state manufacturing using the Chinese Industry Census, builds an analytically tractable Hopenhayn-style entry-and-selection model with output/capital wedges plus an explicit licensing-based entry barrier, inverts the model to impute prefecture entry barriers from wages (using firm-level wedge measures and migration-based N/M), validates the barrier measure with World Bank “Doing Business” data and cohort/firm-age mechanism evidence, decomposes convergence and aggregate growth via model-based counterfactual accounting, and then links barriers causally to the SOE sector using cross-sectional IVs and a Bartik design around the 1997 SOE reform."

- title: "Kremens, Martin, and Varela (JF, 2025)— Long-Horizon Exchange Rate Expectations"
  file: "Kremens_Martin_Varela_JF_2025.pdf"
  desc: "This note summarizes the paper, which uses professional FX surveys to construct long-horizon expected appreciation and expected excess returns (SCA/SXR), estimates panel forecasting regressions that augment UIP (RCA/RXR on SXR and IRD with currency/time fixed effects), benchmarks surveys against predictors like the quanto-implied risk premium (QRP), real exchange rate, VIX, and CA/GDP using in-sample and Goyal–Welch out-of-sample R2 tests, “explains” expectations by projecting surveys on these state variables and testing for any residual “secret sauce,” and studies horizon dependence via annualization and forward-expectation decompositions while interpreting the results through risk-based vs variance-constrained intermediary models and the core tables/figures."

- title: "Gompers, Kaplan, and Mukharlyamov (JFE, 2016)— What do private equity firms say they do?"
  file: "Gompers_Kaplan_Mukharlyamov_JFE_2016.pdf"
  desc: "This note summarizes the paper, which uses a detailed survey of private equity investors to document how PE firms say they evaluate deals, choose leverage, govern portfolio companies, and create operational value, then applies descriptive cross-tab comparisons and empirical classification tools (k-means clustering and factor analysis) to map heterogeneous “PE styles” and relate them to founder backgrounds while interpreting the core tables and figures."

- title: "Chen, Chen, He, Liu, and Xie (JF, 2023)— Pledgeability and Asset Prices: Evidence from the Chinese Corporate Bond Markets"
  file: "Chen_Chen_He_Liu_Xie_JF_2023.pdf"
  desc: "This note summarizes the paper, which models corporate bond prices as fundamental value + λ × pledgeability (via repo haircuts), exploits dual-listed enterprise bonds trading in segmented exchange vs interbank markets to net out fundamentals, uses the Dec 8, 2014 exchange-only repo-eligibility shock for AA+/AA bonds to run event-study DiD and 2SLS (IV) estimates of the pledgeability premium from cross-market yield wedges (with an exchange-only matched-AAA upper-bound design and arbitrage-bound logic), and interprets the core tables and figures quantifying how a haircut jump (0→100) raises yields by roughly 39–85 bps."

- title: "Eaton, Green, Roseman, and Wu (JFE, 2026)— Retail option traders and the implied volatility surface"
  file: "Eaton_Green_Roseman_Wu_JFE_2026.pdf"
  desc: "This note summarizes the paper, which uses OPRA option-trade data (with a Nasdaq “small customer” proxy as a robustness check) to construct chain-weighted Black–Scholes implied-volatility surfaces and net retail demand pressure, and identifies the causal impact of retail participation via a difference-in-differences design around retail brokerage outages (outage windows vs the same time-of-day in the prior five trading days; high-retail-interest stocks vs low-retail controls), estimating 15-minute panel regressions and event-time plots across moneyness/maturity/call-put slices to show that removing retail demand lowers IV where retail is normally a net buyer (short-dated OTM calls) and raises IV where retail is normally a net writer (long maturity), flattening the smile, term structure, and call–put wedge."

- title: "Masta (JF, 2010)— Capital Structure as a Strategic Variable: Evidence from Collective Bargaining"
  file: "Matsa_JF_2010.pdf"
  desc: "This note summarizes the paper, which models debt as a commitment device in union wage bargaining (generalized Nash bargaining under no-refinancing/non-pledgeability), derives the key prediction that leverage (especially near-term debt) rises with union power × profit volatility, and tests it using Rajan–Zingales-style cross-sectional leverage regressions plus state labor-law quasi-experiments (RTW adoption and WSP repeal) in DiD/event-time specifications and complementary inventory-policy evidence, interpreting the core tables and figures."

- title: "Biais, Hombert, and Weill(AER, 2021)— Incentive Constrained Risk Sharing, Segmentation, and Asset Pricing"
  file: "Biais_Hombert_Weill_AER_2021.pdf"
  desc: "This note summarizes the paper, which builds a finite-horizon asset-pricing model with one-step Arrow securities and a rich menu of trees under limited commitment/imperfect pledgeability, derives equilibrium no-arbitrage bounds, existence, and private valuation operators with incentive wedges, characterizes endogenous asset-holding segmentation as an assignment/optimal-transport (power-diagram) partition of payoff space, and develops pricing implications—one-directional (negative) bases versus long-only replication and concave expected-return relations in factor loadings—illustrated with parametric examples and Figures 1–4."

- title: "Ammann, Cochardt, Cohen and Heller (JFE, 2026)— Hidden alpha"
  file: "Ammann_Cochardt_Cohen_Heller_JFE_2026.pdf"
  desc: "This note summarizes the paper, which constructs a large-scale mutual-fund-manager–firm-officer social network from Facebook (matched to Morningstar and BoardEx) and a key “friendship visibility” state (FullyHidden vs visible), then documents “hidden alpha” using holdings-weight tilting regressions, calendar-time connected–nonconnected long–short portfolios with four-factor and DGTW-adjusted alphas, falsification via connected-not-held portfolios, trade-based buy–sell timing tests, daily news-event return decompositions, and Fama–MacBeth cross-sectional predictability regressions, interpreting the core tables and figures throughout."

- title: "Giroud and Mueller (JFE, 2010)— Does corporate governance matter in competitive industries?"
  file: "Giroud_Mueller_JFE_2010.pdf"
  desc: "This note summarizes the paper, which uses the staggered passage of state business combination (BC) laws as an anti-takeover governance shock, estimates firm-year panel DiD regressions with firm and year fixed effects and a BC×HHI (industry concentration) interaction (plus alternative competition measures and robustness/pre-trend checks), complements the analysis with incorporation-state portfolio market-model event studies and takeover-hazard/mechanism tests, and interprets the core tables and figures showing that product-market competition substitutes for external governance (via a “quiet life” cost channel in concentrated industries)."

- title: "van Binsbergen (JFE, 2026)— Duration-based stock valuation: Reassessing stock market performance and volatility"
  file: "van_Binsbergen_JFE_2026.pdf"
  desc: "This note summarizes the paper, which redefines the equity premium using a duration-matched benchmark by valuing equity as a portfolio of dividend strips, constructing strip-weighted constant-maturity and strip-replicating zero-coupon bond counterfactuals from yield curves (with Gordon-growth and dividend-futures-implied weighting schemes), and evaluating U.S. and international evidence via return/volatility term-structure comparisons and a variance decomposition that separates dividend-risk premia from term premia, while interpreting the core tables and figures."

- title: "Bollen and Pool (JF, 2009)— Do Hedge Fund Managers Misreport Returns? Evidence from the Pooled Distribution"
  file: "Bollen_Pool_JF_2009.pdf"
  desc: "This note summarizes the paper, which tests for hedge-fund return misreporting by detecting a zero-return “kink” in the pooled monthly return distribution using histogram/KDE-based discontinuity tests (bin-by-bin Z-statistics with smoothed-bootstrap confidence bands), links the incentive to avoid small losses via flow–performance regressions, corroborates manipulation with reversal and out-of-sample deterioration tests using a fund-level kink measure, rules out alternative explanations with audit-window, fitted-return, and liquidity/smoothing (MA(2)) robustness checks, and quantifies investor wealth transfers from inflated NAVs while interpreting the core tables and figures."

- title: "Stavrakeva and Tang (JF, 2026)— The Dollar during the Great Recession: The Information Channel of U.S. Monetary Policy and the “Flight to Safety”"
  file: "Stavrakeva_Tang_JF_2026.pdf"
  desc: "This note summarizes the paper, which identifies high-frequency U.S. monetary policy surprises from one-hour changes in ED4 Eurodollar futures around FOMC (and QE) announcements, estimates local-projection impulse responses and panel interaction/event-study specifications across pre-/Great-Recession/post subsamples (and separates forward guidance vs LSAP using Swanson factors), decomposes FX and equity responses into expected-rate-path versus residual (risk-premium/inflation or dividend-growth) components, and rationalizes the Great-Recession medium-horizon sign reversal (easing ⇒ USD appreciation and equities fall, strongest against bad-hedge currencies and after minutes) with a parsimonious information-channel asset-pricing model while interpreting the core tables and figures."

- title: "Jiménez, Kuvshinov, Peydró, and Richter(JF, 2026)— Monetary Policy, Inflation, and Crises: Evidence from History and Administrative Data"
  file: "Jime_nez_Kuvshinov_Peydro__Richter_JF_2026.pdf"
  desc: "This note summarizes the paper, which shows (in a 17-country, 150+ year historical panel) that systemic banking crises are disproportionately preceded by a U-shaped policy-rate path (prolonged cuts then hikes), identifies this path dependence using crisis-window event studies and crisis-risk linear-probability models with a cuts × subsequent hikes interaction (and a trilemma-based IV), links the mechanism to “financial red zones” via local projections of post-hike reversals, and supports the channel with Spanish administrative bank–firm data on credit supply, debt costs, and loan-default responses, interpreting the core tables and figures throughout."

- title: "Blanchard, Bown, and Johnson (RES, 2026)— Global Value Chains and Trade Policy"
  file: "Blanchard_Bown_Johnson_RES_2026.pdf"
  desc: "This note summarizes the paper, which develops a value-added (GVC-as-factor-services) theory of optimal bilateral tariffs and tariff preferences—showing how domestic value added embodied in partners’ exports (DVA) and foreign value added embodied in domestic production (FVA) weaken protection—extends it to a many-country political-economy setting, tests the predictions using WIOD value-added content (1995–2015) in OLS/Tobit regressions of applied–MFN tariffs and temporary trade barrier coverage with differentiation heterogeneity, and then calibrates a quantitative Roy–Fréchet input-sourcing model to run counterfactuals such as GVC autarky and G7–China upstream decoupling while interpreting the core tables and figures."

- title: "Beck, Levine, and Levkov (JF, 2010)— Big Bad Banks? The Winners and Losers from Bank Deregulation in the United States"
  file: "Beck_Levine_Levkov_JF_2010.pdf"
  desc: "This note summarizes the paper, which exploits the staggered timing of U.S. intrastate branch deregulation as a quasi-experiment, estimates state-year DiD and event-study specifications with state/year fixed effects (and a Weibull duration test for deregulation timing), traces distributional effects via income-percentile regressions and Theil decompositions, and tests a labor-demand mechanism using relative wage/hours and unemployment dynamics, interpreting the core tables and figures on deregulation’s inequality-reducing impact."

- title: "DellaVigna and Kaplan (QJE, 2007) — The Fox News Effect: Media Bias and Voting"
  file: "DellaVigna_Kaplan_QJE_2007.pdf"
  desc: "This note summarizes the paper, which exploits the staggered 1996–2000 rollout of Fox News across local cable systems as quasi-random variation, estimates town-level difference-in-differences regressions of 2000–1996 Republican vote-share (and turnout/Senate outcomes) changes on Fox carriage with rich cable and demographic controls plus district/county fixed effects, validates identification with selection and placebo pre-trend tests and matching/robustness checks, and then combines the reduced-form voting effect with Scarborough audience “first-stage” regressions to infer persuasion rates while interpreting the core tables and figures."

- title: "Chang, Wang, and Xiong (RFS 2026) — Price and Volume Divergence in China’s Real Estate Markets: The Role of Local Governments"
  file: "Chang_Wang_Xiong_RFS_2026.pdf"
  desc: "This note summarizes the paper, which documents China’s 2020–2022 land and new-housing price–volume divergence and attributes it to local-government price management, using transaction-level and city-year panel regressions plus dynamic DID/event-study designs that interact pre-COVID (2019) fiscal exposures (land dependence and LGFV debt) with year dummies, complemented by mechanism tests on LGFV countercyclical buying and bidding, housing-permit supply restrictions, and bond-spread/developer-sales analyses, while interpreting all core tables and figures."

- title: "Klingler & Lando (RFS, 2018)— Safe Haven CDS Premiums"
  file: "Klingler_Lando_RFS_2018.pdf"
  desc: "This note summarizes the paper, which develops a one-period equilibrium model in which Basel III CVA capital relief makes dealer demand for sovereign CDS highly inelastic (despite near-zero default risk), derives closed-form equilibrium CDS premia under margin/capital constraints and summarizes regulation via a reduced-form kappa(s), and then tests the mechanism using DTCC/EBA quantity evidence and sovereign/corporate panel regressions (CDS volumes on derivatives exposures; changes in yields on changes in CDS and risk-free rates across safety buckets; and changes in CDS on credit-risk versus regulatory proxies such as CDS/IR volatility, CtD, and dealer balance-sheet measures), interpreting the core tables and figures on the safe-haven CDS premium and the CDS–bond yield disconnect."

- title: "Cunat, Gine, and Guadalupe (JF, 2012) — The Vote Is Cast: The Effect of Corporate
Governance on Shareholder Value"
  file: "Cunat_Gine_Guadalupe_JF_2012.pdf"
  desc: "This note summarizes the paper, which exploits close-call shareholder votes on governance proposals to implement a regression discontinuity design at the majority threshold. It combines Carhart-factor abnormal-return event studies with polynomial and dynamic (stacked) RD specifications—estimated at the meeting level—and supports identification with density/manipulation tests, covariate-balance checks, and extensive robustness and heterogeneity analyses. The note interprets the core tables and figures on the causal value of governance reforms and their longer-run effects on entrenchment (G-index), acquisitions, investment, and firm valuation."

- title: "Almeida, Ersahin, Fos, Irani, and Kronlund (RFS, 2026) — How Do Short-Term Incentives Affect Long-Term Productivity?"
  file: "Almeida_Ersahin_Fos_Irani_Kronlund_RFS_2026.pdf"
  desc: "This note summarizes the paper by linking U.S. Census plant-level manufacturing data to Compustat/CRSP/IBES, constructing a counterfactual “pre-repurchase” EPS surprise as the running variable, estimating a fuzzy regression discontinuity around the zero-surprise threshold to identify the causal effects of EPS-motivated buyback incentives on subsequent firm/plant TFP and resource allocation (investment and employment), and interpreting the core tables and figures on mechanisms via labor/financial frictions, investor horizon, CEO EPS-pay sensitivity, and adjustment costs."

- title: "Malenko & Shen (RFS, 2016) — The Role of Proxy Advisory Firms: Evidence from a Regression-Discontinuity Design"
  file: "Malenko_Shen_RFS_2016.pdf"
  desc: "This note summarizes the paper by exploiting ISS’s explicit TSR cutoff for say-on-pay votes to implement a fuzzy regression discontinuity / 2SLS design (BelowCutoff as an instrument for a negative ISS recommendation), running RD validity checks (McCrary density, covariate balance, placebo/falsification), heterogeneity and bandwidth/functional-form robustness, and interpreting the core tables and figures on the causal effect of proxy-advisor recommendations on voting support."

- title: "Pierce & Schott (AER: Insights, 2020) — Trade Liberalization and Mortality: Evidence from US Counties"
  file: "Pierce_and_Schott_AER_Insights_2020.pdf"
  desc: "This note summarizes the paper by constructing county exposure to China’s PNTR using a 1990 employment–share shift-share NTR-gap measure, estimating population-weighted county-by-year generalized DiD/event-study regressions with county and year fixed effects plus rich controls/heterogeneity/robustness checks, and interpreting the core figures on post-2000 increases in drug-overdose “deaths of despair” and related labor-market and disability mechanisms."

- title: "Chen, Chen, Kang, and Peng (JFE, 2020) — Board structure, director expertise, and advisory role of outside directors"
  file: "Chen_Chen_Kang_Peng_JFE_2020.pdf"
  desc: "This note summarizes the paper by framing PNTR as an exogenous demand shock for China expertise, presenting the DiD and IV designs for board composition (including Smoot–Hawley and non-U.S. import-penetration instruments), the event-study/OLS–2SLS tests linking China-experience directors to China-deal and appointment CARs, the director labor-market seat-growth analysis, and the residence-based monitoring–advisory trade-off, while interpreting all core tables and figures."

- title: "Lian and Ma (QJE 2025)— Anatomy of Corporate Borrowing Constraints"
  file: "Lian_Ma_QJE_2021.pdf"
  desc: "This note summarizes the paper by decomposing corporate debt into asset-based versus cash-flow-based components, estimating firm- and year-fixed-effects panel regressions linking borrowing and investment to operating earnings and covenant tightness, leveraging the SFAS 123(r) accounting change as an IV for EBITDA, testing collateral-value channels using real-estate shocks (including a Great Recession cross-section), and interpreting the core tables, figures, and macro implications for earnings-based versus collateral constraints."

- title: "Card and Krueger (AER, 1994) — Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania"
  file: "Card_Krueger_AER_1994.pdf"
  desc: "This note summarizes the paper by using the 1992 New Jersey minimum-wage increase (vs. eastern Pennsylvania) as a quasi-experiment, estimating raw and regression-adjusted DiD/first-difference models with a continuous treatment-intensity measure (the initial wage gap) plus proportional-change and robustness/placebo specifications, and interpreting the core tables and figures on employment, wages, prices, and store-entry outcomes in fast-food restaurants."

- title: "Khorrami & Mendo (WP, 2025)— Dynamic Self-Fulfilling Fire Sales"
  file: "Khorrami_and_Mendo_WP_2025.pdf"
  desc: "This note summarizes the paper by developing a continuous-time macro–finance model with hedgeable fundamental risk but unspanned sunspot shocks, characterizing fundamental versus self-fulfilling fire-sale equilibria (Brownian and Poisson) via Markov pricing ODEs, risk-balance conditions, and refinement/selection arguments, and interpreting the main and appendix figures on capital prices, endogenous volatility, wealth-share dynamics, and misallocation."

- title: "Dougal, Engelberg, Garcia, Parsons (RFS, 2012) — Journalists and the Stock Market"
  file: "Dougal_Engelberg_Garcia_Parsons_RFS_2012.pdf"
  desc: "This note summarizes the paper by leveraging the quasi-exogenous rotation of Wall Street Journal 'Abreast of the Market' columnists, estimating daily DJIA excess-return regressions with journalist indicators/fixed effects (plus interaction, falsification, and robustness specifications), validating identification with schedule-prediction LPM/IV-style tests and text-based tone/readability measures, and interpreting the core tables and figures."

- title: "Vandeweyer, Yang, Yannelis (JFE, 2026)— Discount factors and monetary policy: Evidence from dual-listed stocks"
  file: "Vandeweyer_Yang_Yannelis_JFE_2026.pdf"
  desc: "This note summarizes the paper by using dual-listed A- and H-share price ratios to difference out cash-flow news and isolate relative discount-factor changes, estimating an event-study difference-in-differences design around FOMC (Kuttner-style) monetary policy surprises with firm/announcement/event-time fixed effects, heterogeneity (triple-difference) tests and stacked-DiD robustness, and interpreting the core tables and figures."

- title: "Hong & Kacperczyk (QJE, 2010) — Competition and Bias"
  file: "Hong_Kacperczyk_QJE_2010.pdf"
  desc: "This note summarizes the paper by laying out the brokerage-house merger natural experiment, the baseline OLS and difference-in-differences designs (including benchmark-adjusted DID via matching and fixed-effects regressions), and interpreting the core tables and figures on how analyst competition shapes forecast optimism and incentives."

- title: "Sammon & Shim (JFE, 2026) — Index rebalancing and stock market composition: Do indexes time the market?"
  file: "Sammon_and_Shim_JFE_2026.pdf"
  desc: "This note distills the paper’s ownership-ratio framework for value-weighted index rebalancing and its evidence that rebalancing trades entail adverse market timing—implying a tracking-error/return trade-off and motivating delayed shares-outstanding updates in index design."

- title: "Paravisini, Rappoport, Schnabl and Wolfenzon (RES, 2014) — Dissecting the Effect of Credit Supply on Trade: Evidence from Matched Credit–Export Data"
  file: "Paravisini_Rappoport_Schnabl_Wolfenzon_RES_2014.pdf"
  desc: "This note distills the paper by summarizing the matched bank–firm credit and customs data, the shift-share IV design based on banks’ foreign-funding exposure, and the finding that negative credit-supply shocks primarily reduce exports on the intensive margin rather than through firm entry/exit."

- title: "Hennessy & Whited (JF, 2007) — How Costly Is External Financing? Evidence from a Structural Estimation"
  file: "Hennessy_Whited_JF_2007.pdf"
  desc: "This note distills a dynamic corporate finance model and its simulated method of moments (SMM) estimation to quantify the structural costs of external financing—especially equity issuance and default frictions—and interpret the main empirical results and financing-constraint proxies."

- title: "Wermers (JF, 2000) — Mutual Fund Performance: An Empirical Decomposition into Stock-Picking Talent, Style, Transactions Costs, and Expenses"
  file: "Wermers_JF_2000.pdf"
  desc: "This note file distills Russ Wermers’s 2000 mutual-fund paper into a holdings-based performance decomposition that separates stock-picking skill from style exposures, transaction costs, and expenses."

- title: "Ghosh, Vall and Zeng (JF, 2025) — FinTech Lending and Cashless Payments"
  file: "Ghosh_Vall_Zeng_JF_2025.pdf"
  desc: "This note file summarizes the paper’s core question, data and variable construction, empirical identification (OLS/within-borrower/IV), main results across figures and tables, and the accompanying screening model linking cashless payment traces to FinTech lending outcomes."

- title: "Dick-Nielsen, Feldh¨utter, and Lando (WP, 2025) — The Financial Premium"
  file: "Dick_Nielsen_Feldhu_tter_Lando_ForthcomingJF.pdf"
  desc: "This note distills the paper by showing that financial firms’ corporate bonds trade at systematically higher yield spreads than matched industrial bonds because financial intermediaries’ diversified asset portfolios load more on priced systematic risk (higher excess debt betas), a mechanism strongly supported by premium–beta evidence and extensive robustness checks."

- title: "Caramp & Silva (JF, 2026) — Monetary Policy and Wealth Effects: The Role of Risk and Heterogeneity"
  file: "Caramp_Silva_JF_2026.pdf"
  desc: "This file provides structured notes on a D-HANK/New Keynesian model in which monetary policy moves asset prices by shifting the market-implied disaster probability through belief heterogeneity and redistribution across households with different iMPCs, with the aggregate wealth effect ultimately pinned down by fiscal backing and government debt."

- title: "Carpenter, Lu and Whitelaw (JFE, 2026) — Government Bond Risk and Return in the US and China"
  file: "Carpenter_Lu_Whitelaw_JFE_2026.pdf"
  desc: "This note file distills the paper into structured study notes that (i) present the key theory and GMM estimation framework for decomposing government-bond risk premia into time-varying volatility and Sharpe ratios and (ii) interpret the main tables and figures for the US and China."

- title: "Adelino, Schoar and Severino (JFE, 2025) — Credit supply and house prices: Evidence from mortgage market segmentation"
  file: "Adelino_Schoar_Severino_JFE_2025.pdf"
  desc: "This file summarizes the paper by explaining how annual increases in the conforming loan limit—interacting with the 80% LTV rule—create a local difference-in-differences design to identify how easier, cheaper mortgage credit is capitalized into house prices."

- title: "Bertrand and Schoar (QJE, 2003) — The Effect of Managers on Firm
Policies"
  file: "Bertrand_Schoar_QJE_2003.pdf"
  desc: "This file shows, using manager–firm matched data and manager fixed effects, that individual executives have persistent “management styles” that systematically shape firms’ investment, financing, strategy, and performance beyond firm and year effects."

- title: "Roberts & Sufi (JF, 2009) — Control Rights and Capital Structure: An Empirical Investigation"
  file: "Roberts_Sufi_JF_2009.pdf"
  desc: "This file summarizes the paper’s mechanism, emphasizing their pooled threshold-discontinuity design around covenant violations and the central result that net debt issuance drops sharply and persistently after violations, consistent with creditor intervention."

- title: "Kilic & Tuzel (JFE, 2026) — Investing in Misallocation"
  file: "Kilic_Tuzel_JFE_2026_StudyNotes.pdf"
  desc: "This file summarizes the paper’s core mechanism and provides a structured walkthrough of its reduced-form regressions, structural model equations, and detailed interpretations of every table and figure."

- title: "He & Song (RFS, 2026) — Agency MBS as Safe Assets"
  file: "He_Song_RFS_2026.pdf"
  desc: "This file summarizes the paper’s core mechanism and provides a structured walkthrough of its reduced-form regressions, structural model equations, and detailed interpretations of every table and figure."

- title: "Korteweg (JF, 2010) — The Net Benefits to Leverage"
  file: "Korteweg_JF_2010.pdf"
  desc: "This file summarizes the paper’s core mechanism and provides a structured walkthrough of its reduced-form regressions, structural model equations, and detailed interpretations of every table and figure."

- title: "Keys, Mukherjee, Seru & Vig (QJE, 2010) — Did Securitization Lead to Lax Screening?"
  file: "Keys_Mukherjee_Seru_and_Vig_QJE_2010.pdf"
  desc: "This file distills the RD identification around the FICO=620 securitization cutoff, clarifies the hard- vs. soft-information screening mechanism, and walks through the key equations and interpretation of the main tables and figures."

- title: "Dunne, Klimek, Roberts & Xu (RAND J Econ, 2013) — Entry, Exit, and the Determinants of Market Structure"
  file: "Dunne__Klimek__Roberts__and_Xu__RAND_J__Econ___2013_.pdf"
  desc: "This file summarizes the dynamic entry–exit framework (Pakes–Olley–Bresnahan style), the profit estimation and structural cost components, and the interpretation of the key tables/figures and counterfactuals."
