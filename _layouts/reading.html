<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: "Reading" }}</title>
<style>
:root{
  --ink: #111827;
  --muted: rgba(17,24,39,.72);
  --max: 980px;
}
body{
  margin:0;
  background:#fff;
  color:var(--ink);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}
a{ color:#1d4ed8; text-decoration:none; }
a:hover{ text-decoration:underline; }

.container{ max-width: var(--max); margin:0 auto; padding: 0 18px; }

.topbar{
  padding: 18px 0 14px 0;
  border-bottom: 1px solid rgba(0,0,0,.08);
}
.toprow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.brand{
  font-weight: 900;
  letter-spacing: .04em;
  text-transform: uppercase;
  font-size: 13px;
  opacity: .85;
}
.nav{
  display:flex;
  gap: 14px;
  flex-wrap:wrap;
  opacity:.85;
  font-size: 13px;
}
.nav a{
  padding: 8px 10px;
  border: 1px solid rgba(0,0,0,.12);
  border-radius: 10px;
  background: #fff;
}
.nav a:hover{ transform: translateY(-1px); text-decoration:none; }

main{ padding: 22px 0 70px 0; }
main h1, main h2, main h3{
  font-family: Georgia, "Times New Roman", serif;
  color: #0f3d2e;
}
main p{ color: var(--muted); line-height: 1.78; }
</style>
</head>

<body>
  <header class="topbar">
    <div class="container toprow">
      <div class="brand">Reading Notes</div>
      <nav class="nav" aria-label="Reading navigation">
        <a href="{{ site.baseurl }}/">Study Cycles</a>
        <a href="{{ site.baseurl }}/updates/">Updates</a>
        <a href="{{ site.baseurl }}/variables-live/">Variables (Live)</a></nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>
</body>
</html>
